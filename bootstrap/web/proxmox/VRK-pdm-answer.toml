# Projekt Pakhus (github.com/knightmare2600/pakhus) answer file -- Proxmox Datacenter
# Manager, VRK/Edinburgh. Fetched by menu.ipxe v2.18's :pakhus entry as
# ${boot-url}/proxmox/${site-prefix}-pdm-answer.toml. Added 2026-10-25, modelled on
# VRK-answer.toml (Klargoring's PVE file) -- same keyboard/country/timezone, root password
# hash and root SSH key; only the fqdn placeholder and the comments differ. The "-pdm-" infix
# follows Saekkevogn's "-pbs-" one; confirmed by Robert on 2026-10-25.
[global]
keyboard = "en-gb"
country = "gb"
# Installer placeholder, the PDM counterpart of the PVE files' "pve-install". Nothing keys
# off it programmatically (checked 2026-10-25); the real name (production: EXADCMCLD001, see
# docs/proxmox/proxmox-dcm-pbs-planning.md) is set afterwards, not here.
fqdn = "pdm-install.jukebox.internal"
mailto = "root@jukebox.internal"
timezone = "Europe/London"
root-password-hashed = "$6$AHl84jrZ7PWHZKfM$q4POMoxXoRb6M6Up2uKDnzJjr4EntVfPI4/KndRu.Z45lwuZoGrxkW2o5EAAC0O8Vyr9qGClpIL/TdYjRWURk/"
# Same key as VRK-answer.toml and bootstrap/web/ansible_sshkey.pub -- keep all of them in
# sync if it's ever rotated (at_have_ryggen_fri/check_ssh_keys.py checks this file too).
root-ssh-keys = [
  "ssh-rsa  ansible@exaanscld001.example.com"
]

[network]
source = "from-dhcp"

# The standard build: a 2-disk ZFS mirror. Correction 2026-10-25: like the PVE files, there
# is now a single-disk VRK-pdm-degraded.toml too (pakhus 7949a0f, menu.ipxe v2.20), which
# the installer fetches instead when fewer than 2 disks are present. sda/sdb is carried over
# from VRK-answer.toml as a presumption -- unverified for whatever PDM host this ends up installing.
[disk-setup]
filesystem = "zfs"
zfs.raid = "raid1"
disk-list = ["sda", "sdb"]

# Static, per-site URL -- see VRK-answer.toml's [first-boot] comment for why each site has
# its own file. Reuses the shared first-boot.sh rather than forking it: its work (sshd, the
# ansible user, its SSH key, NOPASSWD sudoers) is not PVE-specific. See
# bootstrap/web/proxmox/FRD-pdm-answer.toml for Fredericia Havn's equivalent.
[first-boot]
source = "from-url"
ordering = "fully-up"
url = "http://192.168.139.50/proxmox/first-boot.sh"
