[global]
keyboard = "en-gb"
country = "gb"
fqdn = "pve-install.jukebox.internal"
mailto = "root@jukebox.internal"
timezone = "Europe/London"
root-password-hashed = "$6$AHl84jrZ7PWHZKfM$q4POMoxXoRb6M6Up2uKDnzJjr4EntVfPI4/KndRu.Z45lwuZoGrxkW2o5EAAC0O8Vyr9qGClpIL/TdYjRWURk/"
# Added 2026-07-10: earliest possible foot-in-the-door -- root is SSH-reachable by key the
# moment install finishes, before first-boot.sh has even run. This does NOT replace
# first-boot.sh's ansible-user creation (Ansible's whole estate connects as `ansible`, not
# root -- see ansible.cfg's remote_user); this is purely an earlier/recovery path. Same key
# served at bootstrap/web/ansible_sshkey.pub -- keep both in sync if it's ever rotated.
root-ssh-keys = [
  " ansible@exaanscld001.example.com"
]

[network]
source = "from-dhcp"

[disk-setup]
filesystem = "zfs"
zfs.raid = "raid1"
disk-list = ["sda", "sdb"]

# NOTE (2026-07-08): this url is a static TOML value -- it cannot do the gateway-based boot-server
# detection menu.ipxe/late_command.sh/first-boot.sh itself all use, since TOML has no conditionals.
# This file is always fetched from the right server already (menu.ipxe/boot.ipxe request it via
# ${boot-url}), but the URL *inside* it is fixed at Edinburgh (192.168.139.50). If a Proxmox install
# is ever done from the Fredericia Havn provisioning server (172.16.124.1:8000) instead, this one
# line needs a manually-maintained override on that server's own copy of this file.
[first-boot]
source = "from-url"
ordering = "fully-up"
url = "http://192.168.139.50/proxmox/first-boot.sh"
