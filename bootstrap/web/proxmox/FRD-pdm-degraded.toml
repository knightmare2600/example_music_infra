# FRD-pdm-degraded.toml -- Proxmox Datacenter Manager DEGRADED (single-disk, NOT
# production ready) answer file for Projekt Pakhus. The PDM counterpart of FRD-degraded.toml,
# and related to FRD-pdm-answer.toml exactly as FRD-degraded.toml is to FRD-answer.toml:
# identical except zfs.raid = "raid0" and disk-list = ["sda"]. Added 2026-10-25, generated
# from FRD-pdm-answer.toml, so the root password hash and SSH key stay byte-identical
# (at_have_ryggen_fri/check_ssh_keys.py checks this file too).
#
# Chosen the same way select-pve-answer.sh chooses for PVE: menu.ipxe's :pakhus passes this
# file as toml_url_degraded= alongside toml_url=; the installer counts whole disks
# (/sys/block, skipping loop/ram/sr/fd/dm-) and fetches this one when fewer than 2 exist.
[global]
keyboard = "en-gb"
country = "gb"
# Installer placeholder, the PDM counterpart of the PVE files' "pve-install". Nothing keys
# off it programmatically (checked 2026-10-25); the real name (production: EXADCMCLD001, see
# docs/proxmox/proxmox-dcm-pbs-planning.md) is set afterwards, not here.
fqdn = "pdm-install.jukebox.internal"
mailto = "root@jukebox.internal"
timezone = "Europe/London"
root-password-hashed = "$6$AHl84jrZ7PWHZKfM$q4POMoxXoRb6M6Up2uKDnzJjr4EntVfPI4/KndRu.Z45lwuZoGrxkW2o5EAAC0O8Vyr9qGClpIL/TdYjRWURk/"
# Same key as FRD-answer.toml and bootstrap/web/ansible_sshkey.pub -- keep all of them in
# sync if it's ever rotated (at_have_ryggen_fri/check_ssh_keys.py checks this file too).
root-ssh-keys = [
  "ssh-rsa  ansible@exaanscld001.example.com"
]

[network]
source = "from-dhcp"

# The degraded build: single disk, NOT production ready -- zfs.raid = "raid0" on one disk,
# exactly as FRD-degraded.toml is to FRD-answer.toml.
[disk-setup]
filesystem = "zfs"
zfs.raid = "raid0"
disk-list = ["sda"]

# Static, per-site URL -- see FRD-answer.toml's [first-boot] comment for why each site has
# its own file. Reuses the shared first-boot.sh rather than forking it: its work (sshd, the
# ansible user, its SSH key, NOPASSWD sudoers) is not PVE-specific. See
# bootstrap/web/proxmox/VRK-pdm-degraded.toml for Edinburgh's equivalent.
[first-boot]
source = "from-url"
ordering = "fully-up"
url = "http://172.16.124.1:8000/proxmox/first-boot.sh"
