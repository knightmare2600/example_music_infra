# ==============================================================================
# bootstrap/asset_manifest.yml
# Example Music Limited — Fetch-on-demand manifest for bootstrap/web/ boot
# assets that have a real upstream, instead of vendoring them into git
# ==============================================================================
# PENDING REMOVAL, 2026-07-27: bootstrap/asset_manifest.json is now the
# canonical copy (confirmed byte-for-byte identical assets[]/archives[] via
# a real deep-compare, not just eyeballed) -- JSON parses natively in bash
# (jq) and PowerShell (ConvertFrom-Json), this doesn't. Kept alongside the
# JSON copy ONLY until ansible/playbooks/bootstrap_assets/fetch-assets.yml
# (the sole remaining consumer of THIS file) is retired in favour of the 3
# native platform scripts replacing it. Edit the JSON copy, not this one --
# this one is frozen, dead weight walking. See project memory
# (project_workstation_setup_scripts.md) for the retirement plan.
# ==============================================================================
# Consumed by ansible/playbooks/bootstrap_assets/fetch-assets.yml. Every path
# below is relative to bootstrap/web/. Nothing in here is auto-run by the
# harness (at_have_ryggen_fri/check_bootstrap_assets.py stays read-only,
# offline) -- fetching is always an explicit, separate ansible-playbook run.
#
# Assets with NO real upstream (Robert's own custom build: Arch's airootfs)
# are deliberately NOT here -- that's a git-lfs candidate, not a fetch
# candidate. See docs (TODO once written) / this repo's memory for the full
# audit.
#
# The WinPE .wim is deliberately NOT here and NEVER goes in this repo at
# all, LFS or otherwise -- Robert confirmed 2026-07-27 this repo cannot
# redistribute it (Microsoft ADK licensing). wimboot (the loader that
# streams it, github.com/ipxe/wimboot) IS fetched below -- it's GPL2, no
# Microsoft code in it, unaffected. See .gitignore's matching hard exclusion.
#
# rockylinux/ is also NOT here for now -- Robert deleted his local copy
# 2026-07-27, revisiting later.
#
# source_type: github_release
#   Queries the GitHub Releases API fresh every run and uses the API's own
#   per-asset `digest` field for checksum verification -- nothing hardcoded
#   here to go stale. `tag: latest` always takes whatever's newest; a literal
#   tag (e.g. "v2.9.0") pins to that exact release.
#
# source_type: url_with_checksum_file
#   Fetches checksum_file_url as text, finds the line containing
#   checksum_file_entry, and regex-extracts a 64-hex-char SHA256 substring
#   from it -- format-agnostic on purpose, so it doesn't matter whether the
#   upstream checksum file uses GNU style ("<hash>  <path>", Debian's
#   SHA256SUMS) or BSD style ("SHA256 (<file>) = <hash>", OpenBSD's SHA256).
#
# source_type: archive_extract (see the separate `archives:` section below)
#   One download serves multiple destination files -- grouped separately so
#   the playbook fetches the archive once, not once per member.
# ==============================================================================
# Changelog:
#   2026-07-27  Initial file. Every URL/tag/path below was verified live
#               (WebFetch against the real endpoint) during planning, not
#               assumed -- see this session's chat log / memory for the
#               research trail. Two real findings from that verification:
#               OpenBSD 7.5 (menu.ipxe's old hardcoded version) no longer
#               exists on the live mirror at all -- bumped to 7.9 here and
#               in menu.ipxe itself, Robert's explicit call. GParted Live
#               has never published an arm64 build -- gparted/arm64/* has
#               no fetch source and isn't in this manifest; menu.ipxe's
#               gparted-arm64 path can't be satisfied from upstream, ever.
# ==============================================================================

assets:
  # -- Spejder (Robert's own repo: github.com/knightmare2600/Spejder) --------
  - dest: spejder/x86_64/linux-x86_64
    source_type: github_release
    repo: knightmare2600/Spejder
    tag: latest
    asset_name: linux-x86_64

  - dest: spejder/arm64/linux-arm64
    source_type: github_release
    repo: knightmare2600/Spejder
    tag: latest
    asset_name: linux-arm64

  - dest: spejder/x86_64/initramfs-x86_64.cpio.zst
    source_type: github_release
    repo: knightmare2600/Spejder
    tag: latest
    asset_name: initramfs-x86_64.cpio.zst

  - dest: spejder/arm64/initramfs-arm64.cpio.zst
    source_type: github_release
    repo: knightmare2600/Spejder
    tag: latest
    asset_name: initramfs-arm64.cpio.zst

  # -- klargoring (Robert's own repo: github.com/knightmare2600/klargoring) --
  - dest: proxmox/klargoring/vmlinuz
    source_type: github_release
    repo: knightmare2600/klargoring
    tag: latest
    asset_name: vmlinuz

  - dest: proxmox/klargoring/installer-initrd.img
    source_type: github_release
    repo: knightmare2600/klargoring
    tag: latest
    asset_name: installer-initrd.img

  # -- wimboot (real upstream: github.com/ipxe/wimboot) ----------------------
  # Pinned to v2.9.0, not "latest" -- this is a third-party dependency, not
  # Robert's own repo; menu.ipxe's own comment already recommends this exact
  # version, so pin to it deliberately rather than floating.
  - dest: winpe/x86_64/wimboot
    source_type: github_release
    repo: ipxe/wimboot
    tag: v2.9.0
    asset_name: wimboot

  - dest: winpe/x86_64/wimboot.i386
    source_type: github_release
    repo: ipxe/wimboot
    tag: v2.9.0
    asset_name: wimboot.i386

  - dest: winpe/arm64/wimboot.arm64
    source_type: github_release
    repo: ipxe/wimboot
    tag: v2.9.0
    asset_name: wimboot.arm64

  # -- Debian (real upstream: ftp.debian.org) ---------------------------------
  - dest: debian/x86_64/linux
    source_type: url_with_checksum_file
    url: https://ftp.debian.org/debian/dists/stable/main/installer-amd64/current/images/netboot/debian-installer/amd64/linux
    checksum_file_url: https://ftp.debian.org/debian/dists/stable/main/installer-amd64/current/images/SHA256SUMS
    checksum_file_entry: ./netboot/debian-installer/amd64/linux

  - dest: debian/x86_64/initrd.gz
    source_type: url_with_checksum_file
    url: https://ftp.debian.org/debian/dists/stable/main/installer-amd64/current/images/netboot/debian-installer/amd64/initrd.gz
    checksum_file_url: https://ftp.debian.org/debian/dists/stable/main/installer-amd64/current/images/SHA256SUMS
    checksum_file_entry: ./netboot/debian-installer/amd64/initrd.gz

  - dest: debian/arm64/linux
    source_type: url_with_checksum_file
    url: https://ftp.debian.org/debian/dists/stable/main/installer-arm64/current/images/netboot/debian-installer/arm64/linux
    checksum_file_url: https://ftp.debian.org/debian/dists/stable/main/installer-arm64/current/images/SHA256SUMS
    checksum_file_entry: ./netboot/debian-installer/arm64/linux

  - dest: debian/arm64/initrd.gz
    source_type: url_with_checksum_file
    url: https://ftp.debian.org/debian/dists/stable/main/installer-arm64/current/images/netboot/debian-installer/arm64/initrd.gz
    checksum_file_url: https://ftp.debian.org/debian/dists/stable/main/installer-arm64/current/images/SHA256SUMS
    checksum_file_entry: ./netboot/debian-installer/arm64/initrd.gz

  # -- OpenBSD (real upstream: cdn.openbsd.org) -------------------------------
  # 7.9, not menu.ipxe's old 7.5 -- 7.5 no longer exists on the live mirror
  # at all (verified 2026-07-27), Robert's explicit call to bump rather than
  # chase the archive mirror.
  - dest: openbsd/7.9/x86_64/bsd.rd
    source_type: url_with_checksum_file
    url: https://cdn.openbsd.org/pub/OpenBSD/7.9/amd64/bsd.rd
    checksum_file_url: https://cdn.openbsd.org/pub/OpenBSD/7.9/amd64/SHA256
    checksum_file_entry: bsd.rd

  - dest: openbsd/7.9/arm64/bsd.rd
    source_type: url_with_checksum_file
    url: https://cdn.openbsd.org/pub/OpenBSD/7.9/arm64/bsd.rd
    checksum_file_url: https://cdn.openbsd.org/pub/OpenBSD/7.9/arm64/SHA256
    checksum_file_entry: bsd.rd

# -- GParted Live (real upstream: SourceForge) --------------------------------
# x86_64 only -- GParted Live has never published an arm64 build (verified
# 2026-07-27). One archive serves three destination files; downloaded once,
# not once per member. archive_member paths confirmed for real 2026-07-27
# (live run, actual 647MB zip, `file` on each extracted member: genuine
# SquashFS/cpio/bzImage) -- gparted.org's own livepxe.php documentation was
# right first time.
archives:
  - url: https://sourceforge.net/projects/gparted/files/gparted-live-stable/1.8.1-3/gparted-live-1.8.1-3-amd64.zip/download
    members:
      - archive_path: live/vmlinuz
        dest: gparted/x86_64/vmlinuz
      - archive_path: live/initrd.img
        dest: gparted/x86_64/initrd.img
      - archive_path: live/filesystem.squashfs
        dest: gparted/x86_64/filesystem.squashfs
