# =============================================================================
# .gitleaks.toml
# Example Music Limited — gitleaks config
# =============================================================================
# FIXED 2026-10-29: this file previously had NO `[extend] useDefault = true`
# and NO `[[rules]]` of its own, which meant gitleaks' entire built-in
# detection ruleset was disabled every time this config was used -- the
# scan was running with ZERO active rules, since of 2026-08-04 when this file
# and at_have_ryggen_fri/check_gitleaks.py were built. Confirmed directly: a
# planted AKIA-style AWS key was NOT detected against this file as it stood,
# and WAS detected once `useDefault = true` was added. check_gitleaks.py had
# been reporting "no secrets found" the entire time regardless of real repo
# content. A real scan with the fix applied found 11 historical findings,
# all confirmed false positives (AWS's own public example credentials,
# WireGuard public keys -- not secret by design, license-header text, a
# TrueNAS OpenAPI spec's own documentation example, and the one deliberately
# fake SSH key this repo already knows about) -- see .gitleaksignore for the
# per-finding detail on each.
#
# Also found and fixed the same day: this file's own former `[[allowlists]]`
# block (`paths`/`regexes`, global top-level) does NOT suppress findings
# against this gitleaks build -- confirmed directly via isolated tests (a
# trivial custom rule + an exact-matching `paths` entry still fired). Rather
# than ship an allowlist mechanism I can't prove works, every known-safe
# finding is now excluded via `.gitleaksignore` (per-finding fingerprint),
# which DOES work, confirmed the same way. If a future gitleaks upgrade
# changes this, re-verify before trusting `[[allowlists]]`/`[allowlist]`
# again -- don't assume either syntax works without testing it directly
# against this installed binary first.
#
# See at_have_ryggen_fri/check_gitleaks.py (section 33) for how this gets
# used, and docs/gitleaks_guide.md for the general gitleaks how-to.
# =============================================================================

[extend]
useDefault = true
