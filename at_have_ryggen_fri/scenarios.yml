---
# scenarios.yml -- part of at_have_ryggen_fri.
#
# The four bare-metal-to-working-estate scenarios discussed 2026-07-10:
#   1. Bare metal -> Proxmox node -> Ansible control node
#   2. PXE-install Debian -> DNS server (EXADNSVRK001)
#   3. Build the firewall (EXAFWLVRK001/EXAFWLCLD001)
#   4. Windows Server 2022 Core via unattend XML -> OpenSSH -> Ansible reachable
#
# Each scenario lists the files that must exist for someone to actually
# follow it, plus a small number of content assertions for things that
# are easy to silently regress (a doc losing its warning about a known
# gotcha, a script losing its self-identifying header). This is
# deliberately not exhaustive fact-checking -- that's what facts.yml is
# for. This is closer to "is the paper trail for this scenario still
# intact," checked by check_scenarios.py.
#
# Known, accepted gaps (not failures, don't add assertions expecting
# these to be fixed until they actually are):
#   - Scenario 4's per-edition unattend XML files (autounattend_2022core.xml
#     etc, referenced by several buildsheets) don't exist yet -- only
#     headlessunattend.xml, the one real, generic file, does. Deferred
#     pending real files being supplied.
#   - Scenario 1 has no real scripted iLO/DRAC/Redfish procedure -- manual
#     virtual-media mounting is the actual, current, accepted method.

scenarios:
  - name: pve_and_ansible_node
    description: >
      Bare metal (iLO/DRAC virtual media) -> Proxmox VE node -> Ansible
      control node (git clone + symlink via ansibleme.sh).
    requires_files:
      - bootstrap/web/proxmox/VRK-answer.toml
      - bootstrap/web/proxmox/VRK-degraded.toml
      - bootstrap/web/proxmox/FRD-answer.toml
      - bootstrap/web/proxmox/FRD-degraded.toml
      - bootstrap/web/proxmox/first-boot.sh
      - bootstrap/web/proxmox/create-vm.py
      - bootstrap/web/provision/ansibleme.sh
      - bootstrap/serve.py
      - bootstrap/Start-ProxmoxAnswerShim.ps1
      - bootstrap/web/proxmox/select-pve-answer.sh
      - ansible/playbooks/proxmox/bootstrap-new-node.yml
      - ansible/tasks/onboarded_check.yml
      - ansible/tasks/ssh_key_preflight.yml
      - docs/buildsheets/buildsheet-pve.md
      - docs/proxmox/Procedure-PVE-Node-Onboarding.md
      - docs/proxmox/pve-create-vm.md
      - docs/proxmox/pxe-proxmox-autoinstall-build-log.md
    content_assertions:
      - file: bootstrap/serve.py
        must_contain: "do_POST"
        why: "This script's entire reason to exist is answering Proxmox's automated-installer answer-file fetch, which arrives as a POST -- losing the do_POST alias silently regresses it back to a plain http.server that 501s on that fetch, the exact gap it was written to close."
      - file: bootstrap/Start-ProxmoxAnswerShim.ps1
        must_contain: "HttpListener"
        why: "The Windows-side equivalent of serve.py's fix, for a box running static-web-server.exe instead of python3 -m http.server -- SWS can't be given the same one-line do_POST treatment, so this narrow HttpListener shim exists instead. Losing this file silently would leave a static-web-server.exe-based provisioning box with no working automated fetch and no documented alternative to the manual wget path."
      - file: docs/bootstrap/bootstrapping.md
        must_contain: "proxmox-fetch-from-url"
        why: "The doc must keep explaining WHY the automatic fetch 'fails' (POST, not GET) rather than just documenting the manual wget workaround as if it were the only option -- otherwise a future reader has no way to know serve.py/Start-ProxmoxAnswerShim.ps1 exist specifically to remove that workaround."
      - file: bootstrap/web/provision/ansibleme.sh
        must_contain: "git clone"
        why: "ansibleme.sh must still clone the repo itself -- it's the break-glass path with no other way to get the repo onto a fresh control node."
      - file: ansible/playbooks/proxmox/bootstrap-new-node.yml
        must_contain: "Abort if already onboarded (override with -e bootstrap_force=true)"
        why: "This playbook renames the live host and rewrites its own networking, dropping the current SSH session on purpose -- the already-onboarded guard is what stops it being re-run by accident against a node that's already gone through site.yml. Losing this check silently would make a routine mistake destructive. (Guard itself moved 2026-07-12 from an /etc/sudoers.d/ansible check -- which first-boot.sh's own sliver writes on every fresh node, defeating the whole point -- to tasks/onboarded_check.yml reading /etc/example-music/nodeinfo.json instead.)"
      - file: ansible/tasks/onboarded_check.yml
        must_contain: "nodeinfo.json"
        why: "The shared onboarded-detection task both 00-preflight.yml and bootstrap-new-node.yml rely on -- if this file goes missing or stops checking nodeinfo.json, both callers silently break in different ways (one skips safety stages it shouldn't, the other loses its abort guard entirely)."
      - file: ansible/playbooks/proxmox/bootstrap-new-node.yml
        must_contain: "tasks/ssh_key_preflight.yml"
        why: "This is the exact playbook that failed UNREACHABLE against EXAPVEGOT001 (2026-07-12) when the configured private key went missing on the control node, with the real cause hidden behind exa_pretty's terse summary. Losing this leading preflight play silently would bring that failure mode straight back -- a showstopper by Robert's explicit ask, not a warning."
      - file: ansible/tasks/ssh_key_preflight.yml
        must_contain: "showstopper"
        why: "Robert's own words: 'no kill like overkill ;) and I'm serious' -- this must fail hard, not just warn, if the configured key is missing or doesn't actually work. If this task file stops being fatal, a broken keypair goes back to being discovered as an obscure UNREACHABLE."
      - file: bootstrap/web/provision/ansibleme.sh
        must_contain: 'ln -s "${REPO_DIR}/ansible" "${ANSIBLE_DIR}"'
        why: "The clone-then-symlink mechanism a trainee relies on to make /home/ansible/ansible resolve."
      - file: bootstrap/web/proxmox/first-boot.sh
        must_contain: "playbooks/proxmox/bootstrap-new-node.yml"
        why: "first-boot.sh no longer sets a real hostname/static IP itself (removed 2026-07-07) -- the on-screen instruction telling the operator to run bootstrap-new-node.yml next is the only place that's explained. If this line goes silently, a fresh PVE node build has no documented next step at all."
      - file: docs/proxmox/Procedure-PVE-Node-Onboarding.md
        must_contain: "Circular-dependency warning"
        why: "This procedure presupposes a working Ansible control node -- the doc must keep explaining why that isn't actually circular for every case except bootstrapping the very first control node."
      - file: bootstrap/web/menu.ipxe
        must_contain: "Proxmox VE is not built via PXE"
        why: "Corrected 2026-07-18: a BMC-mounted-ISO + PXE-delivered-vmlinuz/initrd.img approach was built, and confirmed live to fail outright (blank cursor). PVE is now built entirely outside PXE (plain ISO via iLO/BMC + select-pve-answer.sh at the installer's own root shell) -- this stub is the only thing stopping a future editor from reintroducing PXE-based Proxmox logic that's already been tried and confirmed not to work."
      - file: bootstrap/web/proxmox/select-pve-answer.sh
        must_contain: "/run/automatic-installer-answers"
        why: "This is the one file whose entire job is getting the right answer file to the exact path Proxmox's automated installer actually reads from -- if this path drifts from what the installer expects, the script silently stops working while still reporting success."
      - file: docs/proxmox/pxe-proxmox-autoinstall-build-log.md
        must_contain: "BMC virtual media is the sole delivery method"
        why: "Historical record of the BMC/PXE approach that was tried, confirmed working in pieces, and then failed its first real end-to-end test -- kept as-is (not deleted) with a later dated entry recording the failure and the pivot to select-pve-answer.sh, so a future reader can see why that approach was abandoned rather than being tempted to retry it from scratch."

  - name: dns_bootstrap
    description: >
      PXE-install Debian -> EXADNSVRK001 (BIND9), via the bindme.sh
      break-glass path (Ansible doesn't exist yet to do this the normal way).
    requires_files:
      - bootstrap/web/provision/bindme.sh
      - ansible/playbooks/bind9/bind9-dns.yml
      - docs/inventory/EXADNSVRK001-dns.md
    content_assertions:
      - file: bootstrap/web/provision/bindme.sh
        must_contain: "BREAK-GLASS TOOL"
        why: "bindme.sh's whole reason to exist is that it predates Ansible -- losing this framing would invite someone to 'clean it up' into an Ansible dependency it can't have."
      - file: docs/bootstrap/bootstrapping.md
        must_contain: "EXADNSVRK001"
        why: "The estate topology diagram must include the DNS host -- it was silently missing until 2026-07-10."

  - name: firewall_build
    description: >
      PXE-install Debian -> EXAFWLVRK001/EXAFWLCLD001 (firewallme.sh break-glass,
      then the Ansible firewallme role for ongoing management).
    requires_files:
      - bootstrap/web/provision/firewallme.sh
      - docs/buildsheets/buildsheet-firewall.md
      - ansible/playbooks/firewallme/README.md
      - ansible/playbooks/firewallme/playbooks/90-firewall.yml
    content_assertions:
      - file: bootstrap/web/provision/firewallme.sh
        must_contain: "BREAK-GLASS TOOL"
        why: "Same reasoning as bindme.sh above."
      - file: ansible/README.md
        must_contain: "Appendix A"
        why: "The WAN-SSH onboarding gotcha (network stage kills the connection) must stay documented -- it's a real, easy-to-hit footgun, not a hypothetical."

  - name: windows_unattend
    description: >
      Windows Server 2022 ISO + unattend XML -> Server Core with OpenSSH ->
      Ansible reachable via SSH from the very first run.
    requires_files:
      - bootstrap/web/windows/unattend/headlessunattend.xml
      - ansible/configs/inventory/group_vars/windows_nodes/connection.yml
    content_assertions:
      - file: bootstrap/web/windows/unattend/headlessunattend.xml
        must_contain: "OpenSSH.Server"
        why: "This is the whole point of the scenario -- if the unattend XML stops installing OpenSSH, Ansible has no way to reach a fresh Windows Core box at all."
      - file: bootstrap/web/windows/unattend/headlessunattend.xml
        must_contain: "sc start sshd"
        why: "Installing the capability isn't enough -- the service has to actually be started for SSH to be reachable on first boot."
