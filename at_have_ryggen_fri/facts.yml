---
# facts.yml -- part of at_have_ryggen_fri.
#
# A hand-curated list of specific facts (an IP, a hostname) that are
# restated as prose across multiple docs/scripts, rather than read from a
# single structured source at runtime. These can't be checked generically
# the way check_generated_freshness.py checks generate_inventory.py's
# outputs, or check_references.py checks a template: path -- there's no
# single function to re-run and diff. Instead: name the fact, name where
# it's correctly asserted, and check_facts.py confirms each file still
# says what it's supposed to.
#
# This deliberately does NOT try to be exhaustive -- it grows as drift is
# found and fixed, starting with the facts that were actually found wrong
# during the 2026-07-10 bootstrap-scenario research (see conversation).
# A missing entry here doesn't mean a file has no facts worth checking; it
# means nobody has registered one yet.
#
# Each fact:
#   name         short identifier
#   description  what the fact is, in plain English
#   value        the correct, current value
#   source       where the value is authoritative (a real source-of-truth
#                file, not another prose restatement)
#   asserted_in  files that should contain `value` verbatim. A file listed
#                here that does NOT contain it is reported as drifted --
#                this includes the two docs already known to be stale
#                (buildsheet-firewall.md, bootstrap/bootstrapping.md) and
#                the wrong-hostname doc (EXADNSVRK001-dns.md) -- reporting
#                them is the point, not a bug in this list.

facts:
  - name: fwl_wan_ip
    description: "EXAFWLVRK001's WAN/vRACK-facing static IP (same physical box as EXAFWLCLD001)"
    value: "192.168.139.69"
    source: "benarbejde/devices.csv (VRK,FWL,1,69)"
    asserted_in:
      - ansible/README.md
      - bootstrap/web/provision/firewallme.sh
      - ansible/playbooks/firewallme/roles/firewall/tasks/00_preflight_3_ask.yml
      - docs/ExampleMusic_Beginners_Guide.md
      - docs/ExampleMusic_Procedure_Template.md
      - docs/buildsheets/buildsheet-firewall.md
      - docs/bootstrap/bootstrapping.md

  - name: frd_pbx_hostname
    description: >-
      Fredericia Havn's secondary 3CX PBX is EXAPBXCLD002, not EXAPBXFRD001 -- as of the
      2026-07-11 CLD/FRD Pulsant-vRACK network rework, devices physically at FRD Havn are
      hostnamed under CLD (SubnetSite override in devices.csv, resolved by
      generate_inventory.py's find_device()/render_device_line()) while keeping their real IP
      on FRD's own 172.16.124.0/24 subnet. FRD's provisioning server (172.16.124.1) was
      deliberately NOT moved under CLD -- it's woven into FRD-specific lookups (menu.ipxe/
      late_command.sh gateway detection, begyndelse.json's provisioning_fredericia_havn) that a
      rename would have broken; only the PBX (a plain lookup("FRD", "PBX") with no such
      coupling) moved. As of 2026-07-21 this is moot for renaming purposes anyway -- the
      provisioning server (Type=TMP, formerly PRV) deliberately has no formal
      EXA<ROLE><SITE><NNN> hostname at all any more, VRK's included -- see provisioning_server_ip
      below.
    value: "EXAPBXCLD002"
    source: "benarbejde/devices.csv (CLD,PBX,2,48,...,FRD), generate_inventory.py's SubnetSite handling"
    asserted_in:
      - docs/network-inventory.md
      - docs/ExampleMusic_Beginners_Guide.md

  - name: single_join_domain
    description: >-
      Every host joins one domain, jukebox.internal (from benarbejde/ad_forest.json) -- there
      is no per-site or per-domain join target. example.com/example.net/example.org are UPN
      suffixes and internal DNS alias zones only, never AD join targets. Found wrong 2026-07-11
      as a real, hardcoded example.org/example.net "win_domain" in ansible/README.md's LIV
      onboarding walkthrough and the windows_bootstrap host_vars TEMPLATE (both dead vars --
      80-domainjoin.yml already computes the real OU from exa_domain + host_site + role and
      never reads win_domain/win_ou_path at all), plus a fabricated "subnet_site_map ...
      domain: example.org" claim in the same README section that doesn't exist anywhere in
      the codebase. Confirmed with Robert. Join-DomainAndBootstrap.ps1 still lists the
      example.* names as selectable join targets in its $AllowedDomains -- that's a documented
      HISTORICAL ARTEFACT (see the script's own header) deliberately not kept in sync, not a
      live inconsistency.
    value: "single forest domain"
    source: "benarbejde/ad_forest.json (domain_fqdn), ansible/playbooks/windows_bootstrap/playbooks/80-domainjoin.yml"
    asserted_in:
      - ansible/README.md
      - ansible/configs/inventory/host_vars/TEMPLATE/windows.yml

  - name: rudder_top_of_tree_site
    description: >-
      CLD, not FAL, is the Rudder relay-exempt "top of the tree" site -- Rudder root already
      lives at CLD (EXARUDCLD001, 192.168.69.12) and CLD is where the 2026-07-11 network rework
      is centring the estate (CLD001-numbered devices in the Pulsant DC, CLD002+ in FRD Havn).
      FAL was hardcoded as the no-relay site before this change; it now behaves like ODE/BRK
      (a relay-map entry, empty/unset by default, falling through to direct-to-root until a
      FAL relay actually exists).
    value: "site_code != 'CLD'"
    source: "ansible/playbooks/rudder/rudder_onboard.yml (v1.1.0, 2026-07-11)"
    asserted_in:
      - ansible/playbooks/rudder/rudder_onboard.yml
      - docs/management/rudder-setup.md

  - name: dns_hostname
    description: "The estate's BIND9 DNS server hostname -- site VRK, not CLD"
    value: "EXADNSVRK001"
    source: "benarbejde/begyndelse.json (dns.hostname), benarbejde/sites.csv (VRK row)"
    asserted_in:
      - ansible/playbooks/bind9/bind9-dns.yml
      - docs/inventory/EXADNSVRK001-dns.md
      - docs/bootstrap/bootstrapping.md

  - name: ansible_control_node
    description: "The estate's Ansible control node hostname and IP"
    value: "EXAANSCLD001"
    source: "benarbejde/begyndelse.json (ansible_control.hostname), benarbejde/sites.csv (CLD row)"
    asserted_in:
      - bootstrap/web/provision/ansibleme.sh
      - docs/inventory/EXADNSVRK001-dns.md
      - docs/buildsheets/buildsheet-firewall.md
      - docs/inventory/network-inventory-merged.md

  - name: rudder_server_hostname
    description: >-
      The real Rudder configuration-management server hostname is EXARUDCLD001
      (Site=CLD, Role=RDR, 192.168.69.12) -- found wrong as EXASRVFAL002/
      EXASVRCLD003/EXASVRCLD004/EXASVRCLD003 (four different wrong forms) across
      rudder-setup.md, buildsheet-rudder.md, and network-inventory-merged.md,
      2026-07-11.
    value: "EXARUDCLD001"
    source: "benarbejde/devices.csv (CLD,RDR,1,12), ansible/configs/inventory/rudder.ini"
    asserted_in:
      - docs/management/rudder-setup.md
      - docs/buildsheets/buildsheet-rudder.md
      - docs/inventory/network-inventory-merged.md

  - name: create_vm_script_path
    description: "Where create-vm.py actually lives"
    value: "bootstrap/web/proxmox/create-vm.py"
    source: "the file itself"
    asserted_in:
      - docs/proxmox/pve-create-vm.md

  - name: pve_answer_toml_filename
    description: >-
      The real files are VRK-answer.toml/FRD-answer.toml (site-prefixed, one per
      provisioning server -- see bootstrap/web/menu.ipxe's site-prefix detection), not a
      bare answer.toml. Originally this fact just guarded singular "answer.toml" against a
      2026-07-10 "answers.toml" typo; superseded 2026-07-11 when the file was split per
      site (single source of truth: bootstrap/web/proxmox/VRK-answer.toml). A bare
      "answer.toml" substring match would no longer catch a doc reverting to the old,
      pre-split behaviour, so this now checks for the real VRK- prefixed filename instead.
    value: "VRK-answer.toml"
    source: "bootstrap/web/proxmox/VRK-answer.toml (the file itself)"
    asserted_in:
      - docs/buildsheets/buildsheet-pve.md
      - docs/bootstrap/bootstrapping.md

  - name: frd_boot_server
    description: >-
      Fredericia Havn's provisioning-server address -- every doc that gives an operator
      192.168.139.50 (Edinburgh) as a literal fetch/scp/curl target must also note this
      alternate, per Robert's 2026-07-11 request ("it also could be on the 172 IP in FRD").
      Files that only list the device in an inventory/architecture table (network-inventory.md,
      site-inventory.md, network-diagram.md, EXADNSVRK001-dns.md, network-inventory-merged.md,
      buildsheet-rudder.md) are deliberately excluded -- FRD is a different physical device, not
      a second IP for Edinburgh's own provisioning server, so it doesn't belong in a table
      describing that specific device. ExampleMusic_UPN_DNS_dnsmasq_Procedure.md is also
      excluded -- provisioning.* DNS A/PTR records don't exist for either provisioning server
      (2026-07-21: Edinburgh's own A/PTR record, previously the only one of the two, was
      removed too -- neither is DNS-registered any more, not just FRD).
      ExampleMusic_Beginners_Guide.md already has its own full §4.2 explanation, not just a
      cross-reference, so isn't in this list either.
    value: "172.16.124.1:8000"
    source: "bootstrap/web/proxmox/first-boot.sh (BOOT_SERVER gateway detection) / docs/bootstrap/bootstrapping.md §4.1a"
    asserted_in:
      - docs/buildsheets/buildsheet-pve.md
      - docs/buildsheets/buildsheet-firewall.md
      - docs/management/rudder-setup.md
      - docs/proxmox/pve-networking.md
      - docs/bootstrap/ipxe-build.md
      - docs/bootstrap/ExampleMusic_ExaRescue_ARM64_Build_Procedure.md
      - docs/bootstrap/ExampleMusic_Procedure_iPXE_ARM64_ISO.md
      - docs/proxmox/virtio-driver-disk.md
      - docs/proxmox/zfs-raid0-to-raid1.md
      - docs/lab/rac-emulator.md
      - docs/active-directory/corporate-livery.md

  - name: provisioning_server_ip
    description: >-
      Edinburgh's provisioning server is referenced by IP only, 192.168.139.50 -- it has no
      formal EXA<ROLE><SITE><NNN> hostname or DNS record (Type=TMP in devices.csv, formerly
      PRV; renamed 2026-07-21, Robert: these are bootstrap-only helpers, not real managed
      nodes, so they shouldn't carry the same formal identity every real node gets).
      Superseded a now-retired "provisioning_server_hostname" fact from 2026-07-11 (which
      asserted a hostname, EXAPRVVRK001, that found its way wrong as EXAPROVCLD001/
      EXAPRVSCOTCLD001 in a few docs that day) -- that whole premise (a formal hostname
      existing at all) is gone now, not just the specific string checked.
    value: "192.168.139.50"
    source: "benarbejde/devices.csv (VRK,TMP,1,50), benarbejde/begyndelse.json (provisioning_edinburgh.ip)"
    asserted_in:
      - docs/bootstrap/ExampleMusic_ExaRescue_ARM64_Build_Procedure.md
      - docs/active-directory/ExampleMusic_UPN_DNS_dnsmasq_Procedure.md
      - docs/bootstrap/ExampleMusic_Procedure_iPXE_ARM64_ISO.md

  - name: site_code_aberdeen
    description: >-
      Aberdeen's real site code is ABD, not ABR -- found wrong (with matching
      EXADCSABR001 hostname) in ad-dc-wireguard-deployment.md and
      v2v-scenario-walkthroughs.md's "known site codes" example transcript, 2026-07-11.
    value: "ABD"
    source: "benarbejde/sites.csv (ABD,Aberdeen,...)"
    asserted_in:
      - docs/active-directory/ad-dc-wireguard-deployment.md
      - docs/proxmox/v2v-scenario-walkthroughs.md

  - name: site_code_atlanta
    description: >-
      Octet 33 (192.168.33.0/24) belongs to ATL (Atlanta) in sites.csv -- found as the
      fictional/removed code GAA ("Georgia AL") in 3 docs, 2026-07-11. GAA appears nowhere
      in sites.csv; ATL is the real, current site at that octet.
    value: "ATL"
    source: "benarbejde/sites.csv (ATL,Atlanta,...,192.168.33.0/24)"
    asserted_in:
      - docs/active-directory/ad-dc-wireguard-deployment.md
      - docs/proxmox/v2v-scenario-walkthroughs.md
      - docs/proxmox/pve-networking.md

  - name: fwl_octet_role
    description: >-
      The firewall lives at .253 (primary) / .254 (secondary) within a site's /24, NOT .1 --
      found backwards in the shared "Standard IP Convention" legend table in THREE files
      simultaneously, 2026-07-12 (site-inventory.md, network-inventory.md, and the diverged
      duplicate network-inventory-merged.md all said .1 was the firewall and .253 was a
      generic "secondary gateway"). The per-site checklist rows in site-inventory.md had
      already been fixed for this exact confusion earlier the same day -- this shared legend
      table was a second, separate copy of the same mistake, not caught by that first pass.
      Robert: "make that something the harness checks now, because the documentation is
      growing markedly and a lot of this is either old, legacy stuff, or mistakes." All three
      files' legend rows normalised to identical wording so this one fact value catches all
      three at once.
    value: "Firewall — primary"
    source: "benarbejde/address_policy.csv (Type=FWL rows, octets 253/254)"
    asserted_in:
      - docs/site-inventory.md
      - docs/network-inventory.md
      - docs/inventory/network-inventory-merged.md

  - name: rtr_octet_role
    description: >-
      The router (RTR) lives at .1 within a site's /24 -- a different device from the
      firewall (see fwl_octet_role above). Same 2026-07-12 find/fix.
    value: "Router / upstream gateway"
    source: "benarbejde/address_policy.csv (Type=RTR row, octet 1)"
    asserted_in:
      - docs/site-inventory.md
      - docs/network-inventory.md
      - docs/inventory/network-inventory-merged.md
