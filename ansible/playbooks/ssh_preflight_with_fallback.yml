---
# =============================================================================
# playbooks/ssh_preflight_with_fallback.yml
# Example Music Limited — SSH key preflight, with a password-fallback recovery path
# =============================================================================
# Extracted 2026-07-26 from linux/tools.yml's "SSH preflight" play (built
# 2026-07-16, no functional change here) -- wiring the same recovery flow
# into firewallme/playbooks/90-firewall.yml (a real live failure, EXAFWLAMS001,
# key rejected) was the second caller that made duplicating this worthwhile
# to avoid instead. Import this BEFORE any play that needs a real SSH/become
# connection to succeed:
#
#   - import_playbook: ../ssh_preflight_with_fallback.yml   # from playbooks/<module>/
#   - import_playbook: ../../ssh_preflight_with_fallback.yml  # from playbooks/<module>/playbooks/
#
# hosts: "{{ target | default('all') }}" -- matches firewallme's own established
# -e target=<host> scoping convention, so importing this in front of
# firewallme/playbooks/90-firewall.yml actually scopes to just that host, not
# every host in inventory. linux/tools.yml never sets `target` at all, so this
# still defaults to 'all' there, scoped the way that file's own header always
# documented -- via --limit at the CLI, not -e target=. Real live bug caught
# 2026-07-26 (Robert, mid-run against EXAFWLAMS001): this was hardcoded to
# `hosts: all` when first extracted, silently ignoring -e target= entirely and
# looping the password prompt through every single host in inventory before
# ever reaching the one actually requested -- exactly the same class of
# mistake already made once earlier the same session, telling Robert to use
# -e target= against linux/tools.yml itself (which never supported it, only
# --limit does) -- caught there, then reintroduced here anyway when writing
# this file from scratch.
#
# Tests the CURRENT key first (plain ssh, delegate_to: localhost, BatchMode=yes
# so it can never hang on a password prompt). If that works, does nothing --
# the caller's own next play connects normally, at no extra cost beyond one
# quick localhost-side ssh call per host.
#
# If the key fails, prompts (ansible.builtin.pause) for a fallback password --
# this only ever helps if the target account's password has already been
# manually unlocked/set out-of-band for recovery; every managed Linux/
# firewall node's `ansible` account has a locked password and passwordless
# sudo by design. A real answer sets `ansible_password`, which persists as a
# host fact for the rest of THIS playbook run (including every later play
# that targets the same host) -- Ansible's own connection layer picks it up
# automatically from here on, no further wiring needed in the caller. A
# blank answer adds the host to the `ssh_preflight_skip` group instead, so
# the caller's own `hosts:` pattern should end in `:!ssh_preflight_skip` to
# skip that host cleanly rather than failing the whole run or wasting a
# doomed reconnect attempt on it.
#
# Once connected (by whichever method), pair this with
# tasks/refresh_ansible_ssh_key.yml in the caller's own next play/pre_tasks
# to actually push the real key back and heal a locked account -- this file
# only tests and falls back, it never writes anything itself.
#
# `serial: 1` is required, not optional -- confirmed live, 2026-07-16:
# ansible.builtin.pause does not reliably register a result for every host
# in a normal parallel multi-host batch hitting it at once; only one host in
# the batch ever got a real answer back, regardless of
# ignore_unreachable/ignore_errors/meta: clear_host_errors on earlier tasks.
# Only THIS lightweight play pays the serialisation cost -- the caller's own
# heavier play after it stays fully parallel, unaffected.
#
# ansible.builtin.ping was tried as the connectivity test and rejected --
# confirmed live: a real per-host connection attempt like that marks a
# failing host unreachable in Ansible's own internal state for the rest of
# THAT play, and ignore_unreachable/ignore_errors on that one task does NOT
# undo it for later tasks against the same host (meta: clear_host_errors
# didn't either). A plain delegate_to: localhost ssh command avoids this
# entirely -- Ansible's own connection layer never touches the real target
# until a password fact (if needed) is already in hand.
# =============================================================================
# Changelog:
#   2026-10-23  Robert's ask, live on EXANASFAL001: the key-only probe below always
#               fails when the whole run is already using password auth (-k/
#               ansible_password), since a password-auth run never relied on the key in
#               the first place -- it then always fell through to the password prompt,
#               asking the human to retype the SAME password they already gave at the
#               CLI, for no actual benefit (connectivity is already proven by that
#               point). Confirmed redundant across two separate live re-runs of the same
#               host the same day. Wrapped the whole probe-and-fallback sequence in a
#               block, skipped entirely when password auth is already active -- reuses
#               the exact same signal 00-preflight.yml's own ssh_key_preflight_skip
#               already uses for the identical reason. Not TrueNAS-specific: benefits
#               every caller's own --user=root/truenas_admin -k first-run path equally
#               (proxmox/salt included), none of which were ever actually spared this
#               friction before, just never reported.
#   2026-10-23  Robert's ask, live on EXAFWLABD001 (see check_linux_baseline.yml's own
#               changelog for the fuller story): added a WAN/provisioning-IP fallback
#               (192.168.139.<site-octet>, firewalls only -- see the dedicated comment
#               block above the new tasks for why this is strictly host_role=='FWL'-gated
#               and not applied generically to every other caller of this shared file).
#               When the primary ansible_host doesn't respond, this now tries that address
#               too before ever reaching the password prompt, and persists it as an
#               ansible_host override for the rest of the run if it works. The password-
#               prompt and ssh_preflight_skip-marking tasks below both gained an extra
#               "not _ssh_preflight_fixed_by_wan" guard -- without it, a skipped (never-
#               registered) _ssh_preflight_pw's .user_input resolves through its own
#               | default('') exactly like a genuinely blank answer would, so the skip-
#               group marking would have incorrectly fired even after this fallback had
#               already fixed connectivity. All of this logic was exercised in isolation
#               (mocked SSH results, real sites.csv-derivation inputs) before trusting it --
#               the actual `ssh` connectivity test itself is unchanged/unexercised by that.
#               SAME DAY, first real live run (EXAFWLABD001): the NOTE message printed the
#               SAME address on both sides ("configured address (192.168.139.224) didn't
#               respond, but ... 192.168.139.224 did") -- the override task's own set_fact
#               updates hostvars[inventory_hostname].ansible_host immediately, so the NOTE
#               message's own {{ hostvars[inventory_hostname].ansible_host }} read the
#               already-overwritten value, not the real original. Fixed by capturing the
#               original address into _preflight_original_host in a dedicated task BEFORE
#               the override runs, and having the NOTE message read that instead -- re-
#               verified in isolation (this exact before/after task ordering, not just the
#               Jinja expression alone) before trusting it this time.
#   2026-10-19  Real live bug, found bootstrapping EXACLPCLD001 against a bare-IP target:
#               the key-connectivity test's {{ ansible_host | default(inventory_hostname) }}
#               resolved to "localhost" (the delegate's own value, since delegate_to
#               re-scopes connection variables), not the real target -- silently masked
#               until now because a human always just types the fallback password anyway.
#               Fixed via explicit hostvars[inventory_hostname] lookups. See the task's
#               own comment for the full detail.
#   2026-07-26  Real live bug (Robert, mid-run against EXAFWLAMS001): hosts: was hardcoded
#               to `all`, ignoring firewallme's own -e target= scoping convention entirely
#               -- looped the password prompt through every host in inventory
#               (EXASVRAKL001, EXASVRBIR001, EXAANSCLD001, ...) before ever reaching the
#               one actually requested. Fixed to hosts: "{{ target | default('all') }}",
#               matching firewallme/playbooks/90-firewall.yml's own second play exactly;
#               linux/tools.yml (which never sets target) is unaffected, still scoped via
#               --limit as always.
#   2026-07-26  Fixed a real, pre-existing gap found while testing this
#               extraction against a real throwaway sshd: the ssh test
#               command never included a port option at all, silently always
#               testing port 22 regardless of ansible_port. No real host in
#               this estate currently sets a non-default ansible_port (only
#               windows_nodes/connection.yml does, and Windows never goes
#               through this preflight), so this had zero live impact so
#               far -- but worth fixing now this file is used more widely.
#               Added -o Port={{ ansible_port | default(22) }}.
#   2026-07-26  Extracted from linux/tools.yml into a shared, importable play
#               -- firewallme/playbooks/90-firewall.yml is the second caller
#               (EXAFWLAMS001, real live SSH key rejection).
#   2026-07-16  Built inside linux/tools.yml (original location).
# =============================================================================

- name: SSH preflight
  hosts: "{{ target | default('all') }}"
  gather_facts: false
  serial: 1
  vars:
    _preflight_key: "{{ ansible_ssh_private_key_file | default(lookup('env', 'HOME') + '/ansible/configs/ansible-id_rsa') }}"

  tasks:

    # 2026-10-23, Robert's ask, live on EXANASFAL001 (TrueNAS's own first-ever password-
    # authenticated onboard run): this file's key-only probe always fails when the whole
    # run is already using password auth (-k / ansible_password/-e), since the real
    # connection a password-auth run relies on was never key-based in the first place --
    # it then always falls through to the password prompt below, which just asks the
    # human to retype the SAME password they already supplied at the CLI, for no actual
    # benefit (connectivity is already proven; 00-preflight.yml's own gather_facts, or
    # the caller's own equivalent, already succeeded using it). Confirmed as redundant,
    # not protective, across two separate live re-runs of the same host the same day.
    # Reuses the EXACT same signal 00-preflight.yml's own ssh_key_preflight_skip already
    # uses for the identical reason -- not a TrueNAS-specific fix, this benefits every
    # caller's own --user=root/truenas_admin -k first-run path equally (proxmox/salt
    # included), none of which were ever actually spared this friction before, just
    # never reported.
    - name: "[Preflight] Determine whether this run is already using password auth"
      ansible.builtin.set_fact:
        _ssh_preflight_password_auth_active: "{{ (ansible_ssh_pass is defined) or ((ansible_password | default('')) != '') }}"

    - name: "[Preflight] NOTE — skipping key probe, this run is already using password auth"
      ansible.builtin.debug:
        msg: >-
          {{ _c.Y }}[!]{{ _c.NC }} {{ inventory_hostname }}: this run is already using
          password auth (-k/ansible_password) -- skipping the key-only connectivity probe
          and fallback prompt below, nothing useful for them to test here.
      when: _ssh_preflight_password_auth_active

    - name: "[Preflight] Key/password probe-and-fallback block (skipped entirely under password auth, see above)"
      when: not _ssh_preflight_password_auth_active
      block:

        - name: "[Preflight] Test SSH connectivity with the current key"
          # Delegated plain ssh, not ansible.builtin.ping -- see header comment above.
          #
          # BUG FIX 2026-10-19 (found live bootstrapping EXACLPCLD001 against a bare-IP
          # target, -i "<ip>,"): delegate_to: localhost re-scopes CONNECTION variables
          # (ansible_host/ansible_port/ansible_user/etc) to the DELEGATE's own hostvars,
          # not the original target's -- documented Ansible behaviour, confirmed via an
          # isolated debug playbook. A plain {{ ansible_host | default(...) }} here
          # therefore resolves to localhost's OWN ansible_host ("localhost" itself),
          # not the real target -- for any host where ansible_host is explicitly set
          # (every bare-IP target, since Ansible's inventory parser auto-sets
          # ansible_host = the IP for a bare entry), this tested connectivity to
          # ansible@localhost instead of the real box, always "failing" and falling
          # through to the interactive password prompt. Silently masked until now: a
          # human always just types the password anyway when prompted, so the wrong
          # test target never looked wrong from the outside -- only matters for a key
          # that genuinely IS valid, which a human-driven run never needed to notice.
          # Real named hosts without an explicit ansible_host override (DNS-resolvable
          # hostname only) were never affected -- inventory_hostname (NOT a connection
          # var, stays correctly scoped under delegation) was already the right value.
          # Fixed via an explicit hostvars[inventory_hostname] lookup, which bypasses
          # delegate_to's connection-variable re-scoping entirely.
          ansible.builtin.command: >
            ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=no
                -o Port={{ hostvars[inventory_hostname].ansible_port | default(22) }}
                -i {{ _preflight_key }}
                {{ hostvars[inventory_hostname].ansible_user | default('ansible') }}@{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}
                true
          register: _ssh_preflight
          delegate_to: localhost
          changed_when: false
          failed_when: false
          vars:
            ansible_connection: local

        # ── WAN/provisioning-IP fallback — FIREWALLS ONLY ──────────────────────────
        # Robert, 2026-10-23, live on EXAFWLABD001: forgot to run linux/tools.yml first, then
        # hit a confusing SSH timeout trying to reach this host's permanent LAN-side
        # ansible_host (192.168.224.253), which only routes via a WireGuard peer that hadn't
        # been registered on the hub yet -- a real catch-22 for a firewall that's built enough
        # to exist in inventory but not yet fully meshed in. His ask: try the provisioning/WAN
        # IP (192.168.139.<site-octet>, the SAME convention firewallme/roles/firewall/tasks/
        # 00_preflight_1_derive.yml's own fw_wan_static_ip already uses -- reused via the
        # identical sites.csv Subnet-third-octet derivation, not re-invented here) as a genuine
        # second candidate when the primary address doesn't respond, and persist it as an
        # ansible_host override for the rest of the run if it works -- same pattern already
        # used below for the password fallback.
        #
        # Deliberately gated on host_role == 'FWL', not applied generically to every caller of
        # this shared file (bind9/truenas/salt/cloudpanel/linux_tools all import it too).
        # 192.168.139.<site-octet> is only that EXACT host's own permanent address for a
        # firewall -- for every other role, that address belongs to the SITE'S firewall, a
        # completely different box that also happens to trust the same 'ansible' key. Applying
        # this fallback generically would silently "succeed" by connecting to the wrong machine
        # entirely for every non-firewall host -- a real safety hazard, not a convenience.
        # host_role comes from hostname_facts.yml, wrapped in block/rescue (same reasoning as
        # check_linux_baseline.yml's own identical wrapping) since this runs before any
        # caller's own hostname validation and must never be fatal here.

        - name: "[Preflight] Best-effort hostname facts (WAN-IP fallback pattern-gate — firewalls only)"
          block:
            - include_tasks: ../tasks/hostname_facts.yml
          rescue:
            - set_fact:
                host_role: "UNKNOWN"
          when: _ssh_preflight.rc != 0

        - name: "[Preflight] Load sites.csv (WAN-IP fallback — firewalls only)"
          ansible.builtin.read_csv:
            path: "{{ playbook_dir }}/../../benarbejde/sites.csv"
          register: _preflight_sites_raw
          delegate_to: localhost
          become: false
          when:
            - _ssh_preflight.rc != 0
            - host_role | default('UNKNOWN') | upper == 'FWL'

        - name: "[Preflight] Compute WAN/provisioning IP candidate (WAN-IP fallback — firewalls only)"
          ansible.builtin.set_fact:
            _preflight_wan_candidate: >-
              192.168.139.{{ (_preflight_sites_raw.list
                 | selectattr('Site', 'equalto', host_site | default(''))
                 | map(attribute='Subnet') | map('regex_replace', '^\d+\.\d+\.(\d+)\..*$', '\1')
                 | list | first | default('')) }}
          when:
            - _preflight_sites_raw is defined
            - _preflight_sites_raw is not skipped
            - _preflight_sites_raw.list | selectattr('Site', 'equalto', host_site | default('')) | list | length > 0

        - name: "[Preflight] Test SSH connectivity via the WAN/provisioning IP candidate"
          ansible.builtin.command: >
            ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=no
                -o Port={{ hostvars[inventory_hostname].ansible_port | default(22) }}
                -i {{ _preflight_key }}
                {{ hostvars[inventory_hostname].ansible_user | default('ansible') }}@{{ _preflight_wan_candidate }}
                true
          register: _ssh_preflight_wan
          delegate_to: localhost
          changed_when: false
          failed_when: false
          when: _preflight_wan_candidate is defined
          vars:
            ansible_connection: local

        - name: "[Preflight] Capture the original configured address (before it gets overwritten below)"
          # Must run BEFORE the override task -- found live, 2026-10-23 (first real run of this
          # feature, EXAFWLABD001): the override task's own set_fact updates
          # hostvars[inventory_hostname].ansible_host immediately, same-host, visible to the
          # very next task -- a debug message reading that same expression AFTER the override
          # had already run saw the NEW value on both sides, printing "configured address
          # (192.168.139.224) didn't respond, but ... 192.168.139.224 did" instead of showing
          # the real original (192.168.224.253). Captured once, here, strictly before the
          # overwrite, so the later NOTE message has the real original regardless of task order.
          ansible.builtin.set_fact:
            _preflight_original_host: "{{ hostvars[inventory_hostname].ansible_host | default(inventory_hostname) }}"
          when:
            - _ssh_preflight_wan is defined
            - _ssh_preflight_wan is not skipped
            - _ssh_preflight_wan.rc | default(1) == 0

        - name: "[Preflight] WAN-IP fallback succeeded — persist ansible_host override for the rest of this run"
          ansible.builtin.set_fact:
            ansible_host: "{{ _preflight_wan_candidate }}"
            # Consumed below to skip the password prompt / skip-group marking entirely --
            # without this, both would still fire: a skipped (never-registered)
            # _ssh_preflight_pw's .user_input resolves through | default('') to '' just like
            # a genuinely blank answer would, so "Mark host to be skipped" would incorrectly
            # fire even though connectivity is already fixed.
            _ssh_preflight_fixed_by_wan: true
          when:
            - _ssh_preflight_wan is defined
            - _ssh_preflight_wan is not skipped
            - _ssh_preflight_wan.rc | default(1) == 0

        - name: "[Preflight] NOTE — WAN/provisioning IP fallback succeeded"
          ansible.builtin.debug:
            msg: >-
              {{ _c.Y }}[!]{{ _c.NC }} {{ inventory_hostname }}'s configured address
              ({{ _preflight_original_host }})
              didn't respond, but the provisioning/WAN IP {{ _preflight_wan_candidate }} did —
              using that for the rest of this run instead. This usually means the permanent
              route to this host (e.g. its WireGuard peer) isn't up yet — fix that separately,
              this is a convenience to unblock THIS run, not a substitute for it.
          when:
            - _ssh_preflight_wan is defined
            - _ssh_preflight_wan is not skipped
            - _ssh_preflight_wan.rc | default(1) == 0

        - name: "[Preflight] Key auth failed -- prompt for a fallback password"
          ansible.builtin.pause:
            prompt: |-

              ── SSH preflight failed for {{ inventory_hostname }} ───────────────────
                The current Ansible SSH key was rejected (or the host didn't respond)
                connecting as {{ ansible_user | default('ansible') }}.
                Every node's ansible user has a locked password and passwordless
                sudo by design -- this only helps if that account's password has
                already been manually unlocked/set out-of-band for recovery.
                Enter it now to continue this host, or leave blank to skip it.
              ─────────────────────────────────────────────────────────────────────
              Password (masked, blank to skip this host)
            echo: false
          register: _ssh_preflight_pw
          when:
            - _ssh_preflight.rc != 0
            - not (_ssh_preflight_fixed_by_wan | default(false))

        - name: "[Preflight] Apply fallback password for this run"
          ansible.builtin.set_fact:
            ansible_password: "{{ _ssh_preflight_pw.user_input }}"
          no_log: true
          when:
            - _ssh_preflight_pw is not skipped
            - _ssh_preflight_pw.user_input | default('') | length > 0

        - name: "[Preflight] Mark host to be skipped -- no working key and no password given"
          ansible.builtin.add_host:
            name:   "{{ inventory_hostname }}"
            groups: ssh_preflight_skip
          delegate_to: localhost
          changed_when: false
          when:
            - _ssh_preflight.rc != 0
            - not (_ssh_preflight_fixed_by_wan | default(false))
            - _ssh_preflight_pw.user_input | default('') | length == 0
