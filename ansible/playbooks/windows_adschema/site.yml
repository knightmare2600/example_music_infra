---
# =============================================================================
# site.yml
# Example Music Limited — Active Directory population entry point
# =============================================================================
# Builds the OU schema, security groups, users and computer accounts against
# a single target Domain Controller — always run this against one host to
# "up" the AD schema, no tags, no --limit gymnastics.
#
# This is always a separate, second ansible-playbook invocation — it is not,
# and cannot be, chain-imported from windows_dc/site.yml (import_playbook
# expands every play's hosts: pattern at parse time, before 00-dc-preflight.yml's
# vars_prompt has run, so a later play's hosts: gate can never see that
# answer — see windows_dc/site.yml's own changelog). 00-dc-preflight.yml
# only records the populate_ad answer and 40-dc-summary.yml prints the exact
# command to run here, once promotion has actually succeeded.
#
# Each stage guards itself with a hosts:/meta: end_play gate on populate_ad,
# so it's also safe to invoke this file directly without remembering the flag.
#
# Run from the ansible/ root for all commands.
#
# Usage — after DC promotion, once 40-dc-summary.yml has printed the command
# (target supplied directly, skips the prompt):
#   ansible-playbook playbooks/windows_adschema/site.yml -e populate_ad=yes -e ad_target=<host>
#
# Usage — standalone, prompted for the target Domain Controller:
#   ansible-playbook playbooks/windows_adschema/site.yml -e populate_ad=yes
#
# Standalone plays can also be run directly without site.yml:
#   ansible-playbook playbooks/windows_adschema/playbooks/20-ad-groups.yml -e ad_target=<host>
#
# Playbook order:
#   00-ad-preflight  Prompt for ad_target (skipped if populate_ad != yes)
#   10-ad-schema     OU hierarchy from sites.csv
#   20-ad-groups     Security groups from TDF
#   30-ad-users      User accounts, band OUs, group membership, manager from TDF
#   40-ad-computers  Computer accounts from ad_computers.json
# =============================================================================
# Changelog:
#   2026-07-04  Initial file — windows_bootstrap-style restructure of what
#               was previously four flat files (ad_schema.yml, ad_groups.yml,
#               ad_users.yml, ad_computers.yml) directly under
#               windows_adschema/. No tags used — this site.yml is always run
#               against a single target, unlike windows_dc/site.yml's
#               per-stage tags. 40-ad-computers.yml is not yet migrated —
#               its numbered stage and this import will be added once the
#               source file is available.
#   2026-07-09  Corrected the usage note above: windows_dc/site.yml's
#               "AD population" import block (commented out, pointed at the
#               old flat filenames from before this restructure) has been
#               removed rather than fixed — even pointed at this file, it
#               could never have worked, since populate_ad is only known at
#               00-dc-preflight.yml runtime and hosts: patterns for later
#               imported plays are resolved at parse time. This has always
#               been, and remains, a manually-run second command.
#   2026-07-09  Corrected the "Playbook order" table above: 40-ad-computers
#               was still marked "pending, not yet migrated" despite already
#               being imported below and, as of this same date, actually
#               implemented (see its own changelog — it previously loaded
#               and counted ad_computers.json in pre_tasks, then stopped).
# =============================================================================

- import_playbook: playbooks/00-ad-preflight.yml
- import_playbook: playbooks/10-ad-schema.yml
- import_playbook: playbooks/20-ad-groups.yml
- import_playbook: playbooks/30-ad-users.yml
- import_playbook: playbooks/40-ad-computers.yml
