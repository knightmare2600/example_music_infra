# =============================================================================
# tasks/create_users_no_password_batch.yml
# Example Music Limited — Create one batch of new AD user accounts WITHOUT a password, capped concurrency
# =============================================================================
# Included in a loop over _b0a_batches (see 30-ad-users.yml Section B0a). Same
# async/poll:0 + wait + fail-check shape as tasks/create_users_batch.yml
# (Section B) -- see that file's own header for the full write-up of
# async/poll:0 vs forks and batches of 10.
#
# 2026-09-26, Robert's ask, live (EXADCSGOT001): "slow... my PC BSODed while
# it was creating users" -- Section B0 (the fully serial genuinely-new-user
# create) is the one section that genuinely can't be made concurrent as a
# WHOLE, because it writes a password and concurrent password WRITES are the
# proven-live race (see 30-ad-users.yml's own 2026-09-23 writeup: "the race
# is in concurrent New-ADUser -AccountPassword calls... 4-for-4" failures).
# But that race is specific to the PASSWORD part, not object creation in
# general -- confirmed via ansible-doc microsoft.ad.user: password is
# genuinely OPTIONAL at creation ("Optionally set the user's password...
# To enable an account, a password must already be configured on the
# account, OR you must provide a password here" -- the "or" is the load-
# bearing word; creation itself never requires one). Split into two phases:
#
#   B0a (this file) -- create the AD object with every field EXCEPT
#   password, enabled: false throughout (so nothing here ever attempts to
#   enable a still-unpassworded account -- microsoft.ad.user's own docs are
#   explicit that enabling requires a password to already exist). Safe to
#   batch the same way Section B's own existing-account UPDATE traffic
#   already is -- that traffic ALSO never touches a password (update_password:
#   on_create is a no-op on update), and it's already proven safe at scale:
#   "~38 batches ... of pure existing-account UPDATE traffic (no password
#   ever touched) ... all succeeded with zero failures" the same evening the
#   password-writing race was found. This is the same shape of operation,
#   just for genuinely new objects instead of existing ones.
#
#   B0b (30-ad-users.yml, immediately after this include) -- sets the
#   password for these same accounts in a genuinely serial second pass.
#   Narrower per-call than the old combined create+password task (no
#   name/UPN/OU/description/etc. to marshal, just identity + password), so
#   hopefully faster per-item even serially -- but still one round trip per
#   account, since password writes are still the one operation genuinely
#   proven unsafe to concurrent-ize. This does NOT eliminate B0's serial
#   cost, it narrows what has to run serially.
#
# NOT yet verified against a real full cold-forest run (no existing accounts
# at all) -- theoretically sound (module docs + this file's own existing
# evidence about what specifically causes the race), but a genuinely new
# mechanism, not a like-for-like port of an already-proven one the way
# Sections C/D/computers' batching was. Worth watching the first real run of
# this closely rather than assuming it behaves exactly as reasoned.
# =============================================================================

- name: "B0a | Create user accounts WITHOUT a password (batch of {{ _b0a_batch | length }}, fire async)"
  microsoft.ad.user:
    # identity: added 2026-09-26 for consistency with every other
    # microsoft.ad.user/computer task in this module (see
    # tasks/create_computers_batch.yml's own changelog for the real bug this
    # closes elsewhere) -- not actually load-bearing HERE specifically, since
    # this task only ever runs for _new_creates_todo (confirmed absent from
    # AD at snapshot time), so there's no existing object to fail to find.
    # Added anyway so this file doesn't stand out as an unexplained exception.
    identity:         "{{ item.SamAccountName }}"
    name:             "{{ item.Name }}"
    sam_account_name: "{{ item.SamAccountName }}"
    upn:              "{{ item.UserPrincipalName }}"
    path:             "{{ item.ad_ou }}"
    display_name:     "{{ item.Name }}"
    firstname:        "{{ item.Name.split(' ')[0] }}"
    surname:          "{{ (item.Name.split(' ')[1:] | join(' ')) or omit }}"
    description:      "{{ item.Description }}"
    email:            "{{ item.Email }}"
    company:          "{{ item.Company }}"
    street:           "{{ item.Street if item.Street else omit }}"
    city:             "{{ item.City if item.City else omit }}"
    postal_code:      "{{ item.PostalCode if item.PostalCode else omit }}"
    country: "{{ _country_lookup[item.CountryCode].code }}"
    attributes:
      set: >-
        {{
          {'co': _country_lookup[item.CountryCode].name, 'title': item.Title, 'department': item.Department}
          | combine({'telephoneNumber': item.telephoneNumber} if item.telephoneNumber else {})
          | combine({'mobile': item.mobile} if item.mobile else {})
          | combine({'physicalDeliveryOfficeName': item.physicalDeliveryOfficeName} if item.physicalDeliveryOfficeName else {})
        }}
    enabled: false
    state:   present
  async: 60
  poll: 0
  loop: "{{ _b0a_batch }}"
  loop_control:
    label: "{{ item.SamAccountName }}"
  register: _b0a_async

- name: "B0a | Create user accounts WITHOUT a password (batch, wait for completion)"
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  register: _b0a_wait
  until: _b0a_wait.finished
  retries: 30
  delay: 2
  loop: "{{ _b0a_async.results }}"
  loop_control:
    label: "{{ item.item.SamAccountName }}"

- name: "B0a | Fail on any batch item that errored"
  fail:
    msg: "{{ item.item.item.SamAccountName }} failed: {{ item.msg | default('unknown error') }}"
  loop: "{{ _b0a_wait.results }}"
  loop_control:
    label: "{{ item.item.item.SamAccountName }}"
  when: item.failed | default(false)
