# =============================================================================
# tasks/create_groups_batch.yml
# Example Music Limited — Create one batch of AD security groups, capped concurrency
# =============================================================================
# Included in a loop over _groups_batches (see 20-ad-groups.yml's "Create AD
# security groups" section), once per batch of up to 10 groups. Same
# async/poll:0 + wait + fail-check shape as tasks/create_computers_batch.yml
# (windows_adschema/playbooks/40-ad-computers.yml Section A) -- see that
# file's own header for the full writeup of why async/poll:0 (not forks,
# which parallelises across hosts not loop items) and why batches of 10
# (WinRM's MaxShellsPerUser=30 default, plus the same safety margin already
# settled on there).
#
# 2026-09-27, Robert's ask, live (EXADCSGOT001): "Create AD security groups"
# was still a fully serial, one-microsoft.ad.group-call-per-item loop,
# unlike 30-ad-users.yml's/40-ad-computers.yml's own sections (both batched
# the night before). At the same ~9 sec/item rate 10-ad-schema.yml's own OU
# creation sections established earlier the same run, 154 groups took ~23
# minutes to converge. Same safe-to-batch reasoning as
# create_computers_batch.yml's own: microsoft.ad.group never touches a
# password at all -- groups don't have one -- so there is no concurrent-
# write race to avoid here either, and it was simply never batched yet
# rather than deliberately kept serial for a reason.
#
# 2026-09-27, SEPARATE FIX found while sandbox-testing the above (before
# ever wiring it in): async_status's own "wait for completion" task hard-
# fails the WHOLE PLAY the instant it sees a real non-zero return code --
# BEFORE the dedicated "Fail on any batch item that errored" task below
# ever gets a chance to run, so its own nicer, correctly-attributed error
# message ("<Name> failed: <reason>") never actually surfaces; the raw,
# generic async_status crash does instead. Confirmed via a mocked test
# (a deliberately-failing item, real ansible-playbook run, not reasoned
# about): without ignore_errors: true on the async_status task itself, the
# whole play aborts right there; WITH it, that task completes without
# aborting, its real result is preserved (not discarded -- confirmed
# failed_when: false is the WRONG fix, since it forces item.failed to
# always read false, silently defeating the fail-check task below too),
# and the dedicated fail-check task correctly fires with its own clear
# message. This exact same latent gap exists in every one of this
# directory's other async-batch task files (create_computers_batch.yml,
# create_users_batch.yml, create_users_no_password_batch.yml,
# add_group_members_batch.yml, set_computer_os_batch.yml,
# set_computer_osversion_batch.yml, set_manager_batch.yml) -- none of them
# have ever actually hit a real per-item failure yet, which is the only
# reason this was never caught before. Fixed in all eight, same day, same
# session -- see each file's own shorter note pointing back here.
# =============================================================================

- name: "Create AD security groups (batch of {{ _groups_batch | length }}, fire async)"
  microsoft.ad.group:
    # identity: required whenever path: might move an EXISTING object --
    # see this file's own caller (20-ad-groups.yml) for the full writeup of
    # why, same reasoning as microsoft.ad.user/computer.
    identity:          "{{ item.SamAccountName | default(item.Name) }}"
    name:              "{{ item.Name }}"
    sam_account_name:  "{{ item.SamAccountName | default(item.Name) }}"
    path:              "{{ item._target_path }}"
    description:       "{{ item.Description }}"
    scope:              global
    category:           security
    state:              present
  async: 60
  poll: 0
  loop: "{{ _groups_batch }}"
  loop_control:
    label: "{{ item.Name }}"
  register: _groups_async

- name: "Create AD security groups (batch, wait for completion)"
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  register: _groups_wait
  until: _groups_wait.finished
  retries: 30
  delay: 2
  ignore_errors: true
  loop: "{{ _groups_async.results }}"
  loop_control:
    label: "{{ item.item.Name }}"

- name: "Fail on any batch item that errored"
  fail:
    msg: "{{ item.item.item.Name }} failed: {{ item.msg | default('unknown error') }}"
  loop: "{{ _groups_wait.results }}"
  loop_control:
    label: "{{ item.item.item.Name }}"
  when: item.failed | default(false)
