# =============================================================================
# tasks/create_users_batch.yml
# Example Music Limited — Create one batch of AD user accounts, capped concurrency
# =============================================================================
# Included in a loop over _b_batches (see 30-ad-users.yml Section B), once per
# batch of up to 10 users. Fires every user in the batch as an async job
# (poll: 0 — returns immediately with a job ID rather than waiting), then a
# second task waits for the whole batch to finish before the next batch
# starts. This caps real concurrent WinRM/AD load at the batch size instead of
# letting natural per-item dispatch speed decide it implicitly.
#
# 2026-09-22, Robert's ask: 364 serial microsoft.ad.user calls (one WinRM
# round-trip each) was going to take considerable wall-clock time on a full
# cold populate. forks (ansible.cfg) doesn't help here — it parallelises
# across HOSTS, not loop items on a single host. async/poll:0 does, without
# changing what the module itself does per user (same idempotency/attribute
# logic as before, just dispatched differently) — lower-risk than rewriting
# user creation as a raw batch PowerShell script.
#
# Real constraint, not guessed: WinRM caps concurrent shells per user at 30 by
# default (MaxShellsPerUser) — an unbounded fire-all-364-at-once approach
# would likely hit that limit. Batches of 20 (Robert's own number, originally)
# stayed comfortably under it. Lowered to 10, 2026-09-23, Robert's ask: after
# the UPN-collision fix, repeated live runs showed a small, different subset
# of new-user creates failing each run with "password does not meet the
# length, complexity, or history requirement", always clearing on a plain
# re-run. Undetermined whether this is AD-side contention under concurrent
# load or something about how heavily-loaded batches interact with this
# module — halving batch size is a cheap, safe thing to try while that's
# investigated properly (see the isolated single-user debug playbook)
# without giving up on async entirely.
#
# async: 60 is a generous per-job timeout — a single AD user create/update
# normally completes in low single-digit seconds; 60s gives real headroom for
# a slow moment without masking a genuinely hung job for too long.
#
# 2026-09-23, found live and now CONFIRMED (supersedes the "genuinely
# undetermined" note this comment used to carry): New-ADUser -AccountPassword
# ... -Enabled $true is not atomic -- AD writes the password first, then
# performs a SEPARATE enable-time re-validation of that stored password
# against policy. Confirmed directly: Get-ADUser -Properties Enabled,
# PasswordLastSet against 7 accounts that failed together in one batch showed
# every one of them with a real, valid PasswordLastSet (proving the password
# write itself succeeded) but Enabled=False -- and their PasswordLastSet
# timestamps were all within the same ~9-second window, matching this batch's
# near-simultaneous async dispatch exactly. When several of these land on the
# DC at once, the enable-time check spuriously rejects some of them, leaving
# a permanently-stuck disabled stub (update_password: on_create means a plain
# re-run can never fix this -- see Section F's writeup in 30-ad-users.yml for
# the recovery path for accounts already stuck this way from a prior run).
# Fixed at the source: this task now always creates with enabled: false,
# removing the enable step from the concurrent/async path entirely. The real
# desired enabled state is applied afterward by 30-ad-users.yml's Section B2,
# serially, once every batch in this run has fully settled -- no more
# concurrent enable-time validation calls, no more race.
# =============================================================================

- name: "B | Create user accounts (batch of {{ _b_batch | length }}, fire async)"
  microsoft.ad.user:
    # identity: required whenever path: might move an EXISTING object -- see
    # tasks/create_computers_batch.yml's own 2026-09-26 changelog entry for
    # the full write-up (a real, live "already exists" failure on the
    # computer side of this exact same gap). This task runs for every one of
    # 354 users every run via _b_update_todo, including any whose ad_ou ever
    # changes -- latent here (no user's ad_ou happened to change the day the
    # computer-side bug was found), but the same fix applies for the same
    # reason: identity: does a location-independent lookup+move,
    # sam_account_name alone does not.
    identity:         "{{ item.SamAccountName }}"
    name:             "{{ item.Name }}"
    sam_account_name: "{{ item.SamAccountName }}"
    upn:              "{{ item.UserPrincipalName }}"
    path:             "{{ item.ad_ou }}"
    display_name:     "{{ item.Name }}"
    firstname:        "{{ item.Name.split(' ')[0] }}"
    surname:          "{{ (item.Name.split(' ')[1:] | join(' ')) or omit }}"
    description:      "{{ item.Description }}"
    email:            "{{ item.Email }}"
    company:          "{{ item.Company }}"
    street:           "{{ item.Street if item.Street else omit }}"
    city:             "{{ item.City if item.City else omit }}"
    postal_code:      "{{ item.PostalCode if item.PostalCode else omit }}"
    country: "{{ _country_lookup[item.CountryCode].code }}"
    attributes:
      set: >-
        {{
          {'co': _country_lookup[item.CountryCode].name, 'title': item.Title, 'department': item.Department}
          | combine({'telephoneNumber': item.telephoneNumber} if item.telephoneNumber else {})
          | combine({'mobile': item.mobile} if item.mobile else {})
          | combine({'physicalDeliveryOfficeName': item.physicalDeliveryOfficeName} if item.physicalDeliveryOfficeName else {})
        }}
    # 2026-09-23, found live: enabled: false here used to be unconditional --
    # this task runs for ALL 354 users every run (_b_batches is built from
    # the unfiltered _users), not just new creates, so it was actively
    # DISABLING every already-correctly-enabled account on every single run.
    # Section B2's _enable_todo filter is built from a snapshot taken BEFORE
    # this task runs, so an account that was already correctly enabled at
    # snapshot time looked like "no change needed" and never got re-enabled
    # afterward -- confirmed live via Get-ADUser showing Enabled=False on
    # accounts that should have been True. omit entirely instead: this task
    # no longer touches enabled: at all (whether creating or updating).
    # Section B0 (30-ad-users.yml) already owns the disabled-at-creation
    # behaviour for genuinely new accounts; Section B2 is now the sole owner
    # of enabled: for every account, new or existing, via its own live
    # pre-run snapshot -- this task must never set it again.
    enabled:          "{{ omit }}"
    password:         "{{ vault_ad_new_user_password }}"
    update_password:  on_create
    # true, hardcoded, not item.MustChangePassword -- 2026-09-26, Robert's
    # compliance ask (see 30-ad-users.yml's own header Notes section for the
    # full reasoning). password_expired isn't gated by update_password: on_create
    # the way the password VALUE is (confirmed via ansible-doc microsoft.ad.user --
    # it's documented as its own independent property, no on_create/always/
    # when_changed coupling mentioned at all) -- this task runs for every item in
    # _b_update_todo on EVERY invocation, existing accounts included, so leaving
    # this as item.MustChangePassword would silently re-flip B0b's password_expired:
    # true back down to false on the very next run for any account whose frozen
    # TDF data says MustChangePassword: false.
    password_expired: true
    state:            present
  async: 60
  poll: 0
  loop: "{{ _b_batch }}"
  loop_control:
    label: "{{ item.SamAccountName }}"
  register: _b_async

# 2026-09-22, found live: "Get-AnsibleParam: Missing required argument:
# _async_dir". Root cause confirmed by reading ansible-core's own
# plugins/action/async_status.py: _async_dir is injected by ansible-core's
# BUILTIN async_status ACTION PLUGIN (platform-agnostic by design -- it uses
# the connection's own shell plugin to resolve the right path and dispatches
# to ansible.legacy.async_status internally, so it already does the right
# thing on Windows without needing a Windows-specific module invocation).
# That action plugin is only registered under ansible.builtin.async_status --
# calling ansible.windows.async_status directly (the natural-looking choice
# for a Windows target) bypasses it entirely and falls through to a plain
# module call with no _async_dir injection at all, which is exactly the
# error seen live. Fixed to ansible.builtin.async_status.
- name: "B | Create user accounts (batch, wait for completion)"
  ansible.builtin.async_status:
    jid: "{{ item.ansible_job_id }}"
  register: _b_wait
  until: _b_wait.finished
  retries: 30
  delay: 2
  loop: "{{ _b_async.results }}"
  loop_control:
    label: "{{ item.item.SamAccountName }}"

- name: "B | Fail on any batch item that errored"
  fail:
    msg: "{{ item.item.item.SamAccountName }} failed: {{ item.msg | default('unknown error') }}"
  loop: "{{ _b_wait.results }}"
  loop_control:
    label: "{{ item.item.item.SamAccountName }}"
  when: item.failed | default(false)
