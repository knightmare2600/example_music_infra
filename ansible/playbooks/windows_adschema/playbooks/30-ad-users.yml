---
# =============================================================================
# playbooks/30-ad-users.yml
# Example Music Limited — Active Directory Users Playbook
# =============================================================================
# Creates AD user accounts from jukebox.example.tdf ($Script:rawUsers).
#
# ⚠  ADDITIVE ONLY — state: present throughout. Never removes accounts.
#     Passwords are only set on account creation (update_password: on_create).
#     Re-running this playbook will NOT reset existing passwords.
#
# Prerequisites (run in order):
#   1. 10-ad-schema.yml  — OU hierarchy must exist (and, when run via
#      site.yml, the ad_target prompt happens in 00-ad-preflight.yml once
#      and is reused here)
#   2. 20-ad-groups.yml  — groups must exist before group assignments
#
# This playbook also creates band sub-OUs under each city's Users OU.
# These are derived from the TDF OU paths and are NOT in 10-ad-schema.yml.
#
# Usage:
#   # Normal path — run via site.yml, prompted once by 00-ad-preflight.yml:
#   ansible-playbook playbooks/windows_adschema/site.yml -i <inventory> -e populate_ad=yes
#
#   # Standalone run — supply the target directly, no prompt available here:
#   ansible-playbook playbooks/windows_adschema/playbooks/30-ad-users.yml -e ad_target=<host> --ask-vault-pass
#
#   # Check mode
#   ansible-playbook playbooks/windows_adschema/playbooks/30-ad-users.yml -e ad_target=<host> --check --diff
#
# Vault variables required (add to your Windows DC group vault):
#   vault_ad_new_user_password  — initial password for all new accounts
#
# Variables (override with --extra-vars):
#   ad_target       Target DC hostname or IP — no prompt in this playbook;
#                   comes from 00-ad-preflight.yml when run via site.yml, or
#                   must be supplied with -e ad_target=<host> if run standalone
#   ad_domain       AD domain FQDN       (default: jukebox.internal)
#   ad_users_json   Path to JSON file    (default: /etc/example-music/ad_users.json)
#
# This playbook only ever reads ad_users_json above -- it never touches the
# TDF directly. ad_users.json is generated offline from jukebox.example.tdf
# by benarbejde/parse_tdf.py (a standalone tool, not run by Ansible; see its
# own header) and deployed to /etc/example-music manually. (tdf_path/
# sites_csv used to be documented here as if this playbook read them
# directly -- it never did; removed 2026-07-09 as misleading.)
#
# Notes:
#   • Users with Disabled=true are created disabled (enabled: false).
#   • MustChangePassword is honoured from the TDF data.
#   • Groups with names that don't match any AD group are silently skipped
#     (ignore_errors on group assignment task). Run 20-ad-groups.yml first.
#   • 357 user accounts from rawUsers as of 2026-07-17 (353 at v1.0.0 release,
#     grown since). Room resource mailboxes and the template.users stub are
#     excluded by the parser.
# =============================================================================
# Version history
# =============================================================================
# v1.0.0  2026-06-29  Initial release. 353 users, band OUs, group membership.
# v1.1.0  2026-07-04  Removed hardcoded ad_target default (EXADCSFAL001) —
#                     leftover from testing. hosts: now reads ad_target from
#                     hostvars['localhost'], set by ad_schema.yml's prompt
#                     play earlier in the same run.
# v1.2.0  2026-07-04  Moved into windows_adschema/playbooks/ as part of the
#                     windows_bootstrap-style restructure. Renamed from
#                     ad_users.yml to 30-ad-users.yml. Prompt now lives in
#                     00-ad-preflight.yml, not inline. Inline microsoft.ad
#                     collection check replaced with a shared include:
#                     ../tasks/ad_collection_check.yml.
# v1.3.0  2026-07-09  ad_domain's fallback changed from a hardcoded
#                     'jukebox.internal' literal to exa_domain, derived from
#                     benarbejde/ad_forest.json (single source of truth).
# =============================================================================

- name: "Build AD users from TDF"
  hosts: "{{ ad_target | default(hostvars['localhost']['ad_target'] | default('localhost')) }}"
  gather_facts: false
  become: false

  vars:
    ad_domain:       "{{ dc_domain_name | default(exa_domain) }}"
    ad_email_domain: "{{ ad_domain }}"
    ad_users_json:   "/etc/example-music/ad_users.json"

    # BUG FIX (2026-07-17): the raw TDF CountryCode field is inconsistent --
    # "Canada" (1 user) vs "CA" (5), "USA" (32) vs "US" (35) -- and the
    # existing `country` param sends this straight to the c attribute, which
    # microsoft.ad.user's own docs say strictly wants a 2-letter ISO 3166
    # code. "Canada"/"USA" were never valid values there; this was an
    # existing bug, not something introduced here. Normalises every raw
    # value actually present in the data to its correct 2-letter code, and
    # (Robert's ask) also maps to the full country name for the co
    # attribute, which microsoft.ad.user has no dedicated param for at all --
    # set via the generic attributes: mechanism in Section B below.
    _country_lookup:
      AT:     { code: AT, name: Austria }
      AU:     { code: AU, name: Australia }
      CA:     { code: CA, name: Canada }
      Canada: { code: CA, name: Canada }
      DE:     { code: DE, name: Germany }
      DK:     { code: DK, name: Denmark }
      GB:     { code: GB, name: United Kingdom }
      IT:     { code: IT, name: Italy }
      LB:     { code: LB, name: Lebanon }
      NL:     { code: NL, name: Netherlands }
      # BUG FIX: unquoted NO is a YAML 1.1 boolean literal (same class as
      # yes/true/off) -- parsed as `false`, not the string "NO", both as a
      # dict key AND as the code value below -- would have made every
      # Norwegian user fail the CountryCode validation, and even if it
      # somehow hadn't, sent a boolean where the AD c attribute expects a
      # string. Caught by actually testing this dict, not by inspection.
      "NO":   { code: "NO", name: Norway }
      NZ:     { code: NZ, name: New Zealand }
      SE:     { code: SE, name: Sweden }
      US:     { code: US, name: United States }
      USA:    { code: US, name: United States }

  pre_tasks:

    - name: "Skip — populate_ad not requested"
      meta: end_play
      when: (populate_ad | default('no')) | lower not in ['yes', 'y']

    - name: Gate on /etc/example-music/* freshness
      include_tasks: ../../../tasks/example_music_freshness_gate.yml
      vars:
        example_music_gate_files: [ad_users.json]
        example_music_gate_repo_root: "{{ playbook_dir }}/../../.."

    - name: "Fail — no target Domain Controller resolved"
      fail:
        msg: >
          No target Domain Controller was resolved from 00-ad-preflight.yml's
          prompt or -e ad_target=<host>. Re-run the play.
      when: inventory_hostname == 'localhost'

    - name: Include microsoft.ad collection preflight check
      include_tasks: ../tasks/ad_collection_check.yml

    - name: "Load users from ad_users.json (known source of truth)"
      set_fact:
        _users_all: "{{ lookup('file', ad_users_json) | from_json }}"
        _base_dn:   "DC={{ ad_domain.split('.') | join(',DC=') }}"
      delegate_to: localhost
      become: false

    - name: "Filter out users with unresolvable OU paths"
      set_fact:
        _users: "{{ _users_all | selectattr('ad_ou', 'ne', '') | list }}"

    - name: "Fail — a user's CountryCode isn't in _country_lookup"
      fail:
        msg: >-
          {{ item.SamAccountName }} has CountryCode '{{ item.CountryCode }}',
          not covered by _country_lookup in this play's vars: -- add it there
          (2-letter ISO code + full country name) rather than let it silently
          fall through.
      loop: "{{ _users }}"
      loop_control:
        label: "{{ item.SamAccountName }}"
      when: item.CountryCode not in _country_lookup

    # BUG FIX (2026-07-17): items2dict silently keeps only the LAST match when
    # Name repeats -- confirmed live for Bruce Foxton/Rick Buckler (The Jam,
    # Manager: "Paul Weller"): with only this flat dict, both resolved to
    # paul.weller.sc (Style Council) instead of paul.weller (The Jam), since
    # Paul Weller's Style Council record happens to sort last in the file.
    # Added _name_ou_to_sam below, keyed on Name + the reporting user's own
    # ad_ou, so a manager sharing the SAME OU as their report resolves
    # unambiguously -- falls back to this flat dict only for genuine
    # cross-OU management relationships, where there's no same-OU candidate.
    - name: "Build name-to-SAM lookup for manager resolution (fallback for cross-OU managers)"
      set_fact:
        _name_to_sam: "{{ _users | items2dict(key_name='Name', value_name='SamAccountName') }}"

    - name: "Build (name, OU)-scoped SAM lookup for unambiguous same-OU manager resolution"
      set_fact:
        _name_ou_to_sam: "{{ _name_ou_to_sam | default({}) | combine({item.Name ~ '|' ~ item.ad_ou: item.SamAccountName}) }}"
      loop: "{{ _users }}"
      loop_control:
        label: "{{ item.SamAccountName }}"

    - name: "Preflight | Report user count"
      debug:
        msg: >-
          Parsed {{ _users_all | length }} users from TDF;
          {{ _users | length }} have resolvable OU paths
          ({{ _users | selectattr('Disabled') | list | length }} disabled,
           {{ _users | selectattr('Manager') | list | length }} have a manager set).

  tasks:

    # -------------------------------------------------------------------------
    # Section A — Band sub-OUs
    # Create band/team OUs under each city's Users OU.
    # These are not created by 10-ad-schema.yml (schema only has the city OUs).
    # The microsoft.ad.ou module is idempotent: re-running is safe.
    # We iterate over all users; duplicate OU creation attempts are no-ops.
    # -------------------------------------------------------------------------

    - name: "A | Create band sub-OUs under city Users OUs"
      microsoft.ad.ou:
        name:                 "{{ item.ad_band_ou_name }}"
        path:                 "{{ item.ad_band_parent }}"
        state:                present
        protect_from_deletion: true
      when: item.ad_band_ou_name | length > 0
      loop: "{{ _users }}"
      loop_control:
        label: >-
          OU={{ item.ad_band_ou_name }},{{ item.ad_band_parent | regex_replace(',DC=.*$','') }}

    # -------------------------------------------------------------------------
    # Section B — User accounts
    # update_password: on_create — only sets the vault password on first creation.
    # existing accounts keep their current password on re-runs.
    # -------------------------------------------------------------------------

    # BUG FIX (2026-07-17): only `country` had an `if X else omit` guard --
    # confirmed against microsoft.ad.user's own docs that every one of these
    # params defaults to null (i.e. omitted = unset), meaning passing an
    # explicit empty string is a different, riskier thing than not passing
    # the param at all. 7 fields have real blank values in the data:
    # telephoneNumber (23 users), mobile (89), Street/City/PostalCode
    # (31-33 each), physicalDeliveryOfficeName (1 -- Vince Clarke), and
    # surname would compute to '' for Shovell (M People, a real one-word
    # stage name with no space to split Name on). Guarded all 7 the same way
    # country already was.

    - name: "B | Create user accounts"
      microsoft.ad.user:
        name:             "{{ item.Name }}"
        sam_account_name: "{{ item.SamAccountName }}"
        upn:              "{{ item.UserPrincipalName }}"
        path:             "{{ item.ad_ou }}"
        display_name:     "{{ item.Name }}"
        given_name:       "{{ item.Name.split(' ')[0] }}"
        surname:          "{{ (item.Name.split(' ')[1:] | join(' ')) or omit }}"
        description:      "{{ item.Description }}"
        email_address:    "{{ item.Email }}"
        company:          "{{ item.Company }}"
        title:            "{{ item.Title }}"
        department:       "{{ item.Department }}"
        telephone_number: "{{ item.telephoneNumber if item.telephoneNumber else omit }}"
        mobile_phone:     "{{ item.mobile if item.mobile else omit }}"
        street_address:   "{{ item.Street if item.Street else omit }}"
        city:             "{{ item.City if item.City else omit }}"
        postal_code:      "{{ item.PostalCode if item.PostalCode else omit }}"
        office:           "{{ item.physicalDeliveryOfficeName if item.physicalDeliveryOfficeName else omit }}"
        # No if/else omit fallback needed here (unlike the fields above) --
        # the "Fail — a user's CountryCode isn't in _country_lookup" pre_task
        # already guarantees every item.CountryCode reaching this point is a
        # valid key, so a fallback branch would be dead code (same class of
        # thing Robert caught earlier tonight in 06_network_manager.yml).
        # Also: `omit` only works as a whole parameter value, not buried
        # inside a nested dict like attributes.set -- co below would have
        # been broken by an else: omit fallback even if one were needed.
        country: "{{ _country_lookup[item.CountryCode].code }}"
        attributes:
          set:
            co: "{{ _country_lookup[item.CountryCode].name }}"
        enabled:          "{{ not item.Disabled }}"
        password:         "{{ vault_ad_new_user_password }}"
        update_password:  on_create
        password_expired: "{{ item.MustChangePassword }}"
        state:            present
      loop: "{{ _users }}"
      loop_control:
        label: "{{ item.SamAccountName }}"

    # -------------------------------------------------------------------------
    # Section C — Group membership
    # Groups are added, not replaced (groups_action: add).
    # Errors are ignored — some TDF group names don't match AD group names
    # (e.g. 'Keyboardists' vs 'Keyboards'). Run 20-ad-groups.yml first to
    # minimise mismatches.
    # -------------------------------------------------------------------------

    - name: "C | Add users to groups"
      microsoft.ad.user:
        name:             "{{ item.Name }}"
        sam_account_name: "{{ item.SamAccountName }}"
        groups:
          add: "{{ item.Groups }}"
        state: present
      when:  item.Groups | length > 0
      loop:  "{{ _users }}"
      loop_control:
        label: "{{ item.SamAccountName }} → {{ item.Groups | join(', ') }}"
      ignore_errors: true

    # -------------------------------------------------------------------------
    # Section D — Manager
    # Runs after all accounts exist so the manager DN can be resolved.
    # Manager in the TDF is a display name; we resolve it to a SamAccountName,
    # preferring a candidate in the SAME ad_ou as the report (handles people
    # who share a display name across different bands/OUs, e.g. two "Paul
    # Weller" records for The Jam vs Style Council), falling back to the flat
    # _name_to_sam lookup for genuine cross-OU management relationships.
    # Users whose manager is not in the TDF (e.g. external or unlisted) are
    # silently skipped by the 'when' condition.
    # -------------------------------------------------------------------------

    - name: "D | Set manager attribute"
      microsoft.ad.user:
        name:             "{{ item.Name }}"
        sam_account_name: "{{ item.SamAccountName }}"
        manager:          "{{ _name_ou_to_sam[item.Manager ~ '|' ~ item.ad_ou] | default(_name_to_sam[item.Manager]) }}"
        state:            present
      when:
        - item.Manager | length > 0
        - (item.Manager ~ '|' ~ item.ad_ou) in _name_ou_to_sam or item.Manager in _name_to_sam
      loop: "{{ _users }}"
      loop_control:
        label: "{{ item.SamAccountName }} ← manager: {{ item.Manager }}"

    # -------------------------------------------------------------------------
    # Section E — Account lockout state
    # BUG FIX (2026-07-17): this docstring used to say Locked=$true accounts
    # were "not reproducible programmatically" -- confirmed against
    # microsoft.ad.user's own docs that account_locked only accepts `false`
    # (unlock); the module deliberately has no way to SET a lockout, since
    # real AD lockouts are a side effect of failed logons, not an admin
    # action. There is still a real, correct way to force it: AD represents
    # lockout via the lockoutTime attribute directly, settable through the
    # generic attributes: mechanism this file already uses nowhere else but
    # 40-ad-computers.yml does for OS fields. 9 real users have Locked=true
    # in the source data, including at least one (Alan Wilder) who is NOT
    # also Disabled -- a genuinely distinct state this file dropped entirely
    # before now.
    #
    # Caveat worth knowing: unlike a real lockout, this doesn't expire on its
    # own according to the domain's account lockout duration policy unless
    # that policy is itself set to indefinite (0, common, but not universal)
    # -- re-running with Locked=false in the source data clears it via the
    # module's own native account_locked: no, which IS fully supported.
    # -------------------------------------------------------------------------

    - name: "E | Lock accounts (Locked=true in source data)"
      microsoft.ad.user:
        name:             "{{ item.Name }}"
        sam_account_name: "{{ item.SamAccountName }}"
        attributes:
          set:
            lockoutTime:
              type:  date_time
              value: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"
        state:            present
      when: item.Locked | default(false)
      loop: "{{ _users }}"
      loop_control:
        label: "{{ item.SamAccountName }}"

    - name: "E | Unlock accounts (Locked=false in source data)"
      microsoft.ad.user:
        name:             "{{ item.Name }}"
        sam_account_name: "{{ item.SamAccountName }}"
        account_locked:   false
        state:            present
      when: not (item.Locked | default(false))
      loop: "{{ _users }}"
      loop_control:
        label: "{{ item.SamAccountName }}"
