---
# =============================================================================
# playbooks/30-ad-users.yml
# Example Music Limited — Active Directory Users Playbook
# =============================================================================
# Creates AD user accounts from jukebox.example.tdf ($Script:rawUsers).
#
# ⚠  ADDITIVE ONLY — state: present throughout. Never removes accounts.
#     Passwords are only set on account creation (update_password: on_create).
#     Re-running this playbook will NOT reset existing passwords.
#
# Prerequisites (run in order):
#   1. 10-ad-schema.yml  — OU hierarchy must exist (and, when run via
#      site.yml, the ad_target prompt happens in 00-ad-preflight.yml once
#      and is reused here)
#   2. 20-ad-groups.yml  — groups must exist before group assignments
#
# This playbook also creates band sub-OUs under each city's Users OU.
# These are derived from the TDF OU paths and are NOT in 10-ad-schema.yml.
#
# Usage:
#   # Normal path — run via site.yml, prompted once by 00-ad-preflight.yml:
#   ansible-playbook playbooks/windows_adschema/site.yml -i <inventory> -e populate_ad=yes
#
#   # Standalone run — supply the target directly, no prompt available here:
#   ansible-playbook playbooks/windows_adschema/playbooks/30-ad-users.yml -e ad_target=<host> --ask-vault-pass
#
#   # Check mode
#   ansible-playbook playbooks/windows_adschema/playbooks/30-ad-users.yml -e ad_target=<host> --check --diff
#
# Vault variables required (add to your Windows DC group vault):
#   vault_ad_new_user_password  — initial password for all new accounts
#
# Variables (override with --extra-vars):
#   ad_target       Target DC hostname or IP — no prompt in this playbook;
#                   comes from 00-ad-preflight.yml when run via site.yml, or
#                   must be supplied with -e ad_target=<host> if run standalone
#   ad_domain       AD domain FQDN       (default: jukebox.internal)
#   ad_users_json   Path to JSON file    (default: /etc/example-music/ad_users.json)
#
# This playbook only ever reads ad_users_json above -- it never touches the
# TDF directly. ad_users.json is generated offline from jukebox.example.tdf
# by benarbejde/parse_tdf.py (a standalone tool, not run by Ansible; see its
# own header) and deployed to /etc/example-music manually. (tdf_path/
# sites_csv used to be documented here as if this playbook read them
# directly -- it never did; removed 2026-07-09 as misleading.)
#
# Notes:
#   • Users with Disabled=true are created disabled (enabled: false).
#   • MustChangePassword is honoured from the TDF data.
#   • Groups with names that don't match any AD group are silently skipped
#     (ignore_errors on group assignment task). Run 20-ad-groups.yml first.
#   • 357 user accounts from rawUsers as of 2026-07-17 (353 at v1.0.0 release,
#     grown since). Room resource mailboxes and the template.users stub are
#     excluded by the parser.
# =============================================================================
# Version history
# =============================================================================
# v1.0.0  2026-06-29  Initial release. 353 users, band OUs, group membership.
# v1.1.0  2026-07-04  Removed hardcoded ad_target default (EXADCSFAL001) —
#                     leftover from testing. hosts: now reads ad_target from
#                     hostvars['localhost'], set by ad_schema.yml's prompt
#                     play earlier in the same run.
# v1.2.0  2026-07-04  Moved into windows_adschema/playbooks/ as part of the
#                     windows_bootstrap-style restructure. Renamed from
#                     ad_users.yml to 30-ad-users.yml. Prompt now lives in
#                     00-ad-preflight.yml, not inline. Inline microsoft.ad
#                     collection check replaced with a shared include:
#                     ../tasks/ad_collection_check.yml.
# v1.3.0  2026-07-09  ad_domain's fallback changed from a hardcoded
#                     'jukebox.internal' literal to exa_domain, derived from
#                     benarbejde/ad_forest.json (single source of truth).
# =============================================================================

- name: "Build AD users from ad_users.json"
  hosts: "{{ ad_target | default(hostvars['localhost']['ad_target'] | default('localhost')) }}"
  gather_facts: false
  become: false

  vars:
    ad_domain:       "{{ dc_domain_name | default(exa_domain) }}"
    ad_email_domain: "{{ ad_domain }}"
    ad_users_json:   "/etc/example-music/ad_users.json"

    # BUG FIX (2026-07-17): the raw TDF CountryCode field is inconsistent --
    # "Canada" (1 user) vs "CA" (5), "USA" (32) vs "US" (35) -- and the
    # existing `country` param sends this straight to the c attribute, which
    # microsoft.ad.user's own docs say strictly wants a 2-letter ISO 3166
    # code. "Canada"/"USA" were never valid values there; this was an
    # existing bug, not something introduced here. Normalises every raw
    # value actually present in the data to its correct 2-letter code, and
    # (Robert's ask) also maps to the full country name for the co
    # attribute, which microsoft.ad.user has no dedicated param for at all --
    # set via the generic attributes: mechanism in Section B below.
    _country_lookup:
      AT:     { code: AT, name: Austria }
      AU:     { code: AU, name: Australia }
      CA:     { code: CA, name: Canada }
      Canada: { code: CA, name: Canada }
      DE:     { code: DE, name: Germany }
      DK:     { code: DK, name: Denmark }
      GB:     { code: GB, name: United Kingdom }
      IT:     { code: IT, name: Italy }
      LB:     { code: LB, name: Lebanon }
      NL:     { code: NL, name: Netherlands }
      # BUG FIX: unquoted NO is a YAML 1.1 boolean literal (same class as
      # yes/true/off) -- parsed as `false`, not the string "NO", both as a
      # dict key AND as the code value below -- would have made every
      # Norwegian user fail the CountryCode validation, and even if it
      # somehow hadn't, sent a boolean where the AD c attribute expects a
      # string. Caught by actually testing this dict, not by inspection.
      "NO":   { code: "NO", name: Norway }
      NZ:     { code: NZ, name: New Zealand }
      SE:     { code: SE, name: Sweden }
      US:     { code: US, name: United States }
      USA:    { code: US, name: United States }

  pre_tasks:

    - name: "Skip — populate_ad not requested"
      meta: end_play
      when: (populate_ad | default('no')) | lower not in ['yes', 'y']

    - name: Gate on /etc/example-music/* freshness
      include_tasks: ../../../tasks/example_music_freshness_gate.yml
      vars:
        example_music_gate_files: [ad_users.json]
        example_music_gate_repo_root: "{{ playbook_dir }}/../../../.."

    - name: "Fail — no target Domain Controller resolved"
      fail:
        msg: >
          No target Domain Controller was resolved from 00-ad-preflight.yml's
          prompt or -e ad_target=<host>. Re-run the play.
      when: inventory_hostname == 'localhost'

    - name: Include microsoft.ad collection preflight check
      include_tasks: ../tasks/ad_collection_check.yml

    - name: "Load users from ad_users.json (known source of truth)"
      set_fact:
        _users_all: "{{ lookup('file', ad_users_json) | from_json }}"
        _base_dn:   "DC={{ ad_domain.split('.') | join(',DC=') }}"
      delegate_to: localhost
      become: false

    - name: "Filter out users with unresolvable OU paths"
      set_fact:
        _users: "{{ _users_all | selectattr('ad_ou', 'ne', '') | list }}"

    - name: "Fail — a user's CountryCode isn't in _country_lookup"
      fail:
        msg: >-
          {{ item.SamAccountName }} has CountryCode '{{ item.CountryCode }}',
          not covered by _country_lookup in this play's vars: -- add it there
          (2-letter ISO code + full country name) rather than let it silently
          fall through.
      loop: "{{ _users }}"
      loop_control:
        label: "{{ item.SamAccountName }}"
      when: item.CountryCode not in _country_lookup

    # BUG FIX (2026-07-17): items2dict silently keeps only the LAST match when
    # Name repeats -- confirmed live for Bruce Foxton/Rick Buckler (The Jam,
    # Manager: "Paul Weller"): with only this flat dict, both resolved to
    # paul.weller.sc (Style Council) instead of paul.weller (The Jam), since
    # Paul Weller's Style Council record happens to sort last in the file.
    # Added _name_ou_to_sam below, keyed on Name + the reporting user's own
    # ad_ou, so a manager sharing the SAME OU as their report resolves
    # unambiguously -- falls back to this flat dict only for genuine
    # cross-OU management relationships, where there's no same-OU candidate.
    - name: "Build name-to-SAM lookup for manager resolution (fallback for cross-OU managers)"
      set_fact:
        _name_to_sam: "{{ _users | items2dict(key_name='Name', value_name='SamAccountName') }}"

    - name: "Build (name, OU)-scoped SAM lookup for unambiguous same-OU manager resolution"
      set_fact:
        _name_ou_to_sam: "{{ _name_ou_to_sam | default({}) | combine({item.Name ~ '|' ~ item.ad_ou: item.SamAccountName}) }}"
      loop: "{{ _users }}"
      loop_control:
        label: "{{ item.SamAccountName }}"

    - name: "Preflight | Report user count"
      debug:
        msg: >-
          Parsed {{ _users_all | length }} users from ad_users.json;
          {{ _users | length }} have resolvable OU paths
          ({{ _users | selectattr('Disabled') | list | length }} disabled,
           {{ _users | selectattr('Manager') | list | length }} have a manager set).

    # 2026-09-21, Robert's ask -- found live: this play's own "A | Create band sub-OUs" task
    # was mid-loop (364 users, one microsoft.ad.ou call per band member) when a separate,
    # unrelated dead-SSH-connection bug (see ansible.cfg's ServerAliveInterval fix) made it
    # look hung for 90+ minutes. Independent of that fix, this loop was always doing far more
    # work than it needed to: it iterates every USER, not every unique band, so e.g. all 4
    # Roxy Music members triggered 4 identical microsoft.ad.ou calls for the same one OU.
    # Deduplicating first (by the actual (name, parent) pair that gets created), then filtering
    # out any that already exist in AD (same single-query, full-DN-identity approach as
    # 10-ad-schema.yml, not just a count -- see that file's own comment for why), cuts this
    # from up to 364 remote calls down to just the bands that are both unique and genuinely new.

    # 2026-09-22, Robert's ask, found live: this used to be a loop:-driven set_fact
    # accumulator, re-scanning the growing _band_ous_unique list for a duplicate on
    # every one of 364 iterations -- confirmed via dmesg that this whole PATTERN
    # genuinely OOM-kills the ansible-playbook worker (set_fact inside loop: re-copies
    # the ENTIRE host facts/vars dict per iteration, not just the list being built;
    # "Out of memory: Killed process ... anon-rss:1395976kB" on a ~2GB control node).
    # Rewritten as two single-pass Jinja tasks, no loop: on either: build "name|path"
    # keys (a hashable string, unlike the dict itself -- Jinja's unique filter uses a
    # set() internally and raises TypeError on raw dicts, confirmed locally) via the
    # same {% set x %}...{% endset %} text-building pattern used throughout this sweep,
    # dedup with the built-in unique filter, then rebuild the {name, path} dicts from
    # the deduplicated keys in a second single pass. Verified locally against a
    # 4-Roxy-Music-members-plus-1-other case before applying.
    - name: "Build unique band sub-OU keys (single pass, dedup via unique filter)"
      set_fact:
        _band_ous_keys: >-
          {%- set _rendered -%}
          [{% for item in _users %}{% if item.ad_band_ou_name | length > 0 %}{{ (item.ad_band_ou_name ~ '|' ~ item.ad_band_parent) | to_json }},{% endif %}{% endfor %}]
          {%- endset -%}
          {{ _rendered | unique | list }}

    - name: "Rebuild band sub-OU dicts from deduplicated keys"
      set_fact:
        _band_ous_unique: >-
          {%- set _rendered -%}
          [{% for k in _band_ous_keys %}{{ {'name': k.split('|', 1)[0], 'path': k.split('|', 1)[1]} | to_json }},{% endfor %}]
          {%- endset -%}
          {{ _rendered }}

    # 2026-09-21, found live: this domain's OU names include non-ASCII characters
    # (e.g. OU=Mø, OU=Sydøst Jyland, OU=Västra Götaland -- real Danish/Swedish
    # place/band names) -- the raw multi-line win_shell stdout capture this task
    # originally used (Select-Object -ExpandProperty DistinguishedName, one DN per
    # line, no explicit encoding) failed downstream with an opaque error against
    # this exact dataset, while the JSON-based pattern below -- already proven
    # working against this SAME 750-OU dataset, including these same accented
    # names, earlier in this same run via 10-ad-schema.yml's identical query --
    # did not. Switched to match: ConvertTo-Json -InputObject (not a pipe, see
    # that file's own comment for why) forces well-defined UTF-8/escaped-unicode
    # transport, sidestepping whatever raw-stdout encoding path was failing here.
    - name: "Query all existing OUs under the domain (single call, used to skip already-created band OUs below)"
      ansible.windows.win_shell: |
        $results = @(Get-ADOrganizationalUnit -Filter * -SearchBase "{{ _base_dn }}" |
          Select-Object -ExpandProperty DistinguishedName)
        ConvertTo-Json -InputObject $results -Compress
      register: _existing_ous_raw
      changed_when: false

    - name: "Parse existing OU DNs"
      set_fact:
        _existing_ou_dn_list: "{{ (_existing_ous_raw.stdout | trim | length > 0) | ternary(_existing_ous_raw.stdout | from_json, []) }}"

    # 2026-09-21, found live, deterministic across 3 identical failures (ruled out
    # connection timing first -- loosening ansible.cfg's SSH keepalive from 45s to
    # 120s made zero difference, confirming this was never a flaky/timing issue):
    # select('length') is invalid Jinja -- 'length' is a FILTER name, not a TEST
    # name, and passing it to select() raises "No test named 'length'" every single
    # time, unconditionally. Confirmed directly with a standalone Jinja2 render
    # before touching this file. select() with no argument uses the default
    # truthiness test instead, which is exactly what was actually wanted here --
    # an empty/whitespace-only string is falsy in Python, so this correctly drops
    # blank entries after map('trim') without needing a named test at all.
    - name: "Build lowercase set of existing OU DNs"
      set_fact:
        _existing_ou_dns: "{{ _existing_ou_dn_list | map('trim') | select() | map('lower') | list }}"

    - name: "Filter to band sub-OUs not already present"
      set_fact:
        _band_ous_todo: >-
          {%- set _rendered -%}
          [{% for item in _band_ous_unique | default([]) %}{% if ('ou=' + item.name + ',' + item.path) | lower not in _existing_ou_dns %}{{ item | to_json }},{% endif %}{% endfor %}]
          {%- endset -%}
          {{ _rendered }}

    - name: "Preflight | Report band sub-OU count"
      debug:
        msg: >-
          {{ _band_ous_unique | default([]) | length }} unique band sub-OU(s) across
          {{ _users | selectattr('ad_band_ou_name', 'defined') | selectattr('ad_band_ou_name', 'ne', '')
             | list | length }} band members;
          {{ _band_ous_todo | default([]) | length }} not already present.

    # 2026-09-21, Robert's ask -- extending the same skip-existing-work pattern to
    # Sections C/D/E below (group membership, manager, lockout state), NOT Section B
    # (the 17-field user create itself -- Robert's explicit call: too much surface
    # area/risk to compare robustly tonight, left on microsoft.ad.user's own full
    # per-item idempotency). C/D/E are each a much narrower, single-purpose check
    # per user, and E in particular currently calls "unlock" on literally every one
    # of the 364 users on every single re-run regardless of whether they were ever
    # locked (only ~9 genuinely are) -- one query here removes that dead weight.
    # Group names are extracted from MemberOf DNs in PowerShell (far simpler and more
    # robust than attempting DN-parsing in Jinja); Manager's DN is resolved back to a
    # SamAccountName using this SAME query's own DistinguishedName/SamAccountName
    # pairs, since a user's manager (if set) is itself one of these same 364 records.
    # 2026-09-22, extended: also fetches Enabled now, used by the F | Recover
    # section below -- same single call, one more -Properties/Select-Object
    # field, costs nothing for the C/D/E filters which don't read it.
    - name: "Query existing user group memberships, manager, and lockout state (single call)"
      ansible.windows.win_shell: |
        $results = @(Get-ADUser -Filter * -Properties MemberOf,Manager,LockedOut,Enabled |
          Select-Object SamAccountName, DistinguishedName, LockedOut, Enabled,
            @{Name='ManagerDN';Expression={$_.Manager}},
            @{Name='GroupNames';Expression={ @($_.MemberOf | ForEach-Object { ($_ -split ',',2)[0] -replace '^CN=','' }) }})
        ConvertTo-Json -InputObject $results -Compress -Depth 4
      register: _existing_user_state_raw
      changed_when: false

    - name: "Parse existing user state"
      set_fact:
        _existing_user_state: "{{ (_existing_user_state_raw.stdout | trim | length > 0) | ternary(_existing_user_state_raw.stdout | from_json, []) }}"

    - name: "Build SamAccountName(lowercase) -> record lookup, and DistinguishedName(lowercase) -> SamAccountName(lowercase) lookup"
      set_fact:
        _existing_user_by_sam: >-
          {{
            dict(
              _existing_user_state | map(attribute='SamAccountName') | map('lower') | list
              | zip(_existing_user_state)
            )
          }}
        _dn_to_sam: >-
          {{
            dict(
              _existing_user_state | map(attribute='DistinguishedName') | map('lower') | list
              | zip(_existing_user_state | map(attribute='SamAccountName') | map('lower') | list)
            )
          }}

    # 2026-09-22, Robert's ask, found live: these three were the exact tasks that hit
    # "A worker was found in a dead state" -- confirmed via dmesg on EXAANSFRD001 as a
    # genuine OOM kill (anon-rss:1395976kB on a ~2GB control node), not the SSH/
    # ControlPersist timing theories tried first (both disproven live: the crash moved
    # to a different task when ControlPersist was bumped 60s->300s, instead of going
    # away). Root cause: set_fact inside loop: re-copies the ENTIRE host facts/vars
    # dict on every one of 364 iterations, not just the one list being built -- by this
    # point in the run that dict already carries everything accumulated from earlier
    # plays (750 OUs, 111 groups, computer/user lookups), so the cost compounds.
    # Rewritten as a single Jinja pass each (one set_fact, no loop:), building the
    # filtered list as JSON text via {% set x %}...{% endset %} (core Jinja2 syntax,
    # no extensions), same pattern applied throughout this sweep -- verified locally
    # against new/matching/drifted-case mock data for all three conditions before
    # applying here, including the manager one's nested DN/lookup resolution.
    - name: "Filter to group-membership adds not already fully present"
      set_fact:
        _group_add_todo: >-
          {%- set _rendered -%}
          [{% for item in _users %}{% if (item.Groups | length > 0 and (item.SamAccountName | lower not in _existing_user_by_sam or (item.Groups | map('lower') | list | difference(_existing_user_by_sam[item.SamAccountName | lower].GroupNames | default([]) | map('lower') | list) | length > 0))) %}{{ item | to_json }},{% endif %}{% endfor %}]
          {%- endset -%}
          {{ _rendered }}

    - name: "Filter to manager updates not already correct"
      set_fact:
        _manager_todo: >-
          {%- set _rendered -%}
          [{% for item in _users %}{% if (item.Manager | length > 0 and ((item.Manager ~ '|' ~ item.ad_ou) in _name_ou_to_sam or item.Manager in _name_to_sam) and (item.SamAccountName | lower not in _existing_user_by_sam or (_dn_to_sam[(_existing_user_by_sam[item.SamAccountName | lower].ManagerDN | default('')) | lower] | default('')) != ((_name_ou_to_sam[item.Manager ~ '|' ~ item.ad_ou] | default(_name_to_sam[item.Manager])) | lower))) %}{{ item | to_json }},{% endif %}{% endfor %}]
          {%- endset -%}
          {{ _rendered }}

    - name: "Filter to lockout state changes needed"
      set_fact:
        _lock_todo: >-
          {%- set _rendered -%}
          [{% for item in _users %}{% if (item.SamAccountName | lower not in _existing_user_by_sam or (_existing_user_by_sam[item.SamAccountName | lower].LockedOut | default(false)) != (item.Locked | default(false))) %}{{ item | to_json }},{% endif %}{% endfor %}]
          {%- endset -%}
          {{ _rendered }}

    # 2026-09-22, found live: a handful of accounts (Fiction Factory/Perth,
    # Marillion+Proclaimers/Edinburgh) ended up stuck Enabled=False with a
    # password that doesn't meet current domain policy -- confirmed via
    # Get-ADUser mogletree: PasswordLastSet had a real recent value (a
    # password WAS set) but Enabled was False. Root cause, most likely:
    # fallout from Ctrl+C interrupting the earlier serial run mid-flight for
    # these exact accounts, not something the async batching above
    # introduced. update_password: on_create (used by B | Create user
    # accounts) is a confirmed no-op for existing objects (verified by
    # reading microsoft.ad.user's own password Set delegate --
    # `on_create { $false }` returns immediately without calling
    # Set-ADAccountPassword), so normal re-runs can never self-heal this --
    # AD refuses to flip Enabled=True via Set-ADUser while the stored
    # password doesn't satisfy policy, which is the literal
    # "password does not meet length, complexity, or history requirement"
    # error seen live (it's not about setting a NEW password, it's AD
    # blocking the enable itself). Scoped narrowly to accounts that both (a)
    # already exist and are Enabled=False, and (b) should be enabled per
    # ad_users.json (item.Disabled == false) -- does not touch the other
    # ~350+ users at all. F | below uses update_password: always for ONLY
    # this list, which is safe here because microsoft.ad.user runs
    # Set-ADAccountPassword (inline, per-property) before the deferred
    # Set-ADUser call that applies Enabled=true in the same invocation --
    # confirmed by reading the property definition/dispatch order in
    # microsoft.ad's shared _ADObject.psm1 -- so the fresh, policy-compliant
    # password lands before the enable attempt, in the same task run.
    - name: "Filter to accounts stuck disabled with a non-compliant password"
      set_fact:
        _password_reset_todo: >-
          {%- set _rendered -%}
          [{% for item in _users %}{% if (not item.Disabled and item.SamAccountName | lower in _existing_user_by_sam and not (_existing_user_by_sam[item.SamAccountName | lower].Enabled | default(true))) %}{{ item | to_json }},{% endif %}{% endfor %}]
          {%- endset -%}
          {{ _rendered }}

    - name: "Preflight | Report C/D/E work needed"
      debug:
        msg: >-
          Group adds: {{ _group_add_todo | default([]) | length }} user(s) need at least one group added.
          Manager: {{ _manager_todo | default([]) | length }} user(s) need a manager set/corrected.
          Lockout: {{ _lock_todo | default([]) | length }} user(s) need a lock/unlock state change.
          Password reset: {{ _password_reset_todo | default([]) | length }} user(s) stuck disabled with a non-compliant password.

  tasks:

    # -------------------------------------------------------------------------
    # Section A — Band sub-OUs
    # Create band/team OUs under each city's Users OU.
    # These are not created by 10-ad-schema.yml (schema only has the city OUs).
    # The microsoft.ad.ou module is idempotent: re-running is safe. Loop is
    # pre_tasks-deduplicated and pre-filtered against what already exists in AD
    # (see "Deduplicate band sub-OUs"/"Filter to band sub-OUs" above) -- this no
    # longer iterates all 364 users, only the unique bands genuinely missing.
    # -------------------------------------------------------------------------

    - name: "A | Create band sub-OUs under city Users OUs"
      microsoft.ad.ou:
        name:                 "{{ item.name }}"
        path:                 "{{ item.path }}"
        state:                present
        protect_from_deletion: true
      loop: "{{ _band_ous_todo | default([]) }}"
      loop_control:
        label: >-
          OU={{ item.name }},{{ item.path | regex_replace(',DC=.*$','') }}

    # -------------------------------------------------------------------------
    # Section B — User accounts
    # update_password: on_create — only sets the vault password on first creation.
    # existing accounts keep their current password on re-runs.
    # -------------------------------------------------------------------------

    # BUG FIX (2026-07-17): only `country` had an `if X else omit` guard --
    # confirmed against microsoft.ad.user's own docs that every one of these
    # params defaults to null (i.e. omitted = unset), meaning passing an
    # explicit empty string is a different, riskier thing than not passing
    # the param at all. 7 fields have real blank values in the data:
    # telephoneNumber (23 users), mobile (89), Street/City/PostalCode
    # (31-33 each), physicalDeliveryOfficeName (1 -- Vince Clarke), and
    # surname would compute to '' for Shovell (M People, a real one-word
    # stage name with no space to split Name on). Guarded all 7 the same way
    # country already was.

    # 2026-09-22, found live: this was Section B's first real execution ever
    # against an actual AD server (every previous run died earlier from the
    # OOM/templating bugs above before reaching it) -- surfaced that several
    # of its own module param names were never valid for the installed
    # microsoft.ad collection: "Unsupported parameters for (microsoft.ad.user)
    # module: street_address, department, office, telephone_number, title,
    # mobile_phone, given_name, email_address". Checked the real installed
    # module's argspec directly (ansible-doc microsoft.ad.user, matching venv)
    # rather than guess from the error text alone: firstname (not given_name),
    # email (not email_address), street (not street_address) are real
    # top-level params; surname was already correct (aliases: lastname, was
    # never the problem). title/department/telephoneNumber/mobile/
    # physicalDeliveryOfficeName have NO dedicated module param at all --
    # moved into attributes.set alongside co, using their real LDAP attribute
    # names (physicalDeliveryOfficeName already matched the ad_users.json
    # field name used for office, confirming that was always the intent).
    # `omit` doesn't work nested inside attributes.set (per the existing
    # comment below on co) -- telephoneNumber/mobile/physicalDeliveryOfficeName
    # can be blank per-user (e.g. Bryan Adams has no mobile), so built via
    # combine() with a conditional empty-dict fallback instead, verified
    # locally (present and blank cases) against ansible-core 2.17.14's Templar
    # before applying.
    # -------------------------------------------------------------------------
    # Section F — Recover accounts stuck disabled with a non-compliant password
    # See "Filter to accounts stuck disabled with a non-compliant password"
    # above (pre_tasks) for the full root-cause writeup. update_password:
    # always is deliberately scoped to ONLY _password_reset_todo -- Section B
    # below keeps update_password: on_create for everyone else, unchanged.
    #
    # 2026-09-22, found live: MUST run before Section B, not after -- Section
    # B has no failure tolerance (no ignore_errors), so when it re-hits one of
    # these already-broken accounts on a normal re-run, the whole play aborts
    # right there and nothing after it (C/D/E, and F if F were positioned
    # after B as originally written) ever runs at all. Moved ahead of B so
    # these accounts are already fixed by the time B's own update pass
    # reaches them, letting B's pass over them be a clean no-op instead of a
    # repeat failure.
    # -------------------------------------------------------------------------

    # 2026-09-22, found live: "New-ADUser failed: The specified account
    # already exists" -- Section F was missing path:. Confirmed by reading
    # microsoft.ad's shared _ADObject.psm1 directly (Invoke-AnsibleADObject,
    # ~line 1128): when identity: isn't set, the module builds its own
    # existence-check DN as "CN=<name>,<path>" -- and when path: isn't set
    # either, <path> falls back to the DOMAIN ROOT (defaultNamingContext),
    # not the object's real OU. So the lookup searched for
    # "CN=Wayne Norris,DC=jukebox,DC=internal" (wrong, doesn't exist) instead
    # of the real "CN=Wayne Norris,OU=Builders,OU=Users,OU=Dresden,...",
    # concluded the account was new, and called New-ADUser -- which AD then
    # correctly rejected since the SamAccountName genuinely already exists
    # elsewhere in the tree. Section B already sets path: and has never hit
    # this. Fixed by adding it here too.
    # 2026-09-22, Robert's ask: the combined password+enable call above kept
    # hanging with no error and zero footprint on the DC (confirmed via
    # Get-WSManInstance/Get-Process wsmprovhost -- nothing running there at
    # all, and the control node's ansible-playbook processes sitting near 0%
    # CPU, SSH tunnel ESTAB but idle). Manually reproducing the SAME two
    # operations as separate, plain cmdlets (Set-ADAccountPassword then
    # Enable-ADAccount) worked instantly with zero issues -- split into two
    # tasks here to match that proven-working shape exactly, rather than one
    # bundled microsoft.ad.user call. Welcome2026! is a fixed, known initial
    # password -- Robert's explicit call, dev environment only, not a
    # production password policy decision.
    # 2026-09-22, found live: once F1 has successfully set Welcome2026! for a
    # user, re-running F1 against that SAME user again (still Enabled=False,
    # since F2 hadn't run yet when the session ended) fails --
    # Set-ADAccountPassword rejects "resetting" a password to the value it
    # already IS, via AD's own history check (always index-0, rejected
    # regardless of -Reset) -- confirmed via this exact mechanism live
    # against the vault password earlier the same session. _password_reset_todo
    # has no way to know F1 already succeeded for a given user (only tracks
    # Enabled state, which F1 doesn't touch), so this WILL recur every re-run
    # until F2 actually reaches and enables these accounts. ignore_errors here
    # because the failure is harmless in outcome -- the end state (password =
    # Welcome2026!) is identical whether this task "succeeds" or hits the
    # already-set case.
    - name: "F1 | Reset password for accounts stuck disabled with a non-compliant password"
      microsoft.ad.user:
        name:             "{{ item.Name }}"
        sam_account_name: "{{ item.SamAccountName }}"
        path:             "{{ item.ad_ou }}"
        password:         "Welcome2026!"
        update_password:  always
        state:            present
      loop: "{{ _password_reset_todo | default([]) }}"
      loop_control:
        label: "{{ item.SamAccountName }}"
      ignore_errors: true

    - name: "F2 | Enable accounts stuck disabled with a non-compliant password"
      microsoft.ad.user:
        name:             "{{ item.Name }}"
        sam_account_name: "{{ item.SamAccountName }}"
        path:             "{{ item.ad_ou }}"
        enabled:          true
        state:            present
      loop: "{{ _password_reset_todo | default([]) }}"
      loop_control:
        label: "{{ item.SamAccountName }}"

    # 2026-09-22, Robert's ask: 364 serial microsoft.ad.user calls (one WinRM
    # round-trip each) took over an hour on the full cold populate -- no
    # errors in that time, good evidence the param-name fix above is correct,
    # just slow. forks (ansible.cfg) doesn't help here -- it parallelises
    # across HOSTS, not loop items on a single host. Batched async/poll:0
    # instead (tasks/create_users_batch.yml): fires up to 20 creates at once,
    # waits for that batch, then moves to the next -- same per-user module
    # logic as before, unchanged, just dispatched differently. 20 is Robert's
    # own number, chosen to stay comfortably under WinRM's default 30
    # concurrent-shells-per-user cap without needing to raise anything on the
    # DC first.
    - name: "B | Split users into batches of 20 for capped-concurrency async creation"
      set_fact:
        _b_batches: "{{ _users | batch(20) | list }}"

    - name: "B | Create user accounts, batches of 20"
      include_tasks: ../tasks/create_users_batch.yml
      loop: "{{ _b_batches }}"
      loop_control:
        loop_var: _b_batch
        label: "batch of {{ _b_batch | length }}"

    # -------------------------------------------------------------------------
    # Section C — Group membership
    # Groups are added, not replaced (groups_action: add).
    # Errors are ignored — some TDF group names don't match AD group names
    # (e.g. 'Keyboardists' vs 'Keyboards'). Run 20-ad-groups.yml first to
    # minimise mismatches.
    # -------------------------------------------------------------------------

    # 2026-09-22, found live in Section F, swept here too: microsoft.ad.user's
    # existence-check builds its own lookup DN as "CN=<name>,<path>" whenever
    # identity: isn't set (confirmed by reading _ADObject.psm1's
    # Invoke-AnsibleADObject, ~line 1128) -- without path: here, <path> falls
    # back to the domain root instead of the real OU, the lookup finds
    # nothing, and the module concludes the account is new. See Section F's
    # comment below for the full writeup; this section had never actually run
    # yet tonight (every prior run died earlier in the play), so the same bug
    # hadn't surfaced here yet.
    - name: "C | Add users to groups"
      microsoft.ad.user:
        name:             "{{ item.Name }}"
        sam_account_name: "{{ item.SamAccountName }}"
        path:             "{{ item.ad_ou }}"
        groups:
          add: "{{ item.Groups }}"
        state: present
      loop:  "{{ _group_add_todo | default([]) }}"
      loop_control:
        label: "{{ item.SamAccountName }} → {{ item.Groups | join(', ') }}"
      ignore_errors: true

    # -------------------------------------------------------------------------
    # Section D — Manager
    # Runs after all accounts exist so the manager DN can be resolved.
    # Manager in the TDF is a display name; we resolve it to a SamAccountName,
    # preferring a candidate in the SAME ad_ou as the report (handles people
    # who share a display name across different bands/OUs, e.g. two "Paul
    # Weller" records for The Jam vs Style Council), falling back to the flat
    # _name_to_sam lookup for genuine cross-OU management relationships.
    # Users whose manager is not in the TDF (e.g. external or unlisted) are
    # silently skipped by the 'when' condition.
    # -------------------------------------------------------------------------

    - name: "D | Set manager attribute"
      microsoft.ad.user:
        name:             "{{ item.Name }}"
        sam_account_name: "{{ item.SamAccountName }}"
        path:             "{{ item.ad_ou }}"
        manager:          "{{ _name_ou_to_sam[item.Manager ~ '|' ~ item.ad_ou] | default(_name_to_sam[item.Manager]) }}"
        state:            present
      loop: "{{ _manager_todo | default([]) }}"
      loop_control:
        label: "{{ item.SamAccountName }} ← manager: {{ item.Manager }}"

    # -------------------------------------------------------------------------
    # Section E — Account lockout state
    # BUG FIX (2026-07-17): this docstring used to say Locked=$true accounts
    # were "not reproducible programmatically" -- confirmed against
    # microsoft.ad.user's own docs that account_locked only accepts `false`
    # (unlock); the module deliberately has no way to SET a lockout, since
    # real AD lockouts are a side effect of failed logons, not an admin
    # action. There is still a real, correct way to force it: AD represents
    # lockout via the lockoutTime attribute directly, settable through the
    # generic attributes: mechanism this file already uses nowhere else but
    # 40-ad-computers.yml does for OS fields. 9 real users have Locked=true
    # in the source data, including at least one (Alan Wilder) who is NOT
    # also Disabled -- a genuinely distinct state this file dropped entirely
    # before now.
    #
    # Caveat worth knowing: unlike a real lockout, this doesn't expire on its
    # own according to the domain's account lockout duration policy unless
    # that policy is itself set to indefinite (0, common, but not universal)
    # -- re-running with Locked=false in the source data clears it via the
    # module's own native account_locked: no, which IS fully supported.
    # -------------------------------------------------------------------------

    # Both tasks below loop over _lock_todo (pre-filtered against live LockedOut
    # state, see "Filter to lockout state changes needed" above), not all 364 users
    # -- previously "Unlock" fired on literally every single user every re-run
    # regardless of whether they were ever locked (only ~9 genuinely are), the single
    # biggest avoidable round-trip in this whole file.

    - name: "E | Lock accounts (Locked=true in source data)"
      microsoft.ad.user:
        name:             "{{ item.Name }}"
        sam_account_name: "{{ item.SamAccountName }}"
        path:             "{{ item.ad_ou }}"
        attributes:
          set:
            lockoutTime:
              type:  date_time
              value: "{{ now(utc=true).strftime('%Y-%m-%dT%H:%M:%SZ') }}"
        state:            present
      when: item.Locked | default(false)
      loop: "{{ _lock_todo | default([]) }}"
      loop_control:
        label: "{{ item.SamAccountName }}"

    - name: "E | Unlock accounts (Locked=false in source data)"
      microsoft.ad.user:
        name:             "{{ item.Name }}"
        sam_account_name: "{{ item.SamAccountName }}"
        path:             "{{ item.ad_ou }}"
        account_locked:   false
        state:            present
      when: not (item.Locked | default(false))
      loop: "{{ _lock_todo | default([]) }}"
      loop_control:
        label: "{{ item.SamAccountName }}"
