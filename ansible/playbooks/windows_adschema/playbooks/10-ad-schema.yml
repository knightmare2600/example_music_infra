---
# =============================================================================
# playbooks/10-ad-schema.yml
# Example Music Limited — Active Directory OU Schema Playbook
# =============================================================================
# ⚠  ADDITIVE ONLY — This playbook NEVER deletes OUs or objects.
#     state: present is used throughout. Re-running is fully idempotent.
#     To remove an OU: use ADUC (dsa.msc) or a targeted ad-hoc task.
#     DO NOT add state: absent tasks to this playbook.
#     DO NOT set ad_force_absent — the safety check task will abort the run.
#
# Builds the complete OU hierarchy from sites.csv:
#
#   DC=jukebox,DC=internal
#   ├── OU=Sites
#   │   ├── OU=Europe
#   │   │   ├── OU=United Kingdom
#   │   │   │   ├── OU=Scotland
#   │   │   │   │   └── OU=Falkirk          (FAL)
#   │   │   │   │       ├── OU=Users
#   │   │   │   │       ├── OU=Devices
#   │   │   │   │       │   ├── OU=Workstations
#   │   │   │   │       │   ├── OU=Servers
#   │   │   │   │       │   ├── OU=Infrastructure
#   │   │   │   │       │   ├── OU=Telephony
#   │   │   │   │       │   ├── OU=AV
#   │   │   │   │       │   ├── OU=IoT
#   │   │   │   │       │   └── OU=Assets
#   │   │   │   │       └── OU=Groups
#   │   │   │   └── OU=England  (+ all England cities)
#   │   │   ├── OU=Germany  ├── OU=Denmark  ├── OU=Netherlands
#   │   │   ├── OU=Sweden   ├── OU=Italy    ├── OU=Norway  ├── OU=Austria
#   │   ├── OU=North America
#   │   │   ├── OU=Canada
#   │   │   │   ├── OU=Ontario  (BRK, TOR)
#   │   │   │   └── OU=Quebec   (MTL)
#   │   │   └── OU=United States
#   │   │       ├── OU=Georgia (ATL)  ├── OU=Illinois (CHI)
#   │   │       ├── OU=California (LAX)  ├── OU=Florida (MIA)
#   │   │       ├── OU=New York (NYC)
#   │   │       └── OU=New Jersey (NJC — flat, no state sub-OU)
#   │   ├── OU=Asia Pacific
#   │   │   ├── OU=Australia    (MEL, SYD)
#   │   │   └── OU=New Zealand  (AKL)
#   │   ├── OU=Middle East
#   │   │   └── OU=Lebanon  (BRT)
#   │   └── OU=Cloud Infrastructure
#   │       ├── OU=Users
#   │       ├── OU=Devices  (+ sub-OUs)
#   │       ├── OU=Groups
#   │       └── OU=Service Accounts
#   ├── OU=IT Groups
#   │   ├── OU=Security Groups
#   │   └── OU=Distribution Groups
#   ├── OU=Service Accounts
#   └── OU=Disabled
#       ├── OU=Users
#       └── OU=Computers
#
# Usage:
#   # Normal path — run via site.yml, prompted once by 00-ad-preflight.yml:
#   ansible-playbook playbooks/windows_adschema/site.yml -i <inventory> -e populate_ad=yes
#
#   # Standalone run — supply the target directly, no prompt available here:
#   ansible-playbook playbooks/windows_adschema/playbooks/10-ad-schema.yml -e ad_target=<host> --ask-vault-pass
#
#   # Check mode (dry run — shows what would be created)
#   ansible-playbook playbooks/windows_adschema/playbooks/10-ad-schema.yml -e ad_target=<host> --check --diff
#
# Prerequisites:
#   ansible-galaxy collection install -r ../requirements.yml
#
# Variables (override with --extra-vars if needed):
#   ad_domain        AD domain FQDN        (default: jukebox.internal)
#   sites_csv_path   Path to sites.csv     (default: /etc/example-music/sites.csv)
#   ad_target        Target DC hostname or IP — comes from 00-ad-preflight.yml's
#                    prompt when run via site.yml, or must be supplied with
#                    -e ad_target=<host> if run standalone
# =============================================================================
# Version history
# =============================================================================
# v1.0.0  2026-06-29  Initial release. Full OU hierarchy from sites.csv.
#                     Continent derived from AnsibleRegion; Province column
#                     added to sites.csv for UK nations and CA/US states.
# v1.1.0  2026-07-04  Removed hardcoded ad_target default (EXADCSFAL001) —
#                     was a leftover from testing. ad_target is now prompted
#                     for interactively via 00-ad-preflight.yml, or can be
#                     supplied with -e ad_target=<host> to skip the prompt.
# v1.2.0  2026-07-04  Moved into windows_adschema/playbooks/ as part of the
#                     windows_bootstrap-style restructure (numbered stages,
#                     shared tasks/, site.yml chain, no tags). Renamed from
#                     ad_schema.yml to 10-ad-schema.yml. Inline microsoft.ad
#                     collection check replaced with a shared include:
#                     ../tasks/ad_collection_check.yml.
# v1.3.0  2026-07-09  ad_domain's fallback (when dc_domain_name isn't set --
#                     i.e. standalone runs not preceded by windows_dc/00-dc-
#                     preflight.yml) changed from a hardcoded 'jukebox.internal'
#                     literal to exa_domain, which is itself now derived from
#                     benarbejde/ad_forest.json (single source of truth).
# v1.3.1  2026-07-17  Section 2's country-OU filter only rejected Country ==
#                     'Global' (CLD), letting FRD (Country=Denmark,
#                     continent=Cloud Infrastructure) through and creating an
#                     orphan OU=Denmark,OU=Cloud Infrastructure -- Section 4's
#                     city-OU filter already correctly excludes continent ==
#                     'Cloud Infrastructure' sites, so nothing was ever created
#                     inside it. Section 2 now rejects the same continent,
#                     matching Section 4. Also added Province for HAL/ATL/NYC
#                     in sites.csv (were inconsistently blank vs every other
#                     comparable city) and regenerated ad_computers.json,
#                     which picked up one real fix: an Atlanta infrastructure
#                     device now gets OU=Georgia in its path. ad_users.json
#                     was unaffected by the sites.csv change -- user OU paths
#                     are derived entirely from the source .tdf's own OU-array
#                     notation (parse_tdf.py's _user_ou_path()), not from
#                     sites.csv, so the ~21 users placed at country level for
#                     Atlanta/NYC are a property of that frozen demo data, not
#                     this schema gap.
# =============================================================================

- name: Build Active Directory OU schema
  hosts: "{{ ad_target | default(hostvars['localhost']['ad_target'] | default('localhost')) }}"
  gather_facts: false
  become: false

  vars:
    ad_domain:      "{{ dc_domain_name | default(exa_domain) }}"
    sites_csv_path: "/etc/example-music/sites.csv"

    # Set ad_email_domain to your routable email domain when it differs from
    # the AD internal domain (e.g. ad_email_domain: "example1.co.uk").
    # That domain will be added to ad_upn_suffixes and registered in the forest
    # so users can log in as user@example1.co.uk.
    # Leave as-is for internal-only / demo environments (jukebox.internal is
    # the forest root and is automatically available as a UPN suffix).
    ad_email_domain: "{{ ad_domain }}"
    ad_upn_suffixes: "{{ [ad_email_domain] if ad_email_domain != ad_domain else [] }}"

    # Maps AnsibleRegion values to continent OU names.
    _region_continent:
      uk_site:    "Europe"
      de_site:    "Europe"
      dk_site:    "Europe"
      eu_site:    "Europe"
      lb_site:    "Middle East"
      us_site:    "North America"
      ca_site:    "North America"
      apac_site:  "Asia Pacific"
      cloud_site: "Cloud Infrastructure"

    # Device sub-OUs created under each city's Devices OU.
    # Align with Type prefixes from devices.csv:
    #   Workstations: WKS, LAP, SUR, MAC, MBP
    #   Servers:      DCS, SRV, SVR, SBC, RDR
    #   Infrastructure: FWL, RTR, SWI, BMC, PVE, NAS, NIX
    #                 (BMC supersedes the legacy RAC prefix)
    #   Telephony:    PHN, PBX, PAY
    #   AV:           VCU, LCD, TVS, MIC, RAD
    #   IoT:          CAM, CLK, WAP, PMP, TEA, COF, PRN, DON, VND, MUS, TTY
    #   Assets:       BUS, CAR, TRK, JET, AST, MOO, TAB
    _device_sub_ous:
      - Workstations
      - Servers
      - Infrastructure
      - Telephony
      - AV
      - IoT
      - Assets

  pre_tasks:

    - name: "Skip — populate_ad not requested"
      meta: end_play
      when: (populate_ad | default('no')) | lower not in ['yes', 'y']

    - name: Gate on /etc/example-music/* freshness
      include_tasks: ../../../tasks/example_music_freshness_gate.yml
      vars:
        example_music_gate_files: [sites.csv]
        example_music_gate_repo_root: "{{ playbook_dir }}/../../../.."

    - name: "Fail — no target Domain Controller resolved"
      fail:
        msg: >
          No target Domain Controller was resolved from the prompt or
          -e ad_target=<host>. Re-run the play.
      when: inventory_hostname == 'localhost'

    - name: Include microsoft.ad collection preflight check
      include_tasks: ../tasks/ad_collection_check.yml

    - name: "Safety check — this playbook must never delete OUs"
      assert:
        that:
          - ad_force_absent is not defined
        fail_msg: >
          ABORTED. This playbook is ADDITIVE ONLY (state: present throughout).
          Do not set ad_force_absent. Remove OUs manually via ADUC/DSA.MSC.

    - name: "Read sites.csv from control node"
      read_csv:
        path: "{{ sites_csv_path }}"
      register: _sites_raw
      delegate_to: localhost
      become: false
      vars:
        # read_csv is a real module (not a lookup plugin) -- it dispatches
        # through whatever connection is configured for the delegated host.
        # Without this, delegate_to: localhost does not run locally -- the
        # group ansible_connection: ssh from group_vars/windows_nodes/
        # connection.yml applies here too, outranking implicit localhost's
        # own ansible_connection: local default, so Ansible would try to SSH
        # from the control node to itself as the Windows Administrator user.
        # See windows_bootstrap/playbooks/00-preflight.yml's 2026-07-15
        # changelog for the live failure this exact pattern caused there.
        ansible_connection: local
        # Second, separate override needed alongside ansible_connection: local --
        # windows_nodes' inherited ansible_shell_type: powershell makes Ansible
        # try to dispatch read_csv's underlying module invocation via PowerShell
        # even while running locally on this Linux control node. Same bug class
        # as ad_collection_check.yml's 2026-07-28 fix and windows_dc/
        # 00-dc-preflight.yml's identically-shaped "Load sites.csv" task (found
        # live 2026-09-21, EXADCSFRD001) -- this file's own copy of the same
        # read_csv-from-localhost pattern had the identical gap.
        ansible_shell_type: sh

    - name: "Compute base DN from domain"
      set_fact:
        _base_dn: "DC={{ ad_domain.split('.') | join(',DC=') }}"

    # 2026-09-21, Robert's ask, found live re-running windows_adschema against EXADCSFRD001:
    # every microsoft.ad.ou task below is already idempotent per-item, but on a re-run where
    # almost everything already exists, that idempotency is only ever confirmed by actually
    # dispatching a real remote call for EVERY item -- hundreds of individual SSH+PowerShell
    # round trips even when nothing needs to change. One single query here, up front, gets the
    # full set of OUs that already exist anywhere in the domain; each section below then only
    # loops over the items whose computed DN isn't already in that set, so an already-built
    # schema re-run skips straight past sections that have nothing left to do. Deliberately a
    # full DN identity comparison, not a count -- a count match can't tell a genuine "nothing
    # to do" apart from "same number of OUs, but one got renamed", which would then silently
    # skip a real, needed correction.
    # Also fetches Description, not just DistinguishedName -- Section 4 (city OUs) below is
    # the one stage that sets a field beyond name/path, so it needs to re-check content, not
    # just existence, to keep self-correcting a drifted description on re-run. Every other
    # section only ever uses _existing_ou_dns (identity alone), so this costs nothing extra
    # for them -- one shared query either way.
    - name: "Query all existing OUs under the domain (single call, used to skip already-created OUs below)"
      ansible.windows.win_shell: |
        $results = @(Get-ADOrganizationalUnit -Filter * -SearchBase "{{ _base_dn }}" -Properties Description |
          Select-Object DistinguishedName, Description)
        # ConvertTo-Json -InputObject (not a pipe) is required here, not just wrapping
        # $results in @() -- piping an array into ConvertTo-Json unrolls it element by
        # element, so a 0- or 1-item result serializes as "null"/a bare object instead of
        # a JSON array, which | from_json below can't parse consistently. -InputObject
        # passes the whole array as one argument, always producing an array (this box
        # runs Windows PowerShell 5.1, not 7+, so the newer -AsArray switch isn't available).
        ConvertTo-Json -InputObject $results -Compress
      register: _existing_ous_raw
      changed_when: false

    - name: "Parse existing OUs (DN + Description)"
      set_fact:
        _existing_ous: "{{ (_existing_ous_raw.stdout | trim | length > 0) | ternary(_existing_ous_raw.stdout | from_json, []) }}"

    - name: "Build lowercase set of existing OU DNs"
      set_fact:
        _existing_ou_dns: "{{ _existing_ous | map(attribute='DistinguishedName') | map('lower') | list }}"

    - name: "Build DN(lowercase) -> Description lookup"
      set_fact:
        _existing_ou_descriptions: >-
          {{
            dict(
              _existing_ous | map(attribute='DistinguishedName') | map('lower') | list
              | zip(_existing_ous | map(attribute='Description') | map('default', '', true) | list)
            )
          }}

    - name: "Preflight | Report existing OU count"
      debug:
        msg: "{{ _existing_ou_dns | length }} OU(s) already exist under {{ _base_dn }} -- sections below only create/update what's missing or drifted."

    - name: "Attach continent and parent city path to each site"
      set_fact:
        _sites: >-
          {{ _sites | default([]) + [_s] }}
      vars:
        _cont:  "{{ _region_continent[item.AnsibleRegion] }}"
        _prov:  "{{ item.Province | default('') }}"
        _cpath: >-
          {{
            'OU=Cloud Infrastructure,OU=Sites,' + _base_dn
            if _cont == 'Cloud Infrastructure'
            else (
              'OU=' + _prov + ',OU=' + item.Country + ',OU=' + _cont + ',OU=Sites,' + _base_dn
              if _prov != ''
              else 'OU=' + item.Country + ',OU=' + _cont + ',OU=Sites,' + _base_dn
            )
          }}
        _s: "{{ item | combine({'_continent': _cont, '_prov': _prov, '_cpath': _cpath}) }}"
      loop: "{{ _sites_raw.list }}"
      loop_control:
        label: "{{ item.Site }}"

    - name: "Build unique continent list"
      set_fact:
        _continents: "{{ _sites | map(attribute='_continent') | unique | sort | list }}"

    - name: "Build unique continent-country pairs"
      set_fact:
        _cc_pairs: >-
          {{ _cc_pairs | default([]) +
             ([{'continent': item._continent, 'country': item.Country}]
              if {'continent': item._continent, 'country': item.Country}
                 not in _cc_pairs | default([])
              else []) }}
      loop: >-
        {{ _sites | rejectattr('Country', 'equalto', 'Global')
                  | rejectattr('_continent', 'equalto', 'Cloud Infrastructure') | list }}
      loop_control:
        label: "{{ item.Country }} ({{ item._continent }})"

    - name: "Build unique continent-country-province triples"
      set_fact:
        _ccp_triples: >-
          {{ _ccp_triples | default([]) +
             ([{'continent': item._continent, 'country': item.Country, 'province': item._prov}]
              if item._prov != ''
              and {'continent': item._continent, 'country': item.Country, 'province': item._prov}
                  not in _ccp_triples | default([])
              else []) }}
      loop: "{{ _sites }}"
      loop_control:
        label: "{{ item.Site }}"

  tasks:

    # -------------------------------------------------------------------------
    # Section 0 — Root OUs directly under the domain
    # -------------------------------------------------------------------------

    - name: "0 | Filter to root OUs not already present"
      set_fact:
        _s0_todo: >-
          {{
            _s0_todo | default([]) +
            ([item] if ('ou=' + item + ',' + _base_dn) | lower not in _existing_ou_dns else [])
          }}
      loop:
        - Sites
        - IT Groups
        - Service Accounts
        - Disabled

    - name: "0 | Create root OUs"
      microsoft.ad.ou:
        name: "{{ item }}"
        path: "{{ _base_dn }}"
        state: present
        protect_from_deletion: true
      loop: "{{ _s0_todo | default([]) }}"

    # -------------------------------------------------------------------------
    # Section 1 — Continent OUs under Sites
    # -------------------------------------------------------------------------

    - name: "1 | Filter to continent OUs not already present"
      set_fact:
        _s1_todo: >-
          {{
            _s1_todo | default([]) +
            ([item] if ('ou=' + item + ',ou=sites,' + _base_dn) | lower not in _existing_ou_dns else [])
          }}
      loop: "{{ _continents }}"

    - name: "1 | Create continent OUs"
      microsoft.ad.ou:
        name: "{{ item }}"
        path: "OU=Sites,{{ _base_dn }}"
        state: present
        protect_from_deletion: true
      loop: "{{ _s1_todo | default([]) }}"

    # -------------------------------------------------------------------------
    # Section 2 — Country OUs
    # CLD (Country=Global) is handled separately in Section 7 — skip it here.
    # -------------------------------------------------------------------------

    - name: "2 | Filter to country OUs not already present"
      set_fact:
        _s2_todo: >-
          {{
            _s2_todo | default([]) +
            ([item] if ('ou=' + item.country + ',ou=' + item.continent + ',ou=sites,' + _base_dn) | lower
              not in _existing_ou_dns else [])
          }}
      loop: "{{ _cc_pairs }}"
      loop_control:
        label: "{{ item.country }} / {{ item.continent }}"

    - name: "2 | Create country OUs"
      microsoft.ad.ou:
        name: "{{ item.country }}"
        path: "OU={{ item.continent }},OU=Sites,{{ _base_dn }}"
        state: present
        protect_from_deletion: true
      loop: "{{ _s2_todo | default([]) }}"
      loop_control:
        label: "{{ item.country }} / {{ item.continent }}"

    # -------------------------------------------------------------------------
    # Section 3 — Province OUs
    # Scotland, England, Ontario, Quebec, US states (where Province is set).
    # -------------------------------------------------------------------------

    - name: "3 | Filter to province OUs not already present"
      set_fact:
        _s3_todo: >-
          {{
            _s3_todo | default([]) +
            ([item] if ('ou=' + item.province + ',ou=' + item.country + ',ou=' + item.continent
                        + ',ou=sites,' + _base_dn) | lower not in _existing_ou_dns else [])
          }}
      loop: "{{ _ccp_triples }}"
      loop_control:
        label: "{{ item.province }}, {{ item.country }}"

    - name: "3 | Create province OUs"
      microsoft.ad.ou:
        name: "{{ item.province }}"
        path: "OU={{ item.country }},OU={{ item.continent }},OU=Sites,{{ _base_dn }}"
        state: present
        protect_from_deletion: true
      loop: "{{ _s3_todo | default([]) }}"
      loop_control:
        label: "{{ item.province }}, {{ item.country }}"

    # -------------------------------------------------------------------------
    # Section 4 — City OUs
    # _cpath is the pre-computed parent DN (province/country/continent).
    # CLD is excluded — its leaf OUs go directly under Cloud Infrastructure.
    # -------------------------------------------------------------------------

    # Unlike every other section, this one also re-checks content, not just existence --
    # Section 4's own task below sets `description`, the one field any section here sets
    # beyond name/path/protect_from_deletion. An item is included if its OU is missing OR
    # if it already exists but its live Description doesn't match what this task would set,
    # so a drifted description still self-corrects on re-run exactly as it did before this
    # optimization -- the trade-off flagged when this was first built is closed for this
    # field. (Robert's ask, 2026-09-21.)
    - name: "4 | Filter to city OUs not already present or with a drifted description"
      set_fact:
        _s4_todo: >-
          {{
            _s4_todo | default([]) +
            ([item] if (
              ('ou=' + item.City + ',' + item._cpath) | lower not in _existing_ou_dns
              or _existing_ou_descriptions[('ou=' + item.City + ',' + item._cpath) | lower] | default('')
                 != (item.Site + ' — ' + item.Entity)
            ) else [])
          }}
      loop: "{{ _sites | rejectattr('_continent', 'equalto', 'Cloud Infrastructure') | list }}"
      loop_control:
        label: "{{ item.Site }} — {{ item.City }}"

    - name: "4 | Create city OUs"
      microsoft.ad.ou:
        name: "{{ item.City }}"
        path: "{{ item._cpath }}"
        state: present
        protect_from_deletion: true
        description: "{{ item.Site }} — {{ item.Entity }}"
      loop: "{{ _s4_todo | default([]) }}"
      loop_control:
        label: "{{ item.Site }} — {{ item.City }}"

    # -------------------------------------------------------------------------
    # Section 5 — Leaf OUs (Users, Devices, Groups) under each city
    # -------------------------------------------------------------------------

    - name: "5 | Filter to city leaf OUs not already present"
      set_fact:
        _s5_todo: >-
          {{
            _s5_todo | default([]) +
            ([item] if ('ou=' + item.1 + ',ou=' + item.0.City + ',' + item.0._cpath) | lower
              not in _existing_ou_dns else [])
          }}
      loop: >-
        {{
          _sites
          | rejectattr('_continent', 'equalto', 'Cloud Infrastructure')
          | list
          | product(['Users', 'Devices', 'Groups'])
          | list
        }}
      loop_control:
        label: "OU={{ item.1 }} under {{ item.0.Site }}"

    - name: "5 | Create city leaf OUs"
      microsoft.ad.ou:
        name: "{{ item.1 }}"
        path: "OU={{ item.0.City }},{{ item.0._cpath }}"
        state: present
      loop: "{{ _s5_todo | default([]) }}"
      loop_control:
        label: "OU={{ item.1 }} under {{ item.0.Site }}"

    # -------------------------------------------------------------------------
    # Section 6 — Device sub-OUs under each city's Devices OU
    # -------------------------------------------------------------------------

    - name: "6 | Filter to device sub-OUs not already present"
      set_fact:
        _s6_todo: >-
          {{
            _s6_todo | default([]) +
            ([item] if ('ou=' + item.1 + ',ou=devices,ou=' + item.0.City + ',' + item.0._cpath) | lower
              not in _existing_ou_dns else [])
          }}
      loop: >-
        {{
          _sites
          | rejectattr('_continent', 'equalto', 'Cloud Infrastructure')
          | list
          | product(_device_sub_ous)
          | list
        }}
      loop_control:
        label: "OU={{ item.1 }} / Devices / {{ item.0.Site }}"

    - name: "6 | Create device sub-OUs"
      microsoft.ad.ou:
        name: "{{ item.1 }}"
        path: "OU=Devices,OU={{ item.0.City }},{{ item.0._cpath }}"
        state: present
      loop: "{{ _s6_todo | default([]) }}"
      loop_control:
        label: "OU={{ item.1 }} / Devices / {{ item.0.Site }}"

    # -------------------------------------------------------------------------
    # Section 7 — Cloud Infrastructure (CLD)
    # Leaf OUs sit directly under OU=Cloud Infrastructure — no city sub-level.
    # -------------------------------------------------------------------------

    - name: "7 | Filter to Cloud Infrastructure leaf OUs not already present"
      set_fact:
        _s7a_todo: >-
          {{
            _s7a_todo | default([]) +
            ([item] if ('ou=' + item + ',ou=cloud infrastructure,ou=sites,' + _base_dn) | lower
              not in _existing_ou_dns else [])
          }}
      loop:
        - Users
        - Devices
        - Groups
        - Service Accounts

    - name: "7 | Create Cloud Infrastructure leaf OUs"
      microsoft.ad.ou:
        name: "{{ item }}"
        path: "OU=Cloud Infrastructure,OU=Sites,{{ _base_dn }}"
        state: present
      loop: "{{ _s7a_todo | default([]) }}"

    - name: "7 | Filter to Cloud Infrastructure device sub-OUs not already present"
      set_fact:
        _s7b_todo: >-
          {{
            _s7b_todo | default([]) +
            ([item] if ('ou=' + item + ',ou=devices,ou=cloud infrastructure,ou=sites,' + _base_dn) | lower
              not in _existing_ou_dns else [])
          }}
      loop: "{{ _device_sub_ous }}"

    - name: "7 | Create Cloud Infrastructure device sub-OUs"
      microsoft.ad.ou:
        name: "{{ item }}"
        path: "OU=Devices,OU=Cloud Infrastructure,OU=Sites,{{ _base_dn }}"
        state: present
      loop: "{{ _s7b_todo | default([]) }}"

    # -------------------------------------------------------------------------
    # Section 8 — Global OU sub-structure
    # -------------------------------------------------------------------------

    - name: "8 | Filter to IT Groups sub-OUs not already present"
      set_fact:
        _s8a_todo: >-
          {{
            _s8a_todo | default([]) +
            ([item] if ('ou=' + item + ',ou=it groups,' + _base_dn) | lower not in _existing_ou_dns else [])
          }}
      loop:
        - Security Groups
        - Distribution Groups

    - name: "8 | Create IT Groups sub-OUs"
      microsoft.ad.ou:
        name: "{{ item }}"
        path: "OU=IT Groups,{{ _base_dn }}"
        state: present
      loop: "{{ _s8a_todo | default([]) }}"

    - name: "8 | Filter to Disabled sub-OUs not already present"
      set_fact:
        _s8b_todo: >-
          {{
            _s8b_todo | default([]) +
            ([item] if ('ou=' + item + ',ou=disabled,' + _base_dn) | lower not in _existing_ou_dns else [])
          }}
      loop:
        - Users
        - Computers

    - name: "8 | Create Disabled sub-OUs"
      microsoft.ad.ou:
        name: "{{ item }}"
        path: "OU=Disabled,{{ _base_dn }}"
        state: present
      loop: "{{ _s8b_todo | default([]) }}"

    # -------------------------------------------------------------------------
    # Section 9 — UPN suffixes
    # Registers alternative UPN suffixes in the AD forest so users can log in
    # with an external email domain (e.g. user@example1.co.uk).
    # The forest root domain (jukebox.internal) is always available as a UPN
    # suffix without registration, so this task is a no-op in demo environments.
    # Override ad_email_domain to trigger registration:
    #   --extra-vars "ad_email_domain=example1.co.uk"
    # -------------------------------------------------------------------------

    - name: "9 | Register alternative UPN suffixes in AD forest"
      ansible.windows.win_powershell:
        script: |
          $suffixes = {{ ad_upn_suffixes | to_json }}
          $forest   = Get-ADForest
          $missing  = $suffixes | Where-Object { $_ -notin $forest.UPNSuffixes }
          if ($missing) {
              Set-ADForest -UPNSuffixes @{Add = $missing}
          }
          $Ansible.Changed = [bool]$missing
      when: ad_upn_suffixes | length > 0
