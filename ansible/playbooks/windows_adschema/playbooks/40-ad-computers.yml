---
# =============================================================================
# playbooks/40-ad-computers.yml
# Example Music Limited — Active Directory Computer Accounts Playbook
# =============================================================================
# Creates all AD computer accounts from ad_computers.json.
#
# ⚠  ADDITIVE ONLY — state: present throughout. Never removes computer
#    accounts.
#
# Prerequisite:
#   10-ad-schema.yml must have been run first (OU hierarchy, including all
#   device sub-OUs, must already exist, and — when run via site.yml — the
#   ad_target prompt happens in 00-ad-preflight.yml once and is reused here
#   and in 20-ad-groups.yml/40-ad-users.yml).
#
# Device Role → OU mapping (matches 10-ad-schema.yml _device_sub_ous):
#   Workstations   WKS LAP SUR MBP MAC VDU
#   Servers        DCS SRV SVR SBC RDR
#   Infrastructure FWL RTR SWI BMC PVE NAS NIX
#   Telephony      PHN PBX PAY
#   AV             LCD TVS VCU MIC RAD
#   IoT            CAM WAP CLK PMP TEA COF PRN DON VND MUS TTY OB
#   Assets         TAB BUS CAR TRK JET AST MOO
#
# Computers with unknown site codes (ABR, LON/LOC, GAA, HEL) are skipped by
# the JSON generator because their OU paths cannot be resolved.
#
# Usage:
#   # Normal path — run via site.yml, prompted once by 00-ad-preflight.yml:
#   ansible-playbook playbooks/windows_adschema/site.yml -i <inventory> -e populate_ad=yes
#
#   # Standalone run — supply the target directly, no prompt available here:
#   ansible-playbook playbooks/windows_adschema/playbooks/40-ad-computers.yml -e ad_target=<host> --ask-vault-pass
#
#   # Check mode (dry run)
#   ansible-playbook playbooks/windows_adschema/playbooks/40-ad-computers.yml -e ad_target=<host> --check --diff
#
# Variables (override with --extra-vars):
#   ad_target         Target DC hostname or IP — no prompt in this playbook;
#                     comes from 00-ad-preflight.yml when run via site.yml,
#                     or must be supplied with -e ad_target=<host> if run
#                     standalone
#   ad_domain         AD domain FQDN        (default: jukebox.internal)
#   ad_computers_json Path to JSON file     (default: /etc/example-music/ad_computers.json)
# =============================================================================
# Version history
# =============================================================================
# v1.0.0  2026-06-29  Initial release. 271 computers; 7 skipped (bad site codes).
# v1.1.0  2026-07-04  Removed hardcoded ad_target default (EXADCSFAL001) —
#                     leftover from testing. hosts: now reads ad_target from
#                     hostvars['localhost'], set by 00-ad-preflight.yml
#                     earlier in the same run.
# v1.2.0  2026-07-04  Moved into windows_adschema/playbooks/ as part of the
#                     windows_bootstrap-style restructure. Renamed from
#                     ad_computers.yml to 40-ad-computers.yml. Prompt now
#                     lives in 00-ad-preflight.yml, not inline. Inline
#                     microsoft.ad collection check replaced with a shared
#                     include: ../tasks/ad_collection_check.yml.
# v1.3.0  2026-07-08  Fixed stale "RAC" in the Device Role -> OU mapping comment above (BMC
#                     supersedes RAC — same fix already applied to 10-ad-schema.yml, missed
#                     here since this file has its own copy of the same table).
# v1.4.0  2026-07-09  ad_domain's fallback changed from a hardcoded
#                     'jukebox.internal' literal to exa_domain, derived from
#                     benarbejde/ad_forest.json (single source of truth).
# v2.0.0  2026-07-09  Implemented the tasks: block -- until now this file
#                     only loaded and counted ad_computers.json in
#                     pre_tasks, then stopped; no microsoft.ad.computer task
#                     existed anywhere, so it created nothing. Added
#                     computer-account creation (Section A) and OS /
#                     OperatingSystemVersion attribute tasks (Section B/C).
#                     Also fixed stale "30-ad-computers.yml" references in
#                     this header (copy-paste leftover from 30-ad-users.yml
#                     — a file of that name never existed in this repo).
# v2.1.0  2026-09-26  CRITICAL FIX, found live: a populate_ad run against
#                     EXADCSGOT001 disabled EXADCSGOT001's OWN computer
#                     account in AD. Root cause: ad_computers.json's
#                     EXADCSGOT001 record was a generic new-site-boilerplate
#                     entry (Enabled: false, matching devices.csv's GOT DCS
#                     row still saying Planned=yes -- never updated once GOT
#                     was actually built/promoted for real) with no
#                     exclusion anywhere in this file for a computer that
#                     happens to BE a live Domain Controller. Section A's
#                     create_computers_batch.yml sets enabled: "{{
#                     item.Enabled }}" unconditionally -- so this ran
#                     `Set-ADComputer -Enabled $false` against
#                     EXADCSGOT001$, its own live secure-channel account.
#                     The break was silent (an already-established session
#                     doesn't re-validate its secure channel) until a
#                     reboot forced Netlogon to re-authenticate, which is
#                     when "the security database does not have a computer
#                     account for this workstation" first surfaced --
#                     hours/a day after the actual disabling action, not at
#                     the time of the run that caused it.
#                     Fixed structurally, not just for GOT: a Domain
#                     Controller's own computer account is created and
#                     managed exclusively by Install-ADDSForest/
#                     Install-ADDSDomainController during promotion
#                     (windows_dc/playbooks/20-dc-promote.yml) -- it must
#                     NEVER be touched by this generic per-device sync,
#                     for ANY site, not just the one currently targeted.
#                     Every Role: DCS record is now excluded from
#                     _computers entirely (the single upstream filter all
#                     of Sections A/B/C read from), unconditionally, no
#                     flag needed to opt in to the protection -- there is
#                     no legitimate case where this file should ever
#                     create/enable/disable/move/set-OS-attributes-on a DC's
#                     own computer object.
# v2.2.0  2026-09-27  Robert's ask, morning after the v2.1.0 incident: the
#                     DC exclusion was correct but invisible -- a silent,
#                     hardcoded rejectattr the operator has no way to see is
#                     even happening. Added a new vars_prompt,
#                     exclude_dc_computer_accounts, default "yes" -- a
#                     single Enter keeps the exact same v2.1.0 protection,
#                     visibly. Typing "no" explicitly is the one path that
#                     both disables it AND prints a loud warning naming
#                     every real DC computer account (forest-wide, not just
#                     this run's own ad_target) now exposed and unprotected
#                     for that run -- so overriding the safe default can
#                     never happen silently.
# v2.2.1  2026-09-27  Robert's ask, found live: v2.2.0's vars_prompt lived on THIS
#                     play -- the LAST one in the chain (00 -> 10 -> 20 -> 30 -> 40) --
#                     so the operator sat through OU schema, groups, and users
#                     before ever being asked, breaking this repo's own "bundle
#                     every prompt up front" convention (00-preflight.yml,
#                     00-dc-preflight.yml both do this correctly). Moved the actual
#                     vars_prompt to 00-ad-preflight.yml, alongside ad_target's own
#                     -- published to hostvars['localhost'] the same way, read back
#                     here via this play's own vars: with the same yes-default
#                     fallback chain. Prompt text, default, and downstream
#                     enable/warn/exclude behaviour are all unchanged -- placement
#                     only.
# =============================================================================

- name: "Build AD computer accounts from JSON"
  hosts: "{{ ad_target | default(hostvars['localhost']['ad_target'] | default('localhost')) }}"
  gather_facts: false
  become: false

  # 2026-09-27, Robert's ask: the v2.1.0 DC-exclusion fix (see changelog above)
  # was a silent, hardcoded rejectattr -- correct, but invisible to the
  # operator. Made it an explicit, visible, prompted choice instead, same
  # "bundled prompt up front" convention as 00-preflight.yml/00-dc-preflight.yml
  # elsewhere in this repo -- default "yes" keeps last night's protection on
  # with a single Enter; only an explicit "no" disables it, and that's the one
  # path that prints the loud warning below naming exactly what's now exposed.
  #
  # v2.2.1, 2026-09-27, found live: the vars_prompt itself used to live HERE --
  # the LAST play in this chain (00 -> 10 -> 20 -> 30 -> 40) -- so the operator
  # sat through OU schema, groups, and users before ever being asked, breaking
  # this repo's own "bundle every prompt up front" convention. Moved to
  # 00-ad-preflight.yml (same file ad_target's own prompt already lives in),
  # published to hostvars['localhost'] the same way -- read back here with the
  # same fallback-chain shape ad_target's own hosts: line already uses.
  #
  # v2.2.2, 2026-09-28, CRITICAL FIX, found live (EXADCSGOT001): "Recursive
  # loop detected in template: maximum recursion depth exceeded" the first
  # time this play actually referenced exclude_dc_computer_accounts. Root
  # cause: declaring exclude_dc_computer_accounts: "{{ exclude_dc_computer_accounts
  # | default(...) }}" in this play's own vars: gives that name real
  # precedence, so resolving it means resolving itself first -- genuine
  # infinite self-reference, with no external override present (this play's
  # own hosts:, EXADCSGOT001, never had it set as a host fact of its own).
  # This is the EXACT bug already found and fixed in this repo two nights
  # earlier (97a884b, bind9-dns.yml's dns_role/dns_secondary_ip/etc.) --
  # walked straight into the identical trap writing this file's own v2.2.1
  # fix, despite that commit's own writeup being right there. Fixed the
  # same proven way: moved out of vars: into a one-shot pre_tasks set_fact
  # below (not a play-level vars: declaration), so the identical default()
  # expression resolves cleanly.
  vars:
    ad_domain:         "{{ dc_domain_name | default(exa_domain) }}"
    ad_computers_json: "/etc/example-music/ad_computers.json"

  pre_tasks:

    - name: "Skip — populate_ad not requested"
      meta: end_play
      when: (populate_ad | default('no')) | lower not in ['yes', 'y']

    - name: "Resolve exclude_dc_computer_accounts (set_fact, not vars: -- see this play's own 2026-09-28 changelog above)"
      set_fact:
        exclude_dc_computer_accounts: "{{ exclude_dc_computer_accounts | default(hostvars['localhost']['exclude_dc_computer_accounts'] | default('yes')) }}"

    - name: Gate on /etc/example-music/* freshness
      include_tasks: ../../../tasks/example_music_freshness_gate.yml
      vars:
        example_music_gate_files: [ad_computers.json]
        example_music_gate_repo_root: "{{ playbook_dir }}/../../../.."

    - name: "Fail — no target Domain Controller resolved"
      fail:
        msg: >
          No target Domain Controller was resolved from 00-ad-preflight.yml's
          prompt or -e ad_target=<host>. Re-run the play.
      when: inventory_hostname == 'localhost'

    - name: Include microsoft.ad collection preflight check
      include_tasks: ../tasks/ad_collection_check.yml

    - name: "Load computers from ad_computers.json (known source of truth)"
      set_fact:
        _computers_all: "{{ lookup('file', ad_computers_json) | from_json }}"
        _base_dn: "DC={{ ad_domain.split('.') | join(',DC=') }}"
      delegate_to: localhost
      become: false

    # 2026-09-26, CRITICAL FIX (see this file's own v2.1.0 changelog entry
    # above for the full incident writeup): Role: DCS records are excluded
    # HERE, at the single upstream point every section below reads _computers
    # from, rather than duplicating the condition in each section's own
    # filter -- a Domain Controller's own computer account is never
    # legitimately managed by this generic per-device sync, for any site.
    #
    # 2026-09-27, v2.2.0: made the exclusion an explicit, prompted choice
    # (exclude_dc_computer_accounts, see this play's own vars_prompt above)
    # instead of an unconditional hardcoded rule -- default "yes" keeps the
    # exact same protection as v2.1.0 with a single Enter; typing "no" is the
    # one path that both disables it AND prints the loud warning below,
    # naming every real DC computer account (forest-wide, not just this
    # run's own ad_target) that is now exposed and unprotected for this run.
    - name: "Determine DC computer accounts present in ad_computers.json (forest-wide, independent of the exclusion choice)"
      set_fact:
        _computers_dcs_all: "{{ _computers_all | selectattr('ad_ou', 'ne', '') | selectattr('Role', 'equalto', 'DCS') | list }}"

    - name: "WARNING — DC computer-account protection DISABLED for this run"
      debug:
        msg: |
          ⚠ DC computer-account protection DISABLED for this run
            (exclude_dc_computer_accounts={{ exclude_dc_computer_accounts }}).
          The following DC(s) will now be fully managed like any other
          computer record -- including Enabled/OU/Description changes:
            {{ _computers_dcs_all | map(attribute='SamAccountName') | join(', ') }}
          This is exactly what caused the 2026-09-26 EXADCSGOT001 incident
          (a stale Enabled: false in ad_computers.json disabled a live DC's
          own secure-channel account). Proceed only if you are certain this
          run genuinely needs to manage a DC's own computer object.
      when:
        - (exclude_dc_computer_accounts | default('yes')) | lower not in ['yes', 'y']
        - _computers_dcs_all | length > 0

    - name: "Filter out computers with unresolvable OU paths, and (unless explicitly disabled above) Domain Controllers"
      set_fact:
        _computers: >-
          {{ (_computers_all | selectattr('ad_ou', 'ne', '') | rejectattr('Role', 'equalto', 'DCS') | list)
             if ((exclude_dc_computer_accounts | default('yes')) | lower in ['yes', 'y'])
             else (_computers_all | selectattr('ad_ou', 'ne', '') | list) }}
        _computers_dcs_excluded_count: >-
          {{ (_computers_dcs_all | length)
             if ((exclude_dc_computer_accounts | default('yes')) | lower in ['yes', 'y'])
             else 0 }}

    - name: "Preflight | Report computer count"
      debug:
        msg: >-
          Parsed {{ _computers_all | length }} computers from JSON;
          {{ _computers | length }} have resolvable OU paths and are eligible
          for management here ({{ _computers_all | length - _computers | length - _computers_dcs_excluded_count | int }}
          skipped — unknown site codes; {{ _computers_dcs_excluded_count }}
          skipped — Role: DCS, a Domain Controller's own computer account is
          excluded by default from this generic sync).

    # 2026-09-21, Robert's ask -- same identity-and-content pattern as
    # 10-ad-schema.yml/20-ad-groups.yml: one query up front instead of one
    # microsoft.ad.computer round trip per computer every re-run. SamAccountName is
    # unique per computer (unlike OU/group names, scoped by parent), so it's the
    # natural identity key. Fetches Description/Enabled/DNSHostName/OperatingSystem/
    # OperatingSystemVersion in the SAME call -- Section A below checks the first
    # three (its own params beyond name/path); Sections B/C reuse the OS/OSVersion
    # fields from this same result rather than querying again.
    - name: "Query existing AD computers (single call, used to skip already-created/unchanged computers and OS attribute writes below)"
      ansible.windows.win_shell: |
        $results = @(Get-ADComputer -Filter * -SearchBase "{{ _base_dn }}" `
            -Properties Description,Enabled,DNSHostName,OperatingSystem,OperatingSystemVersion |
          Select-Object SamAccountName, Description, Enabled, DNSHostName, OperatingSystem, OperatingSystemVersion)
        ConvertTo-Json -InputObject $results -Compress
      register: _existing_computers_raw
      changed_when: false

    - name: "Parse existing computers"
      set_fact:
        _existing_computers: "{{ (_existing_computers_raw.stdout | trim | length > 0) | ternary(_existing_computers_raw.stdout | from_json, []) }}"

    - name: "Build SamAccountName(lowercase) -> record lookup"
      set_fact:
        _existing_computers_by_sam: >-
          {{
            dict(
              _existing_computers | map(attribute='SamAccountName') | map('lower') | list
              | zip(_existing_computers)
            )
          }}

    # 2026-09-22, Robert's ask, found live: this used to be a loop:-driven set_fact
    # accumulator (_computers_todo | default([]) + [item], once per computer) --
    # confirmed live on EXAANSFRD001 that this whole PATTERN (not just this task; see
    # the other three in 30-ad-users.yml) genuinely OOM-kills the ansible-playbook
    # worker process: `set_fact` inside `loop:` makes Ansible re-copy/re-template the
    # ENTIRE host facts/vars dict on every single iteration, not just the one list
    # being built -- with 364 users/computers plus everything already accumulated
    # from earlier plays (750 OUs, 111 groups, ...), that's real quadratic memory
    # growth, confirmed via `dmesg`: "Out of memory: Killed process ... (ansible-playboo)
    # ... anon-rss:1395976kB" on a ~2GB control node. Rewritten as a single Jinja pass
    # (one set_fact, no loop:) that builds the filtered list as JSON text via a plain
    # {% for %}/{% if %} block captured with {% set x %}...{% endset %} (core Jinja2
    # syntax since 2.10, no extensions needed -- confirmed NOT to need jinja2.ext.do,
    # which is deprecated in ansible-core's own config schema), then a single
    # regex_replace to drop the trailing comma before from_json. True O(n), and only
    # ONE Ansible task execution instead of 364 -- verified locally against
    # new/matching/drifted/empty-input cases before applying here.
    #
    # 2026-09-25: the regex_replace/from_json described above was removed entirely by
    # commit 23f83fd (2026-09-22), then restored here (version-agnostic this time)
    # after breaking live on EXAANSCLD001. Full root cause and fix writeup in
    # 10-ad-schema.yml's "Attach continent and parent city path to each site" task --
    # same shape here and in 20-ad-groups.yml/30-ad-users.yml (30 occurrences total).
    - name: "Filter to computers not already present or with a drifted Description/Enabled/DNSHostName"
      set_fact:
        _computers_todo: >-
          {%- set _rendered -%}
          [{% for item in _computers %}{% if ((item.SamAccountName | lower not in _existing_computers_by_sam) or (_existing_computers_by_sam[item.SamAccountName | lower].Description | default('')) != item.Description or (_existing_computers_by_sam[item.SamAccountName | lower].Enabled | default(true)) != item.Enabled or (_existing_computers_by_sam[item.SamAccountName | lower].DNSHostName | default('')) != item.DNSHostName) %}{{ item | to_json }},{% endif %}{% endfor %}]
          {%- endset -%}
          {{ (_rendered | regex_replace(',\s*\]$', ']') | from_json) if (_rendered is string) else _rendered }}

    - name: "Preflight | Report computers needing create/update"
      debug:
        msg: "{{ _computers_todo | default([]) | length }} of {{ _computers | length }} computer(s) need creating or a Description/Enabled/DNSHostName update."

  tasks:

    # -------------------------------------------------------------------------
    # Section A — Computer accounts
    # sam_account_name in the JSON already carries the trailing $ (e.g.
    # "EXAPHNABD001$"), matching the identity-lookup convention microsoft.ad.
    # computer expects — see Section B/C below, which look these accounts
    # back up by the same value.
    #
    # 2026-09-25, Robert's ask, live: "298 of 298 computer(s) need creating or
    # a ... update" -- same fully serial shape 30-ad-users.yml's Sections C/D
    # had before being batched the same evening (see that file's own
    # changelog). microsoft.ad.computer never sets a password (machine
    # account passwords are AD/domain-join-managed, not a module param here
    # at all), so there's no equivalent of the concurrent-password-write race
    # that keeps 30-ad-users.yml's Sections B0/F1 genuinely serial -- safe to
    # batch async from the start. See tasks/create_computers_batch.yml's own
    # header for the full writeup.
    # -------------------------------------------------------------------------

    # 2026-09-28, Robert's ask, live (EXADCSGOT001): reverted from async/
    # batch(10) back to plain serial. Measured live: async's fire+check
    # round-trip pair costs ~16.1 sec/item on this connection type vs ~9.17
    # sec/item plain serial -- ~1.76x slower, not faster (see
    # 30-ad-users.yml's Section B0a for the full measured writeup; same
    # connection, same dispatch-overhead-dominates cause, applies
    # identically here). Computer accounts never had a password/race concern
    # in the first place (see tasks/create_computers_batch.yml's own
    # header), so this was always a pure speed optimization -- and on this
    # connection type it wasn't actually faster. That file was removed entirely --
    # git history has the full async attempt.
    - name: "A | Create computer accounts"
      microsoft.ad.computer:
        identity:         "{{ item.SamAccountName }}"
        name:             "{{ item.Name }}"
        sam_account_name: "{{ item.SamAccountName }}"
        dns_hostname:     "{{ item.DNSHostName }}"
        path:             "{{ item.ad_ou }}"
        description:      "{{ item.Description }}"
        enabled:          "{{ item.Enabled }}"
        state:            present
      loop: "{{ _computers_todo | default([]) }}"
      loop_control:
        label: "{{ item.SamAccountName }}"

    # -------------------------------------------------------------------------
    # Section B/C — Operating system attributes
    # OS / OperatingSystemVersion aren't microsoft.ad.computer module params —
    # set via the generic attributes: mechanism onto the standard
    # operatingSystem / operatingSystemVersion LDAP attributes. Each is its
    # own task, gated on that field being non-blank in the source data (some
    # IoT/embedded devices have no OS, and ~73 records have OS but no
    # version) — this file is additive only, so an empty string is never
    # sent, which would otherwise clear the attribute instead of leaving it
    # untouched.
    # -------------------------------------------------------------------------

    # B/C both reuse _existing_computers_by_sam (built once, above) rather than
    # querying again -- the `or` short-circuits before the bracket-access ever runs
    # for a genuinely new SamAccountName (verified in isolation before applying),
    # so this is safe for computers Section A hasn't created yet in this same run too.
    #
    # 2026-09-25, Robert's ask, live: both sections used to loop the FULL
    # _computers list (one microsoft.ad.computer call per item, gated by a
    # when: drift-check) rather than a pre-filtered todo list -- correct, but
    # meant a stable re-run with nothing genuinely drifted still dispatched
    # (and Ansible-side skipped) all ~298 items serially, one round trip
    # each, before ever reaching an item that needed real work. Same fix as
    # Section A: pre-filter to a real todo list first (same condition, moved
    # from when: into the filter itself), then batch async the same way --
    # see tasks/set_computer_os_batch.yml / set_computer_osversion_batch.yml.

    - name: "B | Filter to computers needing an operatingSystem update"
      set_fact:
        _os_todo: >-
          {%- set _rendered -%}
          [{% for item in _computers %}{% if (item.OS | length > 0 and ((item.SamAccountName | lower not in _existing_computers_by_sam) or (_existing_computers_by_sam[item.SamAccountName | lower].OperatingSystem | default('')) != item.OS)) %}{{ item | to_json }},{% endif %}{% endfor %}]
          {%- endset -%}
          {{ (_rendered | regex_replace(',\s*\]$', ']') | from_json) if (_rendered is string) else _rendered }}

    # 2026-09-26, Robert, live (GOT): "is the operatingSystem thing also
    # enumerating everyone who needs changes, or just YOLOing it every time?"
    # The filter itself was already correctly scoped (a plain string
    # comparison, not the nested-capture-without-from_json shape that broke
    # 30-ad-users.yml's group-add filter the same day) -- but unlike Section
    # A, this section had no count reported before it started running, so
    # there was no way to tell "large backlog, expected" apart from "silently
    # broken" just from batch cadence. Added, matching Section A's own
    # "Preflight | Report computers needing create/update" pattern.
    - name: "B | Report operatingSystem work needed"
      debug:
        msg: "{{ _os_todo | default([]) | length }} of {{ _computers | length }} computer(s) need an operatingSystem update."

    # 2026-09-28, Robert's ask, live (EXADCSGOT001): reverted from async/
    # batch(10) back to plain serial -- same measured finding as Section A
    # above (~1.76x slower on this connection type). Never a password
    # concern here either. tasks/set_computer_os_batch.yml was removed entirely --
    # git history has the full async attempt.
    - name: "B | Set operatingSystem attribute"
      microsoft.ad.computer:
        identity: "{{ item.SamAccountName }}"
        name:     "{{ item.Name }}"
        attributes:
          set:
            operatingSystem: "{{ item.OS }}"
      loop: "{{ _os_todo | default([]) }}"
      loop_control:
        label: "{{ item.SamAccountName }}"

    - name: "C | Filter to computers needing an operatingSystemVersion update"
      set_fact:
        _osversion_todo: >-
          {%- set _rendered -%}
          [{% for item in _computers %}{% if (item.OperatingSystemVersion | length > 0 and ((item.SamAccountName | lower not in _existing_computers_by_sam) or (_existing_computers_by_sam[item.SamAccountName | lower].OperatingSystemVersion | default('')) != item.OperatingSystemVersion)) %}{{ item | to_json }},{% endif %}{% endfor %}]
          {%- endset -%}
          {{ (_rendered | regex_replace(',\s*\]$', ']') | from_json) if (_rendered is string) else _rendered }}

    - name: "C | Report operatingSystemVersion work needed"
      debug:
        msg: "{{ _osversion_todo | default([]) | length }} of {{ _computers | length }} computer(s) need an operatingSystemVersion update."

    # 2026-09-28, Robert's ask, live (EXADCSGOT001): reverted from async/
    # batch(10) back to plain serial -- same measured finding as Sections A/B
    # above. tasks/set_computer_osversion_batch.yml was removed entirely --
    # git history has the full async attempt.
    - name: "C | Set operatingSystemVersion attribute"
      microsoft.ad.computer:
        identity: "{{ item.SamAccountName }}"
        name:     "{{ item.Name }}"
        attributes:
          set:
            operatingSystemVersion: "{{ item.OperatingSystemVersion }}"
      loop: "{{ _osversion_todo | default([]) }}"
      loop_control:
        label: "{{ item.SamAccountName }}"

    # 2026-09-26, Robert's ask: "I want every playbook to update that JSON
    # field" -- windows_adschema never wrote nodeinfo.json at all before
    # this. See ansible/tasks/nodeinfo_windows.yml's own header for the
    # shared implementation.
    #
    # block/rescue, not ignore_errors: on the include -- verified directly
    # (windows_bootstrap/85-finish.yml's own 2026-09-26 changelog entry has
    # the full repro) that ignore_errors: true on an include_tasks: line
    # does not protect the included file's own tasks. Especially important
    # here, more so than windows_bootstrap/windows_dc's own copies of this
    # same block -- ad_target (this file's own hosts:) is explicitly
    # documented as "Domain Controller name OR IP" at the 00-ad-preflight.yml
    # prompt, and hostname_facts.yml (which this include calls internally)
    # hard-asserts the EXA[ROLE][SITE][NNN] convention -- an IP-based
    # ad_target would fail that assert. nodeinfo.json is an observability
    # convenience; it must never block a real AD population run that's
    # already this far through.
    - name: "Write nodeinfo.json (non-fatal)"
      # Tagged always -- see windows_bootstrap/85-finish.yml's own 2026-10-04
      # changelog/comment for the full empirical writeup of why this has to be on
      # the wrapping block itself, not just on the tasks inside
      # tasks/nodeinfo_windows.yml.
      tags: always
      block:
        - name: "Write nodeinfo.json"
          include_tasks: ../../../tasks/nodeinfo_windows.yml
          vars:
            nodeinfo_bootstrapped_by: "windows_adschema/site.yml"
            nodeinfo_repo_root: "{{ playbook_dir }}/../../../.."
      rescue:
        - name: "WARNING — nodeinfo.json write failed, continuing anyway"
          debug:
            msg: >-
              nodeinfo.json write failed ({{ ansible_failed_result.msg | default('see task output above') }}) --
              non-fatal, nodeinfo.json is an observability convenience, not required for AD population itself.
              Common cause: ad_target was given as a bare IP, not a hostname matching the
              EXA[ROLE][SITE][NNN] convention.
