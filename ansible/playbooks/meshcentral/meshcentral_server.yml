---
# =============================================================================
# Example Music Limited — MeshCentral Server Bootstrap Playbook
# playbooks/meshcentral/meshcentral_server.yml
#
# Remote management platform, phase 1/2 (Robert's brief, 2026-08-04 — see project
# notes). Bootstraps EXAMSHCLD001 from a fresh Debian Trixie install to a running
# MeshCentral server: remote desktop, remote terminal, interactive PowerShell/CMD,
# Linux shell, file transfer. Does NOT replace SaltStack (config management stays
# Salt's job) or Chocolatey (Windows package management stays Chocolatey's job) —
# this is a pure remote-access platform.
#
# Structure mirrors rudder_server.yml section-by-section (same single-instance,
# CLD-only, Debian Trixie shape) — sections 1-4 (hostname, static IP, base
# packages, UFW) are the proven pattern lifted from there, adapted for this host.
# Sections 5+ are MeshCentral-specific, not present in rudder_server.yml:
#   1. Hostname
#   2. Network — static IP (host_vars with interactive fallback, session-safe
#      templated-keyfile+reload pattern — see Section 2's own comments)
#   3. Base packages
#   4. UFW firewall
#   5. Node.js (NodeSource LTS)
#   6. MeshCentral install (npm, dedicated non-root user, own directory)
#   7. Configuration — self-signed TLS (MeshCentral's own default), NOT
#      Let's Encrypt (confirmed with Robert: this box is strictly internal/
#      WireGuard-only, ACME validation can't work here — see group_vars'
#      mesh_cert_hostname comment)
#   8. systemd service
#   9. Dynamic MOTD
#   10. Node info file
#
# Usage
# -----
# First run (before ansible user exists, using root + password):
#   ansible-playbook playbooks/meshcentral/meshcentral_server.yml \
#     --limit meshcentral_servers \
#     --user root -k
#
# Subsequent runs (ansible user + key):
#   ansible-playbook playbooks/meshcentral/meshcentral_server.yml \
#     --limit meshcentral_servers
#
# Dry-run (check mode):
#   ansible-playbook playbooks/meshcentral/meshcentral_server.yml \
#     --limit meshcentral_servers --check --diff
#
# Inventory
# ---------
# configs/inventory/meshcentral.ini:
#   [meshcentral_servers]
#   EXAMSHCLD001  ansible_host=192.168.69.13  ansible_connection=ssh
#
# Variables (see group_vars/meshcentral_servers/main.yml and
#            host_vars/EXAMSHCLD001/main.yml for full list)
# ----------------------------------------------------------
# Required via host_vars or --extra-vars:
#   mesh_static_ip        Static IP for this MeshCentral server
#   mesh_hostname          Hostname (e.g. EXAMSHCLD001)
#   mesh_gateway           Default gateway
#
# No vault requirements yet — MeshCentral's own initial-admin-account setup
# happens through its web UI on first login, not via this playbook. Revisit
# if/when a scripted admin bootstrap becomes worth adding.
#
# Idempotency
# -----------
# Every task is idempotent. Re-running against an already-configured server
# is safe — tasks that are already done report 'ok' and change nothing. The
# npm install step checks the installed package.json version before
# re-installing, same "don't touch what's already right" pattern as
# everything else in this estate.
#
# NOT YET LIVE-TESTED as of 2026-08-04 — no Debian Trixie box available to
# test against directly. Sections 1-4 are a direct, proven adaptation of
# rudder_server.yml's own live-tested pattern (renamed vars only, logic
# unchanged). Sections 5-10 (the actual MeshCentral install) are new and
# built from MeshCentral's own public documentation, not independently
# confirmed live — test against a real box before relying on this
# unattended, same caution as the snmp/ and salt/adtools/ builds earlier
# this session.
# =============================================================================
# Version history
# =============================================================================
# v1.0.0  2026-08-04  Initial release.
# =============================================================================

- name: Bootstrap MeshCentral server
  hosts: meshcentral_servers
  become: true
  gather_facts: true
  ignore_unreachable: false

  vars_files:
    - ../../configs/inventory/group_vars/meshcentral_servers/main.yml

  pre_tasks:

    - name: Gate on /etc/example-music/* freshness
      include_tasks: ../../tasks/example_music_freshness_gate.yml
      vars:
        example_music_gate_files: [sites.csv, ad_forest.json]
        example_music_gate_repo_root: "{{ playbook_dir }}/../../.."

    # -------------------------------------------------------------------------
    # Interactive fallback: if host_vars do not supply the IP or hostname,
    # prompt the operator now (before any changes are made) — same pattern as
    # rudder_server.yml's own pre_tasks.
    # -------------------------------------------------------------------------

    - name: "Prompt for hostname if not set in host_vars"
      pause:
        prompt: >
          Hostname for this MeshCentral server is not set in host_vars.
          Enter hostname (e.g. EXAMSHCLD001)
      register: _hostname_prompt
      when: mesh_hostname is not defined or mesh_hostname == ""
      delegate_to: localhost
      become: false

    - name: "Set mesh_hostname from prompt"
      set_fact:
        mesh_hostname: "{{ _hostname_prompt.user_input | upper }}"
      when: _hostname_prompt is not skipped

    - name: "Prompt for static IP if not set in host_vars"
      pause:
        prompt: >
          Static IP for {{ mesh_hostname }} is not set in host_vars.
          Enter static IP (e.g. 192.168.69.13)
      register: _ip_prompt
      when: mesh_static_ip is not defined or mesh_static_ip == ""
      delegate_to: localhost
      become: false

    - name: "Set mesh_static_ip from prompt"
      set_fact:
        mesh_static_ip: "{{ _ip_prompt.user_input }}"
      when: _ip_prompt is not skipped

    - name: "Prompt for gateway if not set in host_vars"
      pause:
        prompt: >
          Gateway for {{ mesh_hostname }} is not set in host_vars.
          Enter gateway IP (e.g. 192.168.69.253)
      register: _gw_prompt
      when: mesh_gateway is not defined or mesh_gateway == ""
      delegate_to: localhost
      become: false

    - name: "Set mesh_gateway from prompt"
      set_fact:
        mesh_gateway: "{{ _gw_prompt.user_input }}"
      when: _gw_prompt is not skipped

    - name: "Validate required variables are now set"
      assert:
        that:
          - mesh_hostname is defined and mesh_hostname != ""
          - mesh_static_ip is defined and mesh_static_ip != ""
          - mesh_gateway is defined and mesh_gateway != ""
        fail_msg: >
          mesh_hostname, mesh_static_ip, and mesh_gateway must all be set.
          Set them in host_vars/{{ inventory_hostname }}/main.yml or pass via
          --extra-vars.
        success_msg: "All required variables present — proceeding."

  tasks:

  # ---------------------------------------------------------------------------
  # Section 1 — Hostname
  # ---------------------------------------------------------------------------

    - name: "1 | Set hostname"
      hostname:
        name: "{{ mesh_hostname | lower }}"

    - name: "1 | Add FQDN to /etc/hosts"
      lineinfile:
        path: /etc/hosts
        regexp: "^127\\.0\\.1\\.1"
        line: >-
          127.0.1.1  {{ mesh_hostname | lower }}.{{ mesh_domain }}  {{ mesh_hostname | lower }}
        state: present

  # ---------------------------------------------------------------------------
  # Section 2 — Static IP via NetworkManager
  # Session-safe templated-keyfile+reload+strand-check pattern — same as
  # rudder_server.yml Section 2 (see that file's 2026-07-22/24 changelog
  # entries for the bug history this avoids: a naive delete+recreate can drop
  # the very SSH session running the play).
  # ---------------------------------------------------------------------------

    - name: "2 | Install NetworkManager if missing"
      apt:
        name: network-manager
        state: present
        update_cache: true

    - name: "2 | Check whether target IP is already in use (CLD best-effort)"
      command: "ping -c1 -W1 {{ mesh_static_ip }}"
      register: _ping_check
      changed_when: false
      failed_when: false

    - name: "2 | Check current IPs on this host"
      command: hostname -I
      register: _current_ips
      changed_when: false

    - name: "2 | Warn if target IP appears in use by another host"
      fail:
        msg: >
          {{ mesh_static_ip }} is responding to ping and is NOT assigned to
          this host. Resolve the IP conflict before proceeding.
          (If this is a cloud host and ICMP is filtered, this check may be a
          false positive — in that case, remove this task and re-run.)
      when:
        - _ping_check.rc == 0
        - mesh_static_ip not in _current_ips.stdout.split()

    - name: "2 | Warn if ping check is unreliable (cloud environment)"
      debug:
        msg: >-
          [CLD] ping check returned rc={{ _ping_check.rc }}.
          On cloud hosts ICMP may be filtered — IP conflict check is
          best-effort only. Proceeding.
      when: _ping_check.rc != 0

    - name: "2 | Detect provisioning interface (first non-loopback with an IP)"
      shell: |
        for iface in $(ls /sys/class/net/); do
          [[ "$iface" == "lo" ]] && continue
          ip_addr=$(ip -4 addr show "$iface" 2>/dev/null | grep -oP '(?<=inet\s)\d+\.\d+\.\d+\.\d+' | head -1)
          if [[ -n "$ip_addr" ]]; then
            echo "$iface"
            exit 0
          fi
        done
        exit 1
      args:
        executable: /bin/bash
      register: _detected_iface
      changed_when: false

    - name: "2 | Set interface name fact"
      set_fact:
        _mesh_iface: "{{ mesh_network_interface | default(_detected_iface.stdout | trim, true) }}"

    - name: "2 | Read interface MAC address"
      slurp:
        src: "/sys/class/net/{{ _mesh_iface }}/address"
      register: _iface_mac_raw

    - name: "2 | Set MAC address fact"
      set_fact:
        _mesh_mac: "{{ _iface_mac_raw.content | b64decode | trim }}"

    - name: "2 | Pin interface name via systemd .link"
      copy:
        dest: "/etc/systemd/network/10-mesh-prov.link"
        content: |
          # Example Music — MeshCentral server interface pin
          # Written by meshcentral_server.yml on {{ ansible_date_time.iso8601 }}
          # MAC: {{ _mesh_mac }}  interface: {{ _mesh_iface }}
          [Match]
          MACAddress={{ _mesh_mac }}
          [Link]
          Name={{ _mesh_iface }}
        mode: "0644"

    - name: "2 | Mask ifupdown to prevent conflict with NetworkManager"
      systemd:
        name: "networking.service"
        masked: true
        enabled: false
      failed_when: false

    - name: "2 | Remove interface from /etc/network/interfaces if present"
      blockinfile:
        path: /etc/network/interfaces
        marker: "# {mark} ANSIBLE MANAGED — {{ _mesh_iface }}"
        block: ""
        state: absent
      failed_when: false

    - name: "2 | Ensure NetworkManager manages interfaces"
      ini_file:
        path: /etc/NetworkManager/NetworkManager.conf
        section: ifupdown
        option: managed
        value: "true"
        no_extra_spaces: true
        backup: true
      notify: Restart NetworkManager

    - name: "2 | Ensure NetworkManager is running"
      systemd:
        name: NetworkManager
        state: started
        enabled: true

    - name: "2 | Detect current live IP on the mesh interface"
      tags: network
      ansible.builtin.shell: |
        nmcli -g IP4.ADDRESS dev show {{ _mesh_iface }} 2>/dev/null | head -1 | cut -d/ -f1
      register: _mesh_ip_live
      changed_when: false
      failed_when: false

    - name: "2 | Set flag — would bringing mesh-static up now strand this session?"
      tags: network
      ansible.builtin.set_fact:
        _mesh_activate_would_strand_session: >-
          {{
            _mesh_ip_live.stdout | trim != ''
            and _mesh_ip_live.stdout | trim != mesh_static_ip
          }}

    - name: "2 | Write mesh-static NetworkManager connection profile"
      tags: network
      ansible.builtin.template:
        src: mesh-static.nmconnection.j2
        dest: /etc/NetworkManager/system-connections/mesh-static.nmconnection
        owner: root
        group: root
        mode: "0600"
      notify: Reload NetworkManager connections

    - name: "2 | Flush handlers (reload NM connection state, if the profile actually changed)"
      tags: network
      ansible.builtin.meta: flush_handlers

    - name: "2 | Note — mesh static IP correction needs a reboot (or manual con up) to take effect"
      tags: network
      debug:
        msg: >-
          MeshCentral static IP is changing from {{ _mesh_ip_live.stdout | trim }} to
          {{ mesh_static_ip }} on {{ _mesh_iface }} — this session may be connected via
          that same interface, so bringing the connection up now would risk dropping it
          mid-play. The corrected profile has been written to disk — nothing has been
          applied live. Reboot this host, or run `nmcli connection up mesh-static`
          yourself from a session that isn't riding {{ _mesh_iface }} (e.g. console/
          out-of-band), once you're ready to apply it.
      when: _mesh_activate_would_strand_session

    - name: "2 | Bring up mesh-static connection"
      tags: network
      command: nmcli connection up mesh-static
      changed_when: false
      when: not _mesh_activate_would_strand_session

  # ---------------------------------------------------------------------------
  # Section 3 — Base packages
  # ---------------------------------------------------------------------------

    - name: "3 | Update apt cache"
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: "3 | Upgrade all packages"
      apt:
        upgrade: dist
        dpkg_options: "force-confold,force-confdef"

    - name: "3 | Install base packages"
      apt:
        name: "{{ mesh_base_packages }}"
        state: present
        install_recommends: false
        dpkg_options: "force-confold,force-confdef"

  # ---------------------------------------------------------------------------
  # Section 4 — UFW firewall
  # ---------------------------------------------------------------------------

    - name: "4 | Set UFW default — deny incoming"
      ufw:
        direction: incoming
        policy: deny

    - name: "4 | Set UFW default — allow outgoing"
      ufw:
        direction: outgoing
        policy: allow

    - name: "4 | Allow SSH"
      ufw:
        rule: allow
        port: "22"
        proto: tcp
        comment: SSH

    - name: "4 | Allow MeshCentral HTTPS"
      ufw:
        rule: allow
        port: "{{ mesh_port }}"
        proto: tcp
        comment: MeshCentral HTTPS

    - name: "4 | Enable UFW"
      ufw:
        state: enabled

  # ---------------------------------------------------------------------------
  # Section 5 — Node.js (NodeSource LTS)
  # ---------------------------------------------------------------------------

    - name: "5 | Check installed Node.js version"
      command: node --version
      register: _node_version_check
      changed_when: false
      failed_when: false

    - name: "5 | Download NodeSource setup script"
      get_url:
        url: "https://deb.nodesource.com/setup_{{ mesh_nodejs_major }}.x"
        dest: /tmp/nodesource_setup.sh
        mode: "0755"
      when: >-
        _node_version_check.rc != 0
        or not _node_version_check.stdout.startswith('v' ~ mesh_nodejs_major ~ '.')

    - name: "5 | Run NodeSource setup script (adds apt repo)"
      command: bash /tmp/nodesource_setup.sh
      when: >-
        _node_version_check.rc != 0
        or not _node_version_check.stdout.startswith('v' ~ mesh_nodejs_major ~ '.')

    - name: "5 | Install Node.js"
      apt:
        name: nodejs
        state: present
        update_cache: true

  # ---------------------------------------------------------------------------
  # Section 6 — MeshCentral install
  # Dedicated non-root system user, own directory, npm install -- official
  # MeshCentral quickstart pattern (no vendored package/apt repo exists).
  # ---------------------------------------------------------------------------

    - name: "6 | Create meshcentral system user"
      user:
        name: "{{ mesh_user }}"
        system: true
        shell: /usr/sbin/nologin
        home: "{{ mesh_install_dir }}"
        create_home: false

    - name: "6 | Create install directory"
      file:
        path: "{{ mesh_install_dir }}"
        state: directory
        owner: "{{ mesh_user }}"
        group: "{{ mesh_user }}"
        mode: "0750"

    - name: "6 | Check installed MeshCentral version"
      command: "node {{ mesh_install_dir }}/node_modules/meshcentral --launchinfo"
      register: _mesh_installed_check
      changed_when: false
      failed_when: false
      become_user: "{{ mesh_user }}"

    - name: "6 | Install/update MeshCentral via npm"
      community.general.npm:
        name: meshcentral
        path: "{{ mesh_install_dir }}"
        state: latest
      become_user: "{{ mesh_user }}"
      register: _mesh_npm_install

  # ---------------------------------------------------------------------------
  # Section 7 — Configuration
  # Self-signed TLS (MeshCentral's own default) -- deliberately no
  # "letsencrypt" block. See group_vars' mesh_cert_hostname comment for why.
  # ---------------------------------------------------------------------------

    - name: "7 | Create meshcentral-data directory"
      file:
        path: "{{ mesh_install_dir }}/meshcentral-data"
        state: directory
        owner: "{{ mesh_user }}"
        group: "{{ mesh_user }}"
        mode: "0750"

    - name: "7 | Write config.json"
      copy:
        dest: "{{ mesh_install_dir }}/meshcentral-data/config.json"
        owner: "{{ mesh_user }}"
        group: "{{ mesh_user }}"
        mode: "0640"
        content: |
          {
            "settings": {
              "cert": "{{ mesh_cert_hostname }}",
              "port": {{ mesh_port }},
              "redirPort": null
            },
            "domains": {
              "": {
                "title": "Example Music Remote Management",
                "title2": "MeshCentral"
              }
            }
          }
      notify: Restart MeshCentral

  # ---------------------------------------------------------------------------
  # Section 8 — systemd service
  # AmbientCapabilities grants CAP_NET_BIND_SERVICE so the non-root
  # meshcentral user can bind port 443 without running as root — least
  # privilege, matches the platform brief's own security goals.
  # ---------------------------------------------------------------------------

    - name: "8 | Write meshcentral.service"
      copy:
        dest: /etc/systemd/system/meshcentral.service
        mode: "0644"
        content: |
          [Unit]
          Description=MeshCentral Server
          After=network-online.target
          Wants=network-online.target

          [Service]
          Type=simple
          User={{ mesh_user }}
          Group={{ mesh_user }}
          WorkingDirectory={{ mesh_install_dir }}
          ExecStart=/usr/bin/node {{ mesh_install_dir }}/node_modules/meshcentral
          Restart=always
          RestartSec=10
          AmbientCapabilities=CAP_NET_BIND_SERVICE
          NoNewPrivileges=true

          [Install]
          WantedBy=multi-user.target
      notify:
        - Reload systemd
        - Restart MeshCentral

    - name: "8 | Flush handlers (systemd reload before first start)"
      meta: flush_handlers

    - name: "8 | Enable and start MeshCentral"
      systemd:
        name: meshcentral
        state: started
        enabled: true

    - name: "8 | Wait for MeshCentral web UI to become available"
      uri:
        url: "https://127.0.0.1:{{ mesh_port }}/"
        validate_certs: false
        status_code: [200, 302]
      register: _mesh_health
      until: _mesh_health.status is defined
      retries: 12
      delay: 5
      failed_when: false

    - name: "8 | Warn if MeshCentral web UI did not respond"
      debug:
        msg: >-
          MeshCentral did not respond on https://127.0.0.1:{{ mesh_port }}/ after 60s.
          Check `journalctl -u meshcentral` on {{ mesh_hostname }} — first launch can
          take longer than usual while it generates its self-signed certificate and
          initial NeDB database.
      when: _mesh_health.status is not defined

  # ---------------------------------------------------------------------------
  # Section 9 — Dynamic MOTD
  # ---------------------------------------------------------------------------

    - name: "9 | Write dynamic MOTD script"
      copy:
        dest: /etc/update-motd.d/10-examplemusic
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          WH='\033[1;37m'; YL='\033[1;33m'; GR='\033[0;32m'; CY='\033[0;36m'; NC='\033[0m'
          UPTIME=$(uptime -p)
          LOAD=$(cut -d' ' -f1-3 /proc/loadavg)
          MEM_TOTAL=$(awk '/MemTotal/{print int($2/1024)}' /proc/meminfo)
          MEM_FREE=$(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo)
          MEM_USED=$(( MEM_TOTAL - MEM_FREE ))
          DISK=$(df -h / | awk 'NR==2{print $3" used of "$2" ("$5")"}')
          MESH_STATUS=$(systemctl is-active meshcentral 2>/dev/null || echo "unknown")
          echo -e "
          ${WH}╔══════════════════════════════════════════════════════════════╗${NC}
          ${WH}║     EXAMPLE MUSIC LIMITED: $(printf '%-35s' "${HOSTNAME}")║${NC}
          ${WH}╚══════════════════════════════════════════════════════════════╝${NC}

            ${YL}Site     :${NC} {{ mesh_site_code }}: {{ mesh_site_city }}, {{ mesh_site_country }}
            ${YL}Entity   :${NC} {{ mesh_site_entity }}
            ${YL}Role     :${NC} MeshCentral remote management server

            ${WH}── MeshCentral ──────────────────────────────────────────────${NC}
              ${CY}Status${NC}     : ${GR}${MESH_STATUS}${NC}
              ${CY}Web UI${NC}     : ${GR}https://{{ mesh_static_ip }}:{{ mesh_port }}${NC}
              ${CY}Install${NC}    : ${GR}{{ mesh_install_dir }}${NC}

            ${WH}── System ───────────────────────────────────────────────────${NC}
              ${CY}Uptime${NC}     : ${GR}${UPTIME}${NC}
              ${CY}Load${NC}       : ${GR}${LOAD}${NC}
              ${CY}Memory${NC}     : ${GR}${MEM_USED}MB${NC} used of ${MEM_TOTAL}MB
              ${CY}Disk /${NC}     : ${GR}${DISK}${NC}

            ${WH}── Quick reference ──────────────────────────────────────────${NC}
              ${CY}Logs        :${NC} journalctl -u meshcentral -f
              ${CY}Restart     :${NC} systemctl restart meshcentral
              ${CY}Config      :${NC} {{ mesh_install_dir }}/meshcentral-data/config.json
          "

    - name: "9 | Enable MOTD in sshd_config"
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PrintMotd"
        line: "PrintMotd yes"
        state: present
      notify: Restart SSH

    - name: "9 | Write MOTD profile.d hook"
      copy:
        dest: /etc/profile.d/motd.sh
        mode: "0755"
        content: |
          [[ -x /etc/update-motd.d/10-examplemusic ]] && /etc/update-motd.d/10-examplemusic

  # ---------------------------------------------------------------------------
  # Section 10 — Node info file
  # ---------------------------------------------------------------------------

    - name: "10 | Resolve environment"
      include_tasks: ../../tasks/nodeinfo_environment.yml

    - name: "10 | Set mesh_environment"
      set_fact:
        mesh_environment: "{{ resolved_environment }}"

    - name: "10 | Ensure /etc/example-music directory exists"
      file:
        path: /etc/example-music
        state: directory
        mode: "0755"

    - name: "10 | Write /etc/example-music/nodeinfo.json"
      include_tasks: ../../tasks/nodeinfo.yml
      vars:
        nodeinfo_hostname: "{{ mesh_hostname }}"
        nodeinfo_role: "meshcentral"
        nodeinfo_site: "{{ mesh_site_code }}"
        nodeinfo_city: "{{ mesh_site_city }}"
        nodeinfo_country: "{{ mesh_site_country }}"
        nodeinfo_entity: "{{ mesh_site_entity }}"
        nodeinfo_street: "{{ mesh_site_street | default('') }}"
        nodeinfo_postal_code: "{{ mesh_site_postal_code | default('') }}"
        nodeinfo_environment: "{{ mesh_environment | default('production') }}"
        nodeinfo_bootstrapped_by: "meshcentral_server.yml"
        nodeinfo_extra:
          static_ip: "{{ mesh_static_ip }}"
          mesh_url: "https://{{ mesh_static_ip }}:{{ mesh_port }}"

  # ---------------------------------------------------------------------------
  # Handlers
  # ---------------------------------------------------------------------------

  handlers:

    - name: Restart NetworkManager
      systemd:
        name: NetworkManager
        state: restarted

    - name: Reload NetworkManager connections
      ansible.builtin.command: nmcli connection reload
      changed_when: true

    - name: Reload systemd
      systemd:
        daemon_reload: true

    - name: Restart MeshCentral
      systemd:
        name: meshcentral
        state: restarted

    - name: Restart SSH
      systemd:
        name: ssh
        state: restarted
