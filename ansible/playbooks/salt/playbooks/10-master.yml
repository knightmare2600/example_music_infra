---
# =============================================================================
# playbooks/10-master.yml
# Example Music Limited — Salt master install + configuration
# =============================================================================
# Bootstraps EXASLTCLD001 (or any cloud-hosted Salt master) from a fresh
# Debian Trixie install to a running Salt master. Same OS-provisioning path
# as every other Debian service VM in this estate (EXARUDCLD001,
# EXAANSCLD001) -- the ansible user + SSH key come from late_command.sh
# during the Debian netinstall, not from this playbook.
#
# The install/master-config half of what used to be the single monolithic
# salt_master.yml (see this module's site.yml for the full numbered-stage
# history) -- hostname/IP/gateway prompting now lives in 00-preflight.yml,
# salt-api/SaltGUI now lives in 20-saltgui.yml.
#
# Sections:
#   1.  Hostname
#   2.  Network — static IP (host_vars with interactive fallback via 00-preflight.yml)
#   3.  Base packages
#   4.  UFW firewall
#   5.  Salt repository + salt-master install (version-pinned)
#   6.  Master configuration (/etc/salt/master)
#   7.  Node info file
#
# Needs 00-preflight.yml's facts (salt_hostname/salt_static_ip/salt_gateway)
# -- run together, or via site.yml, rather than standalone.
#
# Usage:
#   ansible-playbook -i configs/inventory playbooks/salt/playbooks/10-master.yml
#
# Tags: master
#
# Version alignment
# ------------------
# group_vars/salt_servers/main.yml's salt_version_major (currently "3008")
# pins this install to that major.x line via an apt preferences file
# (Section 5). The Windows minion installer documented in
# docs/buildsheets/buildsheet-salt-minion.md must be fetched from the same
# major line -- master and minions running mismatched major versions is
# an unsupported combination upstream. Bump both together.
#
# Idempotency
# -----------
# Every task is idempotent. Re-running against an already-configured master
# is safe -- tasks that are already done report 'ok' and change nothing.
# =============================================================================
# Version history
# =============================================================================
# v1.0.0  2026-07-20  Initial release, as part of the single monolithic
#                     salt_master.yml. Sections 1-4 (hostname, static IP,
#                     base packages, UFW) ported directly from
#                     rudder_server.yml's equivalent sections -- same
#                     class of host (single CLD-hosted Debian service VM),
#                     no reason to design these independently. Section 5
#                     installs from packages.broadcom.com (Salt Project's
#                     post-Broadcom-acquisition package host -- repo.
#                     saltproject.io no longer serves current releases),
#                     pinned to salt_version_major via apt preferences
#                     rather than a hand-guessed exact Debian package
#                     suffix. auto_accept left False deliberately -- new
#                     minion keys require a manual `salt-key -a`, matching
#                     this repo's existing security-posture conventions
#                     (see memory/feedback_security_posture_is_roberts_call
#                     equivalent: don't flip auth/acceptance defaults for
#                     convenience).
#   2026-07-22  Session-safe NetworkManager rework (Section 2) -- this used
#               to `nmcli con delete salt-static` + `nmcli con add ...` on
#               EVERY run, unconditionally, with no idempotency check at
#               all. nmcli deactivates an active connection before deleting
#               it, so re-running this against a box already on
#               salt-static (any run after the first reboot) would drop
#               exactly the connection Ansible's own SSH session might be
#               riding -- the same class of bug found and fixed live in
#               bind9-dns.yml on EXADNSVRK001. Rebuilt to the same
#               templated-.nmconnection-keyfile + `nmcli connection reload`
#               + live-address-mismatch strand-check pattern.
#   2026-07-22  Split out of the single monolithic salt_master.yml into this
#               numbered-stage chain (00-preflight/10-master/20-saltgui +
#               site.yml), matching the convention already used by
#               proxmox/windows_bootstrap/windows_dc, so salt-api/SaltGUI
#               (20-saltgui.yml) could be added as its own self-contained
#               stage rather than growing the one file further.
# =============================================================================

- name: Salt master — install and configure
  hosts: salt_servers
  become: true
  gather_facts: true
  ignore_unreachable: false

  vars_files:
    - ../../../configs/inventory/group_vars/salt_servers/main.yml

  pre_tasks:

    - name: Gate on /etc/example-music/* freshness
      include_tasks: ../../../tasks/example_music_freshness_gate.yml
      vars:
        example_music_gate_files: [sites.csv, ad_forest.json]
        example_music_gate_repo_root: "{{ playbook_dir }}/../../../.."

  # ---------------------------------------------------------------------------
  # Section 1 — Hostname
  # ---------------------------------------------------------------------------

  tasks:

    - name: "1 | Set hostname"
      hostname:
        name: "{{ salt_hostname | lower }}"

    - name: "1 | Add FQDN to /etc/hosts"
      lineinfile:
        path: /etc/hosts
        regexp: "^127\\.0\\.1\\.1"
        line: >-
          127.0.1.1  {{ salt_hostname | lower }}.{{ salt_domain }}  {{ salt_hostname | lower }}
        state: present

  # ---------------------------------------------------------------------------
  # Section 2 — Static IP via NetworkManager
  # Same CLD-cloud caveat as rudder_server.yml -- ICMP may be filtered, check
  # is best-effort, warns but does not fail.
  # ---------------------------------------------------------------------------

    - name: "2 | Install NetworkManager if missing"
      apt:
        name: network-manager
        state: present
        update_cache: true

    - name: "2 | Check whether target IP is already in use (CLD best-effort)"
      command: "ping -c1 -W1 {{ salt_static_ip }}"
      register: _ping_check
      changed_when: false
      failed_when: false

    - name: "2 | Check current IPs on this host"
      command: hostname -I
      register: _current_ips
      changed_when: false

    - name: "2 | Warn if target IP appears in use by another host"
      fail:
        msg: >
          {{ salt_static_ip }} is responding to ping and is NOT assigned to
          this host. Resolve the IP conflict before proceeding.
          (If this is a cloud host and ICMP is filtered, this check may be a
          false positive — in that case, remove this task and re-run.)
      when:
        - _ping_check.rc == 0
        - salt_static_ip not in _current_ips.stdout.split()

    - name: "2 | Warn if ping check is unreliable (cloud environment)"
      debug:
        msg: >-
          [CLD] ping check returned rc={{ _ping_check.rc }}.
          On cloud hosts ICMP may be filtered — IP conflict check is
          best-effort only. Proceeding.
      when: _ping_check.rc != 0

    - name: "2 | Detect provisioning interface (first non-loopback with an IP)"
      shell: |
        for iface in $(ls /sys/class/net/); do
          [[ "$iface" == "lo" ]] && continue
          ip_addr=$(ip -4 addr show "$iface" 2>/dev/null | grep -oP '(?<=inet\s)\d+\.\d+\.\d+\.\d+' | head -1)
          if [[ -n "$ip_addr" ]]; then
            echo "$iface"
            exit 0
          fi
        done
        exit 1
      args:
        executable: /bin/bash
      register: _detected_iface
      changed_when: false

    - name: "2 | Set interface name fact"
      set_fact:
        _salt_iface: "{{ salt_network_interface | default(_detected_iface.stdout | trim, true) }}"

    - name: "2 | Read interface MAC address"
      slurp:
        src: "/sys/class/net/{{ _salt_iface }}/address"
      register: _iface_mac_raw

    - name: "2 | Set MAC address fact"
      set_fact:
        _salt_mac: "{{ _iface_mac_raw.content | b64decode | trim }}"

    - name: "2 | Pin interface name via systemd .link"
      copy:
        dest: "/etc/systemd/network/10-salt-prov.link"
        content: |
          # Example Music — Salt master interface pin
          # Written by 10-master.yml on {{ ansible_date_time.iso8601 }}
          # MAC: {{ _salt_mac }}  interface: {{ _salt_iface }}
          [Match]
          MACAddress={{ _salt_mac }}
          [Link]
          Name={{ _salt_iface }}
        mode: "0644"

    - name: "2 | Mask ifupdown to prevent conflict with NetworkManager"
      systemd:
        name: "networking.service"
        masked: true
        enabled: false
      failed_when: false

    - name: "2 | Check for /etc/network/interfaces"
      stat:
        path: /etc/network/interfaces
      register: _salt_interfaces_file

    - name: "2 | Remove ifupdown stanza for {{ _salt_iface }} from /etc/network/interfaces"
      # blockinfile (previous approach) only ever removes a block IT previously inserted
      # with a matching marker -- it can never touch genuine pre-existing ifupdown content
      # like the "allow-hotplug ens18 / iface ens18 inet dhcp" every fresh Debian box ships
      # with, so it silently did nothing. Real live bug, EXARMMCLD001, 2026-08-06 (same
      # session-safe pattern this file shares): masking networking.service does NOT stop
      # allow-hotplug's own udev-triggered ifup mechanism, so the leftover DHCP stanza kept
      # assigning a second "secondary dynamic" address on the same interface as the manual
      # static one, surviving a full reboot. Same sed approach as firewallme/roles/firewall/
      # tasks/06_network_manager.yml's own proven fix for the identical problem -- targets
      # the real stanza syntax directly.
      shell: |
        set -e
        if grep -qE "^(auto|allow-|iface)\s+{{ _salt_iface }}\b" /etc/network/interfaces; then
          sed -i "/^auto\s\+{{ _salt_iface }}\b/d"      /etc/network/interfaces
          sed -i "/^allow-.*\s{{ _salt_iface }}\b/d"     /etc/network/interfaces
          sed -i "/^iface[[:space:]]\+{{ _salt_iface }}\b/,/^[^[:space:]]/d" /etc/network/interfaces
          echo 1
        else
          echo 0
        fi
      register: _salt_interfaces_cleaned
      changed_when: _salt_interfaces_cleaned.stdout | trim == '1'
      when: _salt_interfaces_file.stat.exists

    - name: "2 | Ensure NetworkManager manages interfaces"
      ini_file:
        path: /etc/NetworkManager/NetworkManager.conf
        section: ifupdown
        option: managed
        value: "true"
        no_extra_spaces: true
        backup: true
      notify: Restart NetworkManager

    - name: "2 | Ensure NetworkManager is running"
      systemd:
        name: NetworkManager
        state: started
        enabled: true

    # BUG FIX (2026-07-22): this used to `nmcli con delete salt-static` followed by
    # `nmcli con add ...` on EVERY run, unconditionally, with no check of the live/on-disk
    # profile state at all (changed_when was always true). nmcli deactivates an active
    # connection before deleting it, so re-running this playbook against a box already on
    # salt-static (i.e. any run after the first reboot) would drop exactly the connection
    # Ansible's own SSH session might be riding — the same class of bug found and fixed live
    # in bind9-dns.yml on EXADNSVRK001 (see that file's own 2026-07-21/22 changelog), and the
    # identical copy-pasted pattern also found and fixed the same day in rudder_server.yml.
    # Rebuilt to match that established session-safe pattern: a templated .nmconnection
    # keyfile for real idempotency (task reports unchanged when nothing differs), applied via
    # `nmcli connection reload` (re-reads profile files, does not tear down an active
    # connection) rather than delete+recreate, and a live-address-mismatch check before ever
    # running `nmcli connection up` — the one command that actually pushes a changed address
    # onto a live interface — so a genuine IP correction is written to disk and reported,
    # never applied live out from under the exact session running this play.

    - name: "2 | Detect current live IP on the salt interface"
      tags: network
      ansible.builtin.shell: |
        nmcli -g IP4.ADDRESS dev show {{ _salt_iface }} 2>/dev/null | head -1 | cut -d/ -f1
      register: _salt_ip_live
      changed_when: false
      failed_when: false

    - name: "2 | Set flag — would bringing salt-static up now strand this session?"
      tags: network
      ansible.builtin.set_fact:
        _salt_activate_would_strand_session: >-
          {{
            _salt_ip_live.stdout | trim != ''
            and _salt_ip_live.stdout | trim != salt_static_ip
          }}

    # 2026-07-24: added autoconnect-retries=-1 to salt-static.nmconnection.j2 -- found
    # missing during a firewall-role nmconnection audit the same day (that role's own
    # firewallme.sh source of truth documents this as a real boot-reliability fix, "NM never
    # gives up on boot"). route-metric NOT added here -- unlike the dual WAN/LAN firewall,
    # this is a single-NIC static-IP box with its own gateway, no second interface competing
    # for the default route, so route-metric would be inert config, not a real fix.
    - name: "2 | Write salt-static NetworkManager connection profile"
      tags: network
      ansible.builtin.template:
        src: salt-static.nmconnection.j2
        dest: /etc/NetworkManager/system-connections/salt-static.nmconnection
        owner: root
        group: root
        mode: "0600"
      notify: Reload NetworkManager connections

    - name: "2 | Flush handlers (reload NM connection state, if the profile actually changed)"
      tags: network
      ansible.builtin.meta: flush_handlers

    - name: "2 | Note — salt static IP correction needs a reboot (or manual con up) to take effect"
      tags: network
      debug:
        msg: >-
          Salt static IP is changing from {{ _salt_ip_live.stdout | trim }} to
          {{ salt_static_ip }} on {{ _salt_iface }} — this session may be connected via
          that same interface, so bringing the connection up now would risk dropping it
          mid-play. The corrected profile has been written to disk — nothing has been
          applied live. Reboot this host, or run `nmcli connection up salt-static`
          yourself from a session that isn't riding {{ _salt_iface }} (e.g. console/
          out-of-band), once you're ready to apply it.
      when: _salt_activate_would_strand_session

    - name: "2 | Bring up salt-static connection"
      tags: network
      command: nmcli connection up salt-static
      changed_when: false
      when: not _salt_activate_would_strand_session

  # ---------------------------------------------------------------------------
  # Section 3 — Base packages
  # ---------------------------------------------------------------------------

    - name: "3 | Update apt cache"
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: "3 | Upgrade all packages"
      apt:
        upgrade: dist
        dpkg_options: "force-confold,force-confdef"

    - name: "3 | Install base packages"
      apt:
        name: "{{ salt_base_packages }}"
        state: present
        install_recommends: false
        dpkg_options: "force-confold,force-confdef"

  # ---------------------------------------------------------------------------
  # Section 4 — UFW firewall
  # ---------------------------------------------------------------------------

    - name: "4 | Set UFW default — deny incoming"
      ufw:
        direction: incoming
        policy: deny

    - name: "4 | Set UFW default — allow outgoing"
      ufw:
        direction: outgoing
        policy: allow

    - name: "4 | Allow SSH"
      ufw:
        rule: allow
        port: "22"
        proto: tcp
        comment: SSH

    - name: "4 | Allow Salt ports from all site subnets"
      ufw:
        rule: allow
        src: "{{ item.subnet }}"
        port: "{{ item.port }}"
        proto: tcp
        comment: "Salt {{ item.comment }}"
      loop: "{{ salt_site_ufw_rules }}"

    - name: "4 | Enable UFW"
      ufw:
        state: enabled

  # ---------------------------------------------------------------------------
  # Section 5 — Salt repository and master install
  # Packages.broadcom.com is Salt Project's package host since the Broadcom
  # acquisition -- repo.saltproject.io no longer serves current releases
  # (confirmed 2026-07-20 against docs.saltproject.io's own install guide).
  # Pinned to salt_version_major via apt preferences so master and minions
  # stay on a matching major line -- see this file's header.
  # ---------------------------------------------------------------------------

    - name: "5 | Create apt keyrings directory"
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: "5 | Download Salt Project GPG key"
      shell: >
        curl -fsSL https://packages.broadcom.com/artifactory/api/security/keypair/SaltProjectKey/public
        | gpg --dearmor > /etc/apt/keyrings/salt-archive-keyring.pgp
      args:
        creates: /etc/apt/keyrings/salt-archive-keyring.pgp

    - name: "5 | Fetch Salt apt sources file"
      get_url:
        url: https://github.com/saltstack/salt-install-guide/releases/latest/download/salt.sources
        dest: /etc/apt/sources.list.d/salt.sources
        mode: "0644"
      notify: Update apt cache

    - name: "5 | Pin Salt packages to salt_version_major"
      copy:
        dest: /etc/apt/preferences.d/salt-pin
        content: |
          # Example Music — keep master/minion versions aligned
          # Written by 10-master.yml -- see group_vars/salt_servers/main.yml's
          # salt_version_major and docs/buildsheets/buildsheet-salt-minion.md
          Package: salt-*
          Pin: version {{ salt_version_major }}.*
          Pin-Priority: 1001
        mode: "0644"
      notify: Update apt cache

    - name: "5 | Update apt cache after adding Salt repo"
      apt:
        update_cache: true
      changed_when: false

    - name: "5 | Install salt-master"
      apt:
        name: salt-master
        state: present
        install_recommends: false
        dpkg_options: "force-confold,force-confdef"

    - name: "5 | Verify installed Salt version matches the pinned major line"
      command: salt --version
      register: _salt_version_check
      changed_when: false

    - name: "5 | Fail if installed version does not match salt_version_major"
      assert:
        that:
          - "salt_version_major in _salt_version_check.stdout"
        fail_msg: >
          Installed Salt version ({{ _salt_version_check.stdout }}) does not
          match salt_version_major ({{ salt_version_major }}). Check
          /etc/apt/preferences.d/salt-pin and the apt repo state before
          proceeding -- minions built against the wrong major line will not
          talk to this master correctly.
        success_msg: "Salt version confirmed on the {{ salt_version_major }}.x line."

    - name: "5 | Enable and start salt-master"
      systemd:
        name: salt-master
        state: started
        enabled: true

  # ---------------------------------------------------------------------------
  # Section 6 — Master configuration
  # auto_accept deliberately False -- new minion keys require a manual
  # `salt-key -a` (see docs/buildsheets/buildsheet-salt-minion.md's
  # "Verifying check-in" section). Not something to flip for convenience.
  #
  # gitfs/git_pillar: states and pillar are served straight from this repo's
  # own git remote -- salt/README.md called this "not yet built" as of
  # 2026-07-20; wired up the same day once the delivery mechanism was
  # settled. No credentials needed (gitfs_user/gitfs_privkey etc.) -- this
  # repo is public, so a plain HTTPS remote is all gitfs/git_pillar need
  # (see salt/README.md for the full reasoning). gitfs_root/git_pillar's
  # own root: option point at salt/states and salt/pillar respectively,
  # rather than the repo root, since this repo has plenty else in it.
  #
  # SaltGUI's own external_auth/netapi_enable_clients/rest_cherrypy settings
  # live in a SEPARATE drop-in, /etc/salt/master.d/saltgui.conf, written by
  # 20-saltgui.yml -- not here. Salt merges every *.conf under master.d/
  # automatically, so that stage stays cleanly decoupled from this one and
  # only applies once it has actually run.
  # ---------------------------------------------------------------------------

    - name: "6 | Write /etc/salt/master"
      copy:
        dest: /etc/salt/master
        content: |
          # Example Music — Salt master config
          # Written by 10-master.yml on {{ ansible_date_time.iso8601 }}
          interface: 0.0.0.0
          publish_port: 4505
          ret_port: 4506
          auto_accept: {{ salt_master_auto_accept | default(false) }}
          log_level: warning
          log_level_logfile: info

          # States served from this repo's own salt/states/ via gitfs -- public
          # repo, no credentials needed (see salt/README.md).
          fileserver_backend:
            - gitfs
          gitfs_remotes:
            - {{ salt_gitfs_repo_url }}:
              - root: salt/states

          # Pillar served from this repo's own salt/pillar/ via git_pillar --
          # same repo, separate mechanism from gitfs (ext_pillar, not
          # fileserver_backend). Branch name (main) doubles as the pillar
          # environment unless overridden with env: -- see salt/README.md.
          ext_pillar:
            - git:
              - main {{ salt_gitfs_repo_url }}:
                - root: salt/pillar
        mode: "0644"
        backup: true
      notify: Restart salt-master

  # ---------------------------------------------------------------------------
  # Section 7 — Node info file
  # ---------------------------------------------------------------------------

    - name: "7 | Resolve environment"
      include_tasks: ../../../tasks/nodeinfo_environment.yml

    - name: "7 | Set salt_environment"
      set_fact:
        salt_environment: "{{ resolved_environment }}"

    - name: "7 | Ensure /etc/example-music directory exists"
      file:
        path: /etc/example-music
        state: directory
        mode: "0755"

    - name: "7 | Write /etc/example-music/nodeinfo.json"
      include_tasks: ../../../tasks/nodeinfo.yml
      vars:
        nodeinfo_hostname: "{{ salt_hostname }}"
        nodeinfo_role: "salt"
        nodeinfo_site: "{{ salt_site_code }}"
        nodeinfo_city: "{{ salt_site_city }}"
        nodeinfo_country: "{{ salt_site_country }}"
        nodeinfo_entity: "{{ salt_site_entity }}"
        nodeinfo_environment: "{{ salt_environment | default('production') }}"
        nodeinfo_bootstrapped_by: "10-master.yml"
        nodeinfo_extra:
          static_ip: "{{ salt_static_ip }}"
          salt_version_major: "{{ salt_version_major }}"
          scope: "All Windows nodes (WKS/LAP/SUR/SVR/DCS) — FWL/PVE stay Ansible-only"

  # ---------------------------------------------------------------------------
  # Post-run summary
  # ---------------------------------------------------------------------------

    - name: "Summary"
      debug:
        msg:
          - "════════════════════════════════════════════════════════════════"
          - "  SALT MASTER SETUP COMPLETE — {{ salt_hostname }}"
          - "════════════════════════════════════════════════════════════════"
          - "  Site        : {{ salt_site_code }} — {{ salt_site_city }}, {{ salt_site_country }}"
          - "  Hostname    : {{ salt_hostname }}"
          - "  Static IP   : {{ salt_static_ip }} ({{ 'active' if not _salt_activate_would_strand_session | default(false) else 'active on next reboot, or run: nmcli connection up salt-static' }})"
          - "  Salt version: {{ salt_version_major }}.x (pinned)"
          - "  Ports       : 4505/tcp (publish), 4506/tcp (return)"
          - "════════════════════════════════════════════════════════════════"
          - "  Remaining manual steps:"
          - "    1. Confirm bootstrap/web/windows/{x86_64,arm64}/Salt-Minion-*.msi"
          - "       are the matching {{ salt_version_major }}.x build (buildsheet-salt-minion.md --"
          - "       arm64 is a custom build, not an official release, see that doc's own caveat)"
          - "    2. Build/onboard a client endpoint (unattend XML or manual fallback)"
          - "    3. salt-key -L on this host to see the new minion's unaccepted key"
          - "    4. salt-key -a <minion-name> to accept it"
          - "    5. salt '<minion-name>' test.ping to confirm check-in"
          - "  Next stage: playbooks/salt/playbooks/20-saltgui.yml (salt-api + SaltGUI)"
          - "════════════════════════════════════════════════════════════════"

  # ---------------------------------------------------------------------------
  # Handlers
  # ---------------------------------------------------------------------------

  handlers:

    - name: Restart NetworkManager
      systemd:
        name: NetworkManager
        state: restarted

    - name: Reload NetworkManager connections
      ansible.builtin.command: nmcli connection reload
      changed_when: true

    - name: Update apt cache
      apt:
        update_cache: true

    - name: Restart salt-master
      systemd:
        name: salt-master
        state: restarted
