---
# =============================================================================
# Example Music Limited -- BIND9 DNS Server Playbook
# Target      : EXADNSVRK001  (exadnsvrk001.jukebox.internal) -- master, default
#               EXADNSFRD001  (exadnsfrd001.jukebox.internal) -- secondary/replica
# Role        : Authoritative DNS (master) or secondary/replica (slave) -- jukebox.internal
# OS          : Debian trixie
# IP          : 192.168.139.8/24 (VRK, provisioning network) or
#               172.16.124.8/24 (FRD, its own current sites.csv subnet)
#
# This playbook mirrors bindme.sh exactly for the master role. It is the
# idempotent, Ansible-managed equivalent -- suitable for ongoing
# configuration management and CI enforcement. bindme.sh is the
# bootstrapper; this playbook is the enforcer. bindme.sh does NOT yet have
# a matching secondary/slave mode -- that's a follow-up, not blocking this
# (the Ansible path is the documented "normal path" for every other
# playbook family in this repo; break-glass bash scripts are always
# secondary).
#
# 2026-09-24: Play 1 (this play) now supports EXADNSFRD001 as a genuine
# secondary/replica of this same zone (Robert, confirmed: not a separate
# authoritative sub-zone, not a caching-only forwarder) -- see
# docs/adding-new-sites-bands-devices-and-subnets.md for the full context. Play 2 (zone generation
# from devices.csv, below) stays master-only by design and always targets
# EXADNSVRK001 -- a secondary never generates zone content locally, BIND9
# pulls and caches it automatically via AXFR/IXFR from the master.
#
# Prerequisites:
#   - Host reachable via SSH as ansible user (192.168.139.8 for VRK,
#     172.16.124.8 for FRD)
#   - sites.csv present at {{ sites_csv_path }} on the control node
#   - Python 3 on the target (standard Debian trixie)
#
# Variables (set in group_vars or pass with -e):
#   sites_csv_path   -- path to sites.csv on the control node
#                       default: /etc/example-music/sites.csv
#   dns_ip           -- static IP for this server
#                       default: derived from ansible_host (the real
#                       inventory address for whichever host --limit selects)
#   dns_role         -- master (default) or slave
#   dns_secondary_ip -- master only: the real secondary's IP, so
#                       allow-transfer/notify are scoped to it. 2026-10-12:
#                       auto-derived from devices.csv's own Type=DNS rows if
#                       left unset (see pre_tasks) -- blank only means "no
#                       real secondary exists in devices.csv yet". Still
#                       overridable via -e for a one-off/pre-devices.csv case.
#   dns_master_ip    -- slave only: the real master's IP to replicate from.
#                       REQUIRED when dns_role=slave -- no safe default,
#                       the preflight task fails loudly if omitted.
#   dns_gateway      -- this site's real gateway (see sites.csv). Defaults
#                       to VRK's 192.168.139.254 only when the play is
#                       actually running against EXADNSVRK001 -- REQUIRED
#                       via -e for any other host, the preflight task fails
#                       loudly otherwise (VRK's gateway is meaningless
#                       elsewhere).
#   dns_interface    -- NIC name (detected if omitted)
#                       default: "" (autodetect via dns_ip's own subnet)
#   zone_ttl         -- zone TTL in seconds
#                       default: 300
#   zone_serial      -- override SOA serial (YYYYMMDDnn format)
#                       default: auto (ansible_date_time.date + "01")
#
# Usage (run from ansible/ root -- hosts: defaults to the whole [dns] group,
# same pattern as pvenodes/firewalls/windows_dc; --limit picks one node, same
# as every other playbook family in this repo):
#   # Master (VRK) -- unchanged, defaults to today's exact behaviour:
#   ansible-playbook -i configs/inventory playbooks/bind9/bind9-dns.yml --limit EXADNSVRK001
#   ansible-playbook -i configs/inventory playbooks/bind9/bind9-dns.yml --limit EXADNSVRK001 --tags zones-full
#   ansible-playbook -i configs/inventory playbooks/bind9/bind9-dns.yml --limit EXADNSVRK001 --tags zones-full,reload
#
#   # Master, with a real secondary already in devices.csv (EXADNSFRD001 today) --
#   # dns_secondary_ip is now auto-derived, -e no longer needed for this case:
#   ansible-playbook -i configs/inventory playbooks/bind9/bind9-dns.yml --limit EXADNSVRK001 \
#     --tags zones-full,reload
#
#   # Secondary (FRD) -- first-ever run, fresh box on its own subnet already:
#   ansible-playbook -i configs/inventory playbooks/bind9/bind9-dns.yml --limit EXADNSFRD001 \
#     -e dns_role=slave -e dns_master_ip=192.168.139.8 -e dns_gateway=172.16.124.2
#
# IMPORTANT: `zones` (Play 1, below) and `zones-full` (Play 2) are NOT
# interchangeable. Play 1's zone generation is superseded by Play 2 (see
# Play 2's own header comment) but both still exist and both write to the
# same destination files (db.{{ domain }}, db.192.168.139, per-site
# reverse zones) — a full run is fine (Play 2 runs last and wins), but
# `--tags zones,reload` on its own regenerates zones from Play 1's old
# SUFFIX_MAP/hardcoded-hosts logic ONLY, without ever reading devices.csv.
# Always use `zones-full` (not `zones`) to pick up a devices.csv change.
# Play 2 is master-only regardless -- never run it against a slave target.
#
# Tags:
#   packages    -- apt install
#   network     -- static IP + hostname
#   config      -- named.conf.options + named.conf.local
#   zones       -- Play 1 zone file generation (superseded, see above)
#   zones-full  -- Play 2 zone file generation from devices.csv (use this one)
#   service     -- enable + start named
#   reload      -- rndc reload (use after zones-full to push changes live)
#   aliases     -- shell aliases
#   motd        -- dynamic MOTD
#
# Changelog:
#   2026-03-29  Initial release.  Mirrors bindme.sh v2026-03-29.
#   2026-07-07  Documented the zones vs zones-full trap above (Play 1 is
#               superseded but still present and tag-gated separately —
#               `--tags zones,reload` silently skips devices.csv entirely).
#               Fixed dns_gateway default in this comment (was documented
#               as .1, actual default is .254).
#   2026-07-08  Play 1's nodeinfo.json write now uses the shared ansible/tasks/nodeinfo.yml
#               (also used by linux/tools.yml, proxmox, firewallme, rudder_server.yml) instead
#               of its own hand-written block — missed during the 2026-07-07 consolidation.
#               Also fixes stale hardcoded city="Central"/country="GB" (CLD's real sites.csv
#               row is City=CloudSite, Country=Global) — now derived from sites.csv like every
#               other writer, instead of a wrong guess.
#   2026-07-08  Play 1's ancillary_hosts/cld_lan_hosts are no longer hardcoded -- both are now
#               built (pre_tasks, tags: always) from the same all_devices merged list Play 2
#               already computed, moved here so both plays share one computation instead of two.
#               This surfaced two real bugs in the hardcoded data it replaces:
#                 - CLD's firewall WAN face was documented at .139.139; devices.csv (VRK,FWL row,
#                   corrected 68->69 this same pass per direct confirmation) and every other
#                   source agree on .69. Also fixed the same stale .139 in db.forward-zone.j2
#                   (renamed 2026-07-11, was db.jukebox.internal.j2) and db.192.168.139.j2's
#                   separate "-wan" hardcoded line for CLD.
#                 - WAC/Rudder/PBX appeared a second time in ancillary_hosts AND in
#                   db.192.168.139.j2's PTR records, both claiming vRACK addresses at the exact
#                   same octets as their real CLD LAN devices.csv entries -- a copy-paste mistake,
#                   not a genuine second interface (confirmed). Removed from both; they're LAN-only,
#                   now correctly covered via the expanded cld_lan_hosts below.
#               cld_lan_hosts now includes every CLD device (RTR/PRV standard slots included,
#               matching what Play 2's own forward zone already publishes for CLD) instead of
#               just the historical FWL-LAN/ANS/DCS1/DCS2 subset -- CLD's DCS2 is still absent
#               from both plays' output, since DNS_MULTI_FIRST_INSTANCE_ONLY in
#               generate_inventory.py only ever synthesizes the first DCS instance for DNS,
#               site-wide, not a CLD-specific gap.
#               vRACK-side hostnames (DNS/PRV/FWL) were briefly kept as "CLD-branded"
#               (exadnscld001 etc) via a name-override lookup, then reversed the same day per
#               direct confirmation ("if we rename vrack things to suffix VRK ... I don't mind")
#               -- they now use devices.csv's own computed VRK-prefixed names directly
#               (exadnsvrk001, exaprvvrk001, exafwlvrk001), including this playbook's own
#               this_hostname/hosts target. vrk_ancillary_name_overrides is gone entirely.
#               PBX briefly kept its historically-established name (exacldpbx001) via a
#               cld_lan_name_overrides table too, until testing showed the override was
#               already inert: Play 2 (which wins on any full/correct run -- see the zones vs
#               zones-full trap documented above) renders its own CLD forward-zone section and
#               its generic per-site reverse-zone loop straight from devices.csv's own Hostname,
#               with no override applied there. The override only ever affected Play 1's
#               (always-overwritten) fallback -- never the actual live name. Per direct
#               confirmation, PBX now also uses its natural devices.csv name (exapbxcld001)
#               consistently; cld_lan_name_overrides is gone entirely, same as
#               vrk_ancillary_name_overrides above.
#   2026-07-08  A forward zone is just hostname->IP -- it doesn't care what subnet an A
#               record's IP is on (reverse zones are the subnet-specific concern, unchanged).
#               So ancillary_hosts (VRK) and cld_lan_hosts (CLD) -- previously two separate
#               set_fact tasks/lists purely because Play 1's reverse zones needed per-subnet
#               data -- are now one merged cld_black_swan_hosts list (CLD+VRK+FRD), each entry
#               tagged with its real site so the reverse-zone templates can filter it down to
#               their own subnet instead of needing their own separately-built lists.
#               Play 2's db.forward-zone.devices.j2 (renamed 2026-07-11, was
#               db.jukebox.devices.j2) got the same treatment even further: its whole
#               dedicated "CLD" forward-zone section was removed entirely -- VRK and FRD
#               already flowed through the generic per-site loop with zero special-casing
#               (octet derived from each device's own real IP, never blocked on CLD/VRK/FRD's
#               absence from sites_by_code), so CLD didn't need special-casing there either.
#               This also surfaced and fixed a real bug in that per-site loop: the section
#               header hardcoded "192.168.{{ octet }}.0/24", which would have been wrong for
#               FRD (172.16.124.0/24) the first time anything caused it to render -- now
#               derives the full subnet prefix from the device's own IP instead of assuming
#               192.168.x for every site.
#   2026-07-09  domain (both plays) now derived from benarbejde/ad_forest.json instead of a
#               hardcoded "jukebox.internal" literal -- single source of truth, same file
#               windows_dc/windows_bootstrap/windows_adschema/rudder_servers now all read.
#   2026-07-21  reloadbind/checkbind/editzone converted from profile.d shell aliases to real
#               scripts at /usr/local/bin/, matching bindme.sh's own fix. Real, live-observed
#               failure: `sudo editzone` -> "sudo: editzone: command not found" -- shell aliases
#               are invisible to sudo, which execs a fresh non-interactive process that never
#               sources any shell rc file. Also closes a capability gap the old hardcoded-alias
#               version had: checkbind/editzone now accept an optional [zone-file] argument, so
#               reverse zones can be checked/edited too, not just the default forward zone.
#   2026-07-21  Fixed both plays' hosts: exadnsvrk001 (lowercase) -- confirmed via
#               ansible-inventory that this NEVER matched the real inventory (host is
#               EXADNSVRK001, uppercase, in vrk.ini; Ansible host-pattern matching is
#               case-sensitive) -- would have silently matched zero hosts, empty PLAY RECAP,
#               no error. Found while re-running this playbook against the live DNS server
#               after fixing its hostname/VG naming elsewhere (rename-host.yml). Also fixed
#               this_hostname: "exadnsvrk001" -> "EXADNSVRK001" -- this var sets /etc/hostname
#               and /etc/hosts directly (ansible.builtin.hostname task below), so leaving it
#               lowercase would have silently re-lowercased the box's hostname on every run,
#               undoing the uppercase-hostname fix. This does NOT touch actual DNS zone-record
#               content -- that's separately, deliberately lowercased per-device from
#               devices.csv (db.forward-zone.devices.j2's dev.Hostname | lower, standard DNS
#               zone-file convention) regardless of this_hostname's value. The two dig
#               self-test tasks now explicitly lowercase this_hostname when comparing against
#               zone content, to match that convention instead of a case-sensitive Jinja
#               substring check silently failing against a real, correctly-generated zone.
#   2026-07-21  Fixed the dns_interface autodetection regex ('^192\\.168\\.139\\.') silently
#               never matching anything, on every run, on every box -- see this file's own
#               "Detect provisioning network interface" task comment for the full root cause
#               (a double-backslash inside a YAML folded block scalar, which never processes
#               escapes, unlike a double-quoted string).
#   2026-07-22  CRITICAL LIVE BUG, SESSION-KILLING: Section 2's NetworkManager tasks used to
#               `nmcli connection delete prov-static` then recreate + unconditionally `nmcli
#               connection up` on EVERY run, regardless of whether the IP was already correct --
#               tearing down and rebuilding the live connection every single time. Live-observed
#               on EXADNSVRK001: this killed the SSH session mid-play, since Ansible always
#               connects via this exact interface/IP (ansible_host is dns_ip) -- there's no other
#               path in for a real remote run. Robert: "it's clear you're not listening to me
#               about the times when IPs change" -- this is the same class of hazard
#               roles/firewall/tasks/06_network_manager.yml was rebuilt to avoid on 2026-07-09/
#               2026-07-16/2026-07-17 (see that file's own changelog), and should have been
#               applied here from the start rather than left on the old raw-nmcli pattern.
#               Rebuilt to match that file's exact session-safe design: a templated
#               .nmconnection keyfile (templates/prov-static.nmconnection.j2) for real
#               idempotency -- the write task reports unchanged when nothing differs, unlike
#               nmcli add/delete which always "changes" something -- applied via `nmcli
#               connection reload` (re-reads profile files, does not tear down an active
#               connection) instead of delete+recreate, and a live-address-mismatch check
#               (mirrors 06_network_manager.yml's nm_wan_activate_would_strand_session exactly)
#               before ever running `nmcli connection up` -- the one command that actually pushes
#               a changed address onto a live interface. A genuine IP correction is now written
#               to disk and reported clearly, never applied live out from under the exact session
#               running the play. Verified via scratch-test reproduction of the strand-detection
#               logic across all three real scenarios (already correct, wrong live IP, fresh box
#               with no live IP yet) before touching the real file.
#   2026-07-24  Fixed the self-test (section 9) failing on EXADNSVRK001's first ever full run --
#               every zone-file write task (named.conf.local, forward zone, every reverse zone)
#               notifies "Reload named", but nothing flushed handlers between those writes and
#               the self-test; handlers only run at end-of-play by default, so `dig` was querying
#               the still-running, not-yet-reloaded named process (this box's named was already
#               running from before the play started -- "Enable and start named" reported
#               unchanged), testing stale/pre-existing zone data instead of what this run just
#               wrote. Added an explicit meta: flush_handlers before section 9, mirroring section
#               2's own flush pattern rather than relying on end-of-play timing. CONFIRMED LIVE
#               the same day: full clean run against EXADNSVRK001, failed=0, first time ever.
#   2026-07-24  Added a post-run Summary task (matching rudder_server.yml/salt's 10-master.yml,
#               both fixed the same week) -- this play previously had no end-of-run recap at
#               all, only a mid-play "[NM] NOTE" debug task that fires solely when the strand-
#               check trips, easy to miss scrolled past 819 zone-file records' worth of output.
#   2026-07-26  dnsutils -> bind9-dnsutils. Found live: dnsutils is a transitional/virtual
#               package on this estate's Debian 13 (Trixie) base -- the real package
#               providing dig/nslookup/nsupdate is bind9-dnsutils now. bind9utils (RNDC/
#               named-checkconf tools, no hyphen -- a different package) unaffected.
#   2026-09-25  Robert: wanted this playbook's targeting to match every other family in
#               the repo (pvenodes/firewalls/windows_dc) -- a real run should show
#               --limit <hostname> at a glance, not rely on a silently-defaulted single
#               hostname via -e target=. Added "DNS" -> "dns" to generate_inventory.py's
#               DEVICE_GROUP_MAP (previously fell into the generic per-site [site_devices]
#               catch-all, same gap PVE/NAS closed earlier) and regenerated vrk.ini/frd.ini
#               so a real [dns] group now exists. hosts: below changed from defaulting to
#               a literal EXADNSVRK001 to defaulting to the dns group (target= still works
#               for anyone who wants hosts: to resolve straight to one host without
#               --limit, matching proxmox/site.yml's own documented flexibility). The
#               dns_gateway default and the preflight assert's fail_msg used to branch on
#               `target | default('EXADNSVRK001')` specifically because target was the only
#               variable guaranteed to reflect which host got selected -- now that hosts:
#               is a group, a --limit-only invocation leaves target unset while still
#               correctly selecting one host, so both now branch on inventory_hostname
#               instead: the real, always-correct signal for "which host is this play
#               actually running on", regardless of whether it got there via hosts:'s own
#               default, --limit, or an explicit -e target=.
#   2026-09-25  LIVE BUG, found the moment the above --limit fix was actually run against
#               EXADNSVRK001 for the first time: the preflight assert failed immediately
#               with "Recursive loop detected in template: maximum recursion depth
#               exceeded" while resolving fail_msg. Root cause: dns_role/dns_secondary_ip/
#               dns_master_ip/dns_gateway were declared in vars: as "x: {{ x | default(...)
#               }}" -- a common idiom for "optional -e override, else compute a default",
#               but only safe when the name being tested is NOT itself declared at play-var
#               precedence (e.g. hosts:'s "target | default(...)" above works precisely
#               because target has no vars: entry -- it's a real extra-var or genuinely
#               Undefined, never self-referencing). Declaring it in vars: gives the name
#               real precedence, so resolving it means resolving itself first, with no
#               external override present in the common no -e case -- true infinite
#               self-reference, not merely a lint smell; ansible-core 2.19.4 detects this
#               and aborts rather than hang. This was never caught by --syntax-check (which
#               never templates jinja values, only parses YAML/Jinja syntax) or the two
#               template unit-tests done on 2026-09-24 (those passed real dicts straight to
#               jinja2.Environment, bypassing Ansible's own vars:-precedence resolution
#               entirely) -- confirmed live-only. Fixed by moving all four to a pre_tasks
#               set_fact (tags: always, runs before the preflight assert) instead: a
#               one-shot task assignment, not a play-level vars: declaration, so the same
#               right-hand-side default() expressions resolve cleanly (extra-var if passed,
#               else genuinely Undefined -> default() -- no self-reference), and the
#               resulting facts outrank vars: for every task/template after it, so nothing
#               downstream (the assert, both .j2 templates) needed to change at all.
#   2026-10-12  dns_secondary_ip had no persistent default anywhere -- a plain -e
#               extra-var only, every single run, despite EXADNSFRD001 already being a
#               real, permanent secondary in devices.csv. Forgetting -e
#               dns_secondary_ip=<ip> on a routine master run would silently REVOKE the
#               secondary's AXFR permission (named.conf.local.j2's allow-transfer
#               defaults to `none` when blank) -- confirmed this would have happened
#               live, having given Robert the exact command without it. Added a
#               pre_tasks set_fact that auto-derives it from devices.csv's own Type=DNS
#               rows (excluding this master's own site) when dns_role == 'master' and
#               nothing was explicitly passed -- -e dns_secondary_ip=<ip> still
#               overrides when needed (e.g. onboarding a new secondary before its
#               devices.csv row exists yet).
#   2026-10-25  BUG FIX, Robert's repo-wide sweep ask: nodeinfo_role was hardcoded as
#               "dns" (correct letters, wrong case) instead of the canonical
#               role_codes.csv short code "DNS" -- same bug class fixed the same day
#               in firewallme/roles/firewall/tasks/14_finish.yml (see that file's own
#               changelog for the full root-cause story), found via a repo-wide grep
#               for the same hardcoded-full-word pattern across every nodeinfo_role:
#               assignment.
#   2026-10-30  BUG FIX, real live symptom on EXADNSVRK001 (the estate-wide resolver):
#               named.conf.options' allow-recursion ACL only ever carried
#               192.168.139.0/24 (VRK) plus localhost -- the 2026-10-12 fix above
#               correctly added a DNS box's own LAN subnet for a *per-site* local DNS
#               instance (_dns_own_site_row.Subnet), but EXADNSVRK001 has no "own
#               site" (VRK is deliberately excluded from the `sites` list), so that
#               branch never fired here and no other site's LAN was ever added
#               either. Every site's hosts got silently REFUSED on recursive
#               (external-domain) lookups through this server -- confirmed live via
#               `host google.com 192.168.139.8` from EXAANSCLD001 (192.168.69.0/24)
#               timing out with zero reply packets ever leaving EXADNSVRK001's
#               interface (tcpdump on EXAFWLCLD001's ens18 during a live retry).
#               Fixed by looping over the full `sites` list (already loaded once
#               earlier in this same play, BRD/VRK/N-A rows already excluded) when
#               _dns_own_site_row is empty, instead of adding nothing.
#   2026-10-30  FOLLOW-UP, same day, real bug found live: the routes added above
#               (templates/prov-static.nmconnection.j2) all went via dns_vrk_relay_via
#               (CLD's own WAN address) regardless of which site's subnet the route was
#               actually for -- correct for CLD by coincidence, wrong for every other
#               site. A query from, say, EXADCSFAL001 reaches EXADNSVRK001 directly
#               (both FAL's firewall's WAN side and this host sit on the same flat VRK
#               network) -- never via CLD at all. Routing the reply via CLD instead
#               creates asymmetric routing that CLD's own forward chain (ct state
#               established/related only, for ens18->wg0) correctly drops as an
#               unrecognised new flow -- confirmed live, EXADCSFAL001 querying this host
#               directly got no answer. Fixed by routing each site via ITS OWN
#               firewall's WAN address instead -- every firewall's WAN side sits on the
#               same flat VRK network as this host, so no site (CLD included) actually
#               needs relaying through another firewall for this specific path.
# =============================================================================

# 2026-10-11, Robert's ask: this file never imported the ssh_preflight_with_fallback.yml
# / refresh_ansible_ssh_key.yml self-healing pair that linux/tools.yml and
# firewallme/playbooks/90-firewall.yml already use -- hit live on EXADNSFRD001 the same
# day (key rejected, "Permission denied (publickey,password)", no password-fallback
# prompt at all, just an outright unreachable failure). Same relative path depth as
# linux/tools.yml (playbooks/<module>/<file>.yml, one level under playbooks/), so the
# same "../..." depth applies. :!ssh_preflight_skip on hosts: matches the established
# convention (see ssh_preflight_with_fallback.yml's own header) for cleanly skipping a
# host that had no working key and no password given, rather than failing the whole run.
- import_playbook: ../ssh_preflight_with_fallback.yml

# 2026-10-23, Robert's ask: hard-abort if playbooks/linux/tools.yml has never been run
# against this host -- that playbook deploys the shared /etc/example-music/*.csv reference
# files this role (and every other "ordinary" Linux module) assumes are already present,
# but nothing ever checked for that; a host missing it would previously fail confusingly
# deeper into this run instead of with a clear, early message. See
# playbooks/check_linux_baseline.yml's own header for the full mechanism.
- import_playbook: ../check_linux_baseline.yml

- name: BIND9 DNS server (master or secondary)
  hosts: "{{ target | default('dns') }}:!ssh_preflight_skip"
  become: true

  vars:
    # 2026-09-24: dns_ip/this_hostname derived from the real inventory instead of
    # hardcoded to VRK -- Robert confirmed EXADNSFRD001 as a genuine secondary/replica
    # of this same zone (see docs/adding-new-sites-bands-devices-and-subnets.md), which needs this playbook able
    # to target either host. ansible_host/inventory_hostname already resolve correctly
    # for whichever host --limit (or -e target=) selects, once devices.csv has a real
    # DNS row for it (FRD,DNS,1,8 added 2026-09-24) -- no second, hand-maintained
    # IP/hostname pair.
    dns_ip: "{{ ansible_host }}"
    this_hostname: "{{ inventory_hostname }}"
    # dns_role/dns_secondary_ip/dns_master_ip/dns_gateway are deliberately NOT declared
    # here as "x: {{ x | default(...) }}" -- confirmed live (2026-09-25) that this
    # idiom, which works fine in hosts:/task-level templating (see target in hosts:
    # above), causes ansible-core to throw "Recursive loop detected in template:
    # maximum recursion depth exceeded" once anything actually resolves the value at
    # play level: a vars: entry gives the name real precedence, so templating it
    # requires resolving itself first, with no external override present in the
    # common case (no -e passed) -- infinite self-reference. A pre_tasks set_fact
    # (below, "Resolve optional dns_* overrides") does not have this problem: it's a
    # one-shot task, not a play-level vars: declaration, and the resulting facts
    # outrank the play's own vars: block for every task/template after it, so the
    # rest of this play (and both .j2 templates) reference dns_role/dns_secondary_ip/
    # dns_master_ip/dns_gateway completely unchanged.
    dns_interface: ""          # autodetected below if blank
    zone_ttl: 300
    zone_serial: "{{ ansible_date_time.date | replace('-', '') }}01"
    sites_csv_path: "/etc/example-music/sites.csv"
    devices_csv_path: "/etc/example-music/devices.csv"
    bind_zone_dir: "/etc/bind"
    ad_forest_json_path: "/etc/example-music/ad_forest.json"
    domain: "{{ (lookup('file', ad_forest_json_path) | from_json).domain_fqdn }}"

    # Forwarders
    dns_forwarders:
      - "9.9.9.9"         # Quad9
      - "208.67.222.222"  # OpenDNS
      - "1.1.1.1"         # Cloudflare

    # cld_black_swan_hosts below is built from devices.csv (see pre_tasks) rather than
    # hardcoded here -- every device uses its own devices.csv-computed hostname, lowercased
    # (e.g. EXADNSVRK001 -> exadnsvrk001, EXAPBXCLD001 -> exapbxcld001), no overrides needed.

    # Standard SUFFIX_MAP -- mirrors site-inventory-audit.py and bindme.sh exactly
    # Each entry: { suffix, prefix, seq }
    suffix_map:
      - { suffix: 1,   prefix: "exartr", seq: 1 }
      - { suffix: 2,   prefix: "exarac", seq: 1 }
      - { suffix: 3,   prefix: "exarac", seq: 2 }
      - { suffix: 4,   prefix: "exarac", seq: 3 }
      - { suffix: 5,   prefix: "exapve", seq: 1 }
      - { suffix: 6,   prefix: "exapve", seq: 2 }
      - { suffix: 7,   prefix: "exapve", seq: 3 }
      - { suffix: 10,  prefix: "exadcs", seq: 1 }
      - { suffix: 11,  prefix: "exadcs", seq: 2 }
      - { suffix: 12,  prefix: "exarry", seq: 1 }
      - { suffix: 48,  prefix: "exasbc", seq: 1 }
      - { suffix: 250, prefix: "exaswi", seq: 1 }
      - { suffix: 251, prefix: "exaswi", seq: 2 }
      - { suffix: 252, prefix: "exaswi", seq: 3 }
      - { suffix: 253, prefix: "exafwl", seq: 1 }

  pre_tasks:
    - name: "[Preflight] Refresh SSH key + heal locked account"
      ansible.builtin.include_tasks: ../../tasks/refresh_ansible_ssh_key.yml

    - name: "Resolve optional dns_* overrides (set_fact, not vars: -- see vars: comment above)"
      tags: always
      set_fact:
        dns_role: "{{ dns_role | default('master') }}"
        dns_secondary_ip: "{{ dns_secondary_ip | default('') }}"
        dns_master_ip: "{{ dns_master_ip | default('') }}"
        dns_gateway: "{{ dns_gateway | default('192.168.139.254' if inventory_hostname == 'EXADNSVRK001' else '') }}"
        # 2026-10-30, real bug: EXADNSVRK001's only route back to any site's LAN (incl.
        # CLD's own 192.168.69.0/24) was via dns_gateway above -- the VRK gateway, which
        # has no reason to know those subnets. This never mattered before
        # feedback_vrack_masquerade_broke_zabbix_allowlist's fix (07_nftables.yml,
        # oifname wan ip daddr != 192.168.139.0/24 masquerade): every LAN->VRK packet
        # used to arrive at EXADNSVRK001 already masqueraded behind CLD's own
        # 192.168.139.69, so replies always went straight back to CLD on the same flat
        # L2 segment -- no route ever needed. Excluding 192.168.139.0/24 from
        # masquerade (needed so Zabbix's agent-side IP allowlist could see the real
        # source) stopped hiding the asymmetry for every OTHER flow too -- confirmed
        # live: `host google.com 192.168.139.8` and `ssh 192.168.139.8` both from
        # EXAANSCLD001 time out with zero reply ever leaving EXADNSVRK001's interface.
        # 192.168.139.69 is CLD's own firewall's VRK-facing IP (same address identified
        # in that masquerade bug's own root-cause log). Only EXADNSVRK001 needs this --
        # a per-site DNS box's own dns_gateway is already that site's own firewall,
        # which already knows how to route everywhere via the existing WireGuard mesh.
        #
        # 2026-10-30 FOLLOW-UP, real bug found live: this value is now ONLY used as a
        # gate ("is this the estate-wide resolver, does it need any of these routes at
        # all") -- prov-static.nmconnection.j2 used to also use its VALUE as the next-hop
        # for every site's route, which was wrong for every site except CLD itself (a
        # query from, say, FAL goes directly to EXADNSVRK001 over the shared flat VRK
        # network, never via CLD -- routing the reply via CLD instead creates asymmetric
        # routing that CLD's own forward chain correctly drops as an unrecognised new
        # flow). Confirmed live: EXADCSFAL001 querying EXADNSVRK001 directly got no
        # answer. Each site's route now goes via THAT site's own firewall's WAN address
        # instead -- see the template's own comment for the full mechanism.
        dns_vrk_relay_via: "{{ '192.168.139.69' if inventory_hostname == 'EXADNSVRK001' else '' }}"

    - name: Preflight -- refuse to guess a role-specific value that has no safe default
      tags: always
      assert:
        that:
          - not (dns_role == 'slave' and dns_master_ip == '')
          - not (dns_gateway == '')
        fail_msg: >-
          {{
            "dns_role=slave needs -e dns_master_ip=<real master IP> -- no safe default, a
            slave pointed at the wrong master would silently serve someone else's zone
            data."
            if (dns_role == 'slave' and dns_master_ip == '')
            else
            "dns_gateway has no safe default for host=" ~ inventory_hostname
            ~ " -- pass -e dns_gateway=<this site's real gateway> explicitly (see sites.csv)."
          }}

    - name: Gate on /etc/example-music/* freshness
      tags: always
      include_tasks: ../../tasks/example_music_freshness_gate.yml
      vars:
        example_music_gate_files: [sites.csv, devices.csv, ad_forest.json]
        example_music_gate_repo_root: "{{ playbook_dir }}/../../.."

    # -------------------------------------------------------------------------
    # Load and parse sites.csv on the control node.
    # Produces: sites  (list of dicts with keys: site, city, country, octet,
    #                   subnet, gateway, entity)
    # BRD (legacy alias for BER) is skipped.
    # Rows with a non-numeric third octet (N/A subnets) are skipped.
    # -------------------------------------------------------------------------
    - name: Load sites.csv from control node
      tags: always
      delegate_to: localhost
      become: false
      read_csv:
        path: "{{ sites_csv_path }}"
      register: sites_raw

    - name: Parse sites.csv into filtered list (skip BRD, VRK and N/A subnets)
      tags: always
      set_fact:
        sites_raw_list: >-
          {{
            sites_raw.list
            | rejectattr('Site', 'equalto', 'BRD')
            | rejectattr('Site', 'equalto', 'VRK')
            | rejectattr('Subnet', 'equalto', 'N/A')
            | list
          }}
      run_once: true

    - name: Build sites list with derived octet
      tags: always
      set_fact:
        sites: "{{ sites | default([]) + [item | combine({'octet': item.Subnet.split('.')[2]})] }}"
      loop: "{{ sites_raw_list }}"
      loop_control:
        label: "{{ item.Site }}"
      run_once: true

    # 2026-10-12, real bug found live on EXADNSFRD001: nothing in this file ever computed
    # "which site is THIS DNS host actually on" -- the one place that needed it (the old
    # "Look up CLD's site row for nodeinfo enrichment" task, section 8 below) hardcoded the
    # literal string "CLD" regardless of which site was really running, and
    # named.conf.options' own allow-recursion ACL only ever allowed the shared provisioning
    # network (192.168.139.0/24), never this host's own local site subnet -- so a DNS box
    # on any site other than the provisioning network itself refuses recursive (external
    # domain) lookups from hosts on its own LAN, confirmed live: `host chocolatey.org
    # 172.16.124.8` from EXAANSFRD001 (172.16.124.x, FRD's own subnet) returned REFUSED.
    # Derived here, early (before named.conf.options is written), from this_hostname via
    # the same hostname-parsing regex already proven elsewhere in this estate, so both the
    # ACL fix and the nodeinfo fix below can reuse one real lookup instead of each getting
    # their own (one hardcoded-wrong, the other about to be added).
    - name: "[site] Parse this host's own site code from its hostname"
      tags: always
      set_fact:
        _dns_own_site_code: "{{ this_hostname | upper | regex_search('^EXA[A-Z]{2,4}([A-Z]{3})[0-9]{3}$', '\\1') | first }}"

    # 2026-10-30, real bug found live: this used to search `sites` -- the list already
    # filtered to exclude BRD/VRK/N-A rows for the allow-recursion/routing fixes earlier
    # the same day (INC-2026-10-30-WG-ALLOWEDIPS). VRK's own row is real and has real
    # data (Street, PostalCode, OfficeName, etc. -- confirmed in benarbejde/sites.csv,
    # "2 Rue Kellermann"/59100/"Planet Earth") -- it's excluded from `sites` because
    # VRK isn't a normal spoke site to loop over for ACLs/topology, not because its own
    # row is bad data. Searching `sites` for EXADNSVRK001's own row therefore always
    # returned nothing, silently blanking nodeinfo_city/street_address/postal_code/etc.
    # below on every single run, re-run or not -- nothing about those fields has
    # anything to do with the ACL/routing exclusion this host's own row was never
    # meant to be part of. Fixed by searching sites_raw.list (the genuinely raw CSV
    # read, before any filtering) instead -- correct for every site, VRK included, and
    # zero behaviour change for any non-VRK host (never excluded from `sites` anyway).
    - name: "[site] Look up this host's own site row"
      tags: always
      set_fact:
        _dns_own_site_row: "{{ sites_raw.list | selectattr('Site', 'equalto', _dns_own_site_code) | list | first | default({}) }}"

    # -------------------------------------------------------------------------
    # Merged device list -- single source for both this play's cld_black_swan_hosts
    # (below) and Play 2's own zone generation, computed once here (tags: always)
    # rather than twice. See generate_inventory.py --emit-devices-json.
    # -------------------------------------------------------------------------
    - name: Compute merged device list via generate_inventory.py
      tags: always
      delegate_to: localhost
      become: false
      command: >
        python3 {{ playbook_dir }}/../../../benarbejde/generate_inventory.py
        {{ sites_csv_path }} --devices {{ devices_csv_path }} --emit-devices-json
      register: all_devices_raw
      changed_when: false

    - name: Parse merged device list
      tags: always
      set_fact:
        all_devices: "{{ all_devices_raw.stdout | from_json }}"

    # 2026-10-12, real bug found live: dns_secondary_ip had no persistent default
    # anywhere (confirmed via grep -- plain -e extra-var only, every single run) despite
    # EXADNSFRD001 already being a real, permanent secondary in devices.csv. Forgetting
    # -e dns_secondary_ip=<ip> on a routine master run isn't a missed optimisation --
    # named.conf.local.j2's allow-transfer defaults to `none` when it's blank, so the
    # very next `--tags zones-full,reload` against EXADNSVRK001 without that flag would
    # silently REVOKE the secondary's AXFR permission outright, not just skip the NOTIFY
    # push. devices.csv is already the real source of truth for "which DNS devices exist
    # at which site" (Type=DNS rows) -- derive it from there instead of relying on a
    # flag nobody will reliably remember forever, same reasoning as every other
    # devices.csv-derived fix this session. Still fully overridable via -e
    # dns_secondary_ip=<ip> (e.g. onboarding a brand-new secondary before its devices.csv
    # row exists yet) -- only auto-derives when nothing was explicitly passed. Joining
    # with "; " also already produces valid BIND ACL syntax if a second real secondary
    # is ever added (e.g. "ip1; ip2" plus the template's own trailing ";").
    - name: "[site] Auto-derive dns_secondary_ip from devices.csv's own DNS-role rows, if not explicitly overridden"
      tags: always
      set_fact:
        dns_secondary_ip: >-
          {{
            all_devices
            | selectattr('Type', 'equalto', 'DNS')
            | rejectattr('Site', 'equalto', _dns_own_site_code)
            | map(attribute='full_ip')
            | list
            | join('; ')
          }}
      when:
        - dns_role == 'master'
        - dns_secondary_ip == ''

    # A forward zone is just hostname->IP; it doesn't care what subnet an A record's IP is
    # on (that's a reverse-zone concern). CLD (its own LAN), VRK (the vRACK) and FRD (the
    # Fredericia Havn vRACK stand-in) are all "black swan" sites in the sense that none of
    # them follow the standard per-site convention -- so for the forward zone, one combined
    # list covering all three is all that's needed; db.forward-zone.j2 doesn't need to
    # know or care which subnet any given entry's IP is actually on.
    # Reverse zones DO care (a PTR zone is inherently one-subnet), so db.192.168.139.j2/
    # db.192.168.69.j2 filter this same list down to their own site via the 'site' key,
    # rather than needing their own separately-built lists.
    - name: Build cld_black_swan_hosts (forward zone) from devices.csv
      tags: always
      set_fact:
        cld_black_swan_hosts: >-
          {{ (cld_black_swan_hosts | default([])) + [{
            'site': item.Site,
            'name': item.Hostname | lower,
            'ip': item.full_ip,
            'comment': item.Notes,
          }] }}
      loop: "{{ all_devices | selectattr('Site', 'in', ['CLD', 'VRK', 'FRD']) | list }}"
      loop_control:
        label: "{{ item.Hostname }}"

    # Detect provisioning interface if dns_interface not set
    - name: Detect provisioning network interface
      tags: always, network
      when: dns_interface == ""
      set_fact:
        # BUG FIX (2026-07-21): this regex sits inside a YAML folded block scalar (>-), which
        # (unlike a double-quoted string) never processes backslash escapes -- \\. survived as
        # two literal backslashes plus a dot, meaning "match a literal backslash character",
        # which can never match a real dotted-decimal IP. selectattr always returned empty, so
        # this silently fell back to the hardcoded 'ens33' default on EVERY run, on every box,
        # regardless of its real interface -- only surfaced now because this box's real
        # interface (ens18) isn't literally named ens33, so the later ansible_facts[dns_interface]
        # lookup had no such key and crashed. Single backslash is correct in a block scalar.
        #
        # BUG FIX (2026-09-24): the subnet prefix itself was hardcoded to VRK's own
        # 192.168.139.x, which would never match on any other target (e.g. FRD's real
        # 172.16.124.x) -- silently falling back to 'ens33' there too, the exact same
        # failure mode the 2026-07-21 fix above was written to catch. Derived from dns_ip's
        # own first 3 octets instead (regex_escape'd -- dns_ip is a plain dotted-decimal
        # value, never a real regex, but escaping the literal dots is still correct practice)
        # so this works for whichever real host --limit selects, not just VRK.
        dns_interface: >-
          {{
            ansible_interfaces
            | map('extract', ansible_facts)
            | selectattr('ipv4.address', 'defined')
            | selectattr('ipv4.address', 'match', '^' ~ (dns_ip.split('.')[:3] | join('.') | regex_escape) ~ '\.')
            | map(attribute='device')
            | first
            | default('ens33')
          }}

  # ---------------------------------------------------------------------------
  # 1. Packages
  # ---------------------------------------------------------------------------
  tasks:
    - name: Update apt cache
      tags: packages
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install BIND9 and supporting packages
      tags: packages
      apt:
        name:
          - bind9
          - bind9utils
          - bind9-dnsutils
          - arping
          - iproute2
          - network-manager
          - vim
          - curl
          - tmux
          - grc
          - zsh
          - zsh-autosuggestions
          - zsh-syntax-highlighting
          - bc
          - localepurge
        state: present

    - name: Configure localepurge (keep en_GB and en_US only)
      tags: packages
      debconf:
        name: localepurge
        question: "{{ item.question }}"
        value: "{{ item.value }}"
        vtype: "{{ item.vtype }}"
      loop:
        - { question: "localepurge/nopurge",      value: "en_GB.UTF-8, en_US.UTF-8", vtype: multiselect }
        - { question: "localepurge/verbose",       value: "false",                    vtype: boolean }
        - { question: "localepurge/none_selected", value: "false",                    vtype: boolean }
        - { question: "localepurge/quickndirty",   value: "false",                    vtype: boolean }

    - name: Run localepurge
      tags: packages
      command: localepurge
      changed_when: false

  # ---------------------------------------------------------------------------
  # 2. Network -- static IP and hostname
  # ---------------------------------------------------------------------------
    - name: Set hostname
      tags: network
      hostname:
        name: "{{ this_hostname }}"

    - name: Ensure hostname in /etc/hosts
      tags: network
      lineinfile:
        path: /etc/hosts
        regexp: "^127\\.0\\.1\\.1"
        line: "127.0.1.1  {{ this_hostname }}.{{ domain }}  {{ this_hostname }}"
        state: present

    - name: Pin interface name via systemd .link (by MAC)
      tags: network
      copy:
        dest: "/etc/systemd/network/10-prov.link"
        mode: "0644"
        content: |
          # Example Music -- provisioning interface pin
          # Written by bind9-dns.yml on {{ ansible_date_time.iso8601 }}
          # Pins {{ dns_interface }} by MAC so reboots don't shuffle it
          [Match]
          MACAddress={{ ansible_facts[dns_interface].macaddress }}
          [Link]
          Name={{ dns_interface }}

    # BUG FIX (2026-07-21/22): this used to `nmcli connection delete prov-static` followed by
    # recreate + unconditional `nmcli connection up` on EVERY run -- tearing down and rebuplding
    # the live connection regardless of whether the IP was already correct. Live-observed on
    # EXADNSVRK001: this killed the SSH session mid-play, since Ansible always connects via this
    # exact interface/IP (ansible_host is dns_ip) -- there is no other path in. Rebuilt to match
    # roles/firewall/tasks/06_network_manager.yml's own established, session-safe pattern: a
    # templated .nmconnection keyfile for real idempotency (task reports unchanged when nothing
    # differs, unlike nmcli add/delete which always "changes" something), applied via `nmcli
    # connection reload` (re-reads profile files, does not tear down an active connection) rather
    # than delete+recreate, and a live-address-mismatch check before ever running `nmcli
    # connection up` -- which IS what actually pushes a changed address onto a live interface --
    # so a genuine IP correction is written to disk and reported, never applied live out from
    # under the exact session that's running this play.

    - name: "[NM] Detect current live IP on the provisioning interface"
      tags: network
      ansible.builtin.shell: |
        nmcli -g IP4.ADDRESS dev show {{ dns_interface }} 2>/dev/null | head -1 | cut -d/ -f1
      register: _prov_ip_live
      changed_when: false
      failed_when: false

    - name: "[NM] Set flag -- would bringing this connection up now strand this session?"
      tags: network
      ansible.builtin.set_fact:
        _prov_activate_would_strand_session: >-
          {{
            _prov_ip_live.stdout | trim != ''
            and _prov_ip_live.stdout | trim != dns_ip
          }}

    - name: Write prov-static NetworkManager connection profile
      tags: network
      ansible.builtin.template:
        src: prov-static.nmconnection.j2
        dest: /etc/NetworkManager/system-connections/prov-static.nmconnection
        owner: root
        group: root
        mode: "0600"
      notify: Reload NetworkManager connections

    - name: "[NM] Flush handlers (reload NM connection state, if the profile actually changed)"
      tags: network
      ansible.builtin.meta: flush_handlers

    - name: "[NM] NOTE -- provisioning IP correction needs a reboot (or manual con up) to take effect"
      tags: network
      ansible.builtin.debug:
        msg: >-
          {{ _c.Y }}[!]{{ _c.NC }} Provisioning IP is changing from {{ _prov_ip_live.stdout | trim }}
          to {{ dns_ip }} on {{ dns_interface }} -- this session is connected via that same
          interface, so bringing the connection up now would drop it mid-play. The corrected
          profile has been written to disk -- nothing has been applied live. Reboot this host,
          or run `nmcli connection up prov-static` yourself from a session that isn't riding
          {{ dns_interface }} (e.g. console/out-of-band), once you're ready to apply it.
      when: _prov_activate_would_strand_session

    - name: Bring up prov-static connection
      tags: network
      ansible.builtin.command: nmcli connection up prov-static
      changed_when: false
      when: not _prov_activate_would_strand_session

  # ---------------------------------------------------------------------------
  # 3. BIND9 configuration files
  # ---------------------------------------------------------------------------
    - name: Write named.conf.options
      tags: config
      copy:
        dest: "{{ bind_zone_dir }}/named.conf.options"
        mode: "0644"
        owner: root
        group: bind
        content: |
          // ============================================================
          // named.conf.options -- Example Music Limited
          // EXADNSVRK001  --  {{ domain }} DNS
          // Managed by Ansible bind9-dns.yml
          // ============================================================

          options {
            directory "/var/cache/bind";

            // ── Forwarders ────────────────────────────────────────────
            forwarders {
          {% for fw in dns_forwarders %}
              {{ fw }};
          {% endfor %}
            };

            forward only;

            // ── Access control ────────────────────────────────────────
            allow-query   { any; };
            // 2026-10-12, real bug found live on EXADNSFRD001: this only ever allowed the
            // shared provisioning network -- a DNS box's own local site subnet was never
            // included, so hosts on its own LAN (e.g. EXADCSFRD001, on FRD's 172.16.124.0/24)
            // got REFUSED on recursive (external-domain) lookups. The extra line is only
            // added when this host actually has a real per-site subnet of its own to add.
            //
            // 2026-10-30 FOLLOW-UP, real bug found live on EXADNSVRK001: this branch used
            // to key off `_dns_own_site_row.Subnet` being empty to detect "this is the
            // estate-wide resolver, not a per-site box" -- that broke the moment
            // _dns_own_site_row was fixed (same day) to search sites_raw.list instead of
            // the VRK-excluded `sites`, since it now correctly finds VRK's OWN row
            // (Subnet=192.168.139.0/24) for this exact host. The "has an own subnet"
            // branch below started firing for EXADNSVRK001 too, adding only a duplicate
            // of VRK's own range and skipping the per-site loop entirely -- confirmed
            // live: `named-checkconf -p` showed allow-recursion with 192.168.139.0/24
            // listed twice and nothing else, every other site REFUSED again. Checking
            // _dns_own_site_code directly (hostname-derived, unambiguous) instead of the
            // row's own emptiness -- the row being populated is correct and wanted now
            // (nodeinfo needs it), it was never a reliable signal for "is this VRK" to
            // begin with, just a coincidence that stopped holding once the other bug
            // was fixed.
            allow-recursion { 192.168.139.0/24; localhost;
            {% if _dns_own_site_code != 'VRK' %}
              {{ _dns_own_site_row.Subnet }};
            {% else %}
            {% for s in sites %}
              {{ s.Subnet }};
            {% endfor %}
            {% endif %}
            };

            // ── Listen ────────────────────────────────────────────────
            listen-on     { 127.0.0.1; {{ dns_ip }}; };
            listen-on-v6  { none; };

            // ── DNSSEC ────────────────────────────────────────────────
            dnssec-validation auto;

            // ── Misc ──────────────────────────────────────────────────
            auth-nxdomain no;
            version "not disclosed";
          };
      notify: Reload named

    - name: Write named.conf.local (forward zone + all reverse zones)
      tags: config, zones
      template:
        src: templates/named.conf.local.j2
        dest: "{{ bind_zone_dir }}/named.conf.local"
        mode: "0644"
        owner: root
        group: bind
        validate: "named-checkconf %s"
      notify: Reload named

  # ---------------------------------------------------------------------------
  # 4. Zone files
  # ---------------------------------------------------------------------------
  # 2026-10-11, real bug found live on EXADNSFRD001 running as a genuine slave
  # (-e dns_role=slave): none of these 4 tasks were gated on dns_role at all, so every
  # run unconditionally overwrote BIND's own AXFR-managed slave zone file with a static,
  # human-authored master-format file at the exact path named.conf.local's own `type
  # slave; file "...";` declaration expects to own. Confirmed via the real journal:
  # "zone jukebox.internal/IN: (primary) removed" then "loading from master file
  # /etc/bind/db.jukebox.internal failed: not implemented" -- BIND tried to read
  # Ansible's plain-text file back as its own cached slave-transfer data and couldn't.
  # A slave zone should start from nothing (or BIND's own prior transfer), never a
  # static write -- these 4 tasks only make sense for an actual master.
    - name: Write forward zone -- {{ domain }}
      tags: zones
      when: dns_role != 'slave'
      template:
        src: templates/db.forward-zone.j2
        dest: "{{ bind_zone_dir }}/db.{{ domain }}"
        mode: "0644"
        owner: root
        group: bind
        validate: "named-checkzone {{ domain }} %s"
      notify: Reload named

    - name: Write provisioning reverse zone (db.192.168.139)
      tags: zones
      when: dns_role != 'slave'
      template:
        src: templates/db.192.168.139.j2
        dest: "{{ bind_zone_dir }}/db.192.168.139"
        mode: "0644"
        owner: root
        group: bind
        validate: "named-checkzone 139.168.192.in-addr.arpa %s"
      notify: Reload named

    - name: Write CLD LAN reverse zone (db.192.168.69)
      tags: zones
      when: dns_role != 'slave'
      template:
        src: templates/db.192.168.69.j2
        dest: "{{ bind_zone_dir }}/db.192.168.69"
        mode: "0644"
        owner: root
        group: bind
        validate: "named-checkzone 69.168.192.in-addr.arpa %s"
      notify: Reload named

    - name: Write per-site reverse zone files (excluding CLD)
      tags: zones
      when: dns_role != 'slave'
      template:
        src: templates/db.site-reverse.j2
        dest: "{{ bind_zone_dir }}/db.192.168.{{ item.octet }}"
        mode: "0644"
        owner: root
        group: bind
        validate: "named-checkzone {{ item.octet }}.168.192.in-addr.arpa %s"
      loop: "{{ sites | rejectattr('Site', 'equalto', 'CLD') | list }}"
      loop_control:
        label: "{{ item.Site }} (192.168.{{ item.octet }}.0/24)"
      notify: Reload named

  # ---------------------------------------------------------------------------
  # 5. Enable and start named
  # ---------------------------------------------------------------------------
    - name: Enable and start named
      tags: service
      systemd:
        name: named
        enabled: true
        state: started

  # ---------------------------------------------------------------------------
  # 6. Management scripts (reloadbind/checkbind/editzone) + aliases
  # ---------------------------------------------------------------------------
  # BUG FIX (2026-07-21): reloadbind/checkbind/editzone used to be shell
  # aliases here too. Real, live-observed failure: `sudo editzone` ->
  # "sudo: editzone: command not found". Shell aliases only exist inside the
  # interactive shell that sourced them -- sudo execs a brand-new,
  # non-interactive process and never sources any shell rc file, so it has no
  # visibility into them at all, no matter how they're defined. The only fix
  # is real files on $PATH (root-owned, root-only where the operation needs
  # root) -- see bootstrap/web/provision/bindme.sh's matching fix, ported
  # here. This also closes a capability gap the old bare-alias version had:
  # it only ever supported the default forward zone, hardcoded -- both
  # scripts below accept an optional [zone-file] argument, so reverse zones
  # can be checked/edited too.
    - name: Deploy reloadbind script
      tags: aliases
      copy:
        dest: /usr/local/bin/reloadbind
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/bash
          # reloadbind -- reloads {{ domain }} via rndc.
          set -euo pipefail
          if rndc reload {{ domain }}; then
            echo "[+] Zone reloaded."
          else
            echo "[!] Reload failed -- check: journalctl -u named -n 20" >&2
            exit 1
          fi

    - name: Deploy checkbind script
      tags: aliases
      copy:
        dest: /usr/local/bin/checkbind
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/bash
          # checkbind [zone-file] -- validates a BIND zone file with named-checkzone.
          # Defaults to db.{{ domain }} if no argument given.
          # Accepts a bare filename (db.192.168.78) or a full path.
          set -euo pipefail

          _bind_zonename() {
            local base="${1#/etc/bind/}"
            base="${base#db.}"
            if [[ "$base" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "${BASH_REMATCH[3]}.${BASH_REMATCH[2]}.${BASH_REMATCH[1]}.in-addr.arpa"
            else
              echo "$base"
            fi
          }

          file="${1:-db.{{ domain }}}"
          base="${file##*/}"
          fullpath="/etc/bind/${base}"

          if [[ ! -f "$fullpath" ]]; then
            echo "[!] Zone file not found: ${fullpath}" >&2
            echo "    Available zone files:" >&2
            ls /etc/bind/db.* 2>/dev/null | sed 's|/etc/bind/||' | sed 's/^/      /' >&2
            exit 1
          fi

          zone=$(_bind_zonename "$base")
          echo "[*] Checking zone '${zone}' using ${fullpath}..."
          named-checkzone "$zone" "$fullpath"

    - name: Deploy editzone script
      tags: aliases
      copy:
        dest: /usr/local/bin/editzone
        owner: root
        group: root
        mode: "0750"
        content: |
          #!/bin/bash
          # editzone [zone-file] -- opens a zone file in vim, validates it, reloads if
          # valid. Defaults to db.{{ domain }} if no argument given. Writes to
          # /etc/bind/ -- must be run via: sudo editzone
          set -euo pipefail

          if [[ $EUID -ne 0 ]]; then
            echo "[!] This command writes to /etc/bind/ and needs root. Run: sudo editzone" >&2
            exit 1
          fi

          _bind_zonename() {
            local base="${1#/etc/bind/}"
            base="${base#db.}"
            if [[ "$base" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "${BASH_REMATCH[3]}.${BASH_REMATCH[2]}.${BASH_REMATCH[1]}.in-addr.arpa"
            else
              echo "$base"
            fi
          }

          file="${1:-db.{{ domain }}}"
          base="${file##*/}"
          fullpath="/etc/bind/${base}"

          if [[ ! -f "$fullpath" ]]; then
            echo "[!] Zone file not found: ${fullpath}" >&2
            echo "    Available zone files:" >&2
            ls /etc/bind/db.* 2>/dev/null | sed 's|/etc/bind/||' | sed 's/^/      /' >&2
            exit 1
          fi

          zone=$(_bind_zonename "$base")
          echo "[*] Editing zone '${zone}' -- ${fullpath}"

          vim "$fullpath"

          echo "[*] Validating..."
          if named-checkzone "$zone" "$fullpath"; then
            echo "[*] Reloading zone '${zone}'..."
            rndc reload "$zone" && echo "[+] Zone '${zone}' reloaded." || { echo "[!] rndc reload failed -- check: journalctl -u named -n 20" >&2; exit 1; }
          else
            echo "[!] Validation failed -- zone NOT reloaded. Fix errors and re-run: checkbind ${base}" >&2
            exit 1
          fi

    - name: Write BIND management aliases to /etc/profile.d
      tags: aliases
      copy:
        dest: /etc/profile.d/bind-aliases.sh
        mode: "0644"
        content: |
          # Example Music -- BIND9 management aliases
          # Managed by Ansible bind9-dns.yml
          # Works in bash and zsh (sourced via /etc/profile.d)
          # reloadbind/checkbind/editzone are real scripts at /usr/local/bin/,
          # not aliases -- see the "Deploy ...script" tasks above for why.

          alias bindstatus='systemctl status named'
          alias bindlog='journalctl -u named -f'

    - name: Write zsh config for root
      tags: aliases
      copy:
        dest: /root/.zshrc
        mode: "0644"
        force: false   # don't overwrite if already customised
        content: |
          export TERM=xterm-256color
          export EDITOR=vim
          export VISUAL=vim
          export SUDO_EDITOR=vim
          HISTFILE=~/.zsh_history
          HISTSIZE=10000
          SAVEHIST=10000
          setopt appendhistory autocd extendedglob notify interactivecomments
          setopt AUTO_CONTINUE LONG_LIST_JOBS
          bindkey -e
          autoload -Uz compinit && compinit
          autoload -Uz colors && colors
          PROMPT='
          %F{red}%m%f:%F{cyan}%~%f# '
          alias ls='ls --color=auto'
          alias ll='ls -lah'
          alias grep='grep --color=auto'
          if (( $+commands[grc] )); then
            GRC_ALIASES=true
            [[ -f /etc/profile.d/grc.sh ]] && source /etc/profile.d/grc.sh
          fi
          [[ -f /etc/profile.d/bind-aliases.sh ]] && source /etc/profile.d/bind-aliases.sh

    - name: Set zsh as default shell for root
      tags: aliases
      user:
        name: root
        shell: /usr/bin/zsh

    - name: Write zsh config for ansible user
      tags: aliases
      copy:
        dest: /home/ansible/.zshrc
        mode: "0644"
        owner: ansible
        group: ansible
        force: false
        content: |
          export TERM=xterm-256color
          export EDITOR=vim
          export VISUAL=vim
          HISTFILE=~/.zsh_history
          HISTSIZE=10000
          SAVEHIST=10000
          setopt appendhistory autocd extendedglob notify interactivecomments
          setopt AUTO_CONTINUE LONG_LIST_JOBS
          bindkey -e
          autoload -Uz compinit && compinit
          autoload -Uz colors && colors
          PROMPT='
          %F{green}%m%f:%F{cyan}%~%f> '
          alias ls='ls --color=auto'
          alias ll='ls -lah'
          alias grep='grep --color=auto'
          if (( $+commands[grc] )); then
            GRC_ALIASES=true
            [[ -f /etc/profile.d/grc.sh ]] && source /etc/profile.d/grc.sh
          fi
          [[ -f /etc/profile.d/bind-aliases.sh ]] && source /etc/profile.d/bind-aliases.sh

    - name: Set zsh as default shell for ansible user
      tags: aliases
      user:
        name: ansible
        shell: /usr/bin/zsh

  # ---------------------------------------------------------------------------
  # 7. Dynamic MOTD
  # ---------------------------------------------------------------------------
    - name: Disable default MOTD scripts
      tags: motd
      file:
        path: "{{ item }}"
        mode: "0644"   # remove execute bit -- MOTD runner won't call them
      loop:
        - /etc/update-motd.d/10-uname
        - /etc/update-motd.d/50-motd-news
      failed_when: false

    - name: Write Example Music MOTD script
      tags: motd
      copy:
        dest: /etc/update-motd.d/10-examplemusic
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          WH='\033[1;37m'; YL='\033[1;33m'; GR='\033[0;32m'
          CY='\033[0;36m'; RS='\033[0m'

          HOSTNAME=$(hostname -s)
          UPTIME=$(uptime -p 2>/dev/null || uptime)
          LOAD=$(awk '{print $1,$2,$3}' /proc/loadavg)
          MEM_TOTAL=$(free -m | awk '/^Mem:/{print $2}')
          MEM_USED=$(free -m  | awk '/^Mem:/{print $3}')
          DISK=$(df -h / | awk 'NR==2{print $3" used of "$2" ("$5")"}')

          # 2026-10-11, real bug found live on EXADNSFRD001: this only ever matched
          # 192.168.139.x (the shared provisioning network), so it showed "unknown" on
          # any DNS host whose real address is on its own site LAN instead (here,
          # 172.16.124.8) -- same bug class as the earlier Proxmox NODE_IP gap (a
          # narrower assumption than the real estate actually has). "scope global"
          # naturally excludes loopback (scope host) and link-local (scope link)
          # without hardcoding any particular subnet, so it picks up whichever real
          # address this host actually has.
          DNS_IP=$(ip -4 addr show scope global \
            | awk '/inet /{print $2}' \
            | cut -d/ -f1 | head -1)
          ZONE_SERIAL=$(grep -oP '(?<=;\s)serial.*' \
            /etc/bind/db.{{ domain }} 2>/dev/null \
            | head -1 | awk '{print $1}') || true
          NAMED_STATUS=$(systemctl is-active named 2>/dev/null || echo "unknown")
          RECORD_COUNT=$(grep -c 'IN  A' \
            /etc/bind/db.{{ domain }} 2>/dev/null || echo "?")

          echo -e "
          ${WH}╔══════════════════════════════════════════════════════════════╗${RS}
          ${WH}║           EXAMPLE MUSIC LIMITED: $(printf '%-28s' "${HOSTNAME}")║${RS}
          ${WH}╚══════════════════════════════════════════════════════════════╝${RS}

            ${YL}Role     :${RS} DNS Server -- {{ domain }}
            ${YL}Zone     :${RS} {{ domain }}  (${RECORD_COUNT} A records, serial ${ZONE_SERIAL:-unknown})

            ${WH}── Network ──────────────────────────────────────────────────${RS}
              ${CY}DNS IP${RS}   : ${GR}${DNS_IP:-unknown}${RS}
              ${CY}BIND9${RS}    : ${GR}${NAMED_STATUS}${RS}

            ${WH}── System ───────────────────────────────────────────────────${RS}
              ${CY}Uptime${RS}   : ${GR}${UPTIME}${RS}
              ${CY}Load${RS}     : ${GR}${LOAD}${RS}
              ${CY}Memory${RS}   : ${GR}${MEM_USED}MB${RS} used of ${MEM_TOTAL}MB
              ${CY}Disk /  ${RS} : ${GR}${DISK}${RS}

            ${WH}── Management ───────────────────────────────────────────────${RS}
              ${CY}Aliases${RS}  : reloadbind  checkbind  editzone  bindstatus  bindlog
          "

    - name: Ensure PrintMotd no in sshd_config
      # 2026-10-11, real bug found live on EXADNSFRD001: PrintMotd yes made sshd ALSO
      # print /etc/motd via its own native code path, on top of what pam_motd.so's
      # "noupdate" session line (/etc/pam.d/sshd) already prints -- the static legal
      # text ("The programs included...") showed up twice on every login. Debian's own
      # shipped sshd_config default is PrintMotd no specifically because pam_motd.so
      # already handles both the dynamic update-motd.d output (motd=/run/motd.dynamic)
      # and the static /etc/motd text (noupdate) -- confirmed matching
      # firewallme/roles/firewall/tasks/11_ssh_hardening.yml, which already had this
      # right. The dynamic banner box itself never doubled from this specific bug --
      # sshd's native PrintMotd mechanism only knows about /etc/motd, not
      # /run/motd.dynamic.
      tags: motd
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PrintMotd"
        line: "PrintMotd no"
        state: present
      notify: Restart sshd

    - name: Source MOTD from /etc/profile.d
      tags: motd
      # 2026-10-11, same bug class as the PVE MOTD fix (ansible/playbooks/proxmox/
      # playbooks/40-scripts.yml, 18e6d07): unguarded, this unconditionally re-runs
      # 10-examplemusic on every login shell, duplicating pam_motd's own automatic
      # run of /etc/update-motd.d/* for a real interactive SSH session -- confirmed
      # live double-printing on EXADNSFRD001. $SSH_TTY is set by sshd for every real
      # interactive SSH session, so skip there and only fall through for su/console
      # logins pam_motd doesn't cover.
      copy:
        dest: /etc/profile.d/motd.sh
        mode: "0644"
        content: |
          [[ -z "$SSH_TTY" ]] && [[ -x /etc/update-motd.d/10-examplemusic ]] && /etc/update-motd.d/10-examplemusic

  # ---------------------------------------------------------------------------
  # 8. Node info file
  # ---------------------------------------------------------------------------
    # Resolved from an already-deployed nodeinfo.json if present, else
    # prompted -- see ansible/tasks/nodeinfo_environment.yml (replaced the
    # old standalone /etc/.environment file 2026-07-10).
    - name: Resolve environment
      tags: always
      include_tasks: ../../tasks/nodeinfo_environment.yml

    - name: Set dns_environment
      tags: always
      set_fact:
        dns_environment: "{{ resolved_environment }}"

    - name: Ensure /etc/example-music directory exists
      tags: always
      file:
        path: /etc/example-music
        state: directory
        mode: "0755"

    # 2026-10-12: used to be its own task here, hardcoded to look up CLD's row regardless
    # of which site was actually running this play -- removed in favour of
    # _dns_own_site_code/_dns_own_site_row, computed once, early, right after `sites` is
    # built (see that task's own comment for the full incident this came from).

    - name: Write /etc/example-music/nodeinfo.json
      tags: always
      include_tasks: ../../tasks/nodeinfo.yml
      vars:
        nodeinfo_hostname: "{{ this_hostname }}"
        nodeinfo_role: "DNS"
        nodeinfo_site: "{{ _dns_own_site_code }}"
        nodeinfo_city: "{{ _dns_own_site_row.City | default('') }}"
        nodeinfo_country: "{{ _dns_own_site_row.Country | default('') }}"
        nodeinfo_country_code: "{{ _dns_own_site_row.CountryCode | default('') }}"
        nodeinfo_entity: "{{ _dns_own_site_row.Entity | default('') }}"
        nodeinfo_office_name: "{{ _dns_own_site_row.OfficeName | default('') }}"
        nodeinfo_street_address: "{{ _dns_own_site_row.Street | default('') }}"
        nodeinfo_postal_code: "{{ _dns_own_site_row.PostalCode | default('') }}"
        nodeinfo_environment: "{{ dns_environment | default('production') }}"
        nodeinfo_bootstrapped_by: "bind9-dns.yml"
        nodeinfo_extra:
          dns_ip: "{{ dns_ip }}"
          zone: "{{ domain }}"
          zone_serial: "{{ zone_serial }}"
          interface: "{{ dns_interface }}"

  # ---------------------------------------------------------------------------
  # 9. Verify -- quick dig self-test
  # ---------------------------------------------------------------------------
    # BUG FIX (2026-07-24, found live on EXADNSVRK001's first ever successful full run):
    # every zone-file write task above (named.conf.local, forward zone, every reverse zone)
    # does `notify: Reload named` -- but Ansible only runs notified handlers at the END of
    # the play by default, and there was no `meta: flush_handlers` anywhere between those
    # writes and this section. named was already running from before this play started (the
    # "Enable and start named" task reported unchanged), so the self-test below queried the
    # STILL-RUNNING, not-yet-reloaded named process -- testing stale/pre-existing zone data,
    # not what this run just wrote. Explicit flush here, mirroring the NM section's own
    # `meta: flush_handlers` (2. Network, above) rather than waiting on end-of-play timing.
    - name: "[Verify] Flush handlers (reload named with the zone files just written)"
      tags: service, reload
      ansible.builtin.meta: flush_handlers

    # Zone records are deliberately lowercase (db.forward-zone.devices.j2's dev.Hostname |
    # lower -- standard DNS zone-file convention, unrelated to this_hostname's own uppercase
    # box-identity convention above) -- lowercase this_hostname here to match what's actually
    # in the zone, rather than a case-sensitive Jinja substring check silently failing.
    # 2026-10-11, Robert's ask after a real live incident (EXADNSFRD001, master
    # 192.168.139.8 down): these two hard-failed the whole play on a transient external
    # condition this playbook has no control over -- a down master blocking AXFR
    # shouldn't stop zone/MOTD/sshd/etc. from being correctly configured, which happen
    # earlier in this same play and already succeeded by this point. Both now warn
    # instead of failing; _dns_selftest_ok (below) drives the Summary's own real
    # pass/fail text instead of its previous hardcoded "both passed" claim.
    - name: Self-test DNS -- forward lookup
      tags: service, reload
      command: "dig @127.0.0.1 +short {{ this_hostname | lower }}.{{ domain }}"
      register: dig_result
      changed_when: false
      failed_when: false

    - name: Self-test DNS -- PTR lookup for this server
      tags: service, reload
      command: "dig @127.0.0.1 +short -x {{ dns_ip }}"
      register: dig_ptr
      changed_when: false
      failed_when: false

    - name: Set DNS self-test result facts
      tags: service, reload
      set_fact:
        _dns_selftest_fwd_ok: "{{ dns_ip in dig_result.stdout }}"
        _dns_selftest_ptr_ok: "{{ this_hostname | lower in dig_ptr.stdout }}"

    - name: WARN -- DNS self-test did not resolve correctly
      tags: service, reload
      debug:
        msg: >-
          [!] Self-test {{ 'partially ' if _dns_selftest_fwd_ok or _dns_selftest_ptr_ok else '' }}failed for
          {{ this_hostname }} -- forward lookup {{ 'OK' if _dns_selftest_fwd_ok else 'FAILED (dig @127.0.0.1 ' ~ this_hostname | lower ~ '.' ~ domain ~ ' did not return ' ~ dns_ip ~ ')' }},
          PTR lookup {{ 'OK' if _dns_selftest_ptr_ok else 'FAILED (dig @127.0.0.1 -x ' ~ dns_ip ~ ' did not return ' ~ (this_hostname | lower) ~ ')' }}.
          {{ 'If this is a slave zone, check the real master is reachable (see journalctl -u named for "refresh: failure" / "host down") -- a transient master outage will self-heal once it is back and AXFR completes.' if dns_role == 'slave' else 'Check named is running and the zone loaded cleanly (named-checkconf / journalctl -u named).' }}
      when: not (_dns_selftest_fwd_ok and _dns_selftest_ptr_ok)

  # ---------------------------------------------------------------------------
  # Post-run summary
  # Added 2026-07-24 -- unlike rudder_server.yml/salt's 10-master.yml (both fixed the same
  # week), this play had no end-of-run recap at all, only the mid-play "[NM] NOTE" debug task
  # (section 2) that fires ONLY when the strand-check trips -- easy to miss in a long scroll of
  # 819-record zone output. Matches those two files' "active / active on next reboot" pattern.
  # ---------------------------------------------------------------------------
    - name: "Summary"
      debug:
        msg:
          - "  ════════════════════════════════════════════════════════════════"
          - "  BIND9 DNS SETUP COMPLETE — {{ this_hostname }}"
          - "  ════════════════════════════════════════════════════════════════"
          - "  Zone        : {{ domain }}"
          - "  DNS IP      : {{ dns_ip }} ({{ 'active' if not _prov_activate_would_strand_session | default(false) else 'active on next reboot, or run: nmcli connection up prov-static' }})"
          - "  Self-test   : {{ 'forward + PTR lookups both passed' if (_dns_selftest_fwd_ok and _dns_selftest_ptr_ok) else 'FAILED -- see WARNING above (forward: ' + ('OK' if _dns_selftest_fwd_ok else 'FAILED') + ', PTR: ' + ('OK' if _dns_selftest_ptr_ok else 'FAILED') + ')' }}"
          - "  ════════════════════════════════════════════════════════════════"

  # ---------------------------------------------------------------------------
  # Handlers
  # ---------------------------------------------------------------------------
  handlers:
    - name: Reload named
      systemd:
        name: named
        state: reloaded

    - name: Restart sshd
      systemd:
        name: ssh
        state: restarted

    # Mirrors roles/firewall/tasks/06_network_manager.yml's own handler exactly -- re-reads
    # connection profile files from disk, does not tear down an active connection.
    - name: Reload NetworkManager connections
      ansible.builtin.command: nmcli connection reload
      changed_when: true


# =============================================================================
# Templates required by this playbook
# Place these in templates/ alongside the playbook.
# =============================================================================
#
# templates/named.conf.local.j2
# ─────────────────────────────
# Declares all zones.  The forward zone plus the dedicated 139 reverse zone
# are written as static stanzas; per-site reverse zones are looped.
# CLD is excluded from the per-site loop (handled by the 139 zone).
#
# templates/db.forward-zone.j2
# ─────────────────────────────────
# Forward zone.  Loops suffix_map × sites to produce A records.
# Appends FWL WAN A records and ancillary hosts.
#
# templates/db.192.168.139.j2
# ─────────────────────────────
# Dedicated provisioning reverse zone.
# Contains ancillary PTRs + FWL WAN PTRs for all sites.
#
# templates/db.site-reverse.j2
# ─────────────────────────────
# Per-site reverse zone template.  item = one row from sites list.
# Loops suffix_map to produce PTR records.
#
# templates/prov-static.nmconnection.j2
# ──────────────────────────────────────
# NetworkManager keyfile for this box's own provisioning-network static IP
# (Section 2).  Mirrors roles/firewall/tasks/06_network_manager.yml's
# wan.nmconnection.j2/lan.nmconnection.j2 -- written for real idempotency and
# applied via `nmcli connection reload`, never delete+recreate.
#
# See templates/ directory for full template content.
# =============================================================================

# =============================================================================
# PLAY 2 -- Full zone regeneration from devices.csv
# =============================================================================
# This play supersedes the SUFFIX_MAP-based zone generation in Play 1.
# It reads devices.csv (single source of truth for all devices) alongside
# sites.csv and generates:
#   - db.{{ domain }}       (forward zone -- all devices with a HostOctet)
#   - db.192.168.139        (provisioning reverse zone -- CLD devices + FWL WANs)
#   - db.192.168.{octet}    (per-site reverse zones -- one per site, CLD excluded)
#
# Non-networked assets (blank HostOctet) are emitted as comments in the
# forward zone so they are documented without creating DNS records.
#
# CLD BLACK SWAN NOTE:
#   CLD (192.168.139.0/24) is the provisioning network. It does not follow
#   the standard site convention -- no EXADCS, no EXAPVE, no EXASBC.
#   Its devices have manually assigned IPs serving specific provisioning roles.
#   The BIND zone for 192.168.139.0/24 is generated as a dedicated provisioning
#   reverse zone (db.192.168.139) and is NOT produced by the per-site loop.
#   Do not apply standard site convention validation to CLD rows.
#
# Tags:
#   zones-full   -- regenerate all zones from devices.csv
#   reload       -- rndc reload after zone regeneration
#
# Changelog:
#   2026-03-29  Initial release. Replaces SUFFIX_MAP loops in Play 1 with
#               devices.csv-driven generation. Non-networked assets emitted
#               as zone file comments. CLD black swan documented.
#   2026-07-07  devices.csv became exceptions-only (see generate_inventory.py
#               and address_policy.json) — it no longer contains a row for
#               every standard-slot device, which would have silently dropped
#               DNS records for every DC/PVE/router/firewall/etc across the
#               whole estate. Replaced the "Load devices.csv" + manual
#               enrichment tasks with a single call to
#               generate_inventory.py --emit-devices-json, which computes the
#               full merged, deduplicated device list (standard-slot
#               synthesis + real exceptions, full_ip resolved) in the same
#               code path the .ini generator uses, so the two can't disagree.
#               Also fixed, found via actually rendering every template
#               end-to-end against live data rather than reading the code:
#                 - "Load devices.csv" used read_csv's comment: "#" param,
#                   which doesn't exist on this module — would have failed
#                   outright the first time this play ran.
#                 - device_sites (drives the per-site reverse zone loop)
#                   included VRK, which has no sites_by_code entry (it's the
#                   provisioning network, handled by the dedicated
#                   db.192.168.139.devices.j2 template) — would have crashed
#                   rendering db.site-reverse.devices.j2 for VRK.
#                 - db.site-reverse.devices.j2's "Covers:" comment line
#                   double-appended ".0" to sites_by_code's value (which is
#                   already a full x.x.x.0/24 string from sites.csv).
#               BRD (West Berlin) keeps its own identity — it's a real, separate site that
#               happens to share BER's exact subnet on purpose (ALLOWED_SITE_OVERLAP in
#               generate_inventory.py already treats this as intentional: two hostnames
#               resolving to the same IP, same as the .ini generator's own brd.ini). BRD gets
#               its own forward-zone A records and keeps its own devices.csv rows; it is only
#               excluded from the per-site *reverse* zone loop below, since a subnet can have
#               only one authoritative reverse zone and BER already owns it. (An earlier version
#               of this fix folded BRD into BER entirely, erasing its identity — wrong, caught
#               in review.)
# =============================================================================

- name: EXADNSVRK001 -- Full zone generation from devices.csv
  hosts: EXADNSVRK001
  become: true

  vars:
    dns_ip: "192.168.139.8"
    this_hostname: "EXADNSVRK001"
    ad_forest_json_path: "/etc/example-music/ad_forest.json"
    domain: "{{ (lookup('file', ad_forest_json_path) | from_json).domain_fqdn }}"
    bind_zone_dir: "/etc/bind"
    zone_serial: "{{ ansible_date_time.date | replace('-', '') }}01"
    zone_ttl: 300
    sites_csv_path: "/etc/example-music/sites.csv"
    devices_csv_path: "/etc/example-music/devices.csv"

    # CLD BLACK SWAN:
    # CLD has two subnets: LAN 192.168.69.0/24 (DCs, Ansible) and
    # vRACK 192.168.139.0/24 (DNS, Rudder, PBX, PXE, FWL WAN faces).
    # CLD LAN is now in sites.csv so sites_by_code['CLD'] resolves normally.
    # vRACK ancillary PTRs are hardcoded in db.192.168.139.devices.j2.

    # Extra CNAMEs that role_codes.csv's DNSAlias column can't express -- that
    # column is one-alias-per-role-code, so a device needing more than one
    # friendly name (e.g. TacticalRMM's three subdomains -- rmm/api/mesh --
    # all pointing at EXARMMCLD001, only "rmm" of which comes from RMM's own
    # DNSAlias) needs its extras listed here instead. Added 2026-08-04 (Robert:
    # "add these records to the bind9 playbook") after the alternative --
    # hand-editing the deployed zone file -- turned out to just get silently
    # overwritten on the next run, same as any other Ansible-templated file.
    # Rendered into db.forward-zone.devices.j2's "One-off records" section, so
    # it's regenerated (and preserved) on every run like everything else in
    # the zone, not a manual edit that has to be redone.
    bind9_extra_cnames:
      - alias: "api"
        target: "EXARMMCLD001"
        comment: "TacticalRMM backend API subdomain"
      - alias: "mesh"
        target: "EXARMMCLD001"
        comment: "TacticalRMM's bundled MeshCentral subdomain"

  pre_tasks:
    - name: Gate on /etc/example-music/* freshness
      tags: always
      include_tasks: ../../tasks/example_music_freshness_gate.yml
      vars:
        example_music_gate_files: [sites.csv, devices.csv, ad_forest.json]
        example_music_gate_repo_root: "{{ playbook_dir }}/../../.."

    - name: Load sites.csv
      tags: always
      delegate_to: localhost
      become: false
      read_csv:
        path: "{{ sites_csv_path }}"
      register: sites_raw

    - name: Build sites lookup (octet by site code)
      tags: always
      set_fact:
        sites_by_code: >-
          {{
            sites_raw.list
            | rejectattr('Site', 'equalto', 'BRD')
            | rejectattr('Site', 'equalto', 'VRK')
            | rejectattr('Subnet', 'equalto', 'N/A')
            | items2dict(key_name='Site', value_name='Subnet')
          }}

    # devices.csv is exceptions-only as of 2026-07-07 (see generate_inventory.py and
    # address_policy.csv). all_devices (the merged, deduplicated device list -- standard-slot
    # synthesis + devices.csv exceptions, full_ip resolved, BRD/VRK special-cased) is computed
    # once, in Play 1's pre_tasks (tags: always, so it runs regardless of which tags this play
    # actually needs) -- shared as a fact rather than recomputed here a second time.

  tasks:
    # -------------------------------------------------------------------------
    # Forward zone -- db.{{ domain }}
    # Devices with HostOctet get A records.
    # Devices without HostOctet get a comment line (documented, not resolved).
    # Grouped by site, sorted by HostOctet within each site.
    # -------------------------------------------------------------------------
    - name: Write forward zone from devices.csv
      tags: zones-full
      template:
        src: templates/db.forward-zone.devices.j2
        dest: "{{ bind_zone_dir }}/db.{{ domain }}"
        mode: "0644"
        owner: root
        group: bind
        validate: "named-checkzone {{ domain }} %s"
      notify: Reload named

    # -------------------------------------------------------------------------
    # Provisioning reverse zone -- db.192.168.139
    # CLD BLACK SWAN: generated separately, never from the per-site loop.
    # Contains CLD device PTRs + FWL WAN PTRs for every site.
    # -------------------------------------------------------------------------
    - name: Write provisioning reverse zone (db.192.168.139) from devices.csv
      tags: zones-full
      template:
        src: templates/db.192.168.139.devices.j2
        dest: "{{ bind_zone_dir }}/db.192.168.139"
        mode: "0644"
        owner: root
        group: bind
        validate: "named-checkzone 139.168.192.in-addr.arpa %s"
      notify: Reload named

    # -------------------------------------------------------------------------
    # Per-site reverse zones -- db.192.168.{octet}
    # One per site from devices.csv, including CLD (192.168.69.0/24).
    # -------------------------------------------------------------------------
    - name: Build unique device site list from devices.csv
      tags: zones-full
      set_fact:
        # VRK is excluded: it has no entry in sites_by_code (provisioning network, handled
        # entirely by the dedicated db.192.168.139.devices.j2 template, never the per-site
        # loop below) — its real devices (DNS/PRV/FWL) are still in all_devices for the
        # forward zone, but must not reach the per-site reverse zone loop, which would fail
        # looking up sites_by_code['VRK'].
        #
        # BRD is excluded for a different reason: it's a real site (West Berlin) that shares
        # BER's exact subnet (192.168.113.0/24) on purpose (see ALLOWED_SITE_OVERLAP in
        # generate_inventory.py) — it gets its own hostnames in the FORWARD zone (all_devices
        # is untouched here, BRD's A records still appear there), but a subnet can only have
        # one authoritative reverse zone file, and BER already owns it. Excluding BRD here only
        # stops it from generating a second, conflicting db.192.168.113 file — it does not
        # remove BRD's own devices or hostnames from DNS.
        device_sites: >-
          {{
            all_devices
            | map(attribute='Site')
            | unique
            | reject('equalto', 'VRK')
            | reject('equalto', 'BRD')
            | list
          }}

    - name: Write per-site reverse zones from devices.csv
      tags: zones-full
      template:
        src: templates/db.site-reverse.devices.j2
        dest: "{{ bind_zone_dir }}/db.192.168.{{ sites_by_code[item].split('.')[2] }}"
        mode: "0644"
        owner: root
        group: bind
        validate: >-
          named-checkzone
          {{ sites_by_code[item].split('.')[2] }}.168.192.in-addr.arpa %s
      loop: "{{ device_sites | sort }}"
      loop_control:
        label: "{{ item }}"
      notify: Reload named

    # -------------------------------------------------------------------------
    # Validate entire named config after all zones written
    # -------------------------------------------------------------------------
    - name: Validate named.conf after full zone regeneration
      tags: zones-full
      command: named-checkconf /etc/bind/named.conf
      changed_when: false

  handlers:
    - name: Reload named
      systemd:
        name: named
        state: reloaded
