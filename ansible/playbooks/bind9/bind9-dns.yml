---
# =============================================================================
# Example Music Limited -- BIND9 DNS Server Playbook
# Target      : EXADNSVRK001  (exadnsvrk001.jukebox.internal)
# Role        : Authoritative DNS -- jukebox.internal
# OS          : Debian trixie
# IP          : 192.168.139.8/24  (provisioning network)
#
# This playbook mirrors bindme.sh exactly.  It is the idempotent,
# Ansible-managed equivalent -- suitable for ongoing configuration
# management and CI enforcement.  bindme.sh is the bootstrapper;
# this playbook is the enforcer.
#
# Prerequisites:
#   - Host reachable on 192.168.139.8 via SSH as ansible user
#   - sites.csv present at {{ sites_csv_path }} on the control node
#   - Python 3 on the target (standard Debian trixie)
#
# Variables (set in group_vars or pass with -e):
#   sites_csv_path   -- path to sites.csv on the control node
#                       default: /etc/example-music/sites.csv
#   dns_ip           -- static IP for this server
#                       default: 192.168.139.8
#   dns_gateway      -- provisioning network gateway
#                       default: 192.168.139.254
#   dns_interface    -- NIC name (detected if omitted)
#                       default: "" (autodetect via 192.168.139.x)
#   zone_ttl         -- zone TTL in seconds
#                       default: 300
#   zone_serial      -- override SOA serial (YYYYMMDDnn format)
#                       default: auto (ansible_date_time.date + "01")
#
# Usage (run from ansible/ root):
#   ansible-playbook -i configs/inventory playbooks/bind9/bind9-dns.yml
#   ansible-playbook -i configs/inventory playbooks/bind9/bind9-dns.yml --tags zones-full
#   ansible-playbook -i configs/inventory playbooks/bind9/bind9-dns.yml --tags zones-full,reload
#
# IMPORTANT: `zones` (Play 1, below) and `zones-full` (Play 2) are NOT
# interchangeable. Play 1's zone generation is superseded by Play 2 (see
# Play 2's own header comment) but both still exist and both write to the
# same destination files (db.{{ domain }}, db.192.168.139, per-site
# reverse zones) — a full run is fine (Play 2 runs last and wins), but
# `--tags zones,reload` on its own regenerates zones from Play 1's old
# SUFFIX_MAP/hardcoded-hosts logic ONLY, without ever reading devices.csv.
# Always use `zones-full` (not `zones`) to pick up a devices.csv change.
#
# Tags:
#   packages    -- apt install
#   network     -- static IP + hostname
#   config      -- named.conf.options + named.conf.local
#   zones       -- Play 1 zone file generation (superseded, see above)
#   zones-full  -- Play 2 zone file generation from devices.csv (use this one)
#   service     -- enable + start named
#   reload      -- rndc reload (use after zones-full to push changes live)
#   aliases     -- shell aliases
#   motd        -- dynamic MOTD
#
# Changelog:
#   2026-03-29  Initial release.  Mirrors bindme.sh v2026-03-29.
#   2026-07-07  Documented the zones vs zones-full trap above (Play 1 is
#               superseded but still present and tag-gated separately —
#               `--tags zones,reload` silently skips devices.csv entirely).
#               Fixed dns_gateway default in this comment (was documented
#               as .1, actual default is .254).
#   2026-07-08  Play 1's nodeinfo.json write now uses the shared ansible/tasks/nodeinfo.yml
#               (also used by linux/tools.yml, proxmox, firewallme, rudder_server.yml) instead
#               of its own hand-written block — missed during the 2026-07-07 consolidation.
#               Also fixes stale hardcoded city="Central"/country="GB" (CLD's real sites.csv
#               row is City=CloudSite, Country=Global) — now derived from sites.csv like every
#               other writer, instead of a wrong guess.
#   2026-07-08  Play 1's ancillary_hosts/cld_lan_hosts are no longer hardcoded -- both are now
#               built (pre_tasks, tags: always) from the same all_devices merged list Play 2
#               already computed, moved here so both plays share one computation instead of two.
#               This surfaced two real bugs in the hardcoded data it replaces:
#                 - CLD's firewall WAN face was documented at .139.139; devices.csv (VRK,FWL row,
#                   corrected 68->69 this same pass per direct confirmation) and every other
#                   source agree on .69. Also fixed the same stale .139 in db.forward-zone.j2
#                   (renamed 2026-07-11, was db.jukebox.internal.j2) and db.192.168.139.j2's
#                   separate "-wan" hardcoded line for CLD.
#                 - WAC/Rudder/PBX appeared a second time in ancillary_hosts AND in
#                   db.192.168.139.j2's PTR records, both claiming vRACK addresses at the exact
#                   same octets as their real CLD LAN devices.csv entries -- a copy-paste mistake,
#                   not a genuine second interface (confirmed). Removed from both; they're LAN-only,
#                   now correctly covered via the expanded cld_lan_hosts below.
#               cld_lan_hosts now includes every CLD device (RTR/PRV standard slots included,
#               matching what Play 2's own forward zone already publishes for CLD) instead of
#               just the historical FWL-LAN/ANS/DCS1/DCS2 subset -- CLD's DCS2 is still absent
#               from both plays' output, since DNS_MULTI_FIRST_INSTANCE_ONLY in
#               generate_inventory.py only ever synthesizes the first DCS instance for DNS,
#               site-wide, not a CLD-specific gap.
#               vRACK-side hostnames (DNS/PRV/FWL) were briefly kept as "CLD-branded"
#               (exadnscld001 etc) via a name-override lookup, then reversed the same day per
#               direct confirmation ("if we rename vrack things to suffix VRK ... I don't mind")
#               -- they now use devices.csv's own computed VRK-prefixed names directly
#               (exadnsvrk001, exaprvvrk001, exafwlvrk001), including this playbook's own
#               this_hostname/hosts target. vrk_ancillary_name_overrides is gone entirely.
#               PBX briefly kept its historically-established name (exacldpbx001) via a
#               cld_lan_name_overrides table too, until testing showed the override was
#               already inert: Play 2 (which wins on any full/correct run -- see the zones vs
#               zones-full trap documented above) renders its own CLD forward-zone section and
#               its generic per-site reverse-zone loop straight from devices.csv's own Hostname,
#               with no override applied there. The override only ever affected Play 1's
#               (always-overwritten) fallback -- never the actual live name. Per direct
#               confirmation, PBX now also uses its natural devices.csv name (exapbxcld001)
#               consistently; cld_lan_name_overrides is gone entirely, same as
#               vrk_ancillary_name_overrides above.
#   2026-07-08  A forward zone is just hostname->IP -- it doesn't care what subnet an A
#               record's IP is on (reverse zones are the subnet-specific concern, unchanged).
#               So ancillary_hosts (VRK) and cld_lan_hosts (CLD) -- previously two separate
#               set_fact tasks/lists purely because Play 1's reverse zones needed per-subnet
#               data -- are now one merged cld_black_swan_hosts list (CLD+VRK+FRD), each entry
#               tagged with its real site so the reverse-zone templates can filter it down to
#               their own subnet instead of needing their own separately-built lists.
#               Play 2's db.forward-zone.devices.j2 (renamed 2026-07-11, was
#               db.jukebox.devices.j2) got the same treatment even further: its whole
#               dedicated "CLD" forward-zone section was removed entirely -- VRK and FRD
#               already flowed through the generic per-site loop with zero special-casing
#               (octet derived from each device's own real IP, never blocked on CLD/VRK/FRD's
#               absence from sites_by_code), so CLD didn't need special-casing there either.
#               This also surfaced and fixed a real bug in that per-site loop: the section
#               header hardcoded "192.168.{{ octet }}.0/24", which would have been wrong for
#               FRD (172.16.124.0/24) the first time anything caused it to render -- now
#               derives the full subnet prefix from the device's own IP instead of assuming
#               192.168.x for every site.
#   2026-07-09  domain (both plays) now derived from benarbejde/ad_forest.json instead of a
#               hardcoded "jukebox.internal" literal -- single source of truth, same file
#               windows_dc/windows_bootstrap/windows_adschema/rudder_servers now all read.
#   2026-07-21  reloadbind/checkbind/editzone converted from profile.d shell aliases to real
#               scripts at /usr/local/bin/, matching bindme.sh's own fix. Real, live-observed
#               failure: `sudo editzone` -> "sudo: editzone: command not found" -- shell aliases
#               are invisible to sudo, which execs a fresh non-interactive process that never
#               sources any shell rc file. Also closes a capability gap the old hardcoded-alias
#               version had: checkbind/editzone now accept an optional [zone-file] argument, so
#               reverse zones can be checked/edited too, not just the default forward zone.
#   2026-07-21  Fixed both plays' hosts: exadnsvrk001 (lowercase) -- confirmed via
#               ansible-inventory that this NEVER matched the real inventory (host is
#               EXADNSVRK001, uppercase, in vrk.ini; Ansible host-pattern matching is
#               case-sensitive) -- would have silently matched zero hosts, empty PLAY RECAP,
#               no error. Found while re-running this playbook against the live DNS server
#               after fixing its hostname/VG naming elsewhere (rename-host.yml). Also fixed
#               this_hostname: "exadnsvrk001" -> "EXADNSVRK001" -- this var sets /etc/hostname
#               and /etc/hosts directly (ansible.builtin.hostname task below), so leaving it
#               lowercase would have silently re-lowercased the box's hostname on every run,
#               undoing the uppercase-hostname fix. This does NOT touch actual DNS zone-record
#               content -- that's separately, deliberately lowercased per-device from
#               devices.csv (db.forward-zone.devices.j2's dev.Hostname | lower, standard DNS
#               zone-file convention) regardless of this_hostname's value. The two dig
#               self-test tasks now explicitly lowercase this_hostname when comparing against
#               zone content, to match that convention instead of a case-sensitive Jinja
#               substring check silently failing against a real, correctly-generated zone.
#   2026-07-21  Fixed the dns_interface autodetection regex ('^192\\.168\\.139\\.') silently
#               never matching anything, on every run, on every box -- see this file's own
#               "Detect provisioning network interface" task comment for the full root cause
#               (a double-backslash inside a YAML folded block scalar, which never processes
#               escapes, unlike a double-quoted string).
#   2026-07-22  CRITICAL LIVE BUG, SESSION-KILLING: Section 2's NetworkManager tasks used to
#               `nmcli connection delete prov-static` then recreate + unconditionally `nmcli
#               connection up` on EVERY run, regardless of whether the IP was already correct --
#               tearing down and rebuilding the live connection every single time. Live-observed
#               on EXADNSVRK001: this killed the SSH session mid-play, since Ansible always
#               connects via this exact interface/IP (ansible_host is dns_ip) -- there's no other
#               path in for a real remote run. Robert: "it's clear you're not listening to me
#               about the times when IPs change" -- this is the same class of hazard
#               roles/firewall/tasks/06_network_manager.yml was rebuilt to avoid on 2026-07-09/
#               2026-07-16/2026-07-17 (see that file's own changelog), and should have been
#               applied here from the start rather than left on the old raw-nmcli pattern.
#               Rebuilt to match that file's exact session-safe design: a templated
#               .nmconnection keyfile (templates/prov-static.nmconnection.j2) for real
#               idempotency -- the write task reports unchanged when nothing differs, unlike
#               nmcli add/delete which always "changes" something -- applied via `nmcli
#               connection reload` (re-reads profile files, does not tear down an active
#               connection) instead of delete+recreate, and a live-address-mismatch check
#               (mirrors 06_network_manager.yml's nm_wan_activate_would_strand_session exactly)
#               before ever running `nmcli connection up` -- the one command that actually pushes
#               a changed address onto a live interface. A genuine IP correction is now written
#               to disk and reported clearly, never applied live out from under the exact session
#               running the play. Verified via scratch-test reproduction of the strand-detection
#               logic across all three real scenarios (already correct, wrong live IP, fresh box
#               with no live IP yet) before touching the real file.
# =============================================================================

- name: EXADNSVRK001 -- BIND9 DNS server
  hosts: EXADNSVRK001
  become: true

  vars:
    dns_ip: "192.168.139.8"
    dns_gateway: "192.168.139.254"
    dns_interface: ""          # autodetected below if blank
    zone_ttl: 300
    zone_serial: "{{ ansible_date_time.date | replace('-', '') }}01"
    sites_csv_path: "/etc/example-music/sites.csv"
    devices_csv_path: "/etc/example-music/devices.csv"
    bind_zone_dir: "/etc/bind"
    this_hostname: "EXADNSVRK001"
    ad_forest_json_path: "/etc/example-music/ad_forest.json"
    domain: "{{ (lookup('file', ad_forest_json_path) | from_json).domain_fqdn }}"

    # Forwarders
    dns_forwarders:
      - "9.9.9.9"         # Quad9
      - "208.67.222.222"  # OpenDNS
      - "1.1.1.1"         # Cloudflare

    # cld_black_swan_hosts below is built from devices.csv (see pre_tasks) rather than
    # hardcoded here -- every device uses its own devices.csv-computed hostname, lowercased
    # (e.g. EXADNSVRK001 -> exadnsvrk001, EXAPBXCLD001 -> exapbxcld001), no overrides needed.

    # Standard SUFFIX_MAP -- mirrors site-inventory-audit.py and bindme.sh exactly
    # Each entry: { suffix, prefix, seq }
    suffix_map:
      - { suffix: 1,   prefix: "exartr", seq: 1 }
      - { suffix: 2,   prefix: "exarac", seq: 1 }
      - { suffix: 3,   prefix: "exarac", seq: 2 }
      - { suffix: 4,   prefix: "exarac", seq: 3 }
      - { suffix: 5,   prefix: "exapve", seq: 1 }
      - { suffix: 6,   prefix: "exapve", seq: 2 }
      - { suffix: 7,   prefix: "exapve", seq: 3 }
      - { suffix: 10,  prefix: "exadcs", seq: 1 }
      - { suffix: 11,  prefix: "exadcs", seq: 2 }
      - { suffix: 12,  prefix: "exarry", seq: 1 }
      - { suffix: 48,  prefix: "exasbc", seq: 1 }
      - { suffix: 250, prefix: "exaswi", seq: 1 }
      - { suffix: 251, prefix: "exaswi", seq: 2 }
      - { suffix: 252, prefix: "exaswi", seq: 3 }
      - { suffix: 253, prefix: "exafwl", seq: 1 }

  pre_tasks:
    # -------------------------------------------------------------------------
    # Load and parse sites.csv on the control node.
    # Produces: sites  (list of dicts with keys: site, city, country, octet,
    #                   subnet, gateway, entity)
    # BRD (legacy alias for BER) is skipped.
    # Rows with a non-numeric third octet (N/A subnets) are skipped.
    # -------------------------------------------------------------------------
    - name: Load sites.csv from control node
      tags: always
      delegate_to: localhost
      become: false
      read_csv:
        path: "{{ sites_csv_path }}"
      register: sites_raw

    - name: Parse sites.csv into filtered list (skip BRD, VRK and N/A subnets)
      tags: always
      set_fact:
        sites_raw_list: >-
          {{
            sites_raw.list
            | rejectattr('Site', 'equalto', 'BRD')
            | rejectattr('Site', 'equalto', 'VRK')
            | rejectattr('Subnet', 'equalto', 'N/A')
            | list
          }}
      run_once: true

    - name: Build sites list with derived octet
      tags: always
      set_fact:
        sites: "{{ sites | default([]) + [item | combine({'octet': item.Subnet.split('.')[2]})] }}"
      loop: "{{ sites_raw_list }}"
      loop_control:
        label: "{{ item.Site }}"
      run_once: true

    # -------------------------------------------------------------------------
    # Merged device list -- single source for both this play's cld_black_swan_hosts
    # (below) and Play 2's own zone generation, computed once here (tags: always)
    # rather than twice. See generate_inventory.py --emit-devices-json.
    # -------------------------------------------------------------------------
    - name: Compute merged device list via generate_inventory.py
      tags: always
      delegate_to: localhost
      become: false
      command: >
        python3 {{ playbook_dir }}/../../../benarbejde/generate_inventory.py
        {{ sites_csv_path }} --devices {{ devices_csv_path }} --emit-devices-json
      register: all_devices_raw
      changed_when: false

    - name: Parse merged device list
      tags: always
      set_fact:
        all_devices: "{{ all_devices_raw.stdout | from_json }}"

    # A forward zone is just hostname->IP; it doesn't care what subnet an A record's IP is
    # on (that's a reverse-zone concern). CLD (its own LAN), VRK (the vRACK) and FRD (the
    # Fredericia Havn vRACK stand-in) are all "black swan" sites in the sense that none of
    # them follow the standard per-site convention -- so for the forward zone, one combined
    # list covering all three is all that's needed; db.forward-zone.j2 doesn't need to
    # know or care which subnet any given entry's IP is actually on.
    # Reverse zones DO care (a PTR zone is inherently one-subnet), so db.192.168.139.j2/
    # db.192.168.69.j2 filter this same list down to their own site via the 'site' key,
    # rather than needing their own separately-built lists.
    - name: Build cld_black_swan_hosts (forward zone) from devices.csv
      tags: always
      set_fact:
        cld_black_swan_hosts: >-
          {{ (cld_black_swan_hosts | default([])) + [{
            'site': item.Site,
            'name': item.Hostname | lower,
            'ip': item.full_ip,
            'comment': item.Notes,
          }] }}
      loop: "{{ all_devices | selectattr('Site', 'in', ['CLD', 'VRK', 'FRD']) | list }}"
      loop_control:
        label: "{{ item.Hostname }}"

    # Detect provisioning interface if dns_interface not set
    - name: Detect provisioning network interface
      tags: always, network
      when: dns_interface == ""
      set_fact:
        # BUG FIX (2026-07-21): this regex sits inside a YAML folded block scalar (>-), which
        # (unlike a double-quoted string) never processes backslash escapes -- \\. survived as
        # two literal backslashes plus a dot, meaning "match a literal backslash character",
        # which can never match a real dotted-decimal IP. selectattr always returned empty, so
        # this silently fell back to the hardcoded 'ens33' default on EVERY run, on every box,
        # regardless of its real interface -- only surfaced now because this box's real
        # interface (ens18) isn't literally named ens33, so the later ansible_facts[dns_interface]
        # lookup had no such key and crashed. Single backslash is correct in a block scalar.
        dns_interface: >-
          {{
            ansible_interfaces
            | map('extract', ansible_facts)
            | selectattr('ipv4.address', 'defined')
            | selectattr('ipv4.address', 'match', '^192\.168\.139\.')
            | map(attribute='device')
            | first
            | default('ens33')
          }}

  # ---------------------------------------------------------------------------
  # 1. Packages
  # ---------------------------------------------------------------------------
  tasks:
    - name: Update apt cache
      tags: packages
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Install BIND9 and supporting packages
      tags: packages
      apt:
        name:
          - bind9
          - bind9utils
          - dnsutils
          - arping
          - iproute2
          - network-manager
          - vim
          - curl
          - tmux
          - grc
          - zsh
          - zsh-autosuggestions
          - zsh-syntax-highlighting
          - bc
          - localepurge
        state: present

    - name: Configure localepurge (keep en_GB and en_US only)
      tags: packages
      debconf:
        name: localepurge
        question: "{{ item.question }}"
        value: "{{ item.value }}"
        vtype: "{{ item.vtype }}"
      loop:
        - { question: "localepurge/nopurge",      value: "en_GB.UTF-8, en_US.UTF-8", vtype: multiselect }
        - { question: "localepurge/verbose",       value: "false",                    vtype: boolean }
        - { question: "localepurge/none_selected", value: "false",                    vtype: boolean }
        - { question: "localepurge/quickndirty",   value: "false",                    vtype: boolean }

    - name: Run localepurge
      tags: packages
      command: localepurge
      changed_when: false

  # ---------------------------------------------------------------------------
  # 2. Network -- static IP and hostname
  # ---------------------------------------------------------------------------
    - name: Set hostname
      tags: network
      hostname:
        name: "{{ this_hostname }}"

    - name: Ensure hostname in /etc/hosts
      tags: network
      lineinfile:
        path: /etc/hosts
        regexp: "^127\\.0\\.1\\.1"
        line: "127.0.1.1  {{ this_hostname }}.{{ domain }}  {{ this_hostname }}"
        state: present

    - name: Pin interface name via systemd .link (by MAC)
      tags: network
      copy:
        dest: "/etc/systemd/network/10-prov.link"
        mode: "0644"
        content: |
          # Example Music -- provisioning interface pin
          # Written by bind9-dns.yml on {{ ansible_date_time.iso8601 }}
          # Pins {{ dns_interface }} by MAC so reboots don't shuffle it
          [Match]
          MACAddress={{ ansible_facts[dns_interface].macaddress }}
          [Link]
          Name={{ dns_interface }}

    # BUG FIX (2026-07-21/22): this used to `nmcli connection delete prov-static` followed by
    # recreate + unconditional `nmcli connection up` on EVERY run -- tearing down and rebuplding
    # the live connection regardless of whether the IP was already correct. Live-observed on
    # EXADNSVRK001: this killed the SSH session mid-play, since Ansible always connects via this
    # exact interface/IP (ansible_host is dns_ip) -- there is no other path in. Rebuilt to match
    # roles/firewall/tasks/06_network_manager.yml's own established, session-safe pattern: a
    # templated .nmconnection keyfile for real idempotency (task reports unchanged when nothing
    # differs, unlike nmcli add/delete which always "changes" something), applied via `nmcli
    # connection reload` (re-reads profile files, does not tear down an active connection) rather
    # than delete+recreate, and a live-address-mismatch check before ever running `nmcli
    # connection up` -- which IS what actually pushes a changed address onto a live interface --
    # so a genuine IP correction is written to disk and reported, never applied live out from
    # under the exact session that's running this play.

    - name: "[NM] Detect current live IP on the provisioning interface"
      tags: network
      ansible.builtin.shell: |
        nmcli -g IP4.ADDRESS dev show {{ dns_interface }} 2>/dev/null | head -1 | cut -d/ -f1
      register: _prov_ip_live
      changed_when: false
      failed_when: false

    - name: "[NM] Set flag -- would bringing this connection up now strand this session?"
      tags: network
      ansible.builtin.set_fact:
        _prov_activate_would_strand_session: >-
          {{
            _prov_ip_live.stdout | trim != ''
            and _prov_ip_live.stdout | trim != dns_ip
          }}

    - name: Write prov-static NetworkManager connection profile
      tags: network
      ansible.builtin.template:
        src: prov-static.nmconnection.j2
        dest: /etc/NetworkManager/system-connections/prov-static.nmconnection
        owner: root
        group: root
        mode: "0600"
      notify: Reload NetworkManager connections

    - name: "[NM] Flush handlers (reload NM connection state, if the profile actually changed)"
      tags: network
      ansible.builtin.meta: flush_handlers

    - name: "[NM] NOTE -- provisioning IP correction needs a reboot (or manual con up) to take effect"
      tags: network
      ansible.builtin.debug:
        msg: >-
          {{ _c.Y }}[!]{{ _c.NC }} Provisioning IP is changing from {{ _prov_ip_live.stdout | trim }}
          to {{ dns_ip }} on {{ dns_interface }} -- this session is connected via that same
          interface, so bringing the connection up now would drop it mid-play. The corrected
          profile has been written to disk -- nothing has been applied live. Reboot this host,
          or run `nmcli connection up prov-static` yourself from a session that isn't riding
          {{ dns_interface }} (e.g. console/out-of-band), once you're ready to apply it.
      when: _prov_activate_would_strand_session

    - name: Bring up prov-static connection
      tags: network
      ansible.builtin.command: nmcli connection up prov-static
      changed_when: false
      when: not _prov_activate_would_strand_session

  # ---------------------------------------------------------------------------
  # 3. BIND9 configuration files
  # ---------------------------------------------------------------------------
    - name: Write named.conf.options
      tags: config
      copy:
        dest: "{{ bind_zone_dir }}/named.conf.options"
        mode: "0644"
        owner: root
        group: bind
        content: |
          // ============================================================
          // named.conf.options -- Example Music Limited
          // EXADNSVRK001  --  {{ domain }} DNS
          // Managed by Ansible bind9-dns.yml
          // ============================================================

          options {
            directory "/var/cache/bind";

            // ── Forwarders ────────────────────────────────────────────
            forwarders {
          {% for fw in dns_forwarders %}
              {{ fw }};
          {% endfor %}
            };

            forward only;

            // ── Access control ────────────────────────────────────────
            allow-query   { any; };
            allow-recursion { 192.168.139.0/24; localhost; };

            // ── Listen ────────────────────────────────────────────────
            listen-on     { 127.0.0.1; {{ dns_ip }}; };
            listen-on-v6  { none; };

            // ── DNSSEC ────────────────────────────────────────────────
            dnssec-validation auto;

            // ── Misc ──────────────────────────────────────────────────
            auth-nxdomain no;
            version "not disclosed";
          };
      notify: Reload named

    - name: Write named.conf.local (forward zone + all reverse zones)
      tags: config, zones
      template:
        src: templates/named.conf.local.j2
        dest: "{{ bind_zone_dir }}/named.conf.local"
        mode: "0644"
        owner: root
        group: bind
        validate: "named-checkconf %s"
      notify: Reload named

  # ---------------------------------------------------------------------------
  # 4. Zone files
  # ---------------------------------------------------------------------------
    - name: Write forward zone -- {{ domain }}
      tags: zones
      template:
        src: templates/db.forward-zone.j2
        dest: "{{ bind_zone_dir }}/db.{{ domain }}"
        mode: "0644"
        owner: root
        group: bind
        validate: "named-checkzone {{ domain }} %s"
      notify: Reload named

    - name: Write provisioning reverse zone (db.192.168.139)
      tags: zones
      template:
        src: templates/db.192.168.139.j2
        dest: "{{ bind_zone_dir }}/db.192.168.139"
        mode: "0644"
        owner: root
        group: bind
        validate: "named-checkzone 139.168.192.in-addr.arpa %s"
      notify: Reload named

    - name: Write CLD LAN reverse zone (db.192.168.69)
      tags: zones
      template:
        src: templates/db.192.168.69.j2
        dest: "{{ bind_zone_dir }}/db.192.168.69"
        mode: "0644"
        owner: root
        group: bind
        validate: "named-checkzone 69.168.192.in-addr.arpa %s"
      notify: Reload named

    - name: Write per-site reverse zone files (excluding CLD)
      tags: zones
      template:
        src: templates/db.site-reverse.j2
        dest: "{{ bind_zone_dir }}/db.192.168.{{ item.octet }}"
        mode: "0644"
        owner: root
        group: bind
        validate: "named-checkzone {{ item.octet }}.168.192.in-addr.arpa %s"
      loop: "{{ sites | rejectattr('Site', 'equalto', 'CLD') | list }}"
      loop_control:
        label: "{{ item.Site }} (192.168.{{ item.octet }}.0/24)"
      notify: Reload named

  # ---------------------------------------------------------------------------
  # 5. Enable and start named
  # ---------------------------------------------------------------------------
    - name: Enable and start named
      tags: service
      systemd:
        name: named
        enabled: true
        state: started

  # ---------------------------------------------------------------------------
  # 6. Management scripts (reloadbind/checkbind/editzone) + aliases
  # ---------------------------------------------------------------------------
  # BUG FIX (2026-07-21): reloadbind/checkbind/editzone used to be shell
  # aliases here too. Real, live-observed failure: `sudo editzone` ->
  # "sudo: editzone: command not found". Shell aliases only exist inside the
  # interactive shell that sourced them -- sudo execs a brand-new,
  # non-interactive process and never sources any shell rc file, so it has no
  # visibility into them at all, no matter how they're defined. The only fix
  # is real files on $PATH (root-owned, root-only where the operation needs
  # root) -- see bootstrap/web/provision/bindme.sh's matching fix, ported
  # here. This also closes a capability gap the old bare-alias version had:
  # it only ever supported the default forward zone, hardcoded -- both
  # scripts below accept an optional [zone-file] argument, so reverse zones
  # can be checked/edited too.
    - name: Deploy reloadbind script
      tags: aliases
      copy:
        dest: /usr/local/bin/reloadbind
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/bash
          # reloadbind -- reloads {{ domain }} via rndc.
          set -euo pipefail
          if rndc reload {{ domain }}; then
            echo "[+] Zone reloaded."
          else
            echo "[!] Reload failed -- check: journalctl -u named -n 20" >&2
            exit 1
          fi

    - name: Deploy checkbind script
      tags: aliases
      copy:
        dest: /usr/local/bin/checkbind
        owner: root
        group: root
        mode: "0755"
        content: |
          #!/bin/bash
          # checkbind [zone-file] -- validates a BIND zone file with named-checkzone.
          # Defaults to db.{{ domain }} if no argument given.
          # Accepts a bare filename (db.192.168.78) or a full path.
          set -euo pipefail

          _bind_zonename() {
            local base="${1#/etc/bind/}"
            base="${base#db.}"
            if [[ "$base" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "${BASH_REMATCH[3]}.${BASH_REMATCH[2]}.${BASH_REMATCH[1]}.in-addr.arpa"
            else
              echo "$base"
            fi
          }

          file="${1:-db.{{ domain }}}"
          base="${file##*/}"
          fullpath="/etc/bind/${base}"

          if [[ ! -f "$fullpath" ]]; then
            echo "[!] Zone file not found: ${fullpath}" >&2
            echo "    Available zone files:" >&2
            ls /etc/bind/db.* 2>/dev/null | sed 's|/etc/bind/||' | sed 's/^/      /' >&2
            exit 1
          fi

          zone=$(_bind_zonename "$base")
          echo "[*] Checking zone '${zone}' using ${fullpath}..."
          named-checkzone "$zone" "$fullpath"

    - name: Deploy editzone script
      tags: aliases
      copy:
        dest: /usr/local/bin/editzone
        owner: root
        group: root
        mode: "0750"
        content: |
          #!/bin/bash
          # editzone [zone-file] -- opens a zone file in vim, validates it, reloads if
          # valid. Defaults to db.{{ domain }} if no argument given. Writes to
          # /etc/bind/ -- must be run via: sudo editzone
          set -euo pipefail

          if [[ $EUID -ne 0 ]]; then
            echo "[!] This command writes to /etc/bind/ and needs root. Run: sudo editzone" >&2
            exit 1
          fi

          _bind_zonename() {
            local base="${1#/etc/bind/}"
            base="${base#db.}"
            if [[ "$base" =~ ^([0-9]+)\.([0-9]+)\.([0-9]+)$ ]]; then
              echo "${BASH_REMATCH[3]}.${BASH_REMATCH[2]}.${BASH_REMATCH[1]}.in-addr.arpa"
            else
              echo "$base"
            fi
          }

          file="${1:-db.{{ domain }}}"
          base="${file##*/}"
          fullpath="/etc/bind/${base}"

          if [[ ! -f "$fullpath" ]]; then
            echo "[!] Zone file not found: ${fullpath}" >&2
            echo "    Available zone files:" >&2
            ls /etc/bind/db.* 2>/dev/null | sed 's|/etc/bind/||' | sed 's/^/      /' >&2
            exit 1
          fi

          zone=$(_bind_zonename "$base")
          echo "[*] Editing zone '${zone}' -- ${fullpath}"

          vim "$fullpath"

          echo "[*] Validating..."
          if named-checkzone "$zone" "$fullpath"; then
            echo "[*] Reloading zone '${zone}'..."
            rndc reload "$zone" && echo "[+] Zone '${zone}' reloaded." || { echo "[!] rndc reload failed -- check: journalctl -u named -n 20" >&2; exit 1; }
          else
            echo "[!] Validation failed -- zone NOT reloaded. Fix errors and re-run: checkbind ${base}" >&2
            exit 1
          fi

    - name: Write BIND management aliases to /etc/profile.d
      tags: aliases
      copy:
        dest: /etc/profile.d/bind-aliases.sh
        mode: "0644"
        content: |
          # Example Music -- BIND9 management aliases
          # Managed by Ansible bind9-dns.yml
          # Works in bash and zsh (sourced via /etc/profile.d)
          # reloadbind/checkbind/editzone are real scripts at /usr/local/bin/,
          # not aliases -- see the "Deploy ...script" tasks above for why.

          alias bindstatus='systemctl status named'
          alias bindlog='journalctl -u named -f'

    - name: Write zsh config for root
      tags: aliases
      copy:
        dest: /root/.zshrc
        mode: "0644"
        force: false   # don't overwrite if already customised
        content: |
          export TERM=xterm-256color
          export EDITOR=vim
          export VISUAL=vim
          export SUDO_EDITOR=vim
          HISTFILE=~/.zsh_history
          HISTSIZE=10000
          SAVEHIST=10000
          setopt appendhistory autocd extendedglob notify interactivecomments
          setopt AUTO_CONTINUE LONG_LIST_JOBS
          bindkey -e
          autoload -Uz compinit && compinit
          autoload -Uz colors && colors
          PROMPT='
          %F{red}%m%f:%F{cyan}%~%f# '
          alias ls='ls --color=auto'
          alias ll='ls -lah'
          alias grep='grep --color=auto'
          if (( $+commands[grc] )); then
            GRC_ALIASES=true
            [[ -f /etc/profile.d/grc.sh ]] && source /etc/profile.d/grc.sh
          fi
          [[ -f /etc/profile.d/bind-aliases.sh ]] && source /etc/profile.d/bind-aliases.sh

    - name: Set zsh as default shell for root
      tags: aliases
      user:
        name: root
        shell: /usr/bin/zsh

    - name: Write zsh config for ansible user
      tags: aliases
      copy:
        dest: /home/ansible/.zshrc
        mode: "0644"
        owner: ansible
        group: ansible
        force: false
        content: |
          export TERM=xterm-256color
          export EDITOR=vim
          export VISUAL=vim
          HISTFILE=~/.zsh_history
          HISTSIZE=10000
          SAVEHIST=10000
          setopt appendhistory autocd extendedglob notify interactivecomments
          setopt AUTO_CONTINUE LONG_LIST_JOBS
          bindkey -e
          autoload -Uz compinit && compinit
          autoload -Uz colors && colors
          PROMPT='
          %F{green}%m%f:%F{cyan}%~%f> '
          alias ls='ls --color=auto'
          alias ll='ls -lah'
          alias grep='grep --color=auto'
          if (( $+commands[grc] )); then
            GRC_ALIASES=true
            [[ -f /etc/profile.d/grc.sh ]] && source /etc/profile.d/grc.sh
          fi
          [[ -f /etc/profile.d/bind-aliases.sh ]] && source /etc/profile.d/bind-aliases.sh

    - name: Set zsh as default shell for ansible user
      tags: aliases
      user:
        name: ansible
        shell: /usr/bin/zsh

  # ---------------------------------------------------------------------------
  # 7. Dynamic MOTD
  # ---------------------------------------------------------------------------
    - name: Disable default MOTD scripts
      tags: motd
      file:
        path: "{{ item }}"
        mode: "0644"   # remove execute bit -- MOTD runner won't call them
      loop:
        - /etc/update-motd.d/10-uname
        - /etc/update-motd.d/50-motd-news
      failed_when: false

    - name: Write Example Music MOTD script
      tags: motd
      copy:
        dest: /etc/update-motd.d/10-examplemusic
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          WH='\033[1;37m'; YL='\033[1;33m'; GR='\033[0;32m'
          CY='\033[0;36m'; RS='\033[0m'

          HOSTNAME=$(hostname -s)
          UPTIME=$(uptime -p 2>/dev/null || uptime)
          LOAD=$(awk '{print $1,$2,$3}' /proc/loadavg)
          MEM_TOTAL=$(free -m | awk '/^Mem:/{print $2}')
          MEM_USED=$(free -m  | awk '/^Mem:/{print $3}')
          DISK=$(df -h / | awk 'NR==2{print $3" used of "$2" ("$5")"}')

          DNS_IP=$(ip -4 addr show \
            | awk '/inet /{print $2}' \
            | grep '192\.168\.139\.' \
            | cut -d/ -f1 | head -1)
          ZONE_SERIAL=$(grep -oP '(?<=;\s)serial.*' \
            /etc/bind/db.{{ domain }} 2>/dev/null \
            | head -1 | awk '{print $1}') || true
          NAMED_STATUS=$(systemctl is-active named 2>/dev/null || echo "unknown")
          RECORD_COUNT=$(grep -c 'IN  A' \
            /etc/bind/db.{{ domain }} 2>/dev/null || echo "?")

          echo -e "
          ${WH}╔══════════════════════════════════════════════════════════════╗${RS}
          ${WH}║           EXAMPLE MUSIC LIMITED: $(printf '%-24s' "${HOSTNAME}")║${RS}
          ${WH}╚══════════════════════════════════════════════════════════════╝${RS}

            ${YL}Role     :${RS} DNS Server -- {{ domain }}
            ${YL}Zone     :${RS} {{ domain }}  (${RECORD_COUNT} A records, serial ${ZONE_SERIAL:-unknown})

            ${WH}── Network ──────────────────────────────────────────────────${RS}
              ${CY}DNS IP${RS}   : ${GR}${DNS_IP:-unknown}${RS}
              ${CY}BIND9${RS}    : ${GR}${NAMED_STATUS}${RS}

            ${WH}── System ───────────────────────────────────────────────────${RS}
              ${CY}Uptime${RS}   : ${GR}${UPTIME}${RS}
              ${CY}Load${RS}     : ${GR}${LOAD}${RS}
              ${CY}Memory${RS}   : ${GR}${MEM_USED}MB${RS} used of ${MEM_TOTAL}MB
              ${CY}Disk /  ${RS} : ${GR}${DISK}${RS}

            ${WH}── Management ───────────────────────────────────────────────${RS}
              ${CY}Aliases${RS}  : reloadbind  checkbind  editzone  bindstatus  bindlog
          "

    - name: Ensure PrintMotd yes in sshd_config
      tags: motd
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PrintMotd"
        line: "PrintMotd yes"
        state: present
      notify: Restart sshd

    - name: Source MOTD from /etc/profile.d
      tags: motd
      copy:
        dest: /etc/profile.d/motd.sh
        mode: "0644"
        content: |
          [[ -x /etc/update-motd.d/10-examplemusic ]] && /etc/update-motd.d/10-examplemusic

  # ---------------------------------------------------------------------------
  # 8. Node info file
  # ---------------------------------------------------------------------------
    # Resolved from an already-deployed nodeinfo.json if present, else
    # prompted -- see ansible/tasks/nodeinfo_environment.yml (replaced the
    # old standalone /etc/.environment file 2026-07-10).
    - name: Resolve environment
      tags: always
      include_tasks: ../../tasks/nodeinfo_environment.yml

    - name: Set dns_environment
      tags: always
      set_fact:
        dns_environment: "{{ resolved_environment }}"

    - name: Ensure /etc/example-music directory exists
      tags: always
      file:
        path: /etc/example-music
        state: directory
        mode: "0755"

    - name: Look up CLD's site row for nodeinfo enrichment
      tags: always
      set_fact:
        _dns_site_row: "{{ sites | selectattr('Site', 'equalto', 'CLD') | list | first | default({}) }}"

    - name: Write /etc/example-music/nodeinfo.json
      tags: always
      include_tasks: ../../tasks/nodeinfo.yml
      vars:
        nodeinfo_hostname: "{{ this_hostname }}"
        nodeinfo_role: "dns"
        nodeinfo_site: "CLD"
        nodeinfo_city: "{{ _dns_site_row.City | default('') }}"
        nodeinfo_country: "{{ _dns_site_row.Country | default('') }}"
        nodeinfo_entity: "{{ _dns_site_row.Entity | default('') }}"
        nodeinfo_environment: "{{ dns_environment | default('production') }}"
        nodeinfo_bootstrapped_by: "bind9-dns.yml"
        nodeinfo_extra:
          dns_ip: "{{ dns_ip }}"
          zone: "{{ domain }}"
          zone_serial: "{{ zone_serial }}"
          interface: "{{ dns_interface }}"

  # ---------------------------------------------------------------------------
  # 9. Verify -- quick dig self-test
  # ---------------------------------------------------------------------------
    # Zone records are deliberately lowercase (db.forward-zone.devices.j2's dev.Hostname |
    # lower -- standard DNS zone-file convention, unrelated to this_hostname's own uppercase
    # box-identity convention above) -- lowercase this_hostname here to match what's actually
    # in the zone, rather than a case-sensitive Jinja substring check silently failing.
    - name: Self-test DNS -- forward lookup
      tags: service, reload
      command: "dig @127.0.0.1 +short {{ this_hostname | lower }}.{{ domain }}"
      register: dig_result
      changed_when: false
      failed_when: dns_ip not in dig_result.stdout

    - name: Self-test DNS -- PTR lookup for this server
      tags: service, reload
      command: "dig @127.0.0.1 +short -x {{ dns_ip }}"
      register: dig_ptr
      changed_when: false
      failed_when: this_hostname | lower not in dig_ptr.stdout

  # ---------------------------------------------------------------------------
  # Handlers
  # ---------------------------------------------------------------------------
  handlers:
    - name: Reload named
      systemd:
        name: named
        state: reloaded

    - name: Restart sshd
      systemd:
        name: ssh
        state: restarted

    # Mirrors roles/firewall/tasks/06_network_manager.yml's own handler exactly -- re-reads
    # connection profile files from disk, does not tear down an active connection.
    - name: Reload NetworkManager connections
      ansible.builtin.command: nmcli connection reload
      changed_when: true


# =============================================================================
# Templates required by this playbook
# Place these in templates/ alongside the playbook.
# =============================================================================
#
# templates/named.conf.local.j2
# ─────────────────────────────
# Declares all zones.  The forward zone plus the dedicated 139 reverse zone
# are written as static stanzas; per-site reverse zones are looped.
# CLD is excluded from the per-site loop (handled by the 139 zone).
#
# templates/db.forward-zone.j2
# ─────────────────────────────────
# Forward zone.  Loops suffix_map × sites to produce A records.
# Appends FWL WAN A records and ancillary hosts.
#
# templates/db.192.168.139.j2
# ─────────────────────────────
# Dedicated provisioning reverse zone.
# Contains ancillary PTRs + FWL WAN PTRs for all sites.
#
# templates/db.site-reverse.j2
# ─────────────────────────────
# Per-site reverse zone template.  item = one row from sites list.
# Loops suffix_map to produce PTR records.
#
# templates/prov-static.nmconnection.j2
# ──────────────────────────────────────
# NetworkManager keyfile for this box's own provisioning-network static IP
# (Section 2).  Mirrors roles/firewall/tasks/06_network_manager.yml's
# wan.nmconnection.j2/lan.nmconnection.j2 -- written for real idempotency and
# applied via `nmcli connection reload`, never delete+recreate.
#
# See templates/ directory for full template content.
# =============================================================================

# =============================================================================
# PLAY 2 -- Full zone regeneration from devices.csv
# =============================================================================
# This play supersedes the SUFFIX_MAP-based zone generation in Play 1.
# It reads devices.csv (single source of truth for all devices) alongside
# sites.csv and generates:
#   - db.{{ domain }}       (forward zone -- all devices with a HostOctet)
#   - db.192.168.139        (provisioning reverse zone -- CLD devices + FWL WANs)
#   - db.192.168.{octet}    (per-site reverse zones -- one per site, CLD excluded)
#
# Non-networked assets (blank HostOctet) are emitted as comments in the
# forward zone so they are documented without creating DNS records.
#
# CLD BLACK SWAN NOTE:
#   CLD (192.168.139.0/24) is the provisioning network. It does not follow
#   the standard site convention -- no EXADCS, no EXAPVE, no EXASBC.
#   Its devices have manually assigned IPs serving specific provisioning roles.
#   The BIND zone for 192.168.139.0/24 is generated as a dedicated provisioning
#   reverse zone (db.192.168.139) and is NOT produced by the per-site loop.
#   Do not apply standard site convention validation to CLD rows.
#
# Tags:
#   zones-full   -- regenerate all zones from devices.csv
#   reload       -- rndc reload after zone regeneration
#
# Changelog:
#   2026-03-29  Initial release. Replaces SUFFIX_MAP loops in Play 1 with
#               devices.csv-driven generation. Non-networked assets emitted
#               as zone file comments. CLD black swan documented.
#   2026-07-07  devices.csv became exceptions-only (see generate_inventory.py
#               and address_policy.json) — it no longer contains a row for
#               every standard-slot device, which would have silently dropped
#               DNS records for every DC/PVE/router/firewall/etc across the
#               whole estate. Replaced the "Load devices.csv" + manual
#               enrichment tasks with a single call to
#               generate_inventory.py --emit-devices-json, which computes the
#               full merged, deduplicated device list (standard-slot
#               synthesis + real exceptions, full_ip resolved) in the same
#               code path the .ini generator uses, so the two can't disagree.
#               Also fixed, found via actually rendering every template
#               end-to-end against live data rather than reading the code:
#                 - "Load devices.csv" used read_csv's comment: "#" param,
#                   which doesn't exist on this module — would have failed
#                   outright the first time this play ran.
#                 - device_sites (drives the per-site reverse zone loop)
#                   included VRK, which has no sites_by_code entry (it's the
#                   provisioning network, handled by the dedicated
#                   db.192.168.139.devices.j2 template) — would have crashed
#                   rendering db.site-reverse.devices.j2 for VRK.
#                 - db.site-reverse.devices.j2's "Covers:" comment line
#                   double-appended ".0" to sites_by_code's value (which is
#                   already a full x.x.x.0/24 string from sites.csv).
#               BRD (West Berlin) keeps its own identity — it's a real, separate site that
#               happens to share BER's exact subnet on purpose (ALLOWED_SITE_OVERLAP in
#               generate_inventory.py already treats this as intentional: two hostnames
#               resolving to the same IP, same as the .ini generator's own brd.ini). BRD gets
#               its own forward-zone A records and keeps its own devices.csv rows; it is only
#               excluded from the per-site *reverse* zone loop below, since a subnet can have
#               only one authoritative reverse zone and BER already owns it. (An earlier version
#               of this fix folded BRD into BER entirely, erasing its identity — wrong, caught
#               in review.)
# =============================================================================

- name: EXADNSVRK001 -- Full zone generation from devices.csv
  hosts: EXADNSVRK001
  become: true

  vars:
    dns_ip: "192.168.139.8"
    this_hostname: "EXADNSVRK001"
    ad_forest_json_path: "/etc/example-music/ad_forest.json"
    domain: "{{ (lookup('file', ad_forest_json_path) | from_json).domain_fqdn }}"
    bind_zone_dir: "/etc/bind"
    zone_serial: "{{ ansible_date_time.date | replace('-', '') }}01"
    zone_ttl: 300
    sites_csv_path: "/etc/example-music/sites.csv"
    devices_csv_path: "/etc/example-music/devices.csv"

    # CLD BLACK SWAN:
    # CLD has two subnets: LAN 192.168.69.0/24 (DCs, Ansible) and
    # vRACK 192.168.139.0/24 (DNS, Rudder, PBX, PXE, FWL WAN faces).
    # CLD LAN is now in sites.csv so sites_by_code['CLD'] resolves normally.
    # vRACK ancillary PTRs are hardcoded in db.192.168.139.devices.j2.

  pre_tasks:
    - name: Load sites.csv
      tags: always
      delegate_to: localhost
      become: false
      read_csv:
        path: "{{ sites_csv_path }}"
      register: sites_raw

    - name: Build sites lookup (octet by site code)
      tags: always
      set_fact:
        sites_by_code: >-
          {{
            sites_raw.list
            | rejectattr('Site', 'equalto', 'BRD')
            | rejectattr('Site', 'equalto', 'VRK')
            | rejectattr('Subnet', 'equalto', 'N/A')
            | items2dict(key_name='Site', value_name='Subnet')
          }}

    # devices.csv is exceptions-only as of 2026-07-07 (see generate_inventory.py and
    # address_policy.json). all_devices (the merged, deduplicated device list -- standard-slot
    # synthesis + devices.csv exceptions, full_ip resolved, BRD/VRK special-cased) is computed
    # once, in Play 1's pre_tasks (tags: always, so it runs regardless of which tags this play
    # actually needs) -- shared as a fact rather than recomputed here a second time.

  tasks:
    # -------------------------------------------------------------------------
    # Forward zone -- db.{{ domain }}
    # Devices with HostOctet get A records.
    # Devices without HostOctet get a comment line (documented, not resolved).
    # Grouped by site, sorted by HostOctet within each site.
    # -------------------------------------------------------------------------
    - name: Write forward zone from devices.csv
      tags: zones-full
      template:
        src: templates/db.forward-zone.devices.j2
        dest: "{{ bind_zone_dir }}/db.{{ domain }}"
        mode: "0644"
        owner: root
        group: bind
        validate: "named-checkzone {{ domain }} %s"
      notify: Reload named

    # -------------------------------------------------------------------------
    # Provisioning reverse zone -- db.192.168.139
    # CLD BLACK SWAN: generated separately, never from the per-site loop.
    # Contains CLD device PTRs + FWL WAN PTRs for every site.
    # -------------------------------------------------------------------------
    - name: Write provisioning reverse zone (db.192.168.139) from devices.csv
      tags: zones-full
      template:
        src: templates/db.192.168.139.devices.j2
        dest: "{{ bind_zone_dir }}/db.192.168.139"
        mode: "0644"
        owner: root
        group: bind
        validate: "named-checkzone 139.168.192.in-addr.arpa %s"
      notify: Reload named

    # -------------------------------------------------------------------------
    # Per-site reverse zones -- db.192.168.{octet}
    # One per site from devices.csv, including CLD (192.168.69.0/24).
    # -------------------------------------------------------------------------
    - name: Build unique device site list from devices.csv
      tags: zones-full
      set_fact:
        # VRK is excluded: it has no entry in sites_by_code (provisioning network, handled
        # entirely by the dedicated db.192.168.139.devices.j2 template, never the per-site
        # loop below) — its real devices (DNS/PRV/FWL) are still in all_devices for the
        # forward zone, but must not reach the per-site reverse zone loop, which would fail
        # looking up sites_by_code['VRK'].
        #
        # BRD is excluded for a different reason: it's a real site (West Berlin) that shares
        # BER's exact subnet (192.168.113.0/24) on purpose (see ALLOWED_SITE_OVERLAP in
        # generate_inventory.py) — it gets its own hostnames in the FORWARD zone (all_devices
        # is untouched here, BRD's A records still appear there), but a subnet can only have
        # one authoritative reverse zone file, and BER already owns it. Excluding BRD here only
        # stops it from generating a second, conflicting db.192.168.113 file — it does not
        # remove BRD's own devices or hostnames from DNS.
        device_sites: >-
          {{
            all_devices
            | map(attribute='Site')
            | unique
            | reject('equalto', 'VRK')
            | reject('equalto', 'BRD')
            | list
          }}

    - name: Write per-site reverse zones from devices.csv
      tags: zones-full
      template:
        src: templates/db.site-reverse.devices.j2
        dest: "{{ bind_zone_dir }}/db.192.168.{{ sites_by_code[item].split('.')[2] }}"
        mode: "0644"
        owner: root
        group: bind
        validate: >-
          named-checkzone
          {{ sites_by_code[item].split('.')[2] }}.168.192.in-addr.arpa %s
      loop: "{{ device_sites | sort }}"
      loop_control:
        label: "{{ item }}"
      notify: Reload named

    # -------------------------------------------------------------------------
    # Validate entire named config after all zones written
    # -------------------------------------------------------------------------
    - name: Validate named.conf after full zone regeneration
      tags: zones-full
      command: named-checkconf /etc/bind/named.conf
      changed_when: false

  handlers:
    - name: Reload named
      systemd:
        name: named
        state: reloaded
