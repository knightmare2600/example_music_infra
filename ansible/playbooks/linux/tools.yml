---
# linux/tools.yml
# Deploy common tools, dotfiles, and optional user accounts to all Linux hosts.
#   ansible-playbook playbooks/linux/tools.yml -i configs/inventory
#
# Changelog:
#   2026-07-02  Add /etc/example-music deploy for sites.csv and devices.csv
#   2026-07-06  Add dotfile deployment (gitconfig, tmux, vim, zshrc)
#   2026-07-06  Add optional user creation via vars_prompt
#   2026-07-07  Add /etc/example-music deploy for address_policy.json —
#               bind9-dns.yml Play 2 needs it (standard-slot DNS synthesis,
#               see generate_inventory.py's identical loader)
#   2026-07-07  Add nodeinfo.json (best-effort, via shared tasks/nodeinfo.yml)
#               so every properly-named Linux host gets a base version, not
#               just the three roles (proxmox/firewall/rudder) that used to
#               each hand-write their own. Wrapped in block/rescue since this
#               playbook runs on every Linux host, including ones that may
#               not have a conformant hostname yet.
#   2026-07-09  Add /etc/example-music deploy for ad_forest.json -- AD forest
#               identity (domain_fqdn/netbios_name/etc), single source of truth
#               for group_vars/all/vars.yml's exa_domain and every other
#               ad_forest.json consumer (windows_dc, rudder_servers, bind9-dns.yml).
#   2026-07-10  Add /etc/example-music deploy for ad_groups.json/ad_users.json/
#               ad_computers.json -- generated (by benarbejde/parse_tdf.py, hand-run,
#               offline) from jukebox.example.tdf, committed in benarbejde/ alongside
#               sites.csv. windows_adschema's 20-ad-groups.yml/30-ad-users.yml/
#               40-ad-computers.yml read these via delegate_to: localhost, i.e. on
#               the Ansible control node -- same reason sites.csv needs to land here,
#               not on the Windows DC being configured. Previously these files existed
#               in benarbejde/ but nothing deployed them anywhere Ansible could read.
#   2026-07-10  nodeinfo.json's environment field now resolved via the shared
#               tasks/nodeinfo_environment.yml instead of being left to
#               nodeinfo.yml's 'production' default. Previously, running
#               this playbook after a role-specific play (proxmox/site.yml,
#               firewallme, rudder_server.yml) had already set a real
#               environment (e.g. staging) would silently reset it back to
#               production, since this play never read any existing value.
#               nodeinfo_environment.yml checks the host's own existing
#               nodeinfo.json first, so a correctly-set value survives a
#               later run of this playbook.
#   2026-07-16  Added "[Preflight] Ensure ansible account isn't locked" -- healing task for
#               firewall nodes created under firewallme.sh's old `passwd -l ansible` bug (fixed
#               at the source the same day). Robert found this live: it blocked both console
#               login and add-wg-spoke.yml's key-only SSH fetch on a real firewall node, since a
#               locked account is rejected by pam_unix's account phase for every login method
#               under UsePAM yes, not just password. Never enables password auth -- only clears
#               the administrative lock flag via password_lock: false (usermod, not passwd, so
#               it doesn't hit passwd -u's "would result in a passwordless account" refusal).
#   2026-07-16  Robert: asked whether the Ansible SSH key ever gets refreshed on
#               ongoing Linux nodes the way it does on Proxmox
#               (proxmox/playbooks/20-ansible-access.yml) and firewalls
#               (firewallme's 11_ssh_hardening.yml) -- it didn't. This file (the
#               one playbook that routinely touches every Linux host, hosts: all)
#               had no key-deployment task at all; a host only ever got the key
#               once, at first-boot, from bootstrap/web/ansible_sshkey.pub. Added
#               a "[Preflight] Refresh Ansible SSH key" task (now in the "Deploy
#               common tools" play below) using the same shared exa_ansible_pub_key
#               var (group_vars/all/vars.yml, itself a live file lookup, not a
#               frozen copy) the other two already use -- closes the asymmetry,
#               no sshd_config/PasswordAuthentication changes (explicitly out of
#               scope per Robert).
#
#               Also added a genuinely conditional password fallback -- explicitly
#               NOT the windows_bootstrap pattern of "always ask, blank means use
#               the key" (vars_prompt fires unconditionally, before any connection
#               is even attempted, so it can't be made conditional on a live
#               check's result). This needed its own separate play
#               ("SSH preflight" below), not just extra tasks bolted onto the
#               front of the existing one, for two reasons found empirically
#               while building this:
#                 1. pause: does not reliably register a result for every host in
#                    a multi-host batch hitting it at once -- confirmed live, only
#                    one host in the batch ever got a result back, regardless of
#                    ignore_unreachable/ignore_errors/meta: clear_host_errors on
#                    earlier tasks. serial: 1 (process one host fully through the
#                    play before starting the next) is what actually fixes this --
#                    but serializing the WHOLE tools.yml run across every Linux
#                    host in the estate would be a real performance regression,
#                    so only this lightweight preflight play is serial: 1, not
#                    the heavier "Deploy common tools" play that follows it.
#                 2. Using ansible.builtin.ping (a real per-host connection
#                    attempt) as the connectivity test marks a failing host
#                    unreachable in Ansible's own internal state for the rest of
#                    that play -- ignore_unreachable/ignore_errors on that one
#                    task does NOT undo this for later tasks targeting the same
#                    host (confirmed live; meta: clear_host_errors afterward
#                    didn't either). Testing via a plain delegate_to: localhost
#                    ssh command instead avoids this entirely -- Ansible's own
#                    connection layer never touches the real target until we
#                    already know (and have a password fact ready, if needed)
#                    whether the key actually works.
#               Every node's ansible user has a locked password and passwordless
#               sudo by design (see e.g. firewallme.sh's own "create with a
#               locked password so only key/sudo auth works" comment) -- the
#               password prompt only does anything if an operator has already
#               manually unlocked/set a password out-of-band for recovery. A
#               blank answer adds the host to the ssh_preflight_skip group,
#               which "Deploy common tools" then excludes entirely -- skips that
#               one host cleanly rather than failing the whole run or wasting a
#               doomed reconnect attempt.
#   2026-07-26  Add /etc/example-music deploy for role_codes.csv -- create-vm.py's
#               ROLE_CODES switched from a hardcoded dict to loading this file (same
#               drift class as every other benarbejde/ CSV this playbook already
#               deploys: found live missing SLT, the Salt master role, added
#               2026-07-20 but never wired into the VM-creation script).
#   2026-07-26  Robert, live (EXAPVEVRK001): both unattended-upgrades config tasks used to
#               run unconditionally regardless of whether the package was actually
#               installed -- some nodes deliberately don't have it, a legitimate state, not
#               something to correct. 50unattended-upgrades hard-failed outright (no
#               create: true, file genuinely doesn't exist without the package);
#               20auto-upgrades would have silently written periodic-timer config for a
#               package that isn't there to act on it. Added a package_facts gather +
#               when: "'unattended-upgrades' in ansible_facts.packages" gate on both --
#               Ansible's equivalent of Puppet's require Package[...] dependency pattern,
#               Robert's own framing for what he wanted here.
#   2026-07-26  Robert, same live --check --diff session: "Link update-motd into
#               /etc/update-motd.d" failed under --check ("src file does not exist") --
#               its src is written by the immediately preceding copy task, which --check
#               only simulates, never actually writes. Added when: not ansible_check_mode
#               so a dry run reports this honestly (skipped, precondition can't be
#               evaluated) instead of a scary red failure; unchanged on a real apply.
#               Repo-wide grep confirms this is the only state: link task anywhere --
#               isolated fix, not a wider pattern this time.
#   2026-07-26  Robert, same live session: the environment prompt fired mid-run (after
#               packages/CSV deploys/dotfile prep), not up front with extra_users_input --
#               broke the "ask everything up front" convention used everywhere else in this
#               repo. First fix moved the nodeinfo_environment.yml include to the top of
#               "Deploy common tools" -- it never actually depended on hostname_facts.yml or
#               anything else in the block it used to sit inside. Robert then asked about
#               serial: (was it needed?) and confirmed the follow-up fix: since the prompt
#               is an ansible.builtin.pause task, same class as "SSH preflight" above (which
#               was already split into its own serial: 1 play, 2026-07-16, for exactly this
#               reason -- pause doesn't reliably register a result for every host in a
#               multi-host parallel batch), it got its own dedicated "Resolve environment"
#               serial: 1 play too, rather than living inside the much heavier, fully
#               parallel "Deploy common tools" play. See that play's own header comment.
#   2026-07-26  Robert, live (EXAPVEVRK001, --check --diff -v): "Deploy .gitconfig to all
#               user home directories" (and the 4 other dotfile-deploy tasks alongside it)
#               failed outright on EVERY loop item -- not just the ones that should have
#               been skipped. Same bug class as several others fixed live this session
#               (regex_search() returns the matched string or None, never a real boolean;
#               recent ansible-core rejects a non-boolean when: result outright), but this
#               was in this file the whole time and should have been caught by the sweep
#               done earlier the same session when the same fix landed elsewhere -- missed
#               it. All 5 `when: item.value[4] | regex_search('^/home/')` -> `is match(...)`.
#               The new "Identify /home/* accounts..." task added the same session already
#               used `is match(...)` correctly, so it wasn't affected.
#   2026-07-26  Extracted the "SSH preflight" play and the "[Preflight] Refresh Ansible SSH
#               key"/"Ensure ansible account isn't locked" tasks out into
#               ../ssh_preflight_with_fallback.yml / ../../tasks/refresh_ansible_ssh_key.yml --
#               no functional change here, this file now imports/includes them. Done because
#               firewallme/playbooks/90-firewall.yml needed the exact same recovery flow after a
#               real live SSH key rejection (EXAFWLAMS001) -- a second caller made keeping this
#               logic duplicated in one file not worth it.

- import_playbook: ../ssh_preflight_with_fallback.yml

# -------------------------------------------------------------------------------------------------
# BUG FIX (2026-07-26, Robert): the environment prompt (nodeinfo_environment.yml) is a per-host
# ansible.builtin.pause task -- the same class of task "SSH preflight" above was already split
# into its own serial: 1 play on 2026-07-16 (see that play's own header comment): pause does not
# reliably register a result for every host in a multi-host batch hitting it at once, confirmed
# live back then, only one host in the batch ever gets a real answer back. The environment prompt
# was moved to the top of "Deploy common tools" earlier the same day as this fix -- harmless
# against a single --limit'd host (what's been tested so far), but "Deploy common tools" has no
# serial: of its own, so a genuine multi-host run would hit exactly the bug SSH preflight already
# exists to avoid. Given its own dedicated, serial: 1 play, matching that established pattern --
# resolved_environment set here persists into "Deploy common tools" below the same way
# ssh_preflight_skip group membership and ansible_password already do (facts carry across plays
# for the same host within one playbook run). The heavy play stays fully parallel, unaffected --
# only this lightweight prompt pays the serial: 1 cost, same tradeoff already made for SSH
# preflight.
# -------------------------------------------------------------------------------------------------
- name: Resolve environment
  hosts: "{{ groups['all'] | difference(groups['ssh_preflight_skip'] | default([])) }}"
  become: true
  serial: 1

  tasks:
    - name: "Resolve environment (asked up front, one host at a time so the prompt is reliable)"
      include_tasks: ../../tasks/nodeinfo_environment.yml

- name: Deploy common tools
  hosts: "{{ groups['all'] | difference(groups['ssh_preflight_skip'] | default([])) }}"
  become: true

  vars_prompt:
    - name: extra_users_input
      prompt: "Usernames to create if missing, space-separated (leave blank to skip)"
      private: false
      default: ""

  vars_files:
    - ../../group_vars/all/main.yml

  vars:
    extra_users: "{{ extra_users_input.split() }}"
    sites_csv_src:     "{{ playbook_dir }}/../../../benarbejde/sites.csv"
    devices_csv_src:   "{{ playbook_dir }}/../../../benarbejde/devices.csv"
    role_codes_csv_src: "{{ playbook_dir }}/../../../benarbejde/role_codes.csv"
    address_policy_src: "{{ playbook_dir }}/../../../benarbejde/address_policy.json"
    ad_forest_src:     "{{ playbook_dir }}/../../../benarbejde/ad_forest.json"
    ad_groups_src:     "{{ playbook_dir }}/../../../benarbejde/ad_groups.json"
    ad_users_src:      "{{ playbook_dir }}/../../../benarbejde/ad_users.json"
    ad_computers_src:  "{{ playbook_dir }}/../../../benarbejde/ad_computers.json"

  tasks:

    - name: "[Preflight] Refresh SSH key + heal locked account"
      ansible.builtin.include_tasks: ../../tasks/refresh_ansible_ssh_key.yml

    - name: Install common packages
      apt:
        name: "{{ common_packages }}"
        state: latest
        update_cache: true
        cache_valid_time: 3600

    # -------------------------------------------------------------------------
    # BUG FIX (2026-07-26, found live on EXAPVEVRK001): both tasks below used to run
    # unconditionally, regardless of whether the unattended-upgrades package was actually
    # installed. Some nodes deliberately don't have it (upgrades applied manually/on a
    # different schedule) -- that's a legitimate, intentional state, not something to
    # correct. 50unattended-upgrades has no create: true, so lineinfile hard-failed
    # outright ("does not exist") on a host without the package; 20auto-upgrades DOES have
    # create: true so it would have silently written periodic-timer config for a package
    # that isn't there to act on it -- same underlying problem, just a quieter symptom.
    # Robert's own framing: Puppet's require Package[...] dependency pattern. Ansible's
    # equivalent is package_facts (gathers ansible_facts.packages) + a when: gate -- both
    # tasks below now skip cleanly, not fail or misconfigure, when the package is absent.
    # -------------------------------------------------------------------------
    - name: Gather installed package facts
      ansible.builtin.package_facts:
        manager: apt

    # -------------------------------------------------------------------------
    # Ported 2026-07-21 while auditing a dropped-in Salt lintools.sls state,
    # which set the same 5 options Salt-side -- Robert's call to move it to
    # Ansible instead, since it's a one-time config file, not ongoing drift
    # Salt needs to keep correcting. Values (and the file itself) confirmed
    # against the real unattended-upgrades 2.12 package template
    # (/usr/share/unattended-upgrades/50unattended-upgrades) -- every line
    # below already exists there, commented out with "//"; each regexp
    # matches either the commented or already-uncommented form so this stays
    # idempotent across repeat runs and across a host that had it hand-edited
    # before. Automatic-Reboot's regexp requires a space right after the
    # option name specifically so it doesn't also match
    # Automatic-Reboot-Time/-WithUsers, which have "-" immediately after
    # instead of whitespace.
    #
    # NOTE: /etc/apt/apt.conf.d/50unattended-upgrades is a dpkg conffile --
    # editing it here means a future package upgrade may prompt to keep vs.
    # replace it (standard Debian conffile behaviour, not a bug in this task).
    # -------------------------------------------------------------------------
    - name: Configure unattended-upgrades (50unattended-upgrades)
      ansible.builtin.lineinfile:
        path:   /etc/apt/apt.conf.d/50unattended-upgrades
        regexp: "{{ item.regexp }}"
        line:   "{{ item.line }}"
        state:  present
      when: "'unattended-upgrades' in ansible_facts.packages"
      loop:
        - regexp: '^//?\s*Unattended-Upgrade::AutoFixInterruptedDpkg\s+".*'
          line:   'Unattended-Upgrade::AutoFixInterruptedDpkg "true";'
        - regexp: '^//?\s*Unattended-Upgrade::Remove-Unused-Kernel-Packages\s+".*'
          line:   'Unattended-Upgrade::Remove-Unused-Kernel-Packages "true";'
        - regexp: '^//?\s*Unattended-Upgrade::Remove-New-Unused-Dependencies\s+".*'
          line:   'Unattended-Upgrade::Remove-New-Unused-Dependencies "true";'
        - regexp: '^//?\s*Unattended-Upgrade::Automatic-Reboot\s+".*'
          line:   'Unattended-Upgrade::Automatic-Reboot "false";'
        - regexp: '^//?\s*Unattended-Upgrade::Automatic-Reboot-Time\s+".*'
          line:   'Unattended-Upgrade::Automatic-Reboot-Time "02:00";'
      loop_control:
        label: "{{ item.line }}"

    # -------------------------------------------------------------------------
    # 20auto-upgrades enables the periodic timer itself -- 50unattended-upgrades
    # above only controls behaviour once unattended-upgrades actually runs.
    # A plain `apt install unattended-upgrades` does NOT create this file (only
    # ships an inert template under /usr/share/unattended-upgrades/) -- found
    # 2026-07-21 double-checking the above against a real installed package,
    # after the fact. Without this, apt's systemd timer never fires
    # unattended-upgrade at all, making the whole 50unattended-upgrades config
    # a no-op on a fresh host. create: true since the file doesn't exist yet
    # on a fresh install; regexp still guards against a hand-edited host.
    # -------------------------------------------------------------------------
    - name: Configure unattended-upgrades (20auto-upgrades -- enables the periodic timer)
      ansible.builtin.lineinfile:
        path:   /etc/apt/apt.conf.d/20auto-upgrades
        regexp: "{{ item.regexp }}"
        line:   "{{ item.line }}"
        state:  present
        create: true
      when: "'unattended-upgrades' in ansible_facts.packages"
      loop:
        - regexp: '^//?\s*APT::Periodic::Update-Package-Lists\s+".*'
          line:   'APT::Periodic::Update-Package-Lists "1";'
        - regexp: '^//?\s*APT::Periodic::Unattended-Upgrade\s+".*'
          line:   'APT::Periodic::Unattended-Upgrade "1";'
      loop_control:
        label: "{{ item.line }}"

    # -------------------------------------------------------------------------
    # Login MOTD "N updates available" banner -- also ported 2026-07-21 from
    # the same dropped-in lintools.sls, which had this as a cron job (daily
    # apt-get upgrade --simulate, cached to a file) plus a script that just
    # cat'd that file. Live-computed instead here (Robert's call) -- no cron
    # job, no cached file, just a straight apt list --upgradable at login.
    # -------------------------------------------------------------------------
    - name: Deploy update-motd script
      ansible.builtin.copy:
        src:   files/update-motd
        dest:  /usr/local/bin/update-motd
        owner: root
        group: root
        mode:  '0755'

    # BUG FIX (2026-07-26, found live on EXAPVEVRK001, --check --diff): this task's src is
    # the file the preceding "Deploy update-motd script" task creates -- under --check that
    # copy is only simulated, never actually written, so on a host that's never had this
    # deployed before, ansible.builtin.file (state: link) checked the real filesystem for a
    # source that check mode never really created and failed loudly ("src file does not
    # exist"). Not a real failure and not something a retry or force=yes should paper over
    # -- it's an inherent limitation of dry-running two dependent tasks together, not a bug
    # in the tasks themselves. Skipping under check mode is the honest answer: this task's
    # precondition genuinely can't be evaluated without the previous task's real side
    # effect, so there's nothing meaningful to report either way. Still runs for real,
    # unchanged, on every normal apply.
    - name: Link update-motd into /etc/update-motd.d
      ansible.builtin.file:
        src:   /usr/local/bin/update-motd
        dest:  /etc/update-motd.d/98-update-status
        state: link
      when: not ansible_check_mode

    - name: Set default shell to zsh for ansible user
      user:
        name: ansible
        shell: /bin/zsh

    - name: Ensure /etc/example-music exists
      ansible.builtin.file:
        path:  /etc/example-music
        state: directory
        owner: root
        group: root
        mode:  '0755'

    - name: Deploy sites.csv to /etc/example-music
      ansible.builtin.copy:
        src:   "{{ sites_csv_src }}"
        dest:  /etc/example-music/sites.csv
        owner: root
        group: root
        mode:  '0644'

    - name: Deploy devices.csv to /etc/example-music
      ansible.builtin.copy:
        src:   "{{ devices_csv_src }}"
        dest:  /etc/example-music/devices.csv
        owner: root
        group: root
        mode:  '0644'

    # Added 2026-07-26 alongside create-vm.py's ROLE_CODES switching from a hardcoded dict
    # to loading role_codes.csv -- this is the Ansible-managed half of that fix's search
    # path (the other half is the pre-commit hook's bootstrap/web/proxmox/role_codes.csv
    # sync, for when create-vm.py is run standalone from the served copy instead).
    - name: Deploy role_codes.csv to /etc/example-music
      ansible.builtin.copy:
        src:   "{{ role_codes_csv_src }}"
        dest:  /etc/example-music/role_codes.csv
        owner: root
        group: root
        mode:  '0644'

    - name: Deploy address_policy.json to /etc/example-music
      ansible.builtin.copy:
        src:   "{{ address_policy_src }}"
        dest:  /etc/example-music/address_policy.json
        owner: root
        group: root
        mode:  '0644'

    - name: Deploy ad_forest.json to /etc/example-music
      ansible.builtin.copy:
        src:   "{{ ad_forest_src }}"
        dest:  /etc/example-music/ad_forest.json
        owner: root
        group: root
        mode:  '0644'

    - name: Deploy ad_groups.json to /etc/example-music
      ansible.builtin.copy:
        src:   "{{ ad_groups_src }}"
        dest:  /etc/example-music/ad_groups.json
        owner: root
        group: root
        mode:  '0644'

    - name: Deploy ad_users.json to /etc/example-music
      ansible.builtin.copy:
        src:   "{{ ad_users_src }}"
        dest:  /etc/example-music/ad_users.json
        owner: root
        group: root
        mode:  '0644'

    - name: Deploy ad_computers.json to /etc/example-music
      ansible.builtin.copy:
        src:   "{{ ad_computers_src }}"
        dest:  /etc/example-music/ad_computers.json
        owner: root
        group: root
        mode:  '0644'

    # -------------------------------------------------------------------------
    # nodeinfo.json — best-effort: needs an already-conformant EXA[ROLE][SITE][NNN]
    # hostname, which not every host reaches this playbook with (e.g. mid-bootstrap
    # via bootstrap-new-node.yml). Role-specific playbooks (proxmox/site.yml,
    # firewallme, rudder_server.yml) refresh this afterward with their own richer
    # role + extra fields — this just gives every properly-named Linux host a base
    # version, rather than leaving it entirely to the three role-specific ones.
    # -------------------------------------------------------------------------
    - name: Write /etc/example-music/nodeinfo.json (best-effort)
      block:
        - include_tasks: ../../tasks/hostname_facts.yml

        - name: Load sites.csv for nodeinfo enrichment
          ansible.builtin.read_csv:
            path: "{{ sites_csv_src }}"
          register: _tools_sites_raw
          delegate_to: localhost
          become: false

        - name: Look up this host's site row
          ansible.builtin.set_fact:
            _tools_site_row: "{{ _tools_sites_raw.list | selectattr('Site', 'equalto', host_site) | list | first | default({}) }}"

        - name: Resolve environment
          include_tasks: ../../tasks/nodeinfo_environment.yml

        - name: Write nodeinfo.json
          include_tasks: ../../tasks/nodeinfo.yml
          vars:
            nodeinfo_role: "{{ host_role | lower }}"
            nodeinfo_site: "{{ host_site }}"
            nodeinfo_city: "{{ _tools_site_row.City | default('') }}"
            nodeinfo_country: "{{ _tools_site_row.Country | default('') }}"
            nodeinfo_entity: "{{ _tools_site_row.Entity | default('') }}"
            nodeinfo_environment: "{{ resolved_environment }}"
            nodeinfo_bootstrapped_by: "linux/tools.yml"

        # nodeinfo.json now carries the environment (above), so the legacy
        # standalone file is redundant -- clean it up once it's confirmed
        # captured. Only reached on the success path (not rescue), so a host
        # that isn't EXA-conformant yet keeps its /etc/.environment until a
        # later run actually writes nodeinfo.json.
        - name: Remove legacy /etc/.environment (superseded by nodeinfo.json)
          ansible.builtin.file:
            path: /etc/.environment
            state: absent
      rescue:
        - name: nodeinfo.json skipped — hostname not yet EXA-convention
          ansible.builtin.debug:
            msg: >-
              Skipping nodeinfo.json for {{ inventory_hostname }} — hostname
              doesn't match EXA[ROLE][SITE][NNN] yet (expected for hosts still
              mid-bootstrap). Re-run once it's been renamed.

    # -------------------------------------------------------------------------
    # Optional user creation — runs before getent so new accounts are included
    # in the dotfile deployment loop below.
    # ansible.builtin.user with state: present is idempotent — existing accounts
    # are left untouched; only missing ones are created.
    # -------------------------------------------------------------------------
    - name: Create additional users if they do not exist
      ansible.builtin.user:
        name:        "{{ item }}"
        state:       present
        create_home: true
        shell:       /bin/zsh
      loop: "{{ extra_users }}"

    # getent runs after user creation so newly created accounts are included
    - name: Get user account database
      ansible.builtin.getent:
        database: passwd

    # -------------------------------------------------------------------------
    # Robert, 2026-07-26 (live --check --diff, EXAPVEVRK001): the dotfile-deploy tasks
    # below trust whatever /home/* accounts already exist on the live box -- a real account
    # (thesneak) got dotfiles maintained even though it was never typed into this run's
    # extra_users_input prompt, because it already existed from some earlier point.
    # Explicit call: keep that behaviour (don't restrict deployment to a known list), but
    # make it visible instead of silent -- warn on any /home/* account that isn't the
    # ansible user or in this run's extra_users, rather than quietly configuring it forever
    # with no one noticing it's there.
    # -------------------------------------------------------------------------
    - name: "Identify /home/* accounts not explicitly known to this playbook"
      ansible.builtin.set_fact:
        _unexpected_home_accounts: >-
          {%- set known = ['ansible'] + extra_users -%}
          {%- set result = [] -%}
          {%- for user, info in ansible_facts.getent_passwd.items() -%}
            {%- if info[4] is match('^/home/') and user not in known -%}
              {%- set _ = result.append(user) -%}
            {%- endif -%}
          {%- endfor -%}
          {{ result | join(', ') }}

    - name: "WARN — dotfiles will be maintained for account(s) not explicitly known to this playbook"
      ansible.builtin.debug:
        msg: >-
          {{ _c.Y }}[!]{{ _c.NC }} {{ _unexpected_home_accounts }} -- not the ansible user or
          in this run's extra_users_input, but has a /home/* homedir and will get dotfiles
          maintained (gitconfig/tmux.conf/vimrc/.vim/zshrc) the same as any known account.
          If this is a pre-existing, wanted account, no action needed. If it's unexpected,
          investigate before it's silently configured further.
      when: _unexpected_home_accounts | length > 0

    - name: Deploy .gitconfig to all user home directories
      ansible.builtin.copy:
        src:   files/gitconfig
        dest:  "{{ item.value[4] }}/.gitconfig"
        owner: "{{ item.key }}"
        group: "{{ item.key }}"
        mode:  '0644'
      loop: "{{ ansible_facts.getent_passwd | dict2items }}"
      when: item.value[4] is match('^/home/')
      loop_control:
        label: "{{ item.key }}"

    - name: Deploy .tmux.conf to all user home directories
      ansible.builtin.copy:
        src:   files/tmux.conf
        dest:  "{{ item.value[4] }}/.tmux.conf"
        owner: "{{ item.key }}"
        group: "{{ item.key }}"
        mode:  '0644'
      loop: "{{ ansible_facts.getent_passwd | dict2items }}"
      when: item.value[4] is match('^/home/')
      loop_control:
        label: "{{ item.key }}"

    - name: Deploy .vimrc to all user home directories
      ansible.builtin.copy:
        src:   files/vimrc
        dest:  "{{ item.value[4] }}/.vimrc"
        owner: "{{ item.key }}"
        group: "{{ item.key }}"
        mode:  '0644'
      loop: "{{ ansible_facts.getent_passwd | dict2items }}"
      when: item.value[4] is match('^/home/')
      loop_control:
        label: "{{ item.key }}"

    - name: Deploy .vim directory to all user home directories
      ansible.builtin.copy:
        src:            files/vim/
        dest:           "{{ item.value[4] }}/.vim/"
        owner:          "{{ item.key }}"
        group:          "{{ item.key }}"
        mode:           '0644'
        directory_mode: '0755'
      loop: "{{ ansible_facts.getent_passwd | dict2items }}"
      when: item.value[4] is match('^/home/')
      loop_control:
        label: "{{ item.key }}"

    - name: Deploy .zshrc to all user home directories
      ansible.builtin.copy:
        src:   files/zshrc
        dest:  "{{ item.value[4] }}/.zshrc"
        owner: "{{ item.key }}"
        group: "{{ item.key }}"
        mode:  '0644'
      loop: "{{ ansible_facts.getent_passwd | dict2items }}"
      when: item.value[4] is match('^/home/')
      loop_control:
        label: "{{ item.key }}"

    - name: Configure systemd-journald — vacuum period and max size
      ansible.builtin.lineinfile:
        path:   /etc/systemd/journald.conf
        regexp: "{{ item.regexp }}"
        line:   "{{ item.line }}"
        state:  present
      loop:
        - { regexp: '^#?MaxRetentionSec=', line: 'MaxRetentionSec=30day' }
        - { regexp: '^#?SystemMaxUse=',    line: 'SystemMaxUse=500M' }
      notify: Restart journald

  handlers:
    - name: Restart journald
      ansible.builtin.systemd:
        name:  systemd-journald
        state: restarted
