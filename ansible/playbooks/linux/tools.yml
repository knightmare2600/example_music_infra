---
# linux/tools.yml
# Deploy common tools, dotfiles, and optional user accounts to all Linux hosts.
#   ansible-playbook playbooks/linux/tools.yml -i configs/inventory
#
# Changelog:
#   2026-07-02  Add /etc/example-music deploy for sites.csv and devices.csv
#   2026-07-06  Add dotfile deployment (gitconfig, tmux, vim, zshrc)
#   2026-07-06  Add optional user creation via vars_prompt

- name: Deploy common tools
  hosts: all
  become: true

  vars_prompt:
    - name: extra_users_input
      prompt: "Usernames to create if missing, space-separated (leave blank to skip)"
      private: false
      default: ""

  vars_files:
    - ../../group_vars/all/main.yml

  vars:
    extra_users: "{{ extra_users_input.split() }}"
    sites_csv_src:   "{{ playbook_dir }}/../../../benarbejde/sites.csv"
    devices_csv_src: "{{ playbook_dir }}/../../../benarbejde/devices.csv"

  tasks:

    - name: Install common packages
      apt:
        name: "{{ common_packages }}"
        state: latest
        update_cache: true
        cache_valid_time: 3600

    - name: Set default shell to zsh for ansible user
      user:
        name: ansible
        shell: /bin/zsh

    - name: Ensure /etc/example-music exists
      ansible.builtin.file:
        path:  /etc/example-music
        state: directory
        owner: root
        group: root
        mode:  '0755'

    - name: Deploy sites.csv to /etc/example-music
      ansible.builtin.copy:
        src:   "{{ sites_csv_src }}"
        dest:  /etc/example-music/sites.csv
        owner: root
        group: root
        mode:  '0644'

    - name: Deploy devices.csv to /etc/example-music
      ansible.builtin.copy:
        src:   "{{ devices_csv_src }}"
        dest:  /etc/example-music/devices.csv
        owner: root
        group: root
        mode:  '0644'

    # -------------------------------------------------------------------------
    # Optional user creation — runs before getent so new accounts are included
    # in the dotfile deployment loop below.
    # ansible.builtin.user with state: present is idempotent — existing accounts
    # are left untouched; only missing ones are created.
    # -------------------------------------------------------------------------
    - name: Create additional users if they do not exist
      ansible.builtin.user:
        name:        "{{ item }}"
        state:       present
        create_home: true
        shell:       /bin/zsh
      loop: "{{ extra_users }}"

    # getent runs after user creation so newly created accounts are included
    - name: Get user account database
      ansible.builtin.getent:
        database: passwd

    - name: Deploy .gitconfig to all user home directories
      ansible.builtin.copy:
        src:   files/gitconfig
        dest:  "{{ item.value[4] }}/.gitconfig"
        owner: "{{ item.key }}"
        group: "{{ item.key }}"
        mode:  '0644'
      loop: "{{ ansible_facts.getent_passwd | dict2items }}"
      when: item.value[4] | regex_search('^/home/')
      loop_control:
        label: "{{ item.key }}"

    - name: Deploy .tmux.conf to all user home directories
      ansible.builtin.copy:
        src:   files/tmux.conf
        dest:  "{{ item.value[4] }}/.tmux.conf"
        owner: "{{ item.key }}"
        group: "{{ item.key }}"
        mode:  '0644'
      loop: "{{ ansible_facts.getent_passwd | dict2items }}"
      when: item.value[4] | regex_search('^/home/')
      loop_control:
        label: "{{ item.key }}"

    - name: Deploy .vimrc to all user home directories
      ansible.builtin.copy:
        src:   files/vimrc
        dest:  "{{ item.value[4] }}/.vimrc"
        owner: "{{ item.key }}"
        group: "{{ item.key }}"
        mode:  '0644'
      loop: "{{ ansible_facts.getent_passwd | dict2items }}"
      when: item.value[4] | regex_search('^/home/')
      loop_control:
        label: "{{ item.key }}"

    - name: Deploy .vim directory to all user home directories
      ansible.builtin.copy:
        src:            files/vim/
        dest:           "{{ item.value[4] }}/.vim/"
        owner:          "{{ item.key }}"
        group:          "{{ item.key }}"
        mode:           '0644'
        directory_mode: '0755'
      loop: "{{ ansible_facts.getent_passwd | dict2items }}"
      when: item.value[4] | regex_search('^/home/')
      loop_control:
        label: "{{ item.key }}"

    - name: Deploy .zshrc to all user home directories
      ansible.builtin.copy:
        src:   files/zshrc
        dest:  "{{ item.value[4] }}/.zshrc"
        owner: "{{ item.key }}"
        group: "{{ item.key }}"
        mode:  '0644'
      loop: "{{ ansible_facts.getent_passwd | dict2items }}"
      when: item.value[4] | regex_search('^/home/')
      loop_control:
        label: "{{ item.key }}"

    - name: Configure systemd-journald — vacuum period and max size
      ansible.builtin.lineinfile:
        path:   /etc/systemd/journald.conf
        regexp: "{{ item.regexp }}"
        line:   "{{ item.line }}"
        state:  present
      loop:
        - { regexp: '^#?MaxRetentionSec=', line: 'MaxRetentionSec=30day' }
        - { regexp: '^#?SystemMaxUse=',    line: 'SystemMaxUse=500M' }
      notify: Restart journald

  handlers:
    - name: Restart journald
      ansible.builtin.systemd:
        name:  systemd-journald
        state: restarted
