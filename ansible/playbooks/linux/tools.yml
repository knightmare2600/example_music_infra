---
# linux/tools.yml
# Deploy common tools to all Linux hosts.
#   ansible-playbook playbooks/linux/tools.yml -i configs/inventory
#
# Changelog:
#   2026-07-02  Add /etc/example-music deploy for sites.csv and devices.csv

- name: Deploy common tools
  hosts: all
  become: true
  vars_files:
    - ../../group_vars/all/main.yml

  vars:
    # Source paths on the Ansible control node (relative to this playbook's directory).
    # Reads from benarbejde/ — the shared data directory at the repo root.
    # benarbejde/ and bootstrap/web/proxmox/ copies are kept in sync by .githooks/pre-commit.
    sites_csv_src:   "{{ playbook_dir }}/../../../benarbejde/sites.csv"
    devices_csv_src: "{{ playbook_dir }}/../../../benarbejde/devices.csv"

  tasks:

    - name: Install common packages
      apt:
        name: "{{ common_packages }}"
        state: latest
        update_cache: true
        cache_valid_time: 3600

    - name: Set default shell to zsh for ansible user
      user:
        name: ansible
        shell: /bin/zsh

    - name: Ensure /etc/example-music exists
      ansible.builtin.file:
        path:  /etc/example-music
        state: directory
        owner: root
        group: root
        mode:  '0755'

    - name: Deploy sites.csv to /etc/example-music
      ansible.builtin.copy:
        src:   "{{ sites_csv_src }}"
        dest:  /etc/example-music/sites.csv
        owner: root
        group: root
        mode:  '0644'

    - name: Deploy devices.csv to /etc/example-music
      ansible.builtin.copy:
        src:   "{{ devices_csv_src }}"
        dest:  /etc/example-music/devices.csv
        owner: root
        group: root
        mode:  '0644'

    - name: Get user account database
      ansible.builtin.getent:
        database: passwd

    - name: Deploy .gitconfig to all user home directories
      ansible.builtin.copy:
        src:   files/gitconfig
        dest:  "{{ item.value[4] }}/.gitconfig"
        owner: "{{ item.key }}"
        group: "{{ item.key }}"
        mode:  '0644'
      loop: "{{ ansible_facts.getent_passwd | dict2items }}"
      when: item.value[4] | regex_search('^/home/')
      loop_control:
        label: "{{ item.key }}"

    - name: Deploy .tmux.conf to all user home directories
      ansible.builtin.copy:
        src:   files/tmux.conf
        dest:  "{{ item.value[4] }}/.tmux.conf"
        owner: "{{ item.key }}"
        group: "{{ item.key }}"
        mode:  '0644'
      loop: "{{ ansible_facts.getent_passwd | dict2items }}"
      when: item.value[4] | regex_search('^/home/')
      loop_control:
        label: "{{ item.key }}"

    - name: Deploy .vimrc to all user home directories
      ansible.builtin.copy:
        src:   files/vimrc
        dest:  "{{ item.value[4] }}/.vimrc"
        owner: "{{ item.key }}"
        group: "{{ item.key }}"
        mode:  '0644'
      loop: "{{ ansible_facts.getent_passwd | dict2items }}"
      when: item.value[4] | regex_search('^/home/')
      loop_control:
        label: "{{ item.key }}"

    - name: Deploy .vim directory to all user home directories
      ansible.builtin.copy:
        src:            files/vim/
        dest:           "{{ item.value[4] }}/.vim/"
        owner:          "{{ item.key }}"
        group:          "{{ item.key }}"
        mode:           '0644'
        directory_mode: '0755'
      loop: "{{ ansible_facts.getent_passwd | dict2items }}"
      when: item.value[4] | regex_search('^/home/')
      loop_control:
        label: "{{ item.key }}"

    - name: Configure systemd-journald — vacuum period and max size
      ansible.builtin.lineinfile:
        path:   /etc/systemd/journald.conf
        regexp: "{{ item.regexp }}"
        line:   "{{ item.line }}"
        state:  present
      loop:
        - { regexp: '^#?MaxRetentionSec=', line: 'MaxRetentionSec=30day' }
        - { regexp: '^#?SystemMaxUse=',    line: 'SystemMaxUse=500M' }
      notify: Restart journald

  handlers:
    - name: Restart journald
      ansible.builtin.systemd:
        name:  systemd-journald
        state: restarted

