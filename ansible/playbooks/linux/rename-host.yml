---
# =============================================================================
# playbooks/linux/rename-host.yml
# Example Music Limited — Rename a Linux host (hostname + LVM-on-root layout)
# =============================================================================
# One-shot, standalone playbook for correcting a Linux VM that was built or
# renamed incorrectly. Debian's installer names the root/swap LVM volume
# group after the hostname at install time — a wrong hostname usually means
# a wrong VG name too, and every place that references it (/etc/fstab,
# initramfs's resume config, initramfs itself, GRUB) needs updating together
# or the host can fail to boot.
#
# Deliberately NOT folded into linux/tools.yml (hosts: all, runs routinely)
# -- this touches live LVM/boot configuration and must only ever run when
# explicitly, deliberately invoked against one specific host.
#
# The actual VG/LV names are discovered live (findmnt on / and on active
# swap), not assumed to equal the old hostname -- this playbook renames
# whatever it actually finds backing root/swap, so it's correct even if a
# host's VG naming has already drifted from its hostname some other way.
#
# Live-tested against EXADNSCLD001->EXADNSVRK001 (2026-07-21) -- hostname and VG
# rename worked correctly; a real bug in swap detection (see changelog) left
# /etc/fstab partially stale on that run, fixed below. Still take a PVE
# snapshot of the target VM before running -- a mistake here can leave a host
# unable to boot (recoverable via rescue media, but avoidable). The order of
# operations below (vgrename while mounted is safe -- fstab/resume-config must
# be corrected before regenerating initramfs -- update-grub must run last,
# after fstab is correct) is confirmed via research (vgrename is a
# well-documented safe live operation; House of Brick's "Rename Root Volume
# Group" writeup and a Debian-specific "vgrename, fix fstab/grub,
# update-initramfs -c -k all" sequence).
#
# Usage (run from ansible/ root):
#   ansible-playbook -i configs/inventory playbooks/linux/rename-host.yml \
#     -e target=EXADNSCLD001 -e new_hostname=EXADNSVRK001
#
# Required vars:
#   target        -- inventory hostname to run against (however it's
#                     currently reachable/named in inventory)
#   new_hostname  -- the correct hostname to rename TO, UPPERCASE, no
#                     domain suffix -- this estate's hostnames are
#                     uppercase on the box itself (/etc/hostname,
#                     `hostname` command, VG name), not just in docs/
#                     inventory. Passed through as-typed -- not
#                     case-folded by this playbook.
#
# Tags: hostname, lvm, boot, reboot
#
# Changelog:
#   2026-07-21  Initial version. Built after a live host was found running
#               as EXADNSCLD001 when EXADNSVRK001 is the correct, settled
#               name (see bind9-dns.yml's own 2026-07-08 changelog entry --
#               this exact VRK-vs-CLD-branding question was already decided
#               once; the live host just doesn't match that decision).
#   2026-07-21  Hostname/hosts/VG tasks no longer lowercase new_hostname --
#               this estate's hostnames are uppercase on the box itself, not
#               just in docs/inventory naming. new_hostname is now used
#               exactly as given throughout.
#   2026-07-21  Fixed a real bug found on the first live run against
#               EXADNSVRK001: swap detection used `findmnt -t swap`, which
#               only sees swap that's currently active. This box's swap
#               wasn't active when the play ran, so swap detection silently
#               skipped, and /etc/fstab was left with a stale VG-name
#               reference on its swap line (root's line was also affected,
#               since the per-LV exact-match replace tasks were replaced by
#               a simpler whole-VG-prefix replace as part of this same fix --
#               see below). Swap is now detected by reading /etc/fstab
#               directly (configured, not just active). The fstab/resume-conf
#               replace tasks now match the whole "/dev/mapper/<VG>-" prefix
#               rather than an exact per-LV path, so every LV under a VG is
#               covered by one task instead of needing one exactly-matched
#               task per LV that can individually miss one. Also added a
#               cosmetic yellow highlight on "Current hostname" in the
#               summary display when it differs from new_hostname.
# =============================================================================

- name: Linux — Rename host (hostname + LVM volume group + boot config)
  hosts: "{{ target }}"
  become: true
  gather_facts: true

  vars:
    ad_forest_json_path: "/etc/example-music/ad_forest.json"

  tasks:

    - name: Fail if new_hostname not provided
      ansible.builtin.fail:
        msg: "{{ _c.R }}[ERROR]{{ _c.NC }} -e new_hostname=<name> is required."
      when: new_hostname is not defined or new_hostname | trim == ''
      tags: [hostname, lvm, boot, reboot]

    - name: Get current live hostname
      ansible.builtin.command: hostname
      register: _current_hostname
      changed_when: false
      tags: [hostname, lvm, boot, reboot]

    - name: Read ad_forest.json for domain_fqdn (control node)
      ansible.builtin.set_fact:
        _domain_fqdn: "{{ (lookup('file', ad_forest_json_path) | from_json).domain_fqdn }}"
      delegate_to: localhost
      become: false
      tags: [hostname, lvm, boot, reboot]

    - name: Find the device backing the root filesystem
      ansible.builtin.command: findmnt / -no SOURCE
      register: _root_source
      changed_when: false
      tags: [hostname, lvm, boot, reboot]

    - name: Find configured swap device from /etc/fstab (not just active swap)
      # NOT findmnt -t swap -- that only sees swap that's actually turned on right
      # now. A box whose swap wasn't active when this play ran (real case,
      # 2026-07-21) would silently skip all swap detection below, leaving its
      # fstab/resume-config swap line stale even though root's line got fixed.
      # /etc/fstab is what's actually configured, active or not.
      ansible.builtin.shell: awk '$3 == "swap" {print $1; exit}' /etc/fstab
      register: _swap_source
      changed_when: false
      tags: [hostname, lvm, boot, reboot]

    - name: Fail if root isn't on an LVM device-mapper path
      ansible.builtin.fail:
        msg: >-
          {{ _c.R }}[ERROR]{{ _c.NC }} / is not on a /dev/mapper/<vg>-<lv> path
          ({{ _root_source.stdout }}) -- this playbook only handles the
          LVM-on-root layout every VM in this estate uses. Investigate manually.
      when: "'/dev/mapper/' not in _root_source.stdout"
      tags: [hostname, lvm, boot, reboot]

    - name: Parse root VG/LV name from device-mapper path
      ansible.builtin.set_fact:
        _root_vg: "{{ _root_source.stdout | regex_replace('^/dev/mapper/([^-]+)-.+$', '\\1') }}"
        _root_lv: "{{ _root_source.stdout | regex_replace('^/dev/mapper/[^-]+-(.+)$', '\\1') }}"
      tags: [hostname, lvm, boot, reboot]

    - name: Parse swap VG/LV name (if swap is on LVM)
      ansible.builtin.set_fact:
        _swap_vg: "{{ _swap_source.stdout | regex_replace('^/dev/mapper/([^-]+)-.+$', '\\1') }}"
        _swap_lv: "{{ _swap_source.stdout | regex_replace('^/dev/mapper/[^-]+-(.+)$', '\\1') }}"
      when: _swap_source.stdout is defined and '/dev/mapper/' in _swap_source.stdout
      tags: [hostname, lvm, boot, reboot]

    - name: Set fact — VG already renamed (idempotency check)
      ansible.builtin.set_fact:
        _vg_already_correct: "{{ _root_vg == new_hostname }}"
      tags: [hostname, lvm, boot, reboot]

    # ── Summary + confirmation gate (matches firewallme role's own convention) ──

    - name: "[Summary] Display rename summary"
      # Deliberately a plain list, not a bordered box -- the box style used elsewhere in this
      # repo (e.g. firewallme's 00_preflight_5_confirm.yml) needs careful per-line padding
      # computation to keep its right-hand border aligned, which that same file's own
      # changelog records having to fix twice after real misalignment bugs. Not worth the
      # same risk for a single-purpose summary here.
      ansible.builtin.debug:
        msg:
          - "{{ _c.W }}== Host Rename Summary =={{ _c.NC }}"
          - "  Current hostname   : {{ (_c.Y if _current_hostname.stdout != new_hostname else _c.W) }}{{ _current_hostname.stdout }}{{ _c.NC }}"
          - "  New hostname       : {{ _c.G }}{{ new_hostname }}{{ _c.NC }}"
          - "  Root VG (found)    : {{ _c.W }}{{ _root_vg }}{{ _c.NC }} (LV: {{ _root_lv }})"
          - "  Swap VG (found)    : {{ _c.W }}{{ _swap_vg | default('none / not on LVM') }}{{ _c.NC }}{{ (' (LV: ' + _swap_lv + ')') if _swap_lv is defined else '' }}"
          - "  VG already correct : {{ (_c.G + 'yes -- LVM steps will be skipped') if _vg_already_correct else (_c.Y + 'no -- will rename') }}{{ _c.NC }}"
          - "{{ _c.Y }}[!]{{ _c.NC }} This touches live LVM + boot config (fstab, initramfs, GRUB)."
          - "{{ _c.Y }}[!]{{ _c.NC }} Take a PVE snapshot of this VM before continuing if you haven't."
      tags: [hostname, lvm, boot, reboot]

    - name: "[Summary] Operator confirmation"
      ansible.builtin.pause:
        prompt: |-

          {{ _c.Y }}[!]{{ _c.NC }} Review the summary above carefully. Nothing has been written yet.

          Press {{ _c.G }}Enter{{ _c.NC }} to apply all changes, or type {{ _c.R }}no{{ _c.NC }} to abort
      register: _rename_confirm
      tags: [hostname, lvm, boot, reboot]

    - name: "[Summary] ABORT — operator did not confirm"
      ansible.builtin.fail:
        msg: "{{ _c.R }}[ERROR]{{ _c.NC }} Aborted by operator."
      when: _rename_confirm.user_input | trim | lower in ['n', 'no']
      tags: [hostname, lvm, boot, reboot]

    # ── Hostname + /etc/hosts ────────────────────────────────────────────────
    # NOTE: this estate's hostnames are uppercase on the box itself, unlike
    # bootstrap-new-node.yml's `target_hostname | lower` pattern -- deliberately
    # NOT reused here. new_hostname is used exactly as given, no case-folding.

    - name: Write /etc/hostname
      ansible.builtin.copy:
        dest: /etc/hostname
        mode: "0644"
        content: "{{ new_hostname }}\n"
      tags: hostname

    - name: Update /etc/hosts — remove stale 127.0.1.1 line
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s'
        state: absent
      tags: hostname

    - name: Update /etc/hosts — add fresh 127.0.1.1 line
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "127.0.1.1\t{{ new_hostname }}.{{ _domain_fqdn }}\t{{ new_hostname }}"
        insertafter: EOF
      tags: hostname

    - name: Apply hostname to the running system
      ansible.builtin.hostname:
        name: "{{ new_hostname }}"
      tags: hostname

    # ── LVM rename + dependent boot config — skipped entirely if already correct ──

    - name: Rename root volume group
      ansible.builtin.command: "vgrename {{ _root_vg }} {{ new_hostname }}"
      when: not _vg_already_correct
      tags: lvm

    - name: Rename swap volume group (only if it's a different VG from root)
      ansible.builtin.command: "vgrename {{ _swap_vg }} {{ new_hostname }}"
      when:
        - not _vg_already_correct
        - _swap_vg is defined
        - _swap_vg != _root_vg
      tags: lvm

    # Replacing the whole "/dev/mapper/<VG>-" prefix (not each LV path individually)
    # covers every LV under that VG in one task -- root, swap, and anything else --
    # rather than needing a separate, exactly-matched task per LV that can silently
    # miss one (the LV-by-LV approach is what missed swap's fstab line in the real
    # 2026-07-21 test, since swap detection itself had failed upstream).
    - name: Update /etc/fstab — root VG's device-mapper prefix (covers every LV under it)
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: "/dev/mapper/{{ _root_vg }}-"
        replace: "/dev/mapper/{{ new_hostname }}-"
      when: not _vg_already_correct
      tags: [lvm, boot]

    - name: Update /etc/fstab — swap VG's device-mapper prefix (only if swap is on a separate VG)
      ansible.builtin.replace:
        path: /etc/fstab
        regexp: "/dev/mapper/{{ _swap_vg }}-"
        replace: "/dev/mapper/{{ new_hostname }}-"
      when:
        - not _vg_already_correct
        - _swap_vg is defined
        - _swap_vg != _root_vg
      tags: [lvm, boot]

    - name: Check for initramfs resume config
      ansible.builtin.stat:
        path: /etc/initramfs-tools/conf.d/resume
      register: _resume_conf
      tags: [lvm, boot]

    - name: Update initramfs resume config — root VG's device-mapper prefix
      ansible.builtin.replace:
        path: /etc/initramfs-tools/conf.d/resume
        regexp: "/dev/mapper/{{ _root_vg }}-"
        replace: "/dev/mapper/{{ new_hostname }}-"
      when:
        - not _vg_already_correct
        - _resume_conf.stat.exists
      tags: [lvm, boot]

    - name: Update initramfs resume config — swap VG's device-mapper prefix (only if separate from root)
      ansible.builtin.replace:
        path: /etc/initramfs-tools/conf.d/resume
        regexp: "/dev/mapper/{{ _swap_vg }}-"
        replace: "/dev/mapper/{{ new_hostname }}-"
      when:
        - not _vg_already_correct
        - _swap_vg is defined
        - _swap_vg != _root_vg
        - _resume_conf.stat.exists
      tags: [lvm, boot]

    - name: Regenerate initramfs for all installed kernels
      ansible.builtin.command: update-initramfs -c -k all
      when: not _vg_already_correct
      changed_when: true
      tags: boot

    - name: Regenerate GRUB configuration
      ansible.builtin.command: update-grub
      when: not _vg_already_correct
      changed_when: true
      tags: boot

    # ── Reboot to verify (same "ask now, act at the end" pattern as firewallme) ──

    - name: "[Reboot] Prompt for reboot"
      ansible.builtin.pause:
        prompt: |-

          {{ _c.Y }}[!]{{ _c.NC }} A reboot is strongly recommended now, to confirm the renamed VG
          {{ _c.Y }}[!]{{ _c.NC }} actually boots cleanly under supervision -- rather than finding out
          {{ _c.Y }}[!]{{ _c.NC }} at some later, unattended reboot. This runs at the end of this play
          {{ _c.Y }}[!]{{ _c.NC }} if you say yes here -- you won't be asked again.

          Reboot now to verify? [y/N]
      register: _reboot_prompt
      when: not _vg_already_correct
      tags: reboot

    - name: Reboot
      ansible.builtin.reboot:
        reboot_timeout: 300
      when:
        - not _vg_already_correct
        - _reboot_prompt.user_input | default('n') | lower | trim == 'y'
      tags: reboot

    - name: "[Summary] Done"
      ansible.builtin.debug:
        msg:
          - "{{ _c.G }}[+]{{ _c.NC }} {{ _current_hostname.stdout }} -> {{ new_hostname }} complete."
          - "{{ _c.Y }}[!]{{ _c.NC }} If you skipped the reboot, verify manually before trusting this fully."
      tags: [hostname, lvm, boot, reboot]
