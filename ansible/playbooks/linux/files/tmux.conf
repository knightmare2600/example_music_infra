## Rab's tmux configuration file.  This is basically making tmux act like
## terminator. I've never liked screen, it's too much like EMACS.... i.e.
## annoying.  tmux is more elegant.
##
## One annoyance is that tmux DOESN'T read in .bashrc. Add: source ~/.bashrc to
## your .bash_profile to fix.
##
################################################################################
#                                                                              #
# Created: 07/11/2012 v0.50 robertmc    Initial config bind | & - to split     #
# Updated: 08/11/2012 v0.60 robertmc    Updated to emboss current term and add #
#                                       pretty statusbar                       #
# Updated: 08/11/2012 v0.70 robertmc    Better visuals (256 Colours mode)      #
# Updated: 13/11/2012 v0.80 robertmc    Use ^B + - to zoom in/out. Split hori- #
#                                       zontal now uses _ (underscore)         #
# Updated: 13/11/2012 v0.90 robertmc    Tidy comments put stanzas together     #
# Updated: 13/11/2012 v0.91 robertmc    Scroll buffer, mouse control & drop    #
#                                       escape timeout                         #
# Updated: 13/11/2012 v0.92 robertmc    Drop mouse pane selects for scroll     #
# Updated: 13/11/2012 v0.93 robertmc    Give disabled but useful options       #
# Updated: 13/11/2012 v0.94 robertmc    Statusbar: Add uptime remove total     #
#                                       procs. Comment out example status      #
# Updated: 26/03/2015 v0.95 robertmc    force shell, start at 1, up/down speed #
#                                       in statusbar                           #
# Updated: 30/03/2015 v0.96 robertmc    Stop window resizes on smallest client #
# Updated: 01/04/2015 v0.97 robertmc    Zoon by 5% using U D L or R, i& META+A #
#                                       (all) to enable typing in all windows  #
#                                                                              #
# Current Hotkeys:                                                             #
#  CTRL + B       Main META Key. Use this before issuing a tmux command        #
#  META + @       Reload ~/.tmux.conf configuration file                       #
#  META + l       Lock Session (Requires vlock/cmatrix/etc to be installed)    #
#  META + |       Vertically split the window                                  #
#  META + _       Horizontally split the window (Underscore)                   #
#  META + +       Zoon into active pane (Plus Sign)                            #
#  META + -       Zoom out active pane (Hyphen)                                #
#  META + L       Increase/reduce left size of pane by 5%                      #
#  META + R       Increase/redcue right size of pane by 5%                     #
#  META + U       Increase/ireduce top size of pane by 5%                      #
#  META + D       Increase/redcue bottom size of pane by 5%                    #
#  META + A       Enable typing in all panes at once                           #
#  META + Z       Disable typing in all panes at once                          #
#  META + <arrow> Move around panes                                            #
#                                                                              #
# Sharing sessions on tmux 3.3+                                                #
#   :server-access -w -a thesneak                                              #
################################################################################

## Reload ~/.tmux.conf using ^B + R You will thank me for this when you make
## minor tweaks to the config
bind @ source-file ~/.tmux.conf \; display-message "tmux.conf reloaded!"

## time in ms to display messages so I can actually read them (2600) 8-)
set-option -g display-time 2600

## Split windows using  META + | (pipe) or - (hyphen) which is more natural.
## May change this to o (hOrizontal) & e (vErtical) a la terminator in future...
unbind %
bind | split-window -h
bind _ split-window -v

# Explicitly define shell
set -g default-command /bin/bash
set -g default-shell /bin/bash

## Window Border makes it easier to see. Gives a red/white/red embossed border
## around the *active* terminal
#set-option -g pane-active-border-fg white
#set-option -g pane-active-border-bg red

# tmux resizes windows to the smallest client. Turn it off
setw -g aggressive-resize on

## Let's keep Terminator's ALT + <ARROW KEY> to switch panes
#bind -n M-Left select-pane -L
#bind -n M-Right select-pane -R
#bind -n M-Up select-pane -U
#bind -n M-Down select-pane -D

## Let's allow panes to "maximise" and then restore with + -
unbind +
bind + new-window -d -n tmux-zoom '' \; swap-pane -s tmux-zoom.0 \; select-window -t tmux-zoom
unbind -
bind - last-window \; swap-pane -s tmux-zoom.0 \; kill-window -t tmux-zoom

## Zoon by 5% when using U D L or R
bind-key U resize-pane -U 5
bind-key D resize-pane -D 5
bind-key L resize-pane -L 5
bind-key R resize-pane -R 5

## Use <Meta>+A to enable asynchronis mode (typing in all windows at once)
## and <Meta>+Z to turn it off
bind-key A setw synchronize-panes on
bind-key Z setw synchronize-panes off

## Let's allow use of rodents to click panes
##set-option -g mouse-select-pane on

## Scrolling breaks with the above on. Use ^B <arrow key> to scroll panes.
set-option -g mouse-select-pane off
#set-option -g mouse-resize-pane off
#set-option -g mouse-select-window off
#set-window-option -g mode-mouse off

## Lock screen manually with Win Key + L, and automatically afterrun cmatrix in
## blue font. Do remember to follow the white rabbit...
unbind l
bind l lock-server
set -g lock-command "cmatrix -s -b -C blue"
set -g lock-after-time 600
set -g lock-server on

## Make mouse useful in copy mode
##set -g mode-mouse on

## Permits using page up/page down when scrolling screen
set -g terminal-overrides 'xterm*:smcup@:rmcup@'

# start window indexing at one instead of zero
set -g base-index 1

## Set terminal to 256 colours mode which makes colours better on the eyes.
set -g default-terminal "screen-256color"

## Lower escape time to 50ms for quicker response to scroll-buffer access.
#set -s escape-time 50

# Scroll History. Set to a ridiculously high number do to nature of my work.
set -g history-limit 100000

## Needed for battery status bar indicator
run-shell ~/.tmux/battery.tmux

## Status bar. Gives you output like this:
##
## $hostname  $WindowList                    $LoadAverage  $uptime  $Date  $Time
##
## The scripts for this can be found at http://crunchbang.org/forums/viewtopic.php?pid=294934#p294934
#set -g status-left ' #[fg=white,bold]#(hostname -f)#[default] #[fg=brightpink]#(tmux_upspeed)/#(tmux_downspeed)'
set -g status-left ' #[fg=white,bold]#(hostname -f)#[default]'
##set -g status-left ' #[fg=white,bold]#H#[default]'
set -g status-right '#[fg=yellow,bold]#(cut -d " " -f 1-3 /proc/loadavg) #[fg=red,bold]#(uptime | #{battery_status_bg} Batt: #{battery_icon} #{battery_percentage} #{battery_remain} | cut -d " " -f 4-5 | tr -d ',') #[default]#[fg=cyan,bold]%d %b %Y %H:%M:%S#[default] '

## Global statusbar colours for all sections
set -g status-fg green
set -g status-bg black
set -g status-interval 1

## Staus bar lengths
set -g status-left-length 40
set -g status-right-length 50

## Enable notifications in other windows when something goes off
setw -g monitor-activity on
#setw -g visual-activity on

## Enable current window status to be a different colour
set-window-option -g window-status-current-bg red
set-window-option -g window-status-current-fg white

## Auto rename windows based on command inside it
set -g automatic-rename

# start window indexing at one (default = 0)
set -g base-index 1

# Force bash usage
set-option -g default-shell /bin/bash

# window title
set-option -g set-titles on
set-option -g set-titles-string '#H:#S.#I.#P #W #T' # window number,program name, active(or not)

## Log command. Useful for writing a process later on...
#bind-key P command-prompt -p 'save history to filename:' -I '~/tmux.history' 'capture-pane -S -32768 ; save-buffer %1 ; delete-buffer'

## easter egg... <Meta>+E
bind-key E display-message "I... I don't even see the code... All I see is blonde, brunette, red-head..."
