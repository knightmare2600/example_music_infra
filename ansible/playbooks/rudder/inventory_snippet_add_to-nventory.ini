# =============================================================================
# configs/inventory — Rudder groups
# Add these stanzas to your existing inventory file.
# =============================================================================

# --- Rudder server(s) --------------------------------------------------------
# The root Rudder server. Currently one node; the playbook supports multiple
# if you ever run a second root server (unlikely — Rudder is single-root).
[rudder_servers]
EXARUDCLD001  ansible_host=192.168.69.12  ansible_connection=ssh  # CLD Rudder server

# --- Rudder relays -----------------------------------------------------------
# Hub relay nodes. Each relay serves agents at its regional sites.
# Install with: ansible-playbook playbooks/rudder/rudder_relay.yml
[rudder_relays]
# EXASRVODE004  ansible_host=192.168.76.12   ansible_connection=ssh  # ODE EU relay (future)
# EXASRVODE004  ansible_host=192.168.126.12  ansible_connection=ssh  # ODE EU relay (future)
# EXASRVBRK004  ansible_host=192.168.136.12  ansible_connection=ssh  # BRK NA relay (future)

# --- Rudder meta-group -------------------------------------------------------
[rudder:children]
rudder_servers
rudder_relays
