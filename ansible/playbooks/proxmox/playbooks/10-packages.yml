---
# =============================================================================
# playbooks/10-packages.yml
# Example Music Limited — Proxmox VE node: management packages
# =============================================================================
# Fixes the apt repos (disables the paid pve-enterprise/ceph repos, adds the
# no-subscription repo), removes the web-UI subscription nag, installs/
# upgrades pve_packages (group_vars/pvenodes/main.yml), and installs
# open-vm-tools if the node is a VMware guest. Safe to run on an
# already-onboarded node — apt install/upgrade of these specific packages
# (none are core PVE services: pve-cluster, corosync, qemu, etc. are never
# touched here) doesn't affect running VMs.
#
# Usage:
#   ansible-playbook -i configs/inventory playbooks/proxmox/playbooks/10-packages.yml
#
# Tags: packages
# =============================================================================
# Changelog:
#   2026-07-14  Added a heads-up debug message before "Install management packages" --
#               a real run against EXAPVEGOT001 took ~9 minutes on this one task alone
#               (apt cache refresh + package install/upgrade), long enough that an
#               operator watching the console with no progress output could reasonably
#               assume it had hung and Ctrl-C. No functional change, message only.
#   2026-07-12  Added GRUB serial console config (console=ttyS0,115200n8,
#               GRUB_TERMINAL="serial console", 30s timeout), matching
#               EXAPVECLD001's real, hand-cut /etc/default/grub -- per
#               Robert's explicit ask, done as targeted lineinfile edits
#               against the specific lines, not a template/copy of the
#               whole file, so any other hand customisation to this file
#               survives a run. update-grub only runs if something actually
#               changed; no automatic reboot (this stage runs routinely
#               against already-onboarded, potentially live nodes) -- the
#               new console/timeout config takes effect on next reboot.
#   2026-07-06  Initial file — extracted from pve_onboard.yml as part of the
#               numbered-stage split (see 00-preflight.yml). Always runs,
#               even on a refresh-only pass against an already-onboarded node.
#   2026-07-10  Added apt repo fixing, subscription-nag removal, and VMware
#               guest-tools detection — moved from first-boot.sh, which now
#               only does enough for the ansible user to be SSH-reachable.
# =============================================================================

- name: Proxmox VE — Management packages
  hosts: "{{ target | default('pvenodes') }}"
  become: true

  tasks:

    # ── Repo fixing ────────────────────────────────────────────────────────

    - name: Check for pve-enterprise/ceph .list repos (legacy format)
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/apt/sources.list.d/pve-enterprise.list
        - /etc/apt/sources.list.d/ceph.list
      register: pve_repo_list_check
      tags: packages

    - name: Disable pve-enterprise/ceph .list repos (legacy format)
      ansible.builtin.replace:
        path: "{{ item.item }}"
        regexp: '^deb '
        replace: '#deb '
      loop: "{{ pve_repo_list_check.results }}"
      when: item.stat.exists
      tags: packages

    - name: Check for DEB822 pve-enterprise/ceph .sources repos (PVE 9)
      ansible.builtin.stat:
        path: "{{ item }}"
      loop:
        - /etc/apt/sources.list.d/pve-enterprise.sources
        - /etc/apt/sources.list.d/ceph.sources
      register: pve_repo_sources_check
      tags: packages

    - name: Disable DEB822 pve-enterprise/ceph .sources repos
      ansible.builtin.command:
        cmd: "mv {{ item.item }} {{ item.item }}.disabled"
      loop: "{{ pve_repo_sources_check.results }}"
      when: item.stat.exists
      tags: packages

    - name: Add Proxmox no-subscription repo
      ansible.builtin.copy:
        content: |
          # Proxmox VE no-subscription repository - added by Ansible (10-packages.yml)
          deb http://download.proxmox.com/debian/pve trixie pve-no-subscription
        dest: /etc/apt/sources.list.d/pve-no-subscription.list
        owner: root
        group: root
        mode: '0644'
      tags: packages

    # ── Subscription nag removal ──────────────────────────────────────────

    - name: Check proxmoxlib.js for subscription nag
      ansible.builtin.command:
        cmd: grep -q 'Ext.Msg.show({' /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
      register: pve_nag_check
      changed_when: false
      failed_when: false
      tags: packages

    - name: Patch proxmoxlib.js to remove subscription nag
      ansible.builtin.replace:
        path: /usr/share/javascript/proxmox-widget-toolkit/proxmoxlib.js
        regexp: 'Ext\.Msg\.show\(\{'
        replace: 'void({'
        backup: true
      register: pve_nag_patch
      when: pve_nag_check.rc == 0
      tags: packages

    - name: Restart pveproxy (nag patch applied)
      ansible.builtin.systemd:
        name: pveproxy
        state: restarted
      when: pve_nag_patch.changed | default(false)
      tags: packages

    # ── Packages ───────────────────────────────────────────────────────────

    - name: "[packages] Note — this step can easily take 10+ minutes"
      ansible.builtin.debug:
        msg: >-
          Installing/upgrading {{ pve_packages | length }} package(s), with an apt cache
          refresh first -- on a fresh node, or after a while since the last run, this
          routinely takes 10 minutes or more (confirmed live, EXAPVEGOT001: ~9 minutes).
          Nothing has hung -- let it finish rather than interrupting the run.
      tags: packages

    - name: Install management packages
      ansible.builtin.apt:
        name: "{{ pve_packages }}"
        update_cache: true
        cache_valid_time: 3600
        state: latest
      tags: packages

    # ── VMware guest tools ─────────────────────────────────────────────────

    - name: Detect virtualisation type
      ansible.builtin.command:
        cmd: systemd-detect-virt
      register: pve_virt_type
      changed_when: false
      failed_when: false
      tags: packages

    - name: Install open-vm-tools (VMware guest only)
      ansible.builtin.apt:
        name: open-vm-tools
        state: present
      when: pve_virt_type.stdout | default('') == 'vmware'
      tags: packages

    - name: Enable open-vm-tools (VMware guest only)
      ansible.builtin.systemd:
        name: open-vm-tools
        enabled: true
        state: started
      when: pve_virt_type.stdout | default('') == 'vmware'
      tags: packages

    # ── GRUB serial console ───────────────────────────────────────────────
    # Matches EXAPVECLD001's real, hand-cut /etc/default/grub (Robert,
    # 2026-07-12) -- targeted line edits against the specific keys, not a
    # wholesale file replace, so this stays safe to re-run against a node
    # that's had further manual customisation since.

    - name: "[grub-serial] Set GRUB_TIMEOUT=30"
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_TIMEOUT='
        line: 'GRUB_TIMEOUT=30'
      register: pve_grub_timeout
      tags: packages

    - name: "[grub-serial] Add serial console to GRUB_CMDLINE_LINUX_DEFAULT"
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_CMDLINE_LINUX_DEFAULT="console=ttyS0,115200n8 console=tty0"$'
        insertafter: '^#?GRUB_CMDLINE_LINUX_DEFAULT='
        line: 'GRUB_CMDLINE_LINUX_DEFAULT="console=ttyS0,115200n8 console=tty0"'
      register: pve_grub_cmdline_default
      tags: packages

    - name: "[grub-serial] Add GRUB_SERIAL_COMMAND"
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_SERIAL_COMMAND="serial --speed 115200 --unit=1 --word=8 --parity=no --stop=1"$'
        insertafter: '^GRUB_CMDLINE_LINUX=""$'
        line: 'GRUB_SERIAL_COMMAND="serial --speed 115200 --unit=1 --word=8 --parity=no --stop=1"'
      register: pve_grub_serial_command
      tags: packages

    - name: '[grub-serial] Add GRUB_TERMINAL="serial console"'
      ansible.builtin.lineinfile:
        path: /etc/default/grub
        regexp: '^GRUB_TERMINAL="serial console"$'
        insertafter: '^#GRUB_TERMINAL=console$'
        line: 'GRUB_TERMINAL="serial console"'
      register: pve_grub_terminal
      tags: packages

    - name: "[grub-serial] Run update-grub (grub config changed)"
      ansible.builtin.command: update-grub
      when: >-
        pve_grub_timeout.changed
        or pve_grub_cmdline_default.changed
        or pve_grub_serial_command.changed
        or pve_grub_terminal.changed
      tags: packages

    - name: "[grub-serial] Note — reboot required for new console/timeout settings to take effect"
      ansible.builtin.debug:
        msg: >-
          GRUB serial console/timeout config updated and update-grub run --
          this takes effect on next reboot. Not rebooting automatically here
          (this stage also runs routinely against already-onboarded, live
          nodes) -- reboot at a time of your choosing.
      when: >-
        pve_grub_timeout.changed
        or pve_grub_cmdline_default.changed
        or pve_grub_serial_command.changed
        or pve_grub_terminal.changed
      tags: packages
