---
# =============================================================================
# playbooks/00-preflight.yml
# Example Music Limited — Proxmox VE node preflight
# =============================================================================
# Resolves this node's site (from its hostname, e.g. EXAPVEFAL001 -> FAL) and
# looks up that site's city/country/entity from sites.csv, for enrichment of
# nodeinfo.json in 30-example-music.yml.
#
# Also detects whether this node has already been through the access-setup
# stage (20-ansible-access.yml) before, by checking for
# /etc/example-music/nodeinfo.json (tasks/onboarded_check.yml — see that
# file for why this isn't /etc/sudoers.d/ansible any more). This decides
# which stages the rest of the chain runs:
#
#   First-ever onboarding (nodeinfo.json absent):
#     Every stage runs — packages, access setup, example-music, scripts,
#     systemd units.
#
#   Already onboarded (nodeinfo.json present and valid):
#     Only the stages that cannot break a running hypervisor run by
#     default: packages, example-music, scripts. Access setup (user/SSH
#     key/sudoers/kvm group) and systemd units (daemon-reload, timer
#     enable/start, Zabbix agent restart) are SKIPPED, since those touch
#     live state — re-run them only if you explicitly want to, via:
#       -e pve_force_full_onboard=true
#
# sites.csv is read from benarbejde/ (the git checkout on the control
# node) — the same authoritative source playbooks/linux/tools.yml deploys
# from — not from an already-deployed /etc/example-music/ copy, so this
# always reflects the latest committed site data even if the target node
# (or the control node itself) hasn't been refreshed recently.
#
# Usage:
#   ansible-playbook -i configs/inventory playbooks/proxmox/playbooks/00-preflight.yml
#
# Tags: preflight
# =============================================================================
# Changelog:
#   2026-07-06  Initial file — part of the pve_onboard.yml -> numbered-stage
#               split (00-preflight, 10-packages, 20-ansible-access,
#               30-example-music, 40-scripts, 50-systemd-units), matching
#               the 00-preflight/major-step-of-10 convention used by
#               windows_dc/windows_bootstrap/windows_hygiene. Added so a
#               refresh run on an already-onboarded node can safely skip
#               the stages that touch live state, without an operator
#               having to remember which tags are safe by hand.
#   2026-07-10  Added environment detection (moved from first-boot.sh) and a
#               single-disk ZFS rpool check (moved from first-boot.sh's
#               console "type I UNDERSTAND" gate; converted to an explicit
#               -e pve_acknowledge_single_disk=true override, matching the
#               bootstrap_force/pve_force_full_onboard pattern already used
#               elsewhere in this playbook chain, for an auditable
#               non-interactive run instead of a console-only prompt).
#   2026-07-10  Environment detection reworked, same day as above: dropped
#               the standalone /etc/.environment file entirely in favour of
#               ansible/tasks/nodeinfo_environment.yml, which reads the
#               environment straight from an already-deployed nodeinfo.json
#               if present. /etc/.environment's only real consumer anywhere
#               in the estate was nodeinfo.json's own `environment` field —
#               same cleanup applied to firewallme's 00_preflight.yml,
#               bind9-dns.yml, and rudder_server.yml.
#   2026-07-12  "Already onboarded" detection moved from /etc/sudoers.d/ansible
#               to /etc/example-music/nodeinfo.json (tasks/onboarded_check.yml).
#               Real bug, found before it could actually bite: first-boot.sh's
#               ansible-bootstrap sliver writes /etc/sudoers.d/ansible on every
#               node as part of getting Ansible a foot in the door — meaning
#               this check would have read "already onboarded" on every
#               genuinely fresh node, immediately after first-boot.sh ran,
#               before site.yml ever touched it. nodeinfo.json is only ever
#               written from within a full site.yml-family run and
#               first-boot.sh never touches /etc/example-music/ at all, so
#               there's no equivalent collision. Robert's call to fix this
#               before running bootstrap-new-node.yml against real hardware
#               for the first time, rather than find out live.
# =============================================================================

- name: Proxmox VE — Preflight (site lookup, onboarding-state detection)
  hosts: "{{ target | default('pvenodes') }}"
  become: true
  gather_facts: true

  vars:
    sites_csv_src: "{{ playbook_dir }}/../../../../benarbejde/sites.csv"

  tasks:

    - name: Include hostname facts
      include_tasks: ../../../tasks/hostname_facts.yml
      tags: preflight

    - name: Load sites.csv
      read_csv:
        path: "{{ sites_csv_src }}"
      register: pve_sites_raw
      delegate_to: localhost
      become: false
      run_once: true
      tags: preflight

    - name: Look up this node's site row
      set_fact:
        pve_site_row: "{{ pve_sites_raw.list | selectattr('Site', 'equalto', host_site) | list | first | default({}) }}"
      tags: preflight

    - name: WARN — site code not found in sites.csv
      debug:
        msg: >
          host_site='{{ host_site }}' (parsed from hostname
          '{{ inventory_hostname }}') was not found in sites.csv.
          nodeinfo.json city/country/entity fields will be blank.
      when: pve_site_row == {}
      tags: preflight

    - name: Set site enrichment facts
      set_fact:
        pve_city:   "{{ pve_site_row.City | default('') }}"
        pve_country: "{{ pve_site_row.Country | default('') }}"
        pve_entity: "{{ pve_site_row.Entity | default('') }}"
      tags: preflight

    - name: Check whether this node has already been onboarded
      include_tasks: ../../../tasks/onboarded_check.yml
      tags: preflight

    - name: Set pve_onboarded fact
      set_fact:
        pve_onboarded: "{{ node_onboarded }}"
      tags: preflight

    - name: Set pve_run_full_onboard fact
      set_fact:
        pve_run_full_onboard: "{{ (not pve_onboarded) or (pve_force_full_onboard | default(false) | bool) }}"
      tags: preflight

    - name: Show preflight summary
      debug:
        msg:
          - "Host          : {{ inventory_hostname }} (site={{ host_site }})"
          - "Site data     : city={{ pve_city }} country={{ pve_country }} entity={{ pve_entity }}"
          - "Already onboarded : {{ pve_onboarded }}"
          - "Full onboard run  : {{ pve_run_full_onboard }} {{ '(forced via pve_force_full_onboard)' if pve_onboarded and pve_run_full_onboard else '' }}"
          - "{{ 'Access-setup and systemd-units stages will be SKIPPED this run — pass -e pve_force_full_onboard=true to force them.' if not pve_run_full_onboard else '' }}"
      tags: preflight

    # ── Environment detection ──────────────────────────────────────────────
    # Resolved from an already-deployed nodeinfo.json if present, else
    # prompted -- see ansible/tasks/nodeinfo_environment.yml (replaced the
    # old standalone /etc/.environment file 2026-07-10, same day it was
    # added here, once it became clear every consumer of that file across
    # the estate only ever used it to seed this one nodeinfo.json field).

    - name: "[Preflight] Resolve environment"
      ansible.builtin.include_tasks: ../../../tasks/nodeinfo_environment.yml
      tags: preflight

    - name: "[Preflight] Set pve_environment"
      ansible.builtin.set_fact:
        pve_environment: "{{ resolved_environment }}"
      tags: preflight

    # ── Single-disk ZFS check ───────────────────────────────────────────────
    # Moved from first-boot.sh 2026-07-10. Was a console "type I UNDERSTAND"
    # gate; converted to an explicit override flag so a run against a
    # known-single-disk node (e.g. awaiting a second disk on order) can be
    # acknowledged non-interactively and auditably, matching
    # bootstrap_force/pve_force_full_onboard elsewhere in this chain.

    - name: "[Preflight] Count ONLINE vdevs in rpool"
      ansible.builtin.shell:
        cmd: "zpool status rpool 2>/dev/null | grep -cE '^\\s+(sd|nvme|vd)[a-z]+[0-9]+\\s+ONLINE' || true"
      register: pve_zpool_vdev_count
      changed_when: false
      tags: preflight

    - name: FAIL — single disk, no ZFS redundancy, not acknowledged
      ansible.builtin.fail:
        msg: >
          {{ inventory_hostname }}: only {{ pve_zpool_vdev_count.stdout | trim }}
          disk(s) detected in ZFS pool rpool — this node has NO disk
          redundancy and WILL lose all data if that disk fails. Follow
          docs/proxmox/zfs-raid0-to-raid1.md to add a second disk before
          production use. To proceed anyway (e.g. the second disk is on
          order), re-run with -e pve_acknowledge_single_disk=true.
      when:
        - (pve_zpool_vdev_count.stdout | trim | int) < 2
        - not (pve_acknowledge_single_disk | default(false) | bool)
      tags: preflight

    - name: WARN — single disk, acknowledged
      ansible.builtin.debug:
        msg: >
          {{ inventory_hostname }}: only {{ pve_zpool_vdev_count.stdout | trim }}
          disk(s) in ZFS pool rpool — no redundancy. Acknowledged via
          -e pve_acknowledge_single_disk=true. Do not forget to add the
          second disk before production use.
      when:
        - (pve_zpool_vdev_count.stdout | trim | int) < 2
        - pve_acknowledge_single_disk | default(false) | bool
      tags: preflight
