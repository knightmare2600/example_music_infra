---
# =============================================================================
# playbooks/40-scripts.yml
# Example Music Limited — Proxmox VE node: maintenance scripts
# =============================================================================
# Deploys the Zabbix-monitored maintenance scripts and the apt config that
# blocks proxmox-ve from unattended auto-upgrade. Safe to run on an
# already-onboarded node — copy is checksum-idempotent and nothing here is
# executed or reloaded (that's 50-systemd-units.yml).
#
# Files deployed (source: ansible/playbooks/proxmox/files/):
#   /usr/local/bin/enable_vm_trim_discard.sh          -- TRIM/discard helper
#   /usr/local/bin/add_missing_disk_serials.sh        -- disk serial= retrofit helper
#   /usr/local/bin/pve-monthly-hoover.sh              -- monthly cleanup script
#   /usr/local/bin/pve-snapshot-check.py              -- snapshot audit script
#   /usr/local/bin/pve-backup-check.py                -- backup status check (Proxmox Health Checkup template)
#   /usr/local/bin/proxmox-replica-nic-guard.py       -- NIC link_down guard for replicas
#   /usr/local/bin/proxmox-zfs-vm-audit.py            -- ZFS VM pool placement audit
#   /etc/apt/apt.conf.d/52unattended-upgrades-pve     -- blocks proxmox-ve from auto-upgrade
#   /etc/proxmox-replica-nic-guard/auth.env.example   -- credentials template (not the real auth.env)
#
# Also deploys the infrastructure-management provisioning scripts (source:
# bootstrap/web/proxmox/ in the git checkout, not files/ above) directly to
# /usr/local/bin/ -- create-vm.py, create-vm-tui.py, convert-v2v.py,
# manage-pool.py, site-inventory-audit.py, bulk_iso_upload.py,
# pve-bootorder.py, virt-v2v-vmdp.sh, create-pve-users.py,
# zfs-disk-replace.sh. These used to be fetched by first-boot.sh over HTTP
# from the provisioning web server; now they come straight from the control
# node's own checkout, same single-source-of-truth pattern as
# sites.csv/devices.csv deployment.
#
# create-pve-users.py and zfs-disk-replace.sh added 2026-08-01 (Robert, live
# on EXAPVECLD001): both scripts already existed in the repo, unchanged, but
# were never in this deploy loop -- found sitting unmanaged in ~/ instead of
# /usr/local/bin/, alongside a few genuinely stale duplicates from before
# this task existed (create-vm.py_old etc., cleaned up by hand). first-boot.sh
# is deliberately NOT deployed here -- it's what bootstraps the ansible
# account/SSH access in the first place, so Ansible can't be the thing that
# puts it there.
#
# NIC guard credentials: the replica-nic-guard script reads its Proxmox API
# credentials from /etc/proxmox-replica-nic-guard/auth.env (not deployed by
# Ansible — the operator fills it in from the .env.example that IS
# deployed here). See docs/zabbix_templates/ for the matching Zabbix
# template to import.
#
# Ansible re-deploys any file whose checksum differs from the source.
# Zabbix cksum items will alert if files drift between Ansible runs.
#
# This stage is pure file placement — nothing here is executed, reloaded,
# or restarted (systemd units + Zabbix agent restart are
# 50-systemd-units.yml), which is why it's safe to always run.
#
# Usage:
#   ansible-playbook -i configs/inventory playbooks/proxmox/playbooks/40-scripts.yml
#
# Tags: scripts
# =============================================================================
# Changelog:
#   2026-10-29  Added pve-backup-check.py to the deploy loop -- feeds the standalone
#               "Proxmox Health Checkup" Zabbix template (docs/zabbix_templates/
#               zabbix_template_proxmox_health_checkup.json), not zabbix_template_proxmox.json.
#               Ported from Robert's real build, leak-swept clean.
#   2026-10-24  Added add_missing_disk_serials.sh to the deploy loop -- Robert's ask,
#               same shape as enable_vm_trim_discard.sh (colour vars, qemu-server/*.conf
#               loop, running-vs-stopped safety split, confirm-before-changing prompt).
#               Retrofits serial= onto existing VMs' disks -- create-vm.py/
#               create-vm-tui.py (2026-10-24) only generate one for disks created going
#               forward, not anything built before that fix.
#   2026-08-27  Added create-vm-tui.py to the deploy loop -- the Textual TUI
#               v2 of create-vm.py (bootstrap/web/proxmox/create-vm-tui.py),
#               built alongside create-vm.py, not replacing it. Target nodes
#               already have python3-textual + companions in pve_packages
#               (group_vars/pvenodes/main.yml), added when the tool was
#               first built.
#   2026-08-01  Added create-pve-users.py and zfs-disk-replace.sh to the deploy loop --
#               Robert, live on EXAPVECLD001: both already existed unchanged in the repo,
#               but were never wired in here, so they'd only ever ended up on that one
#               box by hand, in ~/ rather than /usr/local/bin/. Also added
#               python3-paramiko to group_vars/pvenodes/main.yml's pve_packages --
#               create-pve-users.py's optional SSH-based Linux user creation needs it,
#               was missing.
#   2026-07-06  Initial file — extracted from pve_onboard.yml as part of the
#               numbered-stage split (see 00-preflight.yml). Always runs,
#               even on a refresh-only pass against an already-onboarded node.
#   2026-07-07  Added provisioning-script deployment (create-vm.py, convert-v2v.py,
#               manage-pool.py, site-inventory-audit.py, bulk_iso_upload.py,
#               pve-bootorder.py, virt-v2v-vmdp.sh) — moved here from
#               first-boot.sh, which used to fetch these over HTTP from the
#               provisioning web server ($PROV_PKG_PATH, which was never
#               actually defined anywhere — dead code). Copied straight from
#               the control node's git checkout instead.
#   2026-07-10  Added dynamic MOTD deployment (files/10-pve-motd +
#               /etc/profile.d/motd.sh) — moved from first-boot.sh, which now
#               only does enough for the ansible user to be SSH-reachable.
#               Deliberately does NOT touch sshd_config/PrintMotd or restart
#               ssh (the old script did both, unnecessarily — Debian's
#               default pam_motd already runs /etc/update-motd.d/* on login,
#               and profile.d/motd.sh covers non-interactive/su cases; no
#               reason to touch a live hypervisor's sshd for a banner).
# =============================================================================

- name: Proxmox VE — Maintenance scripts
  hosts: "{{ target | default('pvenodes') }}"
  become: true

  vars:
    provisioning_scripts_src: "{{ playbook_dir }}/../../../../bootstrap/web/proxmox"

  tasks:

    - name: Deploy provisioning scripts to /usr/local/bin (from git checkout)
      ansible.builtin.copy:
        src: "{{ provisioning_scripts_src }}/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        owner: root
        group: root
        mode: '0755'
      loop:
        - create-vm.py
        - create-vm-tui.py
        - convert-v2v.py
        - manage-pool.py
        - site-inventory-audit.py
        - bulk_iso_upload.py
        - pve-bootorder.py
        - virt-v2v-vmdp.sh
        - create-pve-users.py
        - zfs-disk-replace.sh
      tags: scripts

    - name: Deploy PVE scripts to /usr/local/bin
      ansible.builtin.copy:
        src: "../files/{{ item }}"
        dest: "/usr/local/bin/{{ item }}"
        owner: root
        group: root
        mode: '0755'
      loop:
        - enable_vm_trim_discard.sh
        - add_missing_disk_serials.sh
        - pve-monthly-hoover.sh
        - pve-snapshot-check.py
        - pve-backup-check.py
        - proxmox-replica-nic-guard.py
        - proxmox-zfs-vm-audit.py
      tags: scripts

    - name: Deploy PVE kernel cleanup apt config
      ansible.builtin.copy:
        src: ../files/52unattended-upgrades-pve
        dest: /etc/apt/apt.conf.d/52unattended-upgrades-pve
        owner: root
        group: root
        mode: '0644'
      tags: scripts

    # ── NIC guard credentials directory ──────────────────────────────────────
    # The script reads /etc/proxmox-replica-nic-guard/auth.env at runtime.
    # Ansible deploys only the example file — the operator fills in the real
    # credentials (Proxmox API token) and saves them as auth.env.

    - name: Create /etc/proxmox-replica-nic-guard directory
      ansible.builtin.file:
        path:  /etc/proxmox-replica-nic-guard
        state: directory
        owner: root
        group: root
        mode:  '0700'
      tags: scripts

    - name: Deploy NIC guard credentials example
      ansible.builtin.copy:
        src:   ../files/proxmox-replica-nic-guard.env.example
        dest:  /etc/proxmox-replica-nic-guard/auth.env.example
        owner: root
        group: root
        mode:  '0600'
      tags: scripts

    # ── Dynamic MOTD ────────────────────────────────────────────────────────

    - name: List existing update-motd.d scripts
      ansible.builtin.find:
        paths: /etc/update-motd.d
        file_type: file
      register: pve_motd_existing
      tags: scripts

    - name: Disable other update-motd.d scripts (avoid duplicate banners)
      ansible.builtin.file:
        path: "{{ item.path }}"
        mode: '0644'
      loop: "{{ pve_motd_existing.files }}"
      when: item.path != '/etc/update-motd.d/10-pve'
      tags: scripts

    - name: Deploy dynamic MOTD script
      ansible.builtin.copy:
        src: ../files/10-pve-motd
        dest: /etc/update-motd.d/10-pve
        owner: root
        group: root
        mode: '0755'
      tags: scripts

    - name: Deploy MOTD profile.d hook
      # 2026-10-11, real live bug found on EXAPVEFRD001: the banner printed TWICE on a
      # normal SSH login, disproving this file's own 2026-07-10 changelog assumption
      # above ("profile.d/motd.sh covers non-interactive/su cases" -- it does, but it was
      # ALSO firing on the exact interactive-SSH case pam_motd's own update-motd.d
      # processing already covers). $SSH_TTY is set by sshd for every real interactive
      # SSH session -- pam_motd has already shown the banner by the time this hook runs
      # in that case, so skip it there and only fall through for the su/console logins
      # this hook actually exists for.
      ansible.builtin.copy:
        content: |
          [[ -z "$SSH_TTY" ]] && [[ -x /etc/update-motd.d/10-pve ]] && /etc/update-motd.d/10-pve
        dest: /etc/profile.d/motd.sh
        owner: root
        group: root
        mode: '0644'
      tags: scripts
