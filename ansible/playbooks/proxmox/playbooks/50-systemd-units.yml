---
# =============================================================================
# playbooks/50-systemd-units.yml
# Example Music Limited — Proxmox VE node: systemd units + Zabbix agent
# =============================================================================
# Deploys the systemd service/timer units for the scripts in
# 40-scripts.yml, reloads systemd, enables+starts the timers, and deploys
# the Zabbix agent drop-in for NIC-guard monitoring (restarting
# zabbix-agent to pick it up).
#
# GATED — only runs when pve_run_full_onboard is true (set by
# 00-preflight.yml): true on first-ever onboarding, or when the operator
# explicitly passes -e pve_force_full_onboard=true against an
# already-onboarded node. daemon-reload, timer enable/start, and a
# zabbix-agent restart all touch live running state, however briefly —
# not something to redo silently on every routine refresh of a hypervisor.
#
# Units deployed (source: ansible/playbooks/proxmox/files/):
#   /etc/systemd/system/pve-monthly-hoover.{service,timer}
#   /etc/systemd/system/pve-snapshot-check.{service,timer}
#   /etc/systemd/system/proxmox-replica-nic-guard.{service,timer}
#   /etc/systemd/system/proxmox-zfs-vm-audit.{service,timer}
#   /etc/zabbix/zabbix_agentd.d/proxmox-nic-guard.conf
#   proxmoxbmc service (only if pve_proxmoxbmc_deb_url was set for 45-virt-tools.yml)
#
# Usage:
#   ansible-playbook -i configs/inventory playbooks/proxmox/playbooks/50-systemd-units.yml
#   (run via site.yml normally, gated by 00-preflight.yml's fact — running
#   this file directly bypasses that gate, so only do so deliberately)
#
# Tags: systemd_units
# =============================================================================
# Changelog:
#   2026-07-06  Initial file — extracted from pve_onboard.yml as part of the
#               numbered-stage split (see 00-preflight.yml). Gated behind
#               pve_run_full_onboard so a refresh run against an
#               already-onboarded node doesn't restart zabbix-agent or
#               touch systemd unless explicitly requested via
#               -e pve_force_full_onboard=true.
#   2026-07-07  Added proxmoxbmc service enable/start + API token creation
#               (moved from first-boot.sh) — gated the same way, and only
#               runs when pve_proxmoxbmc_deb_url was set for 45-virt-tools.yml
#               to actually install it.
# =============================================================================

- name: Proxmox VE — Systemd units and Zabbix agent
  hosts: "{{ target | default('pvenodes') }}"
  become: true

  handlers:
    - name: Restart zabbix-agent
      ansible.builtin.systemd:
        name: zabbix-agent
        state: restarted
      failed_when: false

  tasks:

    - name: Skip — already onboarded, systemd units not requested
      ansible.builtin.debug:
        msg: >
          {{ inventory_hostname }} is already onboarded — skipping systemd
          units and Zabbix agent restart. Pass -e pve_force_full_onboard=true
          to force this stage.
      when: not (pve_run_full_onboard | default(true) | bool)
      tags: systemd_units

    - name: Deploy PVE maintenance systemd units
      ansible.builtin.copy:
        src: "../files/{{ item }}"
        dest: "/etc/systemd/system/{{ item }}"
        owner: root
        group: root
        mode: '0644'
      loop:
        - pve-monthly-hoover.service
        - pve-monthly-hoover.timer
        - pve-snapshot-check.service
        - pve-snapshot-check.timer
        - proxmox-replica-nic-guard.service
        - proxmox-replica-nic-guard.timer
        - proxmox-zfs-vm-audit.service
        - proxmox-zfs-vm-audit.timer
      register: pve_unit_files
      when: pve_run_full_onboard | default(true) | bool
      tags: systemd_units

    - name: Reload systemd daemon (unit files changed)
      ansible.builtin.systemd:
        daemon_reload: true
      when:
        - pve_run_full_onboard | default(true) | bool
        - pve_unit_files.changed
      tags: systemd_units

    - name: Enable and start PVE maintenance timers
      ansible.builtin.systemd:
        name: "{{ item }}"
        enabled: true
        state: started
      loop:
        - pve-monthly-hoover.timer
        - pve-snapshot-check.timer
        - proxmox-replica-nic-guard.timer
        - proxmox-zfs-vm-audit.timer
      when: pve_run_full_onboard | default(true) | bool
      tags: systemd_units

    # ── Zabbix agent drop-in ──────────────────────────────────────────────────

    - name: Ensure /etc/zabbix/zabbix_agentd.d exists
      ansible.builtin.file:
        path:  /etc/zabbix/zabbix_agentd.d
        state: directory
        owner: root
        group: root
        mode:  '0755'
      when: pve_run_full_onboard | default(true) | bool
      tags: systemd_units

    - name: Deploy Zabbix agent drop-in for NIC guard
      ansible.builtin.copy:
        src:   ../files/zabbix_agentd_nic-guard.conf
        dest:  /etc/zabbix/zabbix_agentd.d/proxmox-nic-guard.conf
        owner: root
        group: root
        mode:  '0644'
      when: pve_run_full_onboard | default(true) | bool
      notify: Restart zabbix-agent
      tags: systemd_units

    # ── proxmoxbmc service (only if 45-virt-tools.yml actually installed it —
    #    see pve_proxmoxbmc_deb_url there. Service enable/start + API token
    #    creation touch live state, so this stays gated here rather than in
    #    45-virt-tools.yml's pure file-placement tasks.) ─────────────────────

    - name: Enable and start proxmoxbmc service
      ansible.builtin.systemd:
        name: proxmoxbmc
        daemon_reload: true
        enabled: true
        state: restarted
      when:
        - pve_run_full_onboard | default(true) | bool
        - pve_proxmoxbmc_deb_url | default('') | length > 0
      tags: systemd_units

    - name: Create Proxmox API token for proxmoxbmc
      ansible.builtin.command: pveum user token add root@pam proxmoxbmc --privsep=0 --output-format=json
      register: _proxmoxbmc_token
      failed_when: false
      changed_when: _proxmoxbmc_token.rc == 0
      when:
        - pve_run_full_onboard | default(true) | bool
        - pve_proxmoxbmc_deb_url | default('') | length > 0
      tags: systemd_units

    - name: Show proxmoxbmc API token (save this — shown only once)
      ansible.builtin.debug:
        msg: >-
          {{ (_proxmoxbmc_token.stdout | from_json).value
             if (_proxmoxbmc_token.rc | default(1)) == 0
             else 'Token not created this run (may already exist — check Datacenter -> Permissions -> API Tokens).' }}
      when:
        - pve_run_full_onboard | default(true) | bool
        - pve_proxmoxbmc_deb_url | default('') | length > 0
        - _proxmoxbmc_token is not skipped
      tags: systemd_units
