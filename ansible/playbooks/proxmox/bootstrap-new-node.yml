---
# =============================================================================
# proxmox/bootstrap-new-node.yml
# Example Music Limited — Give a brand-new PVE node its real identity
# =============================================================================
# A freshly-preseeded PVE node comes up on DHCP with a generic placeholder
# hostname (VRK-answer.toml/FRD-answer.toml: source = "from-dhcp", fqdn = "pve-install.jukebox.internal")
# and only the ansible-bootstrap sliver of first-boot.sh has run (ansible user +
# SSH key — see first-boot.sh's 2026-07-07 changelog entry). This playbook does
# the rest: renames the node to its real hostname (from the operator's build
# sheet) and rewrites its networking to static, using the exact same
# /etc/network/interfaces template first-boot.sh used to write imperatively.
#
# Deliberately NOT part of site.yml's chain and NOT number-prefixed like the
# playbooks/*.yml stages there — this is a one-time, higher-risk operation
# (renames the live host, rewrites its own networking, strands the current SSH
# connection on purpose) that should only ever run when explicitly invoked by
# name, never as a side effect of routine maintenance.
#
# Run against the node's temporary DHCP IP (not through configs/inventory —
# it isn't in there yet):
#
#   ansible-playbook -i "192.168.x.x," playbooks/proxmox/bootstrap-new-node.yml
#
# You'll be prompted for the target hostname (e.g. EXAPVEKGE001, from your
# build sheet) and asked to confirm the derived static IP before anything is
# changed. The SSH session on the DHCP IP will not survive this play — that is
# expected. Reconnect via the new hostname/IP afterward, add it to
# configs/inventory/, then run proxmox/site.yml as normal — 00-preflight.yml
# onward already assumes a correctly-named, statically-addressed node.
#
# Refuses to run against a node that has already been through a full
# site.yml run (detected via /etc/example-music/nodeinfo.json,
# tasks/onboarded_check.yml — same check 00-preflight.yml uses) — that
# means this node has already been onboarded through the normal site.yml
# flow, and re-running this playbook against it would rename/rewrite the
# networking of a live, already-configured node. Override with
# -e bootstrap_force=true if you genuinely mean to.
# =============================================================================
# Changelog:
#   2026-07-12  Added the actual reboot at the end -- the final message always
#               claimed "this SSH session will not survive," but nothing ever
#               applied /etc/network/interfaces (needs a reload or reboot to
#               take effect) or rebooted; found when Robert ran this
#               end-to-end for the first time and asked why it wasn't
#               rebooting. Fire-and-forget shell reboot, not
#               ansible.builtin.reboot's wait-and-reconnect -- that would try
#               the OLD DHCP address afterward, which won't answer once the
#               new static config is up. Also fixed the "Show derived network
#               config and confirm" prompt's label alignment (Robert: the
#               ragged colons would "absolutely drive my OCD apeshit") --
#               all four labels now padded to the same width.
#   2026-07-12  Fixed sites_csv_src/address_policy_src/ad_forest_src -- had
#               4 levels of ../ (copy-pasted from 00-preflight.yml/
#               30-example-music.yml, which live one directory deeper under
#               playbooks/proxmox/playbooks/ and correctly need 4), but this
#               file lives directly under playbooks/proxmox/ and only needs
#               3. Off by one the whole time; invisible to check_references.py
#               (only checks literal src:/include_tasks: paths, not
#               Jinja playbook_dir vars used with read_csv/lookup('file',...))
#               and to --syntax-check (a runtime task failure, not a syntax
#               error). Only surfaced once the SSH keypair preflight (below)
#               let a real run reach the Load sites.csv task for the first
#               time -- every earlier attempt failed at connect time.
#   2026-07-12  Added a leading, separate SSH keypair preflight play (see
#               tasks/ssh_key_preflight.yml) — this playbook is the one that
#               actually failed UNREACHABLE against a real node (EXAPVEGOT001)
#               when the configured private key went missing on the control
#               node, with the real cause hidden behind exa_pretty's terse
#               summary. That preflight now runs a real ssh connectivity test
#               using the configured key BEFORE this play's own gather_facts
#               gets a chance to fail obscurely, and fails hard with the real
#               ssh stderr if it doesn't work. Robert's explicit ask: a
#               showstopper, not a warning.
#   2026-07-12  Onboarded-check moved from /etc/sudoers.d/ansible to
#               /etc/example-music/nodeinfo.json — first-boot.sh's own
#               ansible-bootstrap sliver writes that exact sudoers file on
#               every fresh node (needed so Ansible can reach it at all),
#               which meant this guard would have refused to run against
#               EVERY genuinely fresh node, not just already-onboarded
#               ones. Found and fixed before running this against real
#               hardware for the first time. See tasks/onboarded_check.yml
#               for the full reasoning.
#   2026-07-07  Initial file — replaces first-boot.sh's interactive site/
#               hostname/gateway/IP prompts and Step 7 (rename + network
#               rewrite), ported here so the operator's already-known
#               build-sheet hostname/IP drives Ansible instead of a
#               shell-script wizard re-deriving them from a sites.csv copy
#               that had to be pre-served by the preseed web server.
#   2026-07-09  Domain hardcodes (/etc/hosts, postfix myhostname, PVE DNS search,
#               reconnect message) replaced with _ad_forest.domain_fqdn, loaded from
#               benarbejde/ad_forest.json the same way sites.csv/address_policy.json
#               already are here. Also fixed a real bug found along the way: the PVE
#               DNS API call set --dns1/--dns2 to two PUBLIC resolvers only
#               (1.1.1.1/9.9.9.9), with no internal BIND9 server at all -- meaning
#               this node could never have resolved internal hostnames. Now uses
#               _ad_forest.dns_forwarders[0:2] (internal BIND9 first, then one public
#               upstream), matching the order used everywhere else in this repo.
# =============================================================================

- name: Proxmox VE — bootstrap a new node's real identity (SSH keypair preflight)
  hosts: all
  gather_facts: false
  tasks:
    - name: Real SSH connectivity check using the configured key
      include_tasks: ../../tasks/ssh_key_preflight.yml

- name: Proxmox VE — bootstrap a new node's real identity
  hosts: all
  become: true
  gather_facts: true

  vars:
    # 3 levels, not 4 -- this file lives at playbooks/proxmox/bootstrap-new-node.yml
    # (one level shallower than 00-preflight.yml/30-example-music.yml, which live
    # under playbooks/proxmox/playbooks/ and correctly use 4). Found 2026-07-12 on
    # the first real run to ever get past the SSH connection stage (see
    # ansible/tasks/ssh_key_preflight.yml) -- every earlier attempt failed at
    # connect time, before this Load sites.csv task was ever reached.
    sites_csv_src: "{{ playbook_dir }}/../../../benarbejde/sites.csv"
    address_policy_src: "{{ playbook_dir }}/../../../benarbejde/address_policy.json"
    ad_forest_src: "{{ playbook_dir }}/../../../benarbejde/ad_forest.json"

  vars_prompt:
    - name: target_hostname
      prompt: "Target hostname for this node (from your build sheet, e.g. EXAPVEKGE001)"
      private: false

  tasks:
    - name: Check whether this node has already been onboarded
      include_tasks: ../../tasks/onboarded_check.yml

    - name: Abort if already onboarded (override with -e bootstrap_force=true)
      ansible.builtin.assert:
        that:
          - (not node_onboarded) or (bootstrap_force | default(false) | bool)
        fail_msg: >-
          /etc/example-music/nodeinfo.json already exists and is valid — this
          node has already been through a full site.yml run, meaning it's
          already onboarded. Re-running this playbook would rename and
          rewrite the networking of a live, already-configured node. If you
          are certain that's what you want, re-run with -e bootstrap_force=true.

    - name: Include hostname facts (parses target_hostname)
      include_tasks: ../../tasks/hostname_facts.yml

    - name: Abort if this isn't a PVE hostname
      ansible.builtin.assert:
        that:
          - host_role == 'PVE'
        fail_msg: >-
          '{{ target_hostname }}' parses as role={{ host_role }}, not PVE.
          This playbook is for Proxmox VE nodes only.

    - name: Load sites.csv
      ansible.builtin.read_csv:
        path: "{{ sites_csv_src }}"
      register: _sites_raw
      delegate_to: localhost
      become: false

    - name: Look up this node's site row
      ansible.builtin.set_fact:
        _site_row: "{{ _sites_raw.list | selectattr('Site', 'equalto', host_site) | list | first | default({}) }}"

    - name: Abort if site code not found in sites.csv
      ansible.builtin.assert:
        that:
          - _site_row != {}
        fail_msg: "Site code '{{ host_site }}' (parsed from {{ target_hostname }}) was not found in sites.csv."

    - name: Load address_policy.json
      ansible.builtin.set_fact:
        _address_policy: "{{ lookup('file', address_policy_src) | from_json }}"
      delegate_to: localhost
      become: false

    - name: Load ad_forest.json
      ansible.builtin.set_fact:
        _ad_forest: "{{ lookup('file', ad_forest_src) | from_json }}"
      delegate_to: localhost
      become: false

    - name: Derive expected static IP from address_policy.json's PVE offsets
      ansible.builtin.set_fact:
        _subnet_base: "{{ _site_row.Subnet.split('.')[0:3] | join('.') }}"
        _pve_offsets: "{{ _address_policy.role_offsets.PVE }}"

    - name: Abort if host_num is out of range for the PVE offset list
      ansible.builtin.assert:
        that:
          - (host_num | int) >= 1
          - (host_num | int) <= (_pve_offsets | length)
        fail_msg: >-
          host_num={{ host_num }} (parsed from {{ target_hostname }}) has no
          matching entry in address_policy.json's PVE offsets ({{ _pve_offsets }}) —
          check the instance number in the hostname.

    - name: Set derived static IP + gateway
      ansible.builtin.set_fact:
        _derived_ip: "{{ _subnet_base }}.{{ _pve_offsets[(host_num | int) - 1] }}"
        _gateway: "{{ _site_row.Gateway }}"

    - name: Show derived network config and confirm
      ansible.builtin.pause:
        prompt: |

          Target hostname   : {{ target_hostname | upper }}
          Site              : {{ host_site }} ({{ _site_row.City }}, {{ _site_row.Country }})
          Derived static IP : {{ _derived_ip }}/24
          Gateway           : {{ _gateway }}

          This matches the standard PVE{{ host_num }} slot for {{ host_site }}.
          If this does NOT match your build sheet, Ctrl-C now and re-check
          before continuing — this playbook will rewrite this node's
          networking and the current SSH session will drop.

          Press Enter to confirm and proceed, or Ctrl-C to abort
      when: not (bootstrap_skip_confirm | default(false) | bool)

    - name: Detect physical NIC from existing bridge-ports
      ansible.builtin.command: awk '/bridge-ports/{print $2}' /etc/network/interfaces
      register: _phys_nic_from_bridge
      changed_when: false

    - name: Fall back to first non-virtual interface if bridge-ports not found
      ansible.builtin.shell: >-
        set -o pipefail;
        ip -o link show | awk -F': ' '{print $2}' |
        grep -vE '^(lo|vmbr|fwbr|fwpr|fwln|tap|veth|bond|docker|br-)' | head -1
      args:
        executable: /bin/bash
      register: _phys_nic_fallback
      changed_when: false
      when: _phys_nic_from_bridge.stdout | trim == ''

    - name: Set physical NIC fact
      ansible.builtin.set_fact:
        _phys_nic: >-
          {{ (_phys_nic_from_bridge.stdout | trim)
             if (_phys_nic_from_bridge.stdout | trim != '')
             else (_phys_nic_fallback.stdout | default('ens32') | trim | default('ens32', true)) }}

    - name: Write /etc/network/interfaces (static, matches first-boot.sh's former template)
      ansible.builtin.copy:
        dest: /etc/network/interfaces
        mode: "0644"
        content: |
          auto lo
          iface lo inet loopback

          iface {{ _phys_nic }} inet manual

          auto vmbr0
          iface vmbr0 inet static
              address {{ _derived_ip }}/24
              gateway {{ _gateway }}
              bridge-ports {{ _phys_nic }}
              bridge-stp off
              bridge-fd 0
              bridge-vlan-aware yes

          source /etc/network/interfaces.d/*

    - name: Write /etc/hostname
      ansible.builtin.copy:
        dest: /etc/hostname
        mode: "0644"
        content: "{{ target_hostname | lower }}\n"

    - name: Update /etc/hosts — remove stale 127.0.1.1 line
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s'
        state: absent

    - name: Update /etc/hosts — remove stale provisioning-network lines
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^192\.168\.\d+\.\d+\s'
        state: absent

    - name: Update /etc/hosts — add 127.0.1.1 and real IP lines
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ item }}"
        insertafter: EOF
      loop:
        - "127.0.1.1\t{{ target_hostname | lower }}.{{ _ad_forest.domain_fqdn }}\t{{ target_hostname | lower }}"
        - "{{ _derived_ip }}\t{{ target_hostname | lower }}.{{ _ad_forest.domain_fqdn }}\t{{ target_hostname | lower }}"

    - name: Apply hostname to the running system
      ansible.builtin.hostname:
        name: "{{ target_hostname | lower }}"

    - name: Check for postfix
      ansible.builtin.stat:
        path: /etc/postfix/main.cf
      register: _postfix_check

    - name: Update postfix myhostname
      ansible.builtin.lineinfile:
        path: /etc/postfix/main.cf
        regexp: '^myhostname\s*='
        line: "myhostname = {{ target_hostname | lower }}.{{ _ad_forest.domain_fqdn }}"
      when: _postfix_check.stat.exists

    - name: Set persistent DNS via PVE API
      # DNS forwarder order matches _ad_forest.dns_forwarders (benarbejde/ad_forest.json):
      # internal BIND9 first, then a public upstream -- previously hardcoded to two public
      # resolvers only (1.1.1.1/9.9.9.9), which would never have resolved internal
      # {{ _ad_forest.domain_fqdn }} hostnames at all.
      ansible.builtin.command: >-
        pvesh set /nodes/{{ target_hostname | lower }}/dns
        --dns1 {{ _ad_forest.dns_forwarders[0] }} --dns2 {{ _ad_forest.dns_forwarders[1] }}
        --search {{ _ad_forest.domain_fqdn }}
      changed_when: true

    - name: Final message — SSH session on the old IP is about to drop
      ansible.builtin.debug:
        msg:
          - "Network config written. Rebooting now to apply it — this SSH session (on the DHCP IP) will not survive."
          - "Reconnect via: ssh ansible@{{ _derived_ip }}  (or {{ target_hostname | lower }}.{{ _ad_forest.domain_fqdn }} once DNS picks it up)"
          - "Then: add it to configs/inventory/, and run proxmox/site.yml as normal."

    - name: Reboot to apply new hostname/networking
      # /etc/network/interfaces was written above but never takes effect on its own --
      # it needs either an explicit reload or a reboot. A reboot is used deliberately
      # over `ifreload -a`: this task's own SSH connection is on the interface being
      # reconfigured (DHCP -> static), so reloading it live over that same connection
      # is the riskier path. ansible.builtin.reboot's own wait-and-reconnect logic
      # isn't used here (fire-and-forget shell instead) because it would try to
      # reconnect on the OLD DHCP address afterward, which the node will no longer be
      # answering on once the new static config is up -- that's expected to fail/hang,
      # not a real error. Confirm the new address manually per the message above.
      ansible.builtin.shell: sleep 2 && reboot
      async: 1
      poll: 0
      ignore_errors: true
