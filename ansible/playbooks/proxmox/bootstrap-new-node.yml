---
# =============================================================================
# proxmox/bootstrap-new-node.yml
# Example Music Limited — Give a brand-new PVE node its real identity
# =============================================================================
# A freshly-preseeded PVE node comes up on DHCP with a generic placeholder
# hostname (VRK-answer.toml/FRD-answer.toml: source = "from-dhcp", fqdn = "pve-install.jukebox.internal")
# and only the ansible-bootstrap sliver of first-boot.sh has run (ansible user +
# SSH key — see first-boot.sh's 2026-07-07 changelog entry). This playbook does
# the rest: renames the node to its real hostname (from the operator's build
# sheet) and rewrites its networking to static, using the exact same
# /etc/network/interfaces template first-boot.sh used to write imperatively.
#
# NOT number-prefixed like the playbooks/*.yml stages, and its own identity-
# rename tasks (rewriting the live host's name/networking) remain a one-time,
# higher-risk operation that should only ever be invoked deliberately, by
# name, never as a side effect of routine maintenance — but this file now
# chains straight into the full site.yml stage chain itself, in the same run,
# rather than requiring a separate manual second invocation. There is nothing
# in the site.yml chain that depends on the node already being reachable at
# its final static IP/hostname (checked 2026-07-12 -- 30-example-music.yml
# was the one real exception, see its own changelog), so there is no genuine
# reason to split this into two runs with a reboot in between -- see
# feedback_no_premature_reboots in this project's history. One reboot, at
# the very end of everything, once the node is actually fully onboarded.
#
# Run against the node's temporary DHCP IP, WITH configs/inventory also
# loaded as a second -i source (needed purely so group_vars/pvenodes/ -- e.g.
# pve_packages -- actually has a path to be found from; a bare "-i
# "1.2.3.4,"" ad-hoc inventory has none, which is exactly what broke
# 10-packages.yml the first time this chained straight into site.yml). You
# must also pass -e target= matching the DHCP address. This file's OWN plays
# (not just the imported site.yml stages) use hosts: "{{ target }}" with NO
# default and NOT hosts: all -- deliberately: once configs/inventory is
# loaded as a second source, hosts: all matches every real host in the WHOLE
# estate's inventory, not just this one ad-hoc node (verified empirically --
# even a plain assert/debug task actually executes against every matched
# host). An undefined target makes Ansible hard-fail immediately, for the
# whole run, before anything happens (confirmed: exit code 4) -- much safer
# than a custom in-play check, which could only ever fire AFTER a dangerously
# broad hosts: pattern had already been accepted. The one thing a hosts:
# check can't catch -- configs/inventory not having been loaded at all -- is
# still checked explicitly, with a clear message, as this file's first task.
# Full command:
#
#   ansible-playbook -i "192.168.x.x," -i configs/inventory \
#     -e target="192.168.x.x" playbooks/proxmox/bootstrap-new-node.yml
#
# You'll be prompted for the target hostname (e.g. EXAPVEKGE001, from your
# build sheet) and asked to confirm the derived static IP before anything is
# changed. Then: identity rename, the full site.yml chain (packages incl.
# GRUB serial console, access setup, example-music deployment, scripts,
# virt-tools, proxmorph, systemd units), and only then one final reboot.
# The SSH session on the DHCP IP will not survive that reboot — that is
# expected. Reconnect via the new hostname/IP afterward and you're done; the
# site's PVE1 slot is already in configs/inventory/ (generated active by
# default — DO NOT hand-edit that file), nothing further to add there.
#
# Refuses to run against a node that has already been through a full
# site.yml run (detected via /etc/example-music/nodeinfo.json,
# tasks/onboarded_check.yml — same check 00-preflight.yml uses) — that
# means this node has already been onboarded through the normal site.yml
# flow, and re-running this playbook against it would rename/rewrite the
# networking of a live, already-configured node. Override with
# -e bootstrap_force=true if you genuinely mean to.
# =============================================================================
# Changelog:
#   2026-07-12  Two fixes to the chained flow below, found on Robert's next
#               real run against EXAPVEGOT001 (2nd attempt, past the target=
#               fix): (1) 10-packages.yml's "Install management packages"
#               failed with 'pve_packages' is undefined -- group_vars only
#               auto-loads for a group that's part of the LOADED inventory
#               path, and a bare ad-hoc "-i "1.2.3.4,"" has no path to find
#               configs/inventory/group_vars/pvenodes/ from at all. Fixed by
#               requiring configs/inventory as a second -i source, plus a new
#               add_host task registering this host into the pvenodes group
#               so it inherits that group's vars -- verified empirically.
#               (2) Discovered, while fixing (1), that adding configs/
#               inventory as a second source makes this file's own hosts:
#               all (used in all three of its plays) match every real host
#               in the whole estate's inventory, not just the one ad-hoc
#               node -- confirmed empirically that even assert/debug tasks
#               genuinely execute against every matched host. Changed all
#               three plays to hosts: "{{ target }}" with NO default, so a
#               missing target hard-fails the whole run immediately (exit
#               code 4) instead of silently running against production PVE
#               nodes. This replaced and removed the previous "Abort if -e
#               target..." assert task -- unreachable now, since hosts:
#               itself enforces this before any task can run; kept the
#               separate "configs/inventory not loaded" check, since that
#               failure mode isn't something a hosts: pattern can catch.
#   2026-07-12  Chained the full site.yml stage chain directly into this
#               playbook (import_playbook, after the identity-rename tasks),
#               with a single reboot at the very end instead of one here and
#               a separate manual site.yml invocation later -- Robert's ask,
#               after checking (per feedback_no_premature_reboots) that
#               nothing in the chain genuinely needs the node's final IP/
#               hostname mid-run. One real exception found and fixed:
#               30-example-music.yml's nodeinfo.json node_ip/gateway fields
#               read live ansible_default_ipv4 facts, which would still show
#               the OLD DHCP address at that point in a merged run -- now
#               prefers the already-derived _derived_ip/_gateway facts set
#               below when present, falling back to the live fact exactly as
#               before for a standalone site.yml run. Requires -e target=
#               matching -i's address (see header) -- Ansible resolves each
#               play's hosts: pattern at parse time, before any task runs,
#               so a fact set by an earlier play in this same run can't
#               reach a later, separately-imported play's hosts: line;
#               verified empirically. Fails fast with a clear message (and
#               the exact command to use) if target isn't set correctly,
#               before any destructive task runs.
#   2026-07-12  Fixed the final message's "add it to configs/inventory/" --
#               wrong advice: a site's PVE1 slot is generated ACTIVE by
#               default (generate_inventory.py, per its own "only the FIRST
#               instance is real in the .ini" design), and configs/*.ini's
#               own header says "DO NOT EDIT. Changes may be overwritten."
#               Confirmed EXAPVEGOT001 was already present in the committed
#               got.ini before this fix -- there was never anything to add.
#               Robert caught this asking why site.yml wasn't just chained
#               on automatically; same doc bug also existed in
#               docs/bootstrap/bootstrapping.md, fixed there too.
#   2026-07-12  Added the actual reboot at the end -- the final message always
#               claimed "this SSH session will not survive," but nothing ever
#               applied /etc/network/interfaces (needs a reload or reboot to
#               take effect) or rebooted; found when Robert ran this
#               end-to-end for the first time and asked why it wasn't
#               rebooting. Fire-and-forget shell reboot, not
#               ansible.builtin.reboot's wait-and-reconnect -- that would try
#               the OLD DHCP address afterward, which won't answer once the
#               new static config is up. Also fixed the "Show derived network
#               config and confirm" prompt's label alignment (Robert: the
#               ragged colons would "absolutely drive my OCD apeshit") --
#               all four labels now padded to the same width.
#   2026-07-12  Fixed sites_csv_src/address_policy_src/ad_forest_src -- had
#               4 levels of ../ (copy-pasted from 00-preflight.yml/
#               30-example-music.yml, which live one directory deeper under
#               playbooks/proxmox/playbooks/ and correctly need 4), but this
#               file lives directly under playbooks/proxmox/ and only needs
#               3. Off by one the whole time; invisible to check_references.py
#               (only checks literal src:/include_tasks: paths, not
#               Jinja playbook_dir vars used with read_csv/lookup('file',...))
#               and to --syntax-check (a runtime task failure, not a syntax
#               error). Only surfaced once the SSH keypair preflight (below)
#               let a real run reach the Load sites.csv task for the first
#               time -- every earlier attempt failed at connect time.
#   2026-07-12  Added a leading, separate SSH keypair preflight play (see
#               tasks/ssh_key_preflight.yml) — this playbook is the one that
#               actually failed UNREACHABLE against a real node (EXAPVEGOT001)
#               when the configured private key went missing on the control
#               node, with the real cause hidden behind exa_pretty's terse
#               summary. That preflight now runs a real ssh connectivity test
#               using the configured key BEFORE this play's own gather_facts
#               gets a chance to fail obscurely, and fails hard with the real
#               ssh stderr if it doesn't work. Robert's explicit ask: a
#               showstopper, not a warning.
#   2026-07-12  Onboarded-check moved from /etc/sudoers.d/ansible to
#               /etc/example-music/nodeinfo.json — first-boot.sh's own
#               ansible-bootstrap sliver writes that exact sudoers file on
#               every fresh node (needed so Ansible can reach it at all),
#               which meant this guard would have refused to run against
#               EVERY genuinely fresh node, not just already-onboarded
#               ones. Found and fixed before running this against real
#               hardware for the first time. See tasks/onboarded_check.yml
#               for the full reasoning.
#   2026-07-07  Initial file — replaces first-boot.sh's interactive site/
#               hostname/gateway/IP prompts and Step 7 (rename + network
#               rewrite), ported here so the operator's already-known
#               build-sheet hostname/IP drives Ansible instead of a
#               shell-script wizard re-deriving them from a sites.csv copy
#               that had to be pre-served by the preseed web server.
#   2026-07-09  Domain hardcodes (/etc/hosts, postfix myhostname, PVE DNS search,
#               reconnect message) replaced with _ad_forest.domain_fqdn, loaded from
#               benarbejde/ad_forest.json the same way sites.csv/address_policy.json
#               already are here. Also fixed a real bug found along the way: the PVE
#               DNS API call set --dns1/--dns2 to two PUBLIC resolvers only
#               (1.1.1.1/9.9.9.9), with no internal BIND9 server at all -- meaning
#               this node could never have resolved internal hostnames. Now uses
#               _ad_forest.dns_forwarders[0:2] (internal BIND9 first, then one public
#               upstream), matching the order used everywhere else in this repo.
# =============================================================================

- name: Proxmox VE — bootstrap a new node's real identity (SSH keypair preflight)
  # hosts: "{{ target }}" -- deliberately NO default, and NOT hosts: all. Found
  # 2026-07-12: once configs/inventory is loaded as a second -i source (required,
  # see below, for group_vars), hosts: all matches every real host in the WHOLE
  # inventory, not just the one ad-hoc node being bootstrapped -- verified
  # empirically that even a plain assert/debug task actually runs against every
  # matched host. With no default, an undefined target makes Ansible hard-fail
  # immediately, for the whole run, before anything else happens -- confirmed
  # empirically (exit code 4) -- rather than silently matching the entire estate.
  hosts: "{{ target }}"
  gather_facts: false
  tasks:
    - name: Real SSH connectivity check using the configured key
      include_tasks: ../../tasks/ssh_key_preflight.yml

- name: Proxmox VE — bootstrap a new node's real identity
  hosts: "{{ target }}"
  become: true
  gather_facts: true

  vars:
    # 3 levels, not 4 -- this file lives at playbooks/proxmox/bootstrap-new-node.yml
    # (one level shallower than 00-preflight.yml/30-example-music.yml, which live
    # under playbooks/proxmox/playbooks/ and correctly use 4). Found 2026-07-12 on
    # the first real run to ever get past the SSH connection stage (see
    # ansible/tasks/ssh_key_preflight.yml) -- every earlier attempt failed at
    # connect time, before this Load sites.csv task was ever reached.
    sites_csv_src: "{{ playbook_dir }}/../../../benarbejde/sites.csv"
    address_policy_src: "{{ playbook_dir }}/../../../benarbejde/address_policy.json"
    ad_forest_src: "{{ playbook_dir }}/../../../benarbejde/ad_forest.json"

  vars_prompt:
    - name: target_hostname
      prompt: "Target hostname for this node (from your build sheet, e.g. EXAPVEKGE001)"
      private: false

  tasks:
    - name: Abort if configs/inventory wasn't also loaded as a second -i source
      ansible.builtin.assert:
        that:
          - ('pvenodes' in groups) and (groups.pvenodes | length > 0)
        fail_msg: >-
          The pvenodes group is empty or doesn't exist -- configs/inventory
          wasn't loaded alongside the DHCP IP. Without it, site.yml's later
          stages have no path to find configs/inventory/group_vars/pvenodes/
          (e.g. pve_packages) from, regardless of group membership -- this is
          exactly what made 10-packages.yml fail with "'pve_packages' is
          undefined" the first time this ran (2026-07-12). Re-run with:

            ansible-playbook -i "{{ inventory_hostname }}," -i configs/inventory \
              -e target="{{ inventory_hostname }}" playbooks/proxmox/bootstrap-new-node.yml

          Nothing has been touched yet -- safe to just re-run.

    - name: Check whether this node has already been onboarded
      include_tasks: ../../tasks/onboarded_check.yml

    - name: Abort if already onboarded (override with -e bootstrap_force=true)
      ansible.builtin.assert:
        that:
          - (not node_onboarded) or (bootstrap_force | default(false) | bool)
        fail_msg: >-
          /etc/example-music/nodeinfo.json already exists and is valid — this
          node has already been through a full site.yml run, meaning it's
          already onboarded. Re-running this playbook would rename and
          rewrite the networking of a live, already-configured node. If you
          are certain that's what you want, re-run with -e bootstrap_force=true.

    - name: Include hostname facts (parses target_hostname)
      include_tasks: ../../tasks/hostname_facts.yml

    - name: Abort if this isn't a PVE hostname
      ansible.builtin.assert:
        that:
          - host_role == 'PVE'
        fail_msg: >-
          '{{ target_hostname }}' parses as role={{ host_role }}, not PVE.
          This playbook is for Proxmox VE nodes only.

    - name: Load sites.csv
      ansible.builtin.read_csv:
        path: "{{ sites_csv_src }}"
      register: _sites_raw
      delegate_to: localhost
      become: false

    - name: Look up this node's site row
      ansible.builtin.set_fact:
        _site_row: "{{ _sites_raw.list | selectattr('Site', 'equalto', host_site) | list | first | default({}) }}"

    - name: Abort if site code not found in sites.csv
      ansible.builtin.assert:
        that:
          - _site_row != {}
        fail_msg: "Site code '{{ host_site }}' (parsed from {{ target_hostname }}) was not found in sites.csv."

    - name: Load address_policy.json
      ansible.builtin.set_fact:
        _address_policy: "{{ lookup('file', address_policy_src) | from_json }}"
      delegate_to: localhost
      become: false

    - name: Load ad_forest.json
      ansible.builtin.set_fact:
        _ad_forest: "{{ lookup('file', ad_forest_src) | from_json }}"
      delegate_to: localhost
      become: false

    - name: Derive expected static IP from address_policy.json's PVE offsets
      ansible.builtin.set_fact:
        _subnet_base: "{{ _site_row.Subnet.split('.')[0:3] | join('.') }}"
        _pve_offsets: "{{ _address_policy.role_offsets.PVE }}"

    - name: Abort if host_num is out of range for the PVE offset list
      ansible.builtin.assert:
        that:
          - (host_num | int) >= 1
          - (host_num | int) <= (_pve_offsets | length)
        fail_msg: >-
          host_num={{ host_num }} (parsed from {{ target_hostname }}) has no
          matching entry in address_policy.json's PVE offsets ({{ _pve_offsets }}) —
          check the instance number in the hostname.

    - name: Set derived static IP + gateway
      ansible.builtin.set_fact:
        _derived_ip: "{{ _subnet_base }}.{{ _pve_offsets[(host_num | int) - 1] }}"
        _gateway: "{{ _site_row.Gateway }}"

    - name: Show derived network config and confirm
      # Packed into 1-2 lines, ~100 cols, not one padded field per line -- Robert:
      # "it's not an Apple [], dear boy" (2026-07-12).
      ansible.builtin.pause:
        prompt: |

          {{ target_hostname | upper }}  ({{ host_site }}, {{ _site_row.City }}, {{ _site_row.Country }})  ->  {{ _derived_ip }}/24 via gw {{ _gateway }}  [standard PVE{{ host_num }} slot]

          If this doesn't match your build sheet, Ctrl-C now -- rewrites this node's networking, drops the SSH session.

          Press Enter to confirm and proceed, or Ctrl-C to abort
      when: not (bootstrap_skip_confirm | default(false) | bool)

    - name: Detect physical NIC from existing bridge-ports
      ansible.builtin.command: awk '/bridge-ports/{print $2}' /etc/network/interfaces
      register: _phys_nic_from_bridge
      changed_when: false

    - name: Fall back to first non-virtual interface if bridge-ports not found
      ansible.builtin.shell: >-
        set -o pipefail;
        ip -o link show | awk -F': ' '{print $2}' |
        grep -vE '^(lo|vmbr|fwbr|fwpr|fwln|tap|veth|bond|docker|br-)' | head -1
      args:
        executable: /bin/bash
      register: _phys_nic_fallback
      changed_when: false
      when: _phys_nic_from_bridge.stdout | trim == ''

    - name: Set physical NIC fact
      ansible.builtin.set_fact:
        _phys_nic: >-
          {{ (_phys_nic_from_bridge.stdout | trim)
             if (_phys_nic_from_bridge.stdout | trim != '')
             else (_phys_nic_fallback.stdout | default('ens32') | trim | default('ens32', true)) }}

    - name: Write /etc/network/interfaces (static, matches first-boot.sh's former template)
      ansible.builtin.copy:
        dest: /etc/network/interfaces
        mode: "0644"
        content: |
          auto lo
          iface lo inet loopback

          iface {{ _phys_nic }} inet manual

          auto vmbr0
          iface vmbr0 inet static
              address {{ _derived_ip }}/24
              gateway {{ _gateway }}
              bridge-ports {{ _phys_nic }}
              bridge-stp off
              bridge-fd 0
              bridge-vlan-aware yes

          source /etc/network/interfaces.d/*

    - name: Write /etc/hostname
      ansible.builtin.copy:
        dest: /etc/hostname
        mode: "0644"
        content: "{{ target_hostname | lower }}\n"

    - name: Update /etc/hosts — remove stale 127.0.1.1 line
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^127\.0\.1\.1\s'
        state: absent

    - name: Update /etc/hosts — remove stale provisioning-network lines
      ansible.builtin.lineinfile:
        path: /etc/hosts
        regexp: '^192\.168\.\d+\.\d+\s'
        state: absent

    - name: Update /etc/hosts — add 127.0.1.1 and real IP lines
      ansible.builtin.lineinfile:
        path: /etc/hosts
        line: "{{ item }}"
        insertafter: EOF
      loop:
        - "127.0.1.1\t{{ target_hostname | lower }}.{{ _ad_forest.domain_fqdn }}\t{{ target_hostname | lower }}"
        - "{{ _derived_ip }}\t{{ target_hostname | lower }}.{{ _ad_forest.domain_fqdn }}\t{{ target_hostname | lower }}"

    - name: Apply hostname to the running system
      ansible.builtin.hostname:
        name: "{{ target_hostname | lower }}"

    - name: Check for postfix
      ansible.builtin.stat:
        path: /etc/postfix/main.cf
      register: _postfix_check

    - name: Update postfix myhostname
      ansible.builtin.lineinfile:
        path: /etc/postfix/main.cf
        regexp: '^myhostname\s*='
        line: "myhostname = {{ target_hostname | lower }}.{{ _ad_forest.domain_fqdn }}"
      when: _postfix_check.stat.exists

    - name: Set persistent DNS via PVE API
      # DNS forwarder order matches _ad_forest.dns_forwarders (benarbejde/ad_forest.json):
      # internal BIND9 first, then a public upstream -- previously hardcoded to two public
      # resolvers only (1.1.1.1/9.9.9.9), which would never have resolved internal
      # {{ _ad_forest.domain_fqdn }} hostnames at all.
      ansible.builtin.command: >-
        pvesh set /nodes/{{ target_hostname | lower }}/dns
        --dns1 {{ _ad_forest.dns_forwarders[0] }} --dns2 {{ _ad_forest.dns_forwarders[1] }}
        --search {{ _ad_forest.domain_fqdn }}
      changed_when: true

    - name: Register into the pvenodes group (site.yml's stages need its group_vars, e.g. pve_packages)
      # group_vars only auto-loads for a group that's part of the LOADED inventory path (see
      # ansible/at_have_ryggen_fri/add_host_probe/inventory.ini's own comment on this) -- a bare
      # "-i "1.2.3.4,"" ad-hoc inventory has no path for Ansible to find
      # configs/inventory/group_vars/pvenodes/ at all, regardless of group membership, which is
      # why 10-packages.yml's "Install management packages" task failed with 'pve_packages' is
      # undefined the first time this chained straight into site.yml (2026-07-12). Fixed by
      # loading configs/inventory as a SECOND -i source (see this file's own header) so that
      # group_vars actually exists to be found, and add_host-ing this specific host into the
      # pvenodes group so it inherits it. Verified this combination -- explicit -e target=
      # scoping (safe: matches only this one host, never the whole group, so this can never
      # accidentally re-run against every other already-onboarded PVE node also in that group)
      # PLUS add_host PLUS a second -i source -- actually resolves group_vars, empirically,
      # before landing this.
      ansible.builtin.add_host:
        name: "{{ inventory_hostname }}"
        groups: pvenodes
      delegate_to: localhost
      become: false

    - name: Identity rename complete — continuing into the full onboarding chain
      ansible.builtin.debug:
        msg:
          - "Network config written (takes effect on reboot, at the very end of this run -- not yet)."
          - "Continuing straight into site.yml's full stage chain now, still connected via the DHCP IP."
          - "Final reboot happens once everything else is done. Reconnect afterward via: ssh ansible@{{ _derived_ip }}  (or {{ target_hostname | lower }}.{{ _ad_forest.domain_fqdn }} once DNS picks it up)"

- import_playbook: site.yml

- name: Proxmox VE — bootstrap a new node (final reboot)
  hosts: "{{ target }}"
  gather_facts: false
  tasks:
    - name: Final message — SSH session on the old IP is about to drop
      ansible.builtin.debug:
        msg:
          - "Full onboarding complete. Rebooting now to apply the identity/network change — this SSH session (on the DHCP IP) will not survive."
          - "Reconnect via the node's new hostname/IP once it's back up."

    - name: Reboot to apply new hostname/networking
      # /etc/network/interfaces was written back in the identity-rename play but
      # never takes effect on its own -- it needs either an explicit reload or a
      # reboot. A reboot is used deliberately over `ifreload -a`: this task's own
      # SSH connection is on the interface being reconfigured (DHCP -> static), so
      # reloading it live over that same connection is the riskier path.
      # ansible.builtin.reboot's own wait-and-reconnect logic isn't used here
      # (fire-and-forget shell instead) because it would try to reconnect on the
      # OLD DHCP address afterward, which the node will no longer be answering on
      # once the new static config is up -- that's expected to fail/hang, not a
      # real error. Confirm the new address manually per the message above.
      #
      # This is the ONLY reboot in the whole bootstrap-new-node.yml run -- deferred
      # to here, after the entire site.yml chain, rather than immediately after the
      # identity rename, because nothing in that chain actually needs the node's
      # final IP/hostname to already be live (checked 2026-07-12; see this file's
      # own header/changelog for the one real exception, already fixed). See
      # feedback_no_premature_reboots in this project's history for why this
      # matters generally, not just here.
      ansible.builtin.shell: sleep 2 && reboot
      async: 1
      poll: 0
      ignore_errors: true
