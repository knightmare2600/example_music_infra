# /etc/zabbix/zabbix_agentd.d/proxmox-nic-guard.conf
# (or /etc/zabbix/zabbix_agent2.d/ for Zabbix Agent 2)
#
# Drop this file into the agent's Include= directory, then restart the agent:
#   systemctl restart zabbix-agent   # classic agent
#   systemctl restart zabbix-agent2  # agent 2
#
# ──────────────────────────────────────────────────────────────────────────────
# FILE PERMISSIONS
# The NIC guard script writes /var/log/proxmox-replica-nic-guard.json as root
# but chmodded 644, so the zabbix user can read it without sudo or ACL changes.
# ──────────────────────────────────────────────────────────────────────────────
#
# The Zabbix template uses the built-in passive item key:
#   vfs.file.contents[/var/log/proxmox-replica-nic-guard.json]
#
# No custom UserParameter is required.  This file is provided as a place to
# document that decision and to restrict the allowed file path if your
# AllowKey= policy needs it.

# If you are running Zabbix Agent 2 with a strict AllowKey policy, uncomment:
# AllowKey=vfs.file.contents[/var/log/proxmox-replica-nic-guard.json]

# Increase the buffer for large JSON reports (default 128 KB is usually enough,
# but adjust upward if you have many replicated VMs).
# BufferSize=256
