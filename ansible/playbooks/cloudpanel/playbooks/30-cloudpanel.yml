---
# =============================================================================
# playbooks/30-cloudpanel.yml
# Example Music Limited — CloudPanel install
# =============================================================================
# Ansible conversion of install.sh's setupCloudPanel() + showSuccessMessage().
#
# ONE DELIBERATE DEVIATION from the original script, flagged plainly rather
# than silently changed: install.sh's own setIp() calls out to a public
# CloudFront endpoint (https://d3qnd54q8gb3je.cloudfront.net/) purely to learn
# this box's own PUBLIC IP, for display in the final access-URL message --
# CloudPanel itself never uses that value for anything functional (it binds
# 0.0.0.0:8443 regardless). On this estate (jukebox.internal, VRK/WAN
# addressing, no public-facing boxes by default) that's both the wrong
# address to show AND an unnecessary external dependency for a cosmetic
# message. Uses ansible_host (the address Ansible is actually managing this
# box over) instead -- say if a different address should be shown here.
#
# Usage:
#   ansible-playbook -i configs/inventory playbooks/cloudpanel/playbooks/30-cloudpanel.yml --limit <host>
#
# Tags: install
# =============================================================================
# Changelog:
#   2026-10-19  Real live bug, found testing the db:show:master-credentials gap
#               (project_cloudpanel_static_ip): DB_ENGINE was never passed to the
#               package install, so cloudpanel's own postinst silently no-op'd every
#               engine-specific setup step (config.sql, datadir relocation) for
#               EVERY engine, not just MYSQL_8.4 as originally suspected. Confirmed
#               directly from /var/log/apt/term.log on a real install: "Database
#               Engine  not supported." (empty $DB_ENGINE). Fixed by adding
#               DB_ENGINE: "{{ cloudpanel_db_engine }}" to the install task's
#               environment. See the task's own comment for the full detail.
#   2026-10-07  Initial file. Converted from CloudPanel's own install.sh,
#               Robert's ask.
# =============================================================================

- name: CloudPanel — Install
  hosts: cloudpanel_servers
  become: true
  gather_facts: true

  tasks:

    # BUG FIX 2026-10-19 (found live on a fresh EXACLPCLD001 rebuild, testing the
    # MYSQL_8.4 db:show:master-credentials gap from project_cloudpanel_static_ip):
    # DB_ENGINE was never passed to the package install at all. cloudpanel's own
    # postinst maintainer script reads $DB_ENGINE from its environment with no
    # default (`case $DB_ENGINE in ... *) echo "Database Engine $DB_ENGINE not
    # supported." ;; esac`) -- confirmed directly from /var/log/apt/term.log on
    # the real install: "Database Engine  not supported." (note the double
    # space -- $DB_ENGINE was genuinely empty). This silently skipped EVERY
    # engine-specific setup step (config.sql's root@127.0.0.1 creation, the
    # datadir relocation to /home/mysql/, mysqld.cnf) regardless of
    # cloudpanel_db_engine's value -- MySQL was left on its stock default
    # (datadir /var/lib/mysql/, root@localhost via auth_socket only), which is
    # why db:show:master-credentials found nothing to show for EVERY engine
    # tested so far, not just MYSQL_8.4/percona_release_deb as originally
    # suspected. The real gap was here, not in CloudPanel's own 8.4 support.
    - name: "[Install] Install CloudPanel"
      ansible.builtin.apt:
        name: cloudpanel
        state: present
        dpkg_options: "force-overwrite"
      environment:
        DEBIAN_FRONTEND: noninteractive
        DB_ENGINE: "{{ cloudpanel_db_engine }}"
      tags: install

    - name: "[Install] Assert CloudPanel is actually listening on 8443"
      ansible.builtin.wait_for:
        port: 8443
        state: started
        timeout: 60
      tags: install

    - name: "[Install] Show access URL"
      debug:
        msg:
          - "The installation of CloudPanel is complete!"
          - "CloudPanel can be accessed now: https://{{ ansible_host | default(inventory_hostname) }}:8443"
      tags: install
