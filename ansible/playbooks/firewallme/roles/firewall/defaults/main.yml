---
# =============================================================================
# roles/firewall/defaults/main.yml
# Example Music Limited — Firewall role default variables
# =============================================================================
# Override any of these in group_vars, host_vars, or -e at runtime.
# Changelog:
#   2026-08-13  Added fw_noninteractive -- Robert's batch-run ask (backlog item, picked
#               up this date): "vars_prompt do it now" already made 00_preflight_3_ask.yml's
#               ~20 pause tasks skippable per-prompt via fw_<name>_override extra-vars; this
#               flag additionally skips every prompt that HAS a safe computed default without
#               needing an override typed out per host. Three deliberate exceptions, none
#               silenced by this flag -- Robert's explicit calls, all 2026-08-13:
#                 1. WAN mode's noninteractive default is STATIC, not the interactive
#                    default of DHCP -- see 00_preflight_3_ask.yml's "[Ask] Set WAN mode
#                    from prompt" task.
#                 2. A hub pubkey that differs from the known-good key on file is NEVER
#                    auto-accepted -- the play fails loudly instead of silently trusting a
#                    possibly-rebuilt or MITM'd hub.
#                 3. WireGuard keys are NEVER generated automatically for a hub bootstrap --
#                    the play fails loudly and tells the operator to run interactively (or
#                    pass -e fw_hub_bootstrap_override=CONFIRM as a deliberate, explicit
#                    opt-in) rather than ever bootstrapping silently.
#               The CLD black-site CONFIRM and the final apply confirmation (not part of
#               this role -- see 00_preflight_5_confirm.yml) are untouched by this flag
#               entirely, same as before -- always interactive, no override exists for
#               either.
#   2026-07-28  fw_ssh_password_auth_enabled default flipped false -> true, Robert's explicit
#               call -- password auth now on by default for every firewall run, opt out per
#               run with -e fw_ssh_password_auth_enabled=false. Shipped default-false the same
#               day, a few hours earlier, before this follow-up ask.
#   2026-06-20  Initial file
#   2026-06-26  Add sites_csv_path default for dynamic wg_site_octets loading
# =============================================================================

# Batch/unattended mode -- when true, every 00_preflight_3_ask.yml prompt that has a safe
# computed default is skipped and that default used, instead of pausing. Does NOT touch the
# CLD black-site CONFIRM or the final apply confirmation (00_preflight_5_confirm.yml) -- those
# stay interactive always. Does NOT auto-accept a mismatched hub pubkey or auto-bootstrap a
# hub's WireGuard keys either -- both fail the play loudly instead, since neither has a safe
# default to silently pick. See this file's 2026-08-13 changelog entry above for the full list.
# Per-prompt overrides (fw_<name>_override extra-vars, see 00_preflight_3_ask.yml's own header)
# work independently of this flag, interactive or not.
fw_noninteractive: false

# Path to sites.csv on the Ansible control node.
# Used by 00_preflight_1_derive.yml to build wg_site_octets at runtime.
# Override with -e sites_csv_path=/path/to/sites.csv if needed.
sites_csv_path: "/etc/example-music/sites.csv"

# WAN mode — dhcp or static. 'static' derives IP from site octet convention.
fw_wan_mode: "dhcp"

# Whether to activate WAN during the playbook run.
# Set false when running over SSH on the WAN interface to avoid dropping session.
fw_wan_activate: false

# WireGuard role — hub-primary, hub-regional, spoke, none
# Derived from SITE_DEFAULT_ROLE in sites.csv where possible; override here.
fw_wg_role: "spoke"

# WireGuard listen port (hubs only)
fw_wg_port: 51820

# Whether WAN SSH (port 22) is permitted through nftables
fw_wan_ssh_enabled: false

# Source IP restriction for WAN SSH (empty = allow all)
fw_wan_ssh_src: ""

# Whether sshd accepts password/keyboard-interactive auth at all, on top of
# key auth. TRUE (PasswordAuthentication yes) by Robert's explicit call,
# 2026-07-28 -- applies to every firewall run unless a specific run
# overrides it with -e fw_ssh_password_auth_enabled=false. Originally shipped
# default-false/opt-in-true the same day; Robert then asked to flip the
# default itself, so this now needs an explicit =false per run to get
# key-only PasswordAuthentication no. See feedback_security_posture_is_roberts_call
# in project memory -- this default is his call, not mine, and he's made it.
fw_ssh_password_auth_enabled: true

# Central BIND9 DNS server (EXADNSVRK001) and internet fallback (Quad9, survives
# a CLD/VRK outage) — set as facts in 00_preflight_1_derive.yml from site_services.yml
# (ansible/configs/inventory/group_vars/all/site_services.yml, generated from devices.csv), not
# hardcoded here. No default needed — always set before use.

# Ansible/PXE server last octet on the LAN subnet (default: 15)
fw_ansible_octet: 15

# Environment (production / staging / development)
# Resolved from an already-deployed nodeinfo.json if present, else prompted --
# see ansible/tasks/nodeinfo_environment.yml. This default is a fallback only.
fw_environment: "production"

# Black-site flag — set automatically when site code is CLD.
# Adds extra confirmation prompts and disables WireGuard.
fw_is_black_site: false

# Package list — mirrors firewallme.sh BOOTSTRAP_PKGS logic
fw_packages:
  - network-manager
  - nftables
  - iproute2
  - procps
  - conntrack
  - net-tools
  - tmux
  - dnsmasq
  - curl
  - wget
  - wireguard
  - grc
  - gpm
  - nmap
  - tcpdump
  - bc
  - jq
  - vim
  - bash-completion
  - zsh
  - zsh-syntax-highlighting
  - zsh-autosuggestions
  - localepurge
  - cockpit
  - cockpit-networkmanager
  - cockpit-storaged
  - cockpit-packagekit
