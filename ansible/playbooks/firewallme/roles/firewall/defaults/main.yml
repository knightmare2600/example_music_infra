---
# =============================================================================
# roles/firewall/defaults/main.yml
# Example Music Limited — Firewall role default variables
# =============================================================================
# Override any of these in group_vars, host_vars, or -e at runtime.
# Changelog:
#   2026-06-20  Initial file
#   2026-06-26  Add sites_csv_path default for dynamic wg_site_octets loading
# =============================================================================

# Path to sites.csv on the Ansible control node.
# Used by 00_preflight_1_derive.yml to build wg_site_octets at runtime.
# Override with -e sites_csv_path=/path/to/sites.csv if needed.
sites_csv_path: "/etc/example-music/sites.csv"

# WAN mode — dhcp or static. 'static' derives IP from site octet convention.
fw_wan_mode: "dhcp"

# Whether to activate WAN during the playbook run.
# Set false when running over SSH on the WAN interface to avoid dropping session.
fw_wan_activate: false

# WireGuard role — hub-primary, hub-regional, spoke, none
# Derived from SITE_DEFAULT_ROLE in sites.csv where possible; override here.
fw_wg_role: "spoke"

# WireGuard listen port (hubs only)
fw_wg_port: 51820

# Whether WAN SSH (port 22) is permitted through nftables
fw_wan_ssh_enabled: false

# Source IP restriction for WAN SSH (empty = allow all)
fw_wan_ssh_src: ""

# Whether sshd accepts password/keyboard-interactive auth at all, on top of
# the key-only default. FALSE (key-only, PasswordAuthentication no) matches
# real-world security posture and is the default for every firewall. Robert's
# explicit call, 2026-07-28: override to true for test-environment boxes only
# (-e fw_ssh_password_auth_enabled=true) -- never flip this default itself,
# see feedback_security_posture_is_roberts_call in project memory.
fw_ssh_password_auth_enabled: false

# Central BIND9 DNS server (EXADNSVRK001) and internet fallback (Quad9, survives
# a CLD/VRK outage) — set as facts in 00_preflight_1_derive.yml from site_services.yml
# (ansible/configs/inventory/group_vars/all/site_services.yml, generated from devices.csv), not
# hardcoded here. No default needed — always set before use.

# Ansible/PXE server last octet on the LAN subnet (default: 15)
fw_ansible_octet: 15

# Environment (production / staging / development)
# Resolved from an already-deployed nodeinfo.json if present, else prompted --
# see ansible/tasks/nodeinfo_environment.yml. This default is a fallback only.
fw_environment: "production"

# Black-site flag — set automatically when site code is CLD.
# Adds extra confirmation prompts and disables WireGuard.
fw_is_black_site: false

# Package list — mirrors firewallme.sh BOOTSTRAP_PKGS logic
fw_packages:
  - network-manager
  - nftables
  - iproute2
  - procps
  - conntrack
  - net-tools
  - tmux
  - dnsmasq
  - curl
  - wget
  - wireguard
  - grc
  - gpm
  - nmap
  - tcpdump
  - bc
  - jq
  - vim
  - bash-completion
  - zsh
  - zsh-syntax-highlighting
  - zsh-autosuggestions
  - localepurge
  - cockpit
  - cockpit-networkmanager
  - cockpit-storaged
  - cockpit-packagekit
