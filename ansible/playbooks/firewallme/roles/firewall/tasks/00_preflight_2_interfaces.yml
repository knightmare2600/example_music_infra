---
# =============================================================================
# roles/firewall/tasks/00_preflight_2_interfaces.yml
# Example Music Limited — Network interface detection: silent derivation only
# =============================================================================
# Changelog:
#   2026-06-20  Initial file
#   2026-06-20  Colourised prompts — matches firewallme.sh colour scheme
#   2026-07-14  Fixed a real live bug (EXAFWLBRT001): "Detect WAN interface" never
#               found the WAN address despite it genuinely being present, and "lo"
#               wrongly appeared in the interface table. Root cause: ansible.builtin.shell
#               defaults to /bin/sh, which is dash on Debian, not bash -- these loops use
#               bash-only `[[ ]]` test syntax. Under dash, `[[` isn't a builtin; it's run
#               as an external command that doesn't exist, so every `[[ ... ]]` silently
#               evaluates as failed (non-zero). That broke two things at once: the
#               `[[ "$iface" == "lo" ]] && continue` skip-guard never fired (lo never
#               skipped), and the `if [[ -n "$ip_addr" ]]; then ... fi` gate in WAN
#               detection never took its true branch for ANY interface -- so detection
#               always came back empty regardless of what was actually configured. Fixed
#               by pinning these two shell tasks to bash explicitly, rather than rewriting
#               working bash logic to POSIX sh.
#   2026-07-14  Robert: "vars_prompt do it now" -- this file is now PURE DERIVATION
#               (interface listing + WAN auto-detection only). The WAN confirm/override
#               prompt, LAN interface prompt, LAN IP prompts, MAC lookups, and the
#               systemd .link file writes all moved out: prompts to the new
#               00_preflight_3_ask.yml, MAC lookups to 00_preflight_4_post_ask.yml (they need the
#               FINAL interface names, only known once the ask phase's overrides are
#               in), and -- a real pre-existing bug fixed in the process -- the .link
#               file writes moved to 00_preflight_5_confirm.yml, AFTER the "type yes" gate.
#               They used to run here, before that gate, silently contradicting its own
#               "nothing has been written to disk yet" text.
# =============================================================================

- name: "[Interfaces] List all non-loopback interfaces"
  ansible.builtin.shell: |
    ip -o link show | awk -F': ' '{print $2}' | grep -v '^lo$' | grep -v '@'
  register: fw_all_ifaces_raw
  changed_when: false

- name: "[Interfaces] Set interface list fact"
  ansible.builtin.set_fact:
    fw_available_ifaces: "{{ fw_all_ifaces_raw.stdout_lines }}"

- name: "[Interfaces] Detect WAN interface (has 192.168.139.x address)"
  ansible.builtin.shell: |
    for iface in $(ls /sys/class/net/); do
      [[ "$iface" == "lo" ]] && continue
      ip_addr=$(ip -4 addr show "$iface" 2>/dev/null | grep -oP '(?<=inet\s)192\.168\.139\.\d+' | head -1)
      if [[ -n "$ip_addr" ]]; then
        echo "${iface}|${ip_addr}|$(cat /sys/class/net/${iface}/address 2>/dev/null)"
        break
      fi
    done
  args:
    executable: /bin/bash
  register: fw_wan_detect_raw
  changed_when: false

- name: "[Interfaces] Set WAN detection facts"
  ansible.builtin.set_fact:
    fw_wan_detected:       "{{ fw_wan_detect_raw.stdout != '' }}"
    fw_wan_iface_detected: "{{ fw_wan_detect_raw.stdout.split('|')[0] if fw_wan_detect_raw.stdout != '' else '' }}"
    fw_wan_ip_detected:    "{{ fw_wan_detect_raw.stdout.split('|')[1] if fw_wan_detect_raw.stdout != '' else '' }}"
    fw_wan_mac_detected:   "{{ fw_wan_detect_raw.stdout.split('|')[2] if fw_wan_detect_raw.stdout != '' else '' }}"

- name: "[Interfaces] Build colourised interface table"
  ansible.builtin.shell: |
    for iface in $(ls /sys/class/net/); do
      [[ "$iface" == "lo" ]] && continue
      mac=$(cat /sys/class/net/${iface}/address 2>/dev/null || echo "??:??:??:??:??:??")
      ip_addr=$(ip -4 addr show "$iface" 2>/dev/null | grep -oP '(?<=inet\s)\d+(\.\d+){3}/\d+' | head -1 || echo "(no address)")
      state=$(cat /sys/class/net/${iface}/operstate 2>/dev/null || echo "unknown")
      echo "    \033[0;36m${iface}\033[0m  ${mac}  ${ip_addr}  ${state}"
    done
  args:
    executable: /bin/bash
  register: fw_iface_table
  changed_when: false

- name: "[Interfaces] Display interface table"
  ansible.builtin.debug:
    msg: "{{ fw_iface_table.stdout_lines }}"
