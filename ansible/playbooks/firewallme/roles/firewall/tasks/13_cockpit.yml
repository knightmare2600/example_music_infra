---
# =============================================================================
# roles/firewall/tasks/13_cockpit.yml
# Example Music Limited — Cockpit web management console
# =============================================================================
# Mirrors firewallme.sh Cockpit section: enable socket, write self-signed
# cert, restrict to LAN only (nftables already covers this).
# Changelog:
#   2026-06-20  Initial file
#   2026-07-24  Robert: this file never actually restricted the socket bind itself, unlike
#               firewallme.sh's own cockpit.socket.d/override.conf (ListenStream={{ fw_lan_ip
#               }}:9090). Not previously causing a visible failure -- the stock unit binds
#               wildcard (0.0.0.0:9090), which can't hit "Cannot assign requested address"
#               the way dnsmasq's specific-IP bind did, and nftables already blocks WAN
#               access to 9090 regardless -- but the socket itself wasn't enforcing LAN-only
#               the way the shell script's version does. Added the same drop-in, matching
#               firewallme.sh exactly (no ExecStartPre poll needed here -- the shell script's
#               own version relies on NetworkManager-wait-online.service ordering plus
#               Restart=on-failure alone, not the extra poll dnsmasq's boot-time race needed).
# =============================================================================

- name: "[Cockpit] Enable cockpit.socket"
  ansible.builtin.systemd:
    name: cockpit.socket
    enabled: true
    state: started

- name: "[Cockpit] Create cockpit.socket systemd drop-in directory"
  ansible.builtin.file:
    path: /etc/systemd/system/cockpit.socket.d
    state: directory
    mode: '0755'

- name: "[Cockpit] Write cockpit.socket LAN-only bind drop-in"
  ansible.builtin.copy:
    dest: /etc/systemd/system/cockpit.socket.d/override.conf
    mode: '0644'
    content: |
      [Unit]
      After=network-online.target NetworkManager-wait-online.service
      Wants=network-online.target

      [Socket]
      ListenStream=
      ListenStream={{ fw_lan_ip }}:9090
      Restart=on-failure
      RestartSec=5s
  notify: restart cockpit

- name: "[Cockpit] Reload systemd daemon after drop-in"
  ansible.builtin.systemd:
    daemon_reload: true

- name: "[Cockpit] Write cockpit.conf (no TLS redirect, LAN only)"
  ansible.builtin.copy:
    dest: /etc/cockpit/cockpit.conf
    mode: '0644'
    content: |
      # Example Music Limited — Cockpit config
      # Written by Ansible firewall role
      [WebService]
      Origins = https://{{ inventory_hostname }}:9090 https://{{ fw_lan_ip }}:9090
      ProtocolHeader = X-Forwarded-Proto
      LoginTitle = Example Music — {{ inventory_hostname }}
      [Session]
      IdleTimeout = 30
  notify: restart cockpit

- name: "[Cockpit] Generate self-signed cert for Cockpit"
  ansible.builtin.shell: |
    mkdir -p /etc/cockpit/ws-certs.d
    openssl req -newkey rsa:4096 -nodes -keyout /etc/cockpit/ws-certs.d/0-self-signed.key \
      -x509 -days 3650 \
      -subj "/CN={{ inventory_hostname }}/O=Example Music Limited/C=GB" \
      -out /etc/cockpit/ws-certs.d/0-self-signed.cert
    chmod 0640 /etc/cockpit/ws-certs.d/0-self-signed.key
    chmod 0644 /etc/cockpit/ws-certs.d/0-self-signed.cert
  args:
    creates: /etc/cockpit/ws-certs.d/0-self-signed.cert

- name: "[Cockpit] Flush handlers"
  ansible.builtin.meta: flush_handlers

- name: "[Cockpit] Verify Cockpit is listening"
  ansible.builtin.shell: ss -tlnp | grep ':9090'
  register: cockpit_listen
  changed_when: false
  failed_when: false

- name: "[Cockpit] Show Cockpit status"
  ansible.builtin.debug:
    msg: "{{ cockpit_listen.stdout_lines if cockpit_listen.stdout_lines else ['Cockpit not yet listening — may need a moment'] }}"
