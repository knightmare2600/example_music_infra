---
# =============================================================================
# roles/firewall/tasks/00_preflight_3_ask.yml
# Example Music Limited — Every operator prompt, back-to-back, nothing written yet
# =============================================================================
# Robert, 2026-07-14: "vars_prompt do it now." Ansible's native play-level
# vars_prompt: can't be used literally here -- it runs before any task executes,
# so it has no access to facts this role derives at runtime (site octet from
# sites.csv, auto-detected WAN interface, derived static IP, etc.), and several
# prompts below need exactly those as their displayed defaults. Same practical
# effect achieved instead by phase separation across the whole role:
#
#   00_preflight_1_derive.yml / 00_preflight_2_interfaces.yml -- derive every fact
#                                             silently, no prompts
#   00_preflight_3_ask.yml (this file)     -- every operator prompt, back-to-back
#   00_preflight_4_post_ask.yml            -- derive whatever depends on the answers
#   00_preflight_5_confirm.yml             -- ONE consolidated review + ONE confirm,
#                                             then (only after "yes") the first write
#   05_packages.yml onward                 -- the apply chain, runs uninterrupted
#
# All five 00_preflight_* files share that name because they're genuinely one
# phase -- nothing happens until the operator has confirmed -- not five separate
# pipeline stages. Renamed 2026-07-14 after Robert pointed out the original
# 00/01/02/03/04 numbering implied otherwise ("how many airlines check stuff
# AFTER takeoff, not before?").
#
# This file used to be roles/firewall/tasks/02_wan_config.yml, absorbing prompts
# that used to live in 00_preflight.yml (environment resolution, CLD black-site
# confirm), 01_interfaces.yml (WAN/LAN interface confirmation, LAN IP choice),
# and 03_wireguard_config.yml (WireGuard role/tunnel/hub prompts) -- nothing here
# is new logic, every task below is unchanged from wherever it used to live,
# only relocated and reordered so the operator answers everything in one
# uninterrupted pass instead of derive/prompt/derive/prompt throughout the run.
#
# Original changelogs (preserved for history):
#   2026-06-20  Initial file(s)
#   2026-06-20  Colourised prompts — matches firewallme.sh colour scheme
#   2026-06-26  Load wg_site_octets dynamically from sites.csv at runtime
#   2026-06-29  Remove duplicate LAN IP prompt — fw_lan_ip is set in 01_interfaces.yml
#   2026-07-16  Robert: "vars_prompt do it now" (again — the 2026-07-14 restructure
#               above never actually switched to it, just made pause tasks back-to-
#               back). WAN SSH enable and WAN activation moved to real vars_prompt in
#               90-firewall.yml — they're the only two prompts in this file that are
#               both unconditional (no when: clause, asked identically for CLD and
#               every other site) and need no runtime-derived default. Every other
#               prompt below stays pause-based: environment/WAN-interface/LAN-interface
#               need a live task's result as their default or content; LAN IP choice,
#               WAN mode, WireGuard role, and all hub/spoke prompts are when:-gated on
#               an earlier answer or fw_is_black_site; the hub-pubkey confirm needs a
#               live SSH fetch's result. vars_prompt runs before any task executes, so
#               none of that is available to it, and it can't skip a question
#               conditionally either way. Also, per Robert: every boxed prompt now
#               gets a blank line before its top border (was gluing directly onto the
#               "[role : task name]" line pause itself prints), and every prompt whose
#               closing question was split onto its own line after a blank gap now
#               has it folded onto the preceding line instead.
#   2026-07-18  WireGuard hub bootstrap plan, items 2-4: general WG-role prompt no
#               longer accepts hub-primary/hub-regional (CLD is the only hub, forced
#               separately below) -- stale FAL/ODE/BRK help text and black-site banner
#               line fixed too. Added hub-bootstrap detection (stat existing private
#               key) and a CLD-only CONFIRM prompt, mirroring windows_dc's
#               dc_is_forest_root guard -- consumed by 09_wireguard_deploy.yml to
#               actually run key generation/wg0.conf write for a from-scratch hub.
#   2026-07-24  Robert, live (EXAFWLBRT001): "[Hub register] Live-add peer via wg set"
#               failed with a non-zero exit. Traced back to fw_wg_tunnel_ip holding an
#               invalid value at the point the hub tunnel-IP/spoke tunnel-IP prompts were
#               answered -- unlike almost every other risky prompt in this file (WAN static
#               IP, CLD LAN IP), neither "[Ask] Set hub WG facts" nor "[Ask] Set spoke
#               tunnel IP" had any validation at all; whatever string was entered went
#               straight through, unchecked, all the way to a live `wg set ... allowed-ips
#               {{ fw_wg_tunnel_ip }}/32` command on the hub (10_register_spoke_on_hub.yml)
#               where it finally failed loudly instead of being caught at the point of bad
#               input. Added validation to both, matching the CLD LAN IP pattern
#               ("is match(...)", not regex_search() -- see that task's own 2026-07-24 note
#               on why).
#   2026-08-13  Batch-run + prompt-defaults feature (backlog item, picked up this date).
#               Every prompt below now supports two independent escape hatches, checked in
#               this order:
#                 1. fw_<name>_override extra-var (e.g. -e fw_wan_mode_override=static) --
#                    skips just that one prompt, uses the supplied value directly, works
#                    whether or not fw_noninteractive is set. Lets an operator pre-answer one
#                    known-constant question without going fully unattended.
#                 2. fw_noninteractive=true (see roles/firewall/defaults/main.yml) -- skips
#                    every prompt that has a safe computed default and uses that default,
#                    same value Enter would already give interactively.
#               Three prompts have NO safe default and are deliberately excluded from (2) --
#               each fails the play loudly instead of guessing, Robert's explicit calls, all
#               2026-08-13:
#                 - WAN mode: noninteractive default is STATIC, not DHCP (DHCP is the
#                   interactive default, kept as-is for a human pressing Enter -- an
#                   unattended batch run must not silently pick an address that can change
#                   under it).
#                 - Hub pubkey mismatch against the known-good key on file -- never
#                   auto-accepted, possible hub rebuild or worse, needs a human or an
#                   explicit fw_wg_hub_pubkey_override.
#                 - Hub WireGuard bootstrap (generating a fresh keypair from scratch) --
#                   never automatic, needs a human or an explicit
#                   fw_hub_bootstrap_override=CONFIRM.
#               The CLD black-site CONFIRM further up this file is untouched by any of this
#               -- always interactive, no override, same as before.
# =============================================================================

# ── Environment (was 00_preflight.yml) ───────────────────────────────────────
# Resolved from an already-deployed nodeinfo.json if present, else prompted --
# see ansible/tasks/nodeinfo_environment.yml (replaced the old standalone
# /etc/.environment file 2026-07-10; fw_environment kept as the local alias
# since 00_preflight_5_confirm.yml/07_nftables.yml/11_ssh_hardening.yml/
# 14_finish.yml all already reference it by this name).

- name: "[Ask] Resolve environment"
  ansible.builtin.include_tasks: ../../../../../tasks/nodeinfo_environment.yml

- name: "[Ask] Set fw_environment"
  ansible.builtin.set_fact:
    fw_environment: "{{ resolved_environment }}"

# ── Black-site extra confirmation (was 00_preflight.yml) ─────────────────────

- name: "[Ask] BLACK SITE — CLD extra confirmation"
  ansible.builtin.pause:
    prompt: |-

      {{ _c.R }}
      ╔══════════════════════════════════════════════════════════════╗
      ║  *** BLACK SITE — CLD PROVISIONING NETWORK ***               ║
      ║                                                              ║
      ║  This is EXAFWLCLD001 — the cloud management hub firewall.   ║
      ║  This device carries ALL site provisioning traffic.          ║
      ║                                                              ║
      ║  Extra precautions apply:                                    ║
      ║    - WireGuard: hub (every other site peers with this one)   ║
      ║    - WAN 192.168.139.69 (EXAFWLVRK001) / LAN 192.168.69.x    ║
      ║      (free-form)                                             ║
      ║    - Static WAN IP is mandatory                              ║
      ║    - All changes require explicit confirmation               ║
      ╚══════════════════════════════════════════════════════════════╝
      {{ _c.NC }}
      Type CONFIRM to proceed, anything else to abort
  register: fw_black_site_confirm
  when: fw_is_black_site

- name: "[Ask] ABORT — black-site confirmation not given"
  ansible.builtin.fail:
    msg: "{{ _c.R }}[ERROR]{{ _c.NC }} CLD black-site setup aborted."
  when:
    - fw_is_black_site
    - fw_black_site_confirm.user_input | trim | upper != 'CONFIRM'

- name: "[Ask] Force WG role to hub-regional for CLD"
  ansible.builtin.set_fact:
    fw_wg_role: "hub-regional"
  when: fw_is_black_site

# ── Hub bootstrap detection (2026-07-18) ─────────────────────────────────────
# Mirrors windows_dc's dc_is_forest_root guard: is this the estate's designated
# WireGuard hub, and does it need setting up from scratch? Checked here (not
# just in 09_wireguard_deploy.yml) because the confirmation prompt below needs
# the result, and every other operator prompt lives in this file.

- name: "[Ask] Check for existing hub private key"
  ansible.builtin.stat:
    path: /etc/wireguard/private.key
  register: fw_hub_privkey_stat
  when: fw_is_black_site

- name: "[Ask] Set hub-already-bootstrapped fact"
  ansible.builtin.set_fact:
    fw_hub_already_bootstrapped: "{{ fw_is_black_site and fw_hub_privkey_stat.stat.exists }}"
  when: fw_is_black_site

- name: "[Ask] CONFIRM — bootstrap this hub's WireGuard interface"
  ansible.builtin.pause:
    prompt: >-

      {%- set l1 = "  No existing hub config found on " + inventory_hostname + " (" + fw_site_code + ")" -%}
      {%- set l2 = "  Set it up now? This generates a new keypair and writes" -%}
      {%- set l3 = "  wg0.conf's [Interface] section. Peers are NOT templated --" -%}
      {%- set l4 = "  they're added separately via add-wg-spoke.yml, per spoke." -%}
      {{ _c.Y }}
      ╔══════════════════════════════════════════════════════════════╗
      ║{{ l1 }}{{ ' ' * (62 - l1|length) }}║
      ║{{ ' ' * 62 }}║
      ║{{ l2 }}{{ ' ' * (62 - l2|length) }}║
      ║{{ l3 }}{{ ' ' * (62 - l3|length) }}║
      ║{{ l4 }}{{ ' ' * (62 - l4|length) }}║
      ╚══════════════════════════════════════════════════════════════╝
      {{ _c.NC }}
      Type CONFIRM to bootstrap the hub now, anything else to skip
  register: fw_hub_bootstrap_prompt
  when:
    - fw_is_black_site
    - not fw_hub_already_bootstrapped
    - fw_hub_bootstrap_override is not defined
    - not (fw_noninteractive | default(false) | bool)

- name: "[Ask] ABORT — noninteractive hub bootstrap needs an explicit override"
  ansible.builtin.fail:
    msg: |-
      {{ _c.R }}[ERROR]{{ _c.NC }} This hub has no existing WireGuard keypair, and fw_noninteractive is set.
      WireGuard keys are never generated automatically -- re-run interactively, or pass
      -e fw_hub_bootstrap_override=CONFIRM if you have deliberately decided to bootstrap this hub now.
  when:
    - fw_is_black_site
    - not fw_hub_already_bootstrapped
    - fw_hub_bootstrap_override is not defined
    - fw_noninteractive | default(false) | bool

- name: "[Ask] Set hub-bootstrap-confirmed fact"
  ansible.builtin.set_fact:
    fw_hub_bootstrap_confirmed: >-
      {{ fw_is_black_site and not fw_hub_already_bootstrapped
         and ((fw_hub_bootstrap_override | default(fw_hub_bootstrap_prompt.user_input | default(''))) | trim | upper == 'CONFIRM') }}

- name: "[Ask] Log hub bootstrap decision"
  ansible.builtin.debug:
    msg: >-
      {{ (_c.G + '[+]' + _c.NC + ' Existing hub WireGuard config found — leaving it alone.')
         if fw_hub_already_bootstrapped else
         ((_c.G + '[+]' + _c.NC + ' Hub WireGuard bootstrap CONFIRMED — key generation and wg0.conf write will run.')
          if fw_hub_bootstrap_confirmed else
          (_c.Y + '[!]' + _c.NC + ' Hub WireGuard bootstrap NOT confirmed — this hub still has no tunnel interface.')) }}
  when: fw_is_black_site

# ── WAN interface confirmation (was 01_interfaces.yml) ───────────────────────

- name: "[Ask] Confirm or override WAN interface"
  ansible.builtin.pause:
    prompt: |-
      {{ _c.C }}──────────────────────────────────────────────────────────────{{ _c.NC }}
      {{ _c.C }}[*]{{ _c.NC }} WAN interface is {{ _c.G }}{{ fw_wan_iface_detected }}{{ _c.NC }} ({{ fw_wan_ip_detected }}, MAC: {{ fw_wan_mac_detected }})
      {{ _c.C }}    Connected to 192.168.139.0/24 (provisioning network){{ _c.NC }} — press {{ _c.G }}Enter{{ _c.NC }} to confirm or type a different interface name
  register: fw_wan_override
  when:
    - fw_wan_detected
    - fw_wan_iface_override is not defined
    - not (fw_noninteractive | default(false) | bool)

- name: "[Ask] Prompt for WAN interface (not auto-detected)"
  ansible.builtin.pause:
    prompt: |-
      {{ _c.Y }}[!]{{ _c.NC }} Could not auto-detect WAN interface (no 192.168.139.x address found).
      {{ _c.Y }}[!]{{ _c.NC }} This may mean the provisioning network is not reachable, or DHCP hasn't completed.
      {{ _c.C }}    Available interfaces: {{ fw_available_ifaces | join(', ') }}{{ _c.NC }} — enter the WAN interface name (default: {{ _c.G }}{{ fw_available_ifaces[0] | default('ens33') }}{{ _c.NC }})
  register: fw_wan_manual
  when:
    - not fw_wan_detected
    - fw_wan_iface_override is not defined
    - not (fw_noninteractive | default(false) | bool)

# No safe default exists here -- WAN wasn't auto-detected AND no override was supplied, so a
# noninteractive run has no principled value to pick (fw_available_ifaces[0] is just "first
# available", not necessarily WAN). Fails loud rather than guessing wrong on a live network path.
- name: "[Ask] ABORT — noninteractive with no WAN interface detected or overridden"
  ansible.builtin.fail:
    msg: |-
      {{ _c.R }}[ERROR]{{ _c.NC }} WAN interface could not be auto-detected, fw_noninteractive is set, and no
      fw_wan_iface_override was supplied. No safe default exists for which interface is WAN -- re-run
      interactively, or pass -e fw_wan_iface_override=<iface>.
  when:
    - not fw_wan_detected
    - fw_wan_iface_override is not defined
    - fw_noninteractive | default(false) | bool

- name: "[Ask] Set final WAN interface"
  ansible.builtin.set_fact:
    fw_wan_iface: >-
      {%- if fw_wan_iface_override is defined -%}
        {{ fw_wan_iface_override }}
      {%- elif fw_wan_detected -%}
        {%- set override = fw_wan_override.user_input | default('') | trim -%}
        {{ override if override != '' else fw_wan_iface_detected }}
      {%- else -%}
        {%- set manual = fw_wan_manual.user_input | default('') | trim -%}
        {{ manual if manual != '' else (fw_available_ifaces[0] | default('ens33')) }}
      {%- endif -%}

# ── LAN interface (was 01_interfaces.yml) ────────────────────────────────────

- name: "[Ask] Build LAN candidates"
  ansible.builtin.set_fact:
    fw_lan_candidates: "{{ fw_available_ifaces | reject('equalto', fw_wan_iface) | list }}"

- name: "[Ask] Show remaining interfaces for LAN"
  ansible.builtin.debug:
    msg: "{{ _c.C }}[*]{{ _c.NC }} Remaining interfaces for LAN (WAN {{ fw_wan_iface }} excluded):\n{% for iface in fw_lan_candidates %}    {{ _c.C }}{{ iface }}{{ _c.NC }}\n{% endfor %}"

- name: "[Ask] Prompt for LAN interface"
  ansible.builtin.pause:
    prompt: "Enter the LAN interface name (default: {{ _c.G }}{{ fw_lan_candidates[0] | default('ens34') }}{{ _c.NC }})"
  register: fw_lan_prompt
  when:
    - fw_lan_iface_override is not defined
    - not (fw_noninteractive | default(false) | bool)

- name: "[Ask] Set final LAN interface"
  ansible.builtin.set_fact:
    fw_lan_iface: >-
      {%- if fw_lan_iface_override is defined -%}
        {{ fw_lan_iface_override }}
      {%- else -%}
        {%- set inp = fw_lan_prompt.user_input | default('') | trim -%}
        {{ inp if inp != '' else (fw_lan_candidates[0] | default('ens34')) }}
      {%- endif -%}

- name: "[Ask] FAIL — LAN and WAN cannot be the same"
  ansible.builtin.fail:
    msg: "{{ _c.R }}[ERROR]{{ _c.NC }} LAN and WAN cannot be the same interface."
  when: fw_lan_iface == fw_wan_iface

# ── LAN IP — standard sites — now derived, not asked (00_preflight_1_derive.yml) ──
# Robert, 2026-07-17: this used to ask the operator to pick .1 or .253 -- but .1 is
# not a valid firewall LAN IP at all (it's EXARTR<SITE>001, the upstream router;
# see docs/site-inventory.md and docs/bootstrap/bootstrapping.md). The real
# convention is fixed by the hostname's instance number (001=.253, 002=.254), so
# it's derived silently in 00_preflight_1_derive.yml instead. Left the original
# prompt commented out rather than deleted, in case a genuine free-choice need
# ever comes up -- fw_lan_ip_1/fw_lan_ip_253 are still derived in that file for
# exactly that reason.
#
# - name: "[Ask] Prompt for LAN IP (.1 or .253)"
#   ansible.builtin.pause:
#     prompt: |-
#       {{ _c.C }}  → {{ fw_site_code }}: subnet {{ fw_subnet }}.0/24{{ _c.NC }}
#       {{ _c.C }}  → WG tunnel 10.0.{{ fw_site_octet }}.0/24{{ _c.NC }}
#
#       Use {{ _c.G }}.1{{ _c.NC }}  ({{ fw_lan_ip_1 }})   — primary internet gateway
#       Use {{ _c.G }}.253{{ _c.NC }} ({{ fw_lan_ip_253 }}) — secondary internet gateway — enter {{ _c.G }}1{{ _c.NC }} or {{ _c.G }}253{{ _c.NC }}
#   register: fw_lan_octet_prompt
#   when: not fw_is_black_site
#
# - name: "[Ask] Validate LAN IP choice"
#   ansible.builtin.assert:
#     that:
#       - fw_lan_octet_prompt.user_input | trim in ['1', '253']
#     fail_msg: "{{ _c.R }}[ERROR]{{ _c.NC }} Invalid choice — enter 1 or 253."
#   when: not fw_is_black_site
#
# - name: "[Ask] Set LAN IP"
#   ansible.builtin.set_fact:
#     fw_lan_ip: "{{ fw_subnet }}.{{ fw_lan_octet_prompt.user_input | trim }}"
#   when: not fw_is_black_site

# ── LAN IP — CLD black site (LAN is on a different subnet, free-form entry) ──
# Default (2026-07-24) derived from sites.csv's own CLD row (Gateway column) rather than a
# blank free-text prompt -- CLD's LAN IP is a known, derivable value (matches devices.csv/DNS),
# same "show the known value, Enter to accept" pattern already used a few tasks below for WAN
# IP. Robert: "in a number of cases you already know... the answer... instead of outright
# prompting, give sensible defaults."

- name: "[Ask] CLD: look up known LAN IP from sites.csv"
  ansible.builtin.set_fact:
    fw_cld_lan_ip_default: "{{ (_sites_csv_raw.list | selectattr('Site', 'equalto', fw_site_code) | list | first | default({})).Gateway | default('') }}"
  when: fw_is_black_site

- name: "[Ask] CLD: prompt for LAN IP (not on fw_subnet — enter full IP)"
  ansible.builtin.pause:
    prompt: |-
      {{ _c.C }}  *** CLD BLACK SITE ***{{ _c.NC }}
      {{ _c.C }}  LAN is not on {{ fw_subnet }}.0/24 — enter the full LAN IP.{{ _c.NC }}
      {{ _c.C }}  Known value from sites.csv: {{ _c.G }}{{ fw_cld_lan_ip_default | default('none on record') }}{{ _c.NC }} — press Enter to accept or type a different IP
  register: fw_cld_lan_ip_prompt
  when:
    - fw_is_black_site
    - fw_cld_lan_ip_override is not defined
    - not (fw_noninteractive | default(false) | bool)

# No extra noninteractive fail-loud task needed here -- "[Ask] CLD: validate LAN IP" just
# below already fails cleanly if fw_cld_lan_ip_default was blank (no sites.csv value on
# record), same outcome as every other "no safe default" case in this file.
- name: "[Ask] CLD: resolve final LAN IP (prompt answer, or sites.csv default if blank)"
  ansible.builtin.set_fact:
    fw_cld_lan_ip_resolved: >-
      {%- if fw_cld_lan_ip_override is defined -%}{{ fw_cld_lan_ip_override }}
      {%- else -%}
      {%- set inp = fw_cld_lan_ip_prompt.user_input | default('') | trim -%}
      {{ inp if inp != '' else fw_cld_lan_ip_default }}
      {%- endif -%}
  when: fw_is_black_site

- name: "[Ask] CLD: validate LAN IP"
  ansible.builtin.assert:
    that:
      # BUG FIX (2026-07-24, found live): regex_search() is a filter that returns the
      # matched substring (or None), not a boolean -- ansible-core strictly requires a real
      # boolean result here and fails outright the moment a valid IP is actually entered
      # ("Conditional result (True) was derived from value of type 'str'"), the opposite of
      # what this check is supposed to gate on. `is match(...)` is the correct Jinja test for
      # a boolean regex result.
      - fw_cld_lan_ip_resolved is match('^(\d{1,3}\.){3}\d{1,3}$')
    fail_msg: "{{ _c.R }}[ERROR]{{ _c.NC }} Enter a valid IPv4 address (sites.csv had no known value to default to)."
  when: fw_is_black_site

- name: "[Ask] CLD: set LAN IP fact"
  ansible.builtin.set_fact:
    fw_lan_ip: "{{ fw_cld_lan_ip_resolved }}"
  when: fw_is_black_site

# ── WAN mode (was 02_wan_config.yml) ──────────────────────────────────────────

- name: "[Ask] BLACK SITE — force static WAN for CLD"
  ansible.builtin.set_fact:
    fw_wan_mode: "static"
  when: fw_is_black_site

- name: "[Ask] Show WAN IP convention"
  ansible.builtin.debug:
    msg:
      - "{{ _c.C }}[*]{{ _c.NC }} WAN IP convention: {{ _c.C }}192.168.139.<site-octet>{{ _c.NC }}"
      - "{{ _c.C }}[*]{{ _c.NC }} Derived for {{ fw_site_code }}: {{ _c.G }}192.168.139.{{ fw_site_octet }}{{ _c.NC }}"
      - "{{ _c.C }}[*]{{ _c.NC }} Default: DHCP (use static if this node has a reserved provisioning IP){{ _c.NC }}"

- name: "[Ask] Prompt for WAN mode (non-CLD)"
  ansible.builtin.pause:
    prompt: |-

      {{ _c.C }}╔══════════════════════════════════════════════════════╗{{ _c.NC }}
      {{ _c.C }}║              WAN Interface Configuration             ║{{ _c.NC }}
      {{ _c.C }}╚══════════════════════════════════════════════════════╝{{ _c.NC }}

      WAN mode — {{ _c.G }}DHCP{{ _c.NC }} or {{ _c.G }}static{{ _c.NC }}? [DHCP/static] (default: DHCP)
  register: fw_wan_mode_prompt
  when:
    - not fw_is_black_site
    - fw_wan_mode_override is not defined
    - not (fw_noninteractive | default(false) | bool)

# Robert, 2026-08-13: noninteractive's default is STATIC, deliberately NOT the same default
# (DHCP) a human pressing Enter gets -- an unattended batch run must not silently pick an
# address that can change under it. fw_wan_mode_override always wins outright either way,
# interactive or not, so a batch run that genuinely wants DHCP everywhere still can with
# -e fw_wan_mode_override=dhcp.
- name: "[Ask] Set WAN mode from prompt"
  ansible.builtin.set_fact:
    fw_wan_mode: >-
      {%- if fw_wan_mode_override is defined -%}
        {{ 'static' if fw_wan_mode_override | lower | trim == 'static' else 'dhcp' }}
      {%- elif fw_noninteractive | default(false) | bool -%}
        static
      {%- else -%}
        {{ 'static' if fw_wan_mode_prompt.user_input | default('') | lower | trim == 'static' else 'dhcp' }}
      {%- endif -%}
  when: not fw_is_black_site

- name: "[Ask] Log DHCP selection"
  ansible.builtin.debug:
    msg: "{{ _c.G }}[+]{{ _c.NC }} WAN: DHCP"
  when: fw_wan_mode == 'dhcp'

# ── Static WAN ────────────────────────────────────────────────────────────────

- name: "[Ask] Set static WAN defaults"
  ansible.builtin.set_fact:
    fw_wan_static_gw:     "192.168.139.254"
    fw_wan_static_prefix: "24"
  when: fw_wan_mode == 'static'

- name: "[Ask] Confirm derived static WAN IP"
  ansible.builtin.pause:
    prompt: |-
      {{ _c.C }}[*]{{ _c.NC }} Derived static WAN IP: {{ _c.G }}{{ fw_wan_static_ip }}/24{{ _c.NC }} gw {{ _c.G }}{{ fw_wan_static_gw }}{{ _c.NC }}
      {{ _c.C }}    This is EXAFWL{{ fw_site_code }}001-wan's reserved address per DNS/devices.csv{{ _c.NC }}
      {{ _c.C }}    (192.168.139.<site-octet> is this site's fixed convention, not guessed) — press {{ _c.G }}Enter{{ _c.NC }} to accept or type a different IP{{ _c.NC }}
  register: fw_wan_ip_override
  when:
    - fw_wan_mode == 'static'
    - fw_wan_static_ip_override is not defined
    - not (fw_noninteractive | default(false) | bool)

- name: "[Ask] Prompt to override static WAN gateway"
  ansible.builtin.pause:
    prompt: "{{ _c.C }}[*]{{ _c.NC }} WAN gateway [{{ _c.G }}{{ fw_wan_static_gw }}{{ _c.NC }}]"
  register: fw_wan_gw_override
  when:
    - fw_wan_mode == 'static'
    - fw_wan_static_gw_override is not defined
    - not (fw_noninteractive | default(false) | bool)

- name: "[Ask] Set final static WAN IP and GW"
  ansible.builtin.set_fact:
    fw_wan_static_ip: >-
      {%- if fw_wan_static_ip_override is defined -%}{{ fw_wan_static_ip_override }}
      {%- else -%}
      {%- set ov = fw_wan_ip_override.user_input | default('') | trim -%}
      {{ ov if ov != '' else fw_wan_static_ip }}
      {%- endif -%}
    fw_wan_static_gw: >-
      {%- if fw_wan_static_gw_override is defined -%}{{ fw_wan_static_gw_override }}
      {%- else -%}
      {%- set ov = fw_wan_gw_override.user_input | default('') | trim -%}
      {{ ov if ov != '' else fw_wan_static_gw }}
      {%- endif -%}
  when: fw_wan_mode == 'static'

- name: "[Ask] Log static WAN confirmed"
  ansible.builtin.debug:
    msg: "{{ _c.G }}[+]{{ _c.NC }} WAN: static {{ fw_wan_static_ip }}/24 gw {{ fw_wan_static_gw }}"
  when: fw_wan_mode == 'static'

# ── Ansible/PXE server ────────────────────────────────────────────────────────

- name: "[Ask] Prompt for Ansible/PXE server octet"
  ansible.builtin.pause:
    prompt: "{{ _c.C }}[*]{{ _c.NC }} Ansible/PXE server IP (last octet or full IP) — derived: {{ _c.G }}{{ fw_ansible_ip }}{{ _c.NC }}, press Enter to accept"
  register: fw_ansible_prompt
  when:
    - fw_ansible_ip_override is not defined
    - not (fw_noninteractive | default(false) | bool)

- name: "[Ask] Set Ansible IP"
  ansible.builtin.set_fact:
    fw_ansible_ip: >-
      {%- if fw_ansible_ip_override is defined -%}{{ fw_ansible_ip_override }}
      {%- else -%}
      {%- set inp = fw_ansible_prompt.user_input | default('') | trim -%}
      {%- if inp == '' -%}{{ fw_ansible_ip }}
      {%- elif inp | regex_search('^\d{1,3}$') -%}{{ fw_subnet }}.{{ inp }}
      {%- else -%}{{ inp }}
      {%- endif -%}
      {%- endif -%}

# ── WAN SSH ───────────────────────────────────────────────────────────────────
# Asked as a real vars_prompt in 90-firewall.yml (fw_wan_ssh_answer) — unconditional,
# no runtime-derived default, one of only two prompts in this whole file that
# qualifies (see this file's 2026-07-16 changelog entry above). vars_prompt itself has
# no when: clause and no per-prompt-override mechanism (that's exactly why it can't be
# used for anything else in this file) -- fw_wan_ssh_override is applied here, after the
# fact, so it wins regardless of whatever vars_prompt did. fw_wan_ssh_answer's own
# vars_prompt default ("n") already covers fw_noninteractive without any extra logic --
# whether Ansible's vars_prompt reliably falls back to its default rather than hanging
# when stdin isn't a TTY is UNVERIFIED; a genuinely unattended batch run should pass
# -e fw_wan_ssh_override=n explicitly rather than rely on that.
- name: "[Ask] Set WAN SSH flag"
  ansible.builtin.set_fact:
    fw_wan_ssh_enabled: "{{ (fw_wan_ssh_override | default(fw_wan_ssh_answer | default('n'))) | lower | trim == 'y' }}"

- name: "[Ask] Prompt for WAN SSH source restriction"
  ansible.builtin.pause:
    prompt: "Restrict WAN SSH to a specific source IP? (leave blank to allow all)"
  register: fw_wan_ssh_src_prompt
  when:
    - fw_wan_ssh_enabled
    - fw_wan_ssh_src_override is not defined
    - not (fw_noninteractive | default(false) | bool)

- name: "[Ask] Set WAN SSH source"
  ansible.builtin.set_fact:
    fw_wan_ssh_src: "{{ fw_wan_ssh_src_override | default(fw_wan_ssh_src_prompt.user_input | default('')) | trim }}"
  when: fw_wan_ssh_enabled

# ── WAN activation gate ───────────────────────────────────────────────────────
# Asked as a real vars_prompt in 90-firewall.yml (fw_wan_activate_answer) —
# unconditional, no runtime-derived default, the other of the two prompts in this
# file that qualifies (see this file's 2026-07-16 changelog entry above). Same
# override-after-the-fact + unverified-vars_prompt-tty-fallback caveat as WAN SSH above.
- name: "[Ask] Set WAN activation flag"
  ansible.builtin.set_fact:
    fw_wan_activate: "{{ (fw_wan_activate_override | default(fw_wan_activate_answer | default('n'))) | lower | trim == 'y' }}"

- name: "[Ask] Log WAN activation state"
  ansible.builtin.debug:
    msg: >-
      {{ (_c.G + '[+]' + _c.NC + ' WAN will be activated during setup.')
         if fw_wan_activate else
         (_c.Y + '[!]' + _c.NC + ' WAN activation skipped — bring it up manually after the playbook completes.') }}

# ── WireGuard role (was 03_wireguard_config.yml) ─────────────────────────────

- name: "[Ask] Skip — CLD black site has no WireGuard"
  ansible.builtin.debug:
    msg: "{{ _c.Y }}[!]{{ _c.NC }} CLD black site — WireGuard skipped."
  when: fw_is_black_site

- name: "[Ask] Prompt for WireGuard role"
  ansible.builtin.pause:
    prompt: |-

      {{ _c.C }}╔══════════════════════════════════════════════════════╗{{ _c.NC }}
      {{ _c.C }}║              WireGuard Configuration                 ║{{ _c.NC }}
      {{ _c.C }}╚══════════════════════════════════════════════════════╝{{ _c.NC }}

      {{ _c.C }}[*]{{ _c.NC }} Host           : {{ _c.W }}{{ inventory_hostname }}{{ _c.NC }}
      {{ _c.C }}[*]{{ _c.NC }} Site           : {{ _c.G }}{{ fw_site_code }}{{ _c.NC }}
      {{ _c.C }}[*]{{ _c.NC }} Tunnel subnet  : {{ _c.G }}{{ fw_wg_tunnel_net }}{{ _c.NC }}

      Roles:
        {{ _c.G }}spoke{{ _c.NC }}         — satellite office, peers with the CLD hub (default for most sites)
        {{ _c.G }}none{{ _c.NC }}          — no WireGuard
      Only the CLD black site can be a WireGuard hub — see it separately if this is EXAFWLCLD001.
      WireGuard role [default: {{ _c.G }}{{ fw_wg_role }}{{ _c.NC }}]
  register: fw_wg_role_prompt
  when:
    - not fw_is_black_site
    - fw_wg_role_override is not defined
    - not (fw_noninteractive | default(false) | bool)

- name: "[Ask] Set WG role from prompt"
  ansible.builtin.set_fact:
    fw_wg_role: >-
      {%- if fw_wg_role_override is defined and fw_wg_role_override | lower | trim in ['spoke', 'none'] -%}
        {{ fw_wg_role_override | lower | trim }}
      {%- else -%}
        {%- set inp = fw_wg_role_prompt.user_input | default('') | trim | lower -%}
        {%- if inp in ['spoke', 'none'] -%}{{ inp }}
        {%- else -%}{{ fw_wg_role }}
        {%- endif -%}
      {%- endif -%}
  when: not fw_is_black_site

- name: "[Ask] Log role selection"
  ansible.builtin.debug:
    msg: "{{ _c.G }}[+]{{ _c.NC }} WireGuard role: {{ _c.G }}{{ fw_wg_role }}{{ _c.NC }}"
  when: not fw_is_black_site

# ── Hub prompts ───────────────────────────────────────────────────────────────

- name: "[Ask] Prompt hub tunnel IP"
  ansible.builtin.pause:
    prompt: "{{ _c.C }}[*]{{ _c.NC }} Hub tunnel IP [{{ _c.G }}10.0.{{ fw_site_octet }}.1{{ _c.NC }}]"
  register: fw_wg_hub_tunnel_ip_prompt
  when:
    - fw_wg_role in ['hub-primary', 'hub-regional']
    - fw_wg_hub_tunnel_ip_override is not defined
    - not (fw_noninteractive | default(false) | bool)

- name: "[Ask] Prompt hub listen port"
  ansible.builtin.pause:
    prompt: "{{ _c.C }}[*]{{ _c.NC }} WireGuard listen port [{{ _c.G }}51820{{ _c.NC }}]"
  register: fw_wg_port_prompt
  when:
    - fw_wg_role in ['hub-primary', 'hub-regional']
    - fw_wg_port_override is not defined
    - not (fw_noninteractive | default(false) | bool)

- name: "[Ask] Set hub WG facts"
  ansible.builtin.set_fact:
    fw_wg_tunnel_ip: >-
      {%- if fw_wg_hub_tunnel_ip_override is defined -%}{{ fw_wg_hub_tunnel_ip_override }}
      {%- else -%}
      {%- set inp = fw_wg_hub_tunnel_ip_prompt.user_input | default('') | trim -%}
      {{ inp if inp != '' else '10.0.' + fw_site_octet | string + '.1' }}
      {%- endif -%}
    fw_wg_port: >-
      {%- if fw_wg_port_override is defined -%}{{ fw_wg_port_override }}
      {%- else -%}
      {%- set inp = fw_wg_port_prompt.user_input | default('') | trim -%}
      {{ inp if inp != '' else '51820' }}
      {%- endif -%}
  when: fw_wg_role in ['hub-primary', 'hub-regional']

- name: "[Ask] Validate hub tunnel IP"
  ansible.builtin.assert:
    that:
      - fw_wg_tunnel_ip is match('^(\d{1,3}\.){3}\d{1,3}$')
    fail_msg: "{{ _c.R }}[ERROR]{{ _c.NC }} '{{ fw_wg_tunnel_ip }}' is not a valid IPv4 address for the hub tunnel IP (e.g. 10.0.{{ fw_site_octet }}.1) -- no port, no CIDR suffix."
  when: fw_wg_role in ['hub-primary', 'hub-regional']

# ── Spoke prompts ─────────────────────────────────────────────────────────────
# Robert, 2026-07-17: the Known Hubs box used to be baked into this same pause
# task's prompt text, so the task-start banner (printed once, before ANY of a
# task's own output) ended up sitting above the whole box instead of directly
# above the actual question. Split into a plain debug (the box, its own banner
# is irrelevant reference info) followed by a short, clean pause -- matches how
# "Prompt for primary hub site code" below already renders.

- name: "[Ask] Show known hubs"
  ansible.builtin.debug:
    msg: |-

      {{ _c.C }}╔══════════════════════════════════════════════════════╗{{ _c.NC }}
      {{ _c.C }}║              Known Hubs                              ║{{ _c.NC }}
      {{ _c.C }}╚══════════════════════════════════════════════════════╝{{ _c.NC }}
      {% for hub, ip in wg_hub_wan_ips.items() %}
      {{ _c.C }}  {{ hub }}{{ _c.NC }}  {{ ip }}:{{ wg_hub_default_port }}
      {% endfor %}
  when:
    - not fw_is_black_site
    - fw_wg_role == 'spoke'

- name: "[Ask] Prompt for spoke tunnel IP"
  ansible.builtin.pause:
    prompt: "{{ _c.C }}[*]{{ _c.NC }} Spoke tunnel IP [{{ _c.G }}10.0.{{ fw_site_octet }}.1{{ _c.NC }}]"
  register: fw_wg_spoke_tunnel_ip_prompt
  when:
    - not fw_is_black_site
    - fw_wg_role == 'spoke'
    - fw_wg_spoke_tunnel_ip_override is not defined
    - not (fw_noninteractive | default(false) | bool)

# 2026-07-19, Robert: spoke default moved from .2 to .1, matching the hub's own tunnel-IP
# convention within its own /24 (see docs/ansible/beginners_guide_to_ansible.md's
# "Renumbering / Reworking Live Conventions" section for the full rationale and the safe
# migration procedure for already-deployed spokes -- this default only affects NEW spoke
# registrations; existing spokes keep .2 until deliberately migrated). Purely a readability
# convention, not a protocol requirement -- confirmed safe: each site's 10.0.<octet>.0/24 is
# a private, non-overlapping tunnel network, and the hub routes via an explicit /32 host
# route (add-wg-spoke.yml), not subnet adjacency.
- name: "[Ask] Set spoke tunnel IP"
  ansible.builtin.set_fact:
    fw_wg_tunnel_ip: >-
      {%- if fw_wg_spoke_tunnel_ip_override is defined -%}{{ fw_wg_spoke_tunnel_ip_override }}
      {%- else -%}
      {%- set inp = fw_wg_spoke_tunnel_ip_prompt.user_input | default('') | trim -%}
      {{ inp if inp != '' else '10.0.' + fw_site_octet | string + '.1' }}
      {%- endif -%}
  when:
    - not fw_is_black_site
    - fw_wg_role == 'spoke'

- name: "[Ask] Validate spoke tunnel IP"
  ansible.builtin.assert:
    that:
      - fw_wg_tunnel_ip is match('^(\d{1,3}\.){3}\d{1,3}$')
    fail_msg: "{{ _c.R }}[ERROR]{{ _c.NC }} '{{ fw_wg_tunnel_ip }}' is not a valid IPv4 address for the spoke tunnel IP (e.g. 10.0.{{ fw_site_octet }}.1) -- no port, no CIDR suffix."
  when:
    - not fw_is_black_site
    - fw_wg_role == 'spoke'

# Robert, 2026-07-17: regional hubs (FAL/ODE/BRK) retired -- every spoke now
# talks to CLD, full stop (see group_vars/firewalls/main.yml's 2026-07-17
# changelog entry). Default changed from ODE to CLD; FAL/ODE/BRK still
# accepted if typed explicitly (e.g. a deliberate exception), just no longer
# the expected answer.

- name: "[Ask] Prompt for primary hub site code"
  ansible.builtin.pause:
    prompt: "{{ _c.C }}[*]{{ _c.NC }} Primary hub site code [default: {{ _c.G }}CLD{{ _c.NC }} — the only hub every spoke connects to]"
  register: fw_wg_hub_site_prompt
  when:
    - not fw_is_black_site
    - fw_wg_role == 'spoke'
    - fw_wg_hub_site_override is not defined
    - not (fw_noninteractive | default(false) | bool)

# BUG FIX (2026-07-17): `.user_input | default('CLD')` never actually applied on
# Enter -- Jinja's default() filter only replaces genuinely undefined values, not
# the empty string pause returns for a blank answer (confirmed empirically: ''
# | default('CLD') renders ''). Every other prompt in this file already uses the
# explicit "set inp, then check inp != ''" pattern below for exactly this reason;
# this one didn't, and it went unnoticed while the default was ODE (rarely typed
# by pressing Enter, since ODE was one choice among several). Now that CLD is
# the expected answer for every spoke, pressing Enter needs to actually work.

- name: "[Ask] Set hub site code"
  ansible.builtin.set_fact:
    fw_wg_hub_site: >-
      {%- if fw_wg_hub_site_override is defined -%}{{ fw_wg_hub_site_override | upper }}
      {%- else -%}
      {%- set inp = fw_wg_hub_site_prompt.user_input | default('') | trim -%}
      {{ (inp if inp != '' else 'CLD') | upper }}
      {%- endif -%}
  when:
    - not fw_is_black_site
    - fw_wg_role == 'spoke'

- name: "[Ask] Derive hub endpoint"
  ansible.builtin.set_fact:
    fw_wg_hub_default_endpoint: >-
      {{ wg_hub_wan_ips[fw_wg_hub_site] | default('') + ':' + wg_hub_default_port | string
         if fw_wg_hub_site in wg_hub_wan_ips else '' }}
  when:
    - not fw_is_black_site
    - fw_wg_role == 'spoke'

- name: "[Ask] Prompt for hub endpoint"
  ansible.builtin.pause:
    prompt: |-
      {{ _c.C }}[*]{{ _c.NC }} Hub WAN endpoint
      {% if fw_wg_hub_default_endpoint %}
      {{ _c.C }}    Known WAN IP for {{ fw_wg_hub_site }}: {{ _c.G }}{{ fw_wg_hub_default_endpoint }}{{ _c.NC }}
      {% else %}
      {{ _c.Y }}[!]{{ _c.NC }} No known WAN IP for {{ fw_wg_hub_site }} — enter manually
      {% endif %}
      Primary hub endpoint [{{ _c.G }}{{ fw_wg_hub_default_endpoint if fw_wg_hub_default_endpoint else 'IP:port' }}{{ _c.NC }}]
  register: fw_wg_hub_endpoint_prompt
  when:
    - not fw_is_black_site
    - fw_wg_role == 'spoke'
    - fw_wg_hub_endpoint_override is not defined
    - not (fw_noninteractive | default(false) | bool)

# No safe default exists when the selected hub's WAN IP isn't in wg_hub_wan_ips (blank
# fw_wg_hub_default_endpoint) and no override was supplied -- fails loud rather than
# writing a blank/broken hub endpoint into wg0.conf.
- name: "[Ask] ABORT — noninteractive with no known WAN IP for selected hub"
  ansible.builtin.fail:
    msg: |-
      {{ _c.R }}[ERROR]{{ _c.NC }} No known WAN endpoint for hub {{ fw_wg_hub_site }}, fw_noninteractive is set, and
      no fw_wg_hub_endpoint_override was supplied. No safe default exists -- re-run interactively,
      or pass -e fw_wg_hub_endpoint_override=<ip>:<port>.
  when:
    - not fw_is_black_site
    - fw_wg_role == 'spoke'
    - fw_wg_hub_endpoint_override is not defined
    - fw_wg_hub_default_endpoint | default('') == ''
    - fw_noninteractive | default(false) | bool

- name: "[Ask] Set hub endpoint and IP"
  ansible.builtin.set_fact:
    fw_wg_hub_endpoint: >-
      {%- if fw_wg_hub_endpoint_override is defined -%}{{ fw_wg_hub_endpoint_override }}
      {%- else -%}
      {%- set inp = fw_wg_hub_endpoint_prompt.user_input | default('') | trim -%}
      {{ inp if inp != '' else fw_wg_hub_default_endpoint }}
      {%- endif -%}
    fw_wg_hub_ip: >-
      {%- if fw_wg_hub_endpoint_override is defined -%}{{ fw_wg_hub_endpoint_override.split(':')[0] }}
      {%- else -%}
      {%- set inp = fw_wg_hub_endpoint_prompt.user_input | default('') | trim -%}
      {%- set ep = inp if inp != '' else fw_wg_hub_default_endpoint -%}
      {{ ep.split(':')[0] }}
      {%- endif -%}
  when:
    - not fw_is_black_site
    - fw_wg_role == 'spoke'

# ── Hub pubkey fetch — a read-only lookup, not a write to this box, so it
# stays part of the ask phase rather than moving to apply ──────────────────

# BUG FIX (2026-07-17): raw `ssh` in a shell task, delegated to localhost, bypasses
# Ansible's own connection plugin entirely -- it never picks up ansible.cfg's
# private_key_file, only the ssh client's own default key discovery, which fails
# non-interactively. Confirmed live: EXAANSCLD001 could SSH to a firewall manually
# with -i configs/ansible-id_rsa, but this exact task failed with "Permission
# denied (publickey)" for want of that same flag. Added -i explicitly, using the
# same {{ HOME }}/ansible/configs/ansible-id_rsa path group_vars/windows_nodes/
# connection.yml already uses for the identical purpose -- not a new path.

# BUG FIX (2026-07-17, second pass): fixed the SSH key-auth problem, then hit
# "cat: /etc/wireguard/public.key: Permission denied" live -- 09_wireguard_deploy.yml
# creates /etc/wireguard as `install -m 0700` (root-only traversal), so a plain
# ansible user can't enter the directory regardless of the file's own permissions.
# Added sudo -- relies on the same passwordless sudo every other become: true task
# in this role already assumes for the ansible user.

- name: "[Ask] Attempt SSH fetch of hub pubkey"
  ansible.builtin.shell: |
    ssh -o ConnectTimeout=5 \
        -o StrictHostKeyChecking=no \
        -o BatchMode=yes \
        -i {{ lookup('env', 'HOME') }}/ansible/configs/ansible-id_rsa \
        ansible@{{ fw_wg_hub_ip }} 'sudo cat /etc/wireguard/public.key' 2>/dev/null \
        || echo "FETCH_FAILED"
  register: fw_wg_hub_pubkey_ssh
  delegate_to: localhost
  changed_when: false
  failed_when: false
  when:
    - not fw_is_black_site
    - fw_wg_role == 'spoke'

- name: "[Ask] Validate SSH-fetched pubkey format"
  ansible.builtin.set_fact:
    fw_wg_hub_pubkey_live: >-
      {%- set raw = fw_wg_hub_pubkey_ssh.stdout | default('') | trim -%}
      {{ raw if raw | regex_search('^[A-Za-z0-9+/]{43}=$') else '' }}
  when:
    - not fw_is_black_site
    - fw_wg_role == 'spoke'

- name: "[Ask] Report SSH fetch result"
  ansible.builtin.debug:
    msg: >-
      {%- set known = wg_hub_known_pubkeys[fw_wg_hub_site] | default('') -%}
      {%- if fw_wg_hub_pubkey_live == '' -%}
      {{ _c.Y }}[!]{{ _c.NC }} SSH fetch failed or returned invalid key — manual entry required.
      {%- elif known == '' -%}
      {{ _c.G }}[+]{{ _c.NC }} Live key fetched: {{ fw_wg_hub_pubkey_live }} (no known-good key to compare)
      {%- elif fw_wg_hub_pubkey_live == known -%}
      {{ _c.G }}[+]{{ _c.NC }} Live key {{ _c.G }}matches{{ _c.NC }} known-good key for {{ fw_wg_hub_site }} ✓
      {%- else -%}
      {{ _c.R }}[!]{{ _c.NC }} Live key {{ _c.R }}DIFFERS{{ _c.NC }} from known-good key for {{ fw_wg_hub_site }}!
      {{ _c.R }}    Known : {{ wg_hub_known_pubkeys[fw_wg_hub_site] }}{{ _c.NC }}
      {{ _c.R }}    Live  : {{ fw_wg_hub_pubkey_live }}{{ _c.NC }}
      {{ _c.R }}    Hub may have been rebuilt — verify before accepting.{{ _c.NC }}
      {%- endif -%}
  when:
    - not fw_is_black_site
    - fw_wg_role == 'spoke'

- name: "[Ask] Confirm differing key or provide manual key"
  ansible.builtin.pause:
    prompt: |-
      {% set known = wg_hub_known_pubkeys[fw_wg_hub_site] | default('') %}
      {% if fw_wg_hub_pubkey_live != '' and known != '' and fw_wg_hub_pubkey_live != known %}
      {{ _c.R }}[!] WARNING: Live key differs from known-good key for {{ fw_wg_hub_site }}{{ _c.NC }}
      {{ _c.R }}    Known : {{ known }}{{ _c.NC }}
      {{ _c.R }}    Live  : {{ fw_wg_hub_pubkey_live }}{{ _c.NC }} — type {{ _c.G }}accept{{ _c.NC }} to use the live key, or paste a replacement key
      {% elif fw_wg_hub_pubkey_live == '' %}
      {{ _c.Y }}[!]{{ _c.NC }} SSH fetch failed. Get the hub pubkey manually:
      {{ _c.G }}    ssh ansible@{{ fw_wg_hub_ip }} 'cat /etc/wireguard/public.key'{{ _c.NC }}
      {% if known %}
      {{ _c.Y }}[!]{{ _c.NC }} Last known good key for {{ fw_wg_hub_site }}: {{ _c.C }}{{ known }}{{ _c.NC }}
      {{ _c.G }}    Press Enter to use this known key, or paste a different one if {{ fw_wg_hub_site }} has been rebuilt.{{ _c.NC }}
      {% else %}
      Paste the hub public key (44 base64 chars ending in =)
      {% endif %}
      {% else %}
      {{ _c.G }}[+]{{ _c.NC }} SSH fetch succeeded and key matches known-good ✓ — press Enter to accept
      {{ _c.G }}    {{ fw_wg_hub_pubkey_live }}{{ _c.NC }}
      {% endif %}
  register: fw_wg_hub_pubkey_confirm
  when:
    - not fw_is_black_site
    - fw_wg_role == 'spoke'
    - fw_wg_hub_pubkey_override is not defined
    - not (fw_noninteractive | default(false) | bool)

# Robert, 2026-08-13, explicit: a live key that DIFFERS from the known-good key on file is
# NEVER auto-accepted under fw_noninteractive -- possible hub rebuild, possible something
# worse, needs a human to look at it (or an explicit fw_wg_hub_pubkey_override, a deliberate
# opt-in). Fails loud rather than silently trusting it.
- name: "[Ask] ABORT — noninteractive with a hub pubkey mismatch"
  ansible.builtin.fail:
    msg: |-
      {{ _c.R }}[ERROR]{{ _c.NC }} Live WireGuard pubkey fetched from hub {{ fw_wg_hub_site }} DIFFERS from the
      known-good key on file, and fw_noninteractive is set. This is never auto-accepted -- re-run
      interactively to review and confirm, or pass -e fw_wg_hub_pubkey_override=<key> if you have
      independently verified the new key.
        Known : {{ wg_hub_known_pubkeys[fw_wg_hub_site] | default('') }}
        Live  : {{ fw_wg_hub_pubkey_live | default('') }}
  when:
    - not fw_is_black_site
    - fw_wg_role == 'spoke'
    - fw_wg_hub_pubkey_override is not defined
    - fw_noninteractive | default(false) | bool
    - fw_wg_hub_pubkey_live | default('') != ''
    - wg_hub_known_pubkeys[fw_wg_hub_site] | default('') != ''
    - fw_wg_hub_pubkey_live != wg_hub_known_pubkeys[fw_wg_hub_site]

# Same principle, the other no-safe-default case: SSH fetch failed AND there's no known-good
# key on file either -- nothing to fall back to at all.
- name: "[Ask] ABORT — noninteractive with no usable hub pubkey"
  ansible.builtin.fail:
    msg: |-
      {{ _c.R }}[ERROR]{{ _c.NC }} No live or known-good WireGuard pubkey available for hub {{ fw_wg_hub_site }},
      and fw_noninteractive is set. Re-run interactively, or pass -e fw_wg_hub_pubkey_override=<key>.
  when:
    - not fw_is_black_site
    - fw_wg_role == 'spoke'
    - fw_wg_hub_pubkey_override is not defined
    - fw_noninteractive | default(false) | bool
    - fw_wg_hub_pubkey_live | default('') == ''
    - wg_hub_known_pubkeys[fw_wg_hub_site] | default('') == ''

# Robert, 2026-07-17: pressing Enter used to only accept the LIVE-fetched key --
# if SSH fetch failed, that's empty, so Enter silently produced no key at all
# even though a known-good key was shown right above as a reference. Falls back
# to wg_hub_known_pubkeys[fw_wg_hub_site] (same source as firewallme.sh's own
# HUB_KNOWN_PUBKEY table, confirmed identical values in
# group_vars/firewalls/main.yml) whenever there's no live key to use instead.

- name: "[Ask] Set final hub pubkey"
  ansible.builtin.set_fact:
    fw_wg_hub_pubkey: >-
      {%- set known = wg_hub_known_pubkeys[fw_wg_hub_site] | default('') -%}
      {%- if fw_wg_hub_pubkey_override is defined -%}
      {{ fw_wg_hub_pubkey_override }}
      {%- else -%}
      {%- set inp = fw_wg_hub_pubkey_confirm.user_input | default('') | trim -%}
      {%- if inp == '' or inp | lower == 'accept' -%}
      {{ fw_wg_hub_pubkey_live if fw_wg_hub_pubkey_live != '' else known }}
      {%- else -%}{{ inp }}
      {%- endif -%}
      {%- endif -%}
    # An explicit override counts as "typed" too -- the cross-hub mix-up check just below
    # exists precisely to catch a pasted-the-wrong-hub's-key mistake, and a mistake typed
    # into -e is exactly as possible as one typed into the interactive prompt.
    fw_wg_hub_pubkey_was_typed: >-
      {%- if fw_wg_hub_pubkey_override is defined -%}
      true
      {%- else -%}
      {%- set inp = fw_wg_hub_pubkey_confirm.user_input | default('') | trim -%}
      {{ inp != '' and inp | lower != 'accept' }}
      {%- endif -%}
  when:
    - not fw_is_black_site
    - fw_wg_role == 'spoke'

# Robert, 2026-07-17: "smart-arse" cross-hub check -- firewallme.sh only ever
# compares a pasted key against the SELECTED hub's own known-good key (script
# lines 1077-1088). It has no equivalent for the actual copy-paste mistake
# Robert described: operator selects one hub (e.g. CLD) but pastes a DIFFERENT
# hub's key (e.g. FAL) by mistake -- since that pasted value IS a valid,
# known-format key, the existing "differs from known good" check alone can't
# tell that apart from a genuine post-rebuild key change. Reverse-looked-up
# against every OTHER entry in wg_hub_known_pubkeys (the same table, no new
# source of truth) -- only runs when the operator actually typed something,
# never for an SSH-fetched or accepted/defaulted key.

- name: "[Ask] Check whether the pasted key actually belongs to a different known hub"
  ansible.builtin.set_fact:
    fw_wg_hub_pubkey_crosshub_site: >-
      {{ (wg_hub_known_pubkeys | dict2items
          | selectattr('value', 'equalto', fw_wg_hub_pubkey)
          | rejectattr('key', 'equalto', fw_wg_hub_site)
          | map(attribute='key') | list | first | default('')) }}
  when:
    - not fw_is_black_site
    - fw_wg_role == 'spoke'
    - fw_wg_hub_pubkey_was_typed | bool

- name: "[Ask] Confirm cross-hub key mix-up"
  ansible.builtin.pause:
    prompt: |-
      {{ _c.Y }}[!]{{ _c.NC }} I see you pasted the {{ _c.R }}{{ fw_wg_hub_pubkey_crosshub_site }}{{ _c.NC }} key
      instead of the {{ _c.G }}{{ fw_wg_hub_site }}{{ _c.NC }} key you selected earlier — are you sure?
      Type {{ _c.G }}yes{{ _c.NC }} to use it anyway, or Ctrl-C and re-run to correct it
  register: fw_wg_hub_pubkey_crosshub_confirm
  when:
    - not fw_is_black_site
    - fw_wg_role == 'spoke'
    - fw_wg_hub_pubkey_was_typed | bool
    - fw_wg_hub_pubkey_crosshub_site | default('') != ''
    - not (fw_noninteractive | default(false) | bool)

# fw_wg_hub_pubkey_override counts as "typed" above, so an override that turns out to belong
# to a different known hub needs the same treatment as a mistyped interactive paste -- can't
# ask under fw_noninteractive, so it fails loud instead of silently using the wrong hub's key.
- name: "[Ask] ABORT — noninteractive cross-hub key mix-up detected"
  ansible.builtin.fail:
    msg: "{{ _c.R }}[ERROR]{{ _c.NC }} fw_wg_hub_pubkey_override belongs to {{ fw_wg_hub_pubkey_crosshub_site }}, not {{ fw_wg_hub_site }}, and fw_noninteractive is set -- re-run interactively, or correct the override."
  when:
    - not fw_is_black_site
    - fw_wg_role == 'spoke'
    - fw_wg_hub_pubkey_was_typed | bool
    - fw_wg_hub_pubkey_crosshub_site | default('') != ''
    - fw_noninteractive | default(false) | bool

- name: "[Ask] FAIL — cross-hub key mix-up not confirmed"
  ansible.builtin.fail:
    msg: "{{ _c.R }}[ERROR]{{ _c.NC }} Aborted — pasted key belongs to {{ fw_wg_hub_pubkey_crosshub_site }}, not {{ fw_wg_hub_site }}."
  when:
    - not fw_is_black_site
    - fw_wg_role == 'spoke'
    - fw_wg_hub_pubkey_was_typed | bool
    - fw_wg_hub_pubkey_crosshub_site | default('') != ''
    - not (fw_noninteractive | default(false) | bool)
    - fw_wg_hub_pubkey_crosshub_confirm.user_input | default('') | trim | lower != 'yes'

- name: "[Ask] FAIL — no valid hub pubkey"
  ansible.builtin.fail:
    msg: "{{ _c.R }}[ERROR]{{ _c.NC }} No valid WireGuard public key for hub {{ fw_wg_hub_site }}. Expected 44 base64 chars ending in =."
  when:
    - not fw_is_black_site
    - fw_wg_role == 'spoke'
    - not fw_wg_hub_pubkey | default('') | regex_search('^[A-Za-z0-9+/]{43}=$')
