---
# =============================================================================
# roles/firewall/tasks/00_preflight_1_derive.yml
# Example Music Limited — Firewall preflight: silent fact derivation only
# =============================================================================
# Changelog:
#   2026-06-20  Initial file
#   2026-06-20  Colourised prompts — matches firewallme.sh colour scheme
#   2026-06-26  Load wg_site_octets dynamically from sites.csv at runtime
#   2026-07-14  Robert: "vars_prompt do it now" -- restructured the whole role into
#               three clean phases (derive silently -> ask everything back-to-back ->
#               run the apply chain uninterrupted to the one final confirm), instead
#               of prompts and derivation being interleaved throughout 00-04. This file
#               is now PURE DERIVATION -- no prompts, no writes. Environment resolution
#               and the CLD black-site CONFIRM prompt (which used to live here) moved to
#               the new 00_preflight_3_ask.yml, since both can themselves prompt the operator.
#   2026-07-18  fw_is_black_site now derives from ad_forest.json's cld_site field instead
#               of the hardcoded literal 'CLD' -- matches windows_dc's dc_cld_site pattern
#               (group_vars/windows_dc/vars.yml). Part of the WireGuard hub-bootstrap plan.
# =============================================================================

# ── Parse hostname ────────────────────────────────────────────────────────────

- name: "[Preflight] Parse site code from hostname"
  ansible.builtin.set_fact:
    fw_site_code: >-
      {{ inventory_hostname | upper
         | regex_search('^EXAFWL([A-Z]{3})[0-9]{3}$', '\1')
         | first | default('') }}

- name: "[Preflight] FAIL — hostname does not match EXAFWL<SITE><NNN>"
  ansible.builtin.fail:
    msg: "{{ _c.R }}[ERROR]{{ _c.NC }} Hostname '{{ inventory_hostname }}' does not match EXAFWL<SITE><NNN>."
  when: fw_site_code == ''

- name: "[Preflight] Set black-site flag for CLD"
  ansible.builtin.set_fact:
    fw_is_black_site: >-
      {{ fw_site_code == (lookup('file', ad_forest_json_path) | from_json).cld_site }}

# ── Load site octet map from sites.csv ───────────────────────────────────────

- name: "[Preflight] Load sites.csv from control node"
  delegate_to: localhost
  become: false
  read_csv:
    path: "{{ sites_csv_path }}"
  register: _sites_csv_raw

- name: "[Preflight] Build wg_site_octets from sites.csv"
  ansible.builtin.set_fact:
    wg_site_octets: "{{ wg_site_octets | combine({item.Site: item.Subnet.split('.')[2] | int}) }}"
  loop: "{{ _sites_csv_raw.list | selectattr('Subnet', 'ne', 'N/A') | selectattr('Site', 'ne', 'BRD') | list }}"
  loop_control:
    label: "{{ item.Site }}"

- name: "[Preflight] Look up site octet"
  ansible.builtin.set_fact:
    fw_site_octet: "{{ wg_site_octets[fw_site_code] | default('') }}"

- name: "[Preflight] Look up this site's row (city/country/entity/street/postal_code for nodeinfo.json)"
  ansible.builtin.set_fact:
    fw_site_row: "{{ _sites_csv_raw.list | selectattr('Site', 'equalto', fw_site_code) | list | first | default({}) }}"

- name: "[Preflight] Derive site facts for nodeinfo.json"
  ansible.builtin.set_fact:
    fw_site_city: "{{ fw_site_row.City | default('') }}"
    fw_site_country: "{{ fw_site_row.Country | default('') }}"
    fw_site_entity: "{{ fw_site_row.Entity | default('Example Music') }}"
    fw_site_street: "{{ fw_site_row.Street | default('') }}"
    fw_site_postal_code: "{{ fw_site_row.PostalCode | default('') }}"

- name: "[Preflight] FAIL — site code not in known site map"
  ansible.builtin.fail:
    msg: "{{ _c.R }}[ERROR]{{ _c.NC }} Site code '{{ fw_site_code }}' not found in wg_site_octets (checked {{ sites_csv_path }})."
  when: fw_site_octet == '' and fw_site_octet_override is not defined

- name: "[Preflight] Use site octet override if provided"
  ansible.builtin.set_fact:
    fw_site_octet: "{{ fw_site_octet_override }}"
  when: fw_site_octet_override is defined

- name: "[Preflight] Derive subnet facts"
  ansible.builtin.set_fact:
    fw_subnet:         "192.168.{{ fw_site_octet }}"
    # .1 is NOT a valid firewall LAN IP -- it's EXARTR<SITE>001 (upstream router),
    # confirmed by docs/site-inventory.md and docs/bootstrap/bootstrapping.md (both
    # corrected 2026-07-10/12 after exactly this .1-vs-.253 confusion caused real doc
    # errors). Kept only because 00_preflight_3_ask.yml's now-commented-out interactive
    # prompt still references it -- do not use this as a real LAN IP if that code is
    # ever re-enabled.
    fw_lan_ip_1:       "192.168.{{ fw_site_octet }}.1"
    fw_lan_ip_253:     "192.168.{{ fw_site_octet }}.253"
    fw_wan_static_ip:  "192.168.139.{{ fw_site_octet }}"
    fw_ansible_ip:     "192.168.{{ fw_site_octet }}.{{ fw_ansible_octet }}"
    fw_dc_dns:         "192.168.{{ fw_site_octet }}.10"
    fw_dhcp_start:     "192.168.{{ fw_site_octet }}.150"
    fw_dhcp_end:       "192.168.{{ fw_site_octet }}.250"
    fw_wg_tunnel_net:  "10.0.{{ fw_site_octet }}.0/24"

# ── LAN IP — derived from instance number, not asked ─────────────────────────
# Robert, 2026-07-17: the standard-slot convention is fixed, not an operator choice --
# .253 for the primary firewall (EXAFWL<SITE>001), .254 for a secondary
# (EXAFWL<SITE>002). Confirmed against docs/site-inventory.md line 47-48,
# docs/bootstrap/bootstrapping.md line 50-51 (both already corrected in a prior audit
# to say exactly this), and live evidence from both real boxes in the estate today
# (EXAFWLCLD001 and EXAFWLBRT001 each show LAN .253). No FWL002 has been built
# anywhere yet, so .254 is unconfirmed live but matches the documented convention.
# Replaces the interactive ".1 or .253" prompt that used to live in
# 00_preflight_3_ask.yml (now commented out there, not deleted) -- that prompt was
# actively wrong, offering .1 as a legitimate alternative when .1 is really
# EXARTR<SITE>001, not a firewall address at all. CLD (fw_is_black_site) is
# unaffected -- its LAN IP is free-form entered in 00_preflight_3_ask.yml since it's
# not on fw_subnet at all.

- name: "[Preflight] Parse firewall instance number from hostname"
  ansible.builtin.set_fact:
    fw_instance_num: >-
      {{ (inventory_hostname | upper
          | regex_search('^EXAFWL[A-Z]{3}([0-9]{3})$', '\1')
          | first | default('0')) | int }}
  when: not fw_is_black_site

- name: "[Preflight] FAIL — unexpected firewall instance number"
  ansible.builtin.fail:
    msg: >-
      {{ _c.R }}[ERROR]{{ _c.NC }} Hostname '{{ inventory_hostname }}' implies firewall
      instance {{ fw_instance_num }} — only 001 (primary, LAN .253) and 002 (secondary,
      LAN .254) are defined by the standard-slot convention (docs/site-inventory.md,
      docs/bootstrap/bootstrapping.md). No FWL002 has been built anywhere in the estate
      yet — if this is deliberate, extend this check rather than guess a third value.
  when: not fw_is_black_site and fw_instance_num not in [1, 2]

- name: "[Preflight] Derive LAN IP from instance number (.253 primary / .254 secondary)"
  ansible.builtin.set_fact:
    fw_lan_ip: "{{ fw_subnet }}.{{ '253' if fw_instance_num == 1 else '254' }}"
  when: not fw_is_black_site

# ── DNS + domain — sourced from site_services.yml, not hardcoded ─────────────
# site_services (ansible/configs/inventory/group_vars/all/site_services.yml) is generated by
# benarbejde/generate_inventory.py from devices.csv -- the exact same source
# firewallme.sh itself reads (via begyndelse.json, same compute_site_services()
# function), so the two can never drift apart. Previously this was a hardcoded
# default (192.168.139.8, commented as the pre-rename EXADNSCLD001) -- now
# derived, matching every other DNS-consuming script in this repo. fw_domain
# added 2026-07-09 (site_services.domain_fqdn, itself derived from
# benarbejde/ad_forest.json) -- replaces "jukebox.internal" hardcoded directly
# into 08_dnsmasq.yml/wan.nmconnection.j2.
- name: "[Preflight] Set DNS server + domain from site_services"
  ansible.builtin.set_fact:
    fw_cld_dns: "{{ site_services.dns.ip }}"
    fw_inet_dns: "9.9.9.9"
    fw_domain: "{{ site_services.domain_fqdn }}"
