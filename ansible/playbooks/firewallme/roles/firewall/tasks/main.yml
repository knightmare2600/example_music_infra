---
# =============================================================================
# roles/firewall/tasks/main.yml
# Example Music Limited — Firewall role entry point
# =============================================================================
# Imports task files in order. Each mirrors a section of firewallme.sh.
# Colour constants (_c.*) are loaded via vars_files in 90-firewall.yml.
#
# Stage map:
#   00_preflight         — silent derivation: hostname/site parse, sites.csv
#                          lookup, subnet facts, DNS/domain. NO prompts, NO writes.
#   01_interfaces        — silent derivation: interface listing, WAN auto-detect.
#                          NO prompts, NO writes.
#   02_ask_all           — EVERY operator prompt, back-to-back: environment,
#                          black-site confirm, WAN/LAN interface, LAN IP, WAN
#                          mode/IP/gateway, Ansible IP, WAN SSH, WAN activation,
#                          WireGuard role/tunnel/hub (incl. the read-only SSH
#                          pubkey fetch+confirm). Still NO writes.
#   03_derive_post_ask   — derivation that needed the operator's final answers
#                          (MAC lookups, WireGuard AllowedIPs). Still NO writes.
#   04_summary_confirm   — ONE consolidated review + ONE "type yes" confirm,
#                          then (only after that) the first real writes:
#                          systemd .link files.
#   05_packages          — apt, localepurge, initramfs, ansible user, zsh
#   06_network_manager   — nmcli profiles, LAN up, optional WAN up, forwarding
#   07_nftables          — ruleset generation and load
#   08_dnsmasq           — DNS/DHCP config, systemd-resolved disabled
#   09_wireguard_deploy  — keygen (preserve existing), wg0.conf, wg-quick
#   10_ssh_hardening     — sshd_config, banners, authorized_keys
#   11_cockpit           — cockpit.socket, self-signed cert
#   12_finish            — ASCII art header, final summary, reboot prompt
#
# Changelog:
#   2026-06-20  Initial file
#   2026-06-20  Colour constants loaded via play vars_files in 90-firewall.yml
#   2026-07-14  Robert: "vars_prompt do it now" -- restructured 00-04 from
#               interleaved derive/prompt/derive/prompt into three clean phases
#               (derive silently -> ask everything back-to-back -> one review +
#               confirm), per 02_ask_all.yml's own header for the full rationale.
#               02_wan_config.yml and 03_wireguard_config.yml are gone -- their
#               content was absorbed into 02_ask_all.yml (all prompts) and the
#               new 03_derive_post_ask.yml (post-answer derivation). 05 onward
#               is unchanged -- it already only ran after the final confirm.
# =============================================================================

- import_tasks: 00_preflight.yml
  tags: [firewall, preflight]

- import_tasks: 01_interfaces.yml
  tags: [firewall, interfaces]

- import_tasks: 02_ask_all.yml
  tags: [firewall, ask, wan, wireguard]

- import_tasks: 03_derive_post_ask.yml
  tags: [firewall, ask, wireguard]

- import_tasks: 04_summary_confirm.yml
  tags: [firewall, confirm]

- import_tasks: 05_packages.yml
  tags: [firewall, packages]

- import_tasks: 06_network_manager.yml
  tags: [firewall, network]

- import_tasks: 07_nftables.yml
  tags: [firewall, nftables]

- import_tasks: 08_dnsmasq.yml
  tags: [firewall, dnsmasq]

- import_tasks: 09_wireguard_deploy.yml
  tags: [firewall, wireguard]

- import_tasks: 10_ssh_hardening.yml
  tags: [firewall, ssh]

- import_tasks: 11_cockpit.yml
  tags: [firewall, cockpit]

- import_tasks: 12_finish.yml
  tags: [firewall, finish]
