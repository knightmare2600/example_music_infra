---
# =============================================================================
# roles/firewall/tasks/main.yml
# Example Music Limited — Firewall role entry point
# =============================================================================
# Imports task files in order. Each mirrors a section of firewallme.sh.
# Colour constants (_c.*) are loaded via vars_files in 90-firewall.yml.
#
# Stage map:
#   00_preflight_1_derive       — silent derivation: hostname/site parse, sites.csv
#                                lookup, subnet facts, DNS/domain. NO prompts, NO writes.
#   00_preflight_2_interfaces   — silent derivation: interface listing, WAN auto-detect.
#                                NO prompts, NO writes.
#   00_preflight_3_ask          — EVERY operator prompt, back-to-back: environment,
#                                black-site confirm, WAN/LAN interface, LAN IP, WAN
#                                mode/IP/gateway, Ansible IP, WAN SSH, WAN activation,
#                                WireGuard role/tunnel/hub (incl. the read-only SSH
#                                pubkey fetch+confirm). Still NO writes.
#   00_preflight_4_post_ask     — derivation that needed the operator's final answers
#                                (MAC lookups, WireGuard AllowedIPs). Still NO writes.
#   00_preflight_5_confirm      — ONE consolidated review + ONE "type yes" confirm,
#                                then (only after that) the first real writes:
#                                systemd .link files.
#
#   All five of the above are genuinely one phase -- preflight, in the literal sense:
#   nothing happens until the operator has confirmed. They share the "00_preflight_"
#   name for exactly that reason (numbered 1-5 only so `ls` still shows them in
#   execution order); the real work -- the actual "flight" -- starts below.
#
#   05_packages          — apt, localepurge, initramfs, ansible user, zsh
#   06_network_manager   — nmcli profiles, LAN up, optional WAN up, forwarding
#   07_nftables          — ruleset generation and load
#   08_dnsmasq           — DNS/DHCP config, systemd-resolved disabled
#   09_wireguard_deploy  — keygen (preserve existing), wg0.conf, wg-quick
#   10_register_spoke_on_hub — spoke only: auto-register as a peer on its hub
#                        (delegate_to the hub's IP), update wg_hub_topology
#   11_ssh_hardening     — sshd_config, banners, authorized_keys
#   12_console_hardening — mask ctrl-alt-del.target, disable the systemd
#                        Ctrl+Alt+Del burst/panic reboot (see
#                        INC-2026-08-21-CTRLALTDEL) — closes the one gap
#                        molly-guard can't reach, a console-issued keypress
#   13_cockpit           — cockpit.socket, self-signed cert
#   14_finish            — ASCII art header, final summary, reboot prompt
#
# Changelog:
#   2026-08-26  Robert, after INC-2026-08-21-CTRLALTDEL (a console-sent
#               Ctrl+Alt+Del rebooted a live firewall node): added
#               12_console_hardening.yml, bumping the former 12/13
#               (cockpit/finish) to 13/14 — same renumber-on-insert
#               precedent as 10_register_spoke_on_hub.yml's own 2026-07-17
#               entry below.
#   2026-06-20  Initial file
#   2026-06-20  Colour constants loaded via play vars_files in 90-firewall.yml
#   2026-07-14  Robert: "vars_prompt do it now" -- restructured what was 00-04 into
#               three clean phases (derive silently -> ask everything back-to-back
#               -> one review + confirm) instead of interleaved derive/prompt/
#               derive/prompt. 02_wan_config.yml and 03_wireguard_config.yml are
#               gone -- absorbed into the new ask/post-ask files.
#   2026-07-14  Robert, same day, spotted a real naming problem with the result:
#               "00_preflight is exactly the same as a real 'preflight' check ...
#               how many airlines ... check stuff AFTER takeoff, not before?" --
#               numbering the phase 00/01/02/03/04 implied five sequential pipeline
#               stages, when it's genuinely one phase (nothing happens until
#               confirmed) artificially chopped into what looked like separate
#               later stages. Renamed all five to share "00_preflight_" (with a
#               1-5 suffix only to preserve `ls` ordering), so the naming actually
#               says what it is.
#   2026-07-17  Robert: onboarding a spoke used to require a separate, manual
#               playbooks/add-wg-spoke.yml run against the hub afterward -- easy
#               to forget (EXAFWLBRT001 sat unregistered on EXAFWLCLD001 for
#               exactly that reason). Added 10_register_spoke_on_hub.yml, run
#               automatically as part of every spoke's own provisioning.
#   2026-07-17  Robert: this was briefly named 09b_register_spoke_on_hub.yml --
#               "stick to two digit numbers" (repo-wide sweep found this was the
#               only letter-suffixed task file anywhere, not a wider pattern).
#               Renamed to 10_, bumping the former 10/11/12
#               (ssh_hardening/cockpit/finish) to 11/12/13.
# =============================================================================

- import_tasks: 00_preflight_1_derive.yml
  tags: [firewall, preflight]

- import_tasks: 00_preflight_2_interfaces.yml
  tags: [firewall, preflight, interfaces]

- import_tasks: 00_preflight_3_ask.yml
  tags: [firewall, preflight, ask, wan, wireguard]

- import_tasks: 00_preflight_4_post_ask.yml
  tags: [firewall, preflight, ask, wireguard]

- import_tasks: 00_preflight_5_confirm.yml
  tags: [firewall, preflight, confirm]

- import_tasks: 05_packages.yml
  tags: [firewall, packages]

- import_tasks: 06_network_manager.yml
  tags: [firewall, network]

- import_tasks: 07_nftables.yml
  tags: [firewall, nftables]

- import_tasks: 08_dnsmasq.yml
  tags: [firewall, dnsmasq]

- import_tasks: 09_wireguard_deploy.yml
  tags: [firewall, wireguard]

- import_tasks: 10_register_spoke_on_hub.yml
  tags: [firewall, wireguard]

- import_tasks: 11_ssh_hardening.yml
  tags: [firewall, ssh]

- import_tasks: 12_console_hardening.yml
  tags: [firewall, console_hardening]

- import_tasks: 13_cockpit.yml
  tags: [firewall, cockpit]

- import_tasks: 14_finish.yml
  tags: [firewall, finish]
