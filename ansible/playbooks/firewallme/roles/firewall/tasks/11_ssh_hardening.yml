---
# =============================================================================
# roles/firewall/tasks/11_ssh_hardening.yml
# Example Music Limited — SSH hardening and banner
# =============================================================================
# Mirrors firewallme.sh SSH section: sshd_config hardening, banner,
# ansible user authorized_keys.
# Changelog:
#   2026-10-23  Robert's ask: added the Cockpit URL to /etc/issue (pre-login banner, also
#               copied verbatim to /etc/issue.net) -- a blank line then its own plain line
#               below the box's closing border, not crammed onto the border itself. Reuses
#               fw_lan_ip (00_preflight_1_derive.yml), the same static fact the dynamic MOTD
#               script derives live via `ip addr show` instead -- a static Ansible fact is
#               fine here since /etc/issue is only ever regenerated by a real Ansible run,
#               unlike the MOTD script which runs fresh on every login.
#   2026-07-28  Follow-up, same day: Robert asked to flip fw_ssh_password_auth_enabled's
#               default itself (defaults/main.yml) to true -- password auth is now ON by
#               default for every firewall run unless a specific run passes
#               -e fw_ssh_password_auth_enabled=false. Supersedes the "opt-in true, default
#               false" framing in the entry directly below; no code change needed in this
#               file itself, both directives already template off the same variable.
#   2026-07-28  Robert, test environment: PasswordAuthentication/
#               ChallengeResponseAuthentication now gated on
#               fw_ssh_password_auth_enabled (default false, matches real-world
#               posture -- key-only stays the default for every firewall).
#               Override with -e fw_ssh_password_auth_enabled=true for test
#               boxes only, never by changing this default itself. Corrected
#               this file's own stale header filename (said 10_, file is 11_)
#               while touching it.
#   2026-06-20  Initial file
#   2026-06-29  Replace static /etc/motd with dynamic MOTD via PAM update-motd.d;
#               add /etc/update-motd.d/10-examplemusic (ASCII art, network table,
#               live WireGuard peer handshake status, system stats) and
#               /etc/profile.d/motd.sh for console logins
# =============================================================================

- name: "[SSH] Write ansible user authorized_keys"
  ansible.posix.authorized_key:
    user:  ansible
    key:   "{{ exa_ansible_pub_key }}"
    state: present
    exclusive: true

- name: "[SSH] Harden /etc/ssh/sshd_config"
  ansible.builtin.blockinfile:
    path: /etc/ssh/sshd_config
    marker: "# {mark} EXAMPLE MUSIC ANSIBLE MANAGED"
    block: |
      # Example Music Limited — {{ inventory_hostname }}
      PermitRootLogin              no
      PasswordAuthentication       {{ 'yes' if fw_ssh_password_auth_enabled | default(false) else 'no' }}
      ChallengeResponseAuthentication {{ 'yes' if fw_ssh_password_auth_enabled | default(false) else 'no' }}
      PubkeyAuthentication         yes
      AuthorizedKeysFile           .ssh/authorized_keys
      PermitEmptyPasswords         no
      X11Forwarding                no
      PrintMotd                    no
      PrintLastLog                 yes
      UsePAM                       yes
      AllowUsers                   ansible
      MaxAuthTries                 3
      LoginGraceTime               30
      ClientAliveInterval          300
      ClientAliveCountMax          2
      TCPKeepAlive                 yes
      UseDNS                       no
      # Restrict ciphers/MACs (disable weak legacy)
      Ciphers     chacha20-poly1305@openssh.com,aes256-gcm@openssh.com,aes128-gcm@openssh.com
      MACs        hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com
      KexAlgorithms curve25519-sha256,diffie-hellman-group14-sha256
  notify: reload ssh

- name: "[SSH] Write /etc/issue (pre-login banner)"
  ansible.builtin.copy:
    dest: /etc/issue
    mode: '0644'
    # 2026-10-11, real bug found during the repo-wide box-header sweep (same class as the
    # PVE MOTD fix, 18e6d07/b8580e7): Host/Site/Environment had NO dynamic padding at all --
    # fixed trailing spaces sized for one specific set of values, off by 10-15 chars for any
    # other hostname/site/environment. Switched to the same adaptive `plain|length`-based
    # padding already proven in 00_preflight_5_confirm.yml and 14_finish.yml's summary boxes,
    # so it self-corrects regardless of how long inventory_hostname/fw_site_code/
    # fw_environment actually are.
    content: |-
      {%- set _title = "EXAMPLE MUSIC LIMITED — AUTHORISED ACCESS ONLY" -%}
      {%- set _lp = (66 - _title|length) // 2 -%}
      {%- set _rp = 66 - _title|length - _lp -%}
      {%- set _host_plain = "   Host        : " + inventory_hostname -%}
      {%- set _site_plain = "   Site        : " + fw_site_code -%}
      {%- set _env_plain  = "   Environment : " + fw_environment -%}

      ╔══════════════════════════════════════════════════════════════════╗
      ║{{ ' ' * _lp }}{{ _title }}{{ ' ' * _rp }}║
      ║                                                                  ║
      ║{{ _host_plain }}{{ ' ' * (66 - _host_plain|length) }}║
      ║{{ _site_plain }}{{ ' ' * (66 - _site_plain|length) }}║
      ║{{ _env_plain }}{{ ' ' * (66 - _env_plain|length) }}║
      ║                                                                  ║
      ║   Unauthorised access to this system is a criminal offence.      ║
      ║   All connections are logged and monitored.                      ║
      ╚══════════════════════════════════════════════════════════════════╝

         Cockpit: https://{{ fw_lan_ip }}:9090

- name: "[SSH] Write /etc/issue.net (SSH pre-auth banner)"
  ansible.builtin.copy:
    dest: /etc/issue.net
    mode: '0644'
    src: /etc/issue
  delegate_to: "{{ inventory_hostname }}"

- name: "[SSH] Enable SSH banner in sshd_config"
  ansible.builtin.lineinfile:
    path: /etc/ssh/sshd_config
    regexp: '^#?Banner'
    line: 'Banner /etc/issue.net'
  notify: reload ssh

- name: "[SSH] Clear /etc/motd (dynamic MOTD via PAM update-motd.d replaces static banner)"
  ansible.builtin.copy:
    dest: /etc/motd
    mode: '0644'
    content: ""

- name: "[SSH] Disable existing update-motd.d scripts"
  ansible.builtin.shell: chmod -x /etc/update-motd.d/* 2>/dev/null || true
  changed_when: false

- name: "[SSH] Write dynamic MOTD script"
  ansible.builtin.copy:
    dest: /etc/update-motd.d/10-examplemusic
    mode: '0755'
    content: |
      #!/bin/bash
      GR='\033[0;32m'; CY='\033[0;36m'; RD='\033[0;31m'; YL='\033[0;33m'
      OR='\033[38;5;208m'; WH='\033[1;37m'; NC='\033[0m'

      SITE="unknown"; WG_ROLE="none"; ENTITY=""; CITY=""; COUNTRY=""
      if [[ -f /etc/example-music/nodeinfo.json ]] && command -v jq &>/dev/null; then
        SITE=$(   jq -r '.site    // "unknown"' /etc/example-music/nodeinfo.json)
        WG_ROLE=$(jq -r '.wg_role // "none"'   /etc/example-music/nodeinfo.json)
        ENTITY=$( jq -r '.entity  // ""'       /etc/example-music/nodeinfo.json)
        CITY=$(   jq -r '.city    // ""'       /etc/example-music/nodeinfo.json)
        COUNTRY=$(jq -r '.country // ""'       /etc/example-music/nodeinfo.json)
      fi

      WAN_INFO=""; LAN_INFO=""; WG_INFO=""; OTHER_INFO=""
      while IFS= read -r iface; do
        IP=$(ip -4 addr show "$iface" 2>/dev/null | awk '/inet /{print $2}' | head -1)
        [[ -z "$IP" ]] && IP="no IP"
        case "$iface" in
          wg*)  WG_INFO="${WG_INFO}    ${OR}WireGuard ${iface}${NC} : ${OR}${IP}${NC}\n" ;;
          lo)   continue ;;
          *)
            if ip route show dev "$iface" 2>/dev/null | grep -q "^default"; then
              WAN_INFO="${WAN_INFO}    ${RD}WAN  ${iface}${NC} : ${RD}${IP}${NC}\n"
            elif [[ -n "$IP" ]]; then
              LAN_INFO="${LAN_INFO}    ${GR}LAN  ${iface}${NC} : ${GR}${IP}${NC}\n"
            fi
            ;;
        esac
      done < <(ip -o link show | awk -F': ' '{print $2}' | grep -v '@')

      WG_PEERS=""
      if command -v wg &>/dev/null && ip link show wg0 &>/dev/null 2>&1; then
        WG_PEERS="  ${WH}── WireGuard Peers ──────────────────────────────────────────${NC}\n"
        PEER_COUNT=0; ACTIVE_COUNT=0; NOW=$(date +%s)
        while IFS=$'\t' read -r PUBKEY PRESHARED ENDPOINT ALLOWED HANDSHAKE TX RX KEEPALIVE; do
          PEER_COUNT=$((PEER_COUNT + 1))
          PEER_NAME=$(awk -v pk="$PUBKEY" '
            /^#/ { comment = substr($0, 3) }
            /PublicKey/ && $3 == pk { print comment; exit }
          ' /etc/wireguard/wg0.conf 2>/dev/null)
          PEER_NAME="${PEER_NAME:-???}"
          EP_IP="${ENDPOINT%%:*}"
          [[ "$EP_IP" == "(none)" ]] && EP_IP="no endpoint"
          ALLOWED_DISP=$(echo "$ALLOWED" | cut -d',' -f1 | xargs)
          if [[ "$HANDSHAKE" == "0" ]]; then
            HS_STR="${RD}never${NC}"; STATUS="${RD}✗${NC}"
          else
            AGE=$((NOW - HANDSHAKE))
            if [[ $AGE -lt 60 ]]; then HS_STR="${GR}${AGE}s ago${NC}"
            elif [[ $AGE -lt 3600 ]]; then HS_STR="${GR}$((AGE/60))m ago${NC}"
            elif [[ $AGE -lt 86400 ]]; then HS_STR="${YL}$((AGE/3600))h ago${NC}"
            else HS_STR="${RD}$((AGE/86400))d ago${NC}"; fi
            if [[ $AGE -lt 180 ]]; then STATUS="${GR}✓${NC}"; ACTIVE_COUNT=$((ACTIVE_COUNT + 1))
            else STATUS="${YL}~${NC}"; ACTIVE_COUNT=$((ACTIVE_COUNT + 1)); fi
          fi
          fmt_bytes() {
            local b=$1
            if [[ $b -ge 1073741824 ]]; then printf "%.1fG" "$(echo "scale=1; $b/1073741824" | bc)"
            elif [[ $b -ge 1048576 ]];   then printf "%.1fM" "$(echo "scale=1; $b/1048576"   | bc)"
            elif [[ $b -ge 1024 ]];      then printf "%.1fK" "$(echo "scale=1; $b/1024"      | bc)"
            else printf "${b}B"; fi
          }
          TX_STR=$(fmt_bytes "$TX"); RX_STR=$(fmt_bytes "$RX")
          WG_PEERS="${WG_PEERS}    ${STATUS} ${CY}$(printf '%-12s' "$PEER_NAME")${NC}"
          WG_PEERS="${WG_PEERS} ${GR}$(printf '%-18s' "$ALLOWED_DISP")${NC}"
          WG_PEERS="${WG_PEERS} ${WH}$(printf '%-18s' "$EP_IP")${NC}"
          WG_PEERS="${WG_PEERS} ${HS_STR}  ${YL}↑${TX_STR} ↓${RX_STR}${NC}\n"
        done < <(wg show wg0 dump 2>/dev/null | tail -n +2)
        WG_PEERS="${WG_PEERS}    ${CY}Total${NC}: ${GR}${ACTIVE_COUNT}${NC} active of ${PEER_COUNT} configured\n"
      fi

      UPTIME=$(uptime -p 2>/dev/null | sed 's/up //')
      LOAD=$(cut -d' ' -f1-3 /proc/loadavg)
      MEM_TOTAL=$(free -m | awk '/^Mem/{print $2}')
      MEM_USED=$(free -m  | awk '/^Mem/{print $3}')
      DISK=$(df -h / | awk 'NR==2{print $3 " used of " $2 " (" $5 ")"}')

      echo -e "
      ${GR}⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⢀⣠⠤⠤⣄⠀⠀⠀⠀
      ⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⣠⠞⠉⢀⣀⣀⣿⣧⠀⠀⠀
      ⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⡀⠀⠀⠀⠀⠀⠀⠀⠀⢰⣾⠁⣠⠖⠉⢀⣀⣧⣈⣧⠀⠀
      ⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⢀⣀⣀⣀⣷⣄⠀⠀⠀⠀⠀⠀⣠⢾⠛⣿⡁⣠⠞⠉⢀⣯⣀⣈⣇⠀
      ⠀⠀⠀⠀⠀⢀⣼⣿⣆⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⡠⠞⠉⠀⣀⣘⣏⠛⣷⢤⣀⣀⡤⠞⠁⣸⠟⠀⡷⠃⣠⣶⣟⣏⣀⣀⣘⣆
      ⠀⠀⠀⠀⠀⣾⡿⠛⢻⡆⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⢠⠞⠀⣠⠖⠉⠉⠉⣏⠙⡿⢾⣄⣀⣀⣠⣼⣽⣠⠞⠀⡰⠃⢨⠟⠋⠀⠀⠀⠉
      ⠀⠀⠀⠀⢰⣿⠀⠀⢸⡇⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⢀⡏⢠⠞⠁⣠⣴⣾⣿⠏⠉⠓⢾⣦⣀⡀⢻⡿⠟⠁⢀⠞⠁⡴⠃⠀⠀⠀⠀⠀⠀
      ⠀⠀⠀⠀⠸⡇⠀⢀⣾⠇⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⢸⣆⠀⡸⢀⠏⢠⠞⠁⣨⠟⠋⠉⠉⠉⢻⡧⢤⣈⣁⣀⣠⠖⠋⢀⡞⠁⠀⠀⠀⠀⠀⠀⠀
      ⠀⠀⠀⠀⠀⣿⣤⣿⡟⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⢸⠛⢳⡇⡸⢠⠏⢠⠞⠁⣠⠔⠊⠉⠉⢻⠗⠦⣄⣀⠀⢀⣠⠔⠋⠀⠀⠀⠀⠀⠀⠀⠀⠀
      ⠀⠀⠀⠀⣠⣾⣿⣿⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⢀⢠⣀⣀⣤⠀⠀⠀⠀⠀⠀⢸⣀⡞⣷⠇⡜⢠⠏⢀⡞⠁⠀⠀⣰⢞⣻⠇⠀⠀⠀⠉⠁⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀⠀
