          ${CY}Disk /  ${NC} : ${GR}${DISK}${NC}

        ${WH}── Management ───────────────────────────────────────────────${NC}
          ${CY}Cockpit${NC}  : ${GR}https://$(ip -4 addr show | awk '/inet /{print $2}' | grep -v '127\.' | grep -v '10\.0\.' | tail -1 | cut -d/ -f1):9090${NC}
      "

- name: "[SSH] Write /etc/profile.d/motd.sh (console logins)"
  # 2026-10-11, same bug class as the PVE MOTD fix (ansible/playbooks/proxmox/
  # playbooks/40-scripts.yml, 18e6d07), confirmed live double-printing on
  # EXADNSFRD001 which has the identical unguarded pattern: $SSH_TTY is set by
  # sshd for every real interactive SSH session (pam_motd already shown the
  # banner there), so skip there and only fall through for su/console logins --
  # which is what this task's own name already says it's for.
  ansible.builtin.copy:
    dest: /etc/profile.d/motd.sh
    mode: '0644'
    content: |
      [[ -z "$SSH_TTY" ]] && [[ -x /etc/update-motd.d/10-examplemusic ]] && /etc/update-motd.d/10-examplemusic

- name: "[SSH] Flush handlers (reload sshd)"
  ansible.builtin.meta: flush_handlers
