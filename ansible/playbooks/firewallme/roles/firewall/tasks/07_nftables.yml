---
# =============================================================================
# roles/firewall/tasks/07_nftables.yml
# Example Music Limited — nftables ruleset
# =============================================================================
# Mirrors firewallme.sh nftables block: table inet filter + table ip nat,
# WireGuard port hole (hubs/spokes), WAN SSH optional, LAN SSH always,
# Ansible IP allow, Cockpit, Zabbix agent, dnsmasq, DHCP.
# Changelog:
#   2026-07-16  Robert: fw_wan_ssh_enabled defaults to false (a per-site operator prompt,
#               00_preflight_3_ask.yml, no black-site exception) -- meaning SSH on the WAN
#               interface was blocked by default for every site unless explicitly opted into.
#               Harmless before generate_inventory.py's own 2026-07-16 fix, since ansible_host
#               was every firewall's LAN address then, where SSH is unconditionally allowed
#               ("SSH LAN" rule, no gate at all). Now that ansible_host is the VRK/WAN address
#               for every firewall (matching fw_wan_static_ip's own derivation), this default
#               would silently block Ansible's own routine management connections the moment
#               this ruleset is genuinely loaded and enforced -- a real, newly-exposed conflict,
#               not present before that inventory change. Added a dedicated, always-on rule
#               allowing SSH from the VRK network (192.168.139.0/24) specifically, independent
#               of fw_wan_ssh_enabled -- that toggle is about exposing SSH to arbitrary WAN/
#               internet sources, a separate and legitimately opt-in decision from Ansible's
#               own management path. The existing session-safety check (further down this file)
#               is deliberately left unchanged -- still defers a live reload to next boot when
#               connected via WAN, which is the same end-of-run-reboot flow Robert wants
#               regardless, and never risks stranding a session either way.
#   2026-06-20  Initial file
#   2026-07-09  SAFETY FIX: the ruleset reload previously fired unconditionally on any
#               change, with no check of which interface the current session is using.
#               fw_wan_ssh_enabled defaults to false (no WAN SSH accept rule in the
#               generated ruleset), so a WAN-connected control session would lose SSH
#               the instant the ruleset reloaded. Added the same CURRENT_IFACE check
#               firewallme.sh already has (script lines 1528-1538): skip the live
#               reload, defer with a printed message, if the current session's
#               outbound interface is WAN and WAN SSH isn't enabled. The ruleset is
#               still always written to disk regardless -- only the live reload is
#               gated.
#   2026-07-14  Fixed a real, fundamental syntax bug found live on EXAFWLBRT001:
#               `nft -c -f /etc/nftables.conf` failed with "syntax error, unexpected
#               newline" plus a long cascade of further errors. Root cause: nftables
#               has no "grouped block of rules under one shared match" syntax --
#               `iifname "X" { rule1 rule2 }` is not valid nft (curly braces are only
#               for chain bodies and set/concatenation literals like `tcp dport
#               { 80, 443 }`). The LAN inbound, WAN inbound, and WireGuard-tunnel
#               inbound sections all used this invalid grouping. Fixed by repeating
#               the iifname match on every individual rule statement instead --
#               verified by rendering the real Jinja template with representative
#               values and checking brace balance (13 open, 13 close) before trusting
#               it; nft itself isn't installed in this sandbox to run -c directly.
#   2026-07-24  Robert, live (EXAFWLBRT001 -> EXAFWLCLD001 LAN clients): both the wg0 input
#               block and the wg0 forward block (WireGuard <-> LAN, WireGuard <-> WAN hub
#               re-routing) were gated `fw_wg_role != 'none' and not fw_is_black_site`. CLD
#               IS the black site -- so on the one box that's the WireGuard hub for the
#               entire estate, this whole block was skipped, and the forward chain's
#               default policy is drop. Confirmed live: a spoke (BRT) could reach CLD's own
#               firewall LAN IP directly (that's egress through CLD's permissive output
#               chain landing on the spoke's own input chain, unaffected), but not any real
#               LAN client behind CLD (EXAANSCLD001, EXADCSCLD001, ...) -- 100% packet loss,
#               port shows filtered, exactly what a forward-chain drop looks like. Same class
#               of bug as the wg-quick@wg0 black-site exclusion found and fixed 2026-07-17
#               (638608e) -- a blanket "isolate CLD" exclusion sweeping up something every
#               WireGuard-enabled node needs, CLD most of all since it's also meant to be
#               re-routing traffic *between* spokes (see the "hub re-routing" comment on the
#               WAN half of this same block). Removed `and not fw_is_black_site` from both
#               conditions -- CLD gets the same wg0 input/forward rules as any other
#               WireGuard-enabled node now.
# =============================================================================

- name: "[nftables] Detect current session's outbound interface (safety check before reload)"
  ansible.builtin.shell: |
    ip route get 1.1.1.1 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i=="dev") print $(i+1)}'
  register: nft_current_iface
  changed_when: false

- name: "[nftables] Set safety flag — would this reload strand the current session?"
  ansible.builtin.set_fact:
    nft_reload_would_strand_session: >-
      {{ (nft_current_iface.stdout | trim == fw_wan_iface) and not fw_wan_ssh_enabled }}

- name: "[nftables] Write /etc/nftables.conf"
  ansible.builtin.copy:
    dest: /etc/nftables.conf
    mode: '0640'
    content: |
      #!/usr/sbin/nft -f
      # ==========================================================================
      # /etc/nftables.conf
      # Example Music Limited — {{ inventory_hostname }}
      # Site: {{ fw_site_code }}  Environment: {{ fw_environment }}
      # Generated by Ansible firewall role — {{ ansible_date_time.iso8601 }}
      # ==========================================================================

      flush ruleset

      # --------------------------------------------------------------------------
      # NAT — masquerade LAN → WAN
      # --------------------------------------------------------------------------
      table ip nat {
        chain postrouting {
          type nat hook postrouting priority srcnat; policy accept;
          oifname "{{ fw_wan_iface }}" masquerade
        }
      }

      # --------------------------------------------------------------------------
      # Filter — input, forward, output
      # --------------------------------------------------------------------------
      table inet filter {

        # ------------------------------------------------------------------
        # Inbound to the firewall itself
        # ------------------------------------------------------------------
        chain input {
          type filter hook input priority filter; policy drop;

          # Established / related always allowed
          ct state { established, related } accept

          # Drop invalid packets early
          ct state invalid drop

          # Loopback
          iifname "lo" accept

          # ICMP
          ip  protocol icmp  accept
          ip6 nexthdr  icmpv6 accept

          # ── LAN inbound ───────────────────────────────────────────────
          # nftables has no "grouped block of rules under one shared match" syntax --
          # iifname "X" { rule1 rule2 } is not valid nft (that curly-brace form is only
          # for chain bodies and set/concatenation literals). Every rule below repeats
          # its own iifname match instead of trying to share one via a block.

          # DHCP
          iifname "{{ fw_lan_iface }}" udp dport 67 accept  comment "DHCP server"

          # DNS
          iifname "{{ fw_lan_iface }}" tcp dport 53 accept  comment "DNS (dnsmasq)"
          iifname "{{ fw_lan_iface }}" udp dport 53 accept  comment "DNS (dnsmasq)"

          # SSH — always on LAN
          iifname "{{ fw_lan_iface }}" tcp dport 22 accept  comment "SSH LAN"

          # Cockpit
          iifname "{{ fw_lan_iface }}" tcp dport 9090 accept  comment "Cockpit (LAN only)"

          # Zabbix agent
          iifname "{{ fw_lan_iface }}" tcp dport { 10050, 10051 } accept  comment "Zabbix agent LAN"

          # ── WAN inbound ───────────────────────────────────────────────

          # SSH from the VRK/provisioning network — always allowed, independent of
          # fw_wan_ssh_enabled below. This is Ansible's own management path (every
          # firewall's ansible_host is this same interface's 192.168.139.<site octet>
          # address, matching fw_wan_static_ip's derivation) -- not the same thing as
          # "WAN SSH", which is about exposing SSH to arbitrary WAN/internet sources, a
          # separate, legitimately opt-in decision. Without this, fw_wan_ssh_enabled
          # defaulting to false (its own default, unchanged) would silently block
          # Ansible's own routine connections the moment this ruleset is loaded.
          iifname "{{ fw_wan_iface }}" ip saddr 192.168.139.0/24 tcp dport 22 accept  comment "SSH from VRK (Ansible management)"

      {% if fw_wan_ssh_enabled %}
      {% if fw_wan_ssh_src %}
          # SSH WAN — restricted to source IP
          iifname "{{ fw_wan_iface }}" ip saddr {{ fw_wan_ssh_src }} tcp dport 22 accept  comment "SSH WAN restricted"
      {% else %}
          # SSH WAN — open (review this!)
          iifname "{{ fw_wan_iface }}" tcp dport 22 accept  comment "SSH WAN open"
      {% endif %}
      {% endif %}

      {% if fw_wg_role in ['hub-primary', 'hub-regional'] %}
          # WireGuard — hub listens on {{ fw_wg_port }}
          iifname "{{ fw_wan_iface }}" udp dport {{ fw_wg_port }} accept  comment "WireGuard hub listen"
      {% elif fw_wg_role == 'spoke' %}
          # WireGuard — spoke return traffic
          iifname "{{ fw_wan_iface }}" udp dport {{ fw_wg_port | default(51820) }} accept  comment "WireGuard spoke"
      {% endif %}

          # Zabbix proxy — CLD only
      {% if fw_site_code == 'CLD' %}
          iifname "{{ fw_wan_iface }}" tcp dport 10051 accept  comment "Zabbix proxy inbound (CLD)"
      {% endif %}

          # ── WireGuard interface inbound ───────────────────────────────
      {% if fw_wg_role != 'none' %}
          # WireGuard tunnel — allow management protocols
          iifname "wg0" tcp dport 22 accept    comment "SSH over WG tunnel"
          iifname "wg0" tcp dport 9090 accept  comment "Cockpit over WG tunnel"
          iifname "wg0" tcp dport { 10050, 10051 } accept  comment "Zabbix over WG"
          iifname "wg0" icmp type echo-request accept
      {% endif %}

          # Reject everything else with a polite message
          reject with icmpx type port-unreachable
        }

        # ------------------------------------------------------------------
        # Forward — LAN → WAN, WG tunnel routing
        # ------------------------------------------------------------------
        chain forward {
          type filter hook forward priority filter; policy drop;

          ct state { established, related } accept
          ct state invalid drop

          # LAN → WAN
          iifname "{{ fw_lan_iface }}" oifname "{{ fw_wan_iface }}" accept

          # WAN → LAN (return traffic)
          iifname "{{ fw_wan_iface }}" oifname "{{ fw_lan_iface }}" ct state { established, related } accept

      {% if fw_wg_role != 'none' %}
          # WireGuard ↔ LAN
          iifname "wg0" oifname "{{ fw_lan_iface }}" accept
          iifname "{{ fw_lan_iface }}" oifname "wg0" accept

          # WireGuard ↔ WAN (hub re-routing between spokes)
          iifname "wg0" oifname "{{ fw_wan_iface }}" accept
          iifname "{{ fw_wan_iface }}" oifname "wg0" ct state { established, related } accept
      {% endif %}

      {% if fw_site_code == 'CLD' %}
          # CLD provisioning → all site subnets (bootstrapping)
          iifname "{{ fw_lan_iface }}" ip daddr 192.168.0.0/16 accept
          iifname "{{ fw_wan_iface }}" ip daddr 192.168.0.0/16 accept
      {% endif %}
        }

        # ------------------------------------------------------------------
        # Output — permissive (firewall-originated traffic)
        # ------------------------------------------------------------------
        chain output {
          type filter hook output priority filter; policy accept;
        }

      }
  notify: reload nftables

- name: "[nftables] Enable nftables service (queued for boot only — session would be stranded)"
  ansible.builtin.systemd:
    name: nftables
    enabled: true
  when: nft_reload_would_strand_session

- name: "[nftables] Enable and start nftables service (safe to apply live)"
  ansible.builtin.systemd:
    name: nftables
    enabled: true
    state: started
  when: not nft_reload_would_strand_session

- name: "[nftables] Flush handlers (load ruleset now, if safe)"
  ansible.builtin.meta: flush_handlers

- name: "[nftables] NOTE — ruleset apply deferred (current session would be stranded)"
  ansible.builtin.debug:
    msg: >-
      {{ _c.Y }}[!]{{ _c.NC }} nftables ruleset written to /etc/nftables.conf but NOT applied live --
      the current session is connected via {{ fw_wan_iface }} (WAN) and WAN SSH is disabled, so
      applying it now would cut this connection. It will apply on next boot, or run
      'nft -f /etc/nftables.conf && systemctl start nftables' yourself once you're
      reconnected via LAN or WireGuard.
  when: nft_reload_would_strand_session

- name: "[nftables] Verify ruleset loaded"
  ansible.builtin.shell: nft list ruleset | wc -l
  register: nft_line_count
  changed_when: false
  when: not nft_reload_would_strand_session

- name: "[nftables] Show ruleset size"
  ansible.builtin.debug:
    msg: "nftables ruleset loaded — {{ nft_line_count.stdout | trim }} lines"
  when: not nft_reload_would_strand_session
