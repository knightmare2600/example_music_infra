---
# =============================================================================
# roles/firewall/tasks/12_finish.yml
# Example Music Limited — Final summary and optional reboot
# =============================================================================
# Changelog:
#   2026-06-20  Initial file
#   2026-06-20  Colourised — replicates firewallme.sh finish block exactly
#               including the ASCII art header
#   2026-07-07  nodeinfo.json write now uses the shared ansible/tasks/nodeinfo.yml
#               (also used by linux/tools.yml, proxmox, rudder_server.yml)
#               instead of hand-writing the same base fields independently.
#   2026-07-09  Reboot question moved to 04_summary_confirm.yml -- asked alongside
#               every other confirmation, before any writes happen, instead of
#               here at the very end after everything's already applied. This file
#               now only acts on the stored fw_reboot_requested fact.
#   2026-07-14  Fixed the same missing-right-border bug already found and fixed in
#               00_preflight_5_confirm.yml's pre-apply summary box, present here too --
#               every content line in "FIREWALL CONFIGURATION COMPLETE" was missing its
#               closing "║" entirely (only title/divider lines ever had one). Same fix:
#               compute each line's plain (uncoloured) text, pad to the box's real
#               62-column inner width, then wrap in colour and close with the border.
#   2026-07-16  Robert, live (EXAFWLBRT001): (1) the box title line itself was hand-typed
#               padding, not computed like every other line -- 60 characters against a
#               62-wide border, closing "║" landed 2 short. Same class of bug as the
#               2026-07-14 fix above, just on the one line that fix didn't touch. Now
#               computed the same way (centre the title text within the real 62-column
#               width). (2) "[Finish] Reboot skipped" reads as "the reboot was skipped"
#               regardless of which branch runs -- when a reboot WAS forced (e.g. by
#               06_network_manager.yml's WAN-strand guard overriding the operator's own
#               "no" answer), this task itself correctly shows as skipped, but the NAME
#               "Reboot skipped" appearing right after a "[Finish] Reboot host" task that
#               visibly ran reads exactly like "the reboot didn't happen" when it did.
#               Renamed to "[Finish] NOTE — no reboot occurred this run" so the task's own
#               name and its own skip status never say the opposite of what happened.
# =============================================================================

# ── Node info file ────────────────────────────────────────────────────────────

- name: "[Finish] Ensure /etc/example-music directory exists"
  ansible.builtin.file:
    path: /etc/example-music
    state: directory
    mode: '0755'

- name: "[Finish] Write /etc/example-music/nodeinfo.json"
  include_tasks: ../../../../../tasks/nodeinfo.yml
  vars:
    nodeinfo_role: "firewall"
    nodeinfo_site: "{{ fw_site_code }}"
    nodeinfo_city: "{{ fw_site_city | default('') }}"
    nodeinfo_country: "{{ fw_site_country | default('') }}"
    nodeinfo_entity: "{{ fw_site_entity | default('Example Music') }}"
    nodeinfo_environment: "{{ fw_environment }}"
    nodeinfo_bootstrapped_by: "90-firewall.yml"
    nodeinfo_extra:
      lan_ip: "{{ fw_lan_ip }}"
      lan_iface: "{{ fw_lan_iface }}"
      ansible_ip: "{{ fw_ansible_ip }}"
      wg_role: "{{ fw_wg_role }}"
      wg_tunnel_ip: "{{ fw_wg_tunnel_ip | default('') }}"
      wg_hub: "{{ fw_wg_hub_endpoint | default('') }}"
      wan_iface: "{{ fw_wan_iface }}"
      wan_mode: "{{ fw_wan_mode }}"
      wan_ip: "{{ fw_wan_static_ip + '/24' if fw_wan_mode == 'static' else 'dhcp' }}"

# ── Final summary ─────────────────────────────────────────────────────────────

- name: "[Finish] Re-read WG public key"
  ansible.builtin.slurp:
    src: /etc/wireguard/public.key
  register: fw_wg_pubkey_final
  failed_when: false
  when: fw_wg_role != 'none' and not fw_is_black_site

- name: "[Finish] Final summary — mirrors firewallme.sh finish block"
  ansible.builtin.debug:
    msg:
      - ""
      - "{{ _c.C }}  ███████╗██╗  ██╗ █████╗ {{ _c.NC }}"
      - "{{ _c.C }}  ██╔════╝╚██╗██╔╝██╔══██╗{{ _c.NC }}"
      - "{{ _c.C }}  █████╗   ╚███╔╝ ███████║{{ _c.NC }}"
      - "{{ _c.C }}  ██╔══╝   ██╔██╗ ██╔══██║{{ _c.NC }}"
      - "{{ _c.C }}  ███████╗██╔╝ ██╗██║  ██║{{ _c.NC }}"
      - "{{ _c.C }}  ╚══════╝╚═╝  ╚═╝╚═╝  ╚═╝{{ _c.NC }}"
      - ""
      - "{{ _c.G }}╔══════════════════════════════════════════════════════════════╗{{ _c.NC }}"
      - >-
        {%- set text = "FIREWALL CONFIGURATION COMPLETE" -%}
        {%- set lp = (62 - text|length) // 2 -%}
        {%- set rp = 62 - text|length - lp -%}
        {{ _c.G }}║{{ _c.NC }}{{ _c.W }}{{ ' ' * lp }}{{ text }}{{ ' ' * rp }}{{ _c.NC }}{{ _c.G }}║{{ _c.NC }}
      - "{{ _c.G }}╠══════════════════════════════════════════════════════════════╣{{ _c.NC }}"
      - >-
        {%- set plain = "  Host         : " + inventory_hostname -%}
        {{ _c.G }}║{{ _c.NC }}  Host         : {{ _c.W }}{{ inventory_hostname }}{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.G }}║{{ _c.NC }}
      - >-
        {%- set plain = "  Site         : " + fw_site_code -%}
        {{ _c.G }}║{{ _c.NC }}  Site         : {{ _c.G }}{{ fw_site_code }}{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.G }}║{{ _c.NC }}
      - >-
        {%- set plain = "  Environment  : " + fw_environment -%}
        {{ _c.G }}║{{ _c.NC }}  Environment  : {{ _c.G }}{{ fw_environment }}{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.G }}║{{ _c.NC }}
      - "{{ _c.G }}╠══════════════════════════════════════════════════════════════╣{{ _c.NC }}"
      - >-
        {%- set plain = "  WAN          : " + fw_wan_iface -%}
        {{ _c.G }}║{{ _c.NC }}  WAN          : {{ _c.G }}{{ fw_wan_iface }}{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.G }}║{{ _c.NC }}
      - >-
        {%- set plain = "  WAN mode     : " + fw_wan_mode -%}
        {{ _c.G }}║{{ _c.NC }}  WAN mode     : {{ _c.G }}{{ fw_wan_mode }}{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.G }}║{{ _c.NC }}
      - >-
        {%- set val = (fw_wan_static_ip + '/24') if fw_wan_mode == 'static' else 'DHCP' -%}
        {%- set plain = "  WAN IP       : " + val -%}
        {{ _c.G }}║{{ _c.NC }}  WAN IP       : {{ _c.G }}{{ val }}{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.G }}║{{ _c.NC }}
      - >-
        {%- set val = ('ENABLED' + (' src:' + fw_wan_ssh_src if fw_wan_ssh_src else ' open')) if fw_wan_ssh_enabled else 'disabled' -%}
        {%- set plain = "  WAN SSH      : " + val -%}
        {{ _c.G }}║{{ _c.NC }}  WAN SSH      : {{ (_c.R + val + _c.NC) if fw_wan_ssh_enabled else (_c.Y + val + _c.NC) }}{{ ' ' * (62 - plain|length) }}{{ _c.G }}║{{ _c.NC }}
      - "{{ _c.G }}╠══════════════════════════════════════════════════════════════╣{{ _c.NC }}"
      - >-
        {%- set plain = "  LAN          : " + fw_lan_iface -%}
        {{ _c.G }}║{{ _c.NC }}  LAN          : {{ _c.G }}{{ fw_lan_iface }}{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.G }}║{{ _c.NC }}
      - >-
        {%- set plain = "  LAN IP       : " + fw_lan_ip + "/24" -%}
        {{ _c.G }}║{{ _c.NC }}  LAN IP       : {{ _c.G }}{{ fw_lan_ip }}/24{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.G }}║{{ _c.NC }}
      - >-
        {%- set plain = "  DHCP range   : " + fw_dhcp_start + " – " + fw_dhcp_end -%}
        {{ _c.G }}║{{ _c.NC }}  DHCP range   : {{ _c.G }}{{ fw_dhcp_start }} – {{ fw_dhcp_end }}{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.G }}║{{ _c.NC }}
      - >-
        {%- set plain = "  WAN DNS      : " + fw_cld_dns + ", " + fw_inet_dns -%}
        {{ _c.G }}║{{ _c.NC }}  WAN DNS      : {{ _c.G }}{{ fw_cld_dns }}, {{ fw_inet_dns }}{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.G }}║{{ _c.NC }}
      - >-
        {%- set plain = "  LAN DNS      : " + fw_dc_dns + ", " + fw_cld_dns -%}
        {{ _c.G }}║{{ _c.NC }}  LAN DNS      : {{ _c.G }}{{ fw_dc_dns }}, {{ fw_cld_dns }}{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.G }}║{{ _c.NC }}
      - "{{ _c.G }}╠══════════════════════════════════════════════════════════════╣{{ _c.NC }}"
      - >-
        {%- set plain = "  WireGuard    : " + fw_wg_role -%}
        {{ _c.G }}║{{ _c.NC }}  WireGuard    : {{ _c.O }}{{ fw_wg_role }}{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.G }}║{{ _c.NC }}
      - >-
        {%- set val = fw_wg_pubkey_final.content | b64decode | trim if (fw_wg_pubkey_final.content is defined) else 'N/A' -%}
        {%- set plain = "  WG pubkey    : " + val -%}
        {{ _c.G }}║{{ _c.NC }}  WG pubkey    : {{ _c.O }}{{ val }}{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.G }}║{{ _c.NC }}
      - >-
        {%- set val = fw_wg_hub_endpoint | default('N/A') -%}
        {%- set plain = "  WG hub       : " + val -%}
        {{ _c.G }}║{{ _c.NC }}  WG hub       : {{ _c.O }}{{ val }}{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.G }}║{{ _c.NC }}
      - "{{ _c.G }}╠══════════════════════════════════════════════════════════════╣{{ _c.NC }}"
      - >-
        {%- set plain = "  Cockpit      : https://" + fw_lan_ip + ":9090" -%}
        {{ _c.G }}║{{ _c.NC }}  Cockpit      : {{ _c.C }}https://{{ fw_lan_ip }}:9090{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.G }}║{{ _c.NC }}
      - >-
        {%- set plain = "  SSH (LAN)    : ssh ansible@" + fw_lan_ip -%}
        {{ _c.G }}║{{ _c.NC }}  SSH (LAN)    : {{ _c.C }}ssh ansible@{{ fw_lan_ip }}{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.G }}║{{ _c.NC }}
      - "{{ _c.G }}╚══════════════════════════════════════════════════════════════╝{{ _c.NC }}"
      - ""
      - "{{ _c.Y }}[!]{{ _c.NC }} If WG role is spoke, register this node as a peer on {{ _c.W }}{{ fw_wg_hub_site | default('the hub') }}{{ _c.NC }}:"
      - "{{ _c.G }}    wg set wg0 peer {{ fw_wg_pubkey_final.content | b64decode | trim if (fw_wg_pubkey_final.content is defined) else '<pubkey>' }} allowed-ips {{ fw_wg_tunnel_ip | default('10.0.x.y') }}/32,{{ fw_subnet }}.0/24{{ _c.NC }}"
      - ""


# Reboot decision was already made and confirmed in 00_preflight_5_confirm.yml
# (fw_reboot_requested) — not asked again here, just acted on.

- name: "[Finish] Reboot host"
  ansible.builtin.reboot:
    reboot_timeout:    300
    post_reboot_delay: 30
    msg: "Ansible firewall role — post-config reboot"
  when: fw_reboot_requested | default(false)

- name: "[Finish] NOTE — no reboot occurred this run"
  ansible.builtin.debug:
    msg:
      - "{{ _c.Y }}[!]{{ _c.NC }} Reboot skipped (not requested)."
      - "{{ _c.C }}[*]{{ _c.NC }} When ready:  {{ _c.G }}reboot{{ _c.NC }}"
      - "{{ _c.C }}[*]{{ _c.NC }} Interface name pinning (.link files) takes effect after reboot."
      - "{{ _c.C }}[*]{{ _c.NC }} If WAN was not activated:  {{ _c.G }}nmcli con up wan{{ _c.NC }}"
  when: not (fw_reboot_requested | default(false))
