---
# =============================================================================
# roles/firewall/tasks/08_dnsmasq.yml
# Example Music Limited — dnsmasq configuration
# =============================================================================
# Mirrors firewallme.sh dnsmasq block: DHCP pool, DNS forwarder,
# internal DNS upstream if set, DHCP static leases from inventory.
# Changelog:
#   2026-06-20  Initial file
#   2026-06-29  Add iPXE vendor class DHCP tagging (dhcp-vendorclass + dhcp-option tags)
#   2026-06-29  Add dnsmasq.service.d/wait-for-lan.conf drop-in so dnsmasq waits for
#               network-online.target and the LAN device before starting
#   2026-07-16  Robert, live (EXAFWLBRT001): the "self WAN" dhcp-host line silently
#               pointed at fw_lan_ip, not a WAN address at all -- replace('.1','.1') is
#               a no-op, spotted during an earlier audit pass but under-called as
#               harmless dead config at the time. Removed outright: except-interface
#               above excludes the WAN interface from DHCP entirely, so a reservation
#               tied to it is dead regardless of which IP it names. "self LAN" line is
#               unaffected and correct as-is.
#   2026-07-16  Robert, live (EXAFWLBRT001, second re-run): "[dnsmasq] Remove
#               systemd-resolved stub" failed with "Unlinking failed" -- this role's own
#               previous run had written /etc/resolv.conf with attributes: "+i"
#               (immutable, below), and nothing ever cleared that bit before the next
#               run tried to delete the same file. chattr +i blocks unlink same as any
#               other write. Added a chattr -i step immediately before the removal task
#               (failed_when: false -- harmless no-op on a first run where the file
#               either doesn't exist yet or was never made immutable).
#   2026-07-24  Robert, live (EXAFWLCLD001): removed the enable-tftp/tftp-root=/srv/tftp/
#               dhcp-boot=pxelinux.0 block entirely. Found live when this box's dnsmasq
#               failed to start on its first-ever restart since initial boot ("TFTP
#               directory /srv/tftp inaccessible") -- nothing ever created that directory.
#               First fix was to just create it, but Robert confirmed directly: TFTP isn't
#               actually used anywhere in this estate's real boot flow (that's HTTP --
#               dhcp-option=tag:ipxe-client,option:bootfile-name,http://.../bootstrap.ipxe,
#               below). Checked repo-wide for anything else depending on this: the only
#               other "pxelinux.0" hit is menu.ipxe's unrelated HDT entry (served over
#               HTTP, nothing to do with this dnsmasq config), and the only other TFTP hit
#               is docs/bootstrap/TFTPD64_Debian_Headless_Rescue_Guide.md, an explicitly
#               standalone Windows rescue-lab guide unrelated to this role. Same class of
#               dead boot-mechanism config as the boot.ipxe/lvm.seed cluster removed
#               2026-07-12 -- confirmed unused, removed outright rather than patched.
# =============================================================================

- name: "[dnsmasq] Disable systemd-resolved (conflicts with dnsmasq on port 53)"
  ansible.builtin.systemd:
    name: systemd-resolved
    enabled: false
    state: stopped
  failed_when: false

- name: "[dnsmasq] Clear immutable attribute from /etc/resolv.conf (if a previous run set it)"
  ansible.builtin.command: chattr -i /etc/resolv.conf
  changed_when: false
  failed_when: false

- name: "[dnsmasq] Remove systemd-resolved stub"
  ansible.builtin.file:
    path: /etc/resolv.conf
    state: absent

- name: "[dnsmasq] Write /etc/resolv.conf (point to dnsmasq)"
  ansible.builtin.copy:
    dest: /etc/resolv.conf
    mode: '0644'
    content: |
      # Example Music Limited — {{ inventory_hostname }}
      # Written by Ansible firewall role
      nameserver 127.0.0.1
      search {{ fw_site_code | lower }}.{{ fw_domain }} {{ fw_domain }}
    attributes: "+i"   # immutable — prevent NM overwriting

- name: "[dnsmasq] Write /etc/dnsmasq.d/exa-firewall.conf"
  ansible.builtin.copy:
    dest: /etc/dnsmasq.d/exa-firewall.conf
    mode: '0644'
    content: |
      # ==========================================================================
      # dnsmasq — Example Music Limited — {{ inventory_hostname }}
      # Site: {{ fw_site_code }}  Generated by Ansible firewall role
      # ==========================================================================

      # --- Interface binding ---
      interface={{ fw_lan_iface }}
      except-interface={{ fw_wan_iface }}
      bind-interfaces
      listen-address=127.0.0.1
      listen-address={{ fw_lan_ip }}

      # --- DNS ---
      domain={{ fw_site_code | lower }}.{{ fw_domain }}
      local=/{{ fw_site_code | lower }}.{{ fw_domain }}/
      expand-hosts

      # Upstream DNS — site DC, then central BIND9 (VRK), then internet fallback.
      # BUG FIX (2026-07-24, found live on EXAFWLCLD001): fw_inet_dns (9.9.9.9) was already
      # computed (00_preflight_1_derive.yml) and shown in the Configuration Summary as if
      # active ("WAN DNS: ..., 9.9.9.9"), but never actually written into this file at all --
      # there was no internet fallback tier whatsoever, only the two internal servers below.
      # 1.1.1.1 never existed anywhere in this role. Robert confirmed the intended chain live:
      # VRK BIND9 -> 9.9.9.9 -> 1.1.1.1. strict-order added so dnsmasq actually tries these in
      # the order listed (its default behaviour without it is best-effort, not a guaranteed
      # fallback sequence).
      strict-order
      server={{ fw_dc_dns }}
      server={{ fw_cld_dns }}
      server={{ fw_inet_dns }}
      server=1.1.1.1

      # DNSSEC
      dnssec
      trust-anchor=.,20326,8,2,E06D44B80B8F1D39A95C0B0D7C65D08458E880409BBC683457104237C7F8EC8D

      # --- DHCP ---
      dhcp-range={{ fw_dhcp_start }},{{ fw_dhcp_end }},12h
      dhcp-option=option:router,{{ fw_lan_ip }}
      dhcp-option=option:dns-server,{{ fw_dc_dns }},{{ fw_cld_dns }}
      dhcp-option=option:domain-name,{{ fw_site_code | lower }}.{{ fw_domain }}

      # Authoritative — reply NACK to unknown leases
      dhcp-authoritative

      # --- iPXE vendor class tagging ---
      # Detect iPXE clients by vendor class string and redirect them to the
      # bootstrap URL. Mirrors firewallme.sh dhcp-vendorclass / dhcp-option tags.
      dhcp-vendorclass=set:ipxe-client,iPXE
      dhcp-option=tag:ipxe-client,option:dns-server,{{ fw_lan_ip }}
      dhcp-option=tag:ipxe-client,option:bootfile-name,http://{{ fw_ansible_ip }}/bootstrap.ipxe

      # DHCP lease file
      dhcp-leasefile=/var/lib/misc/dnsmasq.leases

      # DHCP dynamic hostname registration in BIND zone convention
      # dhcp01.<site>.{{ fw_domain }} → 192.168.<octet>.100
      dhcp-generate-names=tag:{{ fw_site_code | lower }},dhcp%s.{{ fw_site_code | lower }}

      # --- Static DHCP leases from inventory ---
      # EXA convention: .1=RTR (upstream router, not this box) .2-.4=BMC .5-.7=PVE
      # .10=DC .11=DC2 .48=SBC/PBX .253=FWL1 (this box, primary) .254=FWL2 (secondary,
      # not yet built). Corrected 2026-07-17 -- this comment previously had it backwards
      # (".1=FWL .253=FWL2"), matching a mistake also found and fixed the same day in
      # 00_preflight_3_ask.yml's LAN IP prompt; see docs/site-inventory.md and
      # docs/bootstrap/bootstrapping.md, both already corrected for the same .1-vs-.253
      # confusion in an earlier audit.
      # No "self WAN" entry: except-interface={{ fw_wan_iface }} above excludes the WAN
      # interface from DHCP entirely, so a dhcp-host reservation tied to it can never be
      # served regardless of what IP it names -- it was also always the wrong IP (a
      # no-op replace('.1','.1') filter meant it silently pointed at fw_lan_ip, not a
      # WAN address at all). Confirmed dead on a real box (EXAFWLBRT001, 2026-07-16),
      # not just on read.
      dhcp-host={{ fw_lan_mac }},{{ fw_lan_iface }},{{ fw_lan_ip }}  # self LAN

      # Ansible control node
      # dhcp-host=<ansible-mac>,EXAANSCLD001,{{ fw_ansible_ip }}

      # --- Logging ---
      log-queries
      log-facility=/var/log/dnsmasq.log
      log-dhcp
  notify: restart dnsmasq

- name: "[dnsmasq] Create lease file directory"
  ansible.builtin.file:
    path: /var/lib/misc
    state: directory
    mode: '0755'

- name: "[dnsmasq] Create /var/log/dnsmasq.log"
  ansible.builtin.file:
    path: /var/log/dnsmasq.log
    state: touch
    mode: '0640'
    modification_time: preserve
    access_time: preserve

- name: "[dnsmasq] Write logrotate config for dnsmasq"
  ansible.builtin.copy:
    dest: /etc/logrotate.d/dnsmasq
    mode: '0644'
    content: |
      /var/log/dnsmasq.log {
        daily
        rotate 7
        compress
        missingok
        notifempty
        postrotate
          systemctl restart dnsmasq >/dev/null 2>&1 || true
        endscript
      }

# ── systemd drop-in: wait for LAN device before starting ─────────────────────

- name: "[dnsmasq] Create dnsmasq systemd drop-in directory"
  ansible.builtin.file:
    path: /etc/systemd/system/dnsmasq.service.d
    state: directory
    mode: '0755'

- name: "[dnsmasq] Write wait-for-lan drop-in"
  ansible.builtin.copy:
    dest: /etc/systemd/system/dnsmasq.service.d/wait-for-lan.conf
    mode: '0644'
    content: |
      [Unit]
      After=network-online.target sys-subsystem-net-devices-{{ fw_lan_iface }}.device
      Wants=network-online.target sys-subsystem-net-devices-{{ fw_lan_iface }}.device
  notify: restart dnsmasq

- name: "[dnsmasq] Reload systemd daemon after drop-in"
  ansible.builtin.systemd:
    daemon_reload: true

- name: "[dnsmasq] Enable dnsmasq (queued for boot only — WAN not yet activated)"
  ansible.builtin.systemd:
    name: dnsmasq
    enabled: true
  when: not fw_wan_activate

- name: "[dnsmasq] Enable and start dnsmasq"
  ansible.builtin.systemd:
    name: dnsmasq
    enabled: true
    state: started
  when: fw_wan_activate

- name: "[dnsmasq] Flush handlers"
  ansible.builtin.meta: flush_handlers

- name: "[dnsmasq] Verify dnsmasq is listening on LAN"
  ansible.builtin.shell: "ss -ulnp | grep ':53'"
  register: dnsmasq_listen
  changed_when: false
  when: fw_wan_activate

- name: "[dnsmasq] Show listening sockets"
  ansible.builtin.debug:
    msg: "{{ dnsmasq_listen.stdout_lines }}"
  when: fw_wan_activate

- name: "[dnsmasq] NOTE — start deferred"
  ansible.builtin.debug:
    msg: >-
      {{ _c.Y }}[!]{{ _c.NC }} dnsmasq enabled but not started — WAN not yet activated
      this run. It will start on next boot, or bring it up now with:
      {{ _c.G }}systemctl start dnsmasq{{ _c.NC }}
  when: not fw_wan_activate
