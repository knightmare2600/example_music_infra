---
# =============================================================================
# roles/firewall/tasks/00_preflight_4_post_ask.yml
# Example Music Limited — Derivation that depends on the operator's answers
# =============================================================================
# Runs after 00_preflight_3_ask.yml, before 00_preflight_5_confirm.yml. Still no writes to
# the box -- these are facts that couldn't be computed until the ask phase's
# overrides were known (final interface names, chosen WireGuard hub/role).
#
# MAC lookups used to live in 01_interfaces.yml, and the AllowedIPs builder in
# 03_wireguard_config.yml -- both moved here as part of the 2026-07-14
# "ask everything, then run" restructure (see 00_preflight_3_ask.yml's own header),
# since both need the FINAL fw_wan_iface/fw_lan_iface/fw_wg_hub_site/fw_wg_role
# values, not the pre-override detected/default ones.
#
# BUG FIX (2026-08-08, Robert, live on EXAFWLLAX001): all_sites was built as
# [hub] + wg_hub_topology[hub]['spokes'] with no exclusion of the current spoke's
# own fw_site_code -- since wg_hub_topology[hub]['spokes'] lists every spoke under
# that hub, including whichever spoke this AllowedIPs list is being generated
# for. Every spoke's own [Peer] AllowedIPs therefore included its own subnets
# (10.0.<own_octet>.0/24, 192.168.<own_octet>.0/24), which wg-quick then installs
# as real kernel routes via wg0 -- a second, competing route to the box's own
# directly-connected LAN alongside the correct one via fw_lan_iface. Confirmed
# live: LAX's own `ip route show` had both "192.168.213.0/24 dev wg0 scope link"
# and "192.168.213.0/24 dev ens19 ... metric 200" simultaneously. Symptom: the
# firewall's own self-sourced traffic (ping/nmap run on the box itself) worked
# fine in every direction (never touches this route at all -- self-sourced
# traffic doesn't need the "packet arrives on wg0, forward back out fw_lan_iface
# to a real LAN client" hop), but real LAN client traffic through the tunnel
# failed 100% -- return packets destined for a LAN client were ambiguously
# routed, competing against the bogus wg0 route for the box's own subnet,
# instead of reliably forwarding out fw_lan_iface. DHCP/ARP to the firewall
# itself kept working throughout, since those are pure L2/broadcast and never
# touch this routing table at all -- which is what made this look like a
# DNS/lease problem at first rather than a routing one. Fixed by excluding
# fw_site_code from all_sites before the subnet-building loop runs. This
# template is shared by every spoke -- every existing spoke's wg0.conf almost
# certainly has this same self-referential route and needs regenerating, not
# just LAX.
# =============================================================================

- name: "[Derive] Get WAN MAC"
  ansible.builtin.shell: "cat /sys/class/net/{{ fw_wan_iface }}/address"
  register: fw_wan_mac_raw
  changed_when: false

- name: "[Derive] Set WAN MAC fact"
  ansible.builtin.set_fact:
    fw_wan_mac: "{{ fw_wan_mac_raw.stdout | trim }}"

- name: "[Derive] Get LAN MAC"
  ansible.builtin.shell: "cat /sys/class/net/{{ fw_lan_iface }}/address"
  register: fw_lan_mac_raw
  changed_when: false

- name: "[Derive] Set LAN MAC fact"
  ansible.builtin.set_fact:
    fw_lan_mac: "{{ fw_lan_mac_raw.stdout | trim }}"

# ── Build topology-aware AllowedIPs ──────────────────────────────────────────

- name: "[Derive] Build topology-aware AllowedIPs"
  ansible.builtin.set_fact:
    fw_wg_allowed_ips: >-
      {%- set hub = fw_wg_hub_site -%}
      {%- set parts = [] -%}
      {%- set topo = wg_hub_topology[hub]['spokes'] | default([]) -%}
      {%- set all_sites = ([hub] + topo) | reject('equalto', fw_site_code) | list -%}
      {%- for code in all_sites -%}
        {%- set octet = wg_site_octets[code] | default('') -%}
        {%- if octet != '' -%}
          {%- set _ = parts.append('10.0.' + octet|string + '.0/24') -%}
          {%- set _ = parts.append('192.168.' + octet|string + '.0/24') -%}
          {%- for extra in wg_site_extra_subnets[code] | default([]) -%}
            {%- set _ = parts.append(extra) -%}
          {%- endfor -%}
        {%- endif -%}
      {%- endfor -%}
      {%- for mgmt in wg_management_hubs | default([]) -%}
        {%- if mgmt not in all_sites -%}
          {%- set octet = wg_site_octets[mgmt] | default('') -%}
          {%- if octet != '' -%}
            {%- set _ = parts.append('10.0.' + octet|string + '.0/24') -%}
            {%- set _ = parts.append('192.168.' + octet|string + '.0/24') -%}
            {%- for extra in wg_site_extra_subnets[mgmt] | default([]) -%}
              {%- set _ = parts.append(extra) -%}
            {%- endfor -%}
          {%- endif -%}
        {%- endif -%}
      {%- endfor -%}
      {{ parts | join(', ') }}
  when:
    - not fw_is_black_site
    - fw_wg_role == 'spoke'

- name: "[Derive] WireGuard summary — spoke"
  ansible.builtin.debug:
    msg:
      - "{{ _c.G }}[+]{{ _c.NC }} WG role      : {{ _c.G }}{{ fw_wg_role }}{{ _c.NC }}"
      - "{{ _c.O }}[+]{{ _c.NC }} Tunnel IP    : {{ _c.O }}{{ fw_wg_tunnel_ip }}/24{{ _c.NC }}"
      - "{{ _c.O }}[+]{{ _c.NC }} Hub          : {{ _c.O }}{{ fw_wg_hub_site }} — {{ fw_wg_hub_endpoint }}{{ _c.NC }}"
      - "{{ _c.O }}[+]{{ _c.NC }} Hub pubkey   : {{ _c.O }}{{ fw_wg_hub_pubkey }}{{ _c.NC }}"
      - "{{ _c.C }}[+]{{ _c.NC }} AllowedIPs   : {{ fw_wg_allowed_ips }}"
  when:
    - not fw_is_black_site
    - fw_wg_role == 'spoke'

- name: "[Derive] WireGuard summary — hub"
  ansible.builtin.debug:
    msg:
      - "{{ _c.G }}[+]{{ _c.NC }} WG role    : {{ _c.G }}{{ fw_wg_role }}{{ _c.NC }}"
      - "{{ _c.O }}[+]{{ _c.NC }} Tunnel IP  : {{ _c.O }}{{ fw_wg_tunnel_ip }}/24{{ _c.NC }}"
      - "{{ _c.O }}[+]{{ _c.NC }} Port       : {{ _c.O }}{{ fw_wg_port }}{{ _c.NC }}"
  when:
    - not fw_is_black_site
    - fw_wg_role in ['hub-primary', 'hub-regional']
