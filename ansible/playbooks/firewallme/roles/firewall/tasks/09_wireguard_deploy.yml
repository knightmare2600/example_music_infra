---
# =============================================================================
# roles/firewall/tasks/09_wireguard_deploy.yml
# Example Music Limited — WireGuard key generation and wg0.conf deployment
# =============================================================================
# Mirrors firewallme.sh WG section: generate keypair (preserve if exists),
# write /etc/wireguard/wg0.conf, enable wg-quick@wg0.
# Key generation / wg0.conf [Interface] write / drop-in are skipped for CLD
# (fw_is_black_site) unless fw_hub_bootstrap_confirmed is true (2026-07-18,
# 00_preflight_3_ask.yml's CLD-only "no existing hub config found" prompt) --
# the keypair and [Interface] section are generic, not CLD-specific; only the
# hand-maintained multi-hub [Peer] list is genuinely something Ansible can't
# construct, and that stays entirely with add-wg-spoke.yml/10_register_spoke_
# on_hub.yml regardless of this flag. Also gated on fw_wg_role == 'none'.
# Enabling/starting/verifying wg-quick@wg0 is NOT skipped for CLD (2026-07-17)
# regardless of bootstrap confirmation -- every FWL node must have WireGuard
# enabled, full stop; that guarantee doesn't need CLD-specific config knowledge.
# Changelog:
#   2026-06-20  Initial file
#   2026-06-29  Add wg-quick@wg0 network-online.target drop-in (bug fix: shipped
#               unit only has After=network.target which fires before any interface
#               has an IP, causing endpoint resolution failures at boot)
#   2026-07-16  Robert, live (EXAFWLBRT001): `wg-quick up wg0` failed outright --
#               "resolvconf: command not found" -- then tore the interface back down.
#               The spoke wg0.conf's [Interface] DNS = line requires wg-quick to shell
#               out to resolvconf (or systemd-resolved) to apply it; neither is
#               installed, and doesn't need to be. Removed the DNS = line instead of
#               adding resolvconf as a new package dependency: this firewall already
#               resolves via its own dnsmasq (08_dnsmasq.yml writes /etc/resolv.conf
#               pointing at 127.0.0.1 independently of the tunnel) -- the [Interface]
#               DNS directive exists for client devices that route their default DNS
#               through a WireGuard tunnel, not for a box that's already its own
#               resolver. Hub wg0.conf never had this line to begin with.
#   2026-07-17  Robert: pointed out that add-wg-spoke.yml (a standalone playbook that
#               blockinfile-inserts a spoke's [Peer] block into a hub's wg0.conf,
#               live, without a full role re-run) should never "fight" this role.
#               Found it would have: the hub's [Interface] section below used
#               ansible.builtin.copy with fixed content -- copy replaces the WHOLE
#               file whenever the on-disk content doesn't byte-match, and a hub with
#               spokes already added via add-wg-spoke.yml's blockinfile no longer
#               matches (extra [Peer] blocks appended below). A full role re-run
#               against a hub would have silently wiped every spoke peer added since
#               the hub was first provisioned. Converted to blockinfile with its own
#               marker, matching the exact mechanism add-wg-spoke.yml already uses --
#               a re-run now only ever touches the [Interface] block, leaving every
#               independently-marked [Peer] block alone regardless of how many exist
#               or in what order. Also dropped the {{ ansible_date_time.iso8601 }}
#               timestamp from the header comment -- it made the block content differ
#               (and so falsely report changed / notify restart wireguard) on every
#               single routine run even when nothing else had changed.
#   2026-07-18  WireGuard hub bootstrap plan, item 5: key generation, the hub
#               [Interface] blockinfile write, and the wg-quick drop-in now also run
#               for the black site when fw_hub_bootstrap_confirmed is true -- gives
#               CLD a real from-scratch bootstrap path (mirrors windows_dc's
#               dc_is_forest_root branch), rather than every piece of this being
#               unconditionally skipped forever regardless of whether CLD's tunnel
#               interface actually exists yet. Peer management stays entirely with
#               add-wg-spoke.yml/10_register_spoke_on_hub.yml, unchanged.
# =============================================================================

- name: "[WireGuard] Skip — not applicable (role=none or black site not bootstrapping)"
  ansible.builtin.debug:
    msg: "WireGuard role is '{{ fw_wg_role }}' — skipping WG deployment."
  when: fw_wg_role == 'none' or (fw_is_black_site and not fw_hub_bootstrap_confirmed)

# ── Key generation (preserve if already exists) ───────────────────────────────
# fw_hub_bootstrap_confirmed (set in 00_preflight_3_ask.yml, only ever true for
# the black site, only when the operator confirmed a from-scratch hub setup)
# lets these run for CLD too -- the keypair itself is generic, not CLD-specific;
# only the multi-hub peer list is hand-maintained outside this role.

- name: "[WireGuard] Check for existing private key"
  ansible.builtin.stat:
    path: /etc/wireguard/private.key
  register: wg_privkey_existing
  when: fw_wg_role != 'none' and (not fw_is_black_site or fw_hub_bootstrap_confirmed)

- name: "[WireGuard] Generate private key (new install)"
  ansible.builtin.shell: |
    install -m 0700 -d /etc/wireguard
    wg genkey | tee /etc/wireguard/private.key | wg pubkey > /etc/wireguard/public.key
    chmod 0600 /etc/wireguard/private.key
    chmod 0644 /etc/wireguard/public.key
  when:
    - fw_wg_role != 'none'
    - not fw_is_black_site or fw_hub_bootstrap_confirmed
    - not wg_privkey_existing.stat.exists

- name: "[WireGuard] Read private key"
  ansible.builtin.slurp:
    src: /etc/wireguard/private.key
  register: wg_privkey_b64
  when: fw_wg_role != 'none' and (not fw_is_black_site or fw_hub_bootstrap_confirmed)

- name: "[WireGuard] Read public key"
  ansible.builtin.slurp:
    src: /etc/wireguard/public.key
  register: wg_pubkey_b64
  when: fw_wg_role != 'none' and (not fw_is_black_site or fw_hub_bootstrap_confirmed)

- name: "[WireGuard] Set key facts"
  ansible.builtin.set_fact:
    fw_wg_privkey: "{{ wg_privkey_b64.content | b64decode | trim }}"
    fw_wg_pubkey:  "{{ wg_pubkey_b64.content | b64decode | trim }}"
  when: fw_wg_role != 'none' and (not fw_is_black_site or fw_hub_bootstrap_confirmed)

- name: "[WireGuard] Display public key (needed for hub peer registration)"
  ansible.builtin.debug:
    msg:
      - "Public key for {{ inventory_hostname }}:"
      - "{{ fw_wg_pubkey }}"
      - ""
      - "Register this as a peer on {{ fw_wg_hub_site | default('the hub') }}"
      - "  wg set wg0 peer {{ fw_wg_pubkey }} allowed-ips {{ fw_wg_tunnel_ip }}/32,{{ fw_subnet }}.0/24"
  when: fw_wg_role != 'none' and not fw_is_black_site

# ── Generate preshared key ────────────────────────────────────────────────────

- name: "[WireGuard] Check for existing preshared key"
  ansible.builtin.stat:
    path: /etc/wireguard/preshared.key
  register: wg_psk_existing
  when: fw_wg_role != 'none' and not fw_is_black_site

- name: "[WireGuard] Generate preshared key"
  ansible.builtin.shell: |
    wg genpsk > /etc/wireguard/preshared.key
    chmod 0600 /etc/wireguard/preshared.key
  when:
    - fw_wg_role != 'none'
    - not fw_is_black_site
    - not wg_psk_existing.stat.exists

- name: "[WireGuard] Read preshared key"
  ansible.builtin.slurp:
    src: /etc/wireguard/preshared.key
  register: wg_psk_b64
  when: fw_wg_role != 'none' and not fw_is_black_site

- name: "[WireGuard] Set PSK fact"
  ansible.builtin.set_fact:
    fw_wg_psk: "{{ wg_psk_b64.content | b64decode | trim }}"
  when: fw_wg_role != 'none' and not fw_is_black_site

# ── Write wg0.conf — spoke ────────────────────────────────────────────────────

- name: "[WireGuard] Write wg0.conf (spoke)"
  ansible.builtin.copy:
    dest: /etc/wireguard/wg0.conf
    mode: '0600'
    content: |
      # ==========================================================================
      # /etc/wireguard/wg0.conf
      # Example Music Limited — {{ inventory_hostname }} (spoke)
      # Site: {{ fw_site_code }}  Hub: {{ fw_wg_hub_site }}
      # Generated by Ansible firewall role — {{ ansible_date_time.iso8601 }}
      # ==========================================================================

      [Interface]
      PrivateKey = {{ fw_wg_privkey }}
      Address    = {{ fw_wg_tunnel_ip }}/24

      PostUp   = nft add rule inet filter forward iifname "wg0" accept
      PostUp   = nft add rule inet filter forward oifname "wg0" accept
      PreDown  = nft delete rule inet filter forward iifname "wg0" accept
      PreDown  = nft delete rule inet filter forward oifname "wg0" accept

      [Peer]
      # {{ fw_wg_hub_site }} hub — {{ fw_wg_hub_endpoint }}
      PublicKey    = {{ fw_wg_hub_pubkey }}
      PresharedKey = {{ fw_wg_psk }}
      Endpoint     = {{ fw_wg_hub_endpoint }}
      AllowedIPs   = {{ fw_wg_allowed_ips }}
      PersistentKeepalive = 25
  when:
    - fw_wg_role == 'spoke'
    - not fw_is_black_site
  notify: restart wireguard

# ── Write wg0.conf — hub ──────────────────────────────────────────────────────
# blockinfile, not copy: this must coexist with playbooks/add-wg-spoke.yml, which
# blockinfile-inserts a [Peer] block per spoke into this same file, live, without a
# full role re-run. copy would replace the whole file (wiping every spoke peer
# already added) the moment its fixed content stopped byte-matching what's on disk
# -- see 2026-07-17 changelog above. blockinfile only ever touches its own marked
# block, so this and add-wg-spoke.yml never fight each other regardless of run order.

- name: "[WireGuard] Write wg0.conf [Interface] block (hub — peers managed separately by add-wg-spoke.yml)"
  ansible.builtin.blockinfile:
    path: /etc/wireguard/wg0.conf
    create: true
    mode: '0600'
    marker: "# {mark} ANSIBLE MANAGED BLOCK INTERFACE"
    insertbefore: BOF
    block: |
      # ==========================================================================
      # /etc/wireguard/wg0.conf
      # Example Music Limited — {{ inventory_hostname }} ({{ fw_wg_role }})
      # Site: {{ fw_site_code }}
      # Generated by Ansible firewall role
      # NOTE: Spoke [Peer] blocks are appended by playbooks/add-wg-spoke.yml, each in
      # its own marked block below -- never touched by this task.
      # ==========================================================================

      [Interface]
      PrivateKey = {{ fw_wg_privkey }}
      Address    = {{ fw_wg_tunnel_ip }}/24
      ListenPort = {{ fw_wg_port }}

      PostUp   = nft add rule inet filter input iifname "wg0" accept
      PostUp   = nft add rule inet filter forward iifname "wg0" accept
      PostUp   = nft add rule inet filter forward oifname "wg0" accept
      PreDown  = nft flush chain inet filter input
      PreDown  = nft flush chain inet filter forward
  when:
    - fw_wg_role in ['hub-primary', 'hub-regional']
    - not fw_is_black_site or fw_hub_bootstrap_confirmed
  notify: restart wireguard

# ── wg-quick network-online.target drop-in ────────────────────────────────────
# BUG FIX (2026-06-14): wg-quick@wg0.service ships with After=network.target
# which is satisfied before any interface has an IP. Endpoint resolution then
# fails at boot. Drop-in adds After=network-online.target to wait for NM to
# report a fully online interface before WireGuard starts.
#
# 2026-07-16, Robert: this alone still didn't make wg-quick reliably come up at boot on
# real firewalls -- manual `wg-quick up wg0` needed on a number of nodes. Real gap:
# NetworkManager-wait-online.service (enabled by 06_network_manager.yml) is a known,
# documented source of this exact symptom -- it can consider itself "online" once *any*
# connection settles, not specifically once OUR wan/lan profiles have, so
# network-online.target can fire before this box's own interfaces are actually ready.
# Added WG_ENDPOINT_RESOLUTION_RETRIES=infinity -- wg-quick's own, documented mechanism
# for exactly this: retry resolving the [Peer] Endpoint hostname indefinitely at startup
# instead of failing outright the first time DNS/network isn't fully ready, rather than
# trying to out-guess NetworkManager's own readiness signal. Explicit here rather than
# assumed already present in the shipped unit.
#
# 2026-07-17, Robert: found live on EXAFWLCLD001 that this drop-in was missing three
# things firewallme.sh's own drop-in already has (script lines 1877-1894, its
# 2026-06-28 changelog entry #3) -- ported all three rather than leave this port
# thinner than the trusted script it's replacing:
#   - After=NetworkManager-wait-online.service explicitly (not just network-online.target,
#     which is a generic target NetworkManager-wait-online.service itself feeds into --
#     naming the specific unit directly is what firewallme.sh does and is more precise).
#   - ExecStartPre=/bin/sleep 5 -- a settle period after NM reports ready, covering the
#     residual race where route table updates are still in progress.
#   - Restart=on-failure / RestartSec=10 / StartLimitIntervalSec=60 / StartLimitBurst=3 --
#     self-heals the rare case where wg-quick still loses the race, instead of leaving
#     wg0 permanently down until someone notices and runs `wg-quick up` by hand.

- name: "[WireGuard] Create wg-quick@wg0 drop-in directory"
  ansible.builtin.file:
    path: /etc/systemd/system/wg-quick@wg0.service.d
    state: directory
    mode: '0755'
  when: fw_wg_role != 'none' and (not fw_is_black_site or fw_hub_bootstrap_confirmed)

- name: "[WireGuard] Write network-online.target drop-in for wg-quick@wg0"
  ansible.builtin.copy:
    dest: /etc/systemd/system/wg-quick@wg0.service.d/wait-online.conf
    mode: '0644'
    content: |
      [Unit]
      After=network-online.target NetworkManager-wait-online.service
      Wants=network-online.target

      [Service]
      Environment=WG_ENDPOINT_RESOLUTION_RETRIES=infinity
      ExecStartPre=/bin/sleep 5
      Restart=on-failure
      RestartSec=10
      StartLimitIntervalSec=60
      StartLimitBurst=3
  when: fw_wg_role != 'none' and (not fw_is_black_site or fw_hub_bootstrap_confirmed)

# ── Enable wg-quick ───────────────────────────────────────────────────────────
# Robert, 2026-07-17: NOT gated on fw_is_black_site, unlike everything above --
# "isolated" (CLD's config isn't templated by this role, since Ansible doesn't
# know how to build its unique hand-maintained multi-hub peer list) is not the
# same thing as "skip a baseline guarantee we already know every FWL node
# needs." His words: "ALL FWL nodes MUST have wireguard enabled, otherwise
# what is the point in having it on a FWL node?" Key generation/wg0.conf
# write/drop-in stay CLD-excluded above (Ansible genuinely can't construct
# CLD's config); the service being enabled does not need CLD-specific
# knowledge, so there's no reason to skip it there too.

- name: "[WireGuard] Enable wg-quick@wg0 (queued for boot only — WAN not yet activated)"
  ansible.builtin.systemd:
    name: wg-quick@wg0
    enabled: true
    daemon_reload: true
  when:
    - fw_wg_role != 'none'
    - not fw_wan_activate

- name: "[WireGuard] Enable and start wg-quick@wg0"
  ansible.builtin.systemd:
    name: wg-quick@wg0
    enabled: true
    state: started
    daemon_reload: true
  when:
    - fw_wg_role != 'none'
    - fw_wan_activate

- name: "[WireGuard] NOTE — start deferred"
  ansible.builtin.debug:
    msg: >-
      {{ _c.Y }}[!]{{ _c.NC }} wg-quick@wg0 enabled but not started — WAN not yet activated
      this run. It will start on next boot, or bring it up now with:
      {{ _c.G }}systemctl start wg-quick@wg0{{ _c.NC }}
  when:
    - fw_wg_role != 'none'
    - not fw_wan_activate

- name: "[WireGuard] Flush handlers"
  ansible.builtin.meta: flush_handlers

- name: "[WireGuard] Verify wg0 interface is up"
  ansible.builtin.shell: wg show wg0
  register: wg_show
  changed_when: false
  failed_when: false
  when:
    - fw_wg_role != 'none'
    - fw_wan_activate

- name: "[WireGuard] Show wg status"
  ansible.builtin.debug:
    msg: "{{ wg_show.stdout_lines }}"
  when:
    - fw_wan_activate
    - fw_wg_role != 'none'
    - wg_show.stdout_lines is defined
