---
# =============================================================================
# roles/firewall/tasks/00_preflight_5_confirm.yml
# Example Music Limited — Pre-apply summary and operator confirmation
# =============================================================================
# Changelog:
#   2026-06-20  Initial file
#   2026-06-20  Colourised — replicates firewallme.sh final summary block
#   2026-07-09  Reboot question moved here from 10_finish.yml (was asked at the very
#               end, after everything was already applied). Now asked alongside every
#               other confirmation, before any writes happen — the answer is stored
#               as fw_reboot_requested and acted on at the end, not re-asked there.
#   2026-07-14  Fixed two real bugs found live (EXAFWLBRT001): every content line was
#               missing its closing right-hand "║" entirely (only the title/divider/
#               border lines ever had one -- content lines were built as open-ended
#               strings with no right border at all, not a width-overflow issue).
#               Fixed by computing each line's PLAIN (uncoloured) text first, padding
#               it to the box's real 62-column inner width, then wrapping the value
#               in colour and closing with the border -- padding is computed from the
#               plain length so embedded ANSI colour codes (zero-width) never throw
#               off alignment. Also fixed the "WireGuard : {{ role }}" line using
#               _c.G (green) instead of _c.O (orange) -- colours.yml's own header
#               comment reserves orange for "WireGuard details, tunnel info", and
#               03_wireguard_config.yml's own per-section summary already colours
#               this line orange; only this box's copy was inconsistent.
#   2026-07-14  Robert: "vars_prompt do it now" -- part of the same restructure
#               documented in 00_preflight_3_ask.yml's header. Also fixed a real, separate
#               bug exposed by that restructure: the systemd .link file writes used
#               to run in 01_interfaces.yml, BEFORE this file's own "Nothing has been
#               written to disk yet" confirmation text -- silently contradicting it.
#               Moved here, after the confirm gate, so that claim is actually true.
#   2026-07-14  Cosmetic fix: "WAN activate" showed the raw Python/Jinja boolean
#               (True/False) while every other field in the box reads as a real word
#               (static, ENABLED open, disabled). Now renders yes/no like everything else.
#   2026-07-16  Robert, live (EXAFWLBRT001): three fixes from the same run.
#               (1) The summary box's own title line was hand-typed padding (57 chars
#               against a 62-wide border) -- same bug class as 2026-07-14's fix above,
#               on the one line that fix didn't touch since it's a title, not a content
#               row. Now computed the same way (centre the title text in the real
#               62-column width).
#               (2) Added a line to the reboot prompt: a reboot can be forced later in
#               the run regardless of the answer given here, if a live WAN address
#               correction can't be applied safely without one (06_network_manager.yml's
#               strand guard) -- Robert was confused seeing a reboot happen after
#               answering "no" here; the override was already correct and intentional,
#               the prompt just never said it could happen.
#               (3) Robert: "I like the gatekeeping" but running ansible-playbook
#               already means you want to proceed -- flipped the final confirm from
#               "type yes to proceed, anything else aborts" to "press Enter to proceed,
#               type no to abort". Still a real gate, just defaults the direction that
#               matches actually running the command.
# =============================================================================

- name: "[Summary] Display full configuration summary"
  ansible.builtin.debug:
    msg:
      - ""
      - "{{ _c.C }}╔══════════════════════════════════════════════════════════════╗{{ _c.NC }}"
      - >-
        {%- set text = "Configuration Summary" -%}
        {%- set lp = (62 - text|length) // 2 -%}
        {%- set rp = 62 - text|length - lp -%}
        {{ _c.C }}║{{ _c.NC }}{{ _c.W }}{{ ' ' * lp }}{{ text }}{{ ' ' * rp }}{{ _c.NC }}{{ _c.C }}║{{ _c.NC }}
      - "{{ _c.C }}╠══════════════════════════════════════════════════════════════╣{{ _c.NC }}"
      - >-
        {%- set plain = "  Hostname      : " + inventory_hostname -%}
        {{ _c.C }}║{{ _c.NC }}  Hostname      : {{ _c.W }}{{ inventory_hostname }}{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.C }}║{{ _c.NC }}
      - >-
        {%- set plain = "  Site          : " + fw_site_code -%}
        {{ _c.C }}║{{ _c.NC }}  Site          : {{ _c.G }}{{ fw_site_code }}{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.C }}║{{ _c.NC }}
      - >-
        {%- set plain = "  Environment   : " + fw_environment -%}
        {{ _c.C }}║{{ _c.NC }}  Environment   : {{ _c.G }}{{ fw_environment }}{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.C }}║{{ _c.NC }}
      - >-
        {%- set bsval = 'YES' if fw_is_black_site else 'no' -%}
        {%- set plain = "  Black-site    : " + bsval -%}
        {{ _c.C }}║{{ _c.NC }}  Black-site    : {{ (_c.R + bsval + _c.NC) if fw_is_black_site else (_c.G + bsval + _c.NC) }}{{ ' ' * (62 - plain|length) }}{{ _c.C }}║{{ _c.NC }}
      - "{{ _c.C }}╠══════════════════════════════════════════════════════════════╣{{ _c.NC }}"
      - >-
        {%- set val = fw_wan_iface + " (MAC: " + fw_wan_mac + ")" -%}
        {%- set plain = "  WAN iface     : " + val -%}
        {{ _c.C }}║{{ _c.NC }}  WAN iface     : {{ _c.G }}{{ fw_wan_iface }}{{ _c.NC }} (MAC: {{ fw_wan_mac }}){{ ' ' * (62 - plain|length) }}{{ _c.C }}║{{ _c.NC }}
      - >-
        {%- set plain = "  WAN mode      : " + fw_wan_mode -%}
        {{ _c.C }}║{{ _c.NC }}  WAN mode      : {{ _c.G }}{{ fw_wan_mode }}{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.C }}║{{ _c.NC }}
      - >-
        {%- set val = (fw_wan_static_ip + '/24 gw ' + fw_wan_static_gw) if fw_wan_mode == 'static' else 'DHCP' -%}
        {%- set plain = "  WAN IP        : " + val -%}
        {{ _c.C }}║{{ _c.NC }}  WAN IP        : {{ _c.G }}{{ val }}{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.C }}║{{ _c.NC }}
      - >-
        {%- set val = 'yes' if fw_wan_activate else 'no' -%}
        {%- set plain = "  WAN activate  : " + val -%}
        {{ _c.C }}║{{ _c.NC }}  WAN activate  : {{ _c.G }}{{ val }}{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.C }}║{{ _c.NC }}
      - >-
        {%- set val = ('ENABLED' + (' src:' + fw_wan_ssh_src if fw_wan_ssh_src else ' open')) if fw_wan_ssh_enabled else 'disabled' -%}
        {%- set plain = "  WAN SSH       : " + val -%}
        {{ _c.C }}║{{ _c.NC }}  WAN SSH       : {{ (_c.R + val + _c.NC) if fw_wan_ssh_enabled else (_c.Y + val + _c.NC) }}{{ ' ' * (62 - plain|length) }}{{ _c.C }}║{{ _c.NC }}
      - "{{ _c.C }}╠══════════════════════════════════════════════════════════════╣{{ _c.NC }}"
      - >-
        {%- set val = fw_lan_iface + " (MAC: " + fw_lan_mac + ")" -%}
        {%- set plain = "  LAN iface     : " + val -%}
        {{ _c.C }}║{{ _c.NC }}  LAN iface     : {{ _c.G }}{{ fw_lan_iface }}{{ _c.NC }} (MAC: {{ fw_lan_mac }}){{ ' ' * (62 - plain|length) }}{{ _c.C }}║{{ _c.NC }}
      - >-
        {%- set plain = "  LAN IP        : " + fw_lan_ip + "/24" -%}
        {{ _c.C }}║{{ _c.NC }}  LAN IP        : {{ _c.G }}{{ fw_lan_ip }}/24{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.C }}║{{ _c.NC }}
      - >-
        {%- set plain = "  DHCP range    : " + fw_dhcp_start + " – " + fw_dhcp_end -%}
        {{ _c.C }}║{{ _c.NC }}  DHCP range    : {{ _c.G }}{{ fw_dhcp_start }} – {{ fw_dhcp_end }}{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.C }}║{{ _c.NC }}
      - >-
        {%- set plain = "  Ansible IP    : " + fw_ansible_ip -%}
        {{ _c.C }}║{{ _c.NC }}  Ansible IP    : {{ _c.G }}{{ fw_ansible_ip }}{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.C }}║{{ _c.NC }}
      - >-
        {%- set plain = "  WAN DNS       : " + fw_cld_dns + ", " + fw_inet_dns -%}
        {{ _c.C }}║{{ _c.NC }}  WAN DNS       : {{ _c.G }}{{ fw_cld_dns }}, {{ fw_inet_dns }}{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.C }}║{{ _c.NC }}
      - >-
        {%- set plain = "  LAN DNS       : " + fw_dc_dns + ", " + fw_cld_dns -%}
        {{ _c.C }}║{{ _c.NC }}  LAN DNS       : {{ _c.G }}{{ fw_dc_dns }}, {{ fw_cld_dns }}{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.C }}║{{ _c.NC }}
      - "{{ _c.C }}╠══════════════════════════════════════════════════════════════╣{{ _c.NC }}"
      - >-
        {%- set plain = "  WireGuard     : " + fw_wg_role -%}
        {{ _c.C }}║{{ _c.NC }}  WireGuard     : {{ _c.O }}{{ fw_wg_role }}{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.C }}║{{ _c.NC }}
      - >-
        {%- set val = (fw_wg_tunnel_ip + '/24 (' + fw_wg_tunnel_net + ')') if fw_wg_role != 'none' else 'N/A' -%}
        {%- set plain = "  WG tunnel     : " + val -%}
        {{ _c.C }}║{{ _c.NC }}  WG tunnel     : {{ _c.O }}{{ val }}{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.C }}║{{ _c.NC }}
      - >-
        {%- set val = fw_wg_hub_endpoint | default('N/A') -%}
        {%- set plain = "  WG hub        : " + val -%}
        {{ _c.C }}║{{ _c.NC }}  WG hub        : {{ _c.O }}{{ val }}{{ _c.NC }}{{ ' ' * (62 - plain|length) }}{{ _c.C }}║{{ _c.NC }}
      - "{{ _c.C }}╚══════════════════════════════════════════════════════════════╝{{ _c.NC }}"

- name: "[Summary] Prompt for reboot (asked now, executed at the end)"
  ansible.builtin.pause:
    prompt: |-
      {{ _c.Y }}[!]{{ _c.NC }} A reboot is recommended after this run to ensure interface pinning
      {{ _c.Y }}[!]{{ _c.NC }} (.link files), initramfs changes, and sysctl settings all take effect
      {{ _c.Y }}[!]{{ _c.NC }} cleanly. This will happen automatically at the end of this run if you
      {{ _c.Y }}[!]{{ _c.NC }} say yes here — you won't be asked again.
      {{ _c.Y }}[!]{{ _c.NC }} A reboot may still be forced regardless of your answer here if this run
      {{ _c.Y }}[!]{{ _c.NC }} corrects a live WAN address that can't safely be applied without one.

      Reboot at the end of this run? [y/N]
  register: fw_reboot_prompt

- name: "[Summary] Set reboot decision"
  ansible.builtin.set_fact:
    fw_reboot_requested: "{{ fw_reboot_prompt.user_input | default('n') | lower | trim == 'y' }}"

- name: "[Summary] Operator confirmation"
  ansible.builtin.pause:
    prompt: |-

      {{ _c.Y }}[!]{{ _c.NC }} Review the configuration above carefully.
      {{ _c.Y }}[!]{{ _c.NC }} Nothing has been written to disk yet.

      Press {{ _c.G }}Enter{{ _c.NC }} to apply all changes, or type {{ _c.R }}no{{ _c.NC }} to abort
  register: fw_summary_confirm

- name: "[Summary] ABORT — operator did not confirm"
  ansible.builtin.fail:
    msg: "{{ _c.R }}[ERROR]{{ _c.NC }} Aborted by operator."
  when: fw_summary_confirm.user_input | trim | lower in ['n', 'no']

- name: "[Summary] Applying configuration"
  ansible.builtin.debug:
    msg: "{{ _c.G }}[+]{{ _c.NC }} Confirmed — applying configuration to {{ _c.W }}{{ inventory_hostname }}{{ _c.NC }}"

# ── First real writes — systemd .link files (moved from 01_interfaces.yml) ──
# These used to run during the ask phase, before the operator had even seen
# this confirmation screen -- moved here so they only happen after "yes".

- name: "[Summary] Write systemd .link files directory"
  ansible.builtin.file:
    path: /etc/systemd/network
    state: directory
    mode: '0755'

- name: "[Summary] Write WAN .link file"
  ansible.builtin.copy:
    dest: /etc/systemd/network/10-wan.link
    mode: '0644'
    content: |
      # Example Music — WAN interface pin
      # Written by Ansible firewall role
      # MAC: {{ fw_wan_mac }}  interface: {{ fw_wan_iface }}
      [Match]
      MACAddress={{ fw_wan_mac }}
      [Link]
      Name={{ fw_wan_iface }}

- name: "[Summary] Write LAN .link file"
  ansible.builtin.copy:
    dest: /etc/systemd/network/10-lan.link
    mode: '0644'
    content: |
      # Example Music — LAN interface pin
      # Written by Ansible firewall role
      # MAC: {{ fw_lan_mac }}  interface: {{ fw_lan_iface }}
      [Match]
      MACAddress={{ fw_lan_mac }}
      [Link]
      Name={{ fw_lan_iface }}

- name: "[Summary] Interface pinning summary"
  ansible.builtin.debug:
    msg:
      - "{{ _c.G }}[+]{{ _c.NC }} Interface names pinned: WAN={{ _c.C }}{{ fw_wan_iface }}{{ _c.NC }} ({{ fw_wan_mac }}), LAN={{ _c.C }}{{ fw_lan_iface }}{{ _c.NC }} ({{ fw_lan_mac }})"
      - "{{ _c.G }}[+]{{ _c.NC }} LAN IP: {{ _c.G }}{{ fw_lan_ip }}/24{{ _c.NC }}"
