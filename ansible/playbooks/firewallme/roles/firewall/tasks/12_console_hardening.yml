---
# =============================================================================
# roles/firewall/tasks/12_console_hardening.yml
# Example Music Limited — Firewall role: console Ctrl+Alt+Del hardening
# =============================================================================
# Prevents a console-sent Ctrl+Alt+Del (e.g. via Proxmox's noVNC/xterm.js
# console — out-of-band from SSH entirely) from rebooting a live firewall VM.
# Added after INC-2026-08-21-CTRLALTDEL — see docs/INCIDENT-LOG.md for the
# full incident this closes.
#
# One protection, plus a deliberate non-protection, confirmed against
# systemd's own documented behaviour rather than assumed:
#
#   1. Mask ctrl-alt-del.target — stops systemd starting reboot.target
#      (what ctrl-alt-del.target is aliased to) on a Ctrl+Alt+Del keypress.
#      This is what actually closes INC-2026-08-21-CTRLALTDEL — that was a
#      single accidental press, not a burst.
#   2. CtrlAltDelBurstAction is deliberately left at systemd's own default
#      (reboot-force, confirmed via `man systemd-system.conf` on this box) —
#      pinned explicitly below rather than just leaving the drop-in file
#      absent, so it stays correct if upstream's default ever changes. A
#      masked target does NOT stop this burst path: 7 presses within 2
#      seconds bypasses the target mechanism entirely by design, specifically
#      so an admin can still force a reboot even if ctrl-alt-del.target is
#      masked or broken. Robert's call, 2026-11-01: anyone deliberately
#      mashing the burst combination is already on console — console access
#      is the trust boundary here, not this setting — so the panic-reboot
#      escape hatch stays available rather than disabled.
#
# Deliberately does NOT touch legitimate remote reboot/shutdown paths.
# Proxmox's own `qm reboot`/`qm shutdown` via qemu-guest-agent is a
# completely different mechanism (agent-mediated guest request, not a
# console keypress) and is unaffected — still the preferred way to reboot
# these VMs. molly-guard covers the SSH-issued reboot/shutdown case; this
# closes the other gap — an out-of-band console signal it never sees at all.
#
# CORRECTED 2026-10-23 (Robert's ask, real gap spotted): the paragraph above
# originally claimed molly-guard was already in place here via
# common_packages (group_vars/all/main.yml) -- wrong. Firewalls don't consume
# common_packages at all; 05_packages.yml checks its own, separate
# fw_packages list, which never actually had molly-guard in it. So the
# SSH-issued reboot/shutdown case was NOT covered until molly-guard was added
# to fw_packages (roles/firewall/defaults/main.yml) the same day -- this
# file's own console-hardening logic below is unaffected either way, it only
# ever addressed the console path.
#
# system.conf.d changes need a manager re-exec (not just daemon-reload) to
# take effect — confirmed against ansible.builtin.systemd's own
# documentation (daemon_reexec is a real, distinct parameter from
# daemon_reload), matching `systemctl daemon-reexec` directly.
#
# Tags: firewall, console_hardening
# =============================================================================
# Changelog:
#   2026-11-01  Robert's call: CtrlAltDelBurstAction changed from `none` back to systemd's
#               own default (`reboot-force`, confirmed via `man systemd-system.conf`) --
#               someone burst-pressing Ctrl+Alt+Del 7x/2s is already on console, which is
#               trust enough to allow the panic-reboot escape hatch. ctrl-alt-del.target
#               stays masked -- that's what actually closes INC-2026-08-21-CTRLALTDEL (a
#               single press), unaffected by this change.
#   2026-10-23  Corrected this file's own header claim that molly-guard already covered
#               the SSH-issued reboot/shutdown case for firewalls via common_packages --
#               wrong, firewalls never consume that var; molly-guard is now added to
#               fw_packages instead (roles/firewall/defaults/main.yml, same day). No
#               change to this file's own tasks -- they only ever addressed the console
#               path, which was never affected by the wrong claim either way.
#   2026-09-01  Robert, live (EXAFWLATL001, genuine first-ever run): the copy task below
#               failed outright -- "Destination directory /etc/systemd/system.conf.d does
#               not exist" -- since that directory isn't shipped by default on a fresh
#               Debian box and nothing here created it first. Every other custom systemd
#               drop-in directory this role writes to (network-online.service.d,
#               wg-quick@wg0.service.d, dnsmasq.service.d, cockpit.socket.d) already has
#               its own file: state=directory task immediately before its copy/template --
#               this file was the one outlier missing it, not a wider gap (swept every
#               other copy/template dest: in the role to confirm). Added the matching
#               file: state=directory task here too.
#   2026-08-26  Initial file, following INC-2026-08-21-CTRLALTDEL.
# =============================================================================

- name: "[Console] Mask ctrl-alt-del.target"
  ansible.builtin.systemd:
    name: ctrl-alt-del.target
    masked: true
  tags: [firewall, console_hardening]

- name: "[Console] Ensure /etc/systemd/system.conf.d exists"
  ansible.builtin.file:
    path: /etc/systemd/system.conf.d
    state: directory
    owner: root
    group: root
    mode: '0755'
  tags: [firewall, console_hardening]

- name: "[Console] Pin Ctrl+Alt+Del burst (panic) reboot at systemd's own default"
  ansible.builtin.copy:
    dest: /etc/systemd/system.conf.d/10-disable-ctrl-alt-del.conf
    content: |
      [Manager]
      CtrlAltDelBurstAction=reboot-force
    owner: root
    group: root
    mode: '0644'
  register: _console_hardening_conf
  tags: [firewall, console_hardening]

- name: "[Console] Re-exec systemd to apply system.conf.d changes"
  ansible.builtin.systemd:
    daemon_reexec: true
  when: _console_hardening_conf.changed
  tags: [firewall, console_hardening]
