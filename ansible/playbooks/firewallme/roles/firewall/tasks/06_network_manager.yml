---
# =============================================================================
# roles/firewall/tasks/06_network_manager.yml
# Example Music Limited — NetworkManager connection profiles
# =============================================================================
# Mirrors firewallme.sh: nmcli con delete existing, write WAN (DHCP or
# static) and LAN profiles, set DNS, bring up LAN, optionally bring up WAN.
# Changelog:
#   2026-06-20  Initial file
#   2026-06-29  Add connection.autoconnect-priority 100 to all nmcli con add calls
#               (bug fix: NM could silently skip profiles at boot without the priority)
#   2026-06-29  Fix interface activation order — WAN up + wait before LAN (bug fix:
#               DHCP race; mirrors firewallme.sh 2026-04-25 + 2026-06-14 fixes)
#   2026-06-29  Enable NetworkManager-wait-online.service (required for WireGuard
#               After=network-online.target drop-in to function correctly)
#   2026-07-09  SAFETY FIX: every task here used to `notify: restart NetworkManager`
#               (systemctl restart, tearing down every NM-managed connection on the
#               box) with no gating at all -- on essentially every run, since this
#               deleted then recreated the wan/lan profiles via nmcli every time. If
#               Ansible's own SSH session was on an NM-managed interface, this
#               restart would drop it mid-play.
#   2026-07-09  Replaced nmcli con add/delete with directly-templated .nmconnection
#               keyfiles (templates/wan.nmconnection.j2, lan.nmconnection.j2; format
#               confirmed against a real firewall's on-disk files, EXAFWLCPH001).
#               Two safety wins: (1) genuine idempotency -- if nothing changed, the
#               template task reports unchanged and never notifies anything, unlike
#               nmcli which recreated the connection (and notified) every run
#               regardless; (2) the apply mechanism is `nmcli connection reload`
#               (re-reads connection files from disk, does not tear down active
#               connections) instead of `systemctl restart NetworkManager`. UUIDs are
#               deterministic (to_uuid filter on hostname+role) so re-runs produce a
#               byte-identical file when nothing changed. Activating a profile
#               (`nmcli con up`) remains explicitly gated on fw_wan_activate, as it
#               already was for WAN.
#   2026-07-16  Robert (point 3/7 of the post-inventory-fix audit): now that every
#               firewall's ansible_host is its VRK/WAN address (generate_inventory.py,
#               2026-07-16), the interface Ansible's own SSH session rides on IS the
#               one "[NM] Bring up WAN interface" below is about to (re)activate.
#               `nmcli connection reload` (the write-profile handler) never touches an
#               already-active connection's live address -- confirmed by this file's
#               own 2026-07-09 note above -- but `nmcli con up wan` unconditionally
#               (re)applies the profile, including a changed static address, to the
#               live interface. If the box's WAN address is being corrected (e.g. it
#               was built with the wrong octet, or a stale manual config) and this
#               session is connected via that same interface, activating it live would
#               move the address out from under the SSH connection mid-play -- the
#               task itself wouldn't even report a failure, the play would just die.
#               Added a same-shape check to 07_nftables.yml's existing
#               nft_reload_would_strand_session: detect the mismatch before touching
#               anything live, skip the live activation, and force fw_reboot_requested
#               regardless of the operator's earlier answer at the confirmation
#               prompt -- otherwise a corrected profile could sit on disk, inert,
#               forever, satisfying nobody. Full playbook still runs to completion;
#               only the live WAN reactivation is deferred, matching Robert's own
#               "do the full run, ask to reboot once at the end" requirement.
# =============================================================================

# ── Remove stale auto-created NM connections for our interfaces ───────────────
# Only targets NM's own auto-created defaults (e.g. "Wired connection 1") by
# NAME -- unlike firewallme.sh's own cleanup (script lines 1254-1260), deliberately
# does NOT also match on disconnected state ("--"), since our own just-written
# wan/lan profiles are legitimately "disconnected" whenever fw_wan_activate is
# false, and a state-based match risks deleting the file we just wrote. Name-only
# matching can never touch our own profiles (fixed id "wan"/"lan").

- name: "[NM] List NM connections on our interfaces"
  ansible.builtin.shell: |
    nmcli -t -f NAME,DEVICE con show | awk -F: -v w="{{ fw_wan_iface }}" -v l="{{ fw_lan_iface }}" \
      '$2==w || $2==l {print $1}'
  register: nm_existing_on_our_ifaces
  changed_when: false

- name: "[NM] Identify stale auto-created profiles to remove"
  ansible.builtin.set_fact:
    nm_stale_profiles: >-
      {{ nm_existing_on_our_ifaces.stdout_lines
         | select('match', '.*(Wired connection|Ifupdown).*')
         | list }}

- name: "[NM] Remove stale auto-created profiles"
  ansible.builtin.command: nmcli con delete "{{ item }}"
  loop: "{{ nm_stale_profiles }}"
  when: nm_stale_profiles | length > 0

# ── WAN / LAN profiles — templated keyfiles ───────────────────────────────────

- name: "[NM] Write WAN connection profile"
  ansible.builtin.template:
    src: wan.nmconnection.j2
    dest: /etc/NetworkManager/system-connections/wan.nmconnection
    owner: root
    group: root
    mode: '0600'
  notify: reload NetworkManager connections

- name: "[NM] Write LAN connection profile"
  ansible.builtin.template:
    src: lan.nmconnection.j2
    dest: /etc/NetworkManager/system-connections/lan.nmconnection
    owner: root
    group: root
    mode: '0600'
  notify: reload NetworkManager connections

- name: "[NM] Flush handlers (reload NM connection state, if anything changed)"
  ansible.builtin.meta: flush_handlers

# ── Enable NetworkManager-wait-online ─────────────────────────────────────────

- name: "[NM] Enable NetworkManager-wait-online.service"
  ansible.builtin.systemd:
    name: NetworkManager-wait-online.service
    enabled: true

# ── Detect a live WAN address mismatch before activating ──────────────────────
# See 2026-07-16 changelog entry above — activating a changed static WAN profile
# live, on the same interface this SSH session is using, would drop the session
# mid-play. Detect the overlap before "[NM] Bring up WAN interface" runs.

- name: "[NM] Detect current session's outbound interface"
  ansible.builtin.shell: |
    ip route get 1.1.1.1 2>/dev/null | awk '{for(i=1;i<=NF;i++) if($i=="dev") print $(i+1)}'
  register: nm_current_iface
  changed_when: false

- name: "[NM] Detect WAN interface's current live address"
  ansible.builtin.shell: |
    nmcli -g IP4.ADDRESS dev show {{ fw_wan_iface }} 2>/dev/null | head -1 | cut -d/ -f1
  register: nm_wan_ip_live
  changed_when: false
  failed_when: false

- name: "[NM] Set flag — would activating WAN now strand this session?"
  ansible.builtin.set_fact:
    nm_wan_activate_would_strand_session: >-
      {{
        fw_wan_mode == 'static'
        and nm_current_iface.stdout | trim == fw_wan_iface
        and nm_wan_ip_live.stdout | trim != ''
        and nm_wan_ip_live.stdout | trim != fw_wan_static_ip
      }}

- name: "[NM] Force reboot — WAN address correction can't be applied live safely"
  ansible.builtin.set_fact:
    fw_reboot_requested: true
  when: nm_wan_activate_would_strand_session

- name: "[NM] NOTE — WAN address correction deferred to reboot"
  ansible.builtin.debug:
    msg: >-
      {{ _c.Y }}[!]{{ _c.NC }} WAN address is changing from {{ nm_wan_ip_live.stdout | trim }}
      to {{ fw_wan_static_ip }}, and this session is connected via {{ fw_wan_iface }} —
      activating it now would drop this connection. The corrected profile is written
      to disk and will take effect on reboot. A reboot has been forced for this run
      regardless of the answer given earlier at the confirmation prompt.
  when: nm_wan_activate_would_strand_session

# ── Bring up interfaces — WAN first, then LAN ─────────────────────────────────
# BUG FIX (mirrors firewallme.sh 2026-04-25 + 2026-06-14): WAN must come up and
# be polled for a live IP before LAN is activated. The original order (LAN then
# WAN) caused DHCP race conditions. WAN activation is still gated on fw_wan_activate
# so SSH operators can skip it safely, and now also on
# nm_wan_activate_would_strand_session (see above).

- name: "[NM] Bring up WAN interface"
  ansible.builtin.shell: nmcli con up wan
  register: nm_wan_up
  changed_when: nm_wan_up.rc == 0
  failed_when: false
  when: fw_wan_activate and not nm_wan_activate_would_strand_session

- name: "[NM] Wait for WAN interface to obtain an IP address"
  ansible.builtin.shell: |
    nmcli -g IP4.ADDRESS dev show {{ fw_wan_iface }} | head -1 | cut -d/ -f1
  register: nm_wan_ip_poll
  until: nm_wan_ip_poll.stdout | trim != ''
  retries: 30
  delay: 1
  changed_when: false
  when: fw_wan_activate and not nm_wan_activate_would_strand_session

- name: "[NM] Bring up LAN interface"
  ansible.builtin.shell: nmcli con up lan
  register: nm_lan_up
  changed_when: nm_lan_up.rc == 0
  failed_when: nm_lan_up.rc != 0

- name: "[NM] NOTE — WAN activation skipped"
  ansible.builtin.debug:
    msg: >
      WAN interface not activated (fw_wan_activate=false).
      Bring it up manually after this run:  nmcli con up wan
  when: not fw_wan_activate and not nm_wan_activate_would_strand_session

# ── Enable IP forwarding ──────────────────────────────────────────────────────

- name: "[NM] Enable IPv4 forwarding"
  ansible.posix.sysctl:
    name: net.ipv4.ip_forward
    value: '1'
    sysctl_set: true
    state: present
    reload: true

- name: "[NM] Enable IPv6 forwarding"
  ansible.posix.sysctl:
    name: net.ipv6.conf.all.forwarding
    value: '1'
    sysctl_set: true
    state: present
    reload: true

- name: "[NM] Persist sysctl settings"
  ansible.builtin.blockinfile:
    path: /etc/sysctl.d/99-exa-forward.conf
    create: true
    mode: '0644'
    block: |
      # Example Music — IP forwarding
      net.ipv4.ip_forward = 1
      net.ipv6.conf.all.forwarding = 1
