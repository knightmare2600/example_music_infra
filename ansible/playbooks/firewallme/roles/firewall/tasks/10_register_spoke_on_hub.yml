---
# =============================================================================
# roles/firewall/tasks/10_register_spoke_on_hub.yml
# Example Music Limited — Automatically register this spoke as a peer on its hub
# =============================================================================
# Robert, 2026-07-17: onboarding a new spoke used to require a separate, manual
# invocation of playbooks/add-wg-spoke.yml against the hub afterward -- easy to
# forget, and EXAFWLBRT001 sat unregistered on EXAFWLCLD001 for exactly that
# reason. Automated here instead, as the last step of a spoke's own run, reusing
# the exact same blockinfile mechanism (marker-per-site, never a full-file
# rewrite) 09_wireguard_deploy.yml's hub [Interface] block already uses -- this
# can never "fight" that block or any other spoke's peer block, regardless of
# run order, since blockinfile only ever touches its own marker.
#
# Delegates directly to fw_wg_hub_ip (the hub's WAN/VRK address, already
# resolved during the ask phase) rather than a named inventory host -- a spoke
# provisioned from a single-site inventory file (e.g. -i configs/inventory/brt.ini)
# has no guarantee the hub is even a defined host in that inventory, so
# delegate_to by inventory name would fail. Every firewall shares the same
# ansible_user/SSH key, so delegating to a bare IP works the same way the
# read-only pubkey fetch in 00_preflight_3_ask.yml already does.
#
# Also updates wg_hub_topology in group_vars/firewalls/main.yml (the git-tracked
# list other spokes' AllowedIPs are built from -- see 00_preflight_4_post_ask.yml)
# via files/update_hub_topology.py, so sibling spokes under the same hub don't
# silently miss this one on their next run. That script edits only the specific
# "spokes: [...]" line for the hubs involved via regex, never a full YAML
# parse/re-dump, so every comment in the file survives. Left as an uncommitted
# local change on the control node -- Robert reviews and commits it himself,
# same as any other repo edit; never auto-committed.
# =============================================================================

# BUG FIX (2026-07-17): this block was missing PersistentKeepalive -- confirmed
# live on EXAFWLCLD001 via add-wg-spoke.yml (same template shape), the only one
# of four peer blocks without it. Doesn't block traffic here (the spoke already
# keepalives from its own side), but it's a real gap versus the hand-written
# hub-to-hub peer blocks in the same file -- fixed to match. Also moved the
# site-code comment above [Peer] and doubled the hash to "## {{ fw_site_code }}",
# matching the hand-written blocks exactly -- the MOTD peer-name parser
# (firewallme.sh lines 2068-2071) is position-independent, so this is cosmetic
# only, not a functional change.
#
# BUG FIX (2026-07-17, second pass): Robert explicitly required an Endpoint line
# on the hub's copy too, matching FAL/ODE/LIV exactly -- added, no further
# argument. Uses the spoke's actual current listening port (fetched live, below),
# not a hardcoded 51820 -- a spoke's wg0.conf has no ListenPort set, so the
# kernel picks a random ephemeral port every time wg0 starts, unlike a hub's
# fixed one. That port can change on a future wg0 restart, at which point this
# Endpoint value goes stale until re-run -- a real, known limitation of a
# spoke-side peer entry, not a reason to omit it now.

- name: "[Hub register] Get this spoke's current WireGuard listening port"
  ansible.builtin.command: wg show wg0 listen-port
  become: true
  register: fw_wg_listen_port_raw
  changed_when: false
  when:
    - fw_wg_role == 'spoke'
    - not fw_is_black_site

# BUG FIX (2026-07-18): every task below this point delegates straight to the
# hub with no check it's actually up -- a spoke provisioned before its hub (or
# while the hub is mid-maintenance, powered off, etc.) would hit a raw SSH
# connection failure here instead of a clear, deferred message. wait_for against
# port 22 (the same management path every firewall already shares, rather than
# trying to probe the UDP WireGuard port itself) catches that up front.

- name: "[Hub register] Check hub is reachable before registering as a peer"
  ansible.builtin.wait_for:
    host: "{{ fw_wg_hub_ip }}"
    port: 22
    timeout: 5
  delegate_to: localhost
  become: false
  register: fw_hub_reachable
  ignore_errors: true
  when:
    - fw_wg_role == 'spoke'
    - not fw_is_black_site

- name: "[Hub register] NOTE — hub unreachable, registration deferred"
  ansible.builtin.debug:
    msg: >-
      {{ _c.Y }}[!]{{ _c.NC }} Hub {{ fw_wg_hub_site }} ({{ fw_wg_hub_ip }}) is not reachable on
      port 22 right now — skipping automatic peer registration. Register this spoke manually
      once the hub is up, via playbooks/add-wg-spoke.yml.
  when:
    - fw_wg_role == 'spoke'
    - not fw_is_black_site
    - fw_hub_reachable.failed | default(true)

- name: "[Hub register] Add/update this spoke's [Peer] block on its hub"
  ansible.builtin.blockinfile:
    path: /etc/wireguard/wg0.conf
    create: true
    mode: '0600'
    marker: "# {mark} ANSIBLE MANAGED BLOCK {{ fw_site_code }}"
    block: |
      ## {{ fw_site_code }}
      [Peer]
      PublicKey    = {{ fw_wg_pubkey }}
      PresharedKey = {{ fw_wg_psk }}
      Endpoint     = {{ fw_wan_static_ip }}:{{ fw_wg_listen_port_raw.stdout | trim }}
      AllowedIPs   = {{ ([fw_wg_tunnel_ip + '/32', fw_subnet + '.0/24'] + (wg_site_extra_subnets[fw_site_code] | default([]))) | join(', ') }}
      PersistentKeepalive = 25
  delegate_to: "{{ fw_wg_hub_ip }}"
  become: true
  register: fw_hub_peer_block
  when:
    - fw_wg_role == 'spoke'
    - not fw_is_black_site
    - not (fw_hub_reachable.failed | default(true))

- name: "[Hub register] Write PSK to tmpfile for wg set"
  ansible.builtin.copy:
    dest: "/tmp/.wg-psk-{{ fw_site_code }}"
    content: "{{ fw_wg_psk }}"
    mode: '0600'
  delegate_to: "{{ fw_wg_hub_ip }}"
  become: true
  when:
    - fw_wg_role == 'spoke'
    - not fw_is_black_site
    - fw_hub_peer_block.changed

- name: "[Hub register] Live-add peer via wg set (no restart needed)"
  ansible.builtin.shell: |
    wg set wg0 peer {{ fw_wg_pubkey }} \
      preshared-key /tmp/.wg-psk-{{ fw_site_code }} \
      allowed-ips {{ ([fw_wg_tunnel_ip + '/32', fw_subnet + '.0/24'] + (wg_site_extra_subnets[fw_site_code] | default([]))) | join(',') }}
  delegate_to: "{{ fw_wg_hub_ip }}"
  become: true
  changed_when: true
  when:
    - fw_wg_role == 'spoke'
    - not fw_is_black_site
    - fw_hub_peer_block.changed

- name: "[Hub register] Remove PSK tmpfile"
  ansible.builtin.file:
    path: "/tmp/.wg-psk-{{ fw_site_code }}"
    state: absent
  delegate_to: "{{ fw_wg_hub_ip }}"
  become: true
  when:
    - fw_wg_role == 'spoke'
    - not fw_is_black_site
    - fw_hub_peer_block.changed

# BUG FIX (2026-07-17): used {{ playbook_dir }} here, which is caller-dependent
# for a role task file -- it's the directory of whatever TOP-LEVEL playbook
# happens to include this role, not a fixed location. Only worked because
# 90-firewall.yml is currently this role's sole entry point; caught by this
# repo's own check_playbook_dir_paths.py harness check. role_path (already
# used correctly for update_hub_topology.py itself, right below) is invariant
# regardless of caller, so it's the right base for reaching outside the role
# too -- 4 levels up from roles/firewall/ reaches ansible/, same as the
# already-verified 3-levels-up-from-playbooks/ path playbook_dir gave.
#
# 2026-07-18: added a wait_for reachability check against the hub's port 22
# before any delegate_to task -- previously a spoke provisioned before its hub
# existed (or while the hub was mid-maintenance) hit a raw SSH connection
# failure here instead of a clear, deferred message. Every task from the peer-
# block write onward, plus the topology update, now also requires the hub to
# have answered; if it didn't, registration is skipped with a NOTE pointing at
# playbooks/add-wg-spoke.yml for a manual re-run once the hub is back up.

- name: "[Hub register] Update wg_hub_topology in group_vars/firewalls/main.yml"
  ansible.builtin.command: >-
    python3 {{ role_path }}/files/update_hub_topology.py
    {{ role_path }}/../../../../configs/inventory/group_vars/firewalls/main.yml
    {{ fw_site_code }} {{ fw_wg_hub_site }}
  delegate_to: localhost
  become: false
  register: fw_hub_topology_update
  changed_when: "'CHANGED' in fw_hub_topology_update.stdout"
  when:
    - fw_wg_role == 'spoke'
    - not fw_is_black_site
    - not (fw_hub_reachable.failed | default(true))

- name: "[Hub register] NOTE — wg_hub_topology updated, not committed"
  ansible.builtin.debug:
    msg: >-
      {{ _c.G }}[+]{{ _c.NC }} wg_hub_topology updated: {{ fw_site_code }} now listed under
      {{ fw_wg_hub_site }}'s spokes in group_vars/firewalls/main.yml on the control node —
      uncommitted, review and commit it yourself.
  when:
    - fw_wg_role == 'spoke'
    - not fw_is_black_site
    - fw_hub_topology_update.changed

- name: "[Hub register] Summary"
  ansible.builtin.debug:
    msg: >-
      {{ '[+] Registered' if fw_hub_peer_block.changed else '[+] Already registered (no change)' }}
      as a peer on {{ fw_wg_hub_site }} ({{ fw_wg_hub_ip }}).
  when:
    - fw_wg_role == 'spoke'
    - not fw_is_black_site
    - not (fw_hub_reachable.failed | default(true))
