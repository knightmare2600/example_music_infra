---
# =============================================================================
# playbooks/add-wg-spoke.yml
# Example Music Limited — Register a new WireGuard spoke peer on a hub
# =============================================================================
# Idempotent: uses blockinfile with a per-site marker so re-running updates
# the target spoke's [Peer] block without touching any other peers.
#
# Usage (run from ansible/ root):
#   ansible-playbook -i configs/inventory \
#     playbooks/firewallme/playbooks/add-wg-spoke.yml \
#     -e "target=EXAFWLFAL001 spoke_site=BER spoke_host=EXAFWLBER001"
#
#   # If the spoke isn't in inventory or has a different SSH address:
#   ansible-playbook -i configs/inventory \
#     playbooks/firewallme/playbooks/add-wg-spoke.yml \
#     -e "target=EXAFWLFAL001 spoke_site=BER spoke_ip=192.168.139.1"
#
# Required vars:
#   target      — hub host (inventory name, e.g. EXAFWLFAL001)
#   spoke_site  — spoke site code (e.g. BER), must exist in wg_site_octets
#   spoke_host  — spoke inventory name; its own ansible_host (the VRK/WAN address
#                 generate_inventory.py assigns every firewall) is used to SSH-fetch its keys
#
# Optional vars:
#   spoke_ip        — IP to SSH-fetch pubkey/PSK from, overrides spoke_host's ansible_host
#   spoke_tunnel_ip — override default 10.0.<octet>.1 tunnel address (was .2 before 2026-07-19 --
#                     see docs/ansible/beginners_guide_to_ansible.md's "Renumbering / Reworking
#                     Live Conventions" section. MUST match what the spoke's own
#                     09_wireguard_deploy.yml actually wrote to its wg0.conf Address= line --
#                     a mismatch here means the hub silently drops that spoke's traffic
#                     (AllowedIPs is an inbound source filter, not just a route).
#
# What it does:
#   1. Validates spoke_site exists in wg_site_octets
#   2. SSH-fetches pubkey and PSK from the spoke (delegate_to: localhost)
#   3. Adds or updates a [Peer] block in /etc/wireguard/wg0.conf on the hub
#   4. Live-adds the peer via `wg set` so WireGuard picks it up immediately
#      without a full restart
#
# Changelog:
#   2026-07-18  Added a wait_for reachability check against the spoke's port 22 before
#               the SSH key-fetch tasks -- previously an unreachable spoke (not yet up,
#               or mid-maintenance) hit a raw SSH failure via failed_when instead of a
#               clear, deferred message. Every task from the key fetch onward now skips
#               cleanly instead, with a NOTE to re-run once the spoke answers. Mirrors
#               the same fix in roles/firewall/tasks/10_register_spoke_on_hub.yml (the
#               automatic path), which guards hub reachability instead since that one
#               runs the other direction.
#   2026-07-16  Robert: the real bug was never in this file's address derivation at all -- it was
#               generate_inventory.py assigning the wrong address (site LAN .253) to
#               EXAFWL<site>001's ansible_host, when every firewall is actually managed over its
#               VRK/WAN address (confirmed live: brt.ini had two devices sharing one IP, neither
#               of them the right type). Fixed at the source (generate_inventory.py's own
#               2026-07-16 changelog) -- ansible_host now correctly holds the VRK address for
#               every site's primary firewall, CLD included. Reverted this file to its original,
#               simplest form: hostvars[spoke_host]['ansible_host'] directly, no DNS name, no IP
#               formula, no re-derivation -- spoke_host is back in the interface. The three
#               entries below chased this same symptom through increasingly clever workarounds in
#               this file before the actual root cause (the inventory itself) was found; kept for
#               the record, but superseded.
#   2026-07-16  Robert, live, third attempt: the "-wan"/provisioning-network address (previous
#               entry below) resolved fine via DNS but failed with "No route to host" -- a
#               routing-layer rejection, not a timeout. Wrong premise entirely: this estate's
#               real topology already has site LANs mutually routable from the control node --
#               a spoke's regular LAN address does not require its WireGuard tunnel to exist
#               first, contrary to what the previous two attempts assumed. Confirmed live:
#               `host exafwlbrt001` -> 192.168.169.253 (BRT's real LAN address), the address
#               that's actually reachable right now. Reverted to the plain per-site DNS name
#               (exafwl<site>001.<domain>, no "-wan" suffix) -- same reasoning as before about
#               using the DNS zone's own generated record rather than a hand-rolled IP, just the
#               correct record this time.
#   2026-07-16  Robert, live: "[add-wg-spoke] Fetch spoke public key via SSH" failed with
#               "Connection timed out" trying 192.168.169.253 (EXAFWLBRT001's own LAN/gateway
#               IP, from hostvars[spoke_host]['ansible_host']). Assumed this meant the address
#               was wrong -- a spoke being registered here is, by definition, not yet
#               WireGuard-peered, so its regular site LAN looked like it shouldn't be reachable
#               from the hub/control node yet. That assumption turned out to be wrong (see the
#               entry above) -- the real cause of this specific timeout was never actually
#               identified, since the address itself is correct after all. Attempted a "fix"
#               anyway: the shared provisioning network, 192.168.139.<site octet>. First fix
#               computed that IP directly ('192.168.139.' + wg_site_octets[spoke_site]) --
#               numerically correct for a non-CLD site, but the wrong way to get there: Robert
#               pointed at ansible/playbooks/bind9/templates/db.forward-zone*.j2, which already
#               generate and own a proper DNS name for exactly this, exafwl<site>001-wan.<domain>,
#               an A record resolving to 192.168.139.<octet> for every site -- including CLD,
#               whose WAN address is a genuine special case in those same templates (comes from
#               devices.csv's EXAFWLVRK001 entry, not the site-octet pattern) that a hand-rolled
#               IP formula here would have silently gotten wrong for CLD specifically. Used the
#               DNS name directly at the time -- turned out to be solving a problem that doesn't
#               exist in this estate's real topology (see the entry above). spoke_host is dropped
#               from the interface entirely -- spoke_site alone is sufficient; spoke_ip remains
#               as an explicit full override.
#   2026-07-16  Robert picked this up for a real live test. Found it would have failed
#               immediately, for any spoke_site, valid or not: wg_site_octets defaults to {}
#               in group_vars/firewalls/main.yml and is only ever populated by
#               roles/firewall/tasks/00_preflight_1_derive.yml's own read_csv + combine loop
#               -- which belongs to the full firewallme role chain and this standalone
#               playbook never included. Since Ansible facts don't persist between separate
#               ansible-playbook invocations, "[add-wg-spoke] Validate spoke_site is a known
#               site" would always see an empty map. Added the same read_csv/build-map pair
#               directly here (sites_csv_path wasn't even in scope either -- it's a
#               roles/firewall/defaults/main.yml role default, and this play has no roles:
#               to inherit it from -- given its own explicit default matching every other
#               consumer in the repo).
#   2026-07-15  Robert asked (again) about auto-adding spoke peers, unaware this file already
#               existed -- untouched since creation, never live-tested. Fixed the [Peer] comment
#               line: was `# {{ spoke_site }} spoke — {{ spoke_host }}`, trimmed to a bare
#               `# {{ spoke_site }}`. Checked the real MOTD peer-name parser
#               (bootstrap/web/provision/firewallme.sh lines 2037-2040, an awk script matching
#               any #-prefixed line immediately before a peer's PublicKey line) -- the placement
#               was never structurally broken (comment already sits between [Peer] and
#               PublicKey), but the extra text would have misaligned/truncated in the MOTD's
#               fixed-width peer-name column. Matches the bare-site-code convention Robert
#               already confirmed via a real MOTD screenshot 2026-07-14.
#   2026-06-26  Initial file
# =============================================================================

- name: "Example Music — Register WireGuard spoke peer on hub"
  hosts: "{{ target }}"
  gather_facts: false
  become: true
  # Hub tables (wg_hub_known_pubkeys etc.) come from group_vars/firewalls/main.yml
  # (auto-loaded). wg_site_octets is built below, at runtime -- see changelog.

  vars:
    spoke_ansible_user: ansible
    # Matches roles/firewall/defaults/main.yml's own default -- this standalone play has
    # no roles: to inherit that default from, so it's restated here identically. Override
    # with -e sites_csv_path=/path/to/sites.csv, same as every other consumer in the repo.
    sites_csv_path: "/etc/example-music/sites.csv"
    # spoke_host's own ansible_host, straight from inventory -- the real bug was never in this
    # playbook's address derivation, it was generate_inventory.py assigning the wrong address
    # (LAN .253) to EXAFWL<site>001's ansible_host in the first place. Now that it's fixed to
    # assign the VRK/WAN address there (see generate_inventory.py's 2026-07-16 changelog),
    # hostvars[spoke_host]['ansible_host'] is simply correct -- no DNS name, no IP formula,
    # no re-derivation needed here at all.
    _spoke_ip: >-
      {{
        spoke_ip
        if spoke_ip is defined
        else hostvars[spoke_host]['ansible_host']
        if (spoke_host is defined and spoke_host in hostvars and 'ansible_host' in hostvars[spoke_host])
        else spoke_host
        if spoke_host is defined
        else ''
      }}

  tasks:

    # ── Derive wg_site_octets from sites.csv ─────────────────────────────────
    # Same read_csv + combine-loop logic as
    # roles/firewall/tasks/00_preflight_1_derive.yml, which this standalone play
    # doesn't include -- see the 2026-07-16 changelog entry above.

    - name: "[add-wg-spoke] Load sites.csv from control node"
      delegate_to: localhost
      become: false
      read_csv:
        path: "{{ sites_csv_path }}"
      register: _sites_csv_raw
      vars:
        ansible_connection: local

    - name: "[add-wg-spoke] Build wg_site_octets from sites.csv"
      ansible.builtin.set_fact:
        wg_site_octets: "{{ wg_site_octets | default({}) | combine({item.Site: item.Subnet.split('.')[2] | int}) }}"
      loop: "{{ _sites_csv_raw.list | selectattr('Subnet', 'ne', 'N/A') | selectattr('Site', 'ne', 'BRD') | list }}"
      loop_control:
        label: "{{ item.Site }}"

    # ── Validation ────────────────────────────────────────────────────────────

    - name: "[add-wg-spoke] Require spoke_site"
      ansible.builtin.fail:
        msg: "spoke_site is required. Use -e 'spoke_site=BER'"
      when: spoke_site is not defined

    - name: "[add-wg-spoke] Require spoke_host or spoke_ip"
      ansible.builtin.fail:
        msg: "Provide spoke_host (inventory name) or spoke_ip (direct IP) to SSH-fetch spoke keys."
      when: _spoke_ip == ''

    - name: "[add-wg-spoke] Validate spoke_site is a known site"
      ansible.builtin.fail:
        msg: "spoke_site '{{ spoke_site }}' not found in wg_site_octets. Check group_vars/firewalls/main.yml."
      when: spoke_site not in wg_site_octets

    # ── Derive spoke facts ────────────────────────────────────────────────────

    - name: "[add-wg-spoke] Derive spoke network facts"
      ansible.builtin.set_fact:
        _spoke_octet:      "{{ wg_site_octets[spoke_site] }}"
        _spoke_tunnel_ip:  "{{ spoke_tunnel_ip | default('10.0.' + wg_site_octets[spoke_site] | string + '.1') }}"
        _spoke_lan_subnet: "192.168.{{ wg_site_octets[spoke_site] }}.0/24"
        _spoke_extra_subnets: "{{ wg_site_extra_subnets[spoke_site] | default([]) }}"

    # ── Reachability guard (2026-07-18) ───────────────────────────────────────
    # Every task below this point either SSHes into the spoke directly or writes
    # to the hub on the strength of what that SSH fetch returned. Previously a
    # spoke that wasn't up yet (or mid-maintenance) hit a raw SSH failure via
    # failed_when further down instead of a clear, deferred message. wait_for
    # against port 22 (the same management path this whole estate already uses,
    # rather than trying to probe the spoke's ephemeral WireGuard port) catches
    # that up front; every task from the key fetch onward is skipped, not failed,
    # if the spoke doesn't answer.

    - name: "[add-wg-spoke] Check spoke is reachable before fetching its keys"
      ansible.builtin.wait_for:
        host: "{{ _spoke_ip }}"
        port: 22
        timeout: 5
      delegate_to: localhost
      become: false
      register: _spoke_reachable
      ignore_errors: true

    - name: "[add-wg-spoke] NOTE — spoke unreachable, registration deferred"
      ansible.builtin.debug:
        msg: >-
          Spoke {{ spoke_site }} ({{ _spoke_ip }}) is not reachable on port 22 right now —
          skipping key fetch and peer registration. Re-run this playbook once the spoke is up.
      when: _spoke_reachable.failed | default(true)

    # ── Fetch spoke keys via SSH ──────────────────────────────────────────────
    # BUG FIX (2026-07-17): raw `ssh` in a shell task, delegated to localhost,
    # bypasses Ansible's own connection plugin entirely -- it never picks up
    # ansible.cfg's private_key_file, only the ssh client's own default key
    # discovery, which fails non-interactively. Confirmed live: EXAANSCLD001
    # could SSH to a firewall manually with -i configs/ansible-id_rsa, but this
    # exact command failed with "Permission denied (publickey)" for want of that
    # same flag. Added -i explicitly, using the same {{ HOME }}/ansible/configs/
    # ansible-id_rsa path group_vars/windows_nodes/connection.yml already uses
    # for the identical purpose -- not a new path.

    # BUG FIX (2026-07-17, second pass): fixed the SSH key-auth problem, then hit
    # "cat: /etc/wireguard/public.key: Permission denied" live -- 09_wireguard_deploy.yml
    # creates /etc/wireguard as `install -m 0700` (root-only traversal), so a plain
    # `ansible` user can't even enter the directory regardless of the files' own
    # permissions (public.key is 0644, but that's moot if the directory blocks entry;
    # preshared.key is 0600, needing sudo either way). Added sudo to both remote
    # commands -- relies on the same passwordless sudo every other become: true task
    # in this role already assumes for the ansible user.

    - name: "[add-wg-spoke] Fetch spoke public key via SSH"
      ansible.builtin.shell: |
        ssh -o ConnectTimeout=5 \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -i {{ lookup('env', 'HOME') }}/ansible/configs/ansible-id_rsa \
            {{ spoke_ansible_user }}@{{ _spoke_ip }} \
            'sudo cat /etc/wireguard/public.key'
      register: _spoke_pubkey_raw
      delegate_to: localhost
      changed_when: false
      when: not (_spoke_reachable.failed | default(true))
      failed_when: >-
        _spoke_pubkey_raw.rc != 0
        or not (_spoke_pubkey_raw.stdout | trim | regex_search('^[A-Za-z0-9+/]{43}=$'))

    - name: "[add-wg-spoke] Fetch spoke PSK via SSH"
      ansible.builtin.shell: |
        ssh -o ConnectTimeout=5 \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -i {{ lookup('env', 'HOME') }}/ansible/configs/ansible-id_rsa \
            {{ spoke_ansible_user }}@{{ _spoke_ip }} \
            'sudo cat /etc/wireguard/preshared.key'
      register: _spoke_psk_raw
      delegate_to: localhost
      changed_when: false
      when: not (_spoke_reachable.failed | default(true))
      failed_when: _spoke_psk_raw.rc != 0 or _spoke_psk_raw.stdout | trim == ''

    # BUG FIX (2026-07-17, third pass): Robert explicitly required an Endpoint line
    # on the hub's copy too, matching FAL/ODE/LIV exactly -- fetches the spoke's
    # actual current listening port live, same as 10_register_spoke_on_hub.yml's
    # equivalent fetch. Not a hardcoded 51820 -- a spoke's wg0.conf has no
    # ListenPort set, so the kernel picks a random ephemeral port every time wg0
    # starts, unlike a hub's fixed one. That port can change on a future wg0
    # restart, at which point this Endpoint value goes stale until re-run -- a
    # real, known limitation of a spoke-side peer entry, not a reason to omit it.

    - name: "[add-wg-spoke] Fetch spoke's current WireGuard listening port via SSH"
      ansible.builtin.shell: |
        ssh -o ConnectTimeout=5 \
            -o StrictHostKeyChecking=no \
            -o BatchMode=yes \
            -i {{ lookup('env', 'HOME') }}/ansible/configs/ansible-id_rsa \
            {{ spoke_ansible_user }}@{{ _spoke_ip }} \
            'sudo wg show wg0 listen-port'
      register: _spoke_listen_port_raw
      delegate_to: localhost
      changed_when: false
      when: not (_spoke_reachable.failed | default(true))
      failed_when: _spoke_listen_port_raw.rc != 0 or _spoke_listen_port_raw.stdout | trim == ''

    - name: "[add-wg-spoke] Set key facts"
      ansible.builtin.set_fact:
        _spoke_pubkey: "{{ _spoke_pubkey_raw.stdout | trim }}"
        _spoke_psk:    "{{ _spoke_psk_raw.stdout | trim }}"
        _spoke_listen_port: "{{ _spoke_listen_port_raw.stdout | trim }}"
      when: not (_spoke_reachable.failed | default(true))

    - name: "[add-wg-spoke] Display fetched spoke details"
      ansible.builtin.debug:
        msg:
          - "Spoke site    : {{ spoke_site }}"
          - "Spoke IP      : {{ _spoke_ip }}"
          - "Tunnel IP     : {{ _spoke_tunnel_ip }}/32"
          - "LAN subnet    : {{ _spoke_lan_subnet }}{% if _spoke_extra_subnets %} + {{ _spoke_extra_subnets | join(', ') }}{% endif %}"
          - "Public key    : {{ _spoke_pubkey }}"
      when: not (_spoke_reachable.failed | default(true))

    # ── Add/update peer block in wg0.conf ─────────────────────────────────────
    # blockinfile marker is keyed on spoke_site so each spoke has its own
    # named block. Re-running updates this spoke's block only.

    # BUG FIX (2026-07-17): added peer blocks were missing PersistentKeepalive --
    # confirmed live on EXAFWLCLD001, BRT's entry was the only one of four peer
    # blocks without it. Doesn't block traffic here (BRT already keepalives from
    # its own side), but it's a real gap versus the hand-written FAL/ODE/LIV
    # blocks in the same file -- fixed to match. Also moved the site-code comment
    # above [Peer] (was below, as "# {{ spoke_site }}") and doubled the hash to
    # "## {{ spoke_site }}", matching the hand-written blocks exactly -- checked
    # the real MOTD peer-name parser (firewallme.sh lines 2068-2071) first, it's
    # position-independent (tracks the latest #-line until it hits a matching
    # PublicKey), so this is purely cosmetic, not a functional change.

    - name: "[add-wg-spoke] Add/update [Peer] block in wg0.conf"
      ansible.builtin.blockinfile:
        path: /etc/wireguard/wg0.conf
        create: true
        mode: '0600'
        marker: "# {mark} ANSIBLE MANAGED BLOCK {{ spoke_site }}"
        block: |
          ## {{ spoke_site }}
          [Peer]
          PublicKey    = {{ _spoke_pubkey }}
          PresharedKey = {{ _spoke_psk }}
          Endpoint     = {{ _spoke_ip }}:{{ _spoke_listen_port }}
          AllowedIPs   = {{ ([_spoke_tunnel_ip + '/32', _spoke_lan_subnet] + _spoke_extra_subnets) | join(', ') }}
          PersistentKeepalive = 25
      register: _wg_conf_changed
      when: not (_spoke_reachable.failed | default(true))

    # ── Live-add peer (no restart needed) ─────────────────────────────────────
    # Write PSK to a tmpfile — `wg set` requires a file path, not stdin.
    # tmpfile is removed immediately after.

    - name: "[add-wg-spoke] Write PSK to tmpfile for wg set"
      ansible.builtin.copy:
        dest: "/tmp/.wg-psk-{{ spoke_site }}"
        content: "{{ _spoke_psk }}"
        mode: '0600'
      when: _wg_conf_changed.changed

    - name: "[add-wg-spoke] Live-add peer via wg set"
      ansible.builtin.shell: |
        wg set wg0 peer {{ _spoke_pubkey }} \
          preshared-key /tmp/.wg-psk-{{ spoke_site }} \
          allowed-ips {{ ([_spoke_tunnel_ip + '/32', _spoke_lan_subnet] + _spoke_extra_subnets) | join(',') }}
      when: _wg_conf_changed.changed

    - name: "[add-wg-spoke] Remove PSK tmpfile"
      ansible.builtin.file:
        path: "/tmp/.wg-psk-{{ spoke_site }}"
        state: absent
      when: _wg_conf_changed.changed

    # ── Keep wg_hub_topology in sync ──────────────────────────────────────────
    # Same script 10_register_spoke_on_hub.yml uses (the automatic path run as
    # part of a spoke's own provisioning) -- kept in sync so this standalone,
    # manual path behaves identically rather than silently skipping the
    # topology update the automatic path now does.

    - name: "[add-wg-spoke] Derive hub site code from target's hostname"
      ansible.builtin.set_fact:
        _hub_site_code: >-
          {{ target | upper | regex_search('^EXAFWL([A-Z]{3})[0-9]{3}$', '\1') | first | default('') }}

    - name: "[add-wg-spoke] Update wg_hub_topology in group_vars/firewalls/main.yml"
      ansible.builtin.command: >-
        python3 {{ playbook_dir }}/../roles/firewall/files/update_hub_topology.py
        {{ playbook_dir }}/../../../configs/inventory/group_vars/firewalls/main.yml
        {{ spoke_site }} {{ _hub_site_code }}
      delegate_to: localhost
      become: false
      register: _topology_update
      changed_when: "'CHANGED' in _topology_update.stdout"
      when: not (_spoke_reachable.failed | default(true))

    - name: "[add-wg-spoke] NOTE — wg_hub_topology updated, not committed"
      ansible.builtin.debug:
        msg: >-
          wg_hub_topology updated: {{ spoke_site }} now listed under the target hub's
          spokes in group_vars/firewalls/main.yml on the control node — uncommitted,
          review and commit it yourself.
      when: _topology_update.changed

    # ── Summary ───────────────────────────────────────────────────────────────

    - name: "[add-wg-spoke] Summary"
      ansible.builtin.debug:
        msg:
          - >-
            {{ '[ DEFERRED ] spoke unreachable — nothing was registered this run' if (_spoke_reachable.failed | default(true))
               else ('[ UPDATED ]' if _wg_conf_changed.changed else '[ NO CHANGE ]') + ' ' + spoke_site + ' peer block in /etc/wireguard/wg0.conf' }}
          - "Next step: ensure the spoke's wg0.conf has this hub as its [Peer] and run:"
          - "  wg show wg0  — on the hub to verify the peer appears"
          - "  wg show wg0  — on the spoke to verify the handshake"
