---
# =============================================================================
# playbooks/90-firewall.yml
# Example Music Limited — Firewall configuration
# =============================================================================
# Ansible port of firewallme.sh — colourised output via exa_pretty callback
# and ANSI codes embedded in all pause prompts.
#
# Usage (run from ansible/ root):
#   ansible-playbook -i configs/inventory playbooks/firewallme/playbooks/90-firewall.yml -e target=EXAFWLKGE001 --ask-vault-pass
#   ansible-playbook -i configs/inventory playbooks/firewallme/playbooks/90-firewall.yml -e target=EXAFWLCLD001 --ask-vault-pass
#   ansible-playbook -i configs/inventory playbooks/firewallme/playbooks/90-firewall.yml -e target=EXAFWLKGE001 --tags nftables --ask-vault-pass
#   ansible-playbook -i configs/inventory playbooks/firewallme/playbooks/90-firewall.yml -e target=EXAFWLKGE001 --check --ask-vault-pass
#
# Tags: firewall, preflight, interfaces, wan, wireguard, confirm,
#       packages, network, nftables, dnsmasq, ssh, cockpit, finish
#
# Changelog:
#   2026-09-01  Robert, live (EXAFWLATL001): a brand-new firewall's very first connection
#               failed outright -- "REMOTE HOST IDENTIFICATION HAS CHANGED", Gathering Facts
#               UNREACHABLE -- even though the SSH preflight play just below had already
#               proven the key/user/network path all worked. Root cause: 192.168.139.90 (this
#               box's temporary DHCP lease on the shared provisioning network) had a DIFFERENT,
#               unrelated box's host key cached in known_hosts from some earlier point in time
#               -- ansible.cfg's StrictHostKeyChecking=accept-new correctly refuses a CHANGED
#               key (it only silently trusts a genuinely NEW one), and the preflight play's own
#               connectivity test doesn't catch this at all -- it explicitly runs with
#               StrictHostKeyChecking=no, so it can't see this failure mode by design.
#               Robert's explicit instruction, a deliberate, narrow, firewall-only exception,
#               not a general host-key bypass: firewalls are the first thing built at a site and
#               land on a shared, DHCP-churned provisioning IP that has almost certainly
#               belonged to a different box before -- a changed key there is expected noise, not
#               a security signal. Every OTHER node type (DCS, Salt, RMM, etc.) is expected to
#               already have a stable identity, so a changed host key there stays a hard,
#               visible failure -- this fix lives here, in this play only, not in the shared
#               ssh_preflight_with_fallback.yml that linux/tools.yml also imports for those
#               other node types. Never silent either way: always prints a yellow warning
#               naming exactly what happened and why it's being purged, before purging. Added
#               a new play ("[Preflight] Probe for a stale/changed known_hosts entry...") right
#               before the ssh_preflight_with_fallback.yml import below.
#   2026-08-13  Batch-run + prompt-defaults feature (backlog item, picked up this date; see
#               roles/firewall/tasks/00_preflight_3_ask.yml's own 2026-08-13 changelog entry
#               for the full mechanism). This play's own two vars_prompt entries below
#               (fw_wan_ssh_answer, fw_wan_activate_answer) are unaffected structurally --
#               they stay real vars_prompt, per Robert's 2026-07-16 call, since vars_prompt
#               can't take a when: clause the way everything else in this role does. Instead,
#               00_preflight_3_ask.yml's "[Ask] Set WAN SSH flag"/"[Ask] Set WAN activation
#               flag" tasks now check fw_wan_ssh_override / fw_wan_activate_override first and
#               use that instead of whatever vars_prompt returned, giving these two the same
#               per-prompt-override escape hatch as every other prompt in the role. Whether
#               Ansible's vars_prompt reliably falls back to its own "n" default (rather than
#               hanging) when stdin isn't a TTY is UNVERIFIED -- for a genuinely unattended
#               run, pass both overrides explicitly (-e fw_wan_ssh_override=n
#               -e fw_wan_activate_override=n) rather than relying on that.
#   2026-07-31  Added serial: 1 to the main play -- 00_preflight_3_ask.yml's
#               ansible.builtin.pause tasks only register one shared answer across a
#               parallel multi-host batch; a single -e target=<host> run (every
#               documented example above) is unaffected. Same bug class already
#               fixed in ssh_preflight_with_fallback.yml on 2026-07-16, never carried
#               through to this play itself until now.
#   2026-06-20  Initial file
#   2026-06-20  Added vars_files for colour constants and wireguard hub data
#   2026-07-16  Robert: "vars_prompt do it now" (asked again — 2026-07-14's restructure
#               of roles/firewall/tasks/00_preflight_3_ask.yml only made pause-based
#               prompts back-to-back, it never actually switched to real vars_prompt).
#               Real vars_prompt genuinely can't take most of that file's prompts: it
#               is evaluated once, here, before ANY task runs — no gathered facts, no
#               site-octet/WAN-interface/derived-static-IP values this role computes
#               at runtime, and no way to skip a question conditionally (most of that
#               file's prompts are when:-gated on WAN mode, WG role, or fw_is_black_site).
#               Two of them are genuinely unconditional and need no runtime-derived
#               default though — WAN SSH enable and WAN activation are asked
#               identically for every site including CLD today, with no when: clause
#               at all — moved those two here as real vars_prompt. Everything else
#               stays pause-based in 00_preflight_3_ask.yml, with an inline note there
#               explaining exactly why each one can't follow.
#   2026-07-26  Robert, real live failure against EXAFWLAMS001: SSH key rejected outright
#               ("Permission denied (publickey,password)") during gather_facts, and this
#               play just died UNREACHABLE with no recovery path -- gather_facts: true
#               above is the very first connection attempt, so a bad key had nowhere to
#               fail gracefully. Added ../../ssh_preflight_with_fallback.yml (import_playbook,
#               runs first): tests the current key, and if it's rejected, prompts for a
#               fallback password (only useful if the account's password was already
#               manually unlocked out-of-band for recovery -- same posture as
#               linux/tools.yml's identical mechanism, extracted into a shared file this
#               same day specifically so this play could reuse it rather than duplicate
#               it). A working password becomes ansible_password, which this play's own
#               gather_facts picks up automatically (facts persist across plays in one
#               run); a blank answer adds the host to ssh_preflight_skip, which hosts:
#               below now excludes. Once connected, pre_tasks pushes the real key back
#               and re-verifies it works, so a follow-up run won't need the fallback again.
# =============================================================================

- name: "[Preflight] Probe for a stale/changed known_hosts entry on this WAN IP (firewall-specific)"
  hosts: "{{ target | default('all') }}"
  gather_facts: false
  serial: 1
  tasks:
    - name: "[Preflight] Test strict host-key verification (does NOT bypass it, unlike the SSH-key test below)"
      ansible.builtin.command: >
        ssh -o BatchMode=yes -o ConnectTimeout=5 -o StrictHostKeyChecking=accept-new
            -o Port={{ ansible_port | default(22) }}
            -i {{ ansible_ssh_private_key_file | default(lookup('env', 'HOME') + '/ansible/configs/ansible-id_rsa') }}
            {{ ansible_user | default('ansible') }}@{{ ansible_host | default(inventory_hostname) }}
            true
      register: _fwl_hostkey_probe
      delegate_to: localhost
      changed_when: false
      failed_when: false
      vars:
        ansible_connection: local

    - name: "[Preflight] WARNING — stale known_hosts entry, purging (firewall-only, see 2026-09-01 changelog above)"
      ansible.builtin.debug:
        msg: |
          {{ _c.Y }}[!]{{ _c.NC }} SSH host key for {{ ansible_host | default(inventory_hostname) }} has
          CHANGED since this address was last seen -- normally a real warning sign, but expected here:
          this is a firewall's temporary DHCP lease on the shared provisioning network, which has almost
          certainly belonged to a different, unrelated box before. Purging the stale known_hosts entry so
          this run can continue.
          This purge is scoped to FIREWALLS ONLY -- a changed host key on any other node type (DCS, Salt,
          RMM, etc.) is never auto-purged and will still fail loudly, since those are expected to already
          have a stable identity.
      when: "'REMOTE HOST IDENTIFICATION HAS CHANGED' in _fwl_hostkey_probe.stderr"

    - name: "[Preflight] Purge stale known_hosts entry"
      ansible.builtin.command: >
        ssh-keygen -f {{ lookup('env', 'HOME') }}/.ssh/known_hosts
        -R {{ ansible_host | default(inventory_hostname) }}
      delegate_to: localhost
      changed_when: true
      when: "'REMOTE HOST IDENTIFICATION HAS CHANGED' in _fwl_hostkey_probe.stderr"

- import_playbook: ../../ssh_preflight_with_fallback.yml

- name: Example Music — Firewall configuration
  hosts: "{{ target | default('all') }}:!ssh_preflight_skip"
  gather_facts: true
  become: true
  # serial: 1 (2026-07-31) -- 00_preflight_3_ask.yml's ~15 ansible.builtin.pause
  # tasks only register one shared answer across a whole parallel batch, same bug
  # class already fixed in ssh_preflight_with_fallback.yml on 2026-07-16 (see that
  # file's header). A single -e target=<host> run is unaffected -- one host in the
  # batch either way -- this only changes behaviour for a multi-host/no-target run,
  # from silently sharing one operator's answers across every firewall to a proper
  # full pass per host before the next one starts.
  serial: 1
  # vars from group_vars/firewalls/main.yml (wg_site_octets, hub tables) and
  # group_vars/all/colours.yml are auto-loaded — no explicit vars_files needed.
  # group_vars are resolved before vars_prompt runs, so colour codes (_c.*) below
  # render correctly despite no facts having been gathered yet.

  pre_tasks:
    - name: Gate on /etc/example-music/* freshness
      include_tasks: ../../../tasks/example_music_freshness_gate.yml
      vars:
        example_music_gate_files: [sites.csv, ad_forest.json]
        example_music_gate_repo_root: "{{ playbook_dir }}/../../../.."

    - name: "[Preflight] Refresh SSH key + heal locked account"
      ansible.builtin.include_tasks: ../../../tasks/refresh_ansible_ssh_key.yml

  vars_prompt:
    # No colour codes here (unlike every pause prompt elsewhere in this role) --
    # confirmed empirically via --syntax-check: group_vars/all/colours.yml's _c is
    # not available in vars_prompt's templating context, only inside tasks. Plain
    # text is the correct, working form, not a stylistic choice.
    - name: fw_wan_ssh_answer
      prompt: |-
        [!] SSH on WAN (port 22 open to the internet) is a security risk. LAN SSH is always enabled, WAN SSH defaults to OFF.
        Enable SSH on WAN interface? [y/N]
      default: "n"
      private: false
    - name: fw_wan_activate_answer
      prompt: |-
        ==== WAN Activation ====
        [!] If you are connected via SSH over the WAN interface, bringing it up via nmcli mid-run may drop your session. All configs are written regardless -- say N and bring WAN up yourself afterwards with: nmcli con up wan
        Activate WAN interface now? [y/N]
      default: "n"
      private: false

  roles:
    - firewall
