---
# =============================================================================
# site.yml
# Example Music Limited — Windows host entry point
# =============================================================================
# Bootstrap runs first (once, on a fresh PXE build).
# Subsequent runs skip stages that are already complete (idempotent).
#
# Run from the ansible/ root for all commands.
#
# Usage — full run (bootstrap + all management plays):
#   ansible-playbook playbooks/windows_bootstrap/site.yml \
#     -i <ip>, -e target_hosts=<ip>
#
# Usage — bootstrap only:
#   ansible-playbook playbooks/windows_bootstrap/site.yml \
#     -i <ip>, -e target_hosts=<ip> --tags bootstrap
#
# Usage — single management play:
#   ansible-playbook playbooks/windows_bootstrap/site.yml \
#     -i configs/inventory -e target_hosts=<host> --tags registry
#
# Standalone plays can also be run directly without site.yml:
#   ansible-playbook playbooks/windows_bootstrap/playbooks/20-registry.yml \
#     -i configs/inventory
#
# Playbook order:
#   00-preflight       Pre-flight: credentials, hostname, IP, SSH hardening
#                      (renames the host itself, Phase G -- see 2026-07-14 entry
#                      below for why 10-rename.yml is no longer chained here)
#   15-locale-timezone Locale and timezone
#   20-registry        Registry hardening
#   22-screenlock      Screen lock and inactivity timeout
#   25-deadvertise     Advertising/telemetry suppression (desktop + laptop only)
#   30-chocolatey      Chocolatey installation
#   35-guest-tools     Hypervisor guest tools
#   40-choco-pkgs      Chocolatey packages
#   45-rsat            RSAT tools
#   48-pswindowsupdate PSWindowsUpdate module
#   50-binaries        Arch-aware binary + font deployment
#   60-wallpaper       Corporate wallpaper + dark mode
#   70-hibernation     Power management: hibernation, pagefile, SConfig by host type
#   75-openssh         OpenSSH + Ansible key
#   77-rdp             RDP with NLA
#   78-sac-ems         SAC/EMS serial console, Server OS only
#   79-ps7-setup       PS7 modules, fonts, profile, terminal config
#   80-domainjoin      Domain join
#   85-finish          Bootstrap finish: summary + final reboot
#
# Every play above is standalone and independently re-runnable via its own
# tag. Until 2026-07-09 there was also an inline monolith (05-bootstrap.yml)
# chain-imported by 00-preflight.yml that duplicated most of these stages in
# one combined play; it was retired once every stage was confirmed to have a
# working standalone equivalent here (see this file's and 00-preflight.yml's
# own changelogs for the two real gaps found and fixed in that process).
# =============================================================================
# Changelog:
#   2026-06-20  Initial file
#   2026-06-20  Bootstrap added as entry point replacing Join-DomainAndBootstrap.ps1
#   2026-07-02  Standalone management plays tagged [never, <name>] so a bare
#               site.yml run only executes the bootstrap sequence. Each
#               standalone play must be invoked with --tags <name> explicitly.
#   2026-07-06  Added 9 new standalone plays (15/22/35/45/48/76/77/78/79),
#               extracted from stages that previously only existed inline
#               in 05-bootstrap.yml, so each can be run/retried independently.
#               NOTE: the "[never, <name>]" tagging described in the
#               2026-07-02 entry above was never actually implemented in
#               any of these playbook files (checked all of them) — a bare
#               `site.yml` run with no --tags currently executes every
#               play below in sequence, not just bootstrap. That's a
#               pre-existing gap, not something this change introduces;
#               flagging it here since it's directly relevant to how these
#               new plays behave by default. Left as-is pending a decision
#               on whether/how to fix it repo-wide.
#   2026-07-06  Removed 76-rustdesk.yml — rustdesk is a Chocolatey package
#               (choco_packages_common, via 40-choco-packages.yml), so a
#               dedicated asset-server-download playbook was redundant.
#   2026-07-09  Fixed 80-domainjoin.yml: its hosts:/gather_facts:/vars_prompt were
#               all commented out, meaning this ENTIRE chain could never even
#               syntax-check (a play missing hosts: fails Ansible's parser at
#               load time, regardless of --tags) -- this wasn't a "needs --tags"
#               issue, site.yml as a whole was broken. Added 85-finish.yml
#               (ported from 05-bootstrap.yml's Stage 23) -- the granular chain
#               previously had no final summary or guaranteed reboot at all,
#               a genuine gap found while cross-checking that everything from
#               the original monolith made it into the split-out files.
#   2026-07-09  Resolved the "bare run executes every play" question raised in
#               the 2026-07-06 entry above: confirmed this is the intended
#               design, not a gap. Every play here is idempotent, so a full
#               run converges any host to the same known-good bootstrap state
#               regardless of how many times it's run or what state the host
#               started in -- that convergent state is the deliverable, and
#               DC promotion (windows_dc/site.yml) or any other follow-on
#               action is a deliberate separate step afterward. No tagging
#               change made; README.md updated to state this as intended
#               behaviour rather than an open question.
#   2026-07-14  Removed 10-rename.yml from this chain. Real EXADCSCLD001 (forest-
#               root DC) build: it prompts its own "New hostname" question, entirely
#               independent of 00-preflight.yml's own hostname prompt moments
#               earlier -- confirmed via ansible-core's own vars_prompt source that
#               this cannot be conditionally skipped based on an already-set fact
#               (vars_prompt fires unconditionally per play, before any task logic,
#               and is only suppressed if the same variable was passed as a CLI
#               extra-var). 00-preflight.yml's own Phase G already fully renames
#               the host (win_hostname module) using the SAME target_hostname
#               answered once, up front -- 10-rename.yml's chained copy was pure
#               redundant re-asking, and exactly the kind of trap that produced a
#               real typo here (EXADCSCLS001 for EXADCSCLD001). Its own "Rename
#               computer" task would have been a no-op anyway by the time it ran
#               in the chained case (Phase G already converged the hostname) --
#               removing it from the chain loses no chained-case functionality.
#               10-rename.yml itself is NOT deleted -- its own documented standalone
#               usage (renaming an already-bootstrapped host later, independent of
#               a full re-bootstrap) is still real and still works, just no longer
#               auto-imported here.
# =============================================================================

# Bootstrap sequence — runs by default
- import_playbook: playbooks/00-preflight.yml
  tags: bootstrap

# 10-rename.yml deliberately NOT imported here -- see 2026-07-14 changelog entry
# above. 00-preflight.yml's own Phase G already renames the host; chaining
# 10-rename.yml's independent prompt straight after was pure redundant re-asking.
# Still available standalone: ansible-playbook playbooks/10-rename.yml -i <ip>,

- import_playbook: playbooks/15-locale-timezone.yml
  tags: locale_timezone

- import_playbook: playbooks/20-registry.yml
  tags: registry

- import_playbook: playbooks/22-screenlock.yml
  tags: screenlock

- import_playbook: playbooks/25-deadvertise.yml
  tags: deadvertise

- import_playbook: playbooks/30-chocolatey.yml
  tags: chocolatey

- import_playbook: playbooks/35-guest-tools.yml
  tags: guest_tools

- import_playbook: playbooks/40-choco-packages.yml
  tags: choco_packages

- import_playbook: playbooks/45-rsat.yml
  tags: rsat

- import_playbook: playbooks/48-pswindowsupdate.yml
  tags: pswindowsupdate

- import_playbook: playbooks/50-binaries.yml
  tags: binaries

- import_playbook: playbooks/60-wallpaper.yml
  tags: wallpaper

- import_playbook: playbooks/70-hibernation.yml
  tags: hibernation

- import_playbook: playbooks/75-openssh.yml
  tags: openssh

- import_playbook: playbooks/77-rdp.yml
  tags: rdp

- import_playbook: playbooks/78-sac-ems.yml
  tags: sac_ems

- import_playbook: playbooks/79-ps7-setup.yml
  tags: ps7_setup

- import_playbook: playbooks/80-domainjoin.yml
  tags: domainjoin

- import_playbook: playbooks/85-finish.yml
  tags: finish
