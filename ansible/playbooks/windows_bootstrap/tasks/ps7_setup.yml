---
# =============================================================================
# tasks/ps7_setup.yml
# Example Music Limited — PS7 modules, profile, and terminal config
# Replicates Join-DomainAndBootstrap.ps1 Stages 19, 20, 21, 22, 22b (the legacy PS1 script's
# own numbers, unchanged — an external, immutable fact). This file's own internal task-name
# labels were renumbered 2026-07-19 (19->20, 20->21, 21->22, 22->23, 22b->24) to remove the
# lettered sub-stage — see docs/ansible/beginners_guide_to_ansible.md's "Renumbering /
# Reworking Live Conventions" section.
# =============================================================================
# Changelog:
#   2026-10-04  Robert's catch: PS7 itself is cross-platform, so the banner's nodeinfo.json
#               path should branch on $IsWindows/$IsLinux rather than hardcode the Windows
#               path -- real automatic PS7 variables, not something invented for this file.
#               Works cleanly because nodeinfo.yml (Linux) and nodeinfo_windows.yml write
#               identical field names -- confirmed directly against both files -- so the
#               same rendering code needs no further branching, only the path does. Also
#               removes the need for a hand-maintained sed-substituted copy for local
#               testing on a Linux control node (this exact file now just works there).
#   2026-10-04  Stage 22's profile now also prints a MOTD-style banner (hostname/role/site/
#               office/environment/last Ansible run) from the existing nodeinfo.json
#               (nodeinfo_windows.yml already writes/refreshes it -- no new data source).
#               Robert's ask was originally "when users SSH in" -- SSH's own DefaultShell is
#               PS5.1, not PS7 (playbooks/75-openssh.yml), so a PS5.1 AllUsersAllHosts profile
#               was built and live-checked first, then reverted on Robert's explicit call:
#               reuse this already-proven PS7 profile mechanism instead of opening new
#               territory on PS5.1's own profile. Real consequence of that choice: the banner
#               now fires when a user runs `pwsh` (opt-in), not at raw `ssh <host>` connect --
#               confirmed with Robert before making the swap, not assumed equivalent.
#   2026-10-03  Deliberately NOT given the Enable-/Disable-LsCompatibilityMode toggle
#               added the same day to bootstrap/setup-workstation-linux.sh and
#               setup-workstation-macos.sh (control-node/workstation profiles). On
#               Windows, PowerShell already aliases ls -> Get-ChildItem natively (no
#               competing ls.exe), so the toggle would be dead code here with no
#               functional purpose -- its absence is by design, not a missed sweep.
#   2026-10-03  Stage 22's profile now explicitly sets PSReadLine's Parameter/Operator
#               colours (Solarized base01, #586E75, via a true-RGB escape). Robert, live:
#               PSReadLine's own default for both (ANSI code 90, "bright black") renders
#               invisible against this estate's Solarized Dark terminal scheme, which maps
#               that exact ANSI slot to the background colour itself -- confirmed most
#               noticeable SSHing from iTerm2 into a Windows PS7 session
#               ("Get-ADUser -Filter *" -- the -Filter parameter unreadable). True-RGB
#               rather than another ANSI slot number, so it's not fragile to whichever
#               terminal/profile happens to be connecting. Verified live: parsed with
#               zero syntax errors, then actually executed -- ParameterColor/
#               OperatorColor both resolve to the expected escape sequence afterward.
#               Applies on the NEXT bootstrap run of a Windows node, not retroactively --
#               an already-built host needs this stage re-run to pick it up.
#   2026-06-20  Initial file
#   2026-07-06  Stage 21 now includes tasks/fonts.yml instead of downloading
#               font files individually from the internal asset server
#               (which doesn't actually host them) — pulls the release zip
#               from upstream (nerd-fonts on GitHub) instead. Shared with
#               playbooks/50-binaries.yml, which had the same logic
#               duplicated.
# =============================================================================

# ── Stage 20 — PS7 modules (AllUsers) ────────────────────────────────────────

- name: "[Stage 20] Check PS7 is installed"
  ansible.windows.win_stat:
    path: 'C:\Program Files\PowerShell\7\pwsh.exe'
  register: ps7_check

- name: "[Stage 20] Install PS7 console modules (AllUsers scope)"
  ansible.windows.win_shell: |
    & "C:\Program Files\PowerShell\7\pwsh.exe" -NonInteractive -Command {
      $modules = @(
        'PSConsoleTools',
        'PSWindowsUpdate',
        'PSWriteColor',
        'PSReadLine',
        'Terminal-Icons',
        'CompletionPredictor',
        'NerdFonts'
      )
      foreach ($m in $modules) {
        if (-not (Get-Module -ListAvailable -Name $m)) {
          Install-Module $m -Scope AllUsers -Force -SkipPublisherCheck -ErrorAction SilentlyContinue
          Write-Output "Installed: $m"
        } else {
          Write-Output "Already present: $m"
        }
      }
    }
  register: stage20_result
  changed_when: "'Installed:' in stage20_result.stdout"
  when: ps7_check.stat.exists

- name: "[Stage 20] Show module install results"
  debug:
    msg: "{{ stage20_result.stdout_lines }}"
  when: ps7_check.stat.exists

# ── Stage 21 — JetBrainsMono Nerd Font ───────────────────────────────────────

- name: "[Stage 21] Include font deployment tasks"
  include_tasks: fonts.yml

# ── Stage 22 — PS7 AllUsersAllHosts profile ───────────────────────────────────

- name: "[Stage 22] Write PS7 AllUsersAllHosts profile"
  ansible.windows.win_copy:
    dest: 'C:\Program Files\PowerShell\7\profile.ps1'
    content: |
      # Example Music Limited — PS7 AllUsersAllHosts profile
      # Written by Ansible bootstrap playbook

      # PSReadLine — Emacs mode required for correct paste behaviour over SSH
      if (Get-Module -ListAvailable PSReadLine) {
          Import-Module PSReadLine
          Set-PSReadLineOption -EditMode Emacs
          Set-PSReadLineOption -PredictionSource HistoryAndPlugin
          Set-PSReadLineOption -PredictionViewStyle ListView
          Set-PSReadLineKeyHandler -Key Tab -Function MenuComplete

          # Example Music Limited -- PSReadLine's own default Parameter/Operator
          # colour (ANSI code 90, "bright black") renders invisible against this
          # estate's Solarized Dark terminal scheme, which maps that exact ANSI
          # slot to the background colour itself (#002B36) -- see
          # docs/solarized-dark-terminal-setup.md. Confirmed live, 2026-10-03:
          # most noticeable over SSH from iTerm2 (macOS) into a Windows PS7
          # session, e.g. "Get-ADUser -Filter *" -- the -Filter parameter was
          # unreadable. True-RGB escapes here, not another ANSI slot number, so
          # this renders correctly regardless of which terminal/profile is
          # actually connecting (iTerm2 over SSH, Windows Terminal locally,
          # PuTTY, etc.) rather than being fragile to yet another slot remapping.
          Set-PSReadLineOption -Colors @{
              Parameter = "$([char]0x1b)[38;2;88;110;117m"   # Solarized base01, #586E75
              Operator  = "$([char]0x1b)[38;2;88;110;117m"   # same root cause, same fix
          }
      }

      # Terminal-Icons
      if (Get-Module -ListAvailable Terminal-Icons) {
          Import-Module Terminal-Icons
      }

      # CompletionPredictor
      if (Get-Module -ListAvailable CompletionPredictor) {
          Import-Module CompletionPredictor
      }

      # NerdFonts
      if (Get-Module -ListAvailable NerdFonts) {
          Import-Module NerdFonts
      }

      # MOTD banner -- nodeinfo.json, same file nodeinfo_windows.yml already writes/refreshes.
      # No automated caller anywhere in this repo ever shells out to pwsh.exe (checked), so this
      # only ever runs when a human actually types `pwsh` -- [Console]::IsInputRedirected below
      # is cheap defense-in-depth for that anyway, same reasoning as every other guard in this
      # estate's profile/startup scripts.
      if (-not [Console]::IsInputRedirected) {
          # PS7 itself is cross-platform -- $IsWindows/$IsLinux are real PowerShell 7
          # automatic variables, not something specific to this profile. The field names
          # are identical either way (nodeinfo.yml and nodeinfo_windows.yml write the same
          # schema), so the same rendering code below works unmodified on either OS --
          # only the path differs.
          $nodeinfoPath = if ($IsWindows) {
              'C:\ProgramData\ExampleMusic\Config\nodeinfo.json'
          } else {
              '/etc/example-music/nodeinfo.json'
          }
          if (Test-Path $nodeinfoPath) {
              try {
                  $ni = Get-Content -Raw $nodeinfoPath | ConvertFrom-Json

                  # Windows-flag-style logo (official 4-colour palette, plain 7-bit ASCII only --
                  # deliberately NOT Unicode block chars (U+2588), which render as flat,
                  # undifferentiated squares under some fonts/weights -- same font-rendering risk
                  # class as this estate's whole PuTTY font saga, avoided here on purpose. True-RGB
                  # ANSI, same escape pattern already proven safe in this file's own PSReadLine
                  # -Colors block above. Blank row between the two halves is deliberate -- without
                  # it the four quadrants visually merge into two tall two-toned bars.
                  $esc    = [char]0x1b
                  $red    = "$esc[38;2;242;82;34m"    # #F25022
                  $green  = "$esc[38;2;127;186;0m"    # #7FBA00
                  $blue   = "$esc[38;2;0;164;239m"     # #00A4EF
                  $yellow = "$esc[38;2;255;185;0m"    # #FFB900
                  $reset  = "$esc[0m"

                  $logoLines = @(
                      "$red########$reset $green########$reset"
                      "$red########$reset $green########$reset"
                      "$red########$reset $green########$reset"
                      ""
                      "$blue########$reset $yellow########$reset"
                      "$blue########$reset $yellow########$reset"
                      "$blue########$reset $yellow########$reset"
                  )
                  $infoLines = @(
                      "$($ni.hostname)  [$($ni.role) / $($ni.site)]"
                      "$($ni.fqdn)"
                      "$($ni.office_name), $($ni.city), $($ni.country)  ($($ni.entity))"
                      ""
                      "Environment: $($ni.environment)"
                      "Built: $($ni.bootstrapped_at.ToString('yyyy-MM-ddTHH:mm:ssZ')) ($($ni.bootstrapped_by))"
                      "Last run: $($ni.last_ansible_run.ToString('yyyy-MM-ddTHH:mm:ssZ')) ($($ni.last_ansible_play))"
                  )

                  Write-Host ""
                  for ($i = 0; $i -lt $logoLines.Count; $i++) {
                      Write-Host "  $($logoLines[$i])   $($infoLines[$i])"
                  }
                  Write-Host ""
              } catch {
                  # Malformed/partial nodeinfo.json -- never block a real pwsh launch over this.
              }
          }
          # No "else" if nodeinfoPath is missing -- genuinely possible mid-bootstrap, before
          # 85-finish.yml (which writes nodeinfo.json) has run. Silent, not an error.
      }
  when: ps7_check.stat.exists

# ── Stage 23 — Hyper terminal config ─────────────────────────────────────────

- name: "[Stage 23] Check Hyper is installed"
  ansible.windows.win_stat:
    path: 'C:\Program Files\Hyper\Hyper.exe'
  register: hyper_check

- name: "[Stage 23] Create Hyper config directory"
  ansible.windows.win_file:
    path: 'C:\Users\Administrator\AppData\Roaming\Hyper'
    state: directory
  when: hyper_check.stat.exists

- name: "[Stage 23] Write Hyper .hyper.js config"
  ansible.windows.win_copy:
    dest: 'C:\Users\Administrator\AppData\Roaming\Hyper\.hyper.js'
    content: |
      // Example Music Limited — Hyper terminal config
      // Written by Ansible bootstrap playbook
      module.exports = {
        config: {
          updateChannel: 'stable',
          fontSize: 16,
          fontFamily: '"JetBrainsMono Nerd Font Mono", "JetBrainsMono NF", Menlo, monospace',
          shell: 'C:\\Program Files\\PowerShell\\7\\pwsh.exe',
          shellArgs: ['--login', '--nologo'],
          env: {},
          theme: 'hyper-solarized-dark',
          colors: {
            black:   '#002b36', red:     '#dc322f', green:  '#859900',
            yellow:  '#b58900', blue:    '#268bd2', magenta:'#d33682',
            cyan:    '#2aa198', white:   '#eee8d5',
            lightBlack:   '#657b83', lightRed:   '#dc322f',
            lightGreen:   '#859900', lightYellow:'#b58900',
            lightBlue:    '#268bd2', lightMagenta:'#6c71c4',
            lightCyan:    '#2aa198', lightWhite: '#fdf6e3',
          },
          cursorColor: '#839496',
          cursorShape: 'BEAM',
          padding: '8px 12px',
          scrollback: 5000,
        },
        plugins: [
          'hyper-search',
          'hyper-pane',
          'hypercwd',
          'hyper-tabs-enhanced',
          'hyper-rename-tab',
          'hyper-tab-icons-plus',
          'hyper-solarized-dark',
        ],
        localPlugins: [],
        keymaps: {},
      };
  when: hyper_check.stat.exists

# ── Stage 24 — Windows Terminal config ──────────────────────────────────────

- name: "[Stage 24] Detect Windows Terminal install paths"
  ansible.windows.win_shell: |
    $paths = @()
    # Chocolatey path
    $choco = "$env:ProgramFiles\WindowsApps"
    # Store / MSIX path
    $store = Get-ChildItem "$env:LOCALAPPDATA\Packages" -Filter "Microsoft.WindowsTerminal*" `
             -ErrorAction SilentlyContinue | Select-Object -First 1
    if ($store) { $paths += "$($store.FullName)\LocalState" }
    # Chocolatey stable
    $chocoStable = "$env:APPDATA\Microsoft\Windows Terminal"
    if (Test-Path $chocoStable) { $paths += $chocoStable }
    $paths -join "`n"
  register: wt_paths
  changed_when: false

- name: "[Stage 24] Write Windows Terminal settings.json to detected paths"
  ansible.windows.win_copy:
    dest: "{{ item }}\\settings.json"
    content: |
      {
        "$help": "https://aka.ms/terminal-documentation",
        "$schema": "https://aka.ms/terminal-profiles-schema",
        "defaultProfile": "{574e775e-4f2a-5b96-ac1e-a2962a402336}",
        "copyOnSelect": false,
        "profiles": {
          "defaults": {
            "font": {
              "face": "JetBrainsMono Nerd Font Mono",
              "size": 14
            },
            "colorScheme": "Solarized Dark",
            "scrollbarState": "visible",
            "padding": "8, 8",
            "cursorShape": "bar"
          },
          "list": [
            {
              "guid": "{574e775e-4f2a-5b96-ac1e-a2962a402336}",
              "name": "PowerShell 7",
              "commandline": "C:\\\\Program Files\\\\PowerShell\\\\7\\\\pwsh.exe -NoLogo",
              "hidden": false,
              "icon": "ms-appx:///ProfileIcons/{574e775e-4f2a-5b96-ac1e-a2962a402336}.png"
            }
          ]
        },
        "schemes": [],
        "actions": []
      }
  loop: "{{ wt_paths.stdout_lines | select('ne', '') | list }}"
  loop_control:
    label: "{{ item }}"
  when: wt_paths.stdout_lines | select('ne', '') | list | length > 0
