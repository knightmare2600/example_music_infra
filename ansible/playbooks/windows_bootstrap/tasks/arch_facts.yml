---
# =============================================================================
# tasks/arch_facts.yml
# Example Music Limited — CPU architecture detection
# Included by playbooks that need host_arch.
# =============================================================================
# Maps ansible_architecture (AMD64/ARM64/32-bit) to the files/ folder
# convention used by playbooks/files/{x86_64,arm64}/ and detect_cpu.ps1/.cmd:
#   AMD64  -> x86_64
#   ARM64  -> arm64
#   32-bit -> x86
# =============================================================================
# Changelog:
#   2026-06-20  Initial file
#   2026-07-08  Removed binary_base_url (was "{{ exa_asset_base }}/{{ host_arch }}", an HTTP
#               base URL) -- 50-binaries.yml now win_copy's from files/{{ host_arch }}/ directly,
#               that pattern only existed for the pre-Ansible bootstrap scripts.
# =============================================================================

- name: Gather facts (arch detection)
  ansible.windows.setup:
  when: ansible_architecture is not defined

- name: Set host_arch fact
  set_fact:
    host_arch: >-
      {{ 'arm64'  if ansible_architecture == 'ARM64' else
         'x86_64' if ansible_architecture == 'AMD64' else
         'x86' }}

- name: Debug — arch detection result
  debug:
    msg: "Architecture: {{ ansible_architecture }} -> host_arch: {{ host_arch }}"
  tags: [never, debug]
