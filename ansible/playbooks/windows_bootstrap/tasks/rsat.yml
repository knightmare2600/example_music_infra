---
# =============================================================================
# tasks/rsat.yml
# Example Music Limited — RSAT tools (Stage 15)
# Replicates Join-DomainAndBootstrap.ps1 Stage 15
# =============================================================================
# Requires is_server / is_workstation (set by tasks/preflight.yml, or
# computed inline by callers that don't run the full preflight chain —
# see playbooks/45-rsat.yml).
# =============================================================================
# Changelog:
#   2026-06-20  Initial file (inline in 05-bootstrap.yml)
#   2026-07-06  Extracted into a shared task file so 05-bootstrap.yml and
#               playbooks/45-rsat.yml share one source of truth.
#   2026-09-25  Robert, found live (EXADCSGOT001, forest-root build): Server Manager
#               refused a subset of RSAT features with "One or several parent features
#               are disabled so current feature can not be enabled" (0xc004000d) --
#               a genuine Windows feature-dependency quirk on a fresh box, not a
#               playbook bug. RSAT is client-side management tooling, never consumed by
#               windows_dc's own AD-DS role install, so this shouldn't block the rest of
#               site.yml. Both tasks now register + ignore_errors, with a follow-up
#               warning task that only fires on real failure -- visible, not silent,
#               just not fatal.
#   2026-09-26  Robert: "server core can run [OpenRSAT], which means we don't need to mess
#               around with RSAT tools on core." Server Core is exactly the case the
#               2026-09-25 entry above found failing (Server-AD-AdminCenter/GPMC are
#               Desktop-Experience-only GUI tools -- their "parent features disabled" error
#               is expected there, not a fluke), so this file no longer even attempts the
#               native Server Manager path on Server Core -- it fetches
#               tranquilit/OpenRSAT (benarbejde/asset_manifest.json's workstation_tools[]
#               "openrsat" entry -- single source of truth for repo/tag/asset name, same
#               manifest the 3 setup-workstation scripts already read) instead, a portable
#               app that needs no Windows Feature/Capability at all. Downloaded and
#               checksum-verified on the CONTROL NODE (delegate_to: localhost), then pushed
#               to the target via win_copy -- matching this repo's existing binary-delivery
#               pattern (see 82-salt-minion.yml) rather than assuming a Server Core DC has
#               outbound internet access of its own, which nothing else in this estate does.
#               Requires is_server_core (tasks/preflight.yml or playbooks/45-rsat.yml's own
#               inline detection, both added the same day).
#   2026-09-26  Later the same day, Robert's own call, live: installed straight to
#               C:\Windows\System32\OpenRSAT.exe instead of this repo's usual
#               C:\Tools\<name>\ convention (sidesteps needing a machine-PATH-add step --
#               System32 is unconditionally on PATH already), plus a dsa.exe symlink
#               alongside it so typing the bare "dsa" launches it. Deliberately NOT named
#               dsa.msc -- .msc is resolved purely by file-extension association
#               (mmc.exe "%1"), so even a symlink literally named dsa.msc would still get
#               handed to mmc.exe and fail to open, regardless of what it points at.
#               Deliberately a symlink, not a hard link -- see the task's own comment for
#               why a hard link would silently go stale across future win_copy updates.
# =============================================================================

- name: "[Stage 15] Install RSAT via Server Manager (Server OS, not Server Core)"
  ansible.windows.win_feature:
    name:
      - RSAT-AD-PowerShell
      - RSAT-AD-AdminCenter
      - RSAT-ADDS-Tools
      - RSAT-DNS-Server
      - GPMC
    state: present
  when: is_server and not is_server_core
  register: _rsat_server_result
  # 2026-09-25, Robert (found live, EXADCSGOT001, forest-root build): Server Manager can
  # refuse a subset of these with "One or several parent features are disabled so current
  # feature can not be enabled" (0xc004000d) on a genuinely fresh box -- RSAT is
  # client-side management tooling, not load-bearing for the actual AD-DS role
  # windows_dc's own playbooks install, so a failure here shouldn't block the rest of
  # site.yml. Not silent, though: the warning task below only fires when this one
  # actually failed, so a real regression here still shows up, it just doesn't halt.
  ignore_errors: true

- name: "[Stage 15] WARNING — RSAT (Server Manager) install failed, continuing anyway"
  ansible.builtin.debug:
    msg: >-
      RSAT install failed ({{ _rsat_server_result.msg | default('see task output above') }}) --
      non-fatal, RSAT is management tooling only, not required for AD-DS itself. Install
      manually later if needed: Install-WindowsFeature RSAT-AD-PowerShell,RSAT-AD-AdminCenter,
      RSAT-ADDS-Tools,RSAT-DNS-Server,GPMC
  when: is_server and not is_server_core and _rsat_server_result is failed

# ---------------------------------------------------------------------------
# Server Core -- OpenRSAT instead of native RSAT (2026-09-26, see changelog above)
# ---------------------------------------------------------------------------

- name: "[Stage 15] OpenRSAT — resolve manifest entry (Server Core RSAT fallback)"
  set_fact:
    _openrsat: >-
      {{ (lookup('file', playbook_dir + '/../../../../benarbejde/asset_manifest.json') | from_json).workstation_tools
         | selectattr('name', 'equalto', 'openrsat') | first }}
  when: is_server_core

- name: "[Stage 15] OpenRSAT — query GitHub release metadata"
  ansible.builtin.uri:
    url: "https://api.github.com/repos/{{ _openrsat.repo }}/releases/tags/{{ _openrsat.tag }}"
    return_content: true
  register: _openrsat_release
  delegate_to: localhost
  when: is_server_core

- name: "[Stage 15] OpenRSAT — resolve Windows asset's checksum + download URL"
  set_fact:
    _openrsat_asset: "{{ _openrsat_release.json.assets | selectattr('name', 'equalto', _openrsat.assets['windows-amd64']) | first }}"
  when: is_server_core

- name: "[Stage 15] OpenRSAT — download + checksum-verify on the control node"
  ansible.builtin.get_url:
    url: "{{ _openrsat_asset.browser_download_url }}"
    dest: "/tmp/example-music-openrsat-cache/{{ _openrsat.assets['windows-amd64'] }}"
    checksum: "{{ _openrsat_asset.digest }}"
  delegate_to: localhost
  when: is_server_core

- name: "[Stage 15] OpenRSAT — copy to Server Core target"
  ansible.windows.win_copy:
    src: "/tmp/example-music-openrsat-cache/{{ _openrsat.assets['windows-amd64'] }}"
    dest: 'C:\Windows\System32\OpenRSAT.exe'
  when: is_server_core
  # Robert's own call, live (2026-09-26): straight into System32, not
  # C:\Tools\OpenRSAT\ (this repo's usual convention for fyrtaarn etc.) --
  # System32 is unconditionally on PATH already, so this also sidesteps
  # needing a separate machine-PATH-add step the way Setup-Workstation.ps1's
  # own Install-WorkstationTools needs for C:\Tools\<name>\.

# dsa.msc itself can't be the trigger here, regardless of what it points at
# -- Windows resolves .msc purely by file-extension association (mmc.exe
# "%1"), so even a symlink literally named dsa.msc would still get handed
# to mmc.exe, which expects an MMC console XML document, not a PE
# executable, and would fail to open it. .exe sits ahead of .msc in the
# default PATHEXT search order, so a symlink named dsa.exe means typing the
# bare command "dsa" (how dsa.msc is normally invoked day to day -- nobody
# actually types the .msc) resolves to this instead. Symlink, not a hard
# link: a hard link ties dsa.exe to today's specific on-disk data, and the
# task above re-fetches OpenRSAT.exe via win_copy on future version bumps,
# which writes a new file rather than editing in place -- that would
# silently orphan a hard link at the old, stale binary. A symlink follows
# the name, so it keeps resolving correctly after every update.
- name: "[Stage 15] OpenRSAT — create dsa.exe symlink (System32)"
  ansible.windows.win_shell: |
    if (Test-Path 'C:\Windows\System32\dsa.exe') {
      Write-Output 'unchanged'
    } else {
      New-Item -ItemType SymbolicLink -Path 'C:\Windows\System32\dsa.exe' -Target 'C:\Windows\System32\OpenRSAT.exe' | Out-Null
      Write-Output 'changed'
    }
  register: _openrsat_symlink
  changed_when: "'changed' in _openrsat_symlink.stdout"
  when: is_server_core

- name: "[Stage 15] Install RSAT via Windows Capabilities (Desktop OS)"
  ansible.windows.win_optional_feature:
    name: "{{ item }}"
    state: present
  loop:
    - Rsat.ActiveDirectory.DS-LDS.Tools~~~~0.0.1.0
    - Rsat.Dns.Tools~~~~0.0.1.0
    - Rsat.GroupPolicy.Management.Tools~~~~0.0.1.0
  when: is_workstation
  register: _rsat_desktop_result
  ignore_errors: true

- name: "[Stage 15] WARNING — RSAT (Windows Capabilities) install failed, continuing anyway"
  ansible.builtin.debug:
    msg: >-
      RSAT install failed for one or more capabilities -- non-fatal, RSAT is management
      tooling only, not required for AD-DS itself. Install manually later if needed via
      Settings > Optional Features, or Add-WindowsCapability -Online -Name <name>.
  when: is_workstation and _rsat_desktop_result is failed
