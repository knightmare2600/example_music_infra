---
# =============================================================================
# tasks/site_detection.yml
# Example Music Limited — Hypervisor detection (Stage 1) and site
# detection from IP third octet (Stage 2)
# Replicates Join-DomainAndBootstrap.ps1 Stages 1 and 2
# =============================================================================
# Changelog:
#   2026-08-14  Robert, live (EXADCSLAX001): "Match octet to site code" reported a
#               false MISMATCH -- octet 213 (LAX) "not found in site map". Root
#               cause: octet_map was a hand-typed dict covering only 15 of the real
#               ~53 sites in sites.csv -- the exact "hardcode instead of deriving
#               from sites.csv" anti-pattern banned elsewhere this session (see
#               check_hardcoded_site_metadata.py / at_have_ryggen_fri check 39),
#               just in a different shape (an inline Jinja dict literal here, not a
#               host_vars key -- check 39's regex never had a chance to catch this
#               one). detected_site is purely informational (grepped: not
#               referenced anywhere outside this file's own debug message; the
#               hostname-derived host_site_code is what's actually used everywhere
#               else in the chain), so this was never a functional bug -- just a
#               confusing, wrong warning. Fixed by deriving detected_site live from
#               site_data (already loaded from sites.csv by 00-preflight.yml's
#               Phase A4 and still in scope this far into the same run -- no second
#               read_csv needed), matching each site's Subnet's third octet instead
#               of a hand-typed subset.
#   2026-06-20  Initial file
#   2026-07-14  Fixed a real bug found live (EXADCSCLD001, forest-root DC build):
#               "Show site detection result" crashed with "'host_site' is undefined".
#               This file only ever runs downstream of 00-preflight.yml in the same
#               chain (both consumers, 35-guest-tools.yml and 85-finish.yml, always
#               come after it in site.yml's fixed order) -- 00-preflight.yml's own
#               Phase A3 sets the hostname-derived site code as host_site_code, not
#               host_site. This file was referencing a variable that never existed
#               anywhere in the codebase. Fixed to use the real name.
# =============================================================================

# ── Stage 1 — Hypervisor detection ───────────────────────────────────────────

- name: "[Stage 1] Detect hypervisor via WMI manufacturer"
  ansible.windows.win_shell: |
    (Get-WmiObject Win32_ComputerSystem).Manufacturer
  register: stage1_manufacturer
  changed_when: false

- name: "[Stage 1] Detect loaded drivers (stronger signal than SMBIOS)"
  ansible.windows.win_shell: |
    driverquery /FO CSV | ConvertFrom-Csv | Select-Object -ExpandProperty 'Module Name'
  register: stage1_drivers
  changed_when: false

- name: "[Stage 1] Set hypervisor fact"
  set_fact:
    hypervisor: >-
      {%- set mfr = stage1_manufacturer.stdout | trim | lower -%}
      {%- set drv = stage1_drivers.stdout | lower -%}
      {%- if 'vmxnet' in drv or 'vmware' in drv -%}VMware
      {%- elif 'vioscsi' in drv or 'balloon' in drv or 'viostor' in drv -%}KVM
      {%- elif 'hvboot' in drv or 'vmbus' in drv -%}HyperV
      {%- elif 'vmware' in mfr -%}VMware
      {%- elif 'qemu' in mfr or 'kvm' in mfr -%}KVM
      {%- elif 'microsoft' in mfr -%}HyperV
      {%- else -%}Physical
      {%- endif -%}

- name: "[Stage 1] Show hypervisor detection result"
  debug:
    msg: "Hypervisor detected: {{ hypervisor }}"

# ── Stage 2 — Site detection from IP third octet ─────────────────────────────

- name: "[Stage 2] Get local IP address via ipconfig"
  ansible.windows.win_shell: |
    $ip = (Get-NetIPAddress -AddressFamily IPv4 |
           Where-Object { $_.IPAddress -notmatch '^(127\.|169\.254\.)' } |
           Select-Object -First 1).IPAddress
    $ip
  register: stage2_ip
  changed_when: false

- name: "[Stage 2] Parse subnet octet from IP"
  set_fact:
    host_ip:            "{{ stage2_ip.stdout | trim }}"
    host_subnet_octet:  "{{ stage2_ip.stdout | trim | regex_replace('^(\\d+\\.\\d+\\.)(\\d+)(\\.\\d+)$', '\\2') }}"

- name: "[Stage 2] Match octet to site code"
  set_fact:
    detected_site: >-
      {%- set matches = site_data | selectattr('Subnet', 'search', '^(\d+\.){2}' + host_subnet_octet + '\.\d+/') | list -%}
      {{ matches[0].Site if matches | length > 0 else 'UNKNOWN' }}

- name: "[Stage 2] WARN — subnet octet not in known site map"
  debug:
    msg: >
      WARN: Subnet octet {{ host_subnet_octet }} not found in site map.
      host_site will be used from hostname instead.
  when: detected_site == 'UNKNOWN'

- name: "[Stage 2] Show site detection result"
  debug:
    msg: >
      IP: {{ host_ip }}  |  Octet: {{ host_subnet_octet }}  |
      Detected site: {{ detected_site }}  |
      Hostname site: {{ host_site_code }}
      {{ '(match)' if detected_site == host_site_code else '(MISMATCH — using hostname-derived site: ' + host_site_code + ')' }}
