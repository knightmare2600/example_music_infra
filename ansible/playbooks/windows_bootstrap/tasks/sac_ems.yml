---
# =============================================================================
# tasks/sac_ems.yml
# Example Music Limited — SAC/EMS serial console (Server OS only)
# Replicates Join-DomainAndBootstrap.ps1 Stage 17b (the legacy PS1 script's own number,
# unchanged — an external, immutable fact). This file's own internal task-name label was
# renumbered 2026-07-19 (17b -> 18) to remove the lettered sub-stage — see
# docs/ansible/beginners_guide_to_ansible.md's "Renumbering / Reworking Live Conventions"
# section.
# =============================================================================
# bcdedit {bootmgr} and {current} tokens must be passed via cmd /c to bypass
# PowerShell's parser. win_shell runs via powershell.exe; single-quoted
# '{bootmgr}' is a valid PS literal string, but bcdedit on Windows Server
# 2022 rejects the token when wrapped in any quotes at all. cmd /c passes
# the arguments raw without any PS string parsing.
#
# Requires is_server (set by tasks/preflight.yml, or computed inline by
# callers that don't run the full preflight chain — see
# playbooks/78-sac-ems.yml).
# =============================================================================
# Changelog:
#   2026-07-14  Robert, live against EXADCSCLD001: the "Prompt operator — confirm SAC
#               visible via SOL" pause: task blocked the ENTIRE playbook run waiting on
#               Enter, mid-chain, on every single run (not just first-time setup).
#               Robert's own framing: he understands *why* SAC needs a manual SOL check
#               (it's genuinely something a human has to verify, Ansible has no way to
#               drive an SOL session), but that verification should be surfaced once, at
#               the end of the whole run, as a "here's what to do" note — not a hard stop
#               partway through. Replaced the pause: with set_fact: sac_sol_verify_needed,
#               and moved the actual verification instructions into 85-finish.yml's final
#               summary (printed only when this fact is set). No information lost, just
#               deferred and made non-blocking.
#   2026-07-12  Removed failed_when: false from the "Enable SAC service"
#               task (idempotency audit, [[project_ad_onboarding_audit]]) --
#               it unconditionally converted a genuine failure (service
#               missing, access denied) into a reported success, every run,
#               not just reruns. The task is already gated `when: is_server`,
#               so "sacsvr doesn't exist" shouldn't be a real, expected case
#               on the hosts this actually runs against; if it happens now,
#               it fails loudly instead of silently.
#   2026-06-20  Initial file (inline in 05-bootstrap.yml)
#   2026-06-30  Patch 3: bcdedit {bootmgr}/{current} tokens fix — wrap
#               entire bcdedit invocation in double quotes so cmd receives
#               the braces intact.
#   2026-07-02  Patch 4: apply Patch 3 fix (double-quoted cmd /c)
#   2026-07-06  Extracted into a shared task file so 05-bootstrap.yml and
#               playbooks/78-sac-ems.yml share one source of truth.
# =============================================================================

- name: "[Stage 18] Configure Windows Boot Manager serial redirect"
  ansible.windows.win_shell: |
    cmd /c "bcdedit /set {bootmgr} displaybootmenu yes"
    cmd /c "bcdedit /set {bootmgr} timeout 10"
    cmd /c "bcdedit /set {bootmgr} bootems yes"
  changed_when: true
  when: is_server

- name: "[Stage 18] Configure EMS on current boot entry"
  ansible.windows.win_shell: |
    cmd /c "bcdedit /ems {current} on"
    cmd /c "bcdedit /emssettings EMSPORT:1 EMSBAUDRATE:115200"
  changed_when: true
  when: is_server

- name: "[Stage 18] Enable SAC service (sacsvr)"
  ansible.windows.win_service:
    name:       sacsvr
    start_mode: auto
    state:      started
  when: is_server

- name: "[Stage 18] Flag SAC/EMS verification for the end-of-run summary"
  set_fact:
    sac_sol_verify_needed: true
  when: is_server
