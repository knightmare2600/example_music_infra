---
# =============================================================================
# playbooks/75-openssh.yml
# Example Music Limited — OpenSSH configuration and Ansible key deployment
# =============================================================================
# Ensures OpenSSH Server is running and set to Automatic. Writes the Ansible
# public key to administrators_authorized_keys with correct ACLs (matches
# Join-DomainAndBootstrap.ps1 Stage 16). Removes any DefaultShell/
# DefaultShellCommandOption override left by a previous (buggy) run — see
# 2026-07-15 changelog entry, PS7 must never be the SSH DefaultShell here.
#
# Safe to re-run — key file is overwritten with the canonical value,
# ACLs are re-applied, service state is confirmed.
#
# Usage:
#   ansible-playbook -i configs/inventory playbooks/windows_bootstrap/playbooks/75-openssh.yml
#
# Tags: openssh
# =============================================================================
# Changelog:
#   2026-07-15  Robert, live against EXADCSCLD001: flagged that this file was setting
#               PS7 (pwsh.exe) as the OpenSSH DefaultShell -- previously found (his own
#               direct prior experience, not re-derived here) to break things: Ansible's
#               ansible.windows SSH connection plugin (ansible_shell_type: powershell,
#               used throughout this whole chain) is built against Windows PowerShell
#               5.1's specific -EncodedCommand/module-loading behaviour, and setting
#               DefaultShell to pwsh.exe changes what every subsequent SSH exec call
#               runs, including Ansible's own -- a real regression risk, not a
#               theoretical one. Removed the "Set PS7 as default SSH shell" and "Set
#               DefaultShellCommandOption for SSHServerMode" tasks entirely; replaced
#               with two unconditional state:absent tasks so any host a previous
#               (buggy) run already changed gets healed back to the PS5.1 default, not
#               just newly-built hosts left alone. Operators who want PS7 interactively
#               can still just type `pwsh` once connected -- nothing here prevents
#               that, it only stops SSH itself (and Ansible) from being handed PS7 by
#               default.
#   2026-07-14  Robert, live against EXADCSCLD001: removed the "Install OpenSSH
#               Server capability" task (win_optional_feature, state: present).
#               It failed with "Failed to find feature
#               'OpenSSH.Server~~~~0.0.1.0'" -- this host's OpenSSH was never
#               installed via the standard Windows Capability/DISM mechanism
#               (no Features-on-Demand source available to enumerate it
#               against), so the lookup errored regardless of sshd actually
#               being present and working. It always was, by construction:
#               every windows_bootstrap play, including this one, only ever
#               runs over the SSH connection 00-preflight.yml already
#               established (ansible_connection: ssh) -- reaching this task at
#               all is itself proof sshd is installed and answering. This task
#               was a holdover from Join-DomainAndBootstrap.ps1, which ran
#               locally on a stock image *before* any SSH connection existed
#               and genuinely needed to enable the capability from scratch;
#               that precondition doesn't apply once Ansible is driving
#               everything over SSH. The rest of the file (key deployment,
#               ACLs, firewall rule, PS7 default shell, restart) still runs
#               every time -- only the redundant install step is gone.
#   2026-06-20  Initial file
# =============================================================================

- name: Windows — OpenSSH configuration
  hosts: "{{ target | default('all') }}"
  gather_facts: false
  tasks:

    - name: Ensure sshd service is running and set to Automatic
      ansible.windows.win_service:
        name: sshd
        start_mode: auto
        state: started
      tags: openssh

    - name: Ensure SSH ProgramData directory exists
      ansible.windows.win_file:
        path: 'C:\ProgramData\ssh'
        state: directory
      tags: openssh

    - name: Write Ansible public key to administrators_authorized_keys
      ansible.windows.win_copy:
        content: "{{ exa_ansible_pub_key }}\n"
        dest:    "{{ exa_ansible_key_path }}"
      tags: openssh

    - name: Set ACLs on administrators_authorized_keys (remove inheritance)
      ansible.windows.win_shell: |
        icacls "{{ exa_ansible_key_path }}" /inheritance:r
        icacls "{{ exa_ansible_key_path }}" /grant "SYSTEM:(F)"
        icacls "{{ exa_ansible_key_path }}" /grant "BUILTIN\Administrators:(F)"
      changed_when: true
      tags: openssh

    - name: Add OpenSSH firewall rule
      community.windows.win_firewall_rule:
        name:      "OpenSSH-Server-In-TCP"
        localport: 22
        protocol:  tcp
        direction: in
        action:    allow
        enabled:   true
        state:     present
      tags: openssh

    - name: Remove DefaultShell override, if a previous run set one
      ansible.windows.win_regedit:
        path: 'HKLM:\SOFTWARE\OpenSSH'
        name: DefaultShell
        state: absent
      tags: openssh

    - name: Remove DefaultShellCommandOption override, if a previous run set one
      ansible.windows.win_regedit:
        path: 'HKLM:\SOFTWARE\OpenSSH'
        name: DefaultShellCommandOption
        state: absent
      tags: openssh

    - name: Restart sshd (pick up key, ACLs and shell changes)
      ansible.windows.win_service:
        name: sshd
        state: restarted
      tags: openssh
