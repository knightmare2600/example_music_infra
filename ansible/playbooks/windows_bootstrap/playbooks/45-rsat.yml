---
# =============================================================================
# playbooks/45-rsat.yml
# Example Music Limited — RSAT tools
# =============================================================================
# Installs RSAT (AD PowerShell, AD Admin Center, ADDS Tools, DNS Server,
# GPMC) via Server Manager on Server OS, or the equivalent Windows
# Capabilities on Desktop OS. Safe to re-run.
#
# Usage:
#   ansible-playbook -i configs/inventory playbooks/windows_bootstrap/playbooks/45-rsat.yml
#
# Tags: rsat
# =============================================================================
# Changelog:
#   2026-09-19  CRITICAL, found live (Robert, EXAANSFRD001 -- mid-EXADCSFRD001 build): this
#               play's hosts: line only checked {{ target | default('all') }} -- "target" is
#               never set anywhere in this chain; only site.yml's own documented
#               -e target_hosts=<ip> usage is. Every play past 00-preflight.yml (which already
#               correctly checks target_hosts first) silently ran against hosts: all -- the
#               entire estate, every OS/role -- on any site.yml run invoked exactly as
#               documented. Caught before real damage only because 15-locale-timezone.yml's
#               win_timezone module failed at resolution time before this play's own turn came
#               up; 20-registry.yml (registry hardening) would have run for real against every
#               Windows host in the estate otherwise. Fixed to
#               "{{ target_hosts | default(target | default('all')) }}", matching
#               00-preflight.yml's own already-correct pattern -- same fix applied identically
#               across all 19 affected playbooks in this directory (82-salt-minion.yml's
#               deliberate windows_nodes group targeting is unrelated and untouched).
#   2026-07-06  Initial file — extracted from 05-bootstrap.yml Stage 15 so
#               it can be run/retried standalone instead of only inline
#               during initial bootstrap. is_server/is_workstation aren't
#               computed by the full tasks/preflight.yml chain here (that
#               file does much more than OS-type detection); a small inline
#               ProductType check is enough, matching how the other
#               already-standalone playbooks in this module avoid pulling
#               in the whole preflight chain just for one fact.
#   2026-09-26  Added the same inline is_server_core detection tasks/preflight.yml
#               just got (see that file's own changelog) -- rsat.yml now needs it too,
#               and this playbook deliberately doesn't run the full preflight chain.
# =============================================================================

- name: Windows — RSAT tools
  hosts:         "{{ target_hosts | default(target | default('all')) }}"
  gather_facts: false
  tasks:

    - name: Detect OS product type (1=Workstation 2=DC 3=Server)
      ansible.windows.win_shell: |
        (Get-WmiObject Win32_OperatingSystem).ProductType
      register: rsat_product_type
      changed_when: false
      tags: rsat

    - name: Set OS type facts
      set_fact:
        is_server:      "{{ rsat_product_type.stdout | trim in ['2', '3'] }}"
        is_workstation: "{{ rsat_product_type.stdout | trim == '1' }}"
      tags: rsat

    - name: Detect Server-Gui-Shell feature state (Server Core check)
      ansible.windows.win_shell: |
        $f = Get-WindowsFeature Server-Gui-Shell -ErrorAction SilentlyContinue
        if ($f) { $f.Installed } else { '' }
      register: rsat_gui_shell
      changed_when: false
      when: is_server
      tags: rsat

    - name: Set is_server_core fact
      set_fact:
        is_server_core: "{{ is_server and (rsat_gui_shell.stdout | default('') | trim == 'False') }}"
      tags: rsat

    - name: Include RSAT tasks
      include_tasks: ../tasks/rsat.yml
      tags: rsat
