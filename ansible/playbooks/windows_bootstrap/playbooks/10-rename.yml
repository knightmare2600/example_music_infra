---
# =============================================================================
# playbooks/10-rename.yml
# Example Music Limited — Windows host rename
# =============================================================================
# STANDALONE ONLY as of 2026-07-14 -- no longer imported by site.yml. Use this
# to rename an already-bootstrapped host later, without a full re-bootstrap.
# For a fresh PostOOBE build, 00-preflight.yml's own Phase G already renames
# the host (using the target_hostname answer given once, up front) -- this
# file used to also run straight after that in the chain, prompting AGAIN,
# independently, for the same thing. See site.yml's 2026-07-14 changelog
# entry for the full reasoning (ansible-core's vars_prompt can't be
# conditionally skipped based on an already-set fact, so the only way to stop
# the redundant second prompt was to stop chaining this file at all).
#
# Prompts for a hostname if --extra-vars new_hostname is not supplied.
# Validates against EXA[ROLE][SITE][NNN] convention and cross-checks the
# site code against sites.csv (passed as --extra-vars sites_csv=<path>).
#
# Usage:
#   ansible-playbook playbooks/windows_bootstrap/playbooks/10-rename.yml -i <ip>,
#   ansible-playbook playbooks/windows_bootstrap/playbooks/10-rename.yml -i <ip>, \
#     -e target_hostname=EXAWKSGLA001
#
# Tags: rename
# =============================================================================
# Changelog:
#   2026-06-20  Initial file
#   2026-07-09  Fixed hosts: to target-only, matching every other numbered
#               play except 00-preflight.yml itself. 00-preflight.yml now
#               dynamically registers the host into its permanent inventory
#               group via add_host once it knows the final IP/hostname, so
#               target_hosts=<ip> (a fixed extra-var for the whole run) is
#               only needed for 00-preflight.yml's own first connection,
#               before that registration exists. Prioritising target_hosts
#               here meant this play kept targeting the raw IP directly all
#               run, bypassing the new registration -- harmless for this
#               file specifically (nothing here reads group_vars), but wrong
#               on principle and one broken link away from mattering if this
#               file ever needs to.
#   2026-07-14  Fixed a real bug found live (EXADCSCLD001, the actual forest-root
#               DC build): "Validate supplied hostname format" failed with
#               "Conditionals must have a boolean result" on every input, valid
#               or not. regex_search() returns the matched STRING on success (or
#               None on no match) -- never a real boolean -- so `that:` was
#               being handed a string, which this ansible-core version correctly
#               rejects rather than silently truthy-coercing. 00-preflight.yml's
#               own equivalent check ([A2] Validate hostname format) already gets
#               this right with `is not none`; this file was just missing it.
# =============================================================================

- name: Windows — Rename host
  hosts: "{{ target | default('all') }}"
  gather_facts: true
  vars_prompt:
    - name: target_hostname
      prompt: "New hostname (EXA[ROLE][SITE][NNN], e.g. EXAWKSGLA001) — Enter to skip rename"
      private: false
      default: ""
  tasks:

    - name: Skip rename if no hostname supplied
      debug:
        msg: "No hostname supplied — skipping rename. Current: {{ ansible_hostname }}"
      when: target_hostname == ""

    - name: Validate supplied hostname format
      assert:
        that:
          - target_hostname | upper | regex_search('^EXA[A-Z]{2,4}[A-Z]{3}[0-9]{3}$') is not none
        fail_msg: >
          '{{ target_hostname }}' is not a valid EXA hostname.
          Format: EXA[ROLE][SITE][NNN] — e.g. EXAWKSGLA001, EXASRVCLD002.
      when: target_hostname != ""

    - name: Skip if already named correctly
      debug:
        msg: "Host is already named {{ target_hostname | upper }} — no rename needed."
      when:
        - target_hostname != ""
        - ansible_hostname | upper == target_hostname | upper

    - name: Rename computer
      ansible.windows.win_shell: |
        Rename-Computer -NewName "{{ target_hostname | upper }}" -Force
      register: rename_result
      when:
        - target_hostname != ""
        - ansible_hostname | upper != target_hostname | upper

    - name: Reboot after rename
      ansible.windows.win_reboot:
        reboot_timeout:    600
        post_reboot_delay: 30
        msg: "Rebooting after hostname rename"
      when: rename_result is changed
