---
# =============================================================================
# playbooks/10-rename.yml
# Example Music Limited — Windows host rename
# =============================================================================
# Prompts for a hostname if --extra-vars new_hostname is not supplied.
# Validates against EXA[ROLE][SITE][NNN] convention and cross-checks the
# site code against sites.csv (passed as --extra-vars sites_csv=<path>).
#
# Usage:
#   ansible-playbook playbooks/windows_bootstrap/playbooks/10-rename.yml -i <ip>,
#   ansible-playbook playbooks/windows_bootstrap/playbooks/10-rename.yml -i <ip>, \
#     -e target_hostname=EXAWKSGLA001
#
# Tags: rename
# =============================================================================
# Changelog:
#   2026-06-20  Initial file
# =============================================================================

- name: Windows — Rename host
  hosts: "{{ target_hosts | default(target | default('all')) }}"
  gather_facts: true
  vars_prompt:
    - name: target_hostname
      prompt: "New hostname (EXA[ROLE][SITE][NNN], e.g. EXAWKSGLA001) — Enter to skip rename"
      private: false
      default: ""
  tasks:

    - name: Skip rename if no hostname supplied
      debug:
        msg: "No hostname supplied — skipping rename. Current: {{ ansible_hostname }}"
      when: target_hostname == ""

    - name: Validate supplied hostname format
      assert:
        that:
          - target_hostname | upper | regex_search('^EXA[A-Z]{2,4}[A-Z]{3}[0-9]{3}$')
        fail_msg: >
          '{{ target_hostname }}' is not a valid EXA hostname.
          Format: EXA[ROLE][SITE][NNN] — e.g. EXAWKSGLA001, EXASRVCLD002.
      when: target_hostname != ""

    - name: Skip if already named correctly
      debug:
        msg: "Host is already named {{ target_hostname | upper }} — no rename needed."
      when:
        - target_hostname != ""
        - ansible_hostname | upper == target_hostname | upper

    - name: Rename computer
      ansible.windows.win_shell: |
        Rename-Computer -NewName "{{ target_hostname | upper }}" -Force
      register: rename_result
      when:
        - target_hostname != ""
        - ansible_hostname | upper != target_hostname | upper

    - name: Reboot after rename
      ansible.windows.win_reboot:
        reboot_timeout:    600
        post_reboot_delay: 30
        msg: "Rebooting after hostname rename"
      when: rename_result is changed
