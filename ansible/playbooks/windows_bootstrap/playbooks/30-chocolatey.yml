---
# =============================================================================
# playbooks/30-chocolatey.yml
# Example Music Limited — Chocolatey installation
# =============================================================================
# Installs Chocolatey if not already present. Safe to re-run.
# Join-DomainAndBootstrap.ps1 Stage 11 handles this at build time —
# this playbook is for drift correction or non-PXE-built machines.
#
# Usage:
#   ansible-playbook -i configs/inventory playbooks/windows_bootstrap/playbooks/30-chocolatey.yml
#
# Tags: chocolatey
# =============================================================================
# Changelog:
#   2026-09-19  CRITICAL, found live (Robert, EXAANSFRD001 -- mid-EXADCSFRD001 build): this
#               play's hosts: line only checked {{ target | default('all') }} -- "target" is
#               never set anywhere in this chain; only site.yml's own documented
#               -e target_hosts=<ip> usage is. Every play past 00-preflight.yml (which already
#               correctly checks target_hosts first) silently ran against hosts: all -- the
#               entire estate, every OS/role -- on any site.yml run invoked exactly as
#               documented. Caught before real damage only because 15-locale-timezone.yml's
#               win_timezone module failed at resolution time before this play's own turn came
#               up; 20-registry.yml (registry hardening) would have run for real against every
#               Windows host in the estate otherwise. Fixed to
#               "{{ target_hosts | default(target | default('all')) }}", matching
#               00-preflight.yml's own already-correct pattern -- same fix applied identically
#               across all 19 affected playbooks in this directory (82-salt-minion.yml's
#               deliberate windows_nodes group targeting is unrelated and untouched).
#   2026-08-14  Robert, live (EXADCSLAX001): "Confirm Chocolatey version" failed
#               with "choco : The term 'choco' is not recognized" immediately
#               after "Install Chocolatey" reported changed=true, rc=0 -- the
#               installer genuinely ran and updated the Machine PATH via the
#               registry, but Ansible's winrm connection plugin reuses one
#               WinRM shell across every task within a play, and that shell's
#               own process environment doesn't refresh mid-session just
#               because a later task updated HKLM's Environment key. Fixed by
#               re-reading Machine+User PATH from the environment explicitly
#               at the top of this task's own script, rather than relying on
#               choco.exe already being resolvable via the shell's stale
#               inherited PATH. CORRECTION, same day: originally assumed
#               40-choco-packages.yml's own `choco list --limit-output` task
#               was safe since it runs in a separate play (fresh WinRM shell)
#               -- wrong, proven live: it hit this exact same failure in the
#               same ansible-playbook run. Ansible's winrm connection plugin
#               reuses one shell for the WHOLE run, not just within a play.
#               Fixed there too, same pattern -- see that file's own
#               2026-08-14 changelog entry.
#   2026-06-20  Initial file
# =============================================================================

- name: Windows — Chocolatey installation
  hosts:         "{{ target_hosts | default(target | default('all')) }}"
  gather_facts: false
  tasks:

    - name: Check if Chocolatey is installed
      ansible.windows.win_shell: |
        if (Get-Command choco.exe -ErrorAction SilentlyContinue) { "present" } else { "absent" }
      register: choco_check
      changed_when: false
      tags: chocolatey

    - name: Install Chocolatey
      ansible.windows.win_shell: |
        Set-ExecutionPolicy Bypass -Scope Process -Force
        [Net.ServicePointManager]::SecurityProtocol = [Net.SecurityProtocolType]::Tls12
        Invoke-Expression ((New-Object Net.WebClient).DownloadString('https://community.chocolatey.org/install.ps1'))
      when: choco_check.stdout | trim != "present"
      tags: chocolatey

    - name: Confirm Chocolatey version
      ansible.windows.win_shell: |
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
        choco --version
      register: choco_version
      changed_when: false
      tags: chocolatey

    - name: Show Chocolatey version
      debug:
        msg: "Chocolatey {{ choco_version.stdout | trim }} is installed."
      tags: chocolatey
