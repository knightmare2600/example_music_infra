---
# =============================================================================
# playbooks/60-wallpaper.yml
# Example Music Limited — Corporate wallpaper and dark mode
# =============================================================================
# Pushes ExampleMusicWallpaper.png (files/wallpaper/) directly via win_copy
# and sets it via PersonalizationCSP (all users) + Policies\System (locked).
# Also enables dark mode system-wide (HKLM + Default user hive).
#
# Key paths match Join-DomainAndBootstrap.ps1 Stages 9 and 10 exactly so
# this playbook can re-apply after drift without conflict.
#
# Usage:
#   ansible-playbook -i configs/inventory playbooks/windows_bootstrap/playbooks/60-wallpaper.yml
#
# Tags: wallpaper
# =============================================================================
# Changelog:
#   2026-06-20  Initial file
#   2026-07-06  Folded in dark mode (Stage 10) — same "desktop theming"
#               concern as wallpaper, tightly coupled by the original
#               PS script's stage ordering (9 then 10), not worth a
#               separate file for two small regedit tasks.
#   2026-07-08  win_get_url (exa_wallpaper_url, an HTTP fetch from the
#               provisioning server) replaced with win_copy from files/ —
#               that pattern only existed for the pre-Ansible bootstrap
#               scripts, which had no other way to get a file onto a box.
#   2026-07-21  Added SetWallpaper.exe RunOnce queue, ported while reviewing
#               a dropped-in reference Salt state — a real console tool that
#               forces an immediate wallpaper refresh, on top of the
#               RUNDLL32 broadcast this file already did. Queued via
#               RunOnce (see files/README.md for the tool's own confirmed
#               syntax and its two open caveats: .bmp-only support unverified
#               against modern Windows, and no true "Fill" style equivalent)
#               rather than run directly over this SSH/WinRM session — same
#               "no attached interactive display" reasoning as setres.exe in
#               85-finish.yml.
# =============================================================================

- name: Windows — Corporate wallpaper and dark mode
  hosts: "{{ target | default('all') }}"
  gather_facts: false
  tasks:

    - name: Create wallpaper directory
      ansible.windows.win_file:
        path: 'C:\Windows\Web\Wallpaper\ExampleMusic'
        state: directory
      tags: wallpaper

    - name: Push corporate wallpaper
      ansible.windows.win_copy:
        src:  ExampleMusicWallpaper.png
        dest: "{{ exa_wallpaper_dest }}"
      register: wallpaper_download
      tags: wallpaper

    - name: Push corporate wallpaper (.bmp copy, for SetWallpaper.exe)
      ansible.windows.win_copy:
        src:  ExampleMusicWallpaper.bmp
        dest: "{{ exa_wallpaper_dest_bmp }}"
      tags: wallpaper

    - name: Set wallpaper via PersonalizationCSP (applies to all users)
      ansible.windows.win_regedit:
        path: 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\PersonalizationCSP'
        name: "{{ item.name }}"
        data: "{{ item.data }}"
        type: "{{ item.type }}"
      loop:
        - { name: DesktopImagePath,   data: "{{ exa_wallpaper_dest }}", type: string }
        - { name: DesktopImageUrl,    data: "{{ exa_wallpaper_dest }}", type: string }
        - { name: DesktopImageStatus, data: 1,                          type: dword  }
      loop_control:
        label: "{{ item.name }}"
      tags: wallpaper

    - name: Lock wallpaper via policy
      ansible.windows.win_regedit:
        path: 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\System'
        name: "{{ item.name }}"
        data: "{{ item.data }}"
        type: "{{ item.type }}"
      loop:
        - { name: Wallpaper,      data: "{{ exa_wallpaper_dest }}", type: string }
        - { name: WallpaperStyle, data: "10",                       type: string }
      loop_control:
        label: "{{ item.name }}"
      tags: wallpaper

    - name: Disable themes tab (prevent user override in UI)
      ansible.windows.win_regedit:
        path: 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Policies\Explorer'
        name: NoThemesTab
        data: 1
        type: dword
      tags: wallpaper

    - name: Apply wallpaper change (broadcast WM_SETTINGCHANGE)
      ansible.windows.win_shell: |
        RUNDLL32.EXE user32.dll,UpdatePerUserSystemParameters ,1 ,True
      changed_when: false
      when: wallpaper_download is changed
      tags: wallpaper

    - name: Queue SetWallpaper.exe for next interactive logon
      # RunOnce, not run directly -- same reasoning as setres.exe in
      # 85-finish.yml: no attached interactive display over this SSH/WinRM
      # session for the tool to act on. Only queued when the wallpaper
      # actually changed this run, not on every routine re-apply.
      ansible.windows.win_regedit:
        path: 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce'
        name: ExaSetWallpaper
        data: 'C:\Windows\SetWallpaper.exe /D:S {{ exa_wallpaper_dest_bmp }}'
        type: string
      when: wallpaper_download is changed
      tags: wallpaper

    - name: Include dark mode tasks
      include_tasks: ../tasks/dark_mode.yml
      tags: wallpaper
