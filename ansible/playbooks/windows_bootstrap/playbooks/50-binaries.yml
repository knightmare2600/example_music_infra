---
# =============================================================================
# playbooks/50-binaries.yml
# Example Music Limited — Arch-aware binary deployment
# =============================================================================
# Pushes binaries from files/<arch>/ directly via win_copy and deploys
# them to C:\Windows\ (globally on PATH).
#
# Arch detection maps ansible_architecture to the folder convention used
# by detect_cpu.ps1 and detect_cpu.cmd:
#   AMD64  -> x86_64
#   ARM64  -> arm64
#   32-bit -> x86
#
# binaries_common (group_vars/windows) applies to all hosts.
# binaries_extra  (group_vars/windows_server/desktop/laptop) is host-type
# specific. Each entry in binaries_extra specifies src_amd64 and src_arm64
# separately since filenames are not consistent across arches.
# binaries_flat   (group_vars/windows) is for single-build tools with no
# genuine ARM64 variant available upstream at all — no arch subfolder,
# same pattern as ExampleMusicWallpaper.png in 60-wallpaper.yml.
#
# Usage:
#   ansible-playbook -i configs/inventory playbooks/windows_bootstrap/playbooks/50-binaries.yml
#
# Tags: binaries, fonts
# =============================================================================
# Changelog:
#   2026-07-20  Added binaries_flat + its deploy task -- bginfo.exe/FileHash.exe/
#               dosdev.exe/DelProf2.exe, ported over while reviewing a dropped-in
#               reference Salt state. None of the four have a genuine ARM64
#               build upstream (checked directly, not assumed) so they don't
#               fit binaries_extra's arch-pair mechanism --
#               FileHash specifically had a 64-bit/32-bit choice in the Salt
#               state (env-driven, not arch-driven); took the 64-bit build only,
#               dropped the 32-bit variant and the env-based selection logic,
#               since every real Windows box in this estate is 64-bit anyway.
#   2026-06-20  Initial file
#   2026-07-06  Fonts now come from tasks/fonts.yml (upstream nerd-fonts GH
#               release zip) instead of individual files from the internal
#               asset server, which doesn't actually host them. Shared with
#               tasks/ps7_setup.yml, which had the same logic duplicated.
#               dua.exe removed from binaries_common (group_vars/windows) —
#               added tasks/dua_cli.yml instead, an arch-aware upstream
#               GitHub release download, since dua-cli ships as a zip per
#               platform rather than a bare exe the asset server could host.
#   2026-07-08  win_get_url (exa_asset_base, an HTTP fetch from the
#               provisioning server) replaced with win_copy from files/ —
#               that pattern only existed for the pre-Ansible bootstrap
#               scripts. See files/README.md for what needs to be dropped
#               in before running this playbook.
# =============================================================================

- name: Windows — Binary and font deployment
  hosts: "{{ target | default('all') }}"
  gather_facts: true
  tasks:

    # ── Arch detection ────────────────────────────────────────────────────────

    - name: Include arch facts
      include_tasks: ../tasks/arch_facts.yml
      tags: [binaries, fonts]

    # ── Common binaries (same filename across arches) ─────────────────────────

    - name: Create C:\Windows if missing (safety)
      ansible.windows.win_file:
        path: C:\Windows
        state: directory
      tags: binaries

    - name: Deploy common binaries
      ansible.windows.win_copy:
        src:  "{{ host_arch }}/{{ item.src }}"
        dest: "C:\\Windows\\{{ item.dest }}"
      loop: "{{ binaries_common | default([]) }}"
      loop_control:
        label: "{{ item.dest }}"
      tags: binaries

    - name: Include dua-cli deployment tasks
      include_tasks: ../tasks/dua_cli.yml
      tags: binaries

    # ── Flat binaries (single build, no arch subfolder at all) ─────────────────

    - name: Deploy flat (arch-agnostic) binaries
      ansible.windows.win_copy:
        src:  "{{ item.src }}"
        dest: "C:\\Windows\\{{ item.dest }}"
      loop: "{{ binaries_flat | default([]) }}"
      loop_control:
        label: "{{ item.dest }}"
      tags: binaries

    # ── Host-type-specific binaries (arch-aware, different filenames) ─────────

    - name: Deploy arch-specific binaries (AMD64)
      ansible.windows.win_copy:
        src:  "x86_64/{{ item.src_amd64 }}"
        dest: "C:\\Windows\\{{ item.dest }}"
      loop: "{{ binaries_extra | default([]) }}"
      loop_control:
        label: "{{ item.dest }}"
      when:
        - binaries_extra is defined
        - host_arch == 'x86_64'
      tags: binaries

    - name: Deploy arch-specific binaries (ARM64)
      ansible.windows.win_copy:
        src:  "arm64/{{ item.src_arm64 }}"
        dest: "C:\\Windows\\{{ item.dest }}"
      loop: "{{ binaries_extra | default([]) }}"
      loop_control:
        label: "{{ item.dest }}"
      when:
        - binaries_extra is defined
        - host_arch == 'arm64'
      tags: binaries

    # ── Fonts ─────────────────────────────────────────────────────────────────

    - name: Include font deployment tasks
      include_tasks: ../tasks/fonts.yml
      tags: fonts
