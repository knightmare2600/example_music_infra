---
# =============================================================================
# playbooks/70-hibernation.yml
# Example Music Limited — Power management (hibernation, pagefile, disk, SConfig)
# =============================================================================
# Applies the correct hibernation policy based on exa_hibernation_enabled
# from group_vars:
#   windows_server:  false  (disabled)
#   windows_desktop: false  (disabled)
#   windows_laptop:  true   (enabled)
#
# Also clears the pagefile at shutdown, disables hard disk spin-down, and
# (Server OS only) disables SConfig auto-launch at logon — same "power
# management" theme as hibernation, folded in here rather than a separate
# file.
#
# Join-DomainAndBootstrap.ps1 Stage 6 disables hibernation unconditionally.
# Run this playbook after bootstrap on LAP/SUR devices to re-enable it.
#
# Usage:
#   ansible-playbook -i configs/inventory playbooks/windows_bootstrap/playbooks/70-hibernation.yml
#
# Tags: hibernation
# =============================================================================
# Changelog:
#   2026-09-19  CRITICAL, found live (Robert, EXAANSFRD001 -- mid-EXADCSFRD001 build): this
#               play's hosts: line only checked {{ target | default('all') }} -- "target" is
#               never set anywhere in this chain; only site.yml's own documented
#               -e target_hosts=<ip> usage is. Every play past 00-preflight.yml (which already
#               correctly checks target_hosts first) silently ran against hosts: all -- the
#               entire estate, every OS/role -- on any site.yml run invoked exactly as
#               documented. Caught before real damage only because 15-locale-timezone.yml's
#               win_timezone module failed at resolution time before this play's own turn came
#               up; 20-registry.yml (registry hardening) would have run for real against every
#               Windows host in the estate otherwise. Fixed to
#               "{{ target_hosts | default(target | default('all')) }}", matching
#               00-preflight.yml's own already-correct pattern -- same fix applied identically
#               across all 19 affected playbooks in this directory (82-salt-minion.yml's
#               deliberate windows_nodes group targeting is unrelated and untouched).
#   2026-07-20  Added disk spin-down disable (powercfg /Change -disk-timeout-ac 0) --
#               ported from a dropped-in reference Salt state while reviewing it;
#               no existing task touched this setting and no conflict with
#               screenlock.yml (that's monitor-timeout only), unlike the
#               monitor/standby-timeout settings from the same source, which
#               were dropped for exactly that conflict.
#   2026-06-20  Initial file
#   2026-07-06  Folded in pagefile-at-shutdown and SConfig auto-launch
#               (Stage 6) — same power management theme as hibernation.
#               Added an inline OS-type check for the SConfig task, which
#               is Server-only (is_server isn't otherwise available here —
#               this file doesn't run the full tasks/preflight.yml chain).
# =============================================================================

- name: Windows — Power management
  hosts:         "{{ target_hosts | default(target | default('all')) }}"
  gather_facts: false
  tasks:

    - name: Disable hibernation (servers and desktops)
      ansible.windows.win_shell: powercfg /hibernate off
      when: not (exa_hibernation_enabled | default(false) | bool)
      changed_when: true
      tags: hibernation

    - name: Enable hibernation (laptops and tablets)
      ansible.windows.win_shell: powercfg /hibernate on
      when: exa_hibernation_enabled | default(false) | bool
      changed_when: true
      tags: hibernation

    - name: Show hibernation state
      debug:
        msg: >
          Hibernation {{ 'ENABLED' if exa_hibernation_enabled | default(false) | bool else 'DISABLED' }}
          on {{ inventory_hostname }}
      tags: hibernation

    - name: Disable disk spin-down (all hosts)
      ansible.windows.win_shell: powercfg /Change -disk-timeout-ac 0
      changed_when: true
      tags: hibernation

    - name: Detect OS product type (1=Workstation 2=DC 3=Server)
      ansible.windows.win_shell: |
        (Get-WmiObject Win32_OperatingSystem).ProductType
      register: hibernation_product_type
      changed_when: false
      tags: hibernation

    - name: Set OS type fact
      set_fact:
        is_server: "{{ hibernation_product_type.stdout | trim in ['2', '3'] }}"
      tags: hibernation

    - name: Include power/pagefile tasks
      include_tasks: ../tasks/power_pagefile.yml
      tags: hibernation
