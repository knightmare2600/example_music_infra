---
# =============================================================================
# playbooks/85-finish.yml
# Example Music Limited — Bootstrap finish: summary + final reboot
# =============================================================================
# Prints a remote-access summary (SSH/RDP/SAC, domain/OU, first-DC warning,
# site/arch/hypervisor) and performs the final reboot. Ported from
# 05-bootstrap.yml's Stage 23, which had no standalone equivalent at all --
# the granular site.yml chain (00-preflight through 80-domainjoin) previously
# just ended after domain-join with no summary and no guaranteed final reboot.
#
# Needs facts set by earlier plays in the chain (all confirmed present by the
# time this runs, in a normal site.yml invocation):
#   target_hostname, is_first_dc  — 00-preflight.yml
#   host_ip, hypervisor           — 35-guest-tools.yml (site_detection.yml/
#                                    hypervisor detection tasks)
#   host_arch                     — 50-binaries.yml (tasks/arch_facts.yml)
#   host_site                     — tasks/hostname_facts.yml
#   is_server                     — tasks/preflight.yml
#   domain_ou_path                — 80-domainjoin.yml (only set if this run
#                                    actually joined the domain; falls back to
#                                    "already joined" otherwise, same as
#                                    05-bootstrap.yml's Stage 23 did -- except
#                                    for a first-DC build, which falls back to
#                                    "not yet built -- first-DC" instead (found
#                                    live, Robert, EXADCSGOT001: showing
#                                    "already joined" right next to the
#                                    separate "domain NOT joined" banner below
#                                    was self-contradictory -- a first-DC build
#                                    was never actually joined to anything,
#                                    it's building the forest, so the same
#                                    genuinely-idempotent-rerun fallback text
#                                    was wrong for this specific case)
#   sac_sol_verify_needed          — 78-sac-ems.yml (tasks/sac_ems.yml, Server
#                                    OS only; absent/false on workstations —
#                                    defaulted, not required)
# Running this file standalone (outside site.yml) will show these as blank/
# undefined unless the earlier plays already ran against the same host in a
# prior session — this file assumes it's the last stage of a full run.
#
# NOT ported: Stage 23's "run 70-hibernation.yml separately on LAP/SUR
# devices" note. That was a workaround for 05-bootstrap.yml's monolith, which
# historically didn't handle hibernation policy correctly for all device
# roles. The granular chain's own 70-hibernation.yml already runs earlier as
# a normal stage of site.yml (role-aware, via exa_hibernation_enabled) -- by
# the time this file runs, hibernation is already correctly set, no follow-up
# needed.
#
# Usage:
#   ansible-playbook -i configs/inventory playbooks/windows_bootstrap/playbooks/85-finish.yml
#
# Tags: finish
# =============================================================================
# Changelog:
#   2026-10-10  Cosmetic only, real live incident, same EXADCSCLD001 build: "Remote access
#               summary" still printed "!! FIRST-DC BUILD — domain NOT joined !!" gated
#               purely on is_first_dc, the exact same per-site/per-forest conflation already
#               fixed for real in 00-preflight.yml/80-domainjoin.yml this same day -- a real
#               DC was reachable (GOT), the join actually ran and succeeded, but the summary
#               still claimed it hadn't. No when: gate was affected (purely misleading text),
#               but fixed properly anyway: added a direct, fresh domain-join check
#               (Get-WmiObject Win32_ComputerSystem).PartOfDomain) right before the summary,
#               and the warning line now distinguishes a genuine forest-root build
#               (_dj_genuine_forest_root, nothing to join yet) from an actual failed join
#               (domain not joined and NOT genuine-forest-root) instead of conflating them.
#               Verified all three branches (joined / genuine forest-root / genuinely failed)
#               in an isolated test harness before shipping.
#   2026-10-10  Cosmetic only, Robert, live output (EXADCSCLD001): "Remote access summary"'s
#               conditional FIRST-DC-BUILD warning line was missing the single leading space
#               every other content line in this banner has, so it sat one column further
#               left than everything else. Added it.
#   2026-09-27  Robert's ask, live (EXADCSGOT001): the pending-reboot check's own
#               output line always shows "no change" (changed_when: false, correctly --
#               it's read-only), which told the operator nothing about which way the
#               check actually came out, and looked confusingly like "no reboot needed"
#               when a genuine reboot then fired right after it. Added an explicit
#               "[Finish] Report pending-reboot check result" debug line stating the
#               real result in plain words before either branch fires. No change to the
#               decision logic itself -- same three registry locations, same when:
#               conditions.
#   2026-09-19  CRITICAL, found live (Robert, EXAANSFRD001 -- mid-EXADCSFRD001 build): this
#               play's hosts: line only checked {{ target | default('all') }} -- "target" is
#               never set anywhere in this chain; only site.yml's own documented
#               -e target_hosts=<ip> usage is. Every play past 00-preflight.yml (which already
#               correctly checks target_hosts first) silently ran against hosts: all -- the
#               entire estate, every OS/role -- on any site.yml run invoked exactly as
#               documented. Caught before real damage only because 15-locale-timezone.yml's
#               win_timezone module failed at resolution time before this play's own turn came
#               up; 20-registry.yml (registry hardening) would have run for real against every
#               Windows host in the estate otherwise. Fixed to
#               "{{ target_hosts | default(target | default('all')) }}", matching
#               00-preflight.yml's own already-correct pattern -- same fix applied identically
#               across all 19 affected playbooks in this directory (82-salt-minion.yml's
#               deliberate windows_nodes group targeting is unrelated and untouched).
#   2026-07-16  Robert, live against EXADCSCLD001, again: setres.exe still failed even with
#               correct syntax -- "The settings passed in could not be applied to the graphics
#               device." Root cause: no attached interactive display session exists over an
#               SSH/Ansible connection for the graphics device to apply a mode change against --
#               syntax was never the remaining problem. Replaced the direct win_shell invocation
#               with a HKLM RunOnce registry entry instead: the same setres.exe command now fires
#               automatically at the next interactive logon (console/RDP), where an actual display
#               session exists for it to act on. Per Robert's own instruction: don't force an
#               unconditional reboot just to trigger this -- RunOnce fires at the next interactive
#               logon regardless of whether this run's own conditional reboot below actually
#               happens, so it needs no changes here.
#   2026-07-15  Robert, live against EXADCSCLD001: "[Finish] Set screen resolution" failed
#               the whole run with a non-zero return code. setres.exe is a Windows built-in
#               (confirmed by Robert directly -- not something this repo needs to deploy, an
#               earlier version of this note wrongly assumed otherwise and was corrected).
#               Real bug (partial fix, superseded by the entry above): wrong command syntax --
#               was "-w 1280 -h 800" with no "-f" flag; corrected to "-w 1280 -h 960 -f", matching
#               what the task's own name always said (1280x960) -- fixed the syntax but not the
#               actual failure, which turned out to be unrelated (see 2026-07-16 above).
#   2026-07-14  Added "[Finish] SAC/EMS verification note" — Robert, live against
#               EXADCSCLD001: the old SAC/EMS pause: task (tasks/sac_ems.yml) blocked
#               the entire playbook run mid-chain waiting on operator confirmation,
#               every run. He understands why SAC needs a manual SOL check but wanted
#               it surfaced once, at the very end, not as a hard stop partway through.
#               Moved the same verification text here, gated on the new
#               sac_sol_verify_needed fact (set by tasks/sac_ems.yml, Server OS only) —
#               prints as an informational note in the final summary instead of
#               blocking anything.
#   2026-07-12  Final reboot made conditional on Windows actually reporting a
#               pending reboot (idempotency audit, [[project_ad_onboarding_audit]]
#               found it unconditional -- directly contradicted site.yml's own
#               claim that a full rerun "converges any host to the same
#               known-good state," since it force-rebooted an
#               already-converged host every time). See the task's own
#               comment for why an OS-level pending-reboot check was used
#               instead of hand-tracking every earlier task's changed status.
#   2026-07-09  Initial file — ported from 05-bootstrap.yml Stage 23. This was
#               a genuine gap, not a stylistic one: site.yml's chain had no
#               final summary or guaranteed reboot at all before this.
# =============================================================================

- name: Windows — Bootstrap finish (summary + reboot)
  hosts:         "{{ target_hosts | default(target | default('all')) }}"
  gather_facts: false
  tasks:

    - name: "── Finish ──"
      debug:
        msg: "Bootstrap complete. Printing summary..."
      tags: finish

    # 2026-10-10, real live incident (EXADCSCLD001): the warning line below used to gate
    # purely on is_first_dc (a per-SITE vars_prompt answer), the same conflation already
    # fixed for real in 00-preflight.yml/80-domainjoin.yml -- is_first_dc=true does NOT mean
    # "domain not joined" the moment a real DC is reachable elsewhere (80-domainjoin.yml's own
    # _dj_genuine_forest_root already attempts the join in that case, and it can genuinely
    # succeed, as it did here). This was purely cosmetic (no when: gate was affected, just
    # misleading summary text) but worth fixing properly -- checking the box's OWN actual
    # current domain-membership state directly, not a stale per-site flag from an earlier
    # play. Matches the standing "verify the actual effect, not a proxy for it" principle.
    - name: "[Finish] Check current domain-join state (for the summary banner below)"
      ansible.windows.win_shell: |
        (Get-WmiObject Win32_ComputerSystem).PartOfDomain
      register: _finish_domain_check
      changed_when: false
      tags: finish

    - name: "[Finish] Remote access summary"
      vars:
        _finish_domain_joined: "{{ _finish_domain_check.stdout | trim | lower == 'true' }}"
      debug:
        msg:
          - "══════════════════════════════════════════════════════════"
          - " Bootstrap complete: {{ target_hostname | upper }}"
          - "══════════════════════════════════════════════════════════"
          - " SSH   : ssh Administrator@{{ host_ip }} (port 22)"
          - " RDP   : {{ host_ip }}:3389"
          - " SAC   : {{ 'Enabled on COM1/115200 (SOL)' if is_server else 'N/A (not a server OS)' }}"
          - " Domain: {{ exa_domain }} / OU: {{ domain_ou_path | default('already joined') if _finish_domain_joined else domain_ou_path | default('not yet built — forest root') }}"
          - >-
            {{ ' !! FOREST-ROOT BUILD — domain NOT joined (none exists yet). Run windows_dc/site.yml next !!'
               if (not _finish_domain_joined) and (_dj_genuine_forest_root | default(false) | bool)
               else (' !! Domain NOT joined — the join did not succeed this run. Check the Join domain task output above !!'
               if not _finish_domain_joined else '') }}
          - " Site  : {{ host_site }}"
          - " Arch  : {{ host_arch }}"
          - " Hyper : {{ hypervisor }}"
          - "══════════════════════════════════════════════════════════"
      tags: finish

    - name: "[Finish] SAC/EMS verification note"
      debug:
        msg:
          - "── SAC/EMS Configured ────────────────────────────────────────────────"
          - "EMS enabled on COM1 at 115200 8N1."
          - "Requires a serial0 socket in the Proxmox VM config."
          - ""
          - "Verify via SOL:"
          - "  ipmitool -I lanplus -H <pve-ip> -U admin -P <pass> sol activate"
          - ""
          - "You should see the SAC prompt after next reboot."
      when: sac_sol_verify_needed | default(false) | bool
      tags: finish

    - name: "[Finish] Queue screen resolution change for next interactive logon"
      # setres.exe can't apply a mode change over this SSH session -- no attached interactive
      # display for the graphics device to act on (see 2026-07-16 changelog entry). RunOnce
      # fires the same command at the next real console/RDP logon instead, where a display
      # session actually exists.
      ansible.windows.win_regedit:
        path: 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\RunOnce'
        name: ExaSetRes
        data: 'setres.exe -w 1280 -h 960 -f'
        type: string
      tags: finish

    - name: "[Finish] Check whether Windows is actually reporting a pending reboot"
      # Robert: "we only need to reboot if the IP or hostname changes... presumably if those
      # tasks don't require changes we don't need a reboot?" -- correct, and it generalises:
      # 00-preflight.yml/35-guest-tools.yml/80-domainjoin.yml already each perform
      # their OWN individually-gated reboot (on hostname/IP change, VMware tools install, domain
      # join respectively -- idempotency audit, [[project_ad_onboarding_audit]]), so by the time
      # this file runs (last of the chain), any of THOSE has already happened and cleared.
      # (10-rename.yml also has its own gated reboot, but is no longer part of this chain as of
      # 2026-07-14 -- 00-preflight.yml's own Phase G does the rename now, see that file's
      # changelog.) This file's
      # own reboot was unconditional regardless, meaning a routine rerun against an
      # already-converged host was forced to reboot anyway, every time, for nothing.
      #
      # Rather than hand-track every one of the other ~15 tasks across this chain that might
      # also need a reboot (registry policy, SMB1 feature toggle, RSAT, hibernation, etc.) --
      # fragile, easy to miss one -- ask Windows itself, via the same three registry locations
      # Windows's own servicing stack uses to track a genuinely pending reboot: Component Based
      # Servicing, Windows Update, and pending file-rename operations (covers most
      # installer-driven reboot flags, including some Chocolatey packages).
      ansible.windows.win_shell: |
        $pending = $false
        if (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\Component Based Servicing\RebootPending') { $pending = $true }
        if (Test-Path 'HKLM:\SOFTWARE\Microsoft\Windows\CurrentVersion\WindowsUpdate\Auto Update\RebootRequired') { $pending = $true }
        if (Get-ItemProperty -Path 'HKLM:\SYSTEM\CurrentControlSet\Control\Session Manager' -Name PendingFileRenameOperations -ErrorAction SilentlyContinue) { $pending = $true }
        Write-Output $pending
      register: _finish_reboot_pending
      changed_when: false
      tags: finish

    # 2026-09-27, Robert's ask: the check task above always shows "no change" (it's
    # read-only, changed_when: false), which tells the operator nothing about which
    # way it actually came out -- easy to misread "no change" as "no reboot needed"
    # when what it actually means is "this check didn't modify anything." Added this
    # explicit line so the real result is stated in plain words, before either branch
    # below fires -- no change to the decision logic itself (still exactly the same
    # three registry locations, still the same when: conditions further down).
    - name: "[Finish] Report pending-reboot check result"
      debug:
        msg: >-
          Windows {{ 'DOES' if (_finish_reboot_pending.stdout | trim == 'True') else 'does NOT' }}
          report a pending reboot (checked: Component Based Servicing RebootPending,
          Windows Update RebootRequired, PendingFileRenameOperations).
      tags: finish

    - name: "[Finish] Final reboot (only if Windows is actually reporting one pending)"
      ansible.windows.win_reboot:
        reboot_timeout:    600
        post_reboot_delay: 30
        msg:               "Ansible bootstrap complete — final reboot"
      when: _finish_reboot_pending.stdout | trim == 'True'
      tags: finish

    - name: "[Finish] No reboot needed"
      debug:
        msg: "No pending reboot detected -- skipping (either nothing changed this run, or whatever did doesn't require one)."
      when: _finish_reboot_pending.stdout | trim != 'True'
      tags: finish

    # 2026-09-26, Robert's ask: "I want every playbook to update that JSON
    # field" (nodeinfo.json's last_ansible_run) -- windows_bootstrap never
    # wrote nodeinfo.json at all before this, despite being the single most
    # significant Windows playbook family (fresh-box setup). See
    # ansible/tasks/nodeinfo_windows.yml's own header for the shared
    # implementation this now uses.
    #
    # block/rescue, not ignore_errors: on the include -- verified directly
    # (a standalone repro) that ignore_errors: true on an include_tasks:
    # line does NOT propagate into the included file's own tasks the way it
    # does for a single module task; a real failure inside the include still
    # hard-failed the whole play in testing. block/rescue is the mechanism
    # that actually catches it. nodeinfo.json is an observability
    # convenience, never something worth failing a real bootstrap over.
    - name: "[Finish] Write nodeinfo.json (non-fatal)"
      # Both tags, not just `always` -- `finish` keeps it reachable by a deliberate
      # `--tags finish` run same as every other task in this block, `always` is what
      # actually guarantees it runs under ANY --tags filter. Confirmed empirically,
      # 2026-10-04: tagging only this block `finish` (as it originally was) made the
      # nodeinfo write vanish entirely from `--list-tasks --tags ps7_setup` output, even
      # after tagging every task inside tasks/nodeinfo_windows.yml itself `always` --
      # `always` on a child task doesn't override a non-matching tag on its own parent
      # block, it has to be on the block (or include) actually gating entry into it too.
      tags: [finish, always]
      block:
        - name: "[Finish] Write nodeinfo.json"
          include_tasks: ../../../tasks/nodeinfo_windows.yml
          vars:
            nodeinfo_bootstrapped_by: "windows_bootstrap/site.yml"
            nodeinfo_repo_root: "{{ playbook_dir }}/../../../.."
      rescue:
        - name: "[Finish] WARNING — nodeinfo.json write failed, continuing anyway"
          debug:
            msg: >-
              nodeinfo.json write failed ({{ ansible_failed_result.msg | default('see task output above') }}) --
              non-fatal, nodeinfo.json is an observability convenience, not required for the bootstrap itself.
