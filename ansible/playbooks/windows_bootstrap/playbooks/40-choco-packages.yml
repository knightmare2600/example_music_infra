---
# =============================================================================
# playbooks/40-choco-packages.yml
# Example Music Limited — Chocolatey package deployment
# =============================================================================
# Installs choco_packages_common (all hosts) + choco_packages_extra
# (server-role only) + choco_packages_gui (Client OS, or Server OS with
# Desktop Experience — skipped on Server Core). Safe to re-run — choco
# install is idempotent when packages are already present.
#
# DESIGN NOTE: This file is part of the windows_bootstrap chain, which by
# design runs against a freshly PXE/WDS-built Windows host on its DHCP
# address — the host has NO presence in any Ansible inventory file and
# therefore NEVER picks up group_vars/windows*/. Every var this file needs
# must be self-contained here (vars: block) or derived from facts already
# established earlier in the chain (host_role, parsed in hostname_facts.yml).
# Do not move these back to group_vars — that was the 2026-06-30 regression
# this file fixes.
#
# Once the chain completes and the host is later added to a real inventory
# file for ongoing management, group_vars/windows*/ become relevant for
# OTHER playbooks run against it at that point — this file specifically
# remains self-contained since it only ever runs once, during bootstrap.
#
# Usage:
#   ansible-playbook -i 192.168.x.x, playbooks/windows_bootstrap/playbooks/40-choco-packages.yml \
#     -e "target_hosts=192.168.x.x"
#   (normally reached via site.yml as part of the full bootstrap chain)
#
# Tags: choco_packages
# =============================================================================
# Changelog:
#   2026-08-14  Robert, live (EXADCSLAX001, same run as 30-chocolatey.yml's
#               identical fix that same day): "Get currently installed
#               Chocolatey packages" failed with "choco : The term 'choco' is
#               not recognized" -- proof Ansible's winrm connection plugin
#               reuses one shell across the WHOLE ansible-playbook run, not
#               just within one play as 30-chocolatey.yml's own fix comment
#               assumed. Chocolatey was installed several plays earlier in
#               this same run; this play's shell still hadn't picked up the
#               updated Machine PATH. Same fix: re-read PATH explicitly
#               before calling choco. Swept the rest of this file and the
#               whole windows_bootstrap chain for any other bare `choco`
#               shell call -- this was the only other one (the actual package
#               installs below use the chocolatey.chocolatey.win_chocolatey
#               module, not a bare shell call, so unaffected).
#   2026-08-10  Added winevdm to choco_packages_gui (Robert's ask -- 16-bit
#               Windows app compatibility layer, GUI tier since 16-bit
#               software needs a desktop, never installed on Server Core).
#               Verified as a real, current Chocolatey package (0.8.1 on the
#               community feed) before adding.
#   2026-07-12  Moved nmap from the role-gated choco_packages_server list to
#               choco_packages_common (matching the 2026-07-06 precedent of
#               doing exactly this for putty/winscp: "role split was
#               pointless"). Robert's own framing: it's a CLI diagnostic tool,
#               not something that needs role-based gating. Also fixes a real,
#               separate bug this surfaced (idempotency audit,
#               [[project_ad_onboarding_audit]]): host_role, which the old
#               role-gate read, is never actually set by this point in the
#               chain -- 00-preflight.yml computes its own differently-named
#               host_role_code, and the real host_role only gets set by
#               tasks/hostname_facts.yml, which nothing calls until
#               80-domainjoin.yml (position 18, nine files later). Confirmed
#               via grep, not just the audit's own claim. nmap silently never
#               installed on any SRV/DCS host, on any run, since this file's
#               role logic was written. Removed the whole role-gating
#               mechanism (choco_packages_server/choco_packages_extra, the
#               "Determine role-specific package set" task, the "Install
#               role-specific" task) rather than just fixing the timing --
#               with nmap moved to common, nothing needs it any more.
#   2026-06-20  Initial file
#   2026-06-30  Fixed: choco_packages_common / choco_packages_extra /
#               exa_choco_source were previously expected to come from
#               group_vars/windows*/, which a bare-IP bootstrap run never
#               loads (host is not in inventory, not in any group). This
#               caused "choco_packages_common is undefined" failures on
#               every real bootstrap run. Moved all three to a play-level
#               vars: block, self-contained in this file. Package selection
#               by host type now keys off host_role (DCS/SRV/WKS/LAP/SUR),
#               which is already a fact by this point in the chain via
#               tasks/hostname_facts.yml. Also fixed hosts: to use
#               target_hosts (what 00-preflight.yml and the live invocation
#               actually pass) instead of target, which was never being set
#               and was silently falling back to 'all'.
#   2026-07-06  Added rustdesk, wget, busybox — these were previously
#               fetched as raw binaries from the internal asset server
#               (192.168.139.50), which doesn't actually host them; all
#               three have Chocolatey packages, so installing via choco
#               here (this file's own package list, per the self-contained
#               design note above) replaces that entirely.
#   2026-07-06  Unified choco_packages_common/_server/_desktop with
#               05-bootstrap.yml — the two files had independently drifted
#               to different package sets (this file scoped sysinternals to
#               server-only and windirstat to desktop-only and gave every
#               role its own putty/winscp; 05-bootstrap.yml installed
#               sysinternals/windirstat on every host and had no
#               role-specific extras at all), so a host's actual package
#               set depended on which of the two paths provisioned it.
#               Also standardised naming on ".install" where a package has
#               both a bare and a ".install" Chocolatey ID (7zip,
#               notepadplusplus, putty, winscp, rustdesk) — these are
#               different install mechanisms, not just a naming choice.
#               Moved putty/winscp to choco_packages_common (both roles had
#               them identically, so the role split was pointless) and
#               added the packages this file was missing entirely (edit,
#               far, hyper, powershell-core, sdelete, windows-terminal).
#   2026-07-06  Replaced choco_packages_desktop (role-based: WKS/LAP/SUR
#               only) with choco_packages_gui, gated on a detected has_gui
#               fact instead of host role. googlechrome/firefox/vlc/
#               windows-terminal are GUI-dependent apps, not "desktop-role"
#               apps — a Windows Server host with Desktop Experience
#               installed (not Server Core) should get them too, which the
#               old role-based split never allowed. has_gui comes from
#               HKLM:\...\CurrentVersion InstallationType (Client/Server/
#               Server Core) — Server Core is the only case without a GUI
#               shell. choco_packages_common is unaffected (windirstat and
#               hyper are confirmed to run fine on Server Core).
#   2026-07-09  Fixed hosts: back to target-only (matching every other
#               numbered play except 00-preflight.yml itself). 00-preflight.yml
#               now dynamically registers the host into its permanent
#               inventory group via add_host once it knows the final IP/
#               hostname, so target_hosts=<ip> (a fixed extra-var for the
#               whole run) is only needed for 00-preflight.yml's own first
#               connection, before that registration exists. Prioritising
#               target_hosts here meant this specific play kept targeting the
#               raw IP directly all run, bypassing the new registration and
#               its group_vars entirely -- the self-contained vars: block
#               below happened to paper over that (nothing here reads
#               group_vars anyway), but it's no longer the reason this file
#               needs its own copy of these lists; group_vars/windows/vars.yml
#               would now resolve correctly too. Left self-contained for now
#               rather than bundle a de-duplication pass into this fix.
#   2026-07-14  Removed nmap. Live against EXADCSCLD001: `choco install nmap` hung
#               indefinitely (nmap-7.99-setup running 11+ minutes, no window
#               title, choco.exe blocked waiting on it). Root cause is upstream,
#               not fixable from this playbook: the nmap Chocolatey package
#               drives its bundled Npcap installer via an AutoHotkey script that
#               simulates GUI clicks (chocolatey-community/chocolatey-packages
#               issue #1823) -- there is no interactive window station for that
#               automation to click into over a non-interactive SSH session, so
#               it hangs forever rather than failing. The underlying `npcap`
#               package's actual current --package-parameters support couldn't
#               be verified (chocolatey.org blocks scripted fetches from this
#               sandbox), so no pre-install-npcap workaround was attempted
#               against a live forest-root DC build. Robert's call: drop nmap
#               from automated onboarding entirely rather than leave a
#               known-hang in the chain -- install manually (interactively, via
#               RDP/console) on any host that specifically needs it.
#   2026-07-14  Robert, live against EXADCSCLD001 (already fully choco-provisioned
#               from an earlier run): win_chocolatey with state: present is
#               idempotent in the sense that it never reinstalls an already-present
#               package, but looped per-item it still spawns a real choco.exe
#               process per package to check -- 21 processes even when every
#               single one is a no-op. Added a single, fast, local `choco list
#               --limit-output` query up front (pipe-delimited packageId|version,
#               local-only by default on this Chocolatey version -- no network
#               call, confirmed against Robert's own pasted `choco list` output
#               showing purely local results already) and filter both package
#               lists down to only what's actually missing before looping --
#               same end state, same idempotency guarantee, just one process
#               instead of N+1 when nothing needs to change. Not independently
#               tested against a live Windows host from this sandbox (no choco
#               available here) -- Robert confirming live.
# =============================================================================

- name: Windows — Chocolatey package deployment
  hosts: "{{ target | default('all') }}"
  gather_facts: false

  vars:
    exa_choco_source: "https://community.chocolatey.org/api/v2/"

    # Installed on every host regardless of role. Self-contained per the
    # design note above (05-bootstrap.yml, which used to carry a second,
    # kept-in-sync-by-hand copy of this list, was retired 2026-07-09 — this
    # is now the only copy).
    choco_packages_common:
      - 7zip.install
      - notepadplusplus.install
      - powershell-core
      - hyper
      - far
      - edit
      - sdelete
      - putty.install
      - winscp.install
      - rustdesk.install
      - wget
      - busybox
      - vcredist-all
      - dotnetfx
      - sysinternals
      - windirstat

    # GUI-dependent (browsers etc.) — installed on Client OS always, and on
    # Server OS only if Desktop Experience is installed (not Server Core).
    # See has_gui fact below.
    choco_packages_gui:
      - googlechrome
      - firefox
      - vlc
      - windows-terminal
      - winevdm

  tasks:

    - name: Detect Windows installation type (Client / Server / Server Core)
      ansible.windows.win_shell: |
        (Get-ItemProperty 'HKLM:\SOFTWARE\Microsoft\Windows NT\CurrentVersion').InstallationType
      register: installation_type_check
      changed_when: false
      tags: choco_packages

    - name: Set has_gui fact
      set_fact:
        has_gui: "{{ installation_type_check.stdout | trim != 'Server Core' }}"
      tags: choco_packages

    - name: Get currently installed Chocolatey packages (single local, no-network call)
      ansible.windows.win_shell: |
        $env:Path = [System.Environment]::GetEnvironmentVariable("Path", "Machine") + ";" + [System.Environment]::GetEnvironmentVariable("Path", "User")
        choco list --limit-output
      register: choco_installed_raw
      changed_when: false
      tags: choco_packages

    - name: Set installed_choco_packages fact
      set_fact:
        # Each line is "packageId|version" (pipe-delimited, --limit-output) --
        # local-only by default on this Chocolatey version, no network round-trip.
        installed_choco_packages: >-
          {{ choco_installed_raw.stdout_lines
             | map('regex_replace', '\|.*$', '')
             | map('lower')
             | list }}
      tags: choco_packages

    - name: Set missing-package facts (only what actually needs installing)
      set_fact:
        choco_packages_common_missing: "{{ choco_packages_common | reject('in', installed_choco_packages) | list }}"
        choco_packages_gui_missing:    "{{ choco_packages_gui | reject('in', installed_choco_packages) | list }}"
      tags: choco_packages

    - name: Show package selection for this run
      debug:
        msg:
          - "Has GUI          : {{ has_gui }}"
          - "Already installed: {{ installed_choco_packages | length }} package(s)"
          - "Common — missing : {{ (choco_packages_common_missing | join(', ')) if choco_packages_common_missing | length > 0 else '(none — all already present)' }}"
          - "GUI — missing    : {{ (choco_packages_gui_missing | join(', ') if choco_packages_gui_missing | length > 0 else '(none — all already present)') if has_gui | bool else '(skipped — no GUI)' }}"
      tags: choco_packages

    - name: Install missing common Chocolatey packages
      chocolatey.chocolatey.win_chocolatey:
        name:   "{{ item }}"
        state:  present
        source: "{{ exa_choco_source }}"
      loop: "{{ choco_packages_common_missing }}"
      loop_control:
        label: "{{ item }}"
      tags: choco_packages

    - name: Install missing GUI Chocolatey packages (Client OS, or Server with Desktop Experience)
      chocolatey.chocolatey.win_chocolatey:
        name:   "{{ item }}"
        state:  present
        source: "{{ exa_choco_source }}"
      loop: "{{ choco_packages_gui_missing }}"
      loop_control:
        label: "{{ item }}"
      when: has_gui | bool
      tags: choco_packages

    - name: Upgrade all Chocolatey packages
      chocolatey.chocolatey.win_chocolatey:
        name:  all
        state: latest
      tags: [never, choco_upgrade]

