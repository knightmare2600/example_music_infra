---
# =============================================================================
# playbooks/25-deadvertise.yml
# Example Music Limited — Advertising & telemetry suppression
# =============================================================================
# Applies registry_deadvertise from group_vars/windows_desktop or
# windows_laptop. Skipped automatically on windows_server group
# (exa_deadvertise_enabled: false).
#
# Usage:
#   ansible-playbook -i configs/inventory playbooks/windows_bootstrap/playbooks/25-deadvertise.yml
#
# Tags: deadvertise
# =============================================================================
# Changelog:
#   2026-09-19  CRITICAL, found live (Robert, EXAANSFRD001 -- mid-EXADCSFRD001 build): this
#               play's hosts: line only checked {{ target | default('all') }} -- "target" is
#               never set anywhere in this chain; only site.yml's own documented
#               -e target_hosts=<ip> usage is. Every play past 00-preflight.yml (which already
#               correctly checks target_hosts first) silently ran against hosts: all -- the
#               entire estate, every OS/role -- on any site.yml run invoked exactly as
#               documented. Caught before real damage only because 15-locale-timezone.yml's
#               win_timezone module failed at resolution time before this play's own turn came
#               up; 20-registry.yml (registry hardening) would have run for real against every
#               Windows host in the estate otherwise. Fixed to
#               "{{ target_hosts | default(target | default('all')) }}", matching
#               00-preflight.yml's own already-correct pattern -- same fix applied identically
#               across all 19 affected playbooks in this directory (82-salt-minion.yml's
#               deliberate windows_nodes group targeting is unrelated and untouched).
#   2026-06-20  Initial file
# =============================================================================

- name: Windows — Advertising & telemetry suppression
  hosts:         "{{ target_hosts | default(target | default('all')) }}"
  gather_facts: false
  tasks:

    - name: Skip if not applicable for this host type
      debug:
        msg: "exa_deadvertise_enabled is false for {{ inventory_hostname }} — skipping."
      when: not (exa_deadvertise_enabled | default(false) | bool)

    - name: Apply deadvertise registry keys
      ansible.windows.win_regedit:
        path: "{{ item.path }}"
        name: "{{ item.name }}"
        data: "{{ item.data }}"
        type: "{{ item.type }}"
      loop: "{{ registry_deadvertise }}"
      loop_control:
        label: "{{ item.name }}"
      when: exa_deadvertise_enabled | default(false) | bool
      tags: deadvertise

    - name: Disable Windows Consumer Experience via policy
      ansible.windows.win_regedit:
        path: HKLM:\SOFTWARE\Policies\Microsoft\Windows\CloudContent
        name: DisableWindowsConsumerFeatures
        data: 1
        type: dword
      when: exa_deadvertise_enabled | default(false) | bool
      tags: deadvertise
