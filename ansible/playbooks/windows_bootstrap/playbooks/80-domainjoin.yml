---
# =============================================================================
# playbooks/80-domainjoin.yml
# Example Music Limited — Domain join
# =============================================================================
# Joins the host to the domain named in benarbejde/ad_forest.json (exa_domain --
# jukebox.internal by default). OU is derived from:
#   - domain_ou_role  (from group_vars — Workstations/Laptops/Servers/DomainControllers)
#   - host_site       (parsed from hostname via tasks/hostname_facts.yml)
#
# Resulting OU: OU=<role>,OU=<SITE>,<exa_domain as DC=...,DC=...>
#
# Domain join account: exa_domain_join_user (forest-level DA — valid across all
# child domains via forest trust). Stored in vault as vault_domain_join_password.
#
# The host reboots after joining. Ansible will wait and reconnect.
#
# NOTE on OU selection: this file computes domain_ou_path directly from
# group_vars (domain_ou_role + host_site) — no operator interaction needed,
# because by the time this standalone play is re-run, the host is already
# in inventory and its role/site are known. This is deliberately different
# from tasks/ou_selection.yml (used inline by 05-bootstrap.yml's Stage 4),
# which LDAP-queries a live DC and prompts the operator to pick an OU
# interactively — that's for the fresh-build case, where the host isn't in
# inventory yet and group_vars aren't available. Two different scenarios,
# two mechanisms; not folded into one on purpose.
#
# Usage:
#   ansible-playbook -i configs/inventory playbooks/windows_bootstrap/playbooks/80-domainjoin.yml \
#     --ask-vault-pass
#
# Tags: domainjoin
# =============================================================================
# Changelog:
#   2026-07-14  Robert, live against EXADCSCLD001: prompted twice mid-run for the same
#               decision -- once by 00-preflight.yml's automated Phase A4 DNS probe
#               (silent, no prompt, just decides), then again by this file's own
#               vars_prompt for dj_temp_dns_ip. Root cause: 00-preflight.yml's own
#               2026-07-03 changelog entry already says it "automated DNS decision --
#               remove hardcoded dns_server var and dj_temp_dns_ip prompt... dj_temp_dns_ip
#               is derived from dns_primary and passed forward to downstream plays as
#               before" -- Phase A4 (line ~334) sets dj_temp_dns_ip as a persisted host
#               fact. This file's own vars_prompt for the identical variable name was
#               never removed when that automation landed, so every chained run asked
#               the operator a question that had already been silently decided upstream
#               -- same bug class as 10-rename.yml's redundant hostname prompt, fixed
#               earlier this session. Replaced vars_prompt with a vars: entry that
#               defers to the already-set fact, falling back to the historical
#               192.168.139.8 default only when this file is run standalone (outside
#               the site.yml chain, where no such fact exists).
#   2026-07-14  Robert, live against EXADCSCLD001 (first-DC build, is_first_dc=yes): play
#               crashed at "[Stage 0] Check {{ exa_domain }} resolves" with a control-node
#               file-lookup error ("Unable to access /etc/example-music/ad_forest.json") --
#               exa_domain (group_vars/all/vars.yml) is templated from that file. Real bug:
#               the 2026-07-09 SAFETY FIX (see below) added is_first_dc awareness to the OU/
#               join tasks only -- Stage 0's five DNS pre-check tasks had no such gate at
#               all, so they ran (and needed exa_domain) unconditionally on every build,
#               including first-DC ones where there's no existing domain to resolve against
#               in the first place. Added `when: not is_first_dc` to all five, plus an
#               explicit "skipping" debug message matching the join section's existing
#               pattern. Also dropped {{ exa_domain }}/{{ dj_temp_dns_ip }} from the two
#               Check/Re-check task *names* -- names are lenient-templated (embed the error
#               as text rather than crashing) even when the task itself is correctly
#               skipped, so a first-DC run would otherwise still show a confusing inline
#               error string in the (skipped) task's display line. Separately, and NOT
#               fixed here: /etc/example-music/ad_forest.json genuinely doesn't exist on
#               this control node yet -- linux/tools.yml deploys it (2026-07-09) but hadn't
#               been (re-)run against EXAANSCLD001 since. Needed before windows_dc/site.yml
#               (which does need exa_domain for real) can run.
#   2026-06-20  Initial file
#   2026-07-06  Documented (no code change) why this file's static OU
#               derivation and tasks/ou_selection.yml's interactive LDAP
#               picker are intentionally separate rather than unified.
#   2026-07-09  Fixed domain_ou_path (line ~145): hardcoded "DC=jukebox,DC=internal"
#               even though exa_domain (used elsewhere in this same file for the
#               actual domain join) was already a variable -- silently diverged if
#               exa_domain ever changed. Now derives the DN from exa_domain via the
#               same DC=-join pattern windows_adschema/10-ad-schema.yml already
#               uses correctly. Also fixed two hardcoded Resolve-DnsName
#               "jukebox.internal" PowerShell calls (Stage 0) to use exa_domain.
#   2026-07-09  MUCH BIGGER FIX: hosts:/gather_facts:/vars_prompt were all commented
#               out (likely a leftover from some past debugging session, never
#               restored). This isn't just "runs against no hosts" -- a play missing
#               a required hosts: key fails Ansible's PARSER outright, at load time,
#               regardless of --tags. Since site.yml unconditionally import_playbooks
#               this file (line ~126), the *entire* windows_bootstrap/site.yml chain
#               could never even syntax-check, let alone run, until this was
#               restored. dj_temp_dns_ip (used throughout the DNS-override tasks)
#               was also undefined without the vars_prompt block that sets it.
#   2026-07-09  SAFETY FIX: this file had zero is_first_dc awareness -- a first-DC
#               (forest-creation) build would have blindly attempted
#               microsoft.ad.membership against a domain that doesn't exist yet.
#               05-bootstrap.yml's own Stage 5 (now retired, see its own removal
#               changelog note) explicitly skipped domain-join for is_first_dc
#               builds; this file never had the equivalent check, since it was
#               only ever exercised via the granular chain where that scenario
#               hadn't been hit yet. Added the same skip, with a message pointing
#               at windows_dc/site.yml as the next step, matching Stage 5's intent.
# =============================================================================

- name: Windows — Domain join
  hosts: "{{ target | default('all') }}"
  gather_facts: true
  vars:
    # 00-preflight.yml's Phase A4 already decides and persists this fact (as
    # dns_primary / dj_temp_dns_ip) for every host reached via the normal
    # site.yml chain -- see this file's 2026-07-14 changelog entry. The
    # default here only matters when this file is run standalone, outside
    # that chain, where no such fact exists yet.
    dj_temp_dns_ip: "{{ dj_temp_dns_ip | default('192.168.139.8') }}"

  tasks:

    # ── Stage 0: DNS resolution ────────────────────────────────────────────────
    # A fresh VM may have DHCP/ISP DNS that cannot resolve jukebox.internal.
    # Check first; only override if needed.  Windows updates NIC DNS itself
    # during the domain join so the temp entry doesn't need cleaning up.
    # Skipped entirely for first-DC builds — the domain doesn't exist yet, so
    # there's nothing to resolve, and exa_domain doesn't need to be resolvable
    # (its control-node file lookup may not even be available yet either).

    - name: "[Stage 0] Skip — first-DC build, nothing to resolve yet"
      debug:
        msg: >
          {{ inventory_hostname }} is a first-DC build (is_first_dc=true) — skipping the DNS
          pre-check, there's no existing domain to resolve against yet.
      when: is_first_dc | default(false) | bool
      tags: domainjoin

    - name: "[Stage 0] Check domain resolves"
      ansible.windows.win_shell: |
        try {
          Resolve-DnsName "{{ exa_domain }}" -ErrorAction Stop | Out-Null
          Write-Output "resolvable"
        } catch {
          Write-Output "unresolvable"
        }
      register: dj_dns_check
      changed_when: false
      when: not (is_first_dc | default(false) | bool)
      tags: domainjoin

    - name: "[Stage 0] Fail — domain unresolvable and no DNS override provided"
      ansible.builtin.fail:
        msg: >
          {{ exa_domain }} cannot be resolved and no DNS override IP was provided.
          Re-run with -e dj_temp_dns_ip=<ip> (e.g. 192.168.139.8) — this file no longer
          prompts for it; see 00-preflight.yml's Phase A4 DNS decision output.
      when:
        - not (is_first_dc | default(false) | bool)
        - dj_dns_check.stdout | trim == "unresolvable"
        - dj_temp_dns_ip | length == 0
      tags: domainjoin

    - name: "[Stage 0] Get default-route NIC alias"
      ansible.windows.win_shell: |
        (Get-NetRoute -DestinationPrefix '0.0.0.0/0' | Sort-Object RouteMetric |
         Select-Object -First 1).InterfaceAlias
      register: dj_nic_alias
      changed_when: false
      when:
        - not (is_first_dc | default(false) | bool)
        - dj_dns_check.stdout | trim == "unresolvable"
        - dj_temp_dns_ip | length > 0
      tags: domainjoin

    - name: "[Stage 0] Set temporary DNS to {{ dj_temp_dns_ip }}"
      ansible.windows.win_shell: |
        Set-DnsClientServerAddress `
          -InterfaceAlias "{{ dj_nic_alias.stdout | trim }}" `
          -ServerAddresses "{{ dj_temp_dns_ip }}"
      when:
        - not (is_first_dc | default(false) | bool)
        - dj_dns_check.stdout | trim == "unresolvable"
        - dj_temp_dns_ip | length > 0
      tags: domainjoin

    - name: "[Stage 0] Re-check domain after DNS override"
      ansible.windows.win_shell: |
        try {
          Resolve-DnsName "{{ exa_domain }}" -ErrorAction Stop | Out-Null
          Write-Output "resolvable"
        } catch {
          Write-Output "unresolvable"
        }
      register: dj_dns_recheck
      changed_when: false
      when:
        - not (is_first_dc | default(false) | bool)
        - dj_dns_check.stdout | trim == "unresolvable"
        - dj_temp_dns_ip | length > 0
      tags: domainjoin

    - name: "[Stage 0] Fail — domain still unresolvable after DNS override"
      ansible.builtin.fail:
        msg: >
          {{ exa_domain }} still cannot be resolved after setting DNS to {{ dj_temp_dns_ip }}.
          Verify that {{ dj_temp_dns_ip }} is reachable and serves {{ exa_domain }}.
      when:
        - not (is_first_dc | default(false) | bool)
        - dj_dns_recheck is defined
        - dj_dns_recheck.stdout | trim == "unresolvable"
      tags: domainjoin

    # ── Domain join ───────────────────────────────────────────────────────────

    - name: Include hostname facts
      include_tasks: ../../../tasks/hostname_facts.yml
      tags: domainjoin

    - name: Check if already domain-joined
      ansible.windows.win_shell: |
        (Get-WmiObject Win32_ComputerSystem).PartOfDomain
      register: domain_check
      changed_when: false
      tags: domainjoin

    - name: Skip if already domain-joined
      debug:
        msg: "{{ inventory_hostname }} is already domain-joined — skipping."
      when: domain_check.stdout | trim | lower == 'true'
      tags: domainjoin

    - name: Skip — first-DC build, domain doesn't exist yet
      debug:
        msg: >
          {{ inventory_hostname }} is a first-DC build (is_first_dc=true) — the domain doesn't
          exist yet, so there's nothing to join. Run windows_dc/site.yml next to create the
          forest; this host will then already be the DC, not something that joins it afterward.
      when:
        - domain_check.stdout | trim | lower != 'true'
        - is_first_dc | default(false) | bool
      tags: domainjoin

    - name: Build target OU path
      set_fact:
        domain_ou_path: "OU={{ domain_ou_role }},OU={{ host_site }},{{ 'DC=' + exa_domain.split('.') | join(',DC=') }}"
      when:
        - domain_check.stdout | trim | lower != 'true'
        - not (is_first_dc | default(false) | bool)
      tags: domainjoin

    - name: Show domain join target
      debug:
        msg: >
          Joining {{ inventory_hostname }} to {{ exa_domain }}
          OU: {{ domain_ou_path }}
      when:
        - domain_check.stdout | trim | lower != 'true'
        - not (is_first_dc | default(false) | bool)
      tags: domainjoin

    - name: Join domain
      microsoft.ad.membership:
        dns_domain_name:    "{{ exa_domain }}"
        domain_admin_user:  "{{ exa_domain_join_user }}"
        domain_admin_password: "{{ vault_domain_join_password }}"
        domain_ou_path:     "{{ domain_ou_path }}"
        state:              domain
        reboot:             false
      register: join_result
      when:
        - domain_check.stdout | trim | lower != 'true'
        - not (is_first_dc | default(false) | bool)
      tags: domainjoin

    - name: Reboot after domain join
      ansible.windows.win_reboot:
        reboot_timeout:    600
        post_reboot_delay: 60
        msg: "Rebooting after domain join"
      when:
        - join_result is defined
        - join_result.changed
      tags: domainjoin
