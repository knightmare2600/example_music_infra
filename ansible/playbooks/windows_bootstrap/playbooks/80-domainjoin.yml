---
# =============================================================================
# playbooks/80-domainjoin.yml
# Example Music Limited — Domain join
# =============================================================================
# Joins the host to the domain named in benarbejde/ad_forest.json (exa_domain --
# jukebox.internal by default). OU is derived from:
#   - domain_ou_role  (from group_vars — Workstations/Laptops/Servers/DomainControllers)
#   - host_site       (parsed from hostname via tasks/hostname_facts.yml)
#
# Resulting OU: OU=<role>,OU=<SITE>,<exa_domain as DC=...,DC=...>
#
# Domain join account: exa_domain_join_user (forest-level DA — valid across all
# child domains via forest trust). Stored in vault as vault_domain_join_password.
#
# The host reboots after joining. Ansible will wait and reconnect.
#
# NOTE on OU selection: this file computes domain_ou_path directly from
# group_vars (domain_ou_role + host_site) — no operator interaction needed,
# because by the time this standalone play is re-run, the host is already
# in inventory and its role/site are known. This is deliberately different
# from tasks/ou_selection.yml (used inline by 05-bootstrap.yml's Stage 4),
# which LDAP-queries a live DC and prompts the operator to pick an OU
# interactively — that's for the fresh-build case, where the host isn't in
# inventory yet and group_vars aren't available. Two different scenarios,
# two mechanisms; not folded into one on purpose.
#
# Usage:
#   ansible-playbook -i configs/inventory playbooks/windows_bootstrap/playbooks/80-domainjoin.yml \
#     --ask-vault-pass
#
# Tags: domainjoin
# =============================================================================
# Changelog:
#   2026-10-10  Third fix, same incident, same day (EXADCSCLD001): the join itself started
#               failing with "The system cannot find the file specified... Check
#               domain_ou_path" once the previous two fixes got far enough for a real join
#               attempt. group_vars/windows_dc/vars.yml's domain_ou_role ("DomainControllers",
#               one word) targeted an OU that has never existed anywhere in this forest --
#               confirmed live against EXADCSGOT001 directly
#               (Get-ADOrganizationalUnit -Filter "Name -eq 'DomainControllers'" returns
#               nothing, for any site). The real, built-in OU AD itself always creates is
#               "Domain Controllers" (with a space), directly at the domain root -- confirmed
#               from GOT's own real computer object DN
#               (CN=EXADCSGOT001,OU=Domain Controllers,DC=jukebox,DC=internal). DCS-role hosts
#               now go there directly in "Build target OU path", bypassing the per-site
#               OU=<SITE> nesting entirely -- every other role (Workstations/Laptops/Servers)
#               is completely unchanged, verified in an isolated test harness before shipping.
#   2026-10-10  Follow-up fix to the same day's _dj_genuine_forest_root change, real live
#               incident: "[Stage 0] Fail — domain still unresolvable after DNS override"'s
#               own `when: dj_dns_recheck is defined` never actually protected against the
#               re-check task being skipped -- a skipped registered task still registers a
#               real dict (changed: False, skipped: True, ...), so "is defined" is true
#               regardless, and Ansible's list-form when: does not short-circuit before
#               evaluating `dj_dns_recheck.stdout` on the next line. Never hit before because
#               the exact flow combination that exposes it (domain resolves cleanly on the
#               first try, via the new deterministic DNS-set task above) never occurred prior
#               to today's fix. Reproduced in an isolated two-task test harness before fixing,
#               confirmed the fix (`is not skipped`, already used correctly elsewhere in this
#               repo) resolves it cleanly. Also caught this exact task still checking the old
#               `is_first_dc` directly instead of `_dj_genuine_forest_root` -- missed in the
#               same day's earlier sweep -- fixed alongside.
#   2026-10-10  CRITICAL FIX, real live incident (Robert, EXADCSCLD001): every DNS-check and
#               join task here used to skip purely on is_first_dc -- a per-SITE vars_prompt
#               answer ("first DC built for THIS site"), not a per-FOREST one. Real
#               consequence: a genuinely new site's first DC, built onto an already-existing
#               forest (EXADCSGOT001 already runs jukebox.internal), had is_first_dc=true
#               (correctly, per the question's own wording) and so skipped the ENTIRE domain
#               join outright, with this file's own comment insisting "the domain doesn't
#               exist yet" when it genuinely did, just not at this site. Added
#               _dj_genuine_forest_root (true only when is_first_dc=true AND
#               ansible/tasks/discover_real_dcs.yml -- same real-candidate-discovery
#               mechanism windows_dc/tasks/dc_source_resolution.yml already uses -- found
#               nothing reachable anywhere) and replaced every is_first_dc check in this file
#               with it. A real, reachable DC now always wins over the per-site answer, same
#               as 00-preflight.yml's own matching fix, same incident, same day.
#   2026-09-19  Robert, sweeping for the same hardcoded-VRK-DNS-literal bug found in
#               00-preflight.yml's dns_bind9 var (see that file's own 2026-09-19 entry):
#               dj_temp_dns_ip's standalone-run fallback here independently hardcoded the
#               same '192.168.139.8' (EXADNSVRK001) literal a second time. Fixed to read
#               group_vars/all/site_services.yml's own `dns` entry instead.
#   2026-09-19  CRITICAL, found live (Robert, EXAANSFRD001 -- mid-EXADCSFRD001 build): this
#               play's hosts: line only checked {{ target | default('all') }} -- "target" is
#               never set anywhere in this chain; only site.yml's own documented
#               -e target_hosts=<ip> usage is. Every play past 00-preflight.yml (which already
#               correctly checks target_hosts first) silently ran against hosts: all -- the
#               entire estate, every OS/role -- on any site.yml run invoked exactly as
#               documented. Caught before real damage only because 15-locale-timezone.yml's
#               win_timezone module failed at resolution time before this play's own turn came
#               up; 20-registry.yml (registry hardening) would have run for real against every
#               Windows host in the estate otherwise. Fixed to
#               "{{ target_hosts | default(target | default('all')) }}", matching
#               00-preflight.yml's own already-correct pattern -- same fix applied identically
#               across all 19 affected playbooks in this directory (82-salt-minion.yml's
#               deliberate windows_nodes group targeting is unrelated and untouched).
#   2026-07-14  Robert, live against EXADCSCLD001: prompted twice mid-run for the same
#               decision -- once by 00-preflight.yml's automated Phase A5 DNS probe
#               (silent, no prompt, just decides), then again by this file's own
#               vars_prompt for dj_temp_dns_ip. Root cause: 00-preflight.yml's own
#               2026-07-03 changelog entry already says it "automated DNS decision --
#               remove hardcoded dns_server var and dj_temp_dns_ip prompt... dj_temp_dns_ip
#               is derived from dns_primary and passed forward to downstream plays as
#               before" -- Phase A5 (line ~334) sets dj_temp_dns_ip as a persisted host
#               fact. This file's own vars_prompt for the identical variable name was
#               never removed when that automation landed, so every chained run asked
#               the operator a question that had already been silently decided upstream
#               -- same bug class as 10-rename.yml's redundant hostname prompt, fixed
#               earlier this session. Replaced vars_prompt with a vars: entry that
#               defers to the already-set fact, falling back to the historical
#               192.168.139.8 default only when this file is run standalone (outside
#               the site.yml chain, where no such fact exists).
#   2026-07-14  Robert, live against EXADCSCLD001 (first-DC build, is_first_dc=yes): play
#               crashed at "[Stage 0] Check {{ exa_domain }} resolves" with a control-node
#               file-lookup error ("Unable to access /etc/example-music/ad_forest.json") --
#               exa_domain (group_vars/all/vars.yml) is templated from that file. Real bug:
#               the 2026-07-09 SAFETY FIX (see below) added is_first_dc awareness to the OU/
#               join tasks only -- Stage 0's five DNS pre-check tasks had no such gate at
#               all, so they ran (and needed exa_domain) unconditionally on every build,
#               including first-DC ones where there's no existing domain to resolve against
#               in the first place. Added `when: not is_first_dc` to all five, plus an
#               explicit "skipping" debug message matching the join section's existing
#               pattern. Also dropped {{ exa_domain }}/{{ dj_temp_dns_ip }} from the two
#               Check/Re-check task *names* -- names are lenient-templated (embed the error
#               as text rather than crashing) even when the task itself is correctly
#               skipped, so a first-DC run would otherwise still show a confusing inline
#               error string in the (skipped) task's display line. Separately, and NOT
#               fixed here: /etc/example-music/ad_forest.json genuinely doesn't exist on
#               this control node yet -- linux/tools.yml deploys it (2026-07-09) but hadn't
#               been (re-)run against EXAANSCLD001 since. Needed before windows_dc/site.yml
#               (which does need exa_domain for real) can run.
#   2026-06-20  Initial file
#   2026-07-06  Documented (no code change) why this file's static OU
#               derivation and tasks/ou_selection.yml's interactive LDAP
#               picker are intentionally separate rather than unified.
#   2026-07-09  Fixed domain_ou_path (line ~145): hardcoded "DC=jukebox,DC=internal"
#               even though exa_domain (used elsewhere in this same file for the
#               actual domain join) was already a variable -- silently diverged if
#               exa_domain ever changed. Now derives the DN from exa_domain via the
#               same DC=-join pattern windows_adschema/10-ad-schema.yml already
#               uses correctly. Also fixed two hardcoded Resolve-DnsName
#               "jukebox.internal" PowerShell calls (Stage 0) to use exa_domain.
#   2026-07-09  MUCH BIGGER FIX: hosts:/gather_facts:/vars_prompt were all commented
#               out (likely a leftover from some past debugging session, never
#               restored). This isn't just "runs against no hosts" -- a play missing
#               a required hosts: key fails Ansible's PARSER outright, at load time,
#               regardless of --tags. Since site.yml unconditionally import_playbooks
#               this file (line ~126), the *entire* windows_bootstrap/site.yml chain
#               could never even syntax-check, let alone run, until this was
#               restored. dj_temp_dns_ip (used throughout the DNS-override tasks)
#               was also undefined without the vars_prompt block that sets it.
#   2026-07-09  SAFETY FIX: this file had zero is_first_dc awareness -- a first-DC
#               (forest-creation) build would have blindly attempted
#               microsoft.ad.membership against a domain that doesn't exist yet.
#               05-bootstrap.yml's own Stage 5 (now retired, see its own removal
#               changelog note) explicitly skipped domain-join for is_first_dc
#               builds; this file never had the equivalent check, since it was
#               only ever exercised via the granular chain where that scenario
#               hadn't been hit yet. Added the same skip, with a message pointing
#               at windows_dc/site.yml as the next step, matching Stage 5's intent.
# =============================================================================

- name: Windows — Domain join
  hosts:         "{{ target_hosts | default(target | default('all')) }}"
  gather_facts: true
  vars:
    # 00-preflight.yml's Phase A5 already decides and persists this fact (as
    # dns_primary / dj_temp_dns_ip) for every host reached via the normal
    # site.yml chain -- see this file's 2026-07-14 changelog entry. The
    # default here only matters when this file is run standalone, outside
    # that chain, where no such fact exists yet.
    #
    # 2026-09-19 fix, Robert: this used to hardcode the literal '192.168.139.8' here --
    # same VRK BIND9 address (EXADNSVRK001) 00-preflight.yml's own dns_bind9 var used to
    # hardcode too (see that file's 2026-09-19 changelog entry), independently duplicated
    # a second time in this file. Both now read group_vars/all/site_services.yml's own
    # `dns` entry (generated from devices.csv) instead of a hand-maintained literal.
    #
    # 2026-09-25: NOT declared here as "dj_temp_dns_ip: {{ dj_temp_dns_ip | default(...)
    # }}" -- confirmed live (see bind9-dns.yml's own changelog for the full root cause)
    # that idiom throws "Recursive loop detected in template: maximum recursion depth
    # exceeded" the moment it's resolved with no fact/override already present, which
    # is exactly the standalone case this default exists to support. Resolved instead
    # via a set_fact as the first real task below.

  tasks:
    - name: "Resolve dj_temp_dns_ip if not already set by 00-preflight.yml (set_fact, not vars: -- see vars: comment above)"
      set_fact:
        dj_temp_dns_ip: "{{ dj_temp_dns_ip | default(site_services.dns.ip) }}"
      tags: domainjoin

    # 2026-10-10, Robert's ask, real live incident (EXADCSCLD001): matches
    # 00-preflight.yml's own 2026-10-10 fix (see its [A5] changelog entry for the full
    # story) -- re-discover here too if run standalone (outside the site.yml chain), same
    # "already set upstream, else fall back" pattern dj_temp_dns_ip itself already uses.
    - name: "Re-discover real DC reachability if not already set by 00-preflight.yml (standalone runs)"
      include_tasks: ../../../tasks/discover_real_dcs.yml
      vars:
        discover_dc_domain_name: "{{ exa_domain }}"
      when: _any_real_dc_reachable is not defined
      tags: domainjoin

    # is_first_dc is a per-SITE vars_prompt answer ("first DC for THIS site"), not a
    # per-FOREST one -- it does NOT by itself mean the domain doesn't exist. A genuinely
    # new site's first DC, built onto an already-existing forest (this exact scenario --
    # EXADCSGOT001 already runs the domain), has is_first_dc=true but a real, reachable DC
    # elsewhere. _dj_genuine_forest_root is the actual signal every task below needs:
    # true only when BOTH the operator said this is a first-DC build AND no real DC was
    # found reachable anywhere. Real DC reachability always wins over the per-site answer,
    # matching windows_dc/tasks/dc_source_resolution.yml's own already-proven philosophy.
    - name: "Set _dj_genuine_forest_root fact"
      set_fact:
        _dj_genuine_forest_root: "{{ (is_first_dc | default(false) | bool) and not (_any_real_dc_reachable | default(false) | bool) }}"
      tags: domainjoin

    # ── Stage 0: DNS resolution ────────────────────────────────────────────────
    # A fresh VM may have DHCP/ISP DNS that cannot resolve jukebox.internal.
    # Check first; only override if needed.  Windows updates NIC DNS itself
    # during the domain join so the temp entry doesn't need cleaning up.
    # Skipped entirely for first-DC builds — the domain doesn't exist yet, so
    # there's nothing to resolve, and exa_domain doesn't need to be resolvable
    # (its control-node file lookup may not even be available yet either).

    - name: "[Stage 0] Skip — first-DC build, nothing to resolve yet"
      debug:
        msg: >
          {{ inventory_hostname }} is a genuine forest-root build (no real DC reachable
          anywhere) — skipping the DNS pre-check, there's no existing domain to resolve
          against yet.
      when: _dj_genuine_forest_root
      tags: domainjoin

    # 2026-10-10, same incident, same fix: don't rely on the resolve-check below to decide
    # whether DNS needs correcting -- it queries whatever DNS is CURRENTLY configured on the
    # box, which may still be wrong (e.g. still BIND9-only, set by an earlier run before this
    # fix existed) and whether a bare-apex "Resolve-DnsName jukebox.internal" happens to
    # succeed against BIND9 says nothing about whether real AD SRV records are available --
    # the actual join below needs those regardless. When a real DC was discovered, point DNS
    # at it deterministically, unconditionally, before ever running the resolve-check --
    # idempotent (Set-DnsClientServerAddress to the same value twice is a no-op), so this is
    # safe to run even when DNS already happens to be correct.
    - name: "Point DNS at the discovered real DC before attempting the join"
      ansible.windows.win_shell: |
        $nic = (Get-NetRoute -DestinationPrefix '0.0.0.0/0' | Sort-Object RouteMetric | Select-Object -First 1).InterfaceAlias
        Set-DnsClientServerAddress -InterfaceAlias $nic -ServerAddresses "{{ _real_dc_reachable_ip }}"
      when:
        - not _dj_genuine_forest_root
        - _any_real_dc_reachable | default(false) | bool
      tags: domainjoin

    - name: "[Stage 0] Check domain resolves"
      ansible.windows.win_shell: |
        try {
          Resolve-DnsName "{{ exa_domain }}" -ErrorAction Stop | Out-Null
          Write-Output "resolvable"
        } catch {
          Write-Output "unresolvable"
        }
      register: dj_dns_check
      changed_when: false
      when: not _dj_genuine_forest_root
      tags: domainjoin

    - name: "[Stage 0] Fail — domain unresolvable and no DNS override provided"
      ansible.builtin.fail:
        msg: >
          {{ exa_domain }} cannot be resolved and no DNS override IP was provided.
          Re-run with -e dj_temp_dns_ip=<ip> (e.g. 192.168.139.8) — this file no longer
          prompts for it; see 00-preflight.yml's Phase A5 DNS decision output.
      when:
        - not _dj_genuine_forest_root
        - dj_dns_check.stdout | trim == "unresolvable"
        - dj_temp_dns_ip | length == 0
      tags: domainjoin

    - name: "[Stage 0] Get default-route NIC alias"
      ansible.windows.win_shell: |
        (Get-NetRoute -DestinationPrefix '0.0.0.0/0' | Sort-Object RouteMetric |
         Select-Object -First 1).InterfaceAlias
      register: dj_nic_alias
      changed_when: false
      when:
        - not _dj_genuine_forest_root
        - dj_dns_check.stdout | trim == "unresolvable"
        - dj_temp_dns_ip | length > 0
      tags: domainjoin

    - name: "[Stage 0] Set temporary DNS to {{ dj_temp_dns_ip }}"
      ansible.windows.win_shell: |
        Set-DnsClientServerAddress `
          -InterfaceAlias "{{ dj_nic_alias.stdout | trim }}" `
          -ServerAddresses "{{ dj_temp_dns_ip }}"
      when:
        - not _dj_genuine_forest_root
        - dj_dns_check.stdout | trim == "unresolvable"
        - dj_temp_dns_ip | length > 0
      tags: domainjoin

    - name: "[Stage 0] Re-check domain after DNS override"
      ansible.windows.win_shell: |
        try {
          Resolve-DnsName "{{ exa_domain }}" -ErrorAction Stop | Out-Null
          Write-Output "resolvable"
        } catch {
          Write-Output "unresolvable"
        }
      register: dj_dns_recheck
      changed_when: false
      when:
        - not _dj_genuine_forest_root
        - dj_dns_check.stdout | trim == "unresolvable"
        - dj_temp_dns_ip | length > 0
      tags: domainjoin

    - name: "[Stage 0] Fail — domain still unresolvable after DNS override"
      ansible.builtin.fail:
        msg: >
          {{ exa_domain }} still cannot be resolved after setting DNS to {{ dj_temp_dns_ip }}.
          Verify that {{ dj_temp_dns_ip }} is reachable and serves {{ exa_domain }}.
      when:
        - not _dj_genuine_forest_root
        # 2026-10-10, real live incident (EXADCSCLD001): "is defined" alone does NOT mean
        # "this task actually ran" -- a SKIPPED registered task still registers a real dict
        # (changed: False, skipped: True, ...), so "is defined" is true even when the task
        # above never executed and .stdout was never set, and Ansible's list-form when: does
        # NOT short-circuit before evaluating the next condition -- confirmed by reproducing
        # this exact failure in an isolated two-task test harness before fixing it here, not
        # guessed. "is not skipped" is the actual, correct test (already used correctly
        # elsewhere in this repo, e.g. tasks/ssh_key_preflight.yml's own _sshpf_* checks).
        - dj_dns_recheck is defined
        - dj_dns_recheck is not skipped
        - dj_dns_recheck.stdout | trim == "unresolvable"
      tags: domainjoin

    # ── Domain join ───────────────────────────────────────────────────────────

    - name: Include hostname facts
      include_tasks: ../../../tasks/hostname_facts.yml
      tags: domainjoin

    - name: Check if already domain-joined
      ansible.windows.win_shell: |
        (Get-WmiObject Win32_ComputerSystem).PartOfDomain
      register: domain_check
      changed_when: false
      tags: domainjoin

    - name: Skip if already domain-joined
      debug:
        msg: "{{ inventory_hostname }} is already domain-joined — skipping."
      when: domain_check.stdout | trim | lower == 'true'
      tags: domainjoin

    - name: Skip — genuine forest-root build, domain doesn't exist yet
      debug:
        msg: >
          {{ inventory_hostname }} is a genuine forest-root build (is_first_dc=true AND no
          real DC reachable anywhere) — the domain doesn't exist yet, so there's nothing to
          join. Run windows_dc/site.yml next to create the forest; this host will then
          already be the DC, not something that joins it afterward.
      when:
        - domain_check.stdout | trim | lower != 'true'
        - _dj_genuine_forest_root
      tags: domainjoin

    # 2026-10-10, real live incident (Robert, EXADCSCLD001): group_vars/windows_dc/vars.yml's
    # domain_ou_role ("DomainControllers", one word) targeted an OU that has never existed
    # anywhere in this forest -- confirmed live against EXADCSGOT001 directly
    # (Get-ADOrganizationalUnit -Filter "Name -eq 'DomainControllers'" returns nothing).
    # The real, built-in OU AD itself always creates is "Domain Controllers" (with a space),
    # directly at the domain root, never nested under a per-site OU -- confirmed from GOT's
    # own real computer object DN (Get-ADDomainController -Filter * |
    # Select ComputerObjectDN -> CN=EXADCSGOT001,OU=Domain Controllers,DC=jukebox,DC=internal).
    # DCS-role hosts now go there directly, bypassing the per-site OU=<SITE> nesting entirely
    # -- every other role (Workstations/Laptops/Servers) is completely unchanged.
    - name: Build target OU path
      set_fact:
        domain_ou_path: >-
          {%- if host_role_code | upper == 'DCS' -%}
            OU=Domain Controllers,{{ 'DC=' + exa_domain.split('.') | join(',DC=') }}
          {%- else -%}
            OU={{ domain_ou_role }},OU={{ host_site }},{{ 'DC=' + exa_domain.split('.') | join(',DC=') }}
          {%- endif -%}
      when:
        - domain_check.stdout | trim | lower != 'true'
        - not _dj_genuine_forest_root
      tags: domainjoin

    - name: Show domain join target
      debug:
        msg: >
          Joining {{ inventory_hostname }} to {{ exa_domain }}
          OU: {{ domain_ou_path }}
      when:
        - domain_check.stdout | trim | lower != 'true'
        - not _dj_genuine_forest_root
      tags: domainjoin

    - name: Join domain
      microsoft.ad.membership:
        dns_domain_name:    "{{ exa_domain }}"
        domain_admin_user:  "{{ exa_domain_join_user }}"
        domain_admin_password: "{{ vault_domain_join_password }}"
        domain_ou_path:     "{{ domain_ou_path }}"
        state:              domain
        reboot:             false
      register: join_result
      when:
        - domain_check.stdout | trim | lower != 'true'
        - not _dj_genuine_forest_root
      tags: domainjoin

    - name: Reboot after domain join
      ansible.windows.win_reboot:
        reboot_timeout:    600
        post_reboot_delay: 60
        msg: "Rebooting after domain join"
      when:
        - join_result is defined
        - join_result.changed
      tags: domainjoin
