---
# =============================================================================
# playbooks/windows_bootstrap/playbooks/00-preflight.yml
# Example Music Limited — Pre-flight: credentials, hostname, IP, SSH hardening
#
# Runs against a freshly built Windows host on its DHCP address.
# Handles everything that must happen before the rest of site.yml's chain
# (10-rename.yml onward).
#
# Task flow
# ─────────
# PHASE A — All control-node work (no SSH connection to target yet):
#   A1  Resolve is_first_dc and persist vars_prompt facts
#   A2  If target_hostname left blank, connect and read $env:COMPUTERNAME —
#       the one Phase A step that does touch the target, see its own comment
#   A3  Validate hostname format and parse site/role codes
#   A4  Read sites.csv → derive subnet, gateway, site DC IP
#   A5  DNS probe → decide dns_primary / dns_secondary (see below)
#   A6  Pre-flight summary + operator confirm
#
# PHASE B — SSH connect and harden:
#   B0  Failsafe: clear a pre-existing DefaultShell override via plain ssh,
#       before B1's own module-based connection can be broken by it
#   B1  gather_facts (first real SSH connection)
#   B2  Ensure sshd running and set to auto-start
#   B3  Deploy Ansible public key
#
# PHASE C — Assess current state:
#   C1  Read current hostname and IP from host
#   C2  Set hostname_needs_change / ip_needs_change facts
#
# PHASE D — NIC selection (ip_needs_change only)
# PHASE E — Static IP facts
#
# PHASE F — Write EXA-ApplyStaticIP scheduled task (ip_needs_change only):
#   Sets static IP, correct DNS, re-enables OpenSSH firewall rules on next boot.
#
# PHASE G — Rename computer (hostname_needs_change only)
# PHASE H — Reboot (rename or IP change), operator-confirmed reconnect
# PHASE H2 — Dynamically register this host into its permanent inventory
#            group (add_host) so group_vars/windows*/ resolve correctly for
#            the rest of this run — requires -i configs/inventory (not a
#            bare IP) so the group hierarchy already exists to register into
# PHASE I — Summary and hand-off to the rest of site.yml's chain
#
# ─────────────────────────────────────────────────────────────────────────────
# DNS decision (Phase A5)
# ─────────────────────────────────────────────────────────────────────────────
# The correct DNS for the new static IP depends on what DCs are actually
# reachable at run time.  A TCP 389 (LDAP) probe from the control node
# determines the state.  Ping is firewall-blocked and unreliable.  A DNS
# lookup would be circular (we are deciding what DNS to set).  LDAP/389 is a
# reliable indicator that a DC is up and answering.
#
# Source of truth for hub DC IPs: the DC column of sites.csv.
#
# Decision tree (applied in order):
#
#   Role=DCS AND is_first_dc=yes
#     → primary=BIND9 (192.168.139.8), secondary=none
#       Creating the AD forest from scratch.  No domain exists yet — no AD DNS
#       is needed and none will answer.  20-dc-promote.yml sets DNS to
#       127.0.0.1 and configures BIND9 as a forwarder after promotion.
#
#   site DC (.10) reachable via TCP 389
#     → primary=site_dc (.10), secondary=BIND9
#       A DC is already up at this site.  Use it — AD SRV records resolve
#       correctly for domain join and replication.
#
#   site DC (.10) not reachable, hub DC (FAL/ODE/BRK) reachable
#     → primary=nearest reachable hub DC, secondary=BIND9
#       First DC at this site.  The domain exists elsewhere — a hub DC provides
#       AD DNS for domain join and replication.  For DCS hosts, 20-dc-promote
#       handles DNS after promotion.  For non-DCS hosts this is TEMPORARY —
#       once the site DC (EXADCS<SITE>001) is commissioned, update DNS to .10.
#
#   No DC reachable anywhere
#     → primary=BIND9 only, secondary=none
#       BIND9 is the last resort.  Domain join will likely fail — BIND9 does
#       not serve AD SRV records.  Investigate connectivity before proceeding.
#
# =============================================================================
# Changelog:
#   2026-07-15  Robert, live against EXADCSCLD001 again: DefaultShell/
#               DefaultShellCommandOption kept reappearing before Ansible's very
#               first connection, three times over, despite 75-openssh.yml's fix
#               (confirmed correct and current on disk each time via grep + git
#               log) -- because that fix runs at stage ~14 of this chain, and B1
#               (this file's own first connection) dies long before reaching it
#               if the box is already in that state. Exhaustively ruled out
#               every file in this repo as the source (ps7_setup.yml never
#               touches it; the real live imaging chain -- Deploy-OpenSSH.cmd /
#               SetupComplete.cmd / Detect-Platform.cmd / Install-OpenSSH.ps1 --
#               never touches it either; Join-DomainAndBootstrap.ps1/
#               PostOOBE.cmd do, but are confirmed dead, not part of any live
#               path). No Proxmox template is in use (Robert confirmed) so root
#               cause is unresolved -- but per Robert's explicit instruction,
#               added a failsafe instead of continuing to chase it: [B0], a
#               plain (non-module, non-EncodedCommand) ssh command run from the
#               control node's own ssh client, ahead of [B1]'s first
#               module-based connection. Best-effort only (failed_when: false)
#               -- if DefaultShell isn't actually the problem, or the key isn't
#               deployed yet, this is a silent no-op and B1 behaves exactly as
#               before.
#   2026-07-15  Robert: leaving the target_hostname prompt blank made A3's format
#               assert fail immediately, bombing the whole play -- unlike target_ip,
#               which already tolerates blank ("no change, use whatever's already
#               there", assessed in Phase C once connected). Added A2: when
#               target_hostname is blank, connect early and read $env:COMPUTERNAME,
#               then let it flow into A3's existing assert exactly like an
#               operator-typed value would. Couldn't reuse Phase C's later read
#               outright -- A3/A4/A5 (site/role parsing, sites.csv lookup, DNS
#               decision) all run before Phase B ever connects, so there's no
#               live value yet at that point without connecting early. Operator
#               is only stopped if the box's actual current name doesn't already
#               match the EXA convention -- same assert, same message, as before.
#   2026-06-27  Initial file
#   2026-06-27  Combined rename and static IP into single reboot
#   2026-06-29  Guard reboot/scheduled task if IP already correct
#   2026-06-29  Fix reconnect — wait_for on control node, then wait_for_connection
#   2026-06-29  Fix heredoc to use single-quote @'...'@ to avoid YAML parse issues
#   2026-06-29  Skip IP prompt if current IP already matches sites.csv expectation
#   2026-06-29  Skip rename prompt if hostname already matches target
#   2026-06-30  RESTORED after being incorrectly overwritten with unrelated
#               "Stage 0b DNS/DC" content that was never part of this file.
#   2026-06-30  Moved is_first_dc question into vars_prompt so ALL prompts
#               fire upfront before any tasks run.
#   2026-07-02  Fix ip_needs_change: was checking subnet membership only.
#               Persist target_hostname and dj_temp_dns_ip as host facts.
#   2026-07-03  Automated DNS decision — remove hardcoded dns_server var and
#               dj_temp_dns_ip prompt. Phase A5 probes site DC and hub DCs via
#               TCP 389 and sets dns_primary / dns_secondary based on role,
#               is_first_dc, and probe results. dj_temp_dns_ip is derived from
#               dns_primary and passed forward to downstream plays as before.
#               Pre-flight summary moved to after Phase A5 so operator sees
#               the decided DNS before confirming.  Task flow reorganised into
#               named phases (A–I) matching the file header above.
#   2026-07-09  Fixed hosts: — was bare "{{ target_hosts }}" with no fallback to
#               target at all, the only file in this directory without one (every
#               other early-stage play here, e.g. 05-bootstrap.yml/10-rename.yml,
#               already accepts target_hosts | default(target | default('all'))).
#               configs/inventory/cld.ini (and fal.ini/liv.ini) document
#               -e target=<host> as the Step 1 invocation -- that command failed
#               immediately with 'target_hosts' is undefined before this fix.
#   2026-07-09  Removed "import_playbook: 05-bootstrap.yml" and the "Handing off to
#               05-bootstrap.yml" summary line. That monolith (Stages 0b-23) has been
#               fully retired -- every stage was confirmed to have moved to a
#               standalone playbook in this same directory (10-rename.yml through
#               85-finish.yml, all already wired into site.yml's own top-level
#               import list), except two real gaps found and fixed as part of this
#               retirement: 80-domainjoin.yml had no is_first_dc awareness (would
#               have blindly attempted a domain join during forest creation -- see
#               its own changelog), and 85-finish.yml (Stage 23's summary + final
#               reboot) didn't exist as a standalone file at all until now. See
#               05-bootstrap.yml's own git history for the removed file.
#   2026-07-09  Added Phase H2 (dynamic inventory registration via add_host).
#               Idempotency audit of the full chain found that a bare-IP full
#               run (site.yml's own documented "full run" usage, -i <ip>,
#               -e target_hosts=<ip>) leaves the host with no inventory group
#               membership for the *entire* run, since group membership
#               doesn't change just because Ansible progresses to a later
#               play. group_vars/windows*/ never applies as a result --
#               confirmed two real crashes (20-registry.yml's registry_common,
#               80-domainjoin.yml's domain_ou_role, both undefined-variable
#               errors) and two silent-wrong-behaviour cases (70-hibernation.yml
#               and 25-deadvertise.yml both defensively default to "off" rather
#               than fail, so a laptop that should get hibernation enabled
#               silently doesn't). Only 40-choco-packages.yml had ever been
#               fixed for this (2026-06-30, made fully self-contained) --  the
#               other five stages were extracted from the old monolith later
#               without anyone connecting that they'd hit the same problem.
#               Rather than patch each file individually (or require the
#               operator to hand-edit configs/inventory/<site>.ini before
#               every first-ever bootstrap run), this host now registers
#               itself into its permanent group once Phase H knows the final
#               IP/hostname -- confirmed empirically that add_host in an
#               earlier play is correctly visible to later, separately-
#               imported plays' hosts: patterns in the same run (including
#               real group_vars/<group>/ auto-loading, not just vars passed
#               directly to add_host), provided -i configs/inventory is the
#               loaded inventory source so these groups already exist to
#               register into. add_host is given the full group chain
#               explicitly (e.g. [windows_desktop, windows, windows_nodes])
#               rather than just the most-specific group -- checked, and
#               configs/inventory/{cld,fal,liv}.ini only ever define the
#               windows_dc -> windows_server -> windows -> windows_nodes
#               :children chain (DC onboarding); windows_desktop/
#               windows_laptop are never linked into windows/windows_nodes
#               anywhere in this repo today. Listing the full chain directly
#               sidesteps that gap rather than also fixing it, and doesn't
#               depend on which .ini files happen to be loaded. Also fixed
#               10-rename.yml and
#               40-choco-packages.yml's hosts: lines, which both prioritised
#               target_hosts over target -- harmless for those two files
#               specifically today, but would have kept them targeting the
#               raw IP directly all run, bypassing this registration, since
#               target_hosts stays set (and therefore wins) for the whole
#               run. Every other numbered play already used target-only.
# =============================================================================

- name: Pre-flight — credentials, hostname, IP, SSH
  hosts:         "{{ target_hosts | default(target | default('all')) }}"
  gather_facts:  false

  vars_prompt:
    - name: ansible_user
      prompt: "SSH Username to connect as"
      private: false
      default: "Administrator"

    - name: ansible_password
      prompt: "Local Administrator password (blank if SSH key already deployed)"
      private: true
      default: ""

    - name: vault_domain_join_password
      prompt: "Domain join password (Domain Admin)"

    - name: target_hostname
      prompt: "Target hostname (EXA[ROLE][SITE][NNN], e.g. EXADCSCLD001)"
      private: false
      default: ""

    - name: is_first_dc_input
      prompt: "Is this the FIRST domain controller being built for this site? (yes/no — no for all other host types)"
      private: false
      default: "no"

    - name: target_ip
      prompt: "Static IP to assign (leave blank if IP is already correct)"
      private: false
      default: ""

  vars:
    ansible_become:               false
    ansible_become_method:        runas
    ansible_connection:           ssh
    ansible_shell_type:           powershell
    ansible_ssh_extra_args:       '-o StrictHostKeyChecking=no'
    ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/ansible/configs/ansible-id_rsa"
    ansible_ssh_public_key_file:  "{{ lookup('env', 'HOME') }}/ansible/configs/ansible-id_rsa.pub"
    sites_csv: "/etc/example-music/sites.csv"
    dns_bind9: "192.168.139.8"   # CLD BIND9 — upstream resolver for jukebox.internal

  tasks:

    # =========================================================================
    # PHASE A — Control-node tasks (no SSH connection to target)
    # =========================================================================

    # ── A1 — is_first_dc and fact persistence ─────────────────────────────────

    - name: "[A1] Set is_first_dc fact from vars_prompt"
      set_fact:
        is_first_dc: "{{ is_first_dc_input | lower | trim in ['yes', 'y'] }}"
      when: is_first_dc is not defined

    - name: "[A1] Persist vars_prompt values as host facts for downstream plays"
      set_fact:
        is_first_dc_input:          "{{ is_first_dc_input }}"
        target_hostname:            "{{ target_hostname }}"
        target_ip:                  "{{ target_ip }}"
        vault_domain_join_password: "{{ vault_domain_join_password }}"
      no_log: true

    # ── A2 — Blank hostname: read current from host, adopt if it's already valid ──
    # target_ip's existing blank-tolerant pattern ("blank = no change, use whatever's
    # already there") can't be copied as-is for hostname: A3 below parses site/role
    # codes out of target_hostname, and A4/A5 (sites.csv lookup, DNS decision) both
    # run long before Phase B ever connects to the box — there is no live value to
    # fall back to yet at that point in the file. So when target_hostname is left
    # blank, connect just long enough to read $env:COMPUTERNAME here instead, then
    # let it flow into the *same* A3 assert as any operator-typed value. A3's
    # existing regex is still the one and only gate on acceptability — if the box's
    # actual current name doesn't already match the EXA convention, the assert
    # fails with its usual message, telling the operator to supply target_hostname
    # explicitly rather than leaving it blank. ansible_connection/ansible_ssh_*
    # are already set in this play's vars: block, so this SSH call works fine here,
    # ahead of B1's own gather_facts.

    - name: "[A2] Target hostname left blank — read current hostname from host"
      ansible.windows.win_shell: $env:COMPUTERNAME
      register: _current_hostname_probe
      changed_when: false
      when: target_hostname | length == 0

    - name: "[A2] Adopt current hostname as target_hostname"
      set_fact:
        target_hostname: "{{ _current_hostname_probe.stdout | trim }}"
      when: target_hostname | length == 0

    # ── A3 — Hostname validation and site/role parsing ─────────────────────────

    - name: "[A3] Validate hostname format"
      assert:
        that:
          - target_hostname | length > 0
          - target_hostname | upper | regex_search('^EXA[A-Z]{2,4}[A-Z]{3}[0-9]{3}$') is not none
        fail_msg: >
          '{{ target_hostname }}' is not a valid EXA hostname.
          Format: EXA[ROLE][SITE][NNN] — e.g. EXADCSLIV001, EXAWKSFAL001.

    - name: "[A3] Parse site and role codes from hostname"
      set_fact:
        host_site_code: "{{ target_hostname | upper | regex_search('^EXA[A-Z]{2,4}([A-Z]{3})[0-9]{3}$', '\\1') | first }}"
        host_role_code: "{{ target_hostname | upper | regex_search('^EXA([A-Z]{2,4})[A-Z]{3}[0-9]{3}$', '\\1') | first }}"

    # ── A4 — Read sites.csv and derive network details ─────────────────────────

    - name: "[A4] Read sites.csv from control node"
      set_fact:
        site_data: "{{ lookup('file', sites_csv) | community.general.from_csv }}"
      delegate_to: localhost

    - name: "[A4] Find site record for {{ host_site_code }}"
      set_fact:
        site_record: "{{ site_data | selectattr('Site', 'equalto', host_site_code) | list | first | default({}) }}"

    - name: "[A4] Fail if site code not found in sites.csv"
      fail:
        msg: "Site code '{{ host_site_code }}' not found in {{ sites_csv }}. Check the hostname."
      when: site_record | length == 0

    - name: "[A4] Derive network defaults from sites.csv"
      set_fact:
        site_subnet:  "{{ site_record.Subnet }}"
        site_gateway: "{{ site_record.Gateway }}"
        site_dc:      "{{ site_record.DC }}"
        site_city:    "{{ site_record.City }}"
        site_country: "{{ site_record.Country }}"
        subnet_base:  "{{ site_record.Subnet | regex_replace('/\\d+$', '') | regex_replace('\\.\\d+$', '') }}"
        prefix_len:   "{{ site_record.Subnet.split('/')[1] }}"

    # ── A5 — DNS probe: decide primary and secondary DNS ──────────────────────
    # All probes run from the Ansible control node (delegate_to: localhost).
    # Hub DC IPs come from the DC column of sites.csv — same source of truth
    # used everywhere else; no IPs hardcoded in this playbook.
    #
    # command:/shell: tasks delegated to localhost inside THIS play must set
    # ansible_connection: local explicitly on the task -- the play's own vars:
    # block sets ansible_connection: ssh (needed for the real Windows target),
    # and that applies to every host in the play at a higher precedence than
    # implicit localhost's own ansible_connection: local default. Without the
    # override, delegate_to: localhost does NOT actually run locally -- Ansible
    # tries to SSH from the control node to itself as the Windows Administrator
    # user with the Windows keypair, which fails outright as a connection error
    # (UNREACHABLE), not a task failure -- found live 2026-07-15 when the new
    # [B0] failsafe below hit exactly this, and it turned out to be latent here
    # too: these two probes had simply never been exercised yet, since every
    # live test so far has had is_first_dc: yes, which skips them via their own
    # when: condition. set_fact tasks (e.g. "[A4] Read sites.csv") don't need
    # this -- lookup() always evaluates on the controller regardless of
    # connection, only command/shell dispatch through the connection plugin.

    - name: "[A5] Build hub DC candidate list from sites.csv"
      set_fact:
        _hub_candidates:
          - site: "FAL"
            ip: "{{ (site_data | selectattr('Site', 'equalto', 'FAL') | list | first | default({})).DC | default('192.168.76.10') }}"
          - site: "ODE"
            ip: "{{ (site_data | selectattr('Site', 'equalto', 'ODE') | list | first | default({})).DC | default('192.168.126.10') }}"
          - site: "BRK"
            ip: "{{ (site_data | selectattr('Site', 'equalto', 'BRK') | list | first | default({})).DC | default('192.168.136.10') }}"
      delegate_to: localhost
      become: false

    - name: "[A5] Probe site DC {{ site_dc }} — TCP 389 (LDAP)"
      command: >
        bash -c 'timeout 3 bash -c "echo >/dev/tcp/{{ site_dc }}/389" 2>/dev/null
        && echo reachable || echo unreachable'
      register: _site_dc_probe
      changed_when: false
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
      when: not (host_role_code | upper == 'DCS' and is_first_dc | bool)

    - name: "[A5] Set site DC reachability fact"
      set_fact:
        _site_dc_up: "{{ _site_dc_probe.stdout | default('unreachable') | trim == 'reachable' }}"

    - name: "[A5] Probe hub DCs — TCP 389 (fallback when site DC not reachable)"
      command: >
        bash -c 'timeout 3 bash -c "echo >/dev/tcp/{{ item.ip }}/389" 2>/dev/null
        && echo reachable || echo unreachable'
      register: _hub_probe
      loop: "{{ _hub_candidates }}"
      loop_control:
        label: "{{ item.site }} ({{ item.ip }})"
      changed_when: false
      delegate_to: localhost
      become: false
      vars:
        ansible_connection: local
      when:
        - not _site_dc_up | bool
        - not (host_role_code | upper == 'DCS' and is_first_dc | bool)

    - name: "[A5] Select first reachable hub DC as primary fallback"
      set_fact:
        _hub_fallback_ip:   "{{ item.item.ip }}"
        _hub_fallback_site: "{{ item.item.site }}"
      loop: "{{ _hub_probe.results | default([]) }}"
      loop_control:
        label: "{{ item.item.site | default('?') }}"
      when:
        - not (_hub_probe is skipped)
        - item.stdout | default('unreachable') | trim == 'reachable'
        - _hub_fallback_ip is not defined

    - name: "[A5] Apply DNS decision"
      set_fact:
        dns_primary:    "{{ _primary }}"
        dns_secondary:  "{{ _secondary }}"
        dns_reason:     "{{ _reason }}"
        dj_temp_dns_ip: "{{ _primary }}"
      vars:
        _is_forest_root: "{{ host_role_code | upper == 'DCS' and is_first_dc | bool }}"
        _primary: >-
          {%- if host_role_code | upper == 'DCS' and is_first_dc | bool -%}
            {{ dns_bind9 }}
          {%- elif _site_dc_up | bool -%}
            {{ site_dc }}
          {%- elif _hub_fallback_ip is defined -%}
            {{ _hub_fallback_ip }}
          {%- else -%}
            {{ dns_bind9 }}
          {%- endif -%}
        _secondary: "{{ '' if (host_role_code | upper == 'DCS' and is_first_dc | bool) else dns_bind9 }}"
        _reason: >-
          {%- if host_role_code | upper == 'DCS' and is_first_dc | bool -%}
            forest root — BIND9 only, no AD DNS until promotion completes
          {%- elif _site_dc_up | bool -%}
            site DC {{ site_dc }} is up — using local DC
          {%- elif _hub_fallback_ip is defined -%}
            site DC offline — {{ _hub_fallback_ip }} ({{ _hub_fallback_site }}) temporary primary
          {%- else -%}
            no DC reachable — BIND9 only; domain join will likely fail
          {%- endif -%}

    # ── A6 — Pre-flight summary and operator confirm ───────────────────────────
    # Runs on localhost. No SSH connection has been made to the target yet.
    # All site, DNS, and role information is now resolved — operator sees
    # the complete picture before confirming.

    - name: "[A6] Pre-flight summary — confirm before connecting"
      ansible.builtin.pause:
        prompt: |-

          ── Pre-flight summary ───────────────────────────────────────────────
            Host target : {{ inventory_hostname }}
            SSH user    : {{ ansible_user }}
            Hostname    : {{ target_hostname | upper }}
            Role        : {{ host_role_code }}   First DC: {{ 'YES' if is_first_dc | bool else 'no' }}
            Site        : {{ host_site_code }} — {{ site_city }}, {{ site_country }}
            Subnet      : {{ site_subnet }}   Gateway: {{ site_gateway }}
            Target IP   : {{ target_ip if target_ip | length > 0 else '(blank — no IP change)' }}
            DNS primary : {{ dns_primary }}
            DNS 2nd     : {{ dns_secondary if dns_secondary | length > 0 else '(none — forest root build)' }}
            DNS reason  : {{ dns_reason }}
          ─────────────────────────────────────────────────────────────────────
          Confirm (Enter to proceed, Ctrl+C → A to abort)
      delegate_to: localhost

    # =========================================================================
    # PHASE B — SSH connection and host hardening
    # =========================================================================

    # ── B0 — Failsafe: clear a pre-existing DefaultShell override before Ansible
    # ever tries to connect. 75-openssh.yml already removes DefaultShell/
    # DefaultShellCommandOption for good (stage ~14 of this chain) -- but that's
    # no help if the box already has DefaultShell set to pwsh.exe *before* B1's
    # first connection: every ansible.windows module call (including this play's
    # own gather_facts below) is sent as a -EncodedCommand invocation, which
    # pwsh's DefaultShellCommandOption=-SSHServerMode doesn't parse the same way
    # Windows PowerShell 5.1 does -- it returns its own usage banner instead of
    # running anything, so nothing module-based can ever reach 75-openssh.yml to
    # fix it. This uses the control node's own plain ssh client to send one flat
    # command (not module-wrapped, not -EncodedCommand) -- best-effort only:
    # failed_when: false so a host that isn't in this state, or where the key
    # isn't deployed yet, never blocks the play. If it works, B1 below succeeds
    # normally; if it doesn't, B1 fails exactly as it would have anyway and the
    # manual registry-clear is still the fallback.

    - name: "[B0] Failsafe — clear any pre-existing DefaultShell override via plain ssh"
      ansible.builtin.command: >
        ssh -i {{ ansible_ssh_private_key_file }}
            -o StrictHostKeyChecking=no -o BatchMode=yes -o ConnectTimeout=8
            {{ ansible_user }}@{{ ansible_host | default(inventory_hostname) }}
            "reg delete HKLM\SOFTWARE\OpenSSH /v DefaultShell /f & reg delete HKLM\SOFTWARE\OpenSSH /v DefaultShellCommandOption /f & exit 0"
      delegate_to: localhost
      become: false
      changed_when: false
      failed_when: false
      vars:
        # Without this, delegate_to: localhost does NOT run locally -- the
        # play's own vars: block sets ansible_connection: ssh for every host
        # in the play (needed for the real Windows target), which outranks
        # implicit localhost's own ansible_connection: local default. Left
        # unset, Ansible tries to SSH from the control node to itself as the
        # Windows Administrator user with the Windows keypair -- an outright
        # connection error (UNREACHABLE), which failed_when: false above
        # cannot suppress, since the task never runs far enough to produce a
        # result to judge. Found live 2026-07-15: this exact task hit it on
        # its very first real run, same day it was added -- see the two [A5]
        # probe tasks below, which had the identical latent bug already.
        ansible_connection: local

    - name: "[B1] Gather facts (first SSH connection to target)"
      ansible.windows.setup:

    - name: "[B1] Ensure sshd is running and set to auto-start"
      ansible.windows.win_service:
        name: sshd
        start_mode: auto
        state: started

    - name: "[B1] Ensure OpenSSH firewall rule exists"
      community.windows.win_firewall_rule:
        name:      OpenSSH-Server-In-TCP
        localport: "22"
        action:    allow
        direction: in
        protocol:  tcp
        state:     present
        enabled:   true

    - name: "[B2] Create ProgramData\\ssh directory"
      ansible.windows.win_file:
        path: 'C:\ProgramData\ssh'
        state: directory

    - name: "[B2] Deploy Ansible public key to administrators_authorized_keys"
      ansible.windows.win_copy:
        content: "{{ lookup('file', ansible_ssh_public_key_file) }}\n"
        dest:    'C:\ProgramData\ssh\administrators_authorized_keys'

    - name: "[B2] Lock down administrators_authorized_keys permissions"
      ansible.windows.win_shell: |
        icacls C:\ProgramData\ssh\administrators_authorized_keys /inheritance:r
        icacls C:\ProgramData\ssh\administrators_authorized_keys /grant "SYSTEM:(F)"
        icacls C:\ProgramData\ssh\administrators_authorized_keys /grant "BUILTIN\Administrators:(F)"
      changed_when: false

    # =========================================================================
    # PHASE C — Assess current hostname and IP
    # =========================================================================

    - name: "[C1] Get current hostname"
      ansible.windows.win_shell: $env:COMPUTERNAME
      register: current_hostname_raw
      changed_when: false

    - name: "[C1] Set current hostname fact"
      set_fact:
        current_hostname: "{{ current_hostname_raw.stdout | trim | upper }}"

    - name: "[C1] Get current IP on primary NIC"
      ansible.windows.win_shell: |
        (Get-NetIPAddress -AddressFamily IPv4 |
          Where-Object { $_.IPAddress -notmatch '^(127\.|169\.)' } |
          Sort-Object -Property PrefixLength -Descending |
          Select-Object -First 1).IPAddress
      register: current_ip_raw
      changed_when: false

    - name: "[C1] Set current IP fact"
      set_fact:
        current_ip: "{{ current_ip_raw.stdout | trim }}"

    - name: "[C2] Set change-needed facts"
      set_fact:
        hostname_needs_change: "{{ current_hostname != target_hostname | upper }}"
        ip_needs_change:       "{{ target_ip | length > 0 and current_ip != target_ip }}"

    - name: "[C2] Show current state"
      debug:
        msg:
          - "  Hostname : {{ current_hostname }} → {{ target_hostname | upper }} ({{ 'CHANGE NEEDED' if hostname_needs_change else 'OK' }})"
          - "  IP       : {{ current_ip }} → {{ target_ip if target_ip | length > 0 else '(no change)' }} ({{ 'CHANGE NEEDED' if ip_needs_change else 'OK' }})"

    # =========================================================================
    # PHASE D — NIC selection (ip_needs_change only)
    # =========================================================================

    - name: "[D] Get first active NIC"
      ansible.windows.win_shell: >
        (Get-NetAdapter | Where-Object Status -eq 'Up' |
          Sort-Object ifIndex | Select-Object -First 1 -ExpandProperty Name)
      register: nic
      changed_when: false
      when: ip_needs_change | bool

    - name: "[D] Set target NIC fact"
      set_fact:
        target_nic: "{{ nic.stdout | trim }}"
      when: ip_needs_change | bool

    # =========================================================================
    # PHASE E — Static IP facts
    # =========================================================================

    - name: "[E] Set static IP facts (IP change needed)"
      set_fact:
        use_dhcp:  false
        static_ip: "{{ target_ip }}"
      when: ip_needs_change | bool

    - name: "[E] Set static IP facts (IP already correct)"
      set_fact:
        use_dhcp:  false
        static_ip: "{{ current_ip }}"
      when: not ip_needs_change | bool

    # =========================================================================
    # PHASE F — Write EXA-ApplyStaticIP scheduled task (ip_needs_change only)
    # =========================================================================
    # Fires at next boot (before login screen), applies static IP and DNS,
    # re-enables OpenSSH firewall rules (Windows resets these on IP change),
    # restarts sshd, then removes itself.
    #
    # dns_primary and dns_secondary were decided by the Phase A5 probe.
    # dns_secondary is empty for forest-root DC builds — the secondary netsh
    # line is omitted in that case via the Jinja2 conditional below.

    - name: "[F] Write scheduled task — apply static IP and DNS on next boot"
      ansible.windows.win_shell: |
        $script = @'
        netsh interface ip set address name='{{ target_nic }}' static {{ static_ip }} {{ '255.255.255.0' if prefix_len == '24' else '255.255.0.0' }} {{ site_gateway }}
        netsh interface ip set dns    name='{{ target_nic }}' static {{ dns_primary }}
        {% if dns_secondary | length > 0 -%}
        netsh interface ip add dns    name='{{ target_nic }}' {{ dns_secondary }} index=2
        {% endif -%}
        netsh advfirewall firewall set rule name="OpenSSH-Server-In-TCP" new enable=yes
        netsh advfirewall firewall set rule group="OpenSSH Server" new enable=yes
        Restart-Service sshd
        Unregister-ScheduledTask -TaskName 'EXA-ApplyStaticIP' -Confirm:$false
        '@
        $encoded  = [Convert]::ToBase64String([Text.Encoding]::Unicode.GetBytes($script))
        $action   = New-ScheduledTaskAction -Execute "powershell.exe" -Argument "-NoProfile -NonInteractive -EncodedCommand $encoded"
        $trigger  = New-ScheduledTaskTrigger -AtStartup
        $settings = New-ScheduledTaskSettingsSet -ExecutionTimeLimit (New-TimeSpan -Minutes 5)
        $principal = New-ScheduledTaskPrincipal -UserId "SYSTEM" -RunLevel Highest
        Register-ScheduledTask -TaskName "EXA-ApplyStaticIP" -Action $action -Trigger $trigger -Settings $settings -Principal $principal -Force
      changed_when: true
      when: ip_needs_change | bool

    # =========================================================================
    # PHASE G — Rename computer (hostname_needs_change only)
    # =========================================================================

    - name: "[G] Rename computer to {{ target_hostname | upper }}"
      ansible.windows.win_hostname:
        name: "{{ target_hostname | upper }}"
      register: rename_result
      when: hostname_needs_change | bool

    # =========================================================================
    # PHASE H — Reboot
    # =========================================================================

    - name: "[H] Set needs_reboot fact"
      set_fact:
        needs_reboot: "{{ hostname_needs_change | bool or ip_needs_change | bool }}"

    - name: "[H] Warn operator — reboot imminent"
      debug:
        msg: >-
          ════════════════════════════════════════════════════════════════
          Rebooting now to apply changes.
          {% if ip_needs_change | bool %}
          !! IP CHANGE — Ansible will reconnect on {{ static_ip }} !!
          The EXA-ApplyStaticIP scheduled task will set:
            Primary DNS : {{ dns_primary }}
            Secondary   : {{ dns_secondary if dns_secondary | length > 0 else '(none)' }}
            Reason      : {{ dns_reason }}
          {% else %}
          IP unchanged — reconnecting on {{ current_ip }}
          {% endif %}
          ════════════════════════════════════════════════════════════════
      when: needs_reboot | bool

    - name: "[H] Reboot — IP change (async fire-and-forget)"
      ansible.windows.win_shell: shutdown /r /t 0 /f
      async:   30
      poll:    0
      when:    ip_needs_change | bool

    - name: "[H] Switch ansible_host to new static IP"
      set_fact:
        ansible_host: "{{ static_ip }}"
      when: ip_needs_change | bool

    - name: "[H] Wait — confirm VM is back up before continuing"
      ansible.builtin.pause:
        prompt: |-

          ── Waiting for reboot ───────────────────────────────────────────────
            Reboot sent. VM is changing IP from {{ current_ip }} → {{ static_ip }}.
            From another terminal, run: ping {{ static_ip }}
            Press Enter here once SSH is responding on {{ static_ip }}.
          ─────────────────────────────────────────────────────────────────────
          Confirm (Enter to continue, Ctrl+C → A to abort)
      delegate_to: localhost
      when: ip_needs_change | bool

    - name: "[H] Verify connection on new IP"
      ansible.builtin.wait_for_connection:
        delay:   5
        timeout: 60
      when: ip_needs_change | bool

    - name: "[H] Reboot — hostname change only (no IP change)"
      ansible.windows.win_reboot:
        reboot_timeout:    300
        post_reboot_delay: 20
        msg:               "Ansible preflight — applying hostname change"
      when: hostname_needs_change | bool and not ip_needs_change | bool

    # =========================================================================
    # PHASE H2 — Dynamic inventory registration
    # =========================================================================
    # Registers this host into its permanent group for the rest of this run
    # (10-rename.yml onward) via add_host, so group_vars/windows*/ resolve
    # correctly without requiring the operator to hand-edit configs/inventory
    # before the very first bootstrap run — add_host only affects this one
    # process's in-memory inventory, it doesn't touch the .ini files on disk.
    # Requires -i configs/inventory (not a bare IP) so the windows_dc/
    # windows_server/windows/windows_nodes :children hierarchy already exists
    # for the new host to inherit into — confirmed empirically, add_host into
    # just the most specific group (e.g. windows_dc) correctly inherits every
    # parent group's group_vars, including group_vars/windows_nodes/
    # connection.yml (SSH user/key/shell), with no need to also pass
    # connection vars to add_host directly.
    #
    # Still add the host to configs/inventory/<site>.ini for real once
    # bootstrap completes, same as before — this only covers the current run.

    - name: "[H2] Determine permanent inventory groups for this host's role"
      set_fact:
        _permanent_groups: "{{ _role_group_map[host_role_code | upper] | default([]) }}"
      vars:
        # Full group list, most-specific first — passed to add_host directly rather than
        # relying on configs/inventory's own [group:children] relationships existing for
        # every role. Belt-and-braces: as of 2026-07-20, generate_inventory.py's own
        # windows:children DOES link windows_desktop/windows_laptop/windows_server into
        # windows/windows_nodes (confirmed directly against a real site .ini) — this
        # comment previously claimed otherwise (stale, corrected here) — but listing the
        # full chain explicitly still doesn't hurt, and doesn't depend on which .ini files
        # happen to be loaded for this particular run.
        #
        # TAB added 2026-07-20, same treatment as SUR (windows_laptop) — see
        # generate_inventory.py's DEVICE_GROUP_MAP comment: only a genuinely Windows-OS
        # tablet ever reaches this file at all (Android/iPadOS tablets don't run
        # windows_bootstrap), so no OS check is needed here specifically.
        _role_group_map:
          DCS: [windows_dc, windows_server, windows, windows_nodes]
          SRV: [windows_server, windows, windows_nodes]
          WKS: [windows_desktop, windows, windows_nodes]
          LAP: [windows_laptop, windows, windows_nodes]
          SUR: [windows_laptop, windows, windows_nodes]
          TAB: [windows_laptop, windows, windows_nodes]

    - name: "[H2] Fail — unrecognised role code, cannot determine permanent groups"
      fail:
        msg: >
          Role code '{{ host_role_code }}' (parsed from {{ target_hostname | upper }}) isn't
          one of the known windows_bootstrap roles (DCS, SRV, WKS, LAP, SUR, TAB). Cannot
          determine which permanent inventory groups to register this host into for the rest
          of this run — group_vars/windows*/ would not resolve correctly downstream. Check
          the hostname, or add this role to _role_group_map above if it's a genuinely new one.
      when: _permanent_groups | length == 0

    - name: "[H2] Register into {{ _permanent_groups | join(', ') }} for the rest of this run"
      add_host:
        name:         "{{ target_hostname | upper }}"
        groups:       "{{ _permanent_groups }}"
        ansible_host: "{{ static_ip }}"
      delegate_to: localhost
      become: false

    # =========================================================================
    # PHASE I — Summary and hand-off
    # =========================================================================

    - name: "[I] Pre-flight complete — summary"
      debug:
        msg:
          - "════════════════════════════════════════════════════════════════"
          - "  Pre-flight complete"
          - "  Hostname    : {{ target_hostname | upper }}"
          - "  Site        : {{ host_site_code }} — {{ site_city }}, {{ site_country }}"
          - "  IP          : {{ static_ip }}"
          - "  DNS primary : {{ dns_primary }}"
          - "  DNS 2nd     : {{ dns_secondary if dns_secondary | length > 0 else '(none — forest root build)' }}"
          - "  DNS reason  : {{ dns_reason }}"
          - "  SSH         : running, auto-start, Ansible key deployed"
          - "  First DC    : {{ is_first_dc }}"
          - "  Handing off to the rest of site.yml's chain (10-rename.yml onward)..."
          - "════════════════════════════════════════════════════════════════"
