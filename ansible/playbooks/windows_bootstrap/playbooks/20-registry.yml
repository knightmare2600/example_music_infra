---
# =============================================================================
# playbooks/20-registry.yml
# Example Music Limited — Windows registry hardening (all hosts)
# =============================================================================
# Applies registry_common from group_vars/windows/vars.yml.
# Safe to re-run — all tasks are idempotent.
#
# Usage:
#   ansible-playbook -i configs/inventory playbooks/windows_bootstrap/playbooks/20-registry.yml
#   ansible-playbook -i configs/inventory playbooks/windows_bootstrap/playbooks/20-registry.yml --check
#
# Tags: registry
# =============================================================================
# Changelog:
#   2026-06-20  Initial file
#   2026-07-06  Removed "Ensure RDP service is running" / "Enable RDP
#               firewall rule" — moved to playbooks/77-rdp.yml, which now
#               owns the full RDP config (enable + NLA + service +
#               firewall) instead of splitting it across two files.
# =============================================================================

- name: Windows — Registry hardening
  hosts: "{{ target | default('all') }}"
  gather_facts: false
  tasks:

    - name: Apply common registry keys
      ansible.windows.win_regedit:
        path:  "{{ item.path }}"
        name:  "{{ item.name }}"
        data:  "{{ item.data }}"
        type:  "{{ item.type }}"
      loop: "{{ registry_common }}"
      loop_control:
        label: "{{ item.name }}"
      tags: registry

    - name: Disable SMBv1 feature
      ansible.windows.win_optional_feature:
        name: SMB1Protocol
        state: absent
      tags: registry
