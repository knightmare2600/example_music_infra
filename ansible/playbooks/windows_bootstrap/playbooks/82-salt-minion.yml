---
# =============================================================================
# playbooks/82-salt-minion.yml
# Example Music Limited — Salt minion install (all Windows nodes)
# =============================================================================
# Installs the Salt minion via the arch-matching MSI already committed to
# bootstrap/web/windows/{x86_64,arm64}/ (see this file's own ARM64 header note below for the
# real filenames), pointed at salt.{{ site_services.domain_fqdn }}
# (the CNAME alias -- see benarbejde/role_codes.csv's DNSAlias column and bind9-dns.yml's
# db.forward-zone.devices.j2 -- resolving to EXASLTCLD001). Uses the DNS name rather than a
# hardcoded IP -- site_services (group_vars/all/site_services.yml) is already loaded for
# every host regardless of OS, so no separate salt_master_ip var/file is needed; one less
# hardcoded copy of the master's address to keep in sync (2026-07-20, Robert's explicit
# "reduce hardcoded values where possible" instruction). DNS is already a hard dependency by
# this point in the chain anyway -- domain join (80-domainjoin.yml, earlier) doesn't work
# without it. Runs over SSH, well after 00-preflight.yml's Phase G (the actual rename -- see
# that file's own README section and changelog; 10-rename.yml is NOT chained in the main
# flow, standalone-only), so MINION_ID is always the real, final
# EXA<ROLE><SITE><NNN> hostname -- never a random Setup-time name. Position
# 82 (after 80-domainjoin.yml) is just for tidy ordering near the end of the
# chain -- domain join itself isn't a dependency, only the rename is, and
# that already happened at the very start of the chain.
#
# History: this was originally wired into bootstrap/web/windows/unattend/
# headlessunattend.xml's FirstLogonCommands instead (2026-07-20, same day).
# Moved here the same day, before anything was actually built against it,
# once Robert spotted the real problem: headlessunattend.xml sets
# ComputerName to "*" (a random Setup-time name) and FirstLogonCommands
# fires before any Ansible rename step runs, so MINION_ID would have been
# baked in as that random name -- EXASLTCLD001 would have accumulated one
# dead/renamed key per build, needing manual salt-key cleanup forever.
# Installing here instead, after 10-rename.yml, avoids the problem
# structurally rather than needing any cleanup step. The unattend XML no
# longer installs Salt at all.
#
# Scope (revised twice, same day): WKS/LAP/SUR (client endpoints), SVR
# (member servers), AND DCS (domain controllers) -- Robert's explicit call,
# after first excluding DCS then deciding it's fine to include. NOT
# PVE/FWL/Linux generally. MAC/MBP (macOS) are explicitly future work, not
# in scope yet -- Salt does support macOS minions, just not wired up here.
#
# hosts: windows_nodes -- covers windows_dc/windows_server/windows_desktop/
# windows_laptop via generate_inventory.py's own windows_dc -> windows_server
# -> windows -> windows_nodes chain, so this one group reaches every Windows
# role in scope without listing each one individually.
#
# TAB (Tablet) is deliberately not called out specially -- it's folded into
# windows_laptop by generate_inventory.py already (see that file's own
# DEVICE_GROUP_MAP comment, 2026-07-20), conditional on devices.csv's OS
# column actually saying Windows. A non-Windows TAB (the real ones today are
# all Android/iPadOS) never reaches windows_bootstrap at all, so no separate
# handling is needed here.
#
# Idempotency (confirmed, not assumed): win_copy checksums the MSI against what's already on
# the target and skips the copy if unchanged; win_package checks the local MSI's product code
# against installed products and skips the install if already present. Re-running this
# playbook against an already-bootstrapped node does no work.
#
# ARM64 (added 2026-08-10, Robert): reuses tasks/arch_facts.yml's own host_arch fact/naming
# convention (x86_64/arm64/x86, matching 50-binaries.yml's established pattern) rather than
# inventing a new one. bootstrap/web/windows/ restructured into per-architecture subfolders
# the same day (bootstrap/web/windows/{x86_64,arm64}/, also matching 50-binaries.yml's own
# files/{x86_64,arm64}/ layout) -- real filenames differ per arch (Salt Project's own release
# naming, "...-Py3-AMD64.msi"/"...-Py3-ARM64.msi"), not just an arch suffix, so selection uses
# an explicit salt_minion_msi_filenames map (mirrors 50-binaries.yml's own src_amd64/src_arm64
# pattern for exactly this "filenames aren't consistent across arches" reason) rather than a
# single Jinja-templated pattern.
#
# Both are now version 3008.0, matching the master's own salt_version_major pin -- no version
# mismatch. x86_64 is Salt Project's own official Broadcom release (SHA256-verified against
# their response header, 842a03fa627ad51c6fd95fd0801cf771df05281cd8ea0eedf823a2d4f9ca7704,
# 2026-08-10). arm64 is still NOT an official upstream release -- native Windows arm64 support
# for the Salt minion doesn't exist in any Broadcom-published build -- it's a custom compile
# Robert built tracking three still-OPEN, unmerged PRs (salt#70003, relenv#318, pymssql#1013 --
# confirmed live against the GitHub API, all three genuinely open, none merged as of
# 2026-08-10) that together add arm64 build capability, freshly recompiled 2026-08-10 with the
# pymssql fix included and confirmed by Robert as good. Treat the arm64 build as experimental
# regardless of the version match: it can't be refreshed the same "fetch + verify vendor
# checksum" way as x86_64, since there's no vendor release to fetch from -- rebuilding it means
# re-applying those three PRs (or whatever they've evolved into) by hand. See
# docs/buildsheets/buildsheet-salt-minion.md for the full caveat.
#
# Custom grains: NOT this file's job, and not future work either -- already built and live
# (2026-07-20) as salt/states/grains/init.sls, wired into salt/states/top.sls for every
# minion. This comment previously called it deferred future work; that was stale by the time
# it mattered -- corrected 2026-08-10. See docs/management/Salt_Beginners_Guide.md's
# "Automatic Highstate" and "Querying and Confirming Custom Grains" sections for where the
# rendered file actually lives and how to check it, and the automatic-highstate config below
# for how grains/wintools actually get applied without someone remembering to run state.apply
# by hand.
#
# Automatic highstate (added 2026-08-10): salt/states/top.sls declares wintools+grains for
# every minion, but nothing on the master or minion triggers state.apply on its own --
# without this, those states only ever apply if a human runs `salt <target> state.apply`
# from the master. Fixed by dropping a minion.d/ config include (Salt's own convention --
# default_include: minion.d/*.conf is the out-of-the-box minion default, merges alongside
# the base minion file the MSI's own MASTER/MINION_ID properties write) setting
# startup_states: highstate (applies once when the minion service starts -- covers the very
# first check-in right after this playbook runs) plus a periodic schedule: block (re-applies
# on an interval after that, so a stale grains file from a later rename/site move, or drifted
# wintools state, self-heals without needing anyone to remember to trigger it by hand).
#
# Usage:
#   ansible-playbook -i configs/inventory playbooks/windows_bootstrap/playbooks/82-salt-minion.yml
#
# Tags: salt
# =============================================================================
# Version history
# =============================================================================
# v1.0.0  2026-07-20  Initial release.
# v1.1.0  2026-08-10  ARM64 support -- host_arch-based MSI selection (reuses
#                     tasks/arch_facts.yml/50-binaries.yml's own convention),
#                     Salt-Minion-Setup-x86_64.msi renamed from the previous
#                     unsuffixed filename, Salt-Minion-Setup-arm64.msi added
#                     (custom build, see header for the real caveat).
# v1.2.0  2026-08-10  bootstrap/web/windows/ restructured into per-arch
#                     subfolders same day -- switched to an explicit
#                     salt_minion_msi_filenames map (real vendor/build
#                     filenames, not just an arch suffix) and both MSIs
#                     bumped to 3008.0, resolving v1.1.0's version mismatch.
# v1.3.0  2026-08-10  Automatic highstate -- drops a minion.d/ config
#                     include (startup_states: highstate + a periodic
#                     schedule: block) so top.sls's wintools+grains states
#                     actually apply on their own instead of needing a
#                     manual `salt <target> state.apply`. Removed the
#                     stale "custom grains deferred" header comment --
#                     grains have been live since 2026-07-20.
# v1.3.1  2026-08-10  bootstrap/web/windows/x86_64/ renamed to .../amd64/
#                     by Robert, same day -- added salt_minion_msi_dirs to
#                     map host_arch to the real folder name rather than
#                     assuming they match. Rest of that folder's own
#                     contents/naming deliberately untouched -- more
#                     cleanup still to come there, not this file's job.
# =============================================================================

- name: Windows — Salt minion install
  hosts: "windows_nodes"
  gather_facts: false

  vars:
    # Real vendor/build filenames -- not consistent across arches, so an explicit map,
    # not a single Jinja-templated pattern. Same reasoning as 50-binaries.yml's own
    # src_amd64/src_arm64 keys. Update both the filename AND the SHA256 comment above
    # (x86_64 only -- arm64 has no vendor checksum to verify against, see header) if
    # either ever gets refreshed.
    salt_minion_msi_filenames:
      x86_64: Salt-Minion-3008.0-Py3-AMD64.msi
      arm64: Salt-Minion-3008.0-Py3-ARM64.msi

    # bootstrap/web/windows/x86_64/ renamed to .../amd64/ by Robert (2026-08-10, same day) --
    # host_arch itself (tasks/arch_facts.yml) still resolves to "x86_64", so this maps that
    # value to the real on-disk folder name rather than assuming they match. arm64's folder
    # wasn't renamed, so it maps to itself. Deliberately only fixing this path lookup, not
    # arch_facts.yml/50-binaries.yml or the rest of that folder's own contents/naming --
    # Robert's explicit "don't touch it yet", there's more cleanup still to come there.
    salt_minion_msi_dirs:
      x86_64: amd64
      arm64: arm64

    # First, conservative default -- re-applies top.sls's wintools+grains states every hour,
    # splayed over 5 minutes so a fleet-wide restart/reboot doesn't have every minion hit the
    # master in the same instant. No existing convention to match elsewhere in this repo
    # (nothing else schedules a recurring Salt job); adjust here if an hour proves too
    # frequent/infrequent once this is live.
    salt_minion_highstate_interval_minutes: 60

  tasks:

    - name: Detect CPU architecture
      include_tasks: ../tasks/arch_facts.yml
      tags: salt

    - name: Fail loudly on an architecture with no Salt minion MSI at all
      ansible.builtin.fail:
        msg: >-
          host_arch={{ host_arch }} has no Salt minion MSI mapped in
          salt_minion_msi_filenames -- only x86_64 and arm64 exist under
          bootstrap/web/windows/ (see this playbook's own header).
      when: host_arch not in salt_minion_msi_filenames
      tags: salt

    - name: Copy Salt minion MSI to the target host
      ansible.windows.win_copy:
        src: "{{ playbook_dir }}/../../../../bootstrap/web/windows/{{ salt_minion_msi_dirs[host_arch] }}/{{ salt_minion_msi_filenames[host_arch] }}"
        dest: "C:\\Windows\\Temp\\Salt-Minion-Setup.msi"
      tags: salt

    # No product_id/creates_service needed -- path is a locally-accessible file, so
    # win_package's own idempotency check reads the MSI's product code directly
    # (confirmed against the module's own docs, not guessed). creates_service is
    # documented as ignored for local MSI paths anyway (it's for the exe/URL/share case).
    - name: Install Salt minion (MASTER/MINION_ID via MSI properties)
      ansible.windows.win_package:
        path: "C:\\Windows\\Temp\\Salt-Minion-Setup.msi"
        arguments: >-
          MASTER=salt.{{ site_services.domain_fqdn }}
          MINION_ID={{ inventory_hostname | upper }}
        state: present
      tags: salt

    - name: Remove staged MSI
      ansible.windows.win_file:
        path: "C:\\Windows\\Temp\\Salt-Minion-Setup.msi"
        state: absent
      tags: salt

    # Salt's own out-of-the-box minion default is default_include: minion.d/*.conf -- any
    # .conf dropped here merges alongside the base minion file the MSI's MASTER/MINION_ID
    # properties already wrote, same "config.d/ drop-in" pattern 20-saltgui.yml already uses
    # on the master side (/etc/salt/master.d/saltgui.conf). Ensuring the directory exists
    # first rather than assuming the installer created it -- confirmed it normally does, but
    # this is one win_file task, cheap insurance against a future installer change silently
    # breaking the win_copy below.
    - name: Ensure minion.d config drop-in directory exists
      ansible.windows.win_file:
        path: "C:\\ProgramData\\Salt Project\\Salt\\conf\\minion.d"
        state: directory
      tags: salt

    # See this file's own "Automatic highstate" header section for why this exists.
    - name: Configure automatic highstate (startup + periodic schedule)
      ansible.windows.win_copy:
        content: |
          # Written by 82-salt-minion.yml -- see docs/management/Salt_Beginners_Guide.md's
          # "Automatic Highstate" section for what this does and why.
          startup_states: highstate

          schedule:
            example_music_periodic_highstate:
              function: state.apply
              minutes: {{ salt_minion_highstate_interval_minutes }}
              splay: 300
        dest: "C:\\ProgramData\\Salt Project\\Salt\\conf\\minion.d\\example-music-schedule.conf"
      register: _salt_minion_schedule_conf
      tags: salt

    # Only takes effect on the minion's next start -- restart it now rather than leaving the
    # newly-written config inert until the box next reboots. Only fires when the config
    # genuinely changed (win_copy's own idempotency), matching this repo's standing
    # "don't change if not broken" convention -- a routine re-run against an
    # already-configured node does no work and doesn't bounce the service.
    - name: Restart Salt minion service to pick up schedule config
      ansible.windows.win_service:
        name: salt-minion
        state: restarted
      when: _salt_minion_schedule_conf.changed
      tags: salt
