---
# =============================================================================
# site.yml
# Example Music Limited — Domain Controller onboarding
# =============================================================================
# DC-SPECIFIC stages only.  Generic Windows bootstrap (rename, domain join,
# tools) is handled by running windows_bootstrap/site.yml first — the DC
# inventory file groups windows_dc as a child of windows_server, so all
# group_vars and connection settings are inherited automatically.
#
# Run from the ansible/ root for all commands.
#
# Run order:
#   Step 1 — standard bootstrap:
#     ansible-playbook -i configs/inventory \
#       playbooks/windows_bootstrap/site.yml \
#       -e target=<host> --ask-vault-pass
#
#   Step 2 — DC promotion:
#     ansible-playbook -i configs/inventory \
#       playbooks/windows_dc/site.yml \
#       -e target=<host>
#
#   Or single-step with tags:
#     ansible-playbook -i configs/inventory \
#       playbooks/windows_dc/site.yml \
#       -e target=<host> --tags dc_promote
#
# Playbook order (00 = preflight, then major steps in increments of 10;
# in-between/minor steps would be 11/12/13, 21/22/23, etc. if ever needed):
#   00-dc-preflight          Credential prompts + replication source resolution
#   10-dc-install-features   AD-DS/DNS/GPMC feature install
#   20-dc-promote            Install-ADDSDomainController (or Install-ADDSForest)
#   30-dc-replicate          Force replication, SYSVOL wait, FSMO report, KCC
#   40-dc-summary            dcdiag + colourised build report
#
# Tags:
#   dc_preflight    00-dc-preflight
#   dc_features     10-dc-install-features
#   dc_promote      20-dc-promote
#   dc_replicate    30-dc-replicate
#   dc_summary      40-dc-summary
#
# =============================================================================
# Changelog:
#   2026-06-25  Initial file
#   2026-07-06  Renumbered 85/90/95/99 -> 00/10/20/30/40 (00 = preflight,
#               "before take off"; major steps in increments of 10). Split
#               90-dc-promote.yml into 10-dc-install-features.yml ("install
#               the tools" — AD-DS/DNS/GPMC feature install) and
#               20-dc-promote.yml ("run dcpromo" — actual promotion) since
#               those are two distinct major steps, not one.
# =============================================================================

- import_playbook: playbooks/00-dc-preflight.yml
  tags: dc_preflight

- import_playbook: playbooks/10-dc-install-features.yml
  tags: dc_features

- import_playbook: playbooks/20-dc-promote.yml
  tags: dc_promote

- import_playbook: playbooks/30-dc-replicate.yml
  tags: dc_replicate

- import_playbook: playbooks/40-dc-summary.yml
  tags: dc_summary

