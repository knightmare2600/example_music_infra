---
# =============================================================================
# playbooks/00-dc-preflight.yml
# Example Music Limited — Domain Controller preflight
# =============================================================================
# Resolves the replication source DC and validates pre-conditions before
# promotion.  Handles the special-sauce site permutations:
#
#   CLD  — Datacenter DC.  Primary replication source for standard sites,
#          preferred even over FAL (datacenter is canonical).
#
#   FAL  — Head office.  Holds PDC Emulator + Global Catalog.  Preferred
#          replication source for standard sites if CLD is unreachable.
#
#   ODE  — Regional hub (continental Europe).  Primary source for its region
#          if CLD and FAL are unreachable.
#
#   BRK  — Regional hub (Germany/DACH).  Primary source for its region if
#          CLD and FAL are unreachable.
#
# Source resolution order (for a standard site DC):
#   1.  CLD primary DC  (192.168.69.10)   — preferred always
#   2.  FAL primary DC  (192.168.76.10)   — first fallback
#   3.  ODE primary DC  (192.168.126.10)  — second fallback
#   4.  BRK primary DC  (192.168.136.10)  — third fallback
#   5.  Any DC already listed in sites.csv for this site
#   6.  No candidate reachable → fall back to the operator's
#       dc_is_first_in_forest answer (see below) instead of aborting outright
#
# Forest root (dc_is_forest_root) — ANY site, not just CLD:
#   This is NOT inferred from the site name — it comes from
#   dc_is_first_in_forest, answered upfront at the vars_prompt below
#   (alongside the other operator prompts, not asked interactively mid-play).
#   It's only consulted if no candidate DC is reachable from anywhere: a
#   reachable candidate always wins regardless of the answer. "yes" then
#   sets dc_is_forest_root=true (20-dc-promote.yml runs Install-ADDSForest
#   instead of Install-ADDSDomainController) regardless of which site the
#   host is in. "no" (the default) aborts the play, since there is then no
#   valid replication source and no confirmation that one is unnecessary.
#
# For FAL, ODE, BRK themselves:
#   They replicate from CLD if reachable, else from each other in the
#   priority order FAL > ODE > BRK (skipping self).
#
# vars_prompt:
#   dc_domain_name        — AD domain FQDN
#   dc_netbios_name       — AD NetBIOS name
#   dc_is_first_in_forest — yes/no; only consulted if no source is reachable
#   dc_dsrm_password      — DSRM password
#   dc_admin_user         — Domain Admin username  (e.g. JUKEBOX\Administrator)
#   dc_admin_password     — Domain Admin password
#   dc_local_user         — Local Administrator username
#   dc_local_password     — Local Administrator password
#
# Required extra-vars:
#   sites_csv          — path to sites.csv on the control node
#                        default: /etc/example-music/sites.csv
#
# Sets facts consumed by 20-dc-promote.yml:
#   dc_replication_source   — FQDN or IP of the source DC
#   dc_is_forest_root       — true only when operator confirms this is the
#                             first DC in the forest (any site — see above)
#   dc_site_role            — 'hub_primary' | 'hub_cld' | 'standard'
#   dc_source_site          — 3-letter site code of the chosen source
#
# Tags: dc_preflight
# =============================================================================
# Changelog:
#   2026-06-25  Initial file
#   2026-06-29  Remove ANSI codes from vars_prompt strings (exa_pretty handles
#               colouring); add default: "" to password prompts; standardise
#               hosts: target to windows_dc; store dc_replication_source_ip fact
#   2026-07-04  vars_prompt defaults for dc_domain_name/dc_netbios_name/
#               dc_admin_user now use | default('') — bare-IP runs (-i
#               <ip>, with no group membership) don't pull in
#               group_vars/windows_dc/vars.yml, so ad_domain_name/
#               ad_netbios_name were undefined and blew up the play before
#               task 1. Operator now just types it every time on ungrouped
#               runs; grouped runs still get the group_vars value pre-filled.
#   2026-07-04  Connect via SSH as Local Administrator (dc_local_user/
#               dc_local_password) instead of the ansible service account —
#               fresh/CLD-first-build hosts don't yet trust the ansible SSH
#               key. ansible_user/ansible_password set per-play; Ansible's
#               SSH plugin switches to sshpass-based password auth
#               automatically once ansible_password is present, no
#               ansible.cfg changes needed. Requires sshpass installed on
#               the control node.
#   2026-07-06  Same ungrouped-run gap as the 2026-07-04 vars_prompt fix, but
#               for dc_cld_site/dc_hub_sites: bare-target runs (inventory
#               parse failure, or target not a member of windows_dc) don't
#               pull in group_vars/windows_dc/vars.yml, so "Set dc_site_role
#               fact" blew up on 'dc_cld_site' is undefined. Added
#               | default('CLD') / | default(['FAL','ODE','BRK']) fallbacks
#               matching the group_vars values so grouped runs are unaffected
#               and ungrouped runs no longer abort here.
#   2026-07-06  Forest-root detection no longer hardcoded to CLD. Site is
#               just where a DC happens to sit — it says nothing about
#               whether this is the very first DC built for the forest (a
#               non-CLD site with populate_ad=no is exactly this case).
#               dc_source_resolution.yml now asks the operator directly
#               ("Is this the first DC in the AD Forest?") when no candidate
#               is reachable, for any dc_site_role, instead of only setting
#               dc_is_forest_root=true when dc_site_role == 'hub_cld'.
#   2026-07-06  Same ungrouped-run root cause hit again, this time for _c
#               (group_vars/all/colours.yml) — "Show site role" blew up with
#               '_c' is undefined on a run where group_vars/all never
#               loaded. Added tasks/colour_fallback.yml, included first
#               (before hostname facts), so _c always resolves even when
#               group_vars didn't load.
#   2026-07-06  Standard-site probe order now includes CLD, ahead of FAL:
#               CLD → FAL → ODE → BRK. Previously standard sites skipped
#               CLD entirely even when it was the only reachable DC.
#   2026-07-06  Added dc_is_first_in_forest vars_prompt (default "no"),
#               answered upfront with the other operator prompts.
#               dc_source_resolution.yml previously used an interactive
#               pause mid-play to ask this, only when no source was
#               reachable — worse UX than bundling every question the
#               operator answers at the top of the run before any task
#               output has printed.
#   2026-07-06  Same ungrouped-run gap yet again, this time for connection
#               mechanics: "Confirm host is already domain-joined" (the
#               first ansible.windows task to actually hit the target) blew
#               up with "Module result deserialization failed" because
#               ansible_shell_type never got set to powershell —
#               group_vars/windows_nodes/connection.yml is inventory-group-
#               gated just like everything else. ansible_user/
#               ansible_password were already set per-play (2026-07-04) but
#               ansible_connection/shell_type/port weren't. Added alongside.
#   2026-07-09  SAFETY FIX: dc_dsrm_password/dc_admin_password had real, guessable,
#               hardcoded plaintext defaults ("H0r$3B@Tt3rYSt@pL3" / "0p3nS3$@m32026")
#               sitting in this file -- anyone accepting the prompt default (or just
#               reading the source) got a real credential. Both now default to
#               group_vars/windows_dc/vault.yml's vault_dc_dsrm_password/
#               vault_dc_admin_password (empty unless populated), forcing explicit
#               entry at the prompt otherwise -- matches dc_local_password's already-
#               correct empty-default pattern. Also fixed dc_admin_user's fallback:
#               previously rendered "Administrator\Administrator" (not
#               "JUKEBOX\Administrator") when ad_netbios_name was undefined, since
#               the fallback-within-a-fallback used the wrong variable name. Same
#               pass: dc_domain_name/dc_netbios_name's own fallback-of-fallback
#               (used only if ad_domain_name/ad_netbios_name are somehow undefined --
#               a truly ungrouped run) now reads ad_forest.json directly instead of a
#               second hardcoded 'jukebox.internal'/'JUKEBOX' literal.
#
# =============================================================================

- name: Windows DC — Preflight and replication source resolution
  hosts: "{{ target | default('windows_dc') }}"
  gather_facts: false

  vars:
    sites_csv: "/etc/example-music/sites.csv"
    # ad_domain_name, ad_netbios_name, dc_hub_sites, dc_cld_site,
    # dc_dns_forwarders → group_vars/windows_dc/vars.yml (single source of truth).
    # dc_hub_sources and dc_cld_source are built at runtime from sites.csv.
    # ansible_connection/shell_type/port normally come from
    # group_vars/windows_nodes/connection.yml, but that's inventory-group-
    # gated like everything else — set explicitly so ungrouped/ad hoc runs
    # still connect over SSH+PowerShell instead of falling back to a POSIX
    # shell wrapper against a Windows host.
    ansible_connection: ssh
    ansible_shell_type: powershell
    ansible_port:       22
    ansible_user:       "{{ dc_local_user }}"
    ansible_password:   "{{ dc_local_password }}"

  vars_prompt:
    - name: dc_domain_name
      prompt: "AD domain FQDN"
      private: false
      default: "{{ ad_domain_name | default((lookup('file', ad_forest_json_path | default('/etc/example-music/ad_forest.json')) | from_json).domain_fqdn) }}"

    - name: dc_netbios_name
      prompt: "AD NetBIOS name"
      private: false
      default: "{{ ad_netbios_name | default((lookup('file', ad_forest_json_path | default('/etc/example-music/ad_forest.json')) | from_json).netbios_name) }}"

    - name: dc_is_first_in_forest
      prompt: >-
        Is this the first DC in the AD Forest? (yes/no)
        (only matters if no replication source turns out to be reachable —
        see dc_source_resolution.yml. Answer "no" if unsure; probing will
        still find a source if one exists)
      private: false
      default: "no"

    - name: dc_dsrm_password
      prompt: "DSRM (Directory Services Restore Mode) password"
      private: true
      default: "{{ vault_dc_dsrm_password | default('') }}"

    - name: dc_admin_user
      prompt: "Domain Admin username (NETBIOS_NAME\\username)"
      private: false
      default: "{{ ad_netbios_name | default('JUKEBOX') }}\\Administrator"

    - name: dc_admin_password
      prompt: "Domain Admin password"
      private: true
      default: "{{ vault_dc_admin_password | default('') }}"

    - name: dc_local_user
      prompt: "Local Administrator username"
      private: false
      default: "Administrator"

    - name: dc_local_password
      prompt: "Local Administrator password"
      private: true
      default: ""

    - name: populate_ad
      prompt: "Populate AD with demo users/groups/computers after promotion? (yes/no)"
      private: false
      default: "no"

  tasks:

    # ── Hostname facts ────────────────────────────────────────────────────────

    - name: Include colour fallback
      include_tasks: ../../../tasks/colour_fallback.yml
      tags: dc_preflight

    - name: Include hostname facts
      include_tasks: ../../../tasks/hostname_facts.yml
      tags: dc_preflight

    - name: Validate this host is named as a DC (EXADCS<SITE><NNN>)
      assert:
        that:
          - host_role | upper == 'DCS'
        fail_msg: >
          {{ inventory_hostname }} has role '{{ host_role }}' — expected DCS.
          DC onboarding only runs on EXADCS<SITE><NNN> hosts.
          Check the hostname or run the rename playbook first.
        success_msg: "{{ inventory_hostname }} confirmed as DC role ({{ host_role }})"
      tags: dc_preflight

    # ── Load sites.csv ────────────────────────────────────────────────────────

    - name: Load sites.csv
      read_csv:
        path: "{{ sites_csv }}"
      register: dc_sites_raw
      delegate_to: localhost
      become: false
      run_once: true
      tags: dc_preflight

    - name: Build site → subnet lookup
      set_fact:
        dc_sites_map: >-
          {{
            dc_sites_raw.list
            | rejectattr('Site', 'equalto', 'BRD')
            | rejectattr('Subnet', 'equalto', 'N/A')
            | items2dict(key_name='Site', value_name='Subnet')
          }}
      run_once: true
      tags: dc_preflight

    # ── Determine this site's role ────────────────────────────────────────────

    - name: Set dc_site_role fact
      set_fact:
        dc_site_role: >-
          {%- if host_site == (dc_cld_site | default('CLD')) -%}hub_cld
          {%- elif host_site in (dc_hub_sites | default(['FAL', 'ODE', 'BRK'])) -%}hub_primary
          {%- else -%}standard
          {%- endif -%}
      tags: dc_preflight

    - name: Show site role
      debug:
        msg: >
          {{ _c.C }}[*]{{ _c.NC }} {{ inventory_hostname }}
          site={{ host_site }}  role={{ dc_site_role }}
      tags: dc_preflight

    # ── Build replication source list from sites.csv ──────────────────────────
    # IPs come from the DC column of sites.csv (loaded above) so sites.csv is
    # the single source of truth — no IPs hardcoded in playbooks.
    # FQDNs use the operator-confirmed dc_domain_name from the prompt.

    - name: Build hub DC sources from sites.csv DC column and chosen domain name
      set_fact:
        dc_hub_sources:
          - { site: "FAL", ip: "{{ _dc_ips['FAL'] | default('192.168.76.10')  }}", fqdn: "{{ 'exadcsfal001.' + dc_domain_name }}" }
          - { site: "ODE", ip: "{{ _dc_ips['ODE'] | default('192.168.126.10') }}", fqdn: "{{ 'exadcsode001.' + dc_domain_name }}" }
          - { site: "BRK", ip: "{{ _dc_ips['BRK'] | default('192.168.136.10') }}", fqdn: "{{ 'exadcsbrk001.' + dc_domain_name }}" }
        dc_cld_source:
          site: "CLD"
          ip:   "{{ _dc_ips['CLD'] | default('192.168.69.10') }}"
          fqdn: "{{ 'exadcscld001.' + dc_domain_name }}"
      vars:
        _dc_ips: "{{ dc_sites_raw.list | items2dict(key_name='Site', value_name='DC') }}"
      tags: dc_preflight

    # ── Probe candidate replication sources ───────────────────────────────────

    - name: Include replication source resolution
      include_tasks: ../tasks/dc_source_resolution.yml
      tags: dc_preflight

    # ── Credential store (passed forward to promote playbook) ─────────────────

    - name: Store credentials and flags as facts for downstream playbooks
      set_fact:
        dc_domain_name:    "{{ dc_domain_name }}"
        dc_netbios_name:   "{{ dc_netbios_name }}"
        dc_dsrm_password:  "{{ dc_dsrm_password }}"
        dc_admin_user:     "{{ dc_admin_user }}"
        dc_admin_password: "{{ dc_admin_password }}"
        dc_local_user:     "{{ dc_local_user }}"
        dc_local_password: "{{ dc_local_password }}"
        populate_ad:       "{{ populate_ad }}"
      no_log: true
      tags: dc_preflight

    - name: "DSRM password — write it down now"
      debug:
        msg:
          - "{{ _c.R }}╔═══════════════════════════════════════════════════════════════════╗{{ _c.NC }}"
          - "{{ _c.R }}║  DSRM PASSWORD — WRITE IT DOWN AND STORE IT SECURELY NOW          ║{{ _c.NC }}"
          - "{{ _c.R }}║  DSRM (Directory Services Restore Mode) is the ONLY recovery      ║{{ _c.NC }}"
          - "{{ _c.R }}║  path if this domain loses all its DCs or AD becomes corrupted.   ║{{ _c.NC }}"
          - "{{ _c.R }}║  If you lose this password and there is no other working DC,       ║{{ _c.NC }}"
          - "{{ _c.R }}║  the domain is gone. There is no recovery path. Write it down.    ║{{ _c.NC }}"
          - "{{ _c.R }}╚═══════════════════════════════════════════════════════════════════╝{{ _c.NC }}"
      tags: dc_preflight

    # ── Pre-promotion checks ──────────────────────────────────────────────────

    - name: Confirm host is already domain-joined
      ansible.windows.win_shell: |
        (Get-WmiObject Win32_ComputerSystem).PartOfDomain
      register: dc_domain_check
      changed_when: false
      tags: dc_preflight

    - name: FAIL — host must be domain-joined before DC promotion
      fail:
        msg: >
          {{ inventory_hostname }} is not domain-joined.
          Run the 80-domainjoin playbook first, or run the full site.yml
          without --skip-tags bootstrap.
      when:
        - not dc_is_forest_root | default(false)
        - dc_domain_check.stdout | trim | lower != 'true'
      tags: dc_preflight

    - name: Check AD-DS feature not already installed
      ansible.windows.win_shell: |
        (Get-WindowsFeature -Name AD-Domain-Services).InstallState
      register: dc_feature_check
      changed_when: false
      tags: dc_preflight

    - name: Set dc_already_promoted fact
      set_fact:
        dc_already_promoted: >-
          {{ dc_feature_check.stdout | trim | lower in ['installed', 'installedpending'] }}
      tags: dc_preflight

    - name: Note — AD-DS already installed (promote stage will verify state only)
      debug:
        msg: >
          {{ _c.Y }}[!]{{ _c.NC }} AD-DS feature already installed on
          {{ inventory_hostname }} — promotion stage will check state and skip
          if already a DC.
      when: dc_already_promoted
      tags: dc_preflight

    # ── Preflight summary ─────────────────────────────────────────────────────

    - name: Preflight summary
      debug:
        msg:
          - "{{ _c.C }}── DC Preflight Summary ──────────────────────────────────────{{ _c.NC }}"
          - "  Host            : {{ _c.W }}{{ inventory_hostname }}{{ _c.NC }}"
          - "  Domain          : {{ dc_domain_name }}  (NetBIOS: {{ dc_netbios_name }})"
          - "  Site            : {{ host_site }}  (role: {{ dc_site_role }})"
          - "  Forest root?    : {{ _c.Y if dc_is_forest_root | default(false) | bool else _c.G }}{{ 'YES — first DC build' if dc_is_forest_root | default(false) | bool else 'No' }}{{ _c.NC }}"
          - "  Replication src : {{ _c.G }}{{ dc_replication_source | default('N/A') }}{{ _c.NC }}"
          - "  Source site     : {{ dc_source_site | default('N/A') }}"
          - "  Domain-joined   : {{ dc_domain_check.stdout | trim | lower }}"
          - "  AD-DS installed : {{ dc_already_promoted }}"
          - "  Populate AD     : {{ populate_ad }}"
      tags: dc_preflight

    - name: "AD population — additive only, re-run safe"
      debug:
        msg:
          - "{{ _c.Y }}[!]{{ _c.NC }} populate_ad=yes — AD schema/groups/users/computers will run after promotion."
          - "{{ _c.Y }}[!]{{ _c.NC }} These plays are ADDITIVE ONLY. Re-running will NOT wipe or overwrite"
          - "{{ _c.Y }}[!]{{ _c.NC }} existing AD objects. Passwords are set on account creation only — no resets."
          - "{{ _c.Y }}[!]{{ _c.NC }} To remove objects, use ADUC (dsa.msc). There is no automated wipe."
      when: (populate_ad | default('no')) | lower in ['yes', 'y']
      tags: dc_preflight
