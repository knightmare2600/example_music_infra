---
# =============================================================================
# playbooks/20-dc-promote.yml
# Example Music Limited — Domain Controller promotion (dcpromo)
# =============================================================================
# Runs the actual promotion: Install-ADDSDomainController against the
# replication source resolved by 00-dc-preflight.yml, or Install-ADDSForest
# if dc_is_forest_root is true (operator-confirmed first DC in the forest —
# any site, not just CLD; see 00-dc-preflight.yml).
#
# Assumes 10-dc-install-features.yml already installed the AD-DS/DNS/GPMC
# Windows features on this host.
#
# The play is fully idempotent — promotion is skipped if the host is
# already a DC (ProductType == 2). The reboot after promotion is handled
# here; Ansible waits and reconnects before continuing to
# 30-dc-replicate.yml.
#
# DNS management:
#   During promotion the host must resolve {{ dc_domain_name }} to contact the
#   source DC.  Stage 0 checks if the domain is already resolvable; if not,
#   it temporarily sets the NIC DNS to dc_temp_dns_ip (prompted — default
#   pre-filled from dc_replication_source_ip set by 00-dc-preflight.yml).
#   After the post-promotion reboot, DNS is set to 127.0.0.1 (the DC now
#   runs its own DNS) and forwarders are configured:
#     192.168.139.8  — CLD BIND9 (upstream for internal zones we control)
#     9.9.9.9        — Quad9 (public upstream)
#     1.1.1.1        — Cloudflare (public upstream)
#
# Facts consumed (set by 00-dc-preflight.yml):
#   dc_replication_source     — source DC FQDN
#   dc_replication_source_ip  — source DC IP (used as DNS default)
#   dc_is_forest_root         — bool
#   dc_admin_user             — Domain Admin (JUKEBOX\Administrator)
#   dc_admin_password         — Domain Admin password
#   dc_local_user             — Local Administrator username
#   dc_local_password         — Local Administrator password
#   host_site                 — 3-letter site code
#
# Tags: dc_promote
# =============================================================================
# Changelog:
#   2026-06-25  Initial file (as 90-dc-promote.yml, combined with feature
#               install)
#   2026-06-29  Add Stage 0 temporary DNS management (set before promotion,
#               restore to 127.0.0.1 + configure forwarders after reboot);
#               add credential guard assert; add DNS forwarder config post-
#               promotion; standardise hosts: target to windows_dc
#   2026-07-06  Include tasks/colour_fallback.yml first — this play uses
#               {{ _c }} in several msgs but never included hostname_facts.yml,
#               so on ungrouped/ad hoc runs where group_vars/all didn't load,
#               _c was undefined here too.
#   2026-07-06  Renumbered 90 -> 20 and split feature install out into
#               10-dc-install-features.yml — "install the tools" and "run
#               dcpromo" are two distinct major steps under the new
#               00/10/20/30/40 numbering. This file now recomputes dc_is_dc
#               independently (rather than relying solely on the fact
#               carrying over from 10) so it stays safe to run standalone.
# =============================================================================

- name: Windows DC — Promotion (dcpromo)
  hosts: "{{ target | default('windows_dc') }}"
  gather_facts: false

  vars_prompt:
    - name: dc_temp_dns_ip
      prompt: >-
        Temporary DNS IP for AD resolution during promotion
        (leave blank to skip — only needed if the AD domain is not already resolvable.
        Default is the replication source found by preflight)
      private: false
      default: "{{ hostvars[inventory_hostname].dc_replication_source_ip | default('') }}"

  vars:
    dc_site_name: "{{ host_site }}"
    # dc_db_path, dc_log_path, dc_sysvol, dc_dns_forwarders → group_vars/windows_dc/vars.yml
    ansible_user:     "{{ dc_local_user }}"
    ansible_password: "{{ dc_local_password }}"

  tasks:
    - name: Include colour fallback
      include_tasks: ../../../tasks/colour_fallback.yml
      tags: dc_promote

    # ── Guard: credentials must come from preflight ───────────────────────────

    - name: Assert domain credentials are available from preflight
      ansible.builtin.assert:
        that:
          - dc_admin_password is defined
          - dc_admin_password | length > 0
          - dc_local_password is defined
          - dc_local_password | length > 0
        fail_msg: >
          dc_admin_password / dc_local_password are not set.
          Run the full chain via site.yml so 00-dc-preflight.yml fires first.
          To run this stage standalone: -e dc_admin_password=<pw>
          -e dc_local_password=<pw> -e dc_admin_user=<user>
      tags: dc_promote

    # ── Guard: already a DC? ──────────────────────────────────────────────────

    - name: Check if host is already a Domain Controller (ProductType 2)
      ansible.windows.win_shell: |
        (Get-WmiObject Win32_OperatingSystem).ProductType
      register: dc_product_type
      changed_when: false
      tags: dc_promote

    - name: Set dc_is_dc fact
      ansible.builtin.set_fact:
        dc_is_dc: "{{ dc_product_type.stdout | trim == '2' }}"
      tags: dc_promote

    - name: Skip — already a DC
      ansible.builtin.debug:
        msg: >
          {{ _c.G }}[+]{{ _c.NC }} {{ inventory_hostname }} is already a DC
          (ProductType=2) — promotion stages skipped.
      when: dc_is_dc
      tags: dc_promote

    # =========================================================================
    # Stage 0 — Temporary DNS (ensure {{ dc_domain_name }} is resolvable)
    # =========================================================================

    - name: "── Stage 0 — DNS preparation ──"
      ansible.builtin.debug:
        msg: "{{ _c.C }}[*]{{ _c.NC }} Checking DNS resolution of {{ dc_domain_name }}..."
      when: not dc_is_dc
      tags: dc_promote

    - name: "[Stage 0] Check if {{ dc_domain_name }} is already resolvable"
      ansible.windows.win_shell: |
        try {
          Resolve-DnsName {{ dc_domain_name }} -ErrorAction Stop | Out-Null
          Write-Output "resolvable"
        } catch {
          Write-Output "unresolvable"
        }
      register: dc_dns_check
      changed_when: false
      when: not dc_is_dc
      tags: dc_promote

    - name: "[Stage 0] Get default-route NIC alias (for DNS override)"
      ansible.windows.win_shell: |
        (Get-NetRoute -DestinationPrefix '0.0.0.0/0' |
          Sort-Object RouteMetric |
          Select-Object -First 1).InterfaceAlias
      register: dc_default_nic
      changed_when: false
      when:
        - not dc_is_dc
        - dc_dns_check.stdout | trim == 'unresolvable'
        - dc_temp_dns_ip | length > 0
      tags: dc_promote

    - name: "[Stage 0] Set temporary DNS to {{ dc_temp_dns_ip }}"
      ansible.windows.win_shell: |
        Set-DnsClientServerAddress `
          -InterfaceAlias "{{ dc_default_nic.stdout | trim }}" `
          -ServerAddresses "{{ dc_temp_dns_ip }}"
      when:
        - not dc_is_dc
        - dc_dns_check.stdout | trim == 'unresolvable'
        - dc_temp_dns_ip | length > 0
      tags: dc_promote

    - name: "[Stage 0] Re-check {{ dc_domain_name }} after DNS change"
      ansible.windows.win_shell: |
        try {
          Resolve-DnsName {{ dc_domain_name }} -ErrorAction Stop | Out-Null
          Write-Output "resolvable"
        } catch {
          Write-Output "unresolvable"
        }
      register: dc_dns_recheck
      changed_when: false
      when:
        - not dc_is_dc
        - dc_dns_check.stdout | trim == 'unresolvable'
        - dc_temp_dns_ip | length > 0
      tags: dc_promote

    - name: "[Stage 0] FAIL — {{ dc_domain_name }} still not resolvable"
      ansible.builtin.fail:
        msg: >
          {{ _c.R }}[✗]{{ _c.NC }} {{ dc_domain_name }} is not resolvable after
          setting DNS to {{ dc_temp_dns_ip }}.
          Check that {{ dc_temp_dns_ip }} is a reachable DC and that
          the site firewall is not blocking UDP/TCP 53.
      when:
        - not dc_is_dc
        - dc_dns_check.stdout | trim == 'unresolvable'
        - dc_temp_dns_ip | length > 0
        - dc_dns_recheck.stdout | trim == 'unresolvable'
      tags: dc_promote

    - name: "[Stage 0] FAIL — {{ dc_domain_name }} not resolvable and no temp DNS supplied"
      ansible.builtin.fail:
        msg: >
          {{ _c.R }}[✗]{{ _c.NC }} {{ dc_domain_name }} is not resolvable and
          dc_temp_dns_ip was left blank.
          Re-run and enter the IP of an existing DC (e.g. the replication
          source shown in the preflight output) when prompted.
      when:
        - not dc_is_dc
        - dc_dns_check.stdout | trim == 'unresolvable'
        - dc_temp_dns_ip | length == 0
      tags: dc_promote

    - name: "[Stage 0] DNS OK"
      ansible.builtin.debug:
        msg: >
          {{ _c.G }}[+]{{ _c.NC }} {{ dc_domain_name }} is resolvable — DNS preparation complete.
      when: not dc_is_dc
      tags: dc_promote

    # =========================================================================
    # Stage 1a — Forest root install (operator-confirmed first DC only)
    # =========================================================================

    - name: "── Stage 1a — Install-ADDSForest (forest root) ──"
      ansible.builtin.debug:
        msg: >
          {{ _c.Y }}[!]{{ _c.NC }} Building {{ dc_domain_name | upper }} forest root on
          {{ inventory_hostname }} (site={{ host_site }}).
          This is a destructive, one-time operation.
      when:
        - not dc_is_dc
        - dc_is_forest_root | default(false) | bool
      tags: dc_promote

    - name: Promote — Install-ADDSForest (forest root)
      ansible.windows.win_shell: |
        $secDSRM = ConvertTo-SecureString "{{ dc_dsrm_password }}" -AsPlainText -Force
        Import-Module ADDSDeployment
        Install-ADDSForest `
          -DomainName            "{{ dc_domain_name }}" `
          -DomainNetbiosName     "{{ dc_netbios_name }}" `
          -DomainMode            "WinThreshold" `
          -ForestMode            "WinThreshold" `
          -DatabasePath          "{{ dc_db_path }}" `
          -LogPath               "{{ dc_log_path }}" `
          -SysvolPath            "{{ dc_sysvol }}" `
          -SafeModeAdministratorPassword $secDSRM `
          -InstallDns            `
          -NoRebootOnCompletion  `
          -Force                 `
          -Confirm:$false
      register: dc_forest_result
      when:
        - not dc_is_dc
        - dc_is_forest_root | default(false) | bool
      no_log: true
      tags: dc_promote

    - name: Show forest install result
      ansible.builtin.debug:
        msg: >
          {{ _c.G }}[+]{{ _c.NC }} Install-ADDSForest completed.
          Status: {{ dc_forest_result.stdout | default('') | trim }}
      when:
        - not dc_is_dc
        - dc_is_forest_root | default(false) | bool
      tags: dc_promote

    # =========================================================================
    # Stage 1b — Additional DC promotion
    # =========================================================================

    - name: "── Stage 1b — Install-ADDSDomainController (additional DC) ──"
      ansible.builtin.debug:
        msg: >
          {{ _c.C }}[*]{{ _c.NC }} Promoting {{ inventory_hostname }} as
          additional DC, replicating from {{ dc_replication_source }}.
      when:
        - not dc_is_dc
        - not dc_is_forest_root | default(false) | bool
      tags: dc_promote

    - name: Promote — Install-ADDSDomainController (additional DC)
      ansible.windows.win_shell: |
        $secAdmin = ConvertTo-SecureString "{{ dc_admin_password }}" -AsPlainText -Force
        $secDSRM  = ConvertTo-SecureString "{{ dc_dsrm_password }}" -AsPlainText -Force
        $cred     = New-Object System.Management.Automation.PSCredential(
                      "{{ dc_admin_user }}", $secAdmin)
        Import-Module ADDSDeployment
        Install-ADDSDomainController `
          -DomainName                    "{{ dc_domain_name }}" `
          -Credential                    $cred `
          -ReplicationSourceDC           "{{ dc_replication_source }}" `
          -SiteName                      "{{ dc_site_name }}" `
          -DatabasePath                  "{{ dc_db_path }}" `
          -LogPath                       "{{ dc_log_path }}" `
          -SysvolPath                    "{{ dc_sysvol }}" `
          -SafeModeAdministratorPassword $secDSRM `
          -InstallDns                    `
          -NoRebootOnCompletion          `
          -Force                         `
          -Confirm:$false
      register: dc_promote_result
      when:
        - not dc_is_dc
        - not dc_is_forest_root | default(false) | bool
      no_log: true
      tags: dc_promote

    - name: Show promotion result
      ansible.builtin.debug:
        msg: >
          {{ _c.G }}[+]{{ _c.NC }} Install-ADDSDomainController completed.
          Status: {{ dc_promote_result.stdout | default('') | trim }}
      when:
        - not dc_is_dc
        - not dc_is_forest_root | default(false) | bool
      tags: dc_promote

    # ── Reboot after promotion ────────────────────────────────────────────────

    - name: Reboot after promotion (required)
      ansible.windows.win_reboot:
        reboot_timeout:    900
        post_reboot_delay: 90
        connect_timeout:   60
        msg: "Rebooting after Domain Controller promotion"
      when: not dc_is_dc
      tags: dc_promote

    # =========================================================================
    # Stage 2 — Post-promotion: DC confirmation + DNS restore + forwarders
    # =========================================================================

    - name: "── Stage 2 — Post-promotion DNS and forwarder configuration ──"
      ansible.builtin.debug:
        msg: "{{ _c.C }}[*]{{ _c.NC }} Configuring DNS after promotion reboot..."
      when: not dc_is_dc
      tags: dc_promote

    - name: Confirm host is now a DC post-reboot
      ansible.windows.win_shell: |
        (Get-WmiObject Win32_OperatingSystem).ProductType
      register: dc_post_type
      changed_when: false
      tags: dc_promote

    - name: FAIL — host ProductType is still not 2 after promotion and reboot
      ansible.builtin.fail:
        msg: >
          {{ inventory_hostname }} ProductType={{ dc_post_type.stdout | trim }}
          after promotion reboot — expected 2 (Domain Controller).
          Check the Windows Event Log (System + Directory Services) for errors.
      when:
        - not dc_is_dc
        - dc_post_type.stdout | trim != '2'
      tags: dc_promote

    - name: "[Stage 2] Set NIC DNS to 127.0.0.1 (DC runs its own DNS now)"
      ansible.windows.win_shell: |
        $iface = (Get-NetRoute -DestinationPrefix '0.0.0.0/0' |
          Sort-Object RouteMetric |
          Select-Object -First 1).InterfaceAlias
        Set-DnsClientServerAddress -InterfaceAlias $iface -ServerAddresses "127.0.0.1"
      when: not dc_is_dc
      tags: dc_promote

    - name: "[Stage 2] Configure DNS forwarders (upstream for non-local zones)"
      ansible.windows.win_shell: |
        Import-Module DnsServer
        Set-DnsServerForwarder `
          -IPAddress @("{{ dc_dns_forwarders | join('","') }}") `
          -PassThru
      register: dc_forwarder_result
      when: not dc_is_dc
      tags: dc_promote

    - name: "[Stage 2] Show forwarder config"
      ansible.builtin.debug:
        msg: >
          {{ _c.G }}[+]{{ _c.NC }} DNS forwarders set: {{ dc_dns_forwarders | join(', ') }}
      when: not dc_is_dc
      tags: dc_promote

    - name: Promotion confirmed
      ansible.builtin.debug:
        msg: >
          {{ _c.G }}[+]{{ _c.NC }} {{ inventory_hostname }} is now a Domain
          Controller (ProductType=2). DNS restored to 127.0.0.1.
      tags: dc_promote
