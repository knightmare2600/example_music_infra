---
# =============================================================================
# playbooks/40-dc-summary.yml
# Example Music Limited — Domain Controller post-build summary
# =============================================================================
# Runs dcdiag, netlogon/SYSVOL share checks, DNS SRV record verification
# and prints a colourised build report.  Non-fatal — all checks emit
# warnings rather than aborting so the operator gets a full picture.
#
# Tags: dc_summary
# =============================================================================
# Changelog:
#   2026-06-25  Initial file
#   2026-07-04  Connect via SSH as Local Administrator (dc_local_user/
#               dc_local_password) instead of the ansible service account —
#               fresh/CLD-first-build hosts don't yet trust the ansible SSH
#               key. ansible_user/ansible_password set per-play; Ansible's
#               SSH plugin switches to sshpass-based password auth
#               automatically once ansible_password is present, no
#               ansible.cfg changes needed. Requires sshpass installed on
#               the control node.
#   2026-07-06  Include tasks/colour_fallback.yml before hostname facts —
#               on ungrouped/ad hoc runs group_vars/all doesn't load, so
#               {{ _c }} used throughout this play's msgs was undefined.
#   2026-07-06  Set ansible_connection/shell_type/port explicitly (see
#               00-dc-preflight.yml) — group_vars/windows_nodes/
#               connection.yml is inventory-group-gated and doesn't apply
#               on ungrouped/ad hoc runs, which broke every win_* task here.
#   2026-07-09  Added the "Next step — populate AD" task: prints the actual
#               windows_adschema/site.yml follow-up command when
#               populate_ad=yes was answered at preflight. This is now the
#               only place that command is surfaced — see windows_dc/
#               site.yml's changelog for why it can't be auto-chained.
# =============================================================================

- name: Windows DC — Post-build health summary
  hosts: "{{ target | default('windows_dc') }}"
  gather_facts: false

  vars:
    # ansible_connection/shell_type/port: see 00-dc-preflight.yml — set here
    # too since group_vars/windows_nodes/connection.yml is inventory-group-
    # gated and won't apply on ungrouped/ad hoc runs.
    ansible_connection: ssh
    ansible_shell_type: powershell
    ansible_port:       22
    ansible_user:       "{{ dc_local_user }}"
    ansible_password:   "{{ dc_local_password }}"

  tasks:

    - name: Include colour fallback
      include_tasks: ../../../tasks/colour_fallback.yml
      tags: dc_summary

    - name: Include hostname facts
      include_tasks: ../../../tasks/hostname_facts.yml
      tags: dc_summary

    # ── dcdiag ────────────────────────────────────────────────────────────────

    - name: "── dcdiag /test:replications /test:dns /test:fsmo ──"
      ansible.windows.win_shell: |
        dcdiag /test:replications /test:dns /test:fsmo /test:netlogons 2>&1
      register: dc_dcdiag
      changed_when: false
      ignore_errors: true
      tags: dc_summary

    - name: Count dcdiag failures
      set_fact:
        dc_dcdiag_fail_count: >-
          {{
            dc_dcdiag.stdout_lines
            | select('search', '(?i)failed|error')
            | list | length
          }}
      tags: dc_summary

    # ── DNS SRV record check ──────────────────────────────────────────────────

    - name: Check _ldap._tcp SRV record exists for this DC
      ansible.windows.win_shell: |
        $srv = Resolve-DnsName -Name "_ldap._tcp.{{ dc_domain_name }}" -Type SRV -ErrorAction SilentlyContinue
        if ($srv) {
          $match = $srv | Where-Object { $_.NameTarget -like "$env:COMPUTERNAME*" }
          if ($match) { "OK" } else { "MISSING_FOR_THIS_DC" }
        } else {
          "NO_SRV_RECORDS"
        }
      register: dc_dns_srv
      changed_when: false
      tags: dc_summary

    # ── SYSVOL content spot-check ─────────────────────────────────────────────

    - name: Check SYSVOL contains domain policies directory
      ansible.windows.win_shell: |
        $sysvol = "C:\Windows\SYSVOL\sysvol\{{ dc_domain_name }}\Policies"
        if (Test-Path $sysvol) {
          $count = (Get-ChildItem $sysvol -Directory).Count
          Write-Output "OK:$count"
        } else {
          Write-Output "MISSING"
        }
      register: dc_sysvol_content
      changed_when: false
      tags: dc_summary

    # ── Collect DC info ───────────────────────────────────────────────────────

    - name: Collect DC info
      ansible.windows.win_shell: |
        Import-Module ActiveDirectory
        $dc = Get-ADDomainController -Identity $env:COMPUTERNAME
        [PSCustomObject]@{
          Name            = $dc.Name
          Site            = $dc.Site
          IsGC            = $dc.IsGlobalCatalog
          IsReadOnly      = $dc.IsReadOnly
          IPv4            = $dc.IPv4Address
          OSVersion       = $dc.OperatingSystem
          Domain          = $dc.Domain
        } | ConvertTo-Json
      register: dc_info_raw
      changed_when: false
      ignore_errors: true
      tags: dc_summary

    - name: Parse DC info
      set_fact:
        dc_info: "{{ dc_info_raw.stdout | from_json }}"
      when: dc_info_raw.rc == 0 and dc_info_raw.stdout | trim != ''
      tags: dc_summary

    # ── Print summary ─────────────────────────────────────────────────────────

    # 2026-09-25, Robert, live (EXADCSGOT001): the closed-box style below (╔/╠/╚ borders)
    # never actually closed on the right -- every content line only ever had the left ║,
    # no matching right-side wall or padding, so it rendered as a box missing its whole
    # right side. A real right wall here would need per-line padding computed against
    # RENDERED length (dc_info.OSVersion, dcdiag output text, etc. all vary a lot, and the
    # _c.* ANSI colour codes interleaved in most lines count toward Jinja's own string
    # length without taking any visible width, so naive padding math would be wrong too).
    # Switched to the same open-rule style windows_bootstrap/00-preflight.yml's own
    # "[I] Pre-flight complete" summary already uses successfully for exactly this kind of
    # variable-width content -- no right wall to keep in sync, so it can't misalign.
    - name: DC build summary
      debug:
        msg:
          - ""
          - "{{ _c.C }}════════════════════════════════════════════════════════════{{ _c.NC }}"
          - "  {{ _c.W }}Domain Controller Build Summary{{ _c.NC }}"
          - "{{ _c.C }}════════════════════════════════════════════════════════════{{ _c.NC }}"
          - "  Host            : {{ _c.W }}{{ inventory_hostname }}{{ _c.NC }}"
          - "  Site            : {{ host_site }}"
          - "  IP              : {{ dc_info.IPv4 | default('unknown') }}"
          - "  AD Site         : {{ dc_info.Site | default('unknown') }}"
          - "  Global Catalog  : {{ _c.G if dc_info.IsGC | default(false) else _c.Y }}{{ dc_info.IsGC | default('unknown') }}{{ _c.NC }}"
          - "  Read-Only DC    : {{ dc_info.IsReadOnly | default('unknown') }}"
          - "  OS              : {{ dc_info.OSVersion | default('unknown') }}"
          - "  Domain          : {{ dc_info.Domain | default('unknown') }}"
          - "  Repl source     : {{ dc_replication_source | default('N/A — forest root or run standalone') }}"
          - "{{ _c.C }}────────────────────────────────────────────────────────────{{ _c.NC }}"
          - "  {{ _c.W }}Health Checks{{ _c.NC }}"
          - "  dcdiag failures : {{ _c.G if dc_dcdiag_fail_count | int == 0 else _c.R }}{{ dc_dcdiag_fail_count }}{{ _c.NC }}"
          - "  DNS SRV record  : {{ _c.G if dc_dns_srv.stdout | trim == 'OK' else _c.Y }}{{ dc_dns_srv.stdout | trim }}{{ _c.NC }}"
          - "  SYSVOL/Policies : {{ _c.G if dc_sysvol_content.stdout | trim | regex_search('^OK') else _c.R }}{{ dc_sysvol_content.stdout | trim }}{{ _c.NC }}"
          - "{{ _c.C }}────────────────────────────────────────────────────────────{{ _c.NC }}"
          - "  {{ _c.Y }}Next steps{{ _c.NC }}"
          - "  1. Verify in ADUC / AD Sites & Services"
          - "  2. Confirm subnet {{ host_site }} mapped to correct AD site object"
          - "  3. Review FSMO placement if this is a hub site"
          - "  4. If this is a 2nd+ DC at this site, add it to devices.csv"
          - "     (a site's 1st DC is auto-derived, no devices.csv row needed)"
          - "  5. Update BIND9 DNS (run bind9-dns.yml --tags zones-full,reload)"
          - "{{ _c.C }}════════════════════════════════════════════════════════════{{ _c.NC }}"
      tags: dc_summary

    - name: Full dcdiag output (review if failures above)
      debug:
        msg: "{{ dc_dcdiag.stdout_lines }}"
      when: dc_dcdiag_fail_count | int > 0
      tags: dc_summary

    # ── AD population follow-up ─────────────────────────────────────────────
    # populate_ad (set as a fact on this host in 00-dc-preflight.yml) is
    # NOT auto-chained -- see windows_dc/site.yml's own changelog for why
    # that's structurally impossible with import_playbook. This is the
    # single place that tells the operator the actual next command.

    - name: "Next step — populate AD"
      debug:
        msg:
          - "{{ _c.Y }}[!]{{ _c.NC }} populate_ad=yes was answered at preflight — run this next:"
          - "{{ _c.W }}    ansible-playbook playbooks/windows_adschema/site.yml \\{{ _c.NC }}"
          - "{{ _c.W }}      -e populate_ad=yes -e ad_target={{ inventory_hostname }} --ask-vault-pass{{ _c.NC }}"
      when: (populate_ad | default('no')) | lower in ['yes', 'y']
      tags: dc_summary
