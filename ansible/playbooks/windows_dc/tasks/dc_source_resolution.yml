---
# =============================================================================
# tasks/dc_source_resolution.yml
# Example Music Limited — DC replication source resolution
# =============================================================================
# Probes candidate DCs and sets:
#   dc_replication_source  — FQDN or IP to replicate from
#   dc_source_site         — 3-letter site code of chosen source
#   dc_is_forest_root      — true only when NO DC is reachable anywhere AND
#                            the operator confirms this is genuinely the
#                            first DC ever built for the forest. This is
#                            NOT tied to site — any site can be the forest
#                            root; the site name has no bearing on it.
#
# Candidates (2026-09-25 rework, see this file's own changelog): every real
# (non-Planned) devices.csv DCS row, excluding self, probed in devices.csv's own
# order -- no site-role-based priority any more. AD is multi-master: any reachable,
# already-promoted DC is a valid replication source, so there's nothing to encode
# about which site "should" be preferred, and hardcoding one (the pre-2026-09-25
# version of this file assumed CLD/FAL/ODE/BRK, none of which turned out to
# actually be promoted) just recreates a single point of failure that doesn't
# reflect real AD semantics.
#
# 2026-09-28: devices.csv's real-DCS-row signal alone stopped covering every genuine
# DC the moment a standard site's own DCS (first case: GOT) stopped carrying an
# explicit row at all once built -- see this file's own 2026-09-28 changelog entry
# below. Candidates are now the UNION of devices.csv's real DCS rows and
# ad_computers.json's Enabled: true DCS records, deduped by site.
#
# If none of a site's candidates are reachable, dc_is_forest_root is decided
# from dc_is_first_in_forest — answered upfront at the vars_prompt in
# 00-dc-preflight.yml, not asked interactively mid-play here. "yes" sets
# dc_is_forest_root=true regardless of site; "no" (the default) aborts the
# play, since there is then no replication source and no confirmed forest
# build. A reachable candidate always wins regardless of the answer — this
# task only consults dc_is_first_in_forest when nothing was reachable.
#
# Probing is done from the Ansible control node (delegate_to: localhost)
# via a TCP port-check to 389 (LDAP).  This avoids WinRM/SSH round-trips
# for hosts that haven't been promoted yet, and works regardless of whether
# the target DC has Ansible connectivity.
# =============================================================================
# Changelog:
#   2026-09-28  Found live, checking this file before CLD's own DC build: GOT's own
#               devices.csv row was retired the same day (matching FAL/CLY/GLA's
#               convention that a standard site's own DCS never gets an explicit row --
#               see check_ad_data_integrity.py's matching fix), which silently dropped
#               GOT out of --emit-devices-json's "Real": true set entirely (confirmed:
#               a fresh run showed GOT as "Real": false despite being a genuine,
#               dcdiag-confirmed DC). Added a second candidate source, ad_computers.json's
#               own Enabled: true DCS records (the same file 40-ad-computers.yml already
#               treats as authoritative) -- FRD/VRK/GOT all carry one regardless of
#               whether devices.csv has a row for them, so this covers every real DC
#               again without reintroducing a devices.csv row nothing else needs.
#   2026-09-25  Robert, questioning why this was hardcoded at all: retired the
#               site-role-gated [CLD,FAL,ODE,BRK] candidate list entirely. Confirmed live
#               (EXADCSCLD001: DomainRole=2, AD-Domain-Services not installed) that the
#               assumed hub DCs were never actually built -- meaning EXADCSFRD001 (the
#               only DC in the estate with confirmed dcdiag PASS) was structurally
#               unreachable as a candidate for any other site's promotion, since it never
#               appeared in dc_hub_sources/dc_cld_source at all. Candidates are now built
#               directly from devices.csv's real DCS rows (generate_inventory.py
#               --emit-devices-json, same merged-device-list mechanism bind9-dns.yml
#               already uses, so this can never disagree with DNS about which DCs are
#               real) -- self excluded by exact Hostname match rather than the old
#               host_num=='001' heuristic, which is both simpler and more correct (it
#               only ever protected the "standard site's own local DC" case; a hub site
#               re-promoting itself had no equivalent guard, just accidentally never hit
#               it because of how dc_hub_sources/dc_cld_source happened to be assembled
#               per role). dc_site_role is now informational only -- see
#               00-dc-preflight.yml's own changelog.
#   2026-07-28  Added ansible_shell_type: sh alongside the existing ansible_connection: local
#               override -- found live, same bug class as
#               ansible/tasks/example_music_freshness_gate.yml's own changelog: the connection
#               override alone doesn't reset ansible_shell_type, and windows_nodes' inherited
#               ansible_shell_type: powershell made this task fail with "PowerShell: not found"
#               (masked by ignore_errors: true) instead of ever actually probing candidate DCs.
#   2026-06-25  Initial file
#   2026-07-06  Forest-root eligibility was hardcoded to dc_site_role ==
#               'hub_cld' (i.e. only the CLD site could ever become forest
#               root; FAL/ODE/BRK/standard aborted outright with no
#               reachable source). That's wrong — which site is built first
#               is an operational fact, not something derivable from the
#               site code. Replaced the automatic role-based branch with an
#               interactive pause asking the operator "Is this the first DC
#               in the AD Forest?" when no candidate is reachable, for any
#               site role.
#   2026-07-06  Standard-site probe order now includes CLD first: CLD → FAL
#               → ODE → BRK. Previously standard sites never probed CLD at
#               all (only the hub_primary sites did, plus CLD itself is
#               excluded as a source elsewhere), skipping a potentially
#               reachable, canonical source.
#   2026-07-06  Replaced the interactive mid-play pause ("Is this the first
#               DC in the AD Forest?") with dc_is_first_in_forest, a
#               vars_prompt answered upfront in 00-dc-preflight.yml
#               alongside the other operator prompts. Asking mid-play, after
#               several tasks had already printed output, was a worse UX
#               than bundling every question the operator has to answer at
#               the top of the run. The probe-then-decide logic is
#               unchanged — a reachable candidate still always wins over
#               the answer.
# =============================================================================

# ── Build candidate list based on site role ───────────────────────────────────

- name: "[Source] Compute merged device list via generate_inventory.py"
  command: >
    python3 {{ playbook_dir }}/../../../../benarbejde/generate_inventory.py
    {{ sites_csv }} --devices {{ devices_csv }} --emit-devices-json
  register: _dc_all_devices_raw
  changed_when: false
  delegate_to: localhost
  become: false
  vars:
    # Same connection/shell_type override every other delegate_to: localhost task in
    # this play family needs -- see "[Source] Probe each candidate DC" below, or
    # windows_bootstrap/00-preflight.yml's 2026-07-15/2026-07-28 changelog entries for
    # the underlying bug class (windows_nodes' ansible_shell_type: powershell otherwise
    # leaks into this task even though it runs locally on the Linux control node).
    ansible_connection: local
    ansible_shell_type: sh

- name: "[Source] Build candidate list from devices.csv's real DCS rows"
  set_fact:
    dc_candidates: >-
      {{ dc_candidates | default([]) + [{
        'site': item.Site,
        'ip':   item.full_ip,
        'fqdn': (item.Hostname | lower) + '.' + dc_domain_name
      }] }}
  loop: >-
    {{
      (_dc_all_devices_raw.stdout | from_json)
      | selectattr('Type', 'equalto', 'DCS')
      | selectattr('Real', 'equalto', true)
      | rejectattr('Hostname', 'equalto', inventory_hostname | upper)
      | list
    }}
  # selectattr('Real', 'equalto', true) is load-bearing, not defensive-only: DCS is a
  # standard-slot type (every site is assumed to eventually have one at .10), so
  # --emit-devices-json's output is EVERY site's DCS entry, 56 of them at the time this
  # was written -- only 2 (FRD, VRK) genuinely real. Without this filter, GOT's own
  # promotion probed 54 doomed candidates before ever reaching a real one -- caught by
  # actually rendering this against real production devices.csv data before wiring it
  # in, not assumed. See generate_inventory.py's own 2026-09-25 changelog entry for the
  # "Real" field this depends on.
  loop_control:
    label: "{{ item.Hostname }}"

# 2026-09-28: devices.csv's "Real" flag alone is no longer sufficient -- it comes only from
# an explicit devices.csv row, and a standard site's own DCS (GOT, and any future non-
# NON_STANDARD_SITES build) deliberately never gets one once built (see
# generate_inventory.is_standard_synthesis_excluded(), added the same day, and
# check_ad_data_integrity.py's matching fix). GOT's own devices.csv row was retired as
# part of that fix, which silently dropped it out of --emit-devices-json's "Real": true
# set entirely -- found live, before it could bite CLD's own promotion, by checking a
# fresh --emit-devices-json run showed GOT as "Real": false despite being a genuine,
# dcdiag-confirmed DC. ad_computers.json (the same file 40-ad-computers.yml already
# treats as authoritative) is the second, correct source for this: FRD/VRK/GOT all carry
# Enabled: true DCS records there regardless of whether devices.csv has a row for them.
- name: "[Source] Load ad_computers.json (same file 40-ad-computers.yml treats as authoritative)"
  set_fact:
    _dc_ad_computers: "{{ lookup('file', ad_computers_json) | from_json }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_connection: local
    ansible_shell_type: sh

- name: "[Source] Add ad_computers.json's own real (Enabled: true) DCS records as candidates too"
  set_fact:
    dc_candidates: >-
      {{ dc_candidates + [{
        'site': item.Site,
        'ip':   item.IPv4Address,
        'fqdn': item.DNSHostName | lower
      }] }}
  loop: >-
    {{
      _dc_ad_computers
      | selectattr('Role', 'equalto', 'DCS')
      | selectattr('Enabled', 'equalto', true)
      | rejectattr('Name', 'equalto', inventory_hostname | upper)
      | rejectattr('Site', 'in', dc_candidates | map(attribute='site') | list)
      | list
    }}
  # rejectattr('Site', 'in', ...) dedupes against the devices.csv-derived list above --
  # FRD/VRK appear in both sources (they have a real devices.csv row AND an Enabled:
  # true ad_computers.json record), and this list is evaluated once, up front, against
  # dc_candidates' pre-loop value, so it correctly skips them here rather than adding a
  # second, duplicate candidate for the same site.
  loop_control:
    label: "{{ item.Name }}"

- name: "[Source] Show candidate list"
  debug:
    msg: >
      {{ _c.C }}[*]{{ _c.NC }} Probing {{ dc_candidates | length }} candidate(s):
      {{ dc_candidates | map(attribute='fqdn') | join(', ') }}

# ── Probe candidates — TCP 389 from control node ─────────────────────────────

- name: "[Source] Probe each candidate DC — LDAP port 389"
  command: >
    bash -c 'timeout 3 bash -c "echo >/dev/tcp/{{ item.ip }}/389" 2>/dev/null
    && echo reachable || echo unreachable'
  register: dc_probe_results
  loop: "{{ dc_candidates }}"
  loop_control:
    label: "{{ item.site }} ({{ item.ip }})"
  changed_when: false
  delegate_to: localhost
  become: false
  ignore_errors: true
  vars:
    # Without this, delegate_to: localhost does not run locally -- the group
    # ansible_connection: ssh from group_vars/windows_nodes/connection.yml
    # applies here too, outranking implicit localhost's own
    # ansible_connection: local default, so Ansible would try to SSH from
    # the control node to itself as the Windows Administrator user. See
    # windows_bootstrap/playbooks/00-preflight.yml's 2026-07-15 changelog for
    # the live failure this exact pattern caused there. ansible_shell_type: sh
    # is a second, separate override needed alongside it -- ansible_connection:
    # local alone doesn't reset ansible_shell_type, and windows_nodes'
    # ansible_shell_type: powershell makes this task try to dispatch via
    # PowerShell even while running locally on this Linux control node --
    # found live 2026-07-28, see example_music_freshness_gate.yml's changelog
    # for the first instance of this exact bug class.
    ansible_connection: local
    ansible_shell_type: sh

- name: "[Source] Show probe results"
  debug:
    msg: >
      {{ _c.C }}[*]{{ _c.NC }}
      {{ item.item.site }} {{ item.item.ip }}
      → {{ _c.G if item.stdout | trim == 'reachable' else _c.R }}
        {{ item.stdout | trim }}{{ _c.NC }}
  loop: "{{ dc_probe_results.results }}"
  loop_control:
    label: "{{ item.item.site }}"

# ── Select first reachable source ─────────────────────────────────────────────

- name: "[Source] Select first reachable DC as replication source"
  set_fact:
    dc_replication_source:    "{{ item.item.fqdn }}"
    dc_replication_source_ip: "{{ item.item.ip }}"
    dc_source_site:           "{{ item.item.site }}"
    dc_is_forest_root:        false
  loop: "{{ dc_probe_results.results }}"
  loop_control:
    label: "{{ item.item.site }}"
  when:
    - item.stdout | trim == 'reachable'
    - dc_replication_source is not defined
  no_log: false

- name: "[Source] NOTE — a replication source was found despite dc_is_first_in_forest=yes"
  debug:
    msg: >
      {{ _c.Y }}[!]{{ _c.NC }} You answered "yes" to "Is this the first DC in
      the AD Forest?" at preflight, but {{ dc_replication_source }} answered
      on TCP/389 — proceeding as an additional DC replicating from it, not
      as a forest root. If that's wrong, check {{ dc_replication_source }}
      before continuing.
  when:
    - dc_replication_source is defined
    - dc_replication_source != ""
    - (dc_is_first_in_forest | default('no') | trim | lower) in ['y', 'yes']

# ── Handle no reachable source ────────────────────────────────────────────────

- name: "[Source] No reachable DC found — use dc_is_first_in_forest from preflight prompt"
  set_fact:
    dc_replication_source: ""
    dc_source_site:        ""
    dc_is_forest_root:     "{{ (dc_is_first_in_forest | default('no') | trim | lower) in ['y', 'yes'] }}"
  when: dc_replication_source is not defined

- name: "[Source] ABORT — no reachable source and not confirmed as forest root"
  fail:
    msg: >
      {{ _c.R }}[✗]{{ _c.NC }} No replication source DC is reachable for
      {{ inventory_hostname }} (site={{ host_site }}, role={{ dc_site_role }})
      and dc_is_first_in_forest was not answered "yes" at the preflight prompt.
      Probed: {{ dc_candidates | map(attribute='ip') | join(', ') }}.
      Check network connectivity, or re-run and answer "yes" to
      "Is this the first DC in the AD Forest?" if this is genuinely the
      first DC being built for this forest.
  when:
    - dc_replication_source == ""
    - not dc_is_forest_root | bool

- name: "[Source] No existing DC found — will build forest root"
  debug:
    msg: >
      {{ _c.Y }}[!]{{ _c.NC }} {{ inventory_hostname }} (site={{ host_site }}):
      no existing DC reachable, and confirmed as the first DC in the forest.
      This run will install the AD-DS forest root (Install-ADDSForest).
  when:
    - dc_replication_source == ""
    - dc_is_forest_root | bool

- name: "[Source] Confirmed replication source"
  debug:
    msg: >
      {{ _c.G }}[+]{{ _c.NC }} Replication source resolved:
      {{ _c.W }}{{ dc_replication_source }}{{ _c.NC }}
      (site={{ dc_source_site }})
  when: not dc_is_forest_root | default(false) | bool
