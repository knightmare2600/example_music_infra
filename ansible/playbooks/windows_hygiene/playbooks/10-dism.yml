---
# =============================================================================
# playbooks/10-dism.yml
# Example Music Limited — Windows hygiene: DISM component store cleanup
# =============================================================================
# WARNING: ResetBase removes the ability to uninstall Windows Updates.
# This is correct for managed estate hosts — updates are controlled via
# WSUS/policy, not rolled back manually.
# Runs async — DISM can take 10-30 minutes on a loaded system.
#
# Usage:
#   ansible-playbook -i configs/inventory playbooks/windows_hygiene/playbooks/10-dism.yml
#
# Tags: dism
# =============================================================================
# Changelog:
#   2026-10-10  Added the {{ _c }} colour-coded [*]/[+]/[!] convention already used
#               throughout windows_dc/windows_bootstrap/proxmox -- this whole module had
#               never adopted it (Robert, sweep across every file in this family). The
#               section header stays in the colour-coded debug msg content, not the task's
#               own name: -- every real precedent elsewhere in the repo does it that way,
#               never the reverse (checked before committing to this, not assumed).
#   2026-07-06  Initial file — extracted from site.yml (was a single
#               monolithic play) for consistency with the numbered
#               00-preflight/major-step-of-10 convention used by
#               windows_dc and windows_bootstrap.
# =============================================================================

- name: Windows hygiene — DISM component cleanup
  hosts: "{{ target_hosts | default(target | default('all')) }}"
  gather_facts: false
  tasks:

    - name: Include colour fallback
      include_tasks: ../../../tasks/colour_fallback.yml
      tags: always

    - name: "── DISM — component cleanup + ResetBase ──"
      debug:
        msg:
          - "{{ _c.C }}── DISM — component cleanup + ResetBase ──{{ _c.NC }}"
          - "{{ _c.Y }}[!]{{ _c.NC }} Running DISM StartComponentCleanup /ResetBase — this can take 10-30 minutes. Do not interrupt."
      tags: dism

    - name: Run DISM component cleanup and ResetBase
      ansible.windows.win_shell: |
        DISM.exe /online /Cleanup-Image /StartComponentCleanup /ResetBase
      async:        1800
      poll:         30
      changed_when: true
      tags: dism
