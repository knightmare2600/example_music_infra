---
# =============================================================================
# windows_hygiene/site.yml
# Example Music Limited — Post-build Windows cleanup and optimisation
# =============================================================================
# Intended for: any Windows host after bootstrap (servers, desktops, laptops).
# Safe to re-run — all tasks are idempotent except DISM (harmless repeat).
#
# Playbook order (00 = preflight, "before take off"; major steps of 10):
#   00-preflight               Chassis/OS detection (is_laptop, is_server)
#   10-dism                    DISM component store cleanup + ResetBase
#   20-hibernation-pagefile    Hibernation by chassis type + pagefile clear
#   30-choco                   Chocolatey upgrade all + WinDirStat + SDelete
#   40-winupdate               PSWindowsUpdate module + Windows Update
#   50-summary                 Print summary
#
# Chassis detection (00-preflight.yml) is done at runtime via WMI — no
# group_vars or inventory grouping required.
# Laptop chassis types: 9 (Laptop), 10 (Notebook), 14 (Sub-Notebook),
#                       30 (Tablet), 31 (Convertible), 32 (Detachable)
#
# Usage:
#   ansible-playbook playbooks/windows_hygiene/site.yml \
#     -i <host>, -e target_hosts=<host>
#
#   Or against inventory group:
#   ansible-playbook playbooks/windows_hygiene/site.yml \
#     -i configs/inventory -e target_hosts=windows_servers
#
#   DISM only:
#   ansible-playbook playbooks/windows_hygiene/site.yml \
#     -i <host>, -e target_hosts=<host> --tags dism
#
#   Skip DISM (quick hygiene pass):
#   ansible-playbook playbooks/windows_hygiene/site.yml \
#     -i <host>, -e target_hosts=<host> --skip-tags dism
#
# Standalone plays can also be run directly without site.yml, e.g.:
#   ansible-playbook playbooks/windows_hygiene/playbooks/30-choco.yml \
#     -i configs/inventory
# (20-hibernation-pagefile.yml and 50-summary.yml need 00-preflight.yml's
# facts — run those together, or via site.yml, rather than standalone.)
#
# Tags: preflight, dism, hibernation, pagefile, choco, winupdate, summary
# =============================================================================
# Changelog:
#   2026-07-02  Initial file
#   2026-07-06  Add Chocolatey upgrade, WinDirStat, SDelete, PSWindowsUpdate/Windows Update
#   2026-07-06  Split the single monolithic play into numbered standalone
#               playbooks/NN-*.yml files, matching the 00-preflight/
#               major-step-of-10 convention used by windows_dc and
#               windows_bootstrap. Tag names are unchanged (a Zabbix
#               template at docs/zabbix_templates/WindowsHygiene.xml
#               references "windows_hygiene/site.yml --tags pagefile" by
#               name, so that usage keeps working unmodified).
# =============================================================================

- import_playbook: playbooks/00-preflight.yml
  tags: preflight

- import_playbook: playbooks/10-dism.yml
  tags: dism

- import_playbook: playbooks/20-hibernation-pagefile.yml
  tags: [hibernation, pagefile]

- import_playbook: playbooks/30-choco.yml
  tags: choco

- import_playbook: playbooks/40-winupdate.yml
  tags: winupdate

- import_playbook: playbooks/50-summary.yml
  tags: summary
