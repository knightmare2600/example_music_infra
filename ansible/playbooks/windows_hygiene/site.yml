---
# =============================================================================
# windows_hygiene/site.yml
# Example Music Limited — Post-build Windows cleanup and optimisation
# =============================================================================
# Intended for: any Windows host after bootstrap (servers, desktops, laptops).
# Safe to re-run — all tasks are idempotent except DISM (harmless repeat).
#
# Playbook order (00 = preflight, "before take off"; major steps of 10):
#   00-preflight               Chassis/OS detection (is_laptop, is_server)
#   05-example-music-files     Deploy sites.csv/devices.csv/etc + nodeinfo.json
#                              to C:\ProgramData\ExampleMusic\Config (Robert's
#                              ask, 2026-09-25 -- see that file's own header)
#   10-dism                    DISM component store cleanup + ResetBase
#   20-hibernation-pagefile    Hibernation by chassis type + pagefile clear
#   30-choco                   Chocolatey upgrade all + WinDirStat + SDelete
#   35-winupdate-policy        Set Windows Update to manual download/install
#                              (Robert's ask, 2026-10-10 -- stops background
#                              updates/reboots interfering with Ansible runs)
#   40-winupdate               PSWindowsUpdate module + Windows Update
#   50-summary                 Print summary
#
# Chassis detection (00-preflight.yml) is done at runtime via WMI — no
# group_vars or inventory grouping required.
# Laptop chassis types: 9 (Laptop), 10 (Notebook), 14 (Sub-Notebook),
#                       30 (Tablet), 31 (Convertible), 32 (Detachable)
#
# Usage (this family has no day-0/bare-IP case of its own -- it only ever
# runs against hosts already bootstrapped and in configs/inventory, so plain
# -i configs/inventory --limit <host> is correct and sufficient; confirmed
# empirically, see README.md's 2026-10-04 changelog entry):
#   ansible-playbook playbooks/windows_hygiene/site.yml \
#     -i configs/inventory --limit <host>
#
#   Or against inventory group:
#   ansible-playbook playbooks/windows_hygiene/site.yml \
#     -i configs/inventory -e target_hosts=windows_servers
#
#   DISM only:
#   ansible-playbook playbooks/windows_hygiene/site.yml \
#     -i configs/inventory --limit <host> --tags dism
#
#   Windows Update policy fix only (safe re-run against an existing box,
#   never triggers 40-winupdate.yml's own actual update-install run):
#   ansible-playbook playbooks/windows_hygiene/site.yml \
#     -i configs/inventory --limit <host> --tags winupdate_policy
#
#   Skip DISM (quick hygiene pass):
#   ansible-playbook playbooks/windows_hygiene/site.yml \
#     -i configs/inventory --limit <host> --skip-tags dism
#
# Standalone plays can also be run directly without site.yml, e.g.:
#   ansible-playbook playbooks/windows_hygiene/playbooks/30-choco.yml \
#     -i configs/inventory
# (20-hibernation-pagefile.yml and 50-summary.yml need 00-preflight.yml's
# facts — run those together, or via site.yml, rather than standalone.)
#
# Tags: preflight, example_music_files, dism, hibernation, pagefile, choco,
#       winupdate_policy, winupdate, summary
# =============================================================================
# Changelog:
#   2026-10-10  Added 35-winupdate-policy.yml (Robert's ask): background Windows Update
#               downloads/installs/reboots were interfering with Ansible runs. New stage
#               sets Windows Update to manual download + manual install (AUOptions=2,
#               the same registry policy Group Policy's "Configure Automatic Updates"
#               writes) and disables forced reboot while a user is logged on. Own tag
#               (winupdate_policy) deliberately separate from 40-winupdate.yml's own
#               (winupdate) so re-running against an already-built box with
#               --tags winupdate_policy never also triggers an actual Windows Update
#               install run as a side effect.
#   2026-09-25  Added 05-example-music-files.yml (Robert's ask): Windows nodes had
#               no equivalent of what linux/tools.yml already gives every Linux
#               host -- a local copy of sites.csv/devices.csv/etc plus
#               nodeinfo.json. Deliberately at 05 (between preflight and dism),
#               not appended at the end, since it's foundational reference data
#               other stages could plausibly want, not a cleanup/maintenance
#               step. Placement doesn't currently matter functionally (no other
#               stage here reads these files yet), but keeping it early avoids
#               relying on that staying true.
#   2026-07-02  Initial file
#   2026-07-06  Add Chocolatey upgrade, WinDirStat, SDelete, PSWindowsUpdate/Windows Update
#   2026-07-06  Split the single monolithic play into numbered standalone
#               playbooks/NN-*.yml files, matching the 00-preflight/
#               major-step-of-10 convention used by windows_dc and
#               windows_bootstrap. Tag names are unchanged (a Zabbix
#               template at docs/zabbix_templates/WindowsHygiene.xml
#               references "windows_hygiene/site.yml --tags pagefile" by
#               name, so that usage keeps working unmodified).
# =============================================================================

- import_playbook: playbooks/00-preflight.yml
  tags: preflight

- import_playbook: playbooks/05-example-music-files.yml
  tags: example_music_files

- import_playbook: playbooks/10-dism.yml
  tags: dism

- import_playbook: playbooks/20-hibernation-pagefile.yml
  tags: [hibernation, pagefile]

- import_playbook: playbooks/30-choco.yml
  tags: choco

- import_playbook: playbooks/35-winupdate-policy.yml
  tags: winupdate_policy

- import_playbook: playbooks/40-winupdate.yml
  tags: winupdate

- import_playbook: playbooks/50-summary.yml
  tags: summary
