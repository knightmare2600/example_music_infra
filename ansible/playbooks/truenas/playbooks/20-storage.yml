---
# =============================================================================
# playbooks/20-storage.yml
# Example Music Limited — TrueNAS: pools/datasets/shares
# =============================================================================
# DELIBERATELY MINIMAL. There is no benarbejde/ spec yet for what
# datasets/shares each site's NAS actually needs -- inventing one here would
# be guessing at real business requirements this repo's own conventions
# explicitly avoid doing (see benarbejde/extracted_credentials.json's own
# "never invented, guessed, or defaulted without a real source" rule,
# same principle applied here to storage layout, not credentials). This
# creates exactly one general-purpose dataset as a safe, reviewable
# starting point -- treat it as a placeholder to build on once real
# per-site requirements exist, not a finished design.
#
# Pool creation: arensb/ansible-truenas has no module for it at all (checked its
# full module list, 2026-07-22 -- 24 modules, none create a pool), so this uses a
# direct REST call instead (POST /pool -- schema confirmed against docs/api2.txt's
# own pool_create component before writing this, not guessed). Robert's call,
# 2026-10-23: nas_pool_name is now a fixed, estate-wide convention ("PBSBackups"),
# not a per-site host_vars choice any more -- defaults to that below, override via
# host_vars/-e only if some future site genuinely needs something different.
#
# Topology is chosen automatically by how many currently-unused disks the box has
# (Robert's explicit call, not guessed): exactly 1 -> STRIPE (no redundancy, the
# only option with one disk), exactly 2 -> MIRROR, 3+ -> RAIDZ1 (tolerates one
# disk failure). "Unused" is read directly from GET /disk's own `pool` field
# (`null` if not part of any pool -- confirmed against docs/api2.txt, not
# inferred from a separate get_used call). If the named pool already exists,
# none of this runs at all -- idempotent, safe to re-run.
#
# Needs 00-rest-bootstrap.yml/00-preflight.yml to have already run (truenas_rest_bootstrap_
# user/_password/truenas_target_ip facts, resolved earlier in the same site.yml run) --
# run together, or via site.yml, rather than standalone. Does NOT need 10-access.yml --
# site.yml now runs this file BEFORE 10-access.yml deliberately (2026-10-23, see
# site.yml's own changelog): the ansible account 10-access.yml creates needs a home
# directory on the pool THIS file creates, so storage has to come first.
#
# Usage:
#   ansible-playbook -i configs/inventory playbooks/truenas/playbooks/20-storage.yml
#
# Tags: storage
#
# NOT YET TESTED against a real TrueNAS box. Dataset-creation parameter names ARE
# confirmed -- checked against `ansible-doc -j arensb.truenas.filesystem`'s real
# argspec (arensb.truenas 2.0.3 installed locally 2026-07-22), not just the
# collection's rendered docs. The new REST-based pool-creation calls (POST /pool,
# GET /disk) are schema-confirmed against docs/api2.txt directly, and the
# selectattr('pool', 'none')/topology-by-count Jinja logic was verified in isolation
# before writing it here (same pattern this whole TrueNAS chain has used throughout).
# What's still unverified either way is purely behavioural -- whether these calls
# actually do the right thing against a real middleware daemon; this is the single
# most consequential untested step in the whole chain so far, since it's destructive
# (wipes whatever's currently on the disks it's given).
# =============================================================================
# Changelog:
#   2026-10-24  Real live failure, EXANASFAL001 -- the first run of the pool-creation code
#               ever to reach midclt: "[EINVAL] pool_dataset_create.name: Please specify a
#               pool which exists", right after pool creation itself reported success.
#               POST /pool is one of TrueNAS's "job" methods -- the synchronous HTTP
#               response is just a job id (confirmed: it returned "OK (2 bytes)"), not the
#               finished pool; the documented full-pool-object response schema in
#               docs/api2.txt is the job's eventual RESULT, not what the POST itself
#               returns. Added a POST /core/job_wait task right after pool creation,
#               confirmed against its own schema before writing it.
#   2026-10-23  Added REST-based pool creation (name defaults to the new estate-wide
#               "PBSBackups" convention, topology auto-picked by unused-disk count:
#               1=STRIPE, 2=MIRROR, 3+=RAIDZ1) -- Robert's explicit ask, reversing this
#               file's own prior "pool creation is NOT done here, web-UI only" design.
#               arensb.truenas genuinely still has no pool-creation module (unchanged
#               finding, still true); this bypasses it via a direct REST call instead,
#               same bypass-the-collection-gap pattern already used in 10-access.yml
#               for ssh_password_enabled and sudo_commands_nopasswd. nas_pool_name's
#               own host_vars-only requirement (no default) is removed -- it's a fixed
#               convention now, not a per-site choice.
#   2026-07-22  Initial file.
# =============================================================================

- name: TrueNAS — storage (pools/datasets/shares)
  hosts: truenas_servers
  become: true
  gather_facts: false
  ignore_unreachable: false

  environment:
    middleware_method: midclt

  pre_tasks:

    # pre_tasks set_fact, not vars: -- a vars: self-reference
    # (nas_pool_name: "{{ nas_pool_name | default(...) }}") recurses infinitely;
    # this estate's own standing fix for that exact footgun.
    - name: "Default nas_pool_name to the standing estate-wide convention (PBSBackups)"
      set_fact:
        nas_pool_name: "{{ nas_pool_name | default('PBSBackups') }}"

  tasks:

    - name: "0 | Check whether the {{ nas_pool_name }} pool already exists"
      ansible.builtin.uri:
        url: "https://{{ truenas_target_ip | default(ansible_host) }}/api/v2.0/pool?name={{ nas_pool_name }}"
        method: GET
        user: "{{ truenas_rest_bootstrap_user }}"
        password: "{{ truenas_rest_bootstrap_password }}"
        force_basic_auth: true
        validate_certs: "{{ truenas_rest_validate_certs | default(false) }}"
        status_code: 200
      register: _nas_pool_lookup
      delegate_to: localhost
      check_mode: false
      vars:
        ansible_connection: local

    - name: "0 | Set pool-already-exists fact"
      ansible.builtin.set_fact:
        nas_pool_already_exists: "{{ _nas_pool_lookup.json | length > 0 }}"

    - name: "0 | List all disks (only if the pool doesn't exist yet)"
      ansible.builtin.uri:
        url: "https://{{ truenas_target_ip | default(ansible_host) }}/api/v2.0/disk"
        method: GET
        user: "{{ truenas_rest_bootstrap_user }}"
        password: "{{ truenas_rest_bootstrap_password }}"
        force_basic_auth: true
        validate_certs: "{{ truenas_rest_validate_certs | default(false) }}"
        status_code: 200
      register: _nas_disk_list
      delegate_to: localhost
      check_mode: false
      when: not nas_pool_already_exists
      vars:
        ansible_connection: local

    - name: "0 | Determine unused disks (pool field is null -- confirmed via docs/api2.txt, not inferred)"
      ansible.builtin.set_fact:
        nas_unused_disks: "{{ _nas_disk_list.json | selectattr('pool', 'none') | map(attribute='name') | list }}"
      when: not nas_pool_already_exists

    - name: "0 | FAIL -- no unused disks found to create {{ nas_pool_name }} with"
      ansible.builtin.fail:
        msg: >-
          No unused disks found on {{ inventory_hostname }} (every disk already belongs
          to a pool, per GET /disk's own pool field) -- cannot create {{ nas_pool_name }}.
          Check the box's real disk inventory by hand before re-running -- this is a
          showstopper, not a guess-and-proceed situation.
      when:
        - not nas_pool_already_exists
        - nas_unused_disks | default([]) | length == 0

    - name: "0 | Determine pool topology by disk count (standing rule: 1=STRIPE, 2=MIRROR, 3+=RAIDZ1)"
      ansible.builtin.set_fact:
        nas_pool_vdev_type: >-
          {{ 'STRIPE' if (nas_unused_disks | length == 1)
             else ('MIRROR' if (nas_unused_disks | length == 2)
             else 'RAIDZ1') }}
      when:
        - not nas_pool_already_exists
        - nas_unused_disks | default([]) | length > 0

    - name: "0 | Create the {{ nas_pool_name }} pool"
      ansible.builtin.uri:
        url: "https://{{ truenas_target_ip | default(ansible_host) }}/api/v2.0/pool"
        method: POST
        user: "{{ truenas_rest_bootstrap_user }}"
        password: "{{ truenas_rest_bootstrap_password }}"
        force_basic_auth: true
        validate_certs: "{{ truenas_rest_validate_certs | default(false) }}"
        body_format: json
        body:
          name: "{{ nas_pool_name }}"
          topology:
            data:
              - type: "{{ nas_pool_vdev_type }}"
                disks: "{{ nas_unused_disks }}"
        status_code: 200
      register: _nas_pool_create
      when:
        - not nas_pool_already_exists
        - nas_unused_disks | default([]) | length > 0
        - not ansible_check_mode
      delegate_to: localhost
      vars:
        ansible_connection: local

    # 2026-10-24, real live failure, EXANASFAL001 (first run of the pool-creation code
    # ever to reach midclt): the task above returned "OK (2 bytes)" -- a job id, not the
    # finished pool. POST /pool is one of TrueNAS's "job" methods (confirmed against
    # docs/api2.txt's own /pool POST response schema, which documents the FULL pool
    # object -- that's the job's eventual RESULT, not what the synchronous HTTP call
    # actually returns). We moved straight on to creating the dataset before the
    # ZFS pool creation job had actually finished server-side, so it failed "[EINVAL]
    # pool_dataset_create.name: Please specify a pool which exists". Fixed with the
    # dedicated POST /core/job_wait endpoint (confirmed against its own schema: takes
    # the bare job id as the request body, a single-arg method -- same convention
    # /disk/get_used's own single-arg request body already uses in this file's sibling
    # tasks), which blocks until the job completes and returns its real result.
    # timeout: 300, generous for a real ZFS pool create, matching this chain's existing
    # pattern for "wait for something slow to actually finish" (00-rest-bootstrap.yml's
    # own checkin_timeout=300).
    - name: "0 | Wait for the pool-creation job to finish (POST /pool is async -- returns a job id, not the finished pool)"
      ansible.builtin.uri:
        url: "https://{{ truenas_target_ip | default(ansible_host) }}/api/v2.0/core/job_wait"
        method: POST
        user: "{{ truenas_rest_bootstrap_user }}"
        password: "{{ truenas_rest_bootstrap_password }}"
        force_basic_auth: true
        validate_certs: "{{ truenas_rest_validate_certs | default(false) }}"
        body_format: json
        body: "{{ _nas_pool_create.json }}"
        status_code: 200
        timeout: 300
      register: _nas_pool_create_wait
      when:
        - not nas_pool_already_exists
        - nas_unused_disks | default([]) | length > 0
        - not ansible_check_mode
      delegate_to: localhost
      vars:
        ansible_connection: local

    - name: "0 | --check mode notice"
      ansible.builtin.debug:
        msg: >-
          Would create pool {{ nas_pool_name }} as {{ nas_pool_vdev_type | default('?') }}
          across {{ nas_unused_disks | default([]) | length }} disk(s) -- not run in check mode.
      when:
        - not nas_pool_already_exists
        - nas_unused_disks | default([]) | length > 0
        - ansible_check_mode

    - name: "1 | Ensure a general-purpose dataset exists"
      arensb.truenas.filesystem:
        name: "{{ nas_pool_name }}/general"
        type: FILESYSTEM
        comments: "Ansible-managed placeholder dataset — real per-site layout not yet specified"
        create_ancestors: true
        state: present

    - name: "Summary"
      debug:
        msg:
          - "  ════════════════════════════════════════════════════════════════"
          - "  STORAGE SETUP COMPLETE — {{ inventory_hostname }}"
          - "  ════════════════════════════════════════════════════════════════"
          - >-
              Pool     : {{ nas_pool_name }} ({{ 'already existed, nothing to do' if nas_pool_already_exists
              else (nas_pool_vdev_type ~ ' across ' ~ (nas_unused_disks | length) ~ ' disk(s): ' ~ (nas_unused_disks | join(', ')) if not ansible_check_mode
              else 'not created, check mode') }})
          - "  Dataset  : {{ nas_pool_name }}/general (placeholder only)"
          - "  ════════════════════════════════════════════════════════════════"
          - "  NOT DONE: real per-site dataset/share layout — this stage only"
          - "  creates one general-purpose dataset until a real spec exists."
          - "  No shares (NFS/SMB) configured at all yet."
          - "  ════════════════════════════════════════════════════════════════"
