---
# =============================================================================
# playbooks/10-access.yml
# Example Music Limited — TrueNAS: ansible automation account + hostname + nodeinfo
# =============================================================================
# Gets a TrueNAS box under full, ongoing Ansible management: the dedicated
# `ansible` automation account (matching every other host in this estate --
# key/sudo-only, NOT the truenas_admin account this play authenticates as on
# a first run), hostname, and /etc/example-music/nodeinfo.json.
#
# arensb.truenas.user manages TrueNAS's own middleware-tracked accounts, not
# a plain /etc/passwd entry -- linux/tools.yml's ansible.builtin.user tasks
# do NOT apply here and must never be pointed at a TrueNAS host.
#
# sudo/sudo_nopasswd (real boolean parameters, confirmed 2026-07-22 against
# the installed collection's own argspec via `ansible-doc -j
# arensb.truenas.user` -- an earlier draft of this file guessed at
# sudo_commands_nopasswd: [ALL] instead, a real but different parameter
# that only grants sudo for a literal command named "ALL", not blanket
# access; caught before it shipped by checking the real module, not just
# the collection's rendered docs) grant full passwordless sudo, matching
# every other host's "ansible has passwordless sudo" convention in this
# estate exactly.
#
# First run (before the ansible account exists, using truenas_admin + password --
# root is never usable here, no root password is ever set on these boxes):
#   ansible-playbook playbooks/truenas/playbooks/10-access.yml \
#     --limit truenas_servers --user truenas_admin -k
# Subsequent runs (ansible user + key):
#   ansible-playbook playbooks/truenas/playbooks/10-access.yml \
#     --limit truenas_servers
#
# Needs 00-preflight.yml's facts (host_site/nas_city/nas_country/nas_entity/
# nas_environment) -- run together, or via site.yml, rather than standalone.
#
# Usage:
#   ansible-playbook -i configs/inventory playbooks/truenas/playbooks/10-access.yml
#
# Tags: access
#
# NOT YET TESTED against a real TrueNAS box. Parameter names ARE confirmed --
# arensb.truenas 2.0.3 installed locally 2026-07-22 and every parameter used
# below checked against `ansible-doc -j arensb.truenas.user`/`.hostname`'s
# real argspec, not just the collection's rendered docs (which is how the
# sudo/sudo_nopasswd fix above was caught). syntax-check passes against the
# installed collection. What's still unverified is purely behavioural --
# whether these calls actually do the right thing against a real
# middleware daemon.
# =============================================================================
# Changelog:
#   2026-10-22  Added a TrueNAS API key provisioning section (for the Zabbix companion
#               template's own REST/HTTP_AGENT items, docs/zabbix_templates/
#               zabbix_template_truenas.json) -- Robert's ask: automate creating it and
#               filing it into KeePass, rather than a manual web-UI step. Idempotent via
#               KeePass check-first + TrueNAS-side orphan detection (the raw key value is
#               only ever shown once, at creation -- an orphan from a prior partial run
#               can't be recovered, only deleted and recreated). Real finding, confirmed
#               live against EXANASVRK001 the same day: TrueNAS API keys authenticate via
#               an Authorization: Bearer header, NOT HTTP Basic auth -- a wrong assumption
#               that used to sit in 00-rest-bootstrap.yml's own header comment, corrected
#               there too. Doesn't affect how THIS task creates the key (still
#               truenas_admin + Basic auth, unaffected), only how Zabbix uses the result.
#   2026-10-22  Added task 1a -- locks SSH password login back down for truenas_admin
#               (00-rest-bootstrap.yml's own steps 3a/3b opened it, scoped to that one
#               account, for the bootstrap window only) now that the real, permanent
#               ansible key-based account above is confirmed in place. Real finding, live
#               against EXANASVRK001: TrueNAS SCALE's SSH *service* being enabled doesn't
#               mean a user can log in with a password -- that's a separate per-user field
#               (ssh_password_enabled), off by default. REST, not arensb.truenas -- checked
#               directly against the installed collection's own argspec that its user
#               module has no such parameter. Robert's explicit go-ahead to build this
#               properly rather than just flip the field by hand once.
#   2026-07-28  Robert, live against EXANASFAL001: corrected the "root + password" first-run
#               convention to truenas_admin -- root SSH was an unverified presumption, now
#               confirmed wrong (no root password is ever set on these boxes; the web-UI/API
#               account is truenas_admin). Also caught, same run: this box's control node
#               didn't have arensb.truenas installed at all -- ansible-galaxy collection
#               install -r playbooks/truenas/requirements.yml needed before this file can run,
#               separate from the credentials fix.
#   2026-07-22  Initial file.
# =============================================================================

- name: TrueNAS — ansible account, hostname, nodeinfo
  hosts: truenas_servers
  become: true
  gather_facts: false
  ignore_unreachable: false

  environment:
    # midclt over client -- "older, more established" per the collection's own README,
    # vs. client being described there as "newer, faster but less-tested." Matches this
    # repo's general preference for the more conservative option on anything touching a
    # box's own config store (same reasoning as auto_accept: false elsewhere).
    middleware_method: midclt

  tasks:

    - name: "1 | Ensure ansible automation account exists"
      arensb.truenas.user:
        name: ansible
        comment: "Ansible automation account"
        create_group: true
        shell: /usr/bin/bash
        ssh_authorized_keys:
          - "{{ exa_ansible_pub_key }}"
        password_disabled: true
        sudo: true
        sudo_nopasswd: true
        state: present

    # ── Lock SSH password auth back down (opened by 00-rest-bootstrap.yml's steps
    # 3a/3b, scoped to truenas_admin only) now that task 1 above has confirmed the
    # real, permanent ansible key-based account is in place. REST, not
    # arensb.truenas -- confirmed directly against the installed collection's own
    # argspec (ansible-doc -j arensb.truenas.user) that its user module has no
    # ssh_password_enabled parameter at all (only password/password_disabled/
    # ssh_authorized_keys), so the module that creates the ansible account above
    # genuinely cannot also flip this field -- REST is the only mechanism that
    # can, same as turning it on. truenas_rest_bootstrap_user/_password/
    # truenas_target_ip/_truenas_bootstrap_user_id are facts already resolved by
    # 00-rest-bootstrap.yml earlier in this same site.yml run and persist across
    # its chained plays -- not re-prompted/re-resolved here.
    #
    # Guarded on ansible_user == truenas_rest_bootstrap_user (i.e. THIS run
    # actually authenticated as truenas_admin, the genuine first-ever-bootstrap
    # case) rather than a remote `whoami`-style check -- this play runs under
    # become: true throughout, so a remote whoami would read back "root" via
    # become regardless of which account the SSH connection itself used,
    # silently never matching and never firing. ansible_user is the connection
    # fact for THIS run, not affected by become.
    - name: "1a | Lock SSH password login back down for truenas_admin (bootstrap window closed)"
      ansible.builtin.uri:
        url: "https://{{ truenas_target_ip | default(ansible_host) }}/api/v2.0/user/id/{{ _truenas_bootstrap_user_id }}"
        method: PUT
        user: "{{ truenas_rest_bootstrap_user }}"
        password: "{{ truenas_rest_bootstrap_password }}"
        force_basic_auth: true
        validate_certs: "{{ truenas_rest_validate_certs | default(false) }}"
        body_format: json
        body:
          ssh_password_enabled: false
        status_code: 200
      when:
        - ansible_user == truenas_rest_bootstrap_user
        - not ansible_check_mode
      delegate_to: localhost
      vars:
        ansible_connection: local

    - name: "2 | Set hostname fact (EXANAS<SITE>NNN, parsed by 00-preflight's hostname_facts.yml)"
      ansible.builtin.set_fact:
        nas_hostname: "EXA{{ host_role }}{{ host_site }}{{ host_num }}"

    - name: "2 | Set hostname"
      arensb.truenas.hostname:
        name: "{{ nas_hostname | lower }}"

    - name: "3 | Ensure /etc/example-music directory exists"
      ansible.builtin.file:
        path: /etc/example-music
        state: directory
        mode: "0755"

    - name: "3 | Write /etc/example-music/nodeinfo.json"
      tags: always
      include_tasks: ../../../tasks/nodeinfo.yml
      vars:
        nodeinfo_hostname: "{{ nas_hostname }}"
        nodeinfo_role: "truenas"
        nodeinfo_site: "{{ host_site }}"
        nodeinfo_city: "{{ nas_city }}"
        nodeinfo_country: "{{ nas_country }}"
        nodeinfo_country_code: "{{ nas_country_code | default('') }}"
        nodeinfo_entity: "{{ nas_entity }}"
        nodeinfo_office_name: "{{ nas_office_name | default('') }}"
        nodeinfo_street_address: "{{ nas_street | default('') }}"
        nodeinfo_postal_code: "{{ nas_postal_code | default('') }}"
        nodeinfo_environment: "{{ nas_environment | default('production') }}"
        nodeinfo_bootstrapped_by: "truenas/playbooks/10-access.yml"
        nodeinfo_extra:
          role_note: "Site NAS/SAN, .19 standard slot"

    # ── TrueNAS API key for Zabbix monitoring (REST, created + filed into KeePass) ──
    # Robert's ask, 2026-10-22: automate creating the dedicated TrueNAS API key the
    # Zabbix companion template (docs/zabbix_templates/zabbix_template_truenas.json)
    # needs, and automate filing it into KeePass -- rather than Robert minting one by
    # hand in the TrueNAS web UI every time. Real finding, confirmed live against
    # EXANASVRK001 same day: TrueNAS API keys authenticate via an Authorization:
    # Bearer header, NOT HTTP Basic auth (an earlier assumption in
    # 00-rest-bootstrap.yml's own header comment was wrong, corrected the same day) --
    # doesn't affect how THIS task creates the key (that part is unaffected, still
    # truenas_admin + Basic auth, same as every other REST call in this module), only
    # how the resulting key gets USED later, by Zabbix.
    #
    # Idempotent in three layers, in order:
    #   1. Check KeePass first (check-and-defer, same shared task every other
    #      credential in this module already uses) -- if a key for this host is
    #      already filed there, use it, make NO TrueNAS-side changes at all. API keys
    #      don't expire by default and this module never rotates them automatically,
    #      so an existing KeePass entry is always still valid.
    #   2. Only if KeePass has nothing: check whether a key with this host's own
    #      expected name already exists on TrueNAS. If it does, it's an ORPHAN from a
    #      prior run that died before reaching the KeePass-filing step -- the raw key
    #      VALUE is only ever shown once, at creation time (confirmed in
    #      docs/api2.txt's own return_schema_of_api_key_create vs
    #      return_schema_of_api_key_query -- the `key` field only exists on the
    #      former), so there is no way to recover it. Delete the orphan and fall
    #      through to step 3 rather than leaving two keys for the same purpose or
    #      silently failing.
    #   3. Create a fresh key via POST /api_key, tied to the SAME truenas_admin
    #      account this whole bootstrap already authenticates as (so the Zabbix
    #      polling key can read everything truenas_admin can -- alerts/pool/
    #      user/service/system-info, exactly what the Zabbix template's own items
    #      need), then file the raw value into KeePass via the same shared
    #      check-defer-write task, this time WITH a value to write (branch 5 of that
    #      file's own documented logic: "not found, caller already has a value ->
    #      first filing").
    #
    # Deliberately NOT gated the same way task 1a's ssh_password_enabled lock-down
    # is (ansible_user == truenas_rest_bootstrap_user) -- that gate exists because
    # locking password SSH back down is itself the thing a re-run as the ansible
    # user should NEVER repeat (it already happened once). This key, once created,
    # simply continues to exist regardless of which account a later run
    # authenticates as -- the KeePass check in step 1 is what makes repeat runs a
    # no-op, not an authentication-method gate.
    - name: "[Zabbix API key] Check KeePass for an existing key first (check-and-defer)"
      include_tasks: ../../../tasks/keepass_credential_sync.yml
      vars:
        kcs_repo_root:              "{{ playbook_dir }}/../../../.."
        kcs_keepass_path:           "Infrastructure/{{ host_site }}/{{ inventory_hostname | upper }}-zabbix-api-key"
        kcs_username:               "zabbix-monitoring"
        kcs_current_value:          ""
        kcs_can_generate:           false
        kcs_credentials_json_role:  "TRUENAS_ZABBIX_API_KEY"
        kcs_result_var:             "truenas_zabbix_api_key"
      no_log: true

    - name: "[Zabbix API key] List existing TrueNAS API keys (only if KeePass had nothing)"
      ansible.builtin.uri:
        url: "https://{{ truenas_target_ip | default(ansible_host) }}/api/v2.0/api_key"
        method: GET
        user: "{{ truenas_rest_bootstrap_user }}"
        password: "{{ truenas_rest_bootstrap_password }}"
        force_basic_auth: true
        validate_certs: "{{ truenas_rest_validate_certs | default(false) }}"
        status_code: 200
      register: _truenas_zbx_key_list
      delegate_to: localhost
      check_mode: false
      when: truenas_zabbix_api_key | default('') == ''
      vars:
        ansible_connection: local

    - name: "[Zabbix API key] Identify an orphaned key with this host's expected name, if any"
      ansible.builtin.set_fact:
        _truenas_zbx_orphan_key: "{{ _truenas_zbx_key_list.json | selectattr('name', 'equalto', 'zabbix-monitoring') | list | first | default({}) }}"
      when: truenas_zabbix_api_key | default('') == ''

    - name: "[Zabbix API key] Delete the orphaned key (its real value can never be recovered -- the raw key is only ever returned once, at creation)"
      ansible.builtin.uri:
        url: "https://{{ truenas_target_ip | default(ansible_host) }}/api/v2.0/api_key/id/{{ _truenas_zbx_orphan_key.id }}"
        method: DELETE
        user: "{{ truenas_rest_bootstrap_user }}"
        password: "{{ truenas_rest_bootstrap_password }}"
        force_basic_auth: true
        validate_certs: "{{ truenas_rest_validate_certs | default(false) }}"
        status_code: 200
      when:
        - truenas_zabbix_api_key | default('') == ''
        - _truenas_zbx_orphan_key | default({}) != {}
      delegate_to: localhost
      vars:
        ansible_connection: local

    - name: "[Zabbix API key] Create a fresh key, tied to the same truenas_admin account this bootstrap already authenticates as"
      ansible.builtin.uri:
        url: "https://{{ truenas_target_ip | default(ansible_host) }}/api/v2.0/api_key"
        method: POST
        user: "{{ truenas_rest_bootstrap_user }}"
        password: "{{ truenas_rest_bootstrap_password }}"
        force_basic_auth: true
        validate_certs: "{{ truenas_rest_validate_certs | default(false) }}"
        body_format: json
        body:
          name: "zabbix-monitoring"
          username: "{{ truenas_rest_bootstrap_user }}"
        status_code: 200
      register: _truenas_zbx_key_create
      when: truenas_zabbix_api_key | default('') == ''
      delegate_to: localhost
      no_log: true
      vars:
        ansible_connection: local

    - name: "[Zabbix API key] File the new key into KeePass"
      include_tasks: ../../../tasks/keepass_credential_sync.yml
      vars:
        kcs_repo_root:              "{{ playbook_dir }}/../../../.."
        kcs_keepass_path:           "Infrastructure/{{ host_site }}/{{ inventory_hostname | upper }}-zabbix-api-key"
        kcs_username:               "zabbix-monitoring"
        kcs_current_value:          "{{ _truenas_zbx_key_create.json.key }}"
        kcs_can_generate:           false
        kcs_credentials_json_role:  "TRUENAS_ZABBIX_API_KEY"
        kcs_result_var:             "truenas_zabbix_api_key"
      when: truenas_zabbix_api_key | default('') == ''
      no_log: true

    - name: "[Zabbix API key] Credentials banner -- new key created and filed into KeePass this run"
      ansible.builtin.debug:
        msg:
          - "  ════════════════════════════════════════════════════════════════"
          - "  TrueNAS API key for Zabbix monitoring created THIS RUN"
          - "  ════════════════════════════════════════════════════════════════"
          - "  Filed into KeePass at: Infrastructure/{{ host_site }}/{{ inventory_hostname | upper }}-zabbix-api-key"
          - "  Set docs/zabbix_templates/zabbix_template_truenas.json's own {{ '{$TRUENAS.API_KEY}' }}"
          - "  macro to this value (flip its type to 'Secret text' in the Zabbix UI first)."
          - "  ════════════════════════════════════════════════════════════════"
      when: _truenas_zbx_key_create is defined

    - name: "Summary"
      debug:
        msg:
          - "  ════════════════════════════════════════════════════════════════"
          - "  ANSIBLE ACCESS SETUP COMPLETE — {{ nas_hostname }}"
          - "  ════════════════════════════════════════════════════════════════"
          - "  Site        : {{ host_site }} — {{ nas_city }}, {{ nas_country }}"
          - "  Next stage  : playbooks/truenas/playbooks/20-storage.yml"
          - "  ════════════════════════════════════════════════════════════════"
