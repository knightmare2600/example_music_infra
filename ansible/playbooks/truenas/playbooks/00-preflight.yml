---
# =============================================================================
# playbooks/00-preflight.yml
# Example Music Limited — TrueNAS preflight
# =============================================================================
# Two plays, matching the "00-preflight" convention already used by
# proxmox/playbooks/00-preflight.yml, windows_bootstrap/, windows_dc/, and
# salt/playbooks/00-preflight.yml:
#
#   Play 1 — real SSH keypair connectivity check (tasks/ssh_key_preflight.yml),
#            auto-skipped for the documented password-authenticated
#            first-ever-onboard path (site.yml run as --user=truenas_admin -k).
#   Play 2 — hostname parse (EXANAS<SITE>001 -- tasks/hostname_facts.yml,
#            already generic across every EXA[ROLE][SITE][NNN] hostname, no
#            TrueNAS-specific change needed) + sites.csv lookup for
#            city/country/entity, mirroring proxmox/00-preflight.yml's Play 2
#            -- NAS is a per-site standard-slot role like PVE, not a single
#            fixed CLD host like Salt/Rudder, so there's no hostname/IP to
#            prompt for here (that comes from devices.csv once a real row
#            exists, same as any other per-site role).
#
# Usage:
#   ansible-playbook -i configs/inventory playbooks/truenas/playbooks/00-preflight.yml
#
# Tags: preflight
#
# CONFIRMED live 2026-07-28 against EXANASFAL001 (was a presumption before this): SSH access
# for the first-ever-onboard path is via truenas_admin, not root -- no root password is ever
# set on these boxes, TrueNAS SCALE's web-UI/API account is truenas_admin throughout. This
# still assumes Robert has already completed TrueNAS's own web-UI first-run setup (admin
# password, static .19 IP or a reachable DHCP address, SSH service enabled via the wizard or
# 00-rest-bootstrap.yml) out of band, the same "already-installed, already-networked" scope
# arensb/ansible-truenas itself documents. This playbook has no bootstrap/install capability
# and never will.
# =============================================================================
# Changelog:
#   2026-10-23  Robert's ask, live on EXANASFAL001: a reinstalled TrueNAS box at an
#               existing standard NAS slot hit "REMOTE HOST IDENTIFICATION HAS CHANGED"
#               on first real SSH connection -- the previous occupant's cached host key
#               was stale. Added ../../../tasks/purge_stale_known_hosts_key.yml (shared
#               with firewallme/90-firewall.yml, which had this exact pattern inline
#               already) to Play 1, unconditional, ahead of ssh_key_preflight_skip --
#               see that task's own include site for the full reasoning.
#   2026-10-22  Added an early nodeinfo.json write to Play 2 (site lookup), right after
#               nas_environment is resolved -- Robert's ask: make sure nodeinfo.json
#               genuinely gets written, not just assumed. Previously the ONLY write in this
#               whole module lived in 10-access.yml, a separate later stage; if that ever
#               failed/was skipped, nodeinfo.json never got written at all. Matches this
#               estate's standing "write early, post-hostname-resolution, keep any existing
#               late write too" convention, which this module had never actually followed.
#               10-access.yml's own later write is unchanged. Deliberately NOT surfaced as a
#               Zabbix check (Robert's explicit call, same session) -- purely for a human who
#               SSHes in directly to have something accurate to read.
#   2026-07-28  Robert, live against EXANASFAL001: the "PRESUMPTION, not verified" note above
#               resolved -- root SSH was never usable (no root password ever set on these
#               boxes), truenas_admin is the correct first-touch account. Confirmed, not just
#               presumed, going forward.
#   2026-07-22  Initial file.
# =============================================================================

- name: TrueNAS — Preflight (SSH keypair connectivity check)
  hosts: truenas_servers
  gather_facts: false
  tasks:
    # 2026-10-23, Robert's ask, live on EXANASFAL001: a reinstalled TrueNAS box at an
    # existing standard NAS slot (replacing an OLDER TrueNAS install there -- the same
    # root cause as firewallme's own "shared DHCP lease" case, just a reinstalled box
    # at a permanent site slot instead of an address reuse on a shared network) hit
    # "REMOTE HOST IDENTIFICATION HAS CHANGED" the moment any real SSH connection was
    # attempted (both the password-auth Gathering Facts in the next play, and this
    # play's own key-based check below if that path is taken instead) -- the box's
    # brand-new host key doesn't match what known_hosts still has cached from the
    # previous occupant. Ported firewallme/playbooks/90-firewall.yml's own known-hosts
    # probe/purge (now shared, see that file's own 2026-10-23 changelog entry) --
    # unconditional, ahead of ssh_key_preflight_skip, since the stale-key problem
    # equally blocks a password-based connection (this play's own skip condition for
    # that exact case) as it would a key-based one.
    - name: Test + purge a stale known_hosts entry for this TrueNAS box's address
      include_tasks: ../../../tasks/purge_stale_known_hosts_key.yml
      vars:
        phk_target_ip: "{{ ansible_host | default(inventory_hostname) }}"
        phk_target_user: "{{ ansible_user | default('ansible') }}"
        phk_target_port: "{{ ansible_port | default(22) }}"
        phk_identity_file: "{{ ansible_ssh_private_key_file | default(lookup('env', 'HOME') + '/ansible/configs/ansible-id_rsa') }}"
        phk_reason: >-
          This standard NAS slot had an OLDER TrueNAS install here before (replaced, not a
          shared-DHCP address reuse) -- its own cached host key is stale now that this box
          has a brand-new one.

    - name: Real SSH connectivity check using the configured key
      include_tasks: ../../../tasks/ssh_key_preflight.yml
      vars:
        # Auto-skip for the documented password-authenticated first-ever-onboard
        # path (site.yml run as --user=truenas_admin -k) -- a broken/missing
        # private key is irrelevant when this run isn't using one at all.
        # Neither var is ever set on a genuinely key-based run.
        ssh_key_preflight_skip: "{{ (ansible_ssh_pass is defined) or ((ansible_password | default('')) != '') }}"
      tags: preflight

- name: TrueNAS — Preflight (site lookup)
  hosts: truenas_servers
  become: true
  gather_facts: true

  vars:
    sites_csv_src: "{{ playbook_dir }}/../../../../benarbejde/sites.csv"

  tasks:

    - name: Include hostname facts
      # 2026-10-23, Robert's ask, live on EXANASFAL001: without target_hostname set
      # explicitly, hostname_facts.yml falls back to ansible_hostname (this play's own
      # gather_facts: true has already populated it by this point) -- the box's
      # factory/DHCP-assigned OS hostname, NOT yet renamed to the EXA convention
      # (10-access.yml's task 2 is what renames it, later in this same chain). That
      # mismatched hostname doesn't match the EXA[ROLE][SITE][NNN] regex at all,
      # which crashed "Parse role from hostname" outright (see hostname_facts.yml's
      # own fix, same day, for that half) and would otherwise have failed the very
      # next "Validate hostname convention" assert with host_role/host_site=UNKNOWN.
      # Fixed by passing target_hostname explicitly -- same pattern salt/playbooks/
      # 00-preflight.yml's own "Parse site code from hostname" task already uses
      # (target_hostname: "{{ salt_hostname }}"), just sourced from inventory_hostname
      # here since TrueNAS is a per-site standard-slot role with no separate
      # user-supplied hostname var to prefer. proxmox/00-preflight.yml never needed
      # this at all -- its nodes are already correctly named by the time this runs,
      # confirmed by that file having no target_hostname override anywhere.
      include_tasks: ../../../tasks/hostname_facts.yml
      vars:
        target_hostname: "{{ inventory_hostname }}"
      tags: preflight

    - name: Load sites.csv
      read_csv:
        path: "{{ sites_csv_src }}"
      register: nas_sites_raw
      delegate_to: localhost
      become: false
      run_once: true
      tags: preflight

    - name: Look up this node's site row
      set_fact:
        nas_site_row: "{{ nas_sites_raw.list | selectattr('Site', 'equalto', host_site) | list | first | default({}) }}"
      tags: preflight

    - name: WARN — site code not found in sites.csv
      debug:
        msg: >
          host_site='{{ host_site }}' (parsed from hostname
          '{{ inventory_hostname }}') was not found in sites.csv.
          nodeinfo.json city/country/entity fields will be blank.
      when: nas_site_row == {}
      tags: preflight

    - name: Set site enrichment facts
      set_fact:
        nas_city: "{{ nas_site_row.City | default('') }}"
        nas_country: "{{ nas_site_row.Country | default('') }}"
        nas_country_code: "{{ nas_site_row.CountryCode | default('') }}"
        nas_entity: "{{ nas_site_row.Entity | default('') }}"
        nas_office_name: "{{ nas_site_row.OfficeName | default('') }}"
        nas_street: "{{ nas_site_row.Street | default('') }}"
        nas_postal_code: "{{ nas_site_row.PostalCode | default('') }}"
      tags: preflight

    - name: "[Preflight] Resolve environment"
      ansible.builtin.include_tasks: ../../../tasks/nodeinfo_environment.yml
      tags: [preflight, always]

    - name: "[Preflight] Set nas_environment"
      ansible.builtin.set_fact:
        nas_environment: "{{ resolved_environment }}"
      tags: preflight

    # ── Early nodeinfo.json write ────────────────────────────────────────────
    # Robert's ask, 2026-10-22: make sure nodeinfo.json genuinely gets written/
    # kept current, not just assumed -- matches this estate's standing rule
    # (every module writes nodeinfo as early as possible, post-hostname-
    # resolution, keeping any existing later write too) that this file was
    # never actually following: the ONLY nodeinfo write in this whole module
    # used to live in 10-access.yml, a separate, LATER stage -- if that stage
    # ever failed or was skipped (e.g. someone runs 00-preflight.yml standalone,
    # or a later task errors out before reaching it), nodeinfo.json would never
    # get written at all. Everything needed (host_role/host_site/host_num from
    # hostname_facts.yml above, nas_city/country/entity/nas_environment from
    # this same play) is already resolved by this point, so there's no reason
    # to wait for 10-access.yml. 10-access.yml's own later write is UNCHANGED
    # and still runs -- nodeinfo.yml's own preserve-existing-extra logic makes
    # writing it twice safe, same pattern every other multi-stage module in
    # this estate already uses. Deliberately not surfaced as a Zabbix check
    # (Robert's explicit call) -- this is purely so a human SSHed into the box
    # directly has an accurate file to read, nothing monitors it.
    - name: "[Preflight] Set nas_hostname fact (EXANAS<SITE>NNN, needed for the early nodeinfo.json write below)"
      ansible.builtin.set_fact:
        nas_hostname: "EXA{{ host_role }}{{ host_site }}{{ host_num }}"
      tags: [preflight, always]

    - name: "[Preflight] Write /etc/example-music/nodeinfo.json (early -- see comment above)"
      tags: [preflight, always]
      ansible.builtin.include_tasks: ../../../tasks/nodeinfo.yml
      vars:
        nodeinfo_hostname: "{{ nas_hostname }}"
        nodeinfo_role: "truenas"
        nodeinfo_site: "{{ host_site }}"
        nodeinfo_city: "{{ nas_city }}"
        nodeinfo_country: "{{ nas_country }}"
        nodeinfo_country_code: "{{ nas_country_code | default('') }}"
        nodeinfo_entity: "{{ nas_entity }}"
        nodeinfo_office_name: "{{ nas_office_name | default('') }}"
        nodeinfo_street_address: "{{ nas_street | default('') }}"
        nodeinfo_postal_code: "{{ nas_postal_code | default('') }}"
        nodeinfo_environment: "{{ nas_environment | default('production') }}"
        nodeinfo_bootstrapped_by: "truenas/playbooks/00-preflight.yml"
        nodeinfo_extra:
          role_note: "Site NAS/SAN, .19 standard slot"

    - name: Show preflight summary
      debug:
        msg:
          - "Host      : {{ inventory_hostname }} (site={{ host_site }})"
          - "Site data : city={{ nas_city }} country={{ nas_country }} entity={{ nas_entity }}"
          - "Environment: {{ nas_environment }}"
      tags: preflight
