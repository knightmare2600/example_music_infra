---
# =============================================================================
# Example Music Limited — TacticalRMM Server Prep + Install Playbook
# playbooks/tacticalrmm/tacticalrmm_server.yml
#
# Remote management platform, phase 3 (Robert's brief, 2026-08-04 — see project
# notes). Prepares EXARMMCLD001 (hostname, static IP, base packages, firewall)
# AND fully installs TacticalRMM itself — upstream install.sh is never run.
#
# 2026-08-06 pivot: earlier design wrapped install.sh with a break-glass
# script instead of reimplementing it (see git history / PLAN-tacticalrmmme.md's
# "Original plan" section for that reasoning). Robert, after running that
# wrapper live and finding it just stopped before doing anything: "the
# entire point of having an ansible playbook... was so we could dispense
# with their install script and make it into an end-to-end ansible
# playbook." Full step-by-step mapping from the real install.sh to this
# playbook's sections lives in PLAN-tacticalrmmme.md's "2026-08-06 pivot"
# section (source of truth for phase status) — this header just points
# there rather than duplicating a table that will drift.
#
# Sections 1-6: VM prep, structure mirrors meshcentral_server.yml/
# rudder_server.yml's proven pattern (hostname, session-safe static IP,
# base packages, UFW, MOTD, node info file). Sections 7+: the Ansible-native
# reimplementation of install.sh itself, phase by phase.
#
# Debian Trixie — CONFIRMED WORKING, not just presumed
# -------------------------------------------------------
# install.sh's own OS check only allows Debian 11/12 or Ubuntu 22.04 —
# Trixie is rejected outright by the upstream script (irrelevant now that
# install.sh is never invoked, but this estate's own compatibility checks
# in Section 9 explicitly allow Debian 13/Trixie as a deliberate, tested
# exception). Every genuinely Trixie-specific risk has been checked against
# real upstream sources, not assumed: nginx.org publishes a real `trixie`
# repo (curled its dists/ listing), apt.postgresql.org publishes a real
# `trixie-pgdg` repo with `postgresql-18` actually in it (curled the
# Packages index, real version strings), Python 3.11.8 builds from source
# regardless of OS. Confirmed live against EXARMMCLD001 through Phase 4 as
# of 2026-08-06 — see PLAN-tacticalrmmme.md for exactly how far the build
# has progressed.
#
# Usage
# -----
#   ansible-playbook playbooks/tacticalrmm/tacticalrmm_server.yml \
#     --limit tacticalrmm_servers
#
# No --user root -k needed, ever -- the ansible user's SSH key is already
# installed during the box's own PXE/preseed Debian install (Robert,
# 2026-08-06, correcting a wrong assumption repeated through several runs
# this session). No -e ansible_host= override needed either once the box
# holds its real static IP (matching what's already in
# host_vars/<hostname>/main.yml) -- only relevant for the very first
# minutes of a genuinely fresh VM's life, before tacticalrmm_server.yml's
# own Section 2 has even run once.
#
# Idempotency
# -----------
# Every task is idempotent — re-running against an already-prepped/partially-
# installed server is safe. Secrets generated in Section 8 are ephemeral
# (regenerated fresh every run, lookup('password', '/dev/null', ...)) and
# only become "real" the run a later section actually consumes them to
# create something (a PostgreSQL role, a Django install) — see Section 8's
# and Section 11's own comments for why.
# =============================================================================
# Version history
# =============================================================================
# v1.0.0  2026-08-04  Initial release.
# =============================================================================

- name: Prep TacticalRMM server
  hosts: tacticalrmm_servers
  become: true
  gather_facts: true
  ignore_unreachable: false

  vars_files:
    - ../../configs/inventory/group_vars/tacticalrmm_servers/main.yml

  pre_tasks:

    - name: Gate on /etc/example-music/* freshness
      include_tasks: ../../tasks/example_music_freshness_gate.yml
      vars:
        example_music_gate_files: [sites.csv, ad_forest.json]
        example_music_gate_repo_root: "{{ playbook_dir }}/../../.."

    - name: "Prompt for hostname if not set in host_vars"
      pause:
        prompt: >
          Hostname for this TacticalRMM server is not set in host_vars.
          Enter hostname (e.g. EXARMMCLD001)
      register: _hostname_prompt
      when: rmm_hostname is not defined or rmm_hostname == ""
      delegate_to: localhost
      become: false

    - name: "Set rmm_hostname from prompt"
      set_fact:
        rmm_hostname: "{{ _hostname_prompt.user_input | upper }}"
      when: _hostname_prompt is not skipped

    - name: "Prompt for static IP if not set in host_vars"
      pause:
        prompt: >
          Static IP for {{ rmm_hostname }} is not set in host_vars.
          Enter static IP (e.g. 192.168.69.14)
      register: _ip_prompt
      when: rmm_static_ip is not defined or rmm_static_ip == ""
      delegate_to: localhost
      become: false

    - name: "Set rmm_static_ip from prompt"
      set_fact:
        rmm_static_ip: "{{ _ip_prompt.user_input }}"
      when: _ip_prompt is not skipped

    - name: "Prompt for gateway if not set in host_vars"
      pause:
        prompt: >
          Gateway for {{ rmm_hostname }} is not set in host_vars.
          Enter gateway IP (e.g. 192.168.69.253)
      register: _gw_prompt
      when: rmm_gateway is not defined or rmm_gateway == ""
      delegate_to: localhost
      become: false

    - name: "Set rmm_gateway from prompt"
      set_fact:
        rmm_gateway: "{{ _gw_prompt.user_input }}"
      when: _gw_prompt is not skipped

    - name: "Validate required variables are now set"
      assert:
        that:
          - rmm_hostname is defined and rmm_hostname != ""
          - rmm_static_ip is defined and rmm_static_ip != ""
          - rmm_gateway is defined and rmm_gateway != ""
        fail_msg: >
          rmm_hostname, rmm_static_ip, and rmm_gateway must all be set.
          Set them in host_vars/{{ inventory_hostname }}/main.yml or pass via
          --extra-vars.
        success_msg: "All required variables present — proceeding."

    # ---------------------------------------------------------------------------
    # 9 | Compatibility checks (install.sh steps 1-2)
    # MOVED into pre_tasks, 2026-08-06 -- Robert: "pre-flight checks exist
    # literally to ask all the questions up front, but you ask halfway
    # through the playbook, in direct contradiction to what we have as an
    # established setup." Right call -- these were sitting after Sections
    # 1-6 (hostname/network/packages/firewall all already applied), so a
    # RAM/arch/OS failure only got caught after real changes had already
    # been made to the box, exactly backwards from what a pre-flight check
    # is for. Same tasks, same facts (gather_facts: true runs before
    # pre_tasks, not after -- nothing lost by the move), just correctly
    # positioned now, alongside the existing hostname/IP/gateway prompts
    # this convention was already established for.
    #
    # Deliberately NOT ported (see PLAN-tacticalrmmme.md's "What stays out
    # of scope"): LXC/Turnkey Linux/Webmin rejection (not applicable to
    # this estate's Proxmox-VM-only deployment model), the non-root-user
    # check (Ansible always runs as root via become on the target, the
    # opposite of install.sh's own assumption of a sudo-capable non-root
    # login), and install.sh's own remote-version self-update check
    # (irrelevant -- install.sh itself is never invoked). Also not
    # ported: install.sh's "existing install" refusal -- this
    # Ansible-native design is meant to be genuinely idempotent instead,
    # the phase that actually clones the rmm repo is where that
    # idempotency belongs (skip-if-already-cloned), not a hard stop here.
    # ---------------------------------------------------------------------------

    - name: "9 | Assert supported CPU architecture"
      assert:
        that:
          - ansible_architecture in ['x86_64', 'aarch64']
        fail_msg: "Unsupported architecture '{{ ansible_architecture }}' -- TacticalRMM requires x86_64 or aarch64."
        success_msg: "Architecture OK: {{ ansible_architecture }}"

    - name: "9 | Assert minimum 4GB RAM"
      assert:
        that:
          - ansible_memtotal_mb >= 4096
        fail_msg: "Only {{ ansible_memtotal_mb }}MB RAM available -- TacticalRMM requires at least 4096MB. Resize the VM before continuing."
        success_msg: "RAM OK: {{ ansible_memtotal_mb }}MB"

    - name: "9 | Assert supported OS"
      assert:
        that:
          - >-
            (ansible_distribution == 'Debian' and ansible_distribution_major_version in ['11', '12', '13'])
            or (ansible_distribution == 'Ubuntu' and ansible_distribution_version == '22.04')
        fail_msg: >-
          {{ ansible_distribution }} {{ ansible_distribution_version }} is not supported --
          TacticalRMM's upstream installer only allows Debian 11/12 or Ubuntu 22.04. Debian 13
          (Trixie) is allowed here as this estate's own tested exception (see README.md's
          "Debian Trixie" section) -- PostgreSQL/NATS/MeshCentral are all version-parameterised
          or built from source, nothing found genuinely Trixie-incompatible.
        success_msg: "OS OK: {{ ansible_distribution }} {{ ansible_distribution_version }}"

    - name: "9 | Check locale is UTF-8"
      command: locale
      register: _rmm_locale_check
      changed_when: false

    - name: "9 | Assert UTF-8 locale"
      assert:
        that:
          - _rmm_locale_check.stdout is regex('(?m)^LANG=.*UTF-8')
        fail_msg: "System LANG does not appear to be UTF-8 -- TacticalRMM/Django require it. `locale` output: {{ _rmm_locale_check.stdout }}"
        success_msg: "Locale OK (UTF-8 found)."

    # ---------------------------------------------------------------------------
    # 7 | Prompts -- MOVED into pre_tasks, 2026-08-06, same reasoning as
    # the compatibility checks above. Every value install.sh would normally
    # ask for interactively, gathered up front instead of scattered across
    # the 31-step install. Subdomains/root domain are NOT re-prompted --
    # already fixed, DNS-verified estate facts (role_codes.csv's RMM/MSH
    # DNSAlias + bind9-dns.yml's bind9_extra_cnames), re-asking a known
    # value would just invite a typo'd duplicate of data with one home
    # already.
    #
    # Django admin PASSWORD is no longer prompted -- Robert, 2026-08-06:
    # "Django passwords, like all others, can be generated by ansible, is
    # that not why ansible is used for automation... you'll literally have
    # the ability to generate random passwords AND save them, no?" Right
    # call -- there's no real reason a human needs to invent/type/confirm
    # this one when it can be generated exactly like the other 6 secrets
    # and handed back via the credentials banner (a later phase, once
    # superuser creation is built) the same way the PostgreSQL passwords
    # already are. Email and username stay prompted -- those are genuine
    # per-run identity choices, not secrets to generate.
    # ---------------------------------------------------------------------------

    - name: "7 | Prompt for admin/notification email if not set"
      pause:
        prompt: "Admin/notification email for Django and MeshCentral [webmaster@{{ rmm_domain }}]"
      register: _admin_email_prompt
      when: rmm_admin_email is not defined or rmm_admin_email == ""
      delegate_to: localhost
      become: false

    - name: "7 | Set rmm_admin_email"
      set_fact:
        rmm_admin_email: "{{ (_admin_email_prompt.user_input | trim) if (_admin_email_prompt.user_input | default('') | trim != '') else ('webmaster@' + rmm_domain) }}"
      when: _admin_email_prompt is not skipped

    - name: "7 | Prompt for Django admin username if not set"
      pause:
        prompt: "Django admin username [admin]"
      register: _django_user_prompt
      when: rmm_django_admin_user is not defined or rmm_django_admin_user == ""
      delegate_to: localhost
      become: false

    - name: "7 | Set rmm_django_admin_user"
      set_fact:
        rmm_django_admin_user: "{{ (_django_user_prompt.user_input | trim) if (_django_user_prompt.user_input | default('') | trim != '') else 'admin' }}"
      when: _django_user_prompt is not skipped

    # ---------------------------------------------------------------------------
    # 8 | Secret generation -- MOVED into pre_tasks, 2026-08-06, same
    # reasoning as above. install.sh generates 6 secrets in memory and uses
    # them once, same run (Django secret key, admin URL, MeshCentral
    # password, two PostgreSQL username/password pairs, MeshCentral
    # username) -- this now generates 7, the Django admin password folded
    # in the same way (see the prompts note above for why it's no longer
    # asked for). All via lookup('password', '/dev/null', ...), the
    # standard Ansible idiom for "genuinely random value, no persistence
    # anywhere" (verified locally: two calls return different values,
    # nothing written to disk). Idempotency for whatever LATER phase
    # actually creates the PostgreSQL roles/Django superuser/writes
    # local_settings.py with these is THAT phase's own problem to solve by
    # checking the target's already-deployed state first -- not solved by
    # regenerating-and-persisting a secret store here. See docs/Example
    # Music Limited — KeePassXC CLI Automation.md §7a and
    # salt/playbooks/20-saltgui.yml for why this estate never lets Ansible
    # write to KeePass or invent a parallel secret store either.
    #
    # rmm_mesh_username/rmm_pg_user/rmm_mesh_pg_user are FIXED, not
    # ephemeral -- real live bug, EXARMMCLD001, 2026-08-06: a re-run's
    # "Create X PostgreSQL role" task ran again and printed a SECOND,
    # different set of credentials, because the role NAME itself was one
    # of these ephemeral values. Usernames/account names used as an
    # existence-check LOOKUP KEY need a stable identity across runs; only
    # genuinely one-shot SECRET VALUES are safe to stay ephemeral.
    #
    # Exact character sets (letters/lowercase/alphanumeric, lengths) for
    # django_secret_key/admin_url/mesh_password/pg_password/mesh_pg_password
    # are as described in install.sh's own generation logic, confirmed via
    # WebFetch against the real script -- not independently re-verified
    # byte-for-byte against its tr/openssl invocations, but a safe superset
    # that won't break shell/config-file/URL quoting either way.
    # rmm_django_admin_password (not one of install.sh's own secrets -- it
    # normally comes from a human at Django's own interactive
    # createsuperuser prompt) uses the same charset/length as
    # rmm_pg_password, no special reasoning behind that choice beyond
    # consistency.
    # ---------------------------------------------------------------------------

    - name: "8 | Generate Django secret key (ephemeral, this run only)"
      set_fact:
        rmm_django_secret_key: "{{ lookup('ansible.builtin.password', '/dev/null', length=80, chars=['ascii_letters', 'digits']) }}"
      no_log: true

    - name: "8 | Generate admin URL path (ephemeral, this run only)"
      set_fact:
        rmm_admin_url: "{{ lookup('ansible.builtin.password', '/dev/null', length=70, chars=['ascii_lowercase', 'digits']) }}"
      no_log: true

    - name: "8 | Generate MeshCentral password (ephemeral, this run only)"
      set_fact:
        rmm_mesh_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=25, chars=['ascii_letters', 'digits']) }}"
      no_log: true

    - name: "8 | Generate Django admin password (ephemeral, this run only)"
      set_fact:
        rmm_django_admin_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=20, chars=['ascii_letters', 'digits']) }}"
      no_log: true

    - name: "8 | Set fixed MeshCentral username (must be stable across runs -- used as an existence-check key)"
      set_fact:
        rmm_mesh_username: "meshcentral"

    - name: "8 | Set fixed TacticalRMM PostgreSQL username + generate its password (ephemeral)"
      set_fact:
        rmm_pg_user: "tacticalrmm"
        rmm_pg_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=20, chars=['ascii_letters', 'digits']) }}"
      no_log: true

    - name: "8 | Set fixed MeshCentral PostgreSQL username + generate its password (ephemeral)"
      set_fact:
        rmm_mesh_pg_user: "meshcentral"
        rmm_mesh_pg_password: "{{ lookup('ansible.builtin.password', '/dev/null', length=20, chars=['ascii_letters', 'digits']) }}"
      no_log: true

    - name: "7/8 | Confirm install facts (fixed + just-gathered/generated)"
      debug:
        msg:
          - "Root domain              : {{ rmm_domain }}"
          - "Frontend subdomain       : {{ rmm_frontend_subdomain }}.{{ rmm_domain }}"
          - "Backend subdomain        : {{ rmm_backend_subdomain }}.{{ rmm_domain }}"
          - "Mesh subdomain           : {{ rmm_mesh_subdomain }}.{{ rmm_domain }}"
          - "Admin/notification email : {{ rmm_admin_email }}"
          - "Django admin username    : {{ rmm_django_admin_user }}"
          - "Django admin password    : (auto-generated, not displayed -- shown once in a later phase's credentials banner)"

    - name: "8 | Confirm secrets were generated (values not displayed)"
      debug:
        msg: >-
          9 secret(s) generated for this run -- django_secret_key, admin_url,
          mesh_password, django_admin_password, mesh_username, pg_user,
          pg_password, mesh_pg_user, mesh_pg_password. Not displayed here; a
          later phase that actually creates the PostgreSQL roles/Django
          install will use them, and a final credentials banner will print
          what needs to go in KeePass -- shown once, matching
          salt/playbooks/20-saltgui.yml's own precedent. Nothing here writes
          to KeePass or anywhere else -- file it into KeePassXC yourself
          afterward with benarbejde/kpcli_wrapper.py.

  tasks:

  # ---------------------------------------------------------------------------
  # Section 1 — Hostname
  # ---------------------------------------------------------------------------

    - name: "1 | Set hostname"
      hostname:
        name: "{{ rmm_hostname | lower }}"

    - name: "1 | Add FQDN to /etc/hosts"
      lineinfile:
        path: /etc/hosts
        regexp: "^127\\.0\\.1\\.1"
        line: >-
          127.0.1.1  {{ rmm_hostname | lower }}.{{ rmm_domain }}  {{ rmm_hostname | lower }}
        state: present

  # ---------------------------------------------------------------------------
  # Section 2 — Static IP via NetworkManager
  # Session-safe templated-keyfile+reload+strand-check pattern — same as
  # rudder_server.yml/meshcentral_server.yml Section 2.
  # ---------------------------------------------------------------------------

    - name: "2 | Install NetworkManager if missing"
      apt:
        name: network-manager
        state: present
        update_cache: true

    - name: "2 | Check whether target IP is already in use (CLD best-effort)"
      command: "ping -c1 -W1 {{ rmm_static_ip }}"
      register: _ping_check
      changed_when: false
      failed_when: false

    - name: "2 | Check current IPs on this host"
      command: hostname -I
      register: _current_ips
      changed_when: false

    - name: "2 | Warn if target IP appears in use by another host"
      fail:
        msg: >
          {{ rmm_static_ip }} is responding to ping and is NOT assigned to
          this host. Resolve the IP conflict before proceeding.
          (If this is a cloud host and ICMP is filtered, this check may be a
          false positive — in that case, remove this task and re-run.)
      when:
        - _ping_check.rc == 0
        - rmm_static_ip not in _current_ips.stdout.split()

    - name: "2 | Warn if ping check is unreliable (cloud environment)"
      debug:
        msg: >-
          [CLD] ping check returned rc={{ _ping_check.rc }}.
          On cloud hosts ICMP may be filtered — IP conflict check is
          best-effort only. Proceeding.
      when: _ping_check.rc != 0

    - name: "2 | Detect provisioning interface (first non-loopback with an IP)"
      shell: |
        for iface in $(ls /sys/class/net/); do
          [[ "$iface" == "lo" ]] && continue
          ip_addr=$(ip -4 addr show "$iface" 2>/dev/null | grep -oP '(?<=inet\s)\d+\.\d+\.\d+\.\d+' | head -1)
          if [[ -n "$ip_addr" ]]; then
            echo "$iface"
            exit 0
          fi
        done
        exit 1
      args:
        executable: /bin/bash
      register: _detected_iface
      changed_when: false

    - name: "2 | Set interface name fact"
      set_fact:
        _rmm_iface: "{{ rmm_network_interface | default(_detected_iface.stdout | trim, true) }}"

    - name: "2 | Read interface MAC address"
      slurp:
        src: "/sys/class/net/{{ _rmm_iface }}/address"
      register: _iface_mac_raw

    - name: "2 | Set MAC address fact"
      set_fact:
        _rmm_mac: "{{ _iface_mac_raw.content | b64decode | trim }}"

    - name: "2 | Pin interface name via systemd .link"
      copy:
        dest: "/etc/systemd/network/10-rmm-prov.link"
        content: |
          # Example Music — TacticalRMM server interface pin
          # Written by tacticalrmm_server.yml on {{ ansible_date_time.iso8601 }}
          # MAC: {{ _rmm_mac }}  interface: {{ _rmm_iface }}
          [Match]
          MACAddress={{ _rmm_mac }}
          [Link]
          Name={{ _rmm_iface }}
        mode: "0644"

    - name: "2 | Mask ifupdown to prevent conflict with NetworkManager"
      systemd:
        name: "networking.service"
        masked: true
        enabled: false
      failed_when: false

    - name: "2 | Check for /etc/network/interfaces"
      stat:
        path: /etc/network/interfaces
      register: _rmm_interfaces_file

    - name: "2 | Remove ifupdown stanza for {{ _rmm_iface }} from /etc/network/interfaces"
      # blockinfile (previous approach) only ever removes a block IT previously inserted
      # with a matching marker -- it can never touch genuine pre-existing ifupdown content
      # like the "allow-hotplug ens18 / iface ens18 inet dhcp" every fresh Debian box ships
      # with, so it silently did nothing. Real live bug, EXARMMCLD001, 2026-08-06: masking
      # networking.service does NOT stop allow-hotplug's own udev-triggered ifup mechanism,
      # so the leftover DHCP stanza kept assigning a second "secondary dynamic" address on
      # the same interface as rmm-static's manual one, surviving a full reboot. Same sed
      # approach as firewallme/roles/firewall/tasks/06_network_manager.yml's own proven fix
      # for the identical problem -- targets the real stanza syntax directly.
      shell: |
        set -e
        if grep -qE "^(auto|allow-|iface)\s+{{ _rmm_iface }}\b" /etc/network/interfaces; then
          sed -i "/^auto\s\+{{ _rmm_iface }}\b/d"      /etc/network/interfaces
          sed -i "/^allow-.*\s{{ _rmm_iface }}\b/d"     /etc/network/interfaces
          sed -i "/^iface[[:space:]]\+{{ _rmm_iface }}\b/,/^[^[:space:]]/d" /etc/network/interfaces
          echo 1
        else
          echo 0
        fi
      register: _rmm_interfaces_cleaned
      changed_when: _rmm_interfaces_cleaned.stdout | trim == '1'
      when: _rmm_interfaces_file.stat.exists

    - name: "2 | Ensure NetworkManager manages interfaces"
      ini_file:
        path: /etc/NetworkManager/NetworkManager.conf
        section: ifupdown
        option: managed
        value: "true"
        no_extra_spaces: true
        backup: true
      notify: Restart NetworkManager

    - name: "2 | Ensure NetworkManager is running"
      systemd:
        name: NetworkManager
        state: started
        enabled: true

    - name: "2 | Detect current live IP on the rmm interface"
      tags: network
      ansible.builtin.shell: |
        nmcli -g IP4.ADDRESS dev show {{ _rmm_iface }} 2>/dev/null | head -1 | cut -d/ -f1
      register: _rmm_ip_live
      changed_when: false
      failed_when: false

    - name: "2 | Set flag — would bringing rmm-static up now strand this session?"
      tags: network
      ansible.builtin.set_fact:
        _rmm_activate_would_strand_session: >-
          {{
            _rmm_ip_live.stdout | trim != ''
            and _rmm_ip_live.stdout | trim != rmm_static_ip
          }}

    - name: "2 | Write rmm-static NetworkManager connection profile"
      tags: network
      ansible.builtin.template:
        src: rmm-static.nmconnection.j2
        dest: /etc/NetworkManager/system-connections/rmm-static.nmconnection
        owner: root
        group: root
        mode: "0600"
      notify: Reload NetworkManager connections

    - name: "2 | Flush handlers (reload NM connection state, if the profile actually changed)"
      tags: network
      ansible.builtin.meta: flush_handlers

    - name: "2 | Note — rmm static IP correction needs a reboot (or manual con up) to take effect"
      tags: network
      debug:
        msg: >-
          TacticalRMM static IP is changing from {{ _rmm_ip_live.stdout | trim }} to
          {{ rmm_static_ip }} on {{ _rmm_iface }} — this session may be connected via
          that same interface, so bringing the connection up now would risk dropping it
          mid-play. The corrected profile has been written to disk — nothing has been
          applied live. Reboot this host, or run `nmcli connection up rmm-static`
          yourself from a session that isn't riding {{ _rmm_iface }} (e.g. console/
          out-of-band), once you're ready to apply it.
      when: _rmm_activate_would_strand_session

    - name: "2 | Bring up rmm-static connection"
      tags: network
      command: nmcli connection up rmm-static
      changed_when: false
      when: not _rmm_activate_would_strand_session

  # ---------------------------------------------------------------------------
  # Section 3 — Base packages
  # ---------------------------------------------------------------------------

    - name: "3 | Update apt cache"
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: "3 | Upgrade all packages"
      apt:
        upgrade: dist
        dpkg_options: "force-confold,force-confdef"

    - name: "3 | Install base packages"
      apt:
        name: "{{ rmm_base_packages }}"
        state: present
        install_recommends: false
        dpkg_options: "force-confold,force-confdef"

  # ---------------------------------------------------------------------------
  # Section 4 — UFW firewall
  # install.sh's own nginx needs 80/443 open when it runs (manually, later) --
  # opened here so the box is genuinely ready for that step, nothing else to
  # configure network-side first.
  # ---------------------------------------------------------------------------

    - name: "4 | Set UFW default — deny incoming"
      ufw:
        direction: incoming
        policy: deny

    - name: "4 | Set UFW default — allow outgoing"
      ufw:
        direction: outgoing
        policy: allow

    - name: "4 | Allow SSH"
      ufw:
        rule: allow
        port: "22"
        proto: tcp
        comment: SSH

    - name: "4 | Allow TacticalRMM HTTPS"
      ufw:
        rule: allow
        port: "443"
        proto: tcp
        comment: TacticalRMM HTTPS

    - name: "4 | Allow TacticalRMM HTTP (redirect / ACME, if ever used)"
      ufw:
        rule: allow
        port: "80"
        proto: tcp
        comment: TacticalRMM HTTP

    - name: "4 | Enable UFW"
      ufw:
        state: enabled

  # ---------------------------------------------------------------------------
  # Section 5 — Dynamic MOTD
  # ---------------------------------------------------------------------------

    - name: "5 | Write dynamic MOTD script"
      copy:
        dest: /etc/update-motd.d/10-examplemusic
        mode: "0755"
        content: |
          #!/usr/bin/env bash
          WH='\033[1;37m'; YL='\033[1;33m'; GR='\033[0;32m'; CY='\033[0;36m'; NC='\033[0m'
          UPTIME=$(uptime -p)
          LOAD=$(cut -d' ' -f1-3 /proc/loadavg)
          MEM_TOTAL=$(awk '/MemTotal/{print int($2/1024)}' /proc/meminfo)
          MEM_FREE=$(awk '/MemAvailable/{print int($2/1024)}' /proc/meminfo)
          MEM_USED=$(( MEM_TOTAL - MEM_FREE ))
          DISK=$(df -h / | awk 'NR==2{print $3" used of "$2" ("$5")"}')
          RMM_INSTALLED="not yet installed (see playbooks/tacticalrmm/README.md)"
          [[ -d /rmm ]] && RMM_INSTALLED="installed"
          echo -e "
          ${WH}╔══════════════════════════════════════════════════════════════╗${NC}
          ${WH}║     EXAMPLE MUSIC LIMITED: $(printf '%-35s' "${HOSTNAME}")║${NC}
          ${WH}╚══════════════════════════════════════════════════════════════╝${NC}

            ${YL}Site     :${NC} {{ rmm_site_code }}: {{ rmm_site_city }}, {{ rmm_site_country }}
            ${YL}Entity   :${NC} {{ rmm_site_entity }}
            ${YL}Role     :${NC} TacticalRMM endpoint monitoring server

            ${WH}── TacticalRMM ──────────────────────────────────────────────${NC}
              ${CY}Status${NC}     : ${GR}${RMM_INSTALLED}${NC}
              ${CY}Web UI${NC}     : ${GR}https://{{ rmm_frontend_subdomain }}.{{ rmm_domain }}${NC} (once installed)
              ${CY}Install${NC}    : ${GR}see playbooks/tacticalrmm/README.md${NC}

            ${WH}── System ───────────────────────────────────────────────────${NC}
              ${CY}Uptime${NC}     : ${GR}${UPTIME}${NC}
              ${CY}Load${NC}       : ${GR}${LOAD}${NC}
              ${CY}Memory${NC}     : ${GR}${MEM_USED}MB${NC} used of ${MEM_TOTAL}MB
              ${CY}Disk /${NC}     : ${GR}${DISK}${NC}
          "

    - name: "5 | Enable MOTD in sshd_config"
      lineinfile:
        path: /etc/ssh/sshd_config
        regexp: "^#?PrintMotd"
        line: "PrintMotd yes"
        state: present
      notify: Restart SSH

    - name: "5 | Write MOTD profile.d hook"
      copy:
        dest: /etc/profile.d/motd.sh
        mode: "0755"
        content: |
          [[ -x /etc/update-motd.d/10-examplemusic ]] && /etc/update-motd.d/10-examplemusic

  # ---------------------------------------------------------------------------
  # Section 6 — Node info file
  # ---------------------------------------------------------------------------

    - name: "6 | Resolve environment"
      include_tasks: ../../tasks/nodeinfo_environment.yml

    - name: "6 | Set rmm_environment"
      set_fact:
        rmm_environment: "{{ resolved_environment }}"

    - name: "6 | Ensure /etc/example-music directory exists"
      file:
        path: /etc/example-music
        state: directory
        mode: "0755"

    - name: "6 | Write /etc/example-music/nodeinfo.json"
      include_tasks: ../../tasks/nodeinfo.yml
      vars:
        nodeinfo_hostname: "{{ rmm_hostname }}"
        nodeinfo_role: "tacticalrmm"
        nodeinfo_site: "{{ rmm_site_code }}"
        nodeinfo_city: "{{ rmm_site_city }}"
        nodeinfo_country: "{{ rmm_site_country }}"
        nodeinfo_entity: "{{ rmm_site_entity }}"
        nodeinfo_street: "{{ rmm_site_street | default('') }}"
        nodeinfo_postal_code: "{{ rmm_site_postal_code | default('') }}"
        nodeinfo_environment: "{{ rmm_environment | default('production') }}"
        nodeinfo_bootstrapped_by: "tacticalrmm_server.yml"
        nodeinfo_extra:
          static_ip: "{{ rmm_static_ip }}"
          rmm_install_status: "VM prep + Phase 1 (prompts/secrets) done — see PLAN-tacticalrmmme.md for remaining phases"

  # ---------------------------------------------------------------------------
  # Section 10 — TacticalRMM install: nginx, NodeJS, Python 3.11.8, Redis, Git
  # Ansible-native install build, Phase 3 (install.sh steps 7-10). Every
  # GPG key URL, repo line, package name, and Python build flag below was
  # pulled from the real, current install.sh via WebFetch 2026-08-06, not
  # guessed -- including confirming nginx.org actually publishes a real
  # `trixie` repo (curled its dists/ listing directly) before trusting the
  # osname/codename substitution would work on this box.
  #
  # $osname/$codename (install.sh's own `lsb_release -si`/`-sc`) map
  # directly to Ansible facts this play already gathers --
  # ansible_distribution | lower / ansible_distribution_release -- no need
  # to shell out to lsb_release separately.
  #
  # GPG key + apt source pattern matches the established house idiom
  # (rudder_server.yml's own "Download Rudder GPG key" task): shell +
  # `creates:` for idempotency, not the deprecated apt_key module.
  # ---------------------------------------------------------------------------

    - name: "10 | Ensure /etc/apt/keyrings exists"
      file:
        path: /etc/apt/keyrings
        state: directory
        mode: "0755"

    - name: "10 | Fetch nginx GPG key"
      shell: >
        wget -qO - https://nginx.org/keys/nginx_signing.key
        | gpg --dearmor -o /etc/apt/keyrings/nginx-archive-keyring.gpg
      args:
        creates: /etc/apt/keyrings/nginx-archive-keyring.gpg

    - name: "10 | Add nginx apt repository"
      copy:
        dest: /etc/apt/sources.list.d/nginx.list
        content: >
          deb [signed-by=/etc/apt/keyrings/nginx-archive-keyring.gpg]
          http://nginx.org/packages/{{ ansible_distribution | lower }} {{ ansible_distribution_release }} nginx
        mode: "0644"
      register: _rmm_nginx_repo

    - name: "10 | Update apt cache (nginx repo added)"
      apt:
        update_cache: true
      when: _rmm_nginx_repo.changed

    - name: "10 | Install nginx"
      apt:
        name: nginx
        state: present

    - name: "10 | Write nginx.conf (install.sh's own content, verbatim)"
      copy:
        dest: /etc/nginx/nginx.conf
        mode: "0644"
        content: |
          worker_rlimit_nofile 1000000;
          user www-data;
          worker_processes auto;
          pid /run/nginx.pid;
          include /etc/nginx/modules-enabled/*.conf;

          events {
                  worker_connections 4096;
          }

          http {
                  sendfile on;
                  tcp_nopush on;
                  types_hash_max_size 2048;
                  server_names_hash_bucket_size 256;
                  include /etc/nginx/mime.types;
                  default_type application/octet-stream;
                  ssl_protocols TLSv1.2 TLSv1.3;
                  ssl_prefer_server_ciphers on;
                  access_log /var/log/nginx/access.log;
                  error_log /var/log/nginx/error.log;
                  gzip on;
                  include /etc/nginx/conf.d/*.conf;
                  include /etc/nginx/sites-enabled/*;
          }

    - name: "10 | Stop nginx (no site configs/certs yet -- install.sh leaves it down too)"
      systemd:
        name: nginx
        state: stopped

    - name: "10 | Fetch NodeSource GPG key"
      shell: >
        curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key
        | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
      args:
        creates: /etc/apt/keyrings/nodesource.gpg

    - name: "10 | Add NodeSource apt repository (Node 24.x, matching install.sh's own NODE_MAJOR)"
      copy:
        dest: /etc/apt/sources.list.d/nodesource.list
        content: "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_24.x nodistro main\n"
        mode: "0644"
      register: _rmm_nodesource_repo

    - name: "10 | Update apt cache (NodeSource repo added)"
      apt:
        update_cache: true
      when: _rmm_nodesource_repo.changed

    - name: "10 | Install NodeJS"
      apt:
        name: nodejs
        state: present

    - name: "10 | Upgrade npm to latest"
      community.general.npm:
        name: npm
        global: true
        state: latest

    # Python provisioning -- codename-aware, added 2026-08-06 after Robert
    # questioned why this unconditionally builds from source when Debian
    # ships Python natively. install.sh always builds 3.11.8 from source on
    # every OS it supports, but that's only strictly NECESSARY where nothing
    # in Django 4.2's own officially-supported range (Python 3.8-3.12,
    # confirmed against Django's real docs, not guessed) is available as a
    # native package. Checked each codename against the real Debian/Ubuntu
    # package archives, not assumed:
    #   bullseye (Debian 11) -> python3.9   (in range)
    #   bookworm (Debian 12) -> python3.11  (in range -- same major.minor
    #                           install.sh itself pins, just a different
    #                           patch release)
    #   jammy    (Ubuntu 22.04) -> python3.10 (in range)
    #   trixie   (Debian 13) -> only python3.13 exists at all, OUT of
    #                           range -- no native shortcut exists, this is
    #                           the one codename that genuinely needs the
    #                           from-source build (not just "for
    #                           consistency" the way install.sh frames it
    #                           for its own officially-supported OSes).
    # Anything not in this map falls back to building from source too --
    # the same safe-by-default choice install.sh itself makes.
    - name: "10 | Determine native in-range Python package for this codename"
      set_fact:
        _rmm_native_python: >-
          {{
            {
              'bullseye': 'python3.9',
              'bookworm': 'python3.11',
              'jammy':    'python3.10',
            }[ansible_distribution_release] | default('', true)
          }}

    - name: "10 | Install native Python package (codename has one in Django 4.2's supported range)"
      apt:
        name:
          - "{{ _rmm_native_python }}"
          - "{{ _rmm_native_python }}-venv"
        state: present
      when: _rmm_native_python != ''

    - name: "10 | Install Python 3.11.8 build dependencies (no native in-range package for this codename)"
      apt:
        name:
          - build-essential
          - zlib1g-dev
          - libncurses5-dev
          - libgdbm-dev
          - libnss3-dev
          - libssl-dev
          - libreadline-dev
          - libffi-dev
          - libsqlite3-dev
          - libbz2-dev
        state: present
      when: _rmm_native_python == ''

    - name: "10 | Download Python 3.11.8 source"
      get_url:
        url: https://www.python.org/ftp/python/3.11.8/Python-3.11.8.tgz
        dest: /root/Python-3.11.8.tgz
        mode: "0644"
      when: _rmm_native_python == ''

    # altinstall (not install) -- preserves the system's own default python3,
    # confirmed from install.sh's real source, not assumed. Gated entirely
    # behind a single `creates:` check on the resulting binary -- the whole
    # extract+configure+make+altinstall sequence takes several minutes and
    # is atomic in intent, no value in checking each sub-step separately.
    - name: "10 | Extract, build, and altinstall Python 3.11.8"
      shell: |
        set -e
        cd /root
        tar -xf Python-3.11.8.tgz
        cd Python-3.11.8
        ./configure --enable-optimizations
        make -j "$(nproc)"
        make altinstall
      args:
        creates: /usr/local/bin/python3.11
      when: _rmm_native_python == ''

    - name: "10 | Clean up Python 3.11.8 source files"
      file:
        path: "{{ item }}"
        state: absent
      loop:
        - /root/Python-3.11.8
        - /root/Python-3.11.8.tgz
      when: _rmm_native_python == ''

    # Later phases (backend venv creation) need to know which interpreter to
    # use regardless of which path provisioned it -- apt-installed binaries
    # live at /usr/bin/python3.X, the from-source altinstall lives at
    # /usr/local/bin/python3.11. One fact, set here once, so nothing further
    # down the playbook needs to re-derive this or care which path ran.
    - name: "10 | Set rmm_python_bin fact for later phases"
      set_fact:
        rmm_python_bin: >-
          {{ ('/usr/bin/' + _rmm_native_python) if _rmm_native_python != '' else '/usr/local/bin/python3.11' }}

    - name: "10 | Install Redis (Git already covered by rmm_base_packages)"
      apt:
        name: redis
        state: present

  # ---------------------------------------------------------------------------
  # Section 11 — TacticalRMM install: PostgreSQL 18 + two databases
  # Ansible-native install build, Phase 4 (install.sh step 11). Every GPG key
  # URL, repo line, and psql command pulled from the real, current
  # install.sh via WebFetch 2026-08-06. Also resolves the one thing
  # README.md's "Debian Trixie caveat" flagged as genuinely unverified --
  # whether apt.postgresql.org actually publishes a trixie-pgdg build:
  # confirmed directly (curled dists/ -- trixie-pgdg exists; curled the
  # trixie-pgdg Packages index -- postgresql-18 is really in it, real
  # version strings returned, not a guess).
  #
  # No existing PostgreSQL-provisioning pattern anywhere else in this repo
  # to follow (checked first) -- and adding the community.postgresql
  # collection + psycopg on the target for one host's two databases is more
  # new-dependency weight than this warrants. Uses the exact same mechanism
  # install.sh itself does instead: individual `psql -c "..."` commands,
  # just run via become_user: postgres (this play already runs become:
  # true/root, so no need for install.sh's own `sudo -iu postgres` wrapping)
  # rather than install.sh's linear one-shot-and-done shape. Idempotency
  # comes from an explicit existence check before CREATE DATABASE/CREATE
  # USER -- the ALTER ROLE/GRANT statements that follow are only run
  # together with a fresh CREATE USER (same atomic "set this role up" unit
  # install.sh treats them as), not re-run against an already-configured
  # role on every play.
  #
  # Credentials banner (Robert, 2026-08-06: "there is no reason whatsoever
  # that ansible can't do this itself AND print the banner") -- prints the
  # two PostgreSQL role passwords ONLY when this run actually just created
  # them. Deliberate: rmm_pg_password/rmm_mesh_pg_password are generated
  # fresh (ephemeral, /dev/null-backed) on every single run -- printing them
  # unconditionally on a re-run against an already-configured role would
  # show a value that was never actually applied to PostgreSQL at all,
  # actively wrong to file into KeePass. Only true the run a role is first
  # created, which is exactly when it needs capturing.
  # ---------------------------------------------------------------------------

    - name: "11 | Fetch PostgreSQL GPG key"
      shell: >
        wget --quiet -O - https://www.postgresql.org/media/keys/ACCC4CF8.asc
        | gpg --dearmor -o /etc/apt/keyrings/postgresql-archive-keyring.gpg
      args:
        creates: /etc/apt/keyrings/postgresql-archive-keyring.gpg

    - name: "11 | Add PostgreSQL apt repository"
      copy:
        dest: /etc/apt/sources.list.d/pgdg.list
        content: >
          deb [arch={{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}
          signed-by=/etc/apt/keyrings/postgresql-archive-keyring.gpg]
          https://apt.postgresql.org/pub/repos/apt/ {{ ansible_distribution_release }}-pgdg main
        mode: "0644"
      register: _rmm_pgdg_repo

    - name: "11 | Update apt cache (PostgreSQL repo added)"
      apt:
        update_cache: true
      when: _rmm_pgdg_repo.changed

    - name: "11 | Install PostgreSQL 18"
      apt:
        name: postgresql-18
        state: present

    - name: "11 | Ensure PostgreSQL is enabled and running"
      systemd:
        name: postgresql
        enabled: true
        state: started

    # --- TacticalRMM database + role -------------------------------------

    - name: "11 | Check if tacticalrmm database exists"
      command: psql -tAc "SELECT 1 FROM pg_database WHERE datname='tacticalrmm'"
      become_user: postgres
      register: _rmm_pg_db_check
      changed_when: false

    - name: "11 | Create tacticalrmm database"
      command: psql -c "CREATE DATABASE tacticalrmm"
      become_user: postgres
      when: _rmm_pg_db_check.stdout | trim != '1'

    - name: "11 | Check if TacticalRMM PostgreSQL role exists"
      command: "psql -tAc \"SELECT 1 FROM pg_roles WHERE rolname='{{ rmm_pg_user }}'\""
      become_user: postgres
      register: _rmm_pg_role_check
      changed_when: false

    - name: "11 | Create TacticalRMM PostgreSQL role + configure it (first time only)"
      command: "{{ item }}"
      become_user: postgres
      loop:
        - "psql -c \"CREATE USER {{ rmm_pg_user }} WITH PASSWORD '{{ rmm_pg_password }}'\""
        - "psql -c \"ALTER ROLE {{ rmm_pg_user }} SET client_encoding TO 'utf8'\""
        - "psql -c \"ALTER ROLE {{ rmm_pg_user }} SET default_transaction_isolation TO 'read committed'\""
        - "psql -c \"ALTER ROLE {{ rmm_pg_user }} SET timezone TO 'UTC'\""
        - "psql -c \"GRANT ALL PRIVILEGES ON DATABASE tacticalrmm TO {{ rmm_pg_user }}\""
        - "psql -c \"ALTER DATABASE tacticalrmm OWNER TO {{ rmm_pg_user }}\""
        - "psql -c \"GRANT USAGE, CREATE ON SCHEMA PUBLIC TO {{ rmm_pg_user }}\""
      when: _rmm_pg_role_check.stdout | trim != '1'
      no_log: true

    # --- MeshCentral database + role --------------------------------------

    - name: "11 | Check if meshcentral database exists"
      command: psql -tAc "SELECT 1 FROM pg_database WHERE datname='meshcentral'"
      become_user: postgres
      register: _rmm_mesh_pg_db_check
      changed_when: false

    - name: "11 | Create meshcentral database"
      command: psql -c "CREATE DATABASE meshcentral"
      become_user: postgres
      when: _rmm_mesh_pg_db_check.stdout | trim != '1'

    - name: "11 | Check if MeshCentral PostgreSQL role exists"
      command: "psql -tAc \"SELECT 1 FROM pg_roles WHERE rolname='{{ rmm_mesh_pg_user }}'\""
      become_user: postgres
      register: _rmm_mesh_pg_role_check
      changed_when: false

    - name: "11 | Create MeshCentral PostgreSQL role + configure it (first time only)"
      command: "{{ item }}"
      become_user: postgres
      loop:
        - "psql -c \"CREATE USER {{ rmm_mesh_pg_user }} WITH PASSWORD '{{ rmm_mesh_pg_password }}'\""
        - "psql -c \"ALTER ROLE {{ rmm_mesh_pg_user }} SET client_encoding TO 'utf8'\""
        - "psql -c \"ALTER ROLE {{ rmm_mesh_pg_user }} SET default_transaction_isolation TO 'read committed'\""
        - "psql -c \"ALTER ROLE {{ rmm_mesh_pg_user }} SET timezone TO 'UTC'\""
        - "psql -c \"GRANT ALL PRIVILEGES ON DATABASE meshcentral TO {{ rmm_mesh_pg_user }}\""
        - "psql -c \"ALTER DATABASE meshcentral OWNER TO {{ rmm_mesh_pg_user }}\""
        - "psql -c \"GRANT USAGE, CREATE ON SCHEMA PUBLIC TO {{ rmm_mesh_pg_user }}\""
      when: _rmm_mesh_pg_role_check.stdout | trim != '1'
      no_log: true

    # --- Credentials banner (only when something was actually just created) ---

    - name: "11 | Credentials banner -- PostgreSQL roles just created this run"
      debug:
        msg:
          - "=================================================================="
          - "PostgreSQL credentials created THIS RUN -- file into KeePassXC now"
          - "(benarbejde/kpcli_wrapper.py), these will not be shown again:"
          - "=================================================================="
          - "TacticalRMM DB role : {{ rmm_pg_user }}"
          - "TacticalRMM DB pass : {{ rmm_pg_password }}"
          - "MeshCentral DB role : {{ rmm_mesh_pg_user }}"
          - "MeshCentral DB pass : {{ rmm_mesh_pg_password }}"
          - "=================================================================="
      when: >-
        _rmm_pg_role_check.stdout | trim != '1'
        or _rmm_mesh_pg_role_check.stdout | trim != '1'

  # ---------------------------------------------------------------------------
  # Section 12 — TacticalRMM install: repo clones + service user
  # Ansible-native install build, Phase 5 (install.sh step 12).
  #
  # Real gap in install.sh itself, not ported: it creates NO dedicated
  # service user at all -- everything (including the later uwsgi/daphne
  # systemd units) runs as ${USER}, whichever human happened to run the
  # installer via sudo, group www-data. That doesn't translate to this
  # play's execution model (Ansible runs entirely as root via become:
  # true), and running the actual services as root would be worse than
  # install.sh's own non-root intent, not equivalent to it. Creates a
  # dedicated system account (rmm_service_user, no login shell) instead --
  # owns /rmm and the community-scripts checkout, and later phases' systemd
  # units run as this user rather than root or an ambiguous "$USER".
  #
  # Uses ansible.builtin.git (idempotent by design -- handles "already
  # cloned, already on the right branch" natively) rather than raw shell
  # git clone commands. install.sh's own `git config user.email/user.name`
  # inside each repo is real and needed (later git operations against these
  # checkouts -- e.g. community-scripts pulling updates -- fail without a
  # configured identity), ported via git config, not skipped.
  # ---------------------------------------------------------------------------

    # create_home: true -- real live bug, EXARMMCLD001, 2026-08-06: with
    # create_home: false, /etc/passwd still points this user's home at
    # /home/tacticalrmm (Ansible's user module sets that path regardless),
    # but the directory itself was never created. npm (Section 14, run as
    # this user) needs a writable $HOME to cache into (~/.npm/) and failed
    # outright (EACCES trying to mkdir a home directory that doesn't
    # exist). Standard practice for a service account that runs
    # language-ecosystem tooling (npm/pip) needing somewhere to cache --
    # nologin shell already blocks interactive login regardless of whether
    # a home directory exists.
    - name: "12 | Create dedicated tacticalrmm service user"
      user:
        name: "{{ rmm_service_user }}"
        system: true
        shell: /usr/sbin/nologin
        groups: www-data
        append: true
        create_home: true

    # Real live bug, EXARMMCLD001, 2026-08-06: on the first run this cloned
    # as root, then a later task reassigned /rmm to rmm_service_user. On the
    # SECOND run, the git module (running as root, Ansible's default) tried
    # to verify/update origin's URL inside a directory it no longer owned --
    # git's own "dubious ownership" safety check (CVE-2022-24765's fix)
    # correctly refused. Root cause was task ordering, not a missing
    # existence check: git IS idempotent about "already cloned", it just
    # never got the chance to prove it. Fixed properly by having
    # rmm_service_user own the directory from before the clone even starts,
    # so the same user performs every git operation against it, this run
    # and every future one -- not by re-chowning afterward each time.
    #
    # Directories are pre-created as root first (a non-root user can't
    # mkdir directly under / or /opt -- both are root-owned, mode 0755) so
    # the actual clone/config below can then run entirely as
    # rmm_service_user with no ownership mismatch at any point.
    - name: "12 | Pre-create /rmm owned by the service user"
      file:
        path: /rmm
        state: directory
        owner: "{{ rmm_service_user }}"
        group: "{{ rmm_service_user }}"
        mode: "0755"

    - name: "12 | Clone tacticalrmm repo to /rmm (as the service user)"
      git:
        repo: https://github.com/amidaware/tacticalrmm.git
        dest: /rmm
        version: master
      become_user: "{{ rmm_service_user }}"

    - name: "12 | Configure git identity in /rmm (as the service user)"
      command: "{{ item }}"
      args:
        chdir: /rmm
      loop:
        - 'git config user.email "admin@example.com"'
        - 'git config user.name "Bob"'
      changed_when: true
      become_user: "{{ rmm_service_user }}"

    - name: "12 | Pre-create /opt/trmm-community-scripts owned by the service user"
      file:
        path: /opt/trmm-community-scripts
        state: directory
        owner: "{{ rmm_service_user }}"
        group: "{{ rmm_service_user }}"
        mode: "0755"

    - name: "12 | Clone community-scripts repo (as the service user)"
      git:
        repo: https://github.com/amidaware/community-scripts.git
        dest: /opt/trmm-community-scripts
        version: main
      become_user: "{{ rmm_service_user }}"

    - name: "12 | Configure git identity in community-scripts (as the service user)"
      command: "{{ item }}"
      args:
        chdir: /opt/trmm-community-scripts
      loop:
        - 'git config user.email "admin@example.com"'
        - 'git config user.name "Bob"'
      changed_when: true
      become_user: "{{ rmm_service_user }}"

  # ---------------------------------------------------------------------------
  # Section 13 — TacticalRMM install: NATS server + nats-api
  # Ansible-native install build, Phase 6 (install.sh steps 13, 16).
  #
  # NATS_SERVER_VER isn't a fixed constant anywhere in install.sh -- it's
  # read dynamically from the just-cloned repo's own
  # /rmm/api/tacticalrmm/tacticalrmm/settings.py (confirmed against the
  # real current file: `NATS_SERVER_VER = "2.14.2"`), so whatever version
  # TacticalRMM itself is pinned to at clone time is what gets installed --
  # ported the same way, not hardcoded here, so this doesn't silently drift
  # from whatever /rmm actually needs as upstream bumps it.
  #
  # nats-api is NOT downloaded separately -- confirmed against the real
  # repo (github.com/amidaware/tacticalrmm/tree/master/natsapi/bin): the
  # prebuilt binary already ships inside the just-cloned /rmm checkout
  # itself (natsapi/bin/nats-api or natsapi/bin/nats-api-arm64), install.sh
  # just copies whichever matches this host's arch. Uses copy:
  # remote_src: true (checksums the source, idempotent by design) rather
  # than a raw shell cp.
  # ---------------------------------------------------------------------------

    - name: "13 | Read NATS_SERVER_VER from the cloned repo's settings.py"
      command: grep '^NATS_SERVER_VER' /rmm/api/tacticalrmm/tacticalrmm/settings.py
      register: _rmm_nats_ver_line
      changed_when: false

    - name: "13 | Extract NATS version number"
      set_fact:
        rmm_nats_version: "{{ (_rmm_nats_ver_line.stdout | regex_search('\"([^\"]+)\"', '\\1'))[0] }}"

    - name: "13 | Determine NATS/nats-api arch-specific names"
      set_fact:
        _rmm_nats_arch: "{{ 'amd64' if ansible_architecture == 'x86_64' else 'arm64' }}"
        _rmm_natsapi_binary: "{{ 'nats-api' if ansible_architecture == 'x86_64' else 'nats-api-arm64' }}"

    - name: "13 | Download NATS server release"
      unarchive:
        src: "https://github.com/nats-io/nats-server/releases/download/v{{ rmm_nats_version }}/nats-server-v{{ rmm_nats_version }}-linux-{{ _rmm_nats_arch }}.tar.gz"
        dest: /tmp
        remote_src: true
        creates: "/tmp/nats-server-v{{ rmm_nats_version }}-linux-{{ _rmm_nats_arch }}/nats-server"

    - name: "13 | Install nats-server binary"
      copy:
        src: "/tmp/nats-server-v{{ rmm_nats_version }}-linux-{{ _rmm_nats_arch }}/nats-server"
        dest: /usr/local/bin/nats-server
        mode: "0755"
        owner: "{{ rmm_service_user }}"
        group: "{{ rmm_service_user }}"
        remote_src: true

    - name: "13 | Clean up NATS server download"
      file:
        path: "/tmp/nats-server-v{{ rmm_nats_version }}-linux-{{ _rmm_nats_arch }}"
        state: absent

    - name: "13 | Install nats-api binary (ships inside the cloned /rmm repo, not downloaded)"
      copy:
        src: "/rmm/natsapi/bin/{{ _rmm_natsapi_binary }}"
        dest: /usr/local/bin/nats-api
        mode: "0755"
        owner: "{{ rmm_service_user }}"
        group: "{{ rmm_service_user }}"
        remote_src: true

  # ---------------------------------------------------------------------------
  # Section 14 — TacticalRMM install: MeshCentral files
  # Ansible-native install build, Phase 7 (install.sh step 14). Only the
  # files -- npm install and package/config.json -- not running MeshCentral
  # itself yet (that's a later phase, first-boot polling + account setup).
  #
  # MESH_VER read dynamically from the cloned repo's settings.py, same
  # pattern and same reasoning as NATS_SERVER_VER in Section 13 (confirmed
  # against the real current file: MESH_VER = "1.2.0") -- not hardcoded, so
  # it can't drift from whatever /rmm actually pins.
  #
  # config.json password consistency -- the one genuinely tricky part of
  # this phase: config.json bakes in rmm_mesh_pg_password, one of Section
  # 8's EPHEMERAL secrets (regenerated fresh every single run). If this
  # file got rewritten on some later run, it would contain a password that
  # was never actually applied to PostgreSQL -- the real role's password is
  # whatever was live the run it was actually created (Section 11), not
  # whatever Section 8 happens to regenerate today. Gated on the exact same
  # condition Section 11 uses to decide whether it's creating the
  # MeshCentral role THIS run (_rmm_mesh_pg_role_check) -- config.json can
  # only ever get written in the same run the matching password is actually
  # applied, never a run where it's stale. force: false is a second,
  # defense-in-depth layer on top of that gate, not a replacement for it --
  # protects a manually-recreated file even if the gate's own logic is ever
  # wrong.
  # ---------------------------------------------------------------------------

    - name: "14 | Create /meshcentral/meshcentral-data"
      file:
        path: /meshcentral/meshcentral-data
        state: directory
        owner: "{{ rmm_service_user }}"
        group: "{{ rmm_service_user }}"
        mode: "0755"

    - name: "14 | Read MESH_VER from the cloned repo's settings.py"
      command: grep '^MESH_VER' /rmm/api/tacticalrmm/tacticalrmm/settings.py
      register: _rmm_mesh_ver_line
      changed_when: false

    - name: "14 | Extract MeshCentral version number"
      set_fact:
        rmm_mesh_version: "{{ (_rmm_mesh_ver_line.stdout | regex_search('\"([^\"]+)\"', '\\1'))[0] }}"

    - name: "14 | Write /meshcentral/package.json"
      copy:
        dest: /meshcentral/package.json
        owner: "{{ rmm_service_user }}"
        group: "{{ rmm_service_user }}"
        mode: "0644"
        content: >-
          {{
            {
              "dependencies": {
                "archiver": "7.0.1",
                "meshcentral": rmm_mesh_version,
                "otplib": "12.0.1",
                "pg": "8.16.3"
              }
            } | to_nice_json
          }}

    # REWORKED 2026-08-07 -- real live bug: config.json's write never fired
    # even once. The gate assumed config.json and the Postgres role always
    # get created "the same run" -- true in the idealised fresh-box case,
    # false in practice: the meshcentral role was created back during
    # Phase 4's own testing, before this section existed at all, so
    # _rmm_mesh_pg_role_check.stdout | trim != '1' has never been true
    # since and never will be again for this role. Decoupled the two:
    # config.json's own existence is now the one thing that matters
    # (force: false already guarantees "never overwrite once written"), and
    # immediately before writing it for the first time, the role's password
    # is explicitly (re)synced to match whatever's about to be written --
    # correct regardless of whether the role happened to be created this
    # run, a past run, or years ago. This also means Django's own migrate
    # (Section 15) hit the identical bug for local_settings.py -- same fix
    # applied there.
    - name: "14 | Check if config.json already exists"
      stat:
        path: /meshcentral/meshcentral-data/config.json
      register: _rmm_mesh_config_check

    - name: "14 | Sync MeshCentral PostgreSQL role password (only if config.json doesn't exist yet)"
      command: "psql -c \"ALTER ROLE {{ rmm_mesh_pg_user }} WITH PASSWORD '{{ rmm_mesh_pg_password }}'\""
      become_user: postgres
      when: not _rmm_mesh_config_check.stat.exists
      no_log: true

    - name: "14 | Write MeshCentral config.json (only the first time -- force: false)"
      copy:
        dest: /meshcentral/meshcentral-data/config.json
        owner: "{{ rmm_service_user }}"
        group: "{{ rmm_service_user }}"
        mode: "0644"
        force: false
        content: >-
          {{
            {
              "settings": {
                "cert": (rmm_mesh_subdomain + "." + rmm_domain),
                "WANonly": true,
                "minify": 1,
                "port": 4430,
                "aliasPort": 443,
                "redirPort": 800,
                "allowLoginToken": true,
                "allowFraming": true,
                "agentPing": 35,
                "allowHighQualityDesktop": true,
                "tlsOffload": "127.0.0.1",
                "agentCoreDump": false,
                "compression": false,
                "wsCompression": false,
                "agentWsCompression": false,
                "maxInvalidLogin": {"time": 5, "count": 5, "coolofftime": 30},
                "autoBackup": false,
                "postgres": {
                  "user": rmm_mesh_pg_user,
                  "password": rmm_mesh_pg_password,
                  "port": "5432",
                  "host": "localhost"
                }
              },
              "domains": {
                "": {
                  "title": "Tactical RMM",
                  "title2": "Tactical RMM",
                  "newAccounts": false,
                  "certUrl": ("https://" + rmm_mesh_subdomain + "." + rmm_domain + ":443/"),
                  "geoLocation": true,
                  "cookieIpCheck": false,
                  "mstsc": true
                }
              }
            } | to_nice_json
          }}
      no_log: true

    - name: "14 | Run npm install in /meshcentral"
      community.general.npm:
        path: /meshcentral
      become_user: "{{ rmm_service_user }}"

  # ---------------------------------------------------------------------------
  # Section 15 — TacticalRMM install: self-signed cert, Django settings,
  # backend venv + migrations
  # Ansible-native install build, Phase 8 (install.sh steps 5 [--insecure
  # cert path only -- EXARMMCLD001 is internal/WireGuard-only, same
  # reasoning as EXAMSHCLD001's own TLS choice], 15, 17).
  #
  # local_settings.py password consistency -- same class of problem as
  # config.json in Section 14: this file bakes in rmm_pg_password, one of
  # Section 8's ephemeral secrets. Gated on the exact same condition
  # Section 11 uses to decide whether it's creating the TacticalRMM
  # PostgreSQL role THIS run (_rmm_pg_role_check) -- can never end up with
  # a password that was never actually applied. force: false as a second,
  # defense-in-depth layer, not a replacement for the gate. MESH_TOKEN_KEY
  # and the ADMIN_ENABLED=False flip are NOT written here -- both are
  # genuinely later-phase concerns (MeshCentral's own first-boot token
  # generation, and install.sh's own final cleanup step), appended/edited
  # by those phases when they land, not invented early.
  #
  # SETUPTOOLS_VER/WHEEL_VER read dynamically from the cloned repo's
  # settings.py, same pattern as NATS_SERVER_VER/MESH_VER (Sections 13/14)
  # -- confirmed against the real current file (80.9.0/0.45.1) -- not
  # hardcoded, so this can't silently drift from whatever /rmm actually
  # pins.
  #
  # Uses rmm_python_bin (set in Section 10) rather than a hardcoded
  # python3.11 -- resolves correctly whether Python was apt-installed
  # (bullseye/bookworm/jammy) or built from source (trixie), matching the
  # codename-aware provisioning already built there.
  #
  # ansible.builtin.pip's virtualenv: parameter creates /rmm/api/env on its
  # first invocation (idempotent -- reused, not recreated, by every
  # subsequent pip task and by the manage.py commands after) rather than a
  # separate raw `python -m venv` shell step.
  # ---------------------------------------------------------------------------

    - name: "15 | Ensure /etc/ssl/tactical exists"
      file:
        path: /etc/ssl/tactical
        state: directory
        mode: "0755"

    - name: "15 | Generate self-signed certificate (--insecure path -- EXARMMCLD001 is internal-only)"
      command: >-
        openssl req -x509 -newkey rsa:4096 -sha256 -days 3650
        -nodes -keyout /etc/ssl/tactical/key.pem -out /etc/ssl/tactical/cert.pem
        -subj "/CN={{ rmm_domain }}"
        -addext "subjectAltName=DNS:{{ rmm_domain }},DNS:*.{{ rmm_domain }}"
      args:
        creates: /etc/ssl/tactical/cert.pem

    # REWORKED 2026-08-07 -- real live bug: this task's write never fired
    # even once. install.sh's own manage.py migrate hard-failed with
    # "IndexError: list index out of range" on ALLOWED_HOSTS[0] --
    # local_settings.py had literally never been written to disk. Same
    # root cause and same fix as Section 14's config.json: gating on "was
    # the Postgres role just created THIS run" assumed the role and the
    # settings file always get created together, which broke down because
    # the tacticalrmm role was actually created back during Phase 4's own
    # testing, before this section existed. Decoupled: local_settings.py's
    # own existence is now what matters (force: false already guarantees
    # write-once), and the role's password is explicitly (re)synced to
    # match immediately before the first-ever write.
    - name: "15 | Check if local_settings.py already exists"
      stat:
        path: /rmm/api/tacticalrmm/local_settings.py
      register: _rmm_local_settings_check

    - name: "15 | Sync TacticalRMM PostgreSQL role password (only if local_settings.py doesn't exist yet)"
      command: "psql -c \"ALTER ROLE {{ rmm_pg_user }} WITH PASSWORD '{{ rmm_pg_password }}'\""
      become_user: postgres
      when: not _rmm_local_settings_check.stat.exists
      no_log: true

    - name: "15 | Write /rmm/api/tacticalrmm/local_settings.py (only the first time -- force: false)"
      copy:
        dest: /rmm/api/tacticalrmm/local_settings.py
        owner: "{{ rmm_service_user }}"
        group: "{{ rmm_service_user }}"
        mode: "0640"
        force: false
        content: |
          SECRET_KEY = "{{ rmm_django_secret_key }}"

          DEBUG = False

          ALLOWED_HOSTS = ['{{ rmm_backend_subdomain }}.{{ rmm_domain }}']

          ADMIN_URL = "{{ rmm_admin_url }}/"

          CORS_ORIGIN_WHITELIST = [
              "https://{{ rmm_frontend_subdomain }}.{{ rmm_domain }}"
          ]

          DATABASES = {
              'default': {
                  'ENGINE': 'django.db.backends.postgresql',
                  'NAME': 'tacticalrmm',
                  'USER': '{{ rmm_pg_user }}',
                  'PASSWORD': '{{ rmm_pg_password }}',
                  'HOST': 'localhost',
                  'PORT': '5432',
              }
          }

          MESH_USERNAME = "{{ rmm_mesh_username }}"
          MESH_SITE = "https://{{ rmm_mesh_subdomain }}.{{ rmm_domain }}"
          ADMIN_ENABLED = True

          TRMM_INSECURE = True

          CERT_FILE = "/etc/ssl/tactical/cert.pem"
          KEY_FILE = "/etc/ssl/tactical/key.pem"
      no_log: true

    - name: "15 | Install weasyprint system dependencies"
      apt:
        name: "{{ ['libpango-1.0-0', 'libharfbuzz0b', 'libpangoft2-1.0-0'] if ansible_distribution == 'Ubuntu' else ['libpango-1.0-0', 'libpangoft2-1.0-0'] }}"
        state: present

    - name: "15 | Read SETUPTOOLS_VER/WHEEL_VER from the cloned repo's settings.py"
      command: "{{ item }}"
      loop:
        - "grep '^SETUPTOOLS_VER' /rmm/api/tacticalrmm/tacticalrmm/settings.py"
        - "grep '^WHEEL_VER' /rmm/api/tacticalrmm/tacticalrmm/settings.py"
      register: _rmm_pip_ver_lines
      changed_when: false

    - name: "15 | Extract setuptools/wheel version numbers"
      set_fact:
        rmm_setuptools_version: "{{ (_rmm_pip_ver_lines.results[0].stdout | regex_search('\"([^\"]+)\"', '\\1'))[0] }}"
        rmm_wheel_version: "{{ (_rmm_pip_ver_lines.results[1].stdout | regex_search('\"([^\"]+)\"', '\\1'))[0] }}"

    # Real live bug, EXARMMCLD001, 2026-08-07: ansible.builtin.pip's
    # virtualenv: parameter failed outright -- "Failed to import the
    # required Python library (packaging) on exarmmcld001's Python
    # /usr/bin/python3.13". That's Ansible's OWN auto-detected system
    # interpreter (used for the module's internal virtualenv-detection/
    # version-comparison logic), not the venv being created -- packaging
    # isn't installed there and was never going to be. Sidestepped the
    # whole virtualenv: auto-creation mechanism instead: create the venv
    # explicitly (idempotent via creates:), then point pip at its own venv
    # binary directly via executable: -- shells out to that binary rather
    # than doing Python-level introspection in Ansible's system
    # interpreter, so this class of bug can't recur.
    - name: "15 | Create the backend venv"
      command: "{{ rmm_python_bin }} -m venv /rmm/api/env"
      args:
        creates: /rmm/api/env/bin/python
      become_user: "{{ rmm_service_user }}"

    # command, not the pip module -- even with executable: pointed at the
    # venv's own pip, ansible.builtin.pip's own code path may still need
    # `packaging` importable in Ansible's system interpreter for other
    # internal logic (version-spec comparisons), and that's not a risk
    # worth re-testing live a second time. Shelling out directly to the
    # venv's pip binary has no such dependency on anything outside the
    # venv itself -- also a closer, more literal match to install.sh's own
    # real commands (pip install --no-cache-dir pip==25.1, etc).
    - name: "15 | Upgrade pip in the backend venv"
      command: /rmm/api/env/bin/pip install --no-cache-dir pip==25.1
      become_user: "{{ rmm_service_user }}"
      changed_when: true

    - name: "15 | Install pinned setuptools/wheel in the backend venv"
      command: "/rmm/api/env/bin/pip install --no-cache-dir setuptools=={{ rmm_setuptools_version }} wheel=={{ rmm_wheel_version }}"
      become_user: "{{ rmm_service_user }}"
      changed_when: true

    - name: "15 | Install backend Python dependencies from requirements.txt"
      command: /rmm/api/env/bin/pip install --no-cache-dir -r /rmm/api/tacticalrmm/requirements.txt
      become_user: "{{ rmm_service_user }}"
      changed_when: true

    - name: "15 | Run Django backend setup (migrate, schemas, static, NATS/uWSGI conf, chocos/community scripts)"
      command: "/rmm/api/env/bin/python manage.py {{ item }}"
      args:
        chdir: /rmm/api/tacticalrmm
      loop:
        - migrate
        - generate_json_schemas
        - collectstatic --no-input
        - create_natsapi_conf
        - create_uwsgi_conf
        - load_chocos
        - load_community_scripts
      become_user: "{{ rmm_service_user }}"

  # ---------------------------------------------------------------------------
  # Handlers
  # ---------------------------------------------------------------------------

  handlers:

    - name: Restart NetworkManager
      systemd:
        name: NetworkManager
        state: restarted

    - name: Reload NetworkManager connections
      ansible.builtin.command: nmcli connection reload
      changed_when: true

    - name: Restart SSH
      systemd:
        name: ssh
        state: restarted
