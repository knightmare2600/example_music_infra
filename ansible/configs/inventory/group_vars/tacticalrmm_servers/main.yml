---
# =============================================================================
# group_vars/tacticalrmm_servers/main.yml
# Example Music Limited — TacticalRMM server group variables
#
# These apply to every host in [tacticalrmm_servers].
# Per-host overrides go in host_vars/<hostname>/main.yml.
# =============================================================================
# Version history
# =============================================================================
# v1.0.0  2026-08-04  Initial release. Remote management platform, phase 3.
#                     VM prep only -- see playbooks/tacticalrmm/README.md for
#                     why the actual TacticalRMM install itself isn't here.
# =============================================================================

# -----------------------------------------------------------------------------
# Domain -- derived from benarbejde/ad_forest.json (single source of truth),
# same pattern as rudder_servers/main.yml's rudder_domain.
# -----------------------------------------------------------------------------
rmm_domain: "{{ (lookup('file', ad_forest_json_path | default('/etc/example-music/ad_forest.json')) | from_json).domain_fqdn }}"

# -----------------------------------------------------------------------------
# Base packages -- general-purpose box hygiene PLUS install.sh's own step-1
# base package list (dirmngr/openssl added 2026-08-06, Ansible-native install
# Phase 2 -- curl/wget/jq/gnupg/lsb-release/ca-certificates were already
# here, no duplicate needed). PostgreSQL/Node.js/Python-from-source/nginx
# (install.sh's later steps) become this group's own tasks as further
# phases land, not this list -- see PLAN-tacticalrmmme.md's "2026-08-06
# pivot" for the full phase order.
#
# software-properties-common (also in install.sh's own step-1 list)
# deliberately dropped, 2026-08-06 -- real live failure against
# EXARMMCLD001: "No package matching 'software-properties-common' is
# available". Confirmed via sources.debian.org, not guessed: the
# software-properties source package has builds for bookworm/bullseye/
# .../sid, nothing for trixie -- genuinely absent from Debian's own repos
# on this OS, not a mirror/cache glitch. Also confirmed via WebFetch against
# the real install.sh that `add-apt-repository` (the one tool this package
# provides) is never actually called anywhere in the script -- it does all
# its own repo setup the same manual GPG-key + apt source-list-file way
# Section 10 already replicates. Dead weight on Trixie, not a real
# dependency -- dropped rather than chasing a substitute.
# -----------------------------------------------------------------------------
rmm_base_packages:
  - vim
  - git
  - curl
  - wget
  - htop
  - tree
  - jq
  - network-manager
  - molly-guard
  - fail2ban
  - ufw
  - ca-certificates
  - gnupg
  - lsb-release
  - dirmngr
  - openssl

# -----------------------------------------------------------------------------
# sites.csv path on the Ansible control node — same resolution as
# rudder_servers/main.yml's sites_csv_path.
# -----------------------------------------------------------------------------
sites_csv_path: "/etc/example-music/sites.csv"

# -----------------------------------------------------------------------------
# The three subdomains install.sh would have prompted for interactively --
# now consumed directly by tacticalrmm_server.yml's Section 7 (confirmed to
# the operator, not re-prompted -- see PLAN-tacticalrmmme.md's "2026-08-06
# pivot" for why re-asking an already-fixed, DNS-verified value would be a
# regression, not a faithful port).
# -----------------------------------------------------------------------------
rmm_frontend_subdomain: "rmm"
rmm_backend_subdomain:  "api"
rmm_mesh_subdomain:     "mesh"

# -----------------------------------------------------------------------------
# Dedicated service user (Section 12) -- install.sh itself never creates one
# (everything runs as $USER, whichever human ran the installer via sudo),
# which doesn't translate to this play's all-root Ansible execution model.
# Owns /rmm + the community-scripts checkout; later phases' systemd units
# (uwsgi/daphne/celery/celerybeat) run as this user, group www-data.
# -----------------------------------------------------------------------------
rmm_service_user: "tacticalrmm"
