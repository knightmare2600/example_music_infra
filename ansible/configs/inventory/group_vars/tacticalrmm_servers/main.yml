---
# =============================================================================
# group_vars/tacticalrmm_servers/main.yml
# Example Music Limited — TacticalRMM server group variables
#
# These apply to every host in [tacticalrmm_servers].
# Per-host overrides go in host_vars/<hostname>/main.yml.
# =============================================================================
# Version history
# =============================================================================
# v1.0.0  2026-08-04  Initial release. Remote management platform, phase 3.
#                     VM prep only -- see playbooks/tacticalrmm/README.md for
#                     why the actual TacticalRMM install itself isn't here.
# =============================================================================

# -----------------------------------------------------------------------------
# Domain -- derived from benarbejde/ad_forest.json (single source of truth),
# same pattern as rudder_servers/main.yml's rudder_domain.
# -----------------------------------------------------------------------------
rmm_domain: "{{ (lookup('file', ad_forest_json_path | default('/etc/example-music/ad_forest.json')) | from_json).domain_fqdn }}"

# -----------------------------------------------------------------------------
# Base packages -- deliberately minimal, general-purpose box hygiene, not
# TacticalRMM's own prerequisites. Was: "install.sh (run manually) installs
# its own PostgreSQL/Node.js/Python/nginx stack" -- superseded 2026-08-06,
# see PLAN-tacticalrmmme.md's "2026-08-06 pivot". Those packages become this
# group's own tasks as the Ansible-native install is built out phase by
# phase; this list isn't where they'll land once that happens.
# -----------------------------------------------------------------------------
rmm_base_packages:
  - vim
  - git
  - curl
  - wget
  - htop
  - tree
  - jq
  - network-manager
  - molly-guard
  - fail2ban
  - ufw
  - ca-certificates
  - gnupg
  - lsb-release

# -----------------------------------------------------------------------------
# sites.csv path on the Ansible control node — same resolution as
# rudder_servers/main.yml's sites_csv_path.
# -----------------------------------------------------------------------------
sites_csv_path: "/etc/example-music/sites.csv"

# -----------------------------------------------------------------------------
# The three subdomains install.sh would have prompted for interactively --
# now consumed directly by tacticalrmm_server.yml's Section 7 (confirmed to
# the operator, not re-prompted -- see PLAN-tacticalrmmme.md's "2026-08-06
# pivot" for why re-asking an already-fixed, DNS-verified value would be a
# regression, not a faithful port).
# -----------------------------------------------------------------------------
rmm_frontend_subdomain: "rmm"
rmm_backend_subdomain:  "api"
rmm_mesh_subdomain:     "mesh"
