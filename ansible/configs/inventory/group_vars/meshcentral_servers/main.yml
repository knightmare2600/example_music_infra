---
# =============================================================================
# group_vars/meshcentral_servers/main.yml
# Example Music Limited — MeshCentral server group variables
#
# These apply to every host in [meshcentral_servers].
# Per-host overrides go in host_vars/<hostname>/main.yml.
# =============================================================================
# Version history
# =============================================================================
# v1.0.0  2026-08-04  Initial release. Remote management platform, phase 1/2.
# =============================================================================

# -----------------------------------------------------------------------------
# Domain -- derived from benarbejde/ad_forest.json (single source of truth),
# same pattern as rudder_servers/main.yml's rudder_domain.
# -----------------------------------------------------------------------------
mesh_domain: "{{ (lookup('file', ad_forest_json_path | default('/etc/example-music/ad_forest.json')) | from_json).domain_fqdn }}"

# -----------------------------------------------------------------------------
# Base packages
# -----------------------------------------------------------------------------
mesh_base_packages:
  - vim
  - git
  - curl
  - wget
  - htop
  - tree
  - jq
  - network-manager
  - molly-guard
  - fail2ban
  - ufw
  - ca-certificates
  - gnupg
  - build-essential
  - python3

# -----------------------------------------------------------------------------
# Node.js — NodeSource LTS major version. MeshCentral needs a reasonably
# current Node; pin the major here rather than whatever Debian trixie's own
# apt repo happens to carry, same "don't guess, pin explicitly" reasoning as
# Salt's salt_version_major (see playbooks/salt/README.md).
# -----------------------------------------------------------------------------
mesh_nodejs_major: "22"

# -----------------------------------------------------------------------------
# Install layout
# -----------------------------------------------------------------------------
mesh_install_dir: "/opt/meshcentral"
mesh_user: "meshcentral"
mesh_port: 443

# -----------------------------------------------------------------------------
# TLS — self-signed (MeshCentral's own default, zero extra config), NOT
# Let's Encrypt. Confirmed with Robert 2026-08-04: this box is strictly
# internal/WireGuard-only, no public DNS or inbound 80/443 from the internet,
# so ACME validation genuinely can't work here. Revisit only if that changes.
# -----------------------------------------------------------------------------
mesh_cert_hostname: "mesh.{{ mesh_domain }}"

# -----------------------------------------------------------------------------
# sites.csv path on the Ansible control node — same resolution as
# rudder_servers/main.yml's sites_csv_path.
# -----------------------------------------------------------------------------
sites_csv_path: "/etc/example-music/sites.csv"
