---
# =============================================================================
# group_vars/truenas_servers/vault.yml
# Example Music Limited — TrueNAS REST API bootstrap secrets
#
# THIS FILE MUST BE ENCRYPTED WITH ansible-vault BEFORE COMMITTING.
#
# Encrypt:
#   ansible-vault encrypt group_vars/truenas_servers/vault.yml
#
# Edit in place:
#   ansible-vault edit group_vars/truenas_servers/vault.yml
#
# Used only by playbooks/truenas/playbooks/00-rest-bootstrap.yml — the
# one-time REST API call (https://<host>/api/v2.0/...) that enables SSH
# before any SSH connection can be made at all. This is the SAME admin
# account/password set during TrueNAS's own web-UI first-run wizard, not a
# separate credential — nothing here writes back to TrueNAS's own account
# store beyond starting/enabling the ssh service.
#
# Once SSH is confirmed working, ongoing management uses the dedicated
# `ansible` automation account (key-only, created by 10-access.yml) instead
# — this vault entry is only consulted for that one bootstrap stage
# (`--skip-tags rest-bootstrap` to bypass it on later runs against an
# already-working box).
#
# File this credential into KeePassXC too, once set here -- this is exactly
# the "one-off credential that doesn't fit extracted_credentials.json's
# devices.csv shape" case docs/Example Music Limited — KeePassXC CLI
# Automation.md §7a already covers via benarbejde/kpcli_wrapper.py (same
# tool, same posture 20-saltgui.yml's own summary uses for the saltgui
# login -- human-run, never Ansible, see
# push_credentials_to_keepass.py/kpcli_wrapper.py's own headers):
#   python3 benarbejde/kpcli_wrapper.py "~/KeePassXC/Example Music.kdbx" \
#     add "Infrastructure/<SITE>/EXANAS<SITE>001-rest-bootstrap" truenas_admin
# (prompts for the vault password, then this entry's password -- enter the
# same value as truenas_rest_bootstrap_password above.)
# =============================================================================
# Version history
# =============================================================================
# v1.0.2  2026-07-28  The v1.0.1 note below said root was "the SSH first-touch account
#                     10-access.yml uses, a different interface entirely" -- that was itself
#                     wrong, confirmed live against EXANASFAL001: no root password is ever set
#                     on these boxes, truenas_admin is the account for BOTH the REST call this
#                     file's variables serve AND the SSH first-touch stage in 10-access.yml.
# v1.0.1  2026-07-26  Fixed the username default -- confirmed directly by Robert that
#                     the web-UI first-run wizard's local admin account is always
#                     truenas_admin, not root (root is the SSH first-touch account
#                     10-access.yml uses, a different interface entirely -- the
#                     original value here was a wrong guess by analogy, not confirmed).
# v1.0.0  2026-07-26  Initial release.
# =============================================================================

# TrueNAS admin account used for HTTP Basic auth against the REST API. Confirmed by
# Robert, 2026-07-26 -- the web-UI first-run wizard's local admin account is always
# named truenas_admin (not root -- that's a different account, used by 10-access.yml's
# later SSH first-touch, not this one). The account's password is set by Robert during
# that same first-boot wizard.
truenas_rest_bootstrap_user: "truenas_admin"

# TrueNAS admin account password, set during the web-UI first-run wizard.
truenas_rest_bootstrap_password: "REPLACE_WITH_TRUENAS_ADMIN_PASSWORD"
