---
# =============================================================================
# group_vars/windows_dc/vars.yml
# Example Music Limited — Variables for Domain Controller hosts
# =============================================================================
# DCs are servers, so windows_server/vars.yml also applies.  Values here
# override or extend that group.
# =============================================================================
# Changelog:
#   2026-06-25  Initial file
#   2026-07-09  ad_domain_name/ad_netbios_name/dc_hub_sites/dc_cld_site/dc_dns_forwarders
#               derived from benarbejde/ad_forest.json instead of hardcoded -- this file
#               previously called itself the "single source of truth" for domain name/
#               NetBIOS, but exa_domain (group_vars/all) and rudder_domain
#               (group_vars/rudder_servers) each had their own separate hardcoded copy of
#               the same value, with no way to change one without hunting for the others.
#               ad_forest.json is the real single source now; this file (and the other two)
#               just read it.
#   2026-07-17  Added dc_forest_mode/dc_domain_mode, same pattern -- ad_forest.json already
#               had forest_mode/domain_mode fields (added 2026-07-09 alongside the others),
#               but nothing here read them, so 20-dc-promote.yml still hardcoded
#               -ForestMode/-DomainMode "WinThreshold" literally. Harmless only because that
#               literal happened to match ad_forest.json's own value.
# =============================================================================

# OU path used by 80-domainjoin.yml for DC objects
domain_ou_role: "DomainControllers"

# DC-specific Chocolatey packages (added to choco_packages_common + server extra)
choco_packages_dc:
  - windows-admin-center
  - adexplorer

# Hibernation — always off on DCs
exa_hibernation_enabled: false

# Advertising suppression — not applicable on DCs
exa_deadvertise_enabled: false

# DC RSAT feature set (installed via win_feature in 10-dc-install-features.yml,
# listed here for reference / documentation)
dc_required_features:
  - AD-Domain-Services
  - DNS
  - GPMC
  - RSAT-AD-Tools
  - RSAT-AD-PowerShell
  - RSAT-DNS-Server

# AD-DS paths — Windows defaults, override per host_vars if non-standard
dc_db_path:   'C:\Windows\NTDS'
dc_log_path:  'C:\Windows\NTDS'
dc_sysvol:    'C:\Windows\SYSVOL'

# AD domain identity, hub sites, and DNS forwarders — all derived from
# benarbejde/ad_forest.json (single source of truth), not hardcoded. See
# ansible/tasks/ad_forest_facts.yml. Used as defaults in 00-dc-preflight.yml
# vars_prompt; operator can still override at run time.
ad_domain_name:    "{{ (lookup('file', ad_forest_json_path) | from_json).domain_fqdn }}"
ad_netbios_name:   "{{ (lookup('file', ad_forest_json_path) | from_json).netbios_name }}"
dc_hub_sites:      "{{ (lookup('file', ad_forest_json_path) | from_json).hub_sites }}"
dc_cld_site:       "{{ (lookup('file', ad_forest_json_path) | from_json).cld_site }}"
dc_dns_forwarders: "{{ (lookup('file', ad_forest_json_path) | from_json).dns_forwarders }}"
dc_forest_mode:    "{{ (lookup('file', ad_forest_json_path) | from_json).forest_mode }}"
dc_domain_mode:    "{{ (lookup('file', ad_forest_json_path) | from_json).domain_mode }}"

# dc_hub_sources and dc_cld_source are NOT defined here.
# 00-dc-preflight.yml builds them at runtime from sites.csv so the IPs stay in
# one place (the DC column of sites.csv) rather than being duplicated here.
