---
# =============================================================================
# group_vars/rudder_servers/main.yml
# Example Music Limited — Rudder server group variables
#
# These apply to every host in [rudder_servers].
# Per-host overrides go in host_vars/<hostname>/main.yml.
# Secrets go in group_vars/rudder_servers/vault.yml (ansible-vault encrypted).
# =============================================================================
# Version history
# =============================================================================
# v1.0.0  2026-06-23  Initial release.
# v1.1.0  2026-07-11  rudder_dc_hostname default changed FAL -> CLD (CLD is now the Rudder
#                     "top of the tree" site, see rudder_onboard.yml v1.1.0 -- there's also
#                     no Rudder-adjacent host actually built at FAL yet, so CLD is the more
#                     defensible fallback if a future relay host forgets its own override).
#                     Added rudder_dc_ip -- was missing entirely; rudder_server.yml had been
#                     using rudder_dns (the DNS server's IP, not the DC's) for both the AD
#                     DC's /etc/hosts entry and its LDAP connection URL, a real bug (see that
#                     file's own changelog). Every rudder_servers host still needs its own
#                     host_vars override for both -- this default is a fallback, not a
#                     universally-correct value; see host_vars/EXARUDCLD001/main.yml.
# =============================================================================

# -----------------------------------------------------------------------------
# Domain -- derived from benarbejde/ad_forest.json (single source of truth),
# not hardcoded. See ansible/tasks/ad_forest_facts.yml.
# -----------------------------------------------------------------------------
rudder_domain:       "{{ (lookup('file', ad_forest_json_path | default('/etc/example-music/ad_forest.json')) | from_json).domain_fqdn }}"
rudder_dc_hostname:  "EXADCSCLD001"
rudder_dc_ip:        "192.168.69.10"

# -----------------------------------------------------------------------------
# Rudder version and package config
# -----------------------------------------------------------------------------
rudder_version:      "8.x"
rudder_admin_user:   "admin"

# -----------------------------------------------------------------------------
# Base packages (mirrors rudderme.sh section 3)
# -----------------------------------------------------------------------------
rudder_base_packages:
  - vim
  - git
  - curl
  - wget
  - htop
  - tree
  - jq
  - python3
  - arping
  - network-manager
  - molly-guard
  - fail2ban
  - ufw
  - apache2-utils
  - ca-certificates
  - gnupg
  - lsb-release
  - apt-transport-https

# -----------------------------------------------------------------------------
# LDAP / AD configuration
# Secrets (bind password) are in vault.yml.
# Base DN derived from rudder_domain (above) instead of hardcoded -- previously
# these 3 DNs hardcoded "DC=jukebox,DC=internal" directly even though this same
# file already had rudder_domain as its own "single source of truth" var; the
# DNs just never actually derived from it. Same DC=-join pattern
# windows_adschema/playbooks/10-ad-schema.yml already uses correctly for its
# own base DN.
# -----------------------------------------------------------------------------
rudder_ldap_bind_dn:     "CN=Rudder LDAP Bind,OU=Service Accounts,{{ 'DC=' + rudder_domain.split('.') | join(',DC=') }}"
rudder_ldap_base:        "{{ 'DC=' + rudder_domain.split('.') | join(',DC=') }}"
rudder_ldap_admin_group: "CN=GRP_Rudder_Admins,OU=IT Groups,{{ 'DC=' + rudder_domain.split('.') | join(',DC=') }}"

# -----------------------------------------------------------------------------
# sites.csv path on the Ansible control node
# Mirrors the path resolution logic in ansibleme.sh / rudderme.sh:
#   1. $SITES_CSV environment variable (pass as --extra-vars if needed)
#   2. /etc/example-music/sites.csv  ← system-wide install path (default)
# Override with: --extra-vars "sites_csv_path=/other/path/sites.csv"
# -----------------------------------------------------------------------------
sites_csv_path: "/etc/example-music/sites.csv"

# -----------------------------------------------------------------------------
# UFW: allow Rudder agent ports from all site subnets.
# This list is the belt-and-braces network-layer complement to Rudder's own
# allowed-networks setting (which is the application-layer enforcement).
# Built dynamically from sites.csv in the playbook pre_tasks; this list
# covers the static well-known Rudder ports on both port 443 and 5309.
# Add extra entries here if you have non-standard subnets.
# -----------------------------------------------------------------------------
# -----------------------------------------------------------------------------
# Windows baseline technique — Defender exclusions
# Comma-separated binary names exempted from Defender scanning.
# Add new entries here and re-run the playbook to push the updated directive.
# -----------------------------------------------------------------------------
rudder_windows_excluded_binaries: "netscan.exe,nmap.exe,ncat.exe,psexec.exe,npcap-oem.exe"

# -----------------------------------------------------------------------------
rudder_site_ufw_rules:
  - subnet: "10.0.0.0/8"
    port: "443"
    comment: "agents HTTPS all VPN"
  - subnet: "10.0.0.0/8"
    port: "5309"
    comment: "CFEngine all VPN"
  - subnet: "192.168.0.0/16"
    port: "443"
    comment: "agents HTTPS all LANs"
  - subnet: "192.168.0.0/16"
    port: "5309"
    comment: "CFEngine all LANs"
