---
# =============================================================================
# group_vars/windows_desktop/vars.yml
# Example Music Limited — Variables for Windows desktop hosts (WKS)
# =============================================================================
# Changelog:
#   2026-06-20  Initial file
#   2026-07-06  Removed choco_packages_extra — it was dead code (shadowed
#               by 05-bootstrap.yml's/40-choco-packages.yml's own play
#               vars: — see either file's design note) and had drifted
#               from them besides (windirstat is common to all hosts now,
#               not laptop/desktop-only; firefox/windows-terminal are
#               still in both files' choco_packages_desktop).
#   2026-07-12  Removed the WinDirStat binaries_extra entry below — dead
#               duplicate of the 2026-07-06 change above: windirstat has
#               been in choco_packages_common (all hosts, including
#               servers) since that date, so this binary_extra copy never
#               did anything except double-install the same tool. Also
#               fixed ScreenRes filenames to match the real upstream
#               release asset names (`screenres-amd64.exe`/
#               `screenres-arm64.exe`, not `ScreenRes-x64.exe`/
#               `ScreenRes-arm64.exe`) — see windows_server/vars.yml's
#               same-day changelog entry for the source.
# =============================================================================

# Hibernation — off on desktops
exa_hibernation_enabled: false

# Advertising suppression — on for desktops
exa_deadvertise_enabled: true

# Desktop-specific arch-aware binaries (added to binaries_common)
# busybox removed 2026-07-06 — it's a Chocolatey package now (choco_packages_common).
binaries_extra:
  - { src_amd64: "jq-windows-amd64.exe",  src_arm64: "jq-windows-arm64.exe",   dest: "jq.exe" }
  - { src_amd64: "screenres-amd64.exe",   src_arm64: "screenres-arm64.exe",     dest: "ScreenRes.exe" }

domain_ou_role: "Workstations"
