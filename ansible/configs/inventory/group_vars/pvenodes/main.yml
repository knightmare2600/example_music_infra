---
# group_vars/pvenodes/main.yml
# Proxmox-specific variables

pve_packages:
  - libguestfs-tools
  - jq
  - python3-proxmoxer
  - python3-requests
  - python3-virtualenv
  - sudo
  - unattended-upgrades
  # VM disk-repair tooling — our estate is ZFS-only today, but these are for
  # fixing up a guest's LVM/NTFS disk from the PVE host if one ever shows up
  # (e.g. an imported/migrated Windows VM using LVM instead of GPT+ZFS).
  - kpartx     # map partition tables inside a VM disk image/LV
  - ntfs-3g    # provides ntfsfix, for repairing a dirty/unclean NTFS volume
  # Moved from first-boot.sh's old Step 3 on 2026-07-10 -- first-boot.sh now
  # only does enough for the ansible user to be SSH-reachable; everything
  # else (including this package list) is Ansible's job.
  - net-tools
  - bash-completion
  - tree
  - bc
  - molly-guard    # protects against accidental reboots/shutdowns
  - arping
  - nmap
  - parted
  - gdisk
  - smartmontools
  - vim
  - zsh
  - grc
  - python3-textual
  - python3-pbr
  - python3-six
  - w3m
  - xxd

# Cloud image template IDs (update after first run)
template_ubuntu_noble:    1000
template_debian_trixie:   1001

# Default storage pool for new VMs
pve_default_storage: local-lvm
