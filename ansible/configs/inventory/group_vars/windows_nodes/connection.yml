---
# group_vars/windows_nodes/connection.yml
# ============================================================================
# SSH connection settings for all Windows nodes.
# OpenSSH is installed by autounattend.xml at build time, so Ansible connects
# via SSH from the very first run — no WinRM required.
#
# FIRST RUN: ansible_password is prompted interactively (masked) by the
#            playbook's vars_prompt. After the Ansible SSH key is deployed
#            by the playbook, the password is never needed again.
#
# SUBSEQUENT RUNS: ansible_password can be left unset — Ansible will use the
#            key at ansible_ssh_private_key_file automatically.
#
# 2026-07-15  Corrected the ansible_shell_type comment below: it previously
#             said "OpenSSH default shell is set to pwsh by unattend" -- not
#             true of the current live path. Checked directly: the real
#             headlessunattend.xml sets no DefaultShell at all, and a live,
#             untouched host confirmed the same (empty registry value, sshd's
#             genuine out-of-the-box default of cmd.exe). ansible_shell_type:
#             powershell here means Windows PowerShell 5.1 semantics, which is
#             what ansible.windows's SSH connection plugin is built against --
#             it has nothing to do with what OpenSSH's own DefaultShell is set
#             to. See windows_bootstrap/playbooks/75-openssh.yml's own
#             changelog for why DefaultShell must never be pwsh.exe here.
# ============================================================================

ansible_connection: ssh
ansible_shell_type: powershell     # Windows PowerShell 5.1 semantics -- what ansible.windows's SSH plugin expects
ansible_user: Administrator
ansible_port: 22

# Private key used for all runs after the first bootstrap.
# The corresponding public key is deployed to administrators_authorized_keys.
ansible_ssh_private_key_file: "{{ lookup('env', 'HOME') }}/ansible/configs/ansible-id_rsa"
ansible_ssh_public_key_file:  "{{ lookup('env', 'HOME') }}/ansible/configs/ansible-id_rsa.pub"

# Accept the host key on first connection without prompting.
ansible_ssh_extra_args: '-o StrictHostKeyChecking=no'

# WinRM fallback — uncomment and override per-host or per-group if needed
# ansible_connection:                winrm
# ansible_winrm_transport:           basic
# ansible_winrm_server_cert_validation: ignore
# ansible_port:                      5986
