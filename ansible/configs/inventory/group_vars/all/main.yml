---
# group_vars/all/main.yml
# Generated by ansibleme.sh on 2026-06-26T20:53:54Z

ansible_user:        ansible
# Common packages deployed to every Linux host
# 2026-07-20: bind9-host/htop/telnet/molly-guard added -- found missing while
# comparing against a dropped-in Salt lintools.sls state (see salt/cleanup/).
# molly-guard widened here from being rudder_servers/salt_servers-only (their
# own base_packages lists still have their own explicit entry, untouched --
# those playbooks don't consume common_packages at all, so this doesn't
# create a duplicate for them, just extends the same protection everywhere
# else too).
# 2026-07-21: aptitude/unattended-upgrades added -- Robert's explicit call
# while auditing the same dropped-in lintools.sls, which had unattended-
# upgrades config Salt-side. Config itself (which settings to enable) lives
# in linux/tools.yml's "Configure unattended-upgrades" task, not here.
# 2026-07-26: dnsutils -> bind9-dnsutils. Found live: dnsutils is a
# transitional/virtual package on this estate's Debian 13 (Trixie) base --
# the real package providing dig/nslookup/nsupdate is bind9-dnsutils now.
# bind9-host (added 2026-07-20, above) is the separate split-out package
# for the host command specifically -- unaffected, still correct as-is.
common_packages:
  - aptitude
  - bind9-dnsutils
  - bind9-host
  - curl
  - git
  - git-lfs
  - grc
  - htop
  - jq
  - mc
  # miller (binary: mlr) -- jq's CSV-native equivalent, added 2026-08-29
  # (Robert). jq works on JSON; sites.csv/devices.csv/address_policy.csv
  # are CSV, so mlr is the actual right tool for one-off inspection of
  # those on a live box without writing a Python one-liner:
  #   cat sites.csv | mlr --csv cat
  # (--csv on both input and output; drop it and add --icsv --ojson etc.
  # to convert formats). See "man mlr" or https://miller.readthedocs.io
  # for the full DSL -- filter/put/sort/stats1 etc. all work the same way
  # jq's own filters do, just CSV/TSV-shaped instead of JSON-shaped.
  - miller
  # plocate (binary: locate/updatedb) -- added 2026-09-02 (Robert, found live while auditing
  # zabbixme.sh's own package list). mlocate was the first name tried but doesn't exist on
  # trixie ("Package not available in this suite", confirmed against packages.debian.org) --
  # plocate is the real, current package providing the same locate/updatedb commands. Same
  # addition made across every break-glass script.
  - plocate
  - molly-guard
  - net-tools
  - nmap
  - telnet
  - tmux
  - tree
  - unattended-upgrades
  - vim
  - wget
  - yamllint
  - zsh
  - zsh-autosuggestions
  - zsh-common
  - zsh-syntax-highlighting
