---
# =============================================================================
# group_vars/all/vault.yml
# Example Music Limited — Encrypted secrets (ansible-vault)
# =============================================================================
# Encrypt this file:
#   ansible-vault encrypt group_vars/all/vault.yml
# Edit:
#   ansible-vault edit group_vars/all/vault.yml
# =============================================================================
# Changelog:
#   2026-06-20  Initial file
#   2026-08-04  Added vault_snmp_write_community -- SNMP v2c write community string used
#               ONLY by playbooks/snmp/sysinfo.yml to SET sysLocation/sysContact on the
#               ~36 devices.csv rows with ConnectionType=snmp (switches, network printers).
#               Deliberately a separate string from any read-only monitoring community
#               (e.g. Zabbix's, once that exists) -- keep them different so a leaked
#               monitoring credential can never write anything. Where the device supports
#               it (most managed switches), also scope this community to an SNMP view
#               restricted to the sysLocation/sysContact/sysName OID subtree at the device
#               config level, not just in this playbook's own allow-list.
#   2026-10-16  Added vault_zabbix_api_token -- a dedicated Zabbix 7.0 API token (Users ->
#               API tokens on EXAZABCLD001, NOT the Admin account's own password), used by
#               ansible/tasks/zabbix_agent_onboard.yml's host.create/hostgroup.get calls.
#               Chosen over a masked per-run prompt specifically because this task file is
#               included from linux/tools.yml (routinely re-run, hosts: all by default) as
#               well as the one-shot zabbix_agent.yml -- prompting for Admin credentials on
#               every single estate-wide tools.yml run would be a real UX regression.
#               Presented as an Authorization: Bearer header, not the deprecated JSON-RPC
#               "auth" field (confirmed against the real 7.0 API docs before writing any
#               code -- api/general/description.html's own token-auth example).
# =============================================================================

