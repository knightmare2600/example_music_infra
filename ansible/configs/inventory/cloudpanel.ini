# =============================================================================
# configs/inventory/cloudpanel.ini
# Example Music Limited — CloudPanel server inventory
# =============================================================================
# Hand-maintained, same convention as rudder.ini/salt.ini/tacticalrmm.ini --
# generate_inventory.py only ever touches files named after real 3-letter site
# codes (cld.ini, fal.ini, ...); it has no concept of "cloudpanel" as a
# devices.csv Type, so this group has to be curated by hand and will never be
# overwritten by a regeneration run.
#
# First member, 2026-10-10: EXANIXCLD001, the first live test of
# playbooks/cloudpanel/site.yml. Real devices.csv row exists
# (CLD,NIX,1,40) -- this file only adds the cloudpanel_servers group
# membership group_vars/cloudpanel_servers/main.yml needs; the host/IP/
# connection details themselves still come from cld.ini via the same
# hostname, so there is deliberately no ansible_host= override here to
# avoid two sources of truth for the same host's address.
# =============================================================================

[cloudpanel_servers]
EXANIXCLD001
