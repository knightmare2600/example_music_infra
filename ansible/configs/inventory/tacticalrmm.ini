# =============================================================================
# configs/inventory/tacticalrmm.ini
# Example Music Limited — TacticalRMM server inventory
# =============================================================================
# Remote management platform, phase 3 (see project notes). Single instance,
# CLD LAN only -- same "one central management box" pattern as rudder.ini/
# salt.ini/meshcentral.ini.
#
# The actual TacticalRMM install (install.sh) is NOT run by this inventory's
# playbook -- it's a documented manual step, see playbooks/tacticalrmm/README.md.
# This inventory group is for VM prep only (hostname/IP/packages/firewall).

# --- TacticalRMM server -------------------------------------------------------
[tacticalrmm_servers]
EXARMMCLD001  ansible_host=192.168.69.14  ansible_connection=ssh  # TacticalRMM server (CLD LAN)

[tacticalrmm:children]
tacticalrmm_servers
