# =============================================================================
# configs/inventory/salt.ini
# Example Music Limited — Salt master inventory
# =============================================================================
# Salt manages every Windows node (WKS/LAP/SUR/SVR/DCS) — see benarbejde/role_codes.csv's
# SLT row and docs/buildsheets/buildsheet-salt-minion.md. TAB only when devices.csv's OS
# column says Windows; MAC/MBP are future plans. FWL/PVE stay Ansible-only, no Salt minion.
# Minions are installed by ansible/playbooks/windows_bootstrap/playbooks/82-salt-minion.yml,
# targeting windows_nodes -- not by anything here.

# --- Salt master --------------------------------------------------------------
# Single master. No Syndic tier at current scale (2026-07-20) — see
# ansible/playbooks/salt/README.md for why.
[salt_servers]
EXASLTCLD001  ansible_host=192.168.69.22  ansible_connection=ssh  # Salt master (CLD LAN)

# --- Salt minions --------------------------------------------------------------
# Minions ARE part of the Ansible-managed estate -- windows_desktop/windows_laptop/
# windows_server already carry them, and 82-salt-minion.yml targets those groups
# directly. This group exists for completeness/documentation only; nothing targets
# [salt_minions] itself.
[salt_minions]

[salt:children]
salt_servers
salt_minions
