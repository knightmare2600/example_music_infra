---
# =============================================================================
# host_vars/EXARUDCLD001/main.yml
# Example Music Limited — host-specific variables for the CLD Rudder server
#
# These override group_vars/rudder_servers/main.yml for this host only.
# If rudder_static_ip or rudder_hostname are absent or empty here, the
# playbook will prompt the operator interactively before making any changes.
# =============================================================================
# Version history
# =============================================================================
# v1.0.0  2026-06-23  Initial release.
# v1.1.0  2026-07-11  Added rudder_dc_ip (192.168.69.10, EXADCSCLD001's real IP) -- was
#                     missing; rudder_server.yml had been wrongly using rudder_dns (the
#                     DNS server's IP) for the DC's /etc/hosts entry, a real bug now fixed.
#                     rudder_dc_hostname now matches the group_vars default (both changed
#                     to CLD, see that file's changelog) -- kept explicit here anyway,
#                     matching every other var on this host, rather than relying on it
#                     falling through silently.
# =============================================================================

# -----------------------------------------------------------------------------
# Identity
# -----------------------------------------------------------------------------
rudder_hostname:    "EXARUDCLD001"
rudder_static_ip:   "192.168.69.12"
rudder_gateway:     "192.168.69.253"
rudder_dns:         "192.168.139.8"
rudder_prefix:      "24"

# Network interface to configure (leave blank to auto-detect).
# Override if the host has multiple interfaces and auto-detection picks
# the wrong one.
rudder_network_interface: ""

# -----------------------------------------------------------------------------
# Site metadata — shown in MOTD and /etc/example-music/nodeinfo.json
# -----------------------------------------------------------------------------
rudder_site_code:    "CLD"
rudder_site_city:    "Edinburgh"
rudder_site_country: "Scotland"
rudder_site_entity:  "Example Music Limited"
rudder_dc_hostname:  "EXADCSCLD001"
rudder_dc_ip:        "192.168.69.10"
