---
# =============================================================================
# host_vars/EXARMMCLD001/main.yml
# Example Music Limited — host-specific variables for the CLD TacticalRMM server
#
# These override group_vars/tacticalrmm_servers/main.yml for this host only.
# If rmm_static_ip or rmm_hostname are absent or empty here, the playbook
# will prompt the operator interactively before making any changes -- same
# pattern as EXARUDCLD001/main.yml and EXAMSHCLD001/main.yml.
# =============================================================================
# Version history
# =============================================================================
# v1.0.0  2026-08-04  Initial release. Remote management platform, phase 3.
# v1.1.0  2026-08-13  Removed the hand-typed rmm_site_code/city/country/entity/street/
#                     postal_code block -- now derived live from sites.csv by
#                     tacticalrmm_server.yml itself (same pattern proxmox/truenas/
#                     firewallme/linux already use), not hand-duplicated here. Real bug
#                     this catches: rmm_site_country was hardcoded "Scotland" -- wrong,
#                     sites.csv's real Country value for CLD is "Global" (a virtual/cloud
#                     site, not a physical UK location) -- present even though this
#                     block's own comment claimed it had been checked against sites.csv at
#                     the time. Exactly the drift risk hand-duplication creates, even when
#                     someone tries to keep it honest. Robert's explicit call: "everything
#                     is supposed to use sites.csv... hard-coding is verboten here."
# =============================================================================

# -----------------------------------------------------------------------------
# Identity
# -----------------------------------------------------------------------------
rmm_hostname:   "EXARMMCLD001"
rmm_static_ip:  "192.168.69.14"
rmm_gateway:    "192.168.69.253"
rmm_dns:        "192.168.139.8"
rmm_prefix:     "24"

# Network interface to configure (leave blank to auto-detect).
rmm_network_interface: ""
