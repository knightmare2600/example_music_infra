---
# =============================================================================
# host_vars/EXAMSHCLD001/main.yml
# Example Music Limited — host-specific variables for the CLD MeshCentral server
#
# These override group_vars/meshcentral_servers/main.yml for this host only.
# If mesh_static_ip or mesh_hostname are absent or empty here, the playbook
# will prompt the operator interactively before making any changes -- same
# pattern as EXARUDCLD001/main.yml.
# =============================================================================
# Version history
# =============================================================================
# v1.0.0  2026-08-04  Initial release. Remote management platform, phase 1/2.
# v1.1.0  2026-08-08  RETIRED. EXAMSHCLD001 removed from cld.ini/meshcentral.ini
#                     -- Ansible never loads this file for a real run anymore
#                     (host_vars only load for hosts present in inventory).
#                     Kept as historical/reference material alongside
#                     playbooks/meshcentral/, not deleted. See
#                     playbooks/tacticalrmm/README.md's "EXAMSHCLD001 —
#                     RETIRED" section for the full decision.
# =============================================================================

# -----------------------------------------------------------------------------
# Identity
# -----------------------------------------------------------------------------
mesh_hostname:   "EXAMSHCLD001"
mesh_static_ip:  "192.168.69.13"
mesh_gateway:    "192.168.69.253"
mesh_dns:        "192.168.139.8"
mesh_prefix:     "24"

# Network interface to configure (leave blank to auto-detect).
mesh_network_interface: ""

# -----------------------------------------------------------------------------
# Site metadata — shown in MOTD and /etc/example-music/nodeinfo.json
# Matches CLD's real address (see benarbejde/sites.csv, commit 01f6d54).
# -----------------------------------------------------------------------------
mesh_site_code:    "CLD"
mesh_site_city:    "Edinburgh"
mesh_site_country: "Scotland"
mesh_site_entity:  "Example Music Limited"
mesh_site_street:       "7 Claylands Road"
mesh_site_postal_code:  "EH28 8LF"
