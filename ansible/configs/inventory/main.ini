# configs/inventory/main.ini — cross-site meta-groups, NOT per-site host data
#
# Trimmed 2026-09-18 (Robert, live on EXAANSFRD001): this file used to also carry
# [pvenodes]/[dcs]/[firewalls] sections full of bare-IP entries, generated once by
# ansibleme.sh on 2026-06-26 and never regenerated since. Those duplicated -- with a
# DIFFERENT identity scheme (bare IP as hostname) -- what every real per-site .ini file
# in this same directory already provides correctly (real EXA<ROLE><SITE>NNN hostnames,
# ansible_host= as a separate attribute, generated by benarbejde/generate_inventory.py
# from sites.csv). Combining the two meant the same physical hosts existed twice under
# the [pvenodes]/[dcs]/[firewalls] group names with two different identities. Removed.
#
# What's left here is genuinely NOT duplicated anywhere else in this directory (checked
# via grep before trimming, not assumed) -- the group NAMES [pvenodes]/[dcs]/[firewalls]
# still exist and still get real content, just from the per-site files instead; this file
# only supplies the cross-cutting hierarchy tying them together.
#
# [pvenodes]/[dcs]/[firewalls] below are declared EMPTY, deliberately, not deleted outright
# a second time: ansible-core's ini plugin validates :children references PER FILE, not
# deferred across the whole directory -- confirmed live, removing these three headers
# entirely made [managed:children] fail to parse ("includes undefined group 'dcs'"), even
# though the real, populated groups exist fine in the per-site files. Empty headers here
# satisfy that validation; ansible unions same-named groups across inventory sources
# normally (same mechanism [rudder_servers]/[rudder_relays] below already relied on before
# this fix), so the real per-site membership merges in correctly, nothing here overrides it.
#   [ansiblehosts]      -- every Ansible control node in the estate, one line each.
#                          ansibleme.sh appends this control node's own line here on
#                          every run (idempotent -- skips if already present). This is
#                          the ONLY place in the whole inventory this group is defined.
#   [managed:children]   -- pvenodes+dcs+firewalls, so anything wanting "every managed
#                          host regardless of role" has one group to target.
#   [linux:children]     -- managed+rudder_servers+rudder_relays+ansiblehosts. THIS is
#                          load-bearing: group_vars/linux/main.yml's ansible_become=true
#                          only applies to hosts that are actually IN the [linux] group,
#                          and this file is the ONLY place that hierarchy is built. No
#                          other file in this directory defines linux:children,
#                          managed:children, or ansiblehosts at all (confirmed via grep
#                          before trimming this file, not assumed) -- deleting this file
#                          outright would have silently broken privilege escalation for
#                          every managed Linux host in the estate.

[ansiblehosts]
192.168.69.9    # EXAANSCLD001

[pvenodes]

[dcs]

[firewalls]

[managed:children]
pvenodes
dcs
firewalls

[rudder_servers]

[rudder_relays]

[linux:children]
managed
rudder_servers
rudder_relays
ansiblehosts
