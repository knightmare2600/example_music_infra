# Scratch inventory for at_have_ryggen_fri's add_host visibility probe.
# One throwaway host, local connection only -- no real network is touched
# and no real hosts anywhere in this repo are referenced.

[ryggen_fri_seed]
ryggen_fri_seed_host ansible_connection=local

# Must exist here, even empty, for the probe to mean anything: it mirrors
# windows_bootstrap/00-preflight.yml's Phase H2 pattern, where add_host
# registers a fresh host into a permanent group (windows_dc etc.) that
# already exists in the loaded inventory's group hierarchy. group_vars
# only auto-loads for a group that's part of the *loaded* inventory path
# (see ansible/README.md) -- an add_host group with no [group] section
# here at all would prove nothing.
[ryggen_fri_marker_group]
