---
# facts.yml -- part of at_have_ryggen_fri.
#
# A hand-curated list of specific facts (an IP, a hostname) that are
# restated as prose across multiple docs/scripts, rather than read from a
# single structured source at runtime. These can't be checked generically
# the way check_generated_freshness.py checks generate_inventory.py's
# outputs, or check_references.py checks a template: path -- there's no
# single function to re-run and diff. Instead: name the fact, name where
# it's correctly asserted, and check_facts.py confirms each file still
# says what it's supposed to.
#
# This deliberately does NOT try to be exhaustive -- it grows as drift is
# found and fixed, starting with the facts that were actually found wrong
# during the 2026-07-10 bootstrap-scenario research (see conversation).
# A missing entry here doesn't mean a file has no facts worth checking; it
# means nobody has registered one yet.
#
# Each fact:
#   name         short identifier
#   description  what the fact is, in plain English
#   value        the correct, current value
#   source       where the value is authoritative (a real source-of-truth
#                file, not another prose restatement)
#   asserted_in  files that should contain `value` verbatim. A file listed
#                here that does NOT contain it is reported as drifted --
#                this includes the two docs already known to be stale
#                (buildsheet-firewall.md, bootstrap/bootstrapping.md) and
#                the wrong-hostname doc (EXADNSVRK001-dns.md) -- reporting
#                them is the point, not a bug in this list.

facts:
  - name: fwl_wan_ip
    description: "EXAFWLVRK001's WAN/vRACK-facing static IP (same physical box as EXAFWLCLD001)"
    value: "192.168.139.69"
    source: "benarbejde/devices.csv (VRK,FWL,1,69)"
    asserted_in:
      - ansible/README.md
      - bootstrap/web/provision/firewallme.sh
      - ansible/playbooks/firewallme/roles/firewall/tasks/00_preflight.yml
      - docs/ExampleMusic_Beginners_Guide.md
      - docs/ExampleMusic_Procedure_Template.md
      - docs/buildsheets/buildsheet-firewall.md
      - docs/bootstrap/bootstrapping.md

  - name: dns_hostname
    description: "The estate's BIND9 DNS server hostname -- site VRK, not CLD"
    value: "EXADNSVRK001"
    source: "benarbejde/begyndelse.json (dns.hostname), benarbejde/sites.csv (VRK row)"
    asserted_in:
      - ansible/playbooks/bind9/bind9-dns.yml
      - docs/inventory/EXADNSVRK001-dns.md
      - docs/bootstrap/bootstrapping.md

  - name: ansible_control_node
    description: "The estate's Ansible control node hostname and IP"
    value: "EXAANSCLD001"
    source: "benarbejde/begyndelse.json (ansible_control.hostname), benarbejde/sites.csv (CLD row)"
    asserted_in:
      - bootstrap/web/provision/ansibleme.sh
      - docs/inventory/EXADNSVRK001-dns.md
      - docs/buildsheets/buildsheet-firewall.md

  - name: create_vm_script_path
    description: "Where create-vm.py actually lives"
    value: "bootstrap/web/proxmox/create-vm.py"
    source: "the file itself"
    asserted_in:
      - docs/proxmox/pve-create-vm.md

  - name: pve_answer_toml_filename
    description: "The real filename is answer.toml, singular -- not answers.toml, found wrong throughout buildsheet-pve.md on 2026-07-10"
    value: "answer.toml"
    source: "bootstrap/web/proxmox/answer.toml (the file itself)"
    asserted_in:
      - docs/buildsheets/buildsheet-pve.md
      - docs/bootstrap/bootstrapping.md

  - name: frd_boot_server
    description: >-
      Fredericia Havn's provisioning-server address -- every doc that gives an operator
      192.168.139.50 (Edinburgh) as a literal fetch/scp/curl target must also note this
      alternate, per Robert's 2026-07-11 request ("it also could be on the 172 IP in FRD").
      Files that only list the device in an inventory/architecture table (network-inventory.md,
      site-inventory.md, network-diagram.md, EXADNSVRK001-dns.md, network-inventory-merged.md,
      buildsheet-rudder.md) are deliberately excluded -- FRD is a different physical device, not
      a second IP for EXAPRVVRK001, so it doesn't belong in a table describing that specific
      device. ExampleMusic_UPN_DNS_dnsmasq_Procedure.md is also excluded -- provisioning.* DNS
      A/PTR records are deliberately Edinburgh-only, FRD is never DNS-registered.
      ExampleMusic_Beginners_Guide.md already has its own full §4.2 explanation, not just a
      cross-reference, so isn't in this list either.
    value: "172.16.124.1:8000"
    source: "bootstrap/web/proxmox/first-boot.sh (BOOT_SERVER gateway detection) / docs/bootstrap/bootstrapping.md §4.1a"
    asserted_in:
      - docs/buildsheets/buildsheet-pve.md
      - docs/buildsheets/buildsheet-firewall.md
      - docs/management/rudder-setup.md
      - docs/proxmox/pve-networking.md
      - docs/arch-pxe-setup.md
      - docs/bootstrap/ipxe-build.md
      - docs/bootstrap/ExampleMusic_ExaRescue_ARM64_Build_Procedure.md
      - docs/bootstrap/ExampleMusic_Procedure_iPXE_ARM64_ISO.md
      - docs/proxmox/virtio-driver-disk.md
      - docs/proxmox/zfs-raid0-to-raid1.md
      - docs/lab/rac-emulator.md
      - docs/active-directory/corporate-livery.md

  - name: provisioning_server_hostname
    description: >-
      The real provisioning server hostname is EXAPRVVRK001 (Site=VRK, Role=PRV in
      devices.csv) -- found wrong as EXAPROVCLD001 (wrong role code AND wrong site) in 2 docs,
      and as EXAPRVSCOTCLD001 (fictional, doesn't match any devices.csv naming pattern) in a
      third, all on 2026-07-11.
    value: "EXAPRVVRK001"
    source: "benarbejde/devices.csv (VRK,PRV,1,50)"
    asserted_in:
      - docs/bootstrap/ExampleMusic_ExaRescue_ARM64_Build_Procedure.md
      - docs/active-directory/ExampleMusic_UPN_DNS_dnsmasq_Procedure.md
      - docs/bootstrap/ExampleMusic_Procedure_iPXE_ARM64_ISO.md

  - name: site_code_aberdeen
    description: >-
      Aberdeen's real site code is ABD, not ABR -- found wrong (with matching
      EXADCSABR001 hostname) in ad-dc-wireguard-deployment.md and
      v2v-scenario-walkthroughs.md's "known site codes" example transcript, 2026-07-11.
    value: "ABD"
    source: "benarbejde/sites.csv (ABD,Aberdeen,...)"
    asserted_in:
      - docs/active-directory/ad-dc-wireguard-deployment.md
      - docs/proxmox/v2v-scenario-walkthroughs.md

  - name: site_code_atlanta
    description: >-
      Octet 33 (192.168.33.0/24) belongs to ATL (Atlanta) in sites.csv -- found as the
      fictional/removed code GAA ("Georgia AL") in 3 docs, 2026-07-11. GAA appears nowhere
      in sites.csv; ATL is the real, current site at that octet.
    value: "ATL"
    source: "benarbejde/sites.csv (ATL,Atlanta,...,192.168.33.0/24)"
    asserted_in:
      - docs/active-directory/ad-dc-wireguard-deployment.md
      - docs/proxmox/v2v-scenario-walkthroughs.md
      - docs/proxmox/pve-networking.md
