---
# =============================================================================
# ansible/tasks/nodeinfo.yml
# Example Music Limited — Write /etc/example-music/nodeinfo.json
# =============================================================================
# Shared by every playbook that writes nodeinfo.json (linux/tools.yml,
# proxmox/30-example-music.yml, firewallme's 13_finish.yml, rudder_server.yml)
# instead of each hand-writing its own near-identical copy/vars block. The
# base fields (hostname, fqdn, role, site, city, country, entity,
# ansible_managed, bootstrapped_at/by, environment) come from data every
# caller already has after hostname_facts.yml + a sites.csv lookup; role-
# specific fields (e.g. proxmox's node_ip/gateway, firewall's WAN/LAN/
# WireGuard details, rudder's static_ip/URLs) are merged in via
# nodeinfo_extra.
#
# Required vars (set by the caller before including this file):
#   nodeinfo_role             e.g. "proxmox", "firewall", "rudder", "linux"
#   nodeinfo_site              site code (host_site from hostname_facts.yml)
#   nodeinfo_bootstrapped_by   which playbook wrote this, e.g. "proxmox/site.yml"
#
# Optional vars:
#   nodeinfo_hostname     default: inventory_hostname
#   nodeinfo_city/country/country_code/entity/office_name   default: '' (site not found in sites.csv)
#   nodeinfo_street_address/postal_code   default: '' (site not found, or sites.csv column blank)
#   nodeinfo_environment  default: 'production'
#   nodeinfo_extra        default: {} — role-specific fields, merged in last
#                         so they can override a base field if a caller ever
#                         genuinely needs to (should be rare)
# =============================================================================
# Changelog:
#   2026-07-07  Initial file — extracted from proxmox/30-example-music.yml,
#               firewallme's 13_finish.yml, and rudder_server.yml, which had
#               each independently hand-written the same 9 base fields under
#               different variable names (pve_city vs fw_site_city vs
#               rudder_site_city, etc). Also wired into linux/tools.yml so
#               every Linux host gets a base nodeinfo.json, not just the
#               three roles that had their own bespoke version.
#   2026-07-26  Tagged the one task here `always`, same fix and same reason
#               as ansible/tasks/nodeinfo_environment.yml's own 2026-07-26
#               changelog entry: bind9-dns.yml includes this file via a task
#               tagged `always`, which doesn't reliably propagate to an
#               untagged child under a dynamic include_tasks with an active
#               --tags filter (ansible-core 2.19.4, confirmed). Silent here
#               rather than fatal (nothing in the same run reads the file
#               back), but still means nodeinfo.json silently doesn't get
#               written on a --tags-filtered run that omits "always".
#   2026-08-04  street/postal_code added -- same sites.csv lookup every caller already
#               does for city/country/entity, just two more columns (Robert's site-address
#               rollout). Windows gets the equivalent via Salt custom grains instead of a
#               second nodeinfo.json (salt/states/grains/init.sls), not duplicated here.
#   2026-08-13  office_name/country_code added, street renamed to street_address -- matches
#               the same fields added to Salt's own custom grains 2026-08-12
#               (salt/states/grains/init.sls). Same day, every caller of this file that was
#               still hand-typing its own city/country/entity into host_vars (salt, rudder,
#               tacticalrmm) converted to a live sites.csv lookup instead, matching the
#               pattern proxmox/truenas/firewallme/linux/bind9-dns already used -- Robert's
#               explicit call: "everything is supposed to use sites.csv... hard-coding stuff
#               is very 1970s and verboten here." meshcentral_server.yml deliberately NOT
#               converted -- EXAMSHCLD001 was retired 2026-08-08, dead code, not worth the
#               effort. bind9-dns.yml also gained street_address/postal_code/office_name/
#               country_code for the first time here -- it never passed the address fields
#               at all before this, a separate pre-existing gap found while doing this sweep.
# =============================================================================

- name: "Write /etc/example-music/nodeinfo.json"
  tags: always
  ansible.builtin.copy:
    dest: /etc/example-music/nodeinfo.json
    mode: '0444'
    content: "{{ _nodeinfo | to_nice_json }}\n"
  vars:
    _nodeinfo: >-
      {{
        {
          'hostname':        nodeinfo_hostname | default(inventory_hostname),
          'fqdn':             ansible_fqdn | default(inventory_hostname),
          'role':             nodeinfo_role,
          'site':             nodeinfo_site,
          'city':             nodeinfo_city | default(''),
          'country':          nodeinfo_country | default(''),
          'country_code':     nodeinfo_country_code | default(''),
          'entity':           nodeinfo_entity | default(''),
          'office_name':      nodeinfo_office_name | default(''),
          'street_address':   nodeinfo_street_address | default(''),
          'postal_code':      nodeinfo_postal_code | default(''),
          'ansible_managed':  true,
          'bootstrapped_at':  ansible_date_time.iso8601,
          'bootstrapped_by':  nodeinfo_bootstrapped_by,
          'environment':      nodeinfo_environment | default('production'),
        } | combine(nodeinfo_extra | default({}))
      }}
