---
# =============================================================================
# tasks/keepass_credential_sync.yml
# Example Music Limited — shared check-defer-write KeePass credential sync
# =============================================================================
# Reverses, for the in-scope credentials this shipped for, the previously-permanent
# "Ansible never writes to KeePass" rule (benarbejde/push_credentials_to_keepass.py's
# own header, docs/Example Music Limited — KeePassXC CLI Automation.md §7a) — Robert's
# explicit, confirmed-via-AskUserQuestion decision, 2026-10-01: KeePass becomes the
# primary source these credentials defer to (skip prompting when it already has a
# value), and Ansible files new values into it itself once obtained, instead of only
# ever printing a "go run kpcli_wrapper.py by hand" banner. NOT a blanket reversal —
# DSRM (windows_dc/playbooks/00-dc-preflight.yml's own Phase F) and
# tacticalrmm_server.yml's 6 ephemeral secrets are explicitly, permanently excluded;
# see each call site for the full in-scope list.
#
# Include from a play's tasks: with vars: (see any call site for a live example):
#   kcs_repo_root             — path to the repo root FROM THE CALLING FILE's own
#                               directory, e.g. "{{ playbook_dir }}/../../../..",
#                               same convention already used for
#                               example_music_gate_repo_root. Deliberately NOT resolved
#                               inside this shared file itself: playbook_dir for an
#                               include_tasks'd file resolves to the CALLING play's own
#                               directory, which differs by call site (windows_dc/
#                               windows_bootstrap are 4 levels deep, snmp/ is 3) —
#                               cannot be hardcoded here, confirmed empirically.
#   kcs_keepass_db            — optional, defaults to Phase F's own
#                               /home/ansible/KeePassXC/ExampleMusic.kdbx
#   kcs_keepass_path          — full KeePass path, e.g.
#                               "Infrastructure/{{ host_site }}/{{ inventory_hostname }}-admin"
#                               or "Infrastructure/_shared/snmp-write-community"
#   kcs_username              — username/label stored alongside the value
#                               (keepassxc-cli add always takes one)
#   kcs_current_value         — whatever the caller's own vars_prompt/vault default
#                               already produced (blank is fine)
#   kcs_can_generate          — bool; true offers opt-in generation when nothing is
#                               found anywhere, false means check-and-defer only
#   kcs_generate_length       — optional, default 24 (Phase F's own DSRM value)
#   kcs_generate_chars        — optional, default ['ascii_letters', 'digits']
#   kcs_credentials_json_role — label checked against extracted_credentials.json's own
#                               role field — always checked per Robert's explicit "keep
#                               all three checks" instruction, even though none of this
#                               file's in-scope credentials fit that schema's real roles
#                               (RAC/ILO/SWI/RTR/FWL/SBC/PHN/RMM). Same reasoning as
#                               Phase F's own DSRM check: forward-compatibility, not
#                               because a match is ever expected today.
#   kcs_hostname              — optional, defaults to inventory_hostname; only matters
#                               for the extracted_credentials.json lookup above
#   kcs_result_var            — name of the variable to set_fact with the final value
#
# Logic (see [[project_keepass_automation_hardening_2026_10_01]] and the plan this
# shipped from for the full design rationale):
#   1. Read-only check: does kcs_keepass_path exist in KeePass?
#   2. Found, kcs_current_value blank            -> defer to KeePass, no write
#   3. Found, kcs_current_value == KeePass value -> already in sync, no write
#   4. Found, kcs_current_value != KeePass value -> use kcs_current_value THIS run, but
#      ALSO write it as a new, suffixed, self-documenting entry
#      (kcs_keepass_path + "-conflict-YYYYMMDD") — NEVER touch/overwrite the original.
#      keepassxc-cli add refuses outright on an exact duplicate path (confirmed live,
#      real throwaway test vault, no --force flag exists) — this is the only reason a
#      suffix scheme is needed at all, not a design preference.
#   5. Not found, kcs_current_value non-blank    -> write it to KeePass now (first filing)
#   6. Not found, kcs_current_value blank:
#        kcs_can_generate: true  -> generate (same lookup('password', '/dev/null', ...)
#                                   pattern already proven safe in tacticalrmm_server.yml/
#                                   Phase F), write it, print a one-time banner
#        kcs_can_generate: false -> leave kcs_result_var blank; caller's own existing
#                                   fallback (pause/skip/warn) runs completely unchanged
#   7. Any unexpected failure reading the live vault (wrong master password, unreachable,
#      anything other than a clean "not found") -> hard stop. Never treated as safe.
# =============================================================================
# Changelog:
#   2026-10-01  Initial version. Extracted from the pattern proven in
#               windows_dc/playbooks/00-dc-preflight.yml's own Phase F (opt-in DSRM
#               generation, commit f6ae7ad) — that logic only ever READ KeePass; this
#               is the first place Ansible is permitted to WRITE to it, Robert's
#               explicit, confirmed reversal of the one-way-flow rule, scoped to the
#               credentials named at each call site only. DSRM itself is NOT ported to
#               use this file — Robert's explicit call to keep its stricter
#               fail-loudly-on-any-existing-value behaviour as a permanent exception.
# =============================================================================

- name: "[KeePass sync: {{ kcs_keepass_path }}] Read the KeePass automation master password"
  set_fact:
    _kcs_master_password: "{{ lookup('file', kcs_repo_root ~ '/benarbejde/.keepassxc_master_password') | trim }}"
  delegate_to: localhost
  become: false
  no_log: true
  vars:
    ansible_connection: local
    ansible_shell_type: sh

- name: "[KeePass sync: {{ kcs_keepass_path }}] Check extracted_credentials.json for an existing entry"
  set_fact:
    _kcs_in_credentials_json: >-
      {{
        (lookup('file', kcs_repo_root ~ '/benarbejde/extracted_credentials.json') | from_json)
        | selectattr('hostname', 'equalto', kcs_hostname | default(inventory_hostname))
        | selectattr('role', 'equalto', kcs_credentials_json_role)
        | list | length > 0
      }}
  delegate_to: localhost
  become: false
  vars:
    ansible_connection: local
    ansible_shell_type: sh

- name: "[KeePass sync: {{ kcs_keepass_path }}] Check the live KeePass vault (read-only)"
  command: >
    keepassxc-cli show -s -a Password {{ kcs_keepass_db | default('/home/ansible/KeePassXC/ExampleMusic.kdbx') }}
    {{ kcs_keepass_path }}
  args:
    stdin: "{{ _kcs_master_password }}\n"
  register: _kcs_check
  changed_when: false
  failed_when: false
  no_log: true
  delegate_to: localhost
  become: false
  vars:
    ansible_connection: local
    ansible_shell_type: sh

- name: "[KeePass sync: {{ kcs_keepass_path }}] Interpret the live KeePass check result"
  set_fact:
    _kcs_found: "{{ _kcs_check.rc == 0 }}"
    _kcs_existing_value: "{{ (_kcs_check.stdout | default('') | trim) if _kcs_check.rc == 0 else '' }}"
    # Same discipline as Phase F -- rc=1 with "Could not find entry" is a genuine,
    # confirmed absence. Any OTHER non-zero outcome (wrong master password, unreachable
    # vault, etc.) must NOT be silently treated as "safe to proceed".
    _kcs_check_failed_unexpectedly: >-
      {{ _kcs_check.rc != 0 and 'Could not find entry' not in (_kcs_check.stderr | default('')) }}
  no_log: true

- name: "[KeePass sync: {{ kcs_keepass_path }}] FAIL — could not reliably check the live KeePass vault"
  fail:
    msg: >
      Could not confirm whether {{ kcs_keepass_path }} already exists in the live KeePass
      vault -- keepassxc-cli failed in an unexpected way (not a simple "entry not found").
      Refusing to defer, write, or generate without being sure what's already there. Check
      benarbejde/.keepassxc_master_password is correct and the vault is reachable
      (at_have_ryggen_fri/check_keepass_freshness.py's Tiers 2b/2d can help diagnose this
      on the control node directly), then re-run.
  when: _kcs_check_failed_unexpectedly

# ── Branch: found, caller's own value blank -> defer ────────────────────────────────
- name: "[KeePass sync: {{ kcs_keepass_path }}] Defer to KeePass's existing value (caller's own value was blank)"
  set_fact:
    _kcs_final_value: "{{ _kcs_existing_value }}"
    _kcs_needs_write: false
  no_log: true
  when:
    - not _kcs_check_failed_unexpectedly
    - _kcs_found
    - (kcs_current_value | default('')) == ''

# ── Branch: found, matches caller's own value -> already in sync ───────────────────
- name: "[KeePass sync: {{ kcs_keepass_path }}] Already in sync with KeePass"
  set_fact:
    _kcs_final_value: "{{ kcs_current_value }}"
    _kcs_needs_write: false
  no_log: true
  when:
    - not _kcs_check_failed_unexpectedly
    - _kcs_found
    - (kcs_current_value | default('')) != ''
    - kcs_current_value == _kcs_existing_value

# ── Branch: found, DIFFERS from caller's own value -> use caller's value, add-not-overwrite ──
- name: "[KeePass sync: {{ kcs_keepass_path }}] KeePass has a DIFFERENT value — will add an additional entry, never overwrite"
  set_fact:
    _kcs_final_value: "{{ kcs_current_value }}"
    _kcs_needs_write: true
    _kcs_write_path: "{{ kcs_keepass_path }}-conflict-{{ '%Y%m%d' | strftime }}"
    _kcs_write_note: >-
      Ansible supplied a DIFFERENT value than {{ kcs_keepass_path }} already held, on
      {{ '%Y-%m-%d' | strftime }}. The original entry was NOT touched or overwritten --
      review both and reconcile manually.
  no_log: true
  when:
    - not _kcs_check_failed_unexpectedly
    - _kcs_found
    - (kcs_current_value | default('')) != ''
    - kcs_current_value != _kcs_existing_value

# ── Branch: not found, caller already has a value -> first filing ──────────────────
- name: "[KeePass sync: {{ kcs_keepass_path }}] Not yet in KeePass — filing it now (first filing)"
  set_fact:
    _kcs_final_value: "{{ kcs_current_value }}"
    _kcs_needs_write: true
    _kcs_write_path: "{{ kcs_keepass_path }}"
    _kcs_write_note: ""
  no_log: true
  when:
    - not _kcs_check_failed_unexpectedly
    - not _kcs_found
    - (kcs_current_value | default('')) != ''

# ── Branch: not found, caller's value blank, generation permitted -> generate ──────
- name: "[KeePass sync: {{ kcs_keepass_path }}] Nothing found anywhere, generation requested — generating"
  set_fact:
    _kcs_final_value: "{{ lookup('password', '/dev/null', length=(kcs_generate_length | default(24)), chars=(kcs_generate_chars | default(['ascii_letters', 'digits']))) }}"
    _kcs_needs_write: true
    _kcs_write_path: "{{ kcs_keepass_path }}"
    _kcs_write_note: ""
    _kcs_was_generated: true
  no_log: true
  when:
    - not _kcs_check_failed_unexpectedly
    - not _kcs_found
    - (kcs_current_value | default('')) == ''
    - kcs_can_generate | default(false) | bool

# ── Branch: not found, caller's value blank, generation NOT permitted -> leave blank ──
- name: "[KeePass sync: {{ kcs_keepass_path }}] Nothing found anywhere, no generation offered — leaving to caller's own fallback"
  set_fact:
    _kcs_final_value: ""
    _kcs_needs_write: false
  no_log: true
  when:
    - not _kcs_check_failed_unexpectedly
    - not _kcs_found
    - (kcs_current_value | default('')) == ''
    - not (kcs_can_generate | default(false) | bool)

# ── Write path (first filing, generated, or conflict-suffixed) ─────────────────────

- name: "[KeePass sync: {{ kcs_keepass_path }}] Work out this write's target group"
  set_fact:
    _kcs_group_parts: "{{ (_kcs_write_path | default('') | regex_replace('/[^/]+$', '')).split('/') }}"
  when: _kcs_needs_write | default(false)

- name: "[KeePass sync: {{ kcs_keepass_path }}] Ensure each level of the target group exists"
  command: >
    keepassxc-cli mkdir -q {{ kcs_keepass_db | default('/home/ansible/KeePassXC/ExampleMusic.kdbx') }}
    "{{ '/'.join(_kcs_group_parts[:item]) }}"
  args:
    stdin: "{{ _kcs_master_password }}\n"
  loop: "{{ range(1, (_kcs_group_parts | default([]) | length) + 1) | list }}"
  changed_when: false
  # mkdir has no "already exists, that's fine" exit code of its own (confirmed live,
  # real throwaway test vault) -- every level after the first real creation legitimately
  # errors on a group that's already there. Not a sign of a real problem; the following
  # add task's own exit code is the one that actually matters.
  failed_when: false
  no_log: true
  delegate_to: localhost
  become: false
  vars:
    ansible_connection: local
    ansible_shell_type: sh
  when: _kcs_needs_write | default(false)

- name: "[KeePass sync: {{ kcs_keepass_path }}] Write the new entry"
  command: >
    keepassxc-cli add -u "{{ kcs_username }}"
    {{ ('--notes "' ~ _kcs_write_note ~ '"') if (_kcs_write_note | default('')) != '' else '' }}
    -p {{ kcs_keepass_db | default('/home/ansible/KeePassXC/ExampleMusic.kdbx') }} "{{ _kcs_write_path }}"
  args:
    stdin: "{{ _kcs_master_password }}\n{{ _kcs_final_value }}\n"
  register: _kcs_write
  changed_when: _kcs_write.rc == 0
  no_log: true
  delegate_to: localhost
  become: false
  vars:
    ansible_connection: local
    ansible_shell_type: sh
  when: _kcs_needs_write | default(false)

- name: "[KeePass sync: {{ kcs_keepass_path }}] FAIL — could not write the new KeePass entry"
  fail:
    msg: >
      Failed to write {{ _kcs_write_path | default(kcs_keepass_path) }} to KeePass --
      keepassxc-cli add returned {{ _kcs_write.rc | default('?') }}. If this is a
      conflict-suffixed entry, another conflict may already have been filed today at
      this exact path -- check KeePassXC directly before re-running.
  when:
    - _kcs_needs_write | default(false)
    - _kcs_write.rc | default(1) != 0

# ── Verify the write: a zero exit code is not proof the value actually landed correctly ──
# 2026-10-03, Robert's explicit ask, re: GOT -- "confirms it got written to KeePass DB AND
# that it matches." The add command's own exit code (checked above) proves the CLI call
# succeeded; it does NOT prove the stored value is byte-correct. This re-reads the entry
# (read-only, same mechanism Tier 2c of check_keepass_freshness.py already proved safe) and
# hard-fails if it doesn't match exactly, rather than trusting the write blindly the way
# Phase F's own DSRM banner still does.

- name: "[KeePass sync: {{ kcs_keepass_path }}] Read back the just-written entry (verify, don't trust the exit code alone)"
  command: >
    keepassxc-cli show -s -a Password {{ kcs_keepass_db | default('/home/ansible/KeePassXC/ExampleMusic.kdbx') }}
    "{{ _kcs_write_path }}"
  args:
    stdin: "{{ _kcs_master_password }}\n"
  register: _kcs_write_verify
  changed_when: false
  failed_when: false
  no_log: true
  delegate_to: localhost
  become: false
  vars:
    ansible_connection: local
    ansible_shell_type: sh
  when: _kcs_needs_write | default(false)

- name: "[KeePass sync: {{ kcs_keepass_path }}] FAIL — could not read back the just-written entry to verify it"
  fail:
    msg: >
      Wrote {{ _kcs_write_path }} to KeePass (the add command itself reported success),
      but reading it back to verify failed outright (rc={{ _kcs_write_verify.rc | default('?') }}).
      Cannot confirm the value actually landed correctly -- check the vault directly
      before trusting this entry.
  when:
    - _kcs_needs_write | default(false)
    - _kcs_write_verify.rc | default(1) != 0

- name: "[KeePass sync: {{ kcs_keepass_path }}] FAIL — written value does not match what was read back"
  fail:
    msg: >
      Wrote {{ _kcs_write_path }} to KeePass and the write command reported success, but
      reading the entry back does NOT match the value this run actually used. Do not
      trust this entry, or the credential this run is using, without checking the vault
      directly -- this should never happen when keepassxc-cli add itself reports success,
      so if it does, something is genuinely wrong with the vault file, not just this run.
  no_log: true
  when:
    - _kcs_needs_write | default(false)
    - (_kcs_write_verify.stdout | default('') | trim) != _kcs_final_value

- name: "[KeePass sync: {{ kcs_keepass_path }}] Write verified — read-back matches exactly"
  debug:
    msg: "{{ kcs_keepass_path }}: written value confirmed via read-back -- matches exactly."
  when: _kcs_needs_write | default(false)

- name: "[KeePass sync: {{ kcs_keepass_path }}] New value was generated — one-time banner"
  debug:
    msg:
      - ""
      - "{{ _c.G if _c is defined else '' }}════════════════════════════════════════════════════════════════{{ _c.NC if _c is defined else '' }}"
      - "  GENERATED VALUE for {{ kcs_keepass_path }} -- filed into KeePass automatically"
      - "  Username  : {{ kcs_username }}"
      - "  Password  : {{ _kcs_final_value }}"
      - "{{ _c.G if _c is defined else '' }}════════════════════════════════════════════════════════════════{{ _c.NC if _c is defined else '' }}"
  when: _kcs_was_generated | default(false)

- name: "[KeePass sync: {{ kcs_keepass_path }}] Set result fact"
  set_fact:
    "{{ kcs_result_var }}": "{{ _kcs_final_value }}"
  no_log: true
