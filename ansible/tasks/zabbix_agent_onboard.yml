---
# =============================================================================
# tasks/zabbix_agent_onboard.yml
# Example Music Limited — Zabbix agent install, PSK encryption, API registration (Linux)
# =============================================================================
# Shared tasks file, included from two callers:
#   - ansible/playbooks/zabbix/zabbix_agent.yml  (one-shot, --limit <hostname>)
#   - ansible/playbooks/linux/tools.yml           (automatic, every run, hosts: all)
#
# Classic zabbix-agent only (Robert: "agent is agent not agent2, I am not using agent2"),
# matching bootstrap/web/provision/zabbixme.sh's own server-side choice. Windows agents are
# explicitly out of scope here -- Salt handles that (MSI), per Robert's own stated
# sequencing ("we'll write one for ansible and salt for the zabbix agent"). This file only
# ever runs against Linux hosts; callers are responsible for not including it on Windows.
#
# Requires (caller must already have included/gathered):
#   - tasks/hostname_facts.yml (host_site)
#   - group_vars/all/site_services.yml -- site_services.zabbix.ip (the real server address,
#     NOT hardcoded here -- see generate_inventory.py's compute_site_services(), added
#     2026-10-16 specifically for this)
#   - group_vars/all/vault.yml -- vault_zabbix_api_token (a dedicated Zabbix API token,
#     Users -> API tokens on EXAZABCLD001, deliberately NOT Admin's own password -- see
#     that file's own 2026-10-16 changelog entry for why: this task file is included from
#     linux/tools.yml, a routinely re-run, hosts: all by default play, where a masked
#     per-run credential prompt would be a real UX regression)
#   - zbx_kcs_repo_root -- passed explicitly by the CALLER (computed from that caller's own
#     playbook_dir), same *_repo_root convention as discover_dc_repo_root/example_music_gate_
#     repo_root elsewhere in this repo. This file does NOT compute its own playbook_dir-
#     relative path -- the exact bug class fixed in discover_real_dcs.yml earlier this same
#     session (hardcoding a depth inside a SHARED file breaks the moment a caller at a
#     different depth includes it; a caller-supplied value is the one that can never drift).
#
# API auth: presented as an Authorization: Bearer header, NOT the deprecated JSON-RPC
# "auth" field -- confirmed against the real Zabbix 7.0 API docs before writing this
# (api/general/description.html's own token-auth example).
#
# Design doc: docs/ansible/zabbix-playbooks-plan.md (2026-09-03) -- verified against the
# real Zabbix 7.0 packages/docs there, not re-derived here:
#   - Template name: "Linux by Zabbix agent active" (pre-6.0 "Template OS Linux" is gone)
#   - Active checks only (agent pushes to the server) -- matches zabbixme.sh's own UFW
#     Section 6, which already opens port 10051/tcp (Zabbix trapper) inbound to the server
#   - PSK field semantics: tls_connect/tls_accept = 2 (bitmask) on the API's host object
#   - host.create's own "interfaces" param is optional, not required, for an active-only host
#
# One detail updated past the 2026-09-03 design doc, verified fresh against the real 7.0
# config-parameter docs before writing this file (not assumed from the older doc):
#   - EnableRemoteCommands is DEPRECATED in 7.0 -- the real current mechanism is
#     AllowKey=system.run[*] (DenyKey for the inverse). Used here instead.
#   - TLSConnect/TLSAccept in zabbix_agentd.conf itself take the NAMED string value "psk",
#     not the numeric "2" bitmask that only applies to the API's host-object fields -- a
#     real, easy-to-get-wrong mismatch between the config-file layer and the API layer,
#     confirmed against the real "Using pre-shared keys" documentation page directly.
#   - The real API endpoint is /zabbix/api_jsonrpc.php, NOT /api_jsonrpc.php at the
#     document root -- zabbixme.sh's own Apache vhost aliases the whole frontend under
#     /zabbix/ (Alias /zabbix ${FRONTEND_ROOT}), confirmed by reading that vhost block
#     directly rather than assuming the generic Zabbix default-install path. Plain HTTP
#     (port 80 only, no SSL block anywhere in that vhost) -- NOT the https:// that
#     role_codes.csv's own ZAB row note claims; flagged to Robert as a doc inconsistency
#     to confirm, not silently "corrected" in case SSL was added out-of-band since.
#
# Config content is edited via lineinfile, NOT a full copy: content:/template: rewrite --
# Robert's explicit ask, 2026-10-24, after the PidFile= bug below: ripping out and
# replacing the Debian package's entire shipped zabbix_agentd.conf is gratuitous and
# genuinely cost us a real directive (PidFile=) we never meant to touch. Every task below
# only swaps an existing value (regexp + line, replaces in place) or appends a brand new
# directive that doesn't exist uncommented in the stock file at all (TLSConnect/TLSAccept/
# TLSPSKIdentity/TLSPSKFile/AllowKey) -- never a wholesale overwrite, so anything in the
# package's own shipped file that we don't explicitly care about (PidFile=, LogFile=,
# Include=, every commented-out doc block) survives untouched regardless of what the
# package maintainer ships or changes it to in a future version.
# =============================================================================
# Changelog:
#   2026-10-24  Real finding while onboarding EXAFWLCLD001, Robert's ask: host.create's
#               template lookup was always "Linux by Zabbix agent active" (Zabbix's own
#               stock template) -- none of this series' 8 real companion templates
#               (docs/zabbix_templates/*.json) were ever linked to any host, including
#               EXAZABCLD001's own self-registration. Fixed, going forward only (not
#               retrofitting already-registered hosts -- Robert's explicit call): every
#               new registration now gets "Linux by Zabbix agent" (passive, swapped in
#               for the active stock template per Robert's own call -- inbound
#               10050/10051 from LAN is already allowed on every firewall role host,
#               confirmed in 07_nftables.yml before relying on it) + our own
#               linuxtools_examplemusic (base) + a role-specific companion template,
#               if one exists for host_role (FWL/NAS/CLP/DNS/ANS/PVE/RMM -- the 7 roles
#               with a real dedicated template; everything else just gets the base two).
#   2026-10-24  Real live bug, EXAZABCLD001's own zabbix_agentd.log: "failed to accept
#               an incoming connection: connection from 127.0.0.1 rejected, allowed
#               hosts: 192.168.69.13" -- the server and this agent are co-located on
#               the same box (self-monitoring), and the server's own periodic agent-
#               availability check against its own IP routes via loopback at the
#               kernel level, arriving as 127.0.0.1 even though Server= correctly has
#               the real IP. Robert's ask: fix this up front for every agent, not just
#               patch this one host, since he'll hit the same thing anywhere else a
#               server/agent end up co-located. Added 127.0.0.1 alongside the real
#               server IP to Server= (harmless everywhere -- loopback can only
#               originate from the same machine). ServerActive untouched, it governs
#               outgoing connections, never the problem here.
#   2026-10-24  Robert's explicit ask, after confirming the real bug below: rewrote the
#               config-writing task from a single copy: content: (full-file overwrite)
#               to a series of ansible.builtin.lineinfile tasks against the real,
#               package-shipped /etc/zabbix/zabbix_agentd.conf -- confirmed field-for-
#               field against the actual file extracted from the cached .deb
#               (dpkg-deb --fsys-tarfile .../zabbix-agent_*.deb | tar -xO
#               ./etc/zabbix/zabbix_agentd.conf) rather than assumed. Real finding from
#               that extraction: PidFile=/run/zabbix/zabbix_agentd.pid, LogFile=, and
#               Include= were ALL already correct in the stock file -- our own full
#               overwrite below was the only thing that had ever dropped PidFile=, so
#               those three are left alone entirely now. Only Server/ServerActive/
#               Hostname/LogFileSize get replaced (stock ships placeholder/loopback
#               defaults); TLSConnect/TLSAccept/TLSPSKIdentity/TLSPSKFile/AllowKey get
#               appended fresh since the stock file only has them as commented docs, not
#               real directives. AllowKey=system.run[*] kept exactly as before -- Robert's
#               explicit, knowing call on the security tradeoff, not revisited here.
#   2026-10-24  Real live bug, EXAZABCLD001: `systemctl restart zabbix-agent` timed out
#               and restart-looped even though the daemon itself started fine (collector
#               + 10 listeners + active-checks worker all genuinely running, confirmed via
#               `systemctl status`'s own CGroup listing). Real cause: this file's own
#               `copy: content:` does a FULL replace of the Debian package's shipped
#               zabbix_agentd.conf, which normally carries `PidFile=/run/zabbix/
#               zabbix_agentd.pid` matching the systemd unit's own Type=forking PIDFile=
#               expectation (`systemctl status`'s own error names that exact path) -- our
#               replacement never re-added it, so the daemon silently fell back to its own
#               compiled-in default path, which systemd never checks, so the unit waits
#               forever and times out. This is a SHARED file (included by every Linux
#               host's own linux/tools.yml run, not just this box) -- every agent in the
#               estate has had this same latent gap since the file was first written;
#               simply never surfaced before because nothing had done a manual
#               `systemctl restart` on an agent until now. Added the missing PidFile= line.
#   2026-10-24  Robert's ask: handle every real outcome of the API registration step, not
#               just "new host" and "already there, do nothing" --
#                 1. New host: added an agent-type interface (own IP) and a description
#                    to host.create -- cosmetic/UX, not required for active checks, but
#                    the host list/graphs read better with a real interface attached.
#                 2. API unreachable or any other registration failure: wrapped the whole
#                    section in block/rescue -- prints a WARN (via the standard debug:
#                    pattern this repo's exa_pretty callback already renders) with the
#                    PSK/PSKID for manual entry, and crucially does NOT propagate the
#                    failure up into linux/tools.yml's own outer rescue, whose message is
#                    about hostname-not-EXA-convention yet and would have been actively
#                    misleading for an unrelated Zabbix outage.
#               3/4. Already-registered host: added a host.update call that pushes the
#                    on-disk PSK/PSKID unconditionally (disk always wins) -- host.get
#                    never returns the current tls_psk value to diff against (write-only
#                    field), so there's nothing to usefully compare; pushing unconditionally
#                    is a no-op when nothing's changed and self-heals real drift when it has.
#   2026-10-16  Extracted the zabbix-release install logic into tasks/zabbix_repo_install.yml
#               -- zabbix_server.yml (new, Ansible port of zabbixme.sh) needs the exact same
#               arch-aware install, and duplicating it a second time would be the same
#               "don't hand-roll, share the generator" mistake this whole repo works to avoid.
#   2026-10-16  Real live finding, EXAZABCLD001's rebuild test (fresh Debian, first contact
#               via the bare-IP -i "<ip>," pattern every first-run onboarding in this repo
#               uses): every identity-bearing reference below (PSK path, KeePass entry,
#               zabbix_agentd.conf's Hostname=, the API's host.create "host" field) used
#               inventory_hostname directly -- which during a bare-IP run IS the literal IP
#               string, not the real hostname. Filed the PSK/KeePass entry under
#               "192.168.69.237" instead of "EXAZABCLD001"; a later re-run once the host is
#               in static inventory under its real name would have treated it as an
#               entirely different host (new PSK, second KeePass entry, second Zabbix
#               registration) rather than recognising it as the same one. Fixed by adding
#               zbx_real_hostname, using the exact same target_hostname -> ansible_hostname
#               -> inventory_hostname precedence tasks/hostname_facts.yml itself already
#               established for this exact scenario -- not a new pattern, just failing to
#               apply the existing one consistently the first time.
#   2026-10-16  Initial file. Robert's ask: a companion Zabbix template for every playbook
#               family, starting with the actual prerequisite nothing else can be tested
#               without -- agent install + registration. Folded into linux/tools.yml as a
#               standing rule going forward (Robert's own explicit choice, AskUserQuestion),
#               not just a one-shot onboarding playbook as the Sept 3 plan originally scoped.
# =============================================================================

- name: "[Zabbix] Resolve the real hostname (bare-IP-run safe, matches hostname_facts.yml's own precedence)"
  set_fact:
    zbx_real_hostname: "{{ target_hostname | default(ansible_hostname | default(inventory_hostname)) }}"
  tags: [zabbix, monitoring]

- name: "[Zabbix] Install the real zabbix-release package (shared with zabbix_server.yml)"
  include_tasks: zabbix_repo_install.yml
  tags: [zabbix, monitoring]

- name: "[Zabbix] Install zabbix-agent (classic agent, NOT agent2)"
  ansible.builtin.apt:
    name: zabbix-agent
    state: present
  tags: [zabbix, monitoring]

# ── PSK: generate once, never regenerate (would desync from what's already registered) ──

- name: "[Zabbix] Ensure PSK directory exists"
  ansible.builtin.file:
    path: /etc/zabbix/agent_psk
    state: directory
    owner: zabbix
    group: zabbix
    mode: "0700"
  tags: [zabbix, monitoring]

- name: "[Zabbix] Check for an existing PSK file"
  ansible.builtin.stat:
    path: "/etc/zabbix/agent_psk/{{ zbx_real_hostname }}.psk"
  register: zbx_psk_stat
  tags: [zabbix, monitoring]

- name: "[Zabbix] Generate PSK (openssl rand -hex 32 -- first onboarding only)"
  ansible.builtin.shell: "openssl rand -hex 32 > /etc/zabbix/agent_psk/{{ zbx_real_hostname }}.psk"
  when: not zbx_psk_stat.stat.exists
  tags: [zabbix, monitoring]

- name: "[Zabbix] Set PSK file ownership/permissions (readable only by the zabbix user)"
  ansible.builtin.file:
    path: "/etc/zabbix/agent_psk/{{ zbx_real_hostname }}.psk"
    owner: zabbix
    group: zabbix
    mode: "0600"
  tags: [zabbix, monitoring]

- name: "[Zabbix] Read the PSK back (needed for the API call below, whether just-generated or pre-existing)"
  ansible.builtin.slurp:
    src: "/etc/zabbix/agent_psk/{{ zbx_real_hostname }}.psk"
  register: zbx_psk_raw
  tags: [zabbix, monitoring]

- name: "[Zabbix] Set PSK fact (trimmed, decoded)"
  set_fact:
    zbx_psk_value: "{{ zbx_psk_raw.content | b64decode | trim }}"
  no_log: true
  tags: [zabbix, monitoring]

- name: "[Zabbix] File the PSK into KeePass (already generated above -- this just files it)"
  include_tasks: keepass_credential_sync.yml
  vars:
    kcs_repo_root: "{{ zbx_kcs_repo_root }}"
    kcs_keepass_path: "Infrastructure/{{ host_site }}/{{ zbx_real_hostname }}-zabbix-psk"
    kcs_username: "{{ zbx_real_hostname }}-psk"
    kcs_current_value: "{{ zbx_psk_value }}"
    kcs_can_generate: false
    kcs_credentials_json_role: "ZABBIX"
    kcs_result_var: zbx_psk_filed
  tags: [zabbix, monitoring]

# ── Agent config ─────────────────────────────────────────────────────────────────────

# lineinfile only below -- NEVER a full-file rewrite (Robert's explicit ask, see this
# file's own header). Each entry either replaces an existing stock directive in place
# (regexp matches it) or appends a brand new one at EOF (regexp matches nothing, since
# the stock file only has it as a commented doc block) -- confirmed line-for-line
# against the real file extracted from the cached zabbix-agent_*.deb, not assumed.
# LogFile=/var/log/zabbix/zabbix_agentd.log and Include=/etc/zabbix/zabbix_agentd.d/
# *.conf are already correct in the stock file AND were already written correctly by
# the previous copy: content: task on every host that's already run it -- genuinely
# nothing to do for those two, left alone entirely.
#
# PidFile IS included below despite also being correct in the stock file -- the
# previous copy: content: task is exactly what DROPPED it on every host that's
# already run this file (the real bug fixed in 14aa54f/540cf42). A fresh install
# already has it right (this entry is then a no-op); an already-damaged host (the
# PidFile= line genuinely missing right now) gets it added back, same regexp-finds-
# nothing-so-append behaviour as the TLS*/AllowKey entries below. Self-healing on
# re-run either way -- no manual intervention needed on any host already affected.
- name: "[Zabbix] Configure zabbix_agentd.conf (lineinfile -- add/replace only, never rewrite)"
  ansible.builtin.lineinfile:
    path: /etc/zabbix/zabbix_agentd.conf
    regexp: "{{ item.regexp }}"
    line: "{{ item.line }}"
    backup: true
  loop:
    - { regexp: "^PidFile=", line: "PidFile=/run/zabbix/zabbix_agentd.pid" }
    # Stock ships LogFileSize=0 (no rotation) -- 1MB rotation instead, deliberate choice.
    - { regexp: "^LogFileSize=", line: "LogFileSize=1" }
    # Stock ships Server=127.0.0.1/ServerActive=127.0.0.1 (loopback placeholders).
    # Server= (governs INCOMING connections TO this agent) also allows 127.0.0.1
    # alongside the real server IP -- real live finding, EXAZABCLD001: when the
    # Zabbix server and an agent are co-located on the same box (self-monitoring),
    # the server's own periodic agent-availability check against its own IP routes
    # via loopback at the kernel level, so the connection arrives FROM 127.0.0.1 and
    # gets rejected ("allowed hosts: 192.168.69.13" in zabbix_agentd.log) even though
    # the real server IP is correctly configured. Harmless to allow on every agent
    # estate-wide, not just this one host -- loopback can only ever originate from
    # the same machine, so this doesn't widen what can actually reach a remote
    # agent's listener. ServerActive doesn't need this -- it governs OUTGOING
    # connections the agent itself initiates, which was never the problem here.
    - { regexp: "^Server=", line: "Server={{ site_services.zabbix.ip }},127.0.0.1" }
    - { regexp: "^ServerActive=", line: "ServerActive={{ site_services.zabbix.ip }}" }
    # Stock ships the literal placeholder Hostname=Zabbix server.
    - { regexp: "^Hostname=", line: "Hostname={{ zbx_real_hostname }}" }
    # None of these exist uncommented in the stock file -- appended fresh.
    - { regexp: "^TLSConnect=", line: "TLSConnect=psk" }
    - { regexp: "^TLSAccept=", line: "TLSAccept=psk" }
    - { regexp: "^TLSPSKIdentity=", line: "TLSPSKIdentity={{ zbx_real_hostname }}-psk" }
    - { regexp: "^TLSPSKFile=", line: "TLSPSKFile=/etc/zabbix/agent_psk/{{ zbx_real_hostname }}.psk" }
    # EnableRemoteCommands is deprecated in 7.0 -- AllowKey is the real current mechanism
    # (confirmed against the real 7.0 config-parameter docs). Stock ships
    # DenyKey=system.run[*] by default (also not present as an uncommented line, applied
    # internally) -- this explicitly allows it instead. Real security tradeoff, Robert's
    # own explicit, knowing call -- not revisited or softened here.
    - { regexp: "^AllowKey=", line: "AllowKey=system.run[*]" }
  loop_control:
    label: "{{ item.regexp }}"
  notify: Restart zabbix-agent
  tags: [zabbix, monitoring]

- name: "[Zabbix] Ensure zabbix-agent is running and enabled"
  ansible.builtin.systemd:
    name: zabbix-agent
    state: started
    enabled: true
  tags: [zabbix, monitoring]

- name: "[Zabbix] Flush handlers (apply new zabbix_agentd.conf immediately, if changed)"
  meta: flush_handlers
  tags: [zabbix, monitoring]

# ── API registration -- idempotent throughout: get before create, every object ─────────
#
# 2026-10-24, Robert's ask: four possible outcomes once a host (new or already-known)
# reaches this point --
#   1. New host: register it (host.create), using the real "Linux by Zabbix agent
#      active" template (the pre-6.0 "Template OS Linux" it replaced is gone in 7.0 --
#      already confirmed against the real docs when this file was first written), an
#      agent interface carrying the host's own IP (even though checks are active-only --
#      having a real interface lets the frontend show/sort the host's address properly),
#      and a description recording how/when it was onboarded.
#   2. Zabbix API unreachable, or any other registration-step failure (EXAZABCLD001
#      offline, a real API-level error, etc.) -- non-critical: warn and carry on rather
#      than failing the whole play, with the PSK/PSKID printed so it can be typed in by
#      hand once the server's back.
#   3. Host already registered, but the PSK on disk differs from what Zabbix has on file
#      (e.g. this box's PSK file got regenerated, or it's a re-image under the same
#      hostname) -- on-disk always wins, pushed via host.update.
#   4. Host already registered and already in sync -- host.update is a no-op in effect
#      either way (the API gives no "nothing to change" signal for this call, so Ansible
#      reports it as changed regardless -- harmless, matches every other Zabbix uri:
#      task in this repo already).
#
# All of it lives inside one block/rescue so a genuine API-reachability failure can't
# leak up into linux/tools.yml's own outer block/rescue around this include -- that
# outer rescue's own message is specifically about the hostname not matching EXA
# convention yet, confirmed by reading that caller's text directly; letting an unrelated
# Zabbix outage fall through to it would print a real, misleading diagnostic.
- name: "[Zabbix] API registration/sync (self-healing, never fatal)"
  block:
    - name: "[Zabbix] Check whether this host is already registered"
      ansible.builtin.uri:
        url: "http://{{ site_services.zabbix.ip }}/zabbix/api_jsonrpc.php"
        method: POST
        headers:
          Authorization: "Bearer {{ vault_zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: host.get
          params:
            filter:
              host: ["{{ zbx_real_hostname }}"]
          id: 1
        status_code: 200
      register: zbx_host_check
      delegate_to: localhost
      become: false

    - name: "[Zabbix] Get the auto-registration host group"
      ansible.builtin.uri:
        url: "http://{{ site_services.zabbix.ip }}/zabbix/api_jsonrpc.php"
        method: POST
        headers:
          Authorization: "Bearer {{ vault_zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: hostgroup.get
          params:
            filter:
              name: ["auto-registration"]
          id: 1
        status_code: 200
      register: zbx_autoreg_group
      delegate_to: localhost
      become: false
      when: zbx_host_check.json.result | length == 0

    - name: "[Zabbix] Get-or-create this site's own host group (Site - {{ host_site }})"
      ansible.builtin.uri:
        url: "http://{{ site_services.zabbix.ip }}/zabbix/api_jsonrpc.php"
        method: POST
        headers:
          Authorization: "Bearer {{ vault_zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: hostgroup.get
          params:
            filter:
              name: ["Site - {{ host_site }}"]
          id: 1
        status_code: 200
      register: zbx_site_group_check
      delegate_to: localhost
      become: false
      when: zbx_host_check.json.result | length == 0

    - name: "[Zabbix] Create this site's host group, if it doesn't exist yet"
      ansible.builtin.uri:
        url: "http://{{ site_services.zabbix.ip }}/zabbix/api_jsonrpc.php"
        method: POST
        headers:
          Authorization: "Bearer {{ vault_zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: hostgroup.create
          params:
            name: "Site - {{ host_site }}"
          id: 1
        status_code: 200
      register: zbx_site_group_create
      delegate_to: localhost
      become: false
      when:
        - zbx_host_check.json.result | length == 0
        - zbx_site_group_check.json.result | length == 0

    # 2026-10-24, real finding while onboarding EXAFWLCLD001: this lookup was always
    # "Linux by Zabbix agent active" -- Zabbix's own STOCK active-check template, never
    # any of the 8 companion templates this whole series built (docs/zabbix_templates/
    # *.json). Every host ever onboarded through this file, including EXAZABCLD001's
    # own self-registration, only ever got the generic stock template -- confirmed by
    # reading this exact filter, not assumed. Robert's explicit calls on the real fix:
    #   - stock template swapped to "Linux by Zabbix agent" (passive, not active) --
    #     "does the same job and is passive". Inbound 10050/10051 from LAN is already
    #     allowed on every firewall role host (07_nftables.yml, confirmed before this
    #     change, not assumed), so passive checks work out of the box.
    #   - every host also gets our own linuxtools_examplemusic (base companion) PLUS
    #     its own role-specific companion template, if one exists for host_role.
    #   - going forward only -- already-registered hosts (EXAZABCLD001 included) are
    #     NOT retrofitted here; that's an explicit, separate follow-up if ever wanted.
    - name: "[Zabbix] Resolve this host's role-specific companion template name, if any"
      set_fact:
        zbx_role_template_name: "{{ zbx_role_template_map[host_role | upper] | default('') }}"
      vars:
        zbx_role_template_map:
          FWL: firewall_examplemusic
          NAS: truenas_examplemusic
          CLP: cloudpanel_examplemusic
          DNS: bind9_examplemusic
          ANS: ansible_examplemusic
          PVE: proxmox_examplemusic
          RMM: tacticalrmm_examplemusic
      when: zbx_host_check.json.result | length == 0

    - name: "[Zabbix] Get the base passive stock template ID (Linux by Zabbix agent)"
      ansible.builtin.uri:
        url: "http://{{ site_services.zabbix.ip }}/zabbix/api_jsonrpc.php"
        method: POST
        headers:
          Authorization: "Bearer {{ vault_zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: template.get
          params:
            filter:
              host: ["Linux by Zabbix agent"]
          id: 1
        status_code: 200
      register: zbx_template_stock
      delegate_to: localhost
      become: false
      when: zbx_host_check.json.result | length == 0

    - name: "[Zabbix] Get our own base companion template ID (linuxtools_examplemusic)"
      ansible.builtin.uri:
        url: "http://{{ site_services.zabbix.ip }}/zabbix/api_jsonrpc.php"
        method: POST
        headers:
          Authorization: "Bearer {{ vault_zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: template.get
          params:
            filter:
              host: ["linuxtools_examplemusic"]
          id: 1
        status_code: 200
      register: zbx_template_linuxtools
      delegate_to: localhost
      become: false
      when: zbx_host_check.json.result | length == 0

    - name: "[Zabbix] Get this host's role-specific companion template ID, if one exists"
      ansible.builtin.uri:
        url: "http://{{ site_services.zabbix.ip }}/zabbix/api_jsonrpc.php"
        method: POST
        headers:
          Authorization: "Bearer {{ vault_zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: template.get
          params:
            filter:
              host: ["{{ zbx_role_template_name }}"]
          id: 1
        status_code: 200
      register: zbx_template_role_specific
      delegate_to: localhost
      become: false
      when:
        - zbx_host_check.json.result | length == 0
        - zbx_role_template_name != ''

    - name: "[Zabbix] Register host via host.create (own agent interface + description)"
      ansible.builtin.uri:
        url: "http://{{ site_services.zabbix.ip }}/zabbix/api_jsonrpc.php"
        method: POST
        headers:
          Authorization: "Bearer {{ vault_zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: host.create
          params:
            host: "{{ zbx_real_hostname }}"
            description: "Managed by Ansible (linux/tools.yml). Site: {{ host_site }}. Onboarded {{ ansible_date_time.date | default('') }}."
            groups: >-
              {{
                [{'groupid': zbx_autoreg_group.json.result[0].groupid}] +
                ([{'groupid': zbx_site_group_check.json.result[0].groupid}] if zbx_site_group_check.json.result | length > 0
                 else [{'groupid': zbx_site_group_create.json.result.groupids[0]}])
              }}
            templates: >-
              {{
                [
                  {'templateid': zbx_template_stock.json.result[0].templateid},
                  {'templateid': zbx_template_linuxtools.json.result[0].templateid}
                ]
                + ([{'templateid': zbx_template_role_specific.json.result[0].templateid}]
                   if (zbx_role_template_name != '' and zbx_template_role_specific.json.result | length > 0)
                   else [])
              }}
            interfaces:
              - type: 1
                main: 1
                useip: 1
                ip: "{{ (ansible_default_ipv4.address if ansible_default_ipv4 is defined else (ansible_host | default(zbx_real_hostname))) }}"
                dns: ""
                port: "10050"
            tls_connect: 2
            tls_accept: 2
            tls_psk_identity: "{{ zbx_real_hostname }}-psk"
            tls_psk: "{{ zbx_psk_value }}"
          id: 1
        status_code: 200
      register: zbx_host_create
      delegate_to: localhost
      become: false
      no_log: true
      when: zbx_host_check.json.result | length == 0

    # Host already registered -- disk always wins. No prior comparison attempted: the
    # Zabbix API doesn't return the current tls_psk value on host.get (it's a write-only
    # secret field, confirmed against the real 7.0 host object docs), so there's nothing
    # to usefully diff against -- push unconditionally instead. Harmless when nothing's
    # actually different (outcome 4); corrects real drift when it is (outcome 3).
    - name: "[Zabbix] Sync PSK/PSKID for an already-registered host (on-disk value always wins)"
      ansible.builtin.uri:
        url: "http://{{ site_services.zabbix.ip }}/zabbix/api_jsonrpc.php"
        method: POST
        headers:
          Authorization: "Bearer {{ vault_zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: host.update
          params:
            hostid: "{{ zbx_host_check.json.result[0].hostid }}"
            description: "Managed by Ansible (linux/tools.yml). Site: {{ host_site }}. Last synced {{ ansible_date_time.date | default('') }}."
            tls_connect: 2
            tls_accept: 2
            tls_psk_identity: "{{ zbx_real_hostname }}-psk"
            tls_psk: "{{ zbx_psk_value }}"
          id: 1
        status_code: 200
      register: zbx_host_update
      delegate_to: localhost
      become: false
      no_log: true
      when: zbx_host_check.json.result | length > 0

    # 2026-10-29, real live finding: ansible.builtin.uri's status_code: 200 only
    # validates the HTTP layer -- Zabbix's JSON-RPC API returns HTTP 200 even for an
    # API-level error (bad token, validation failure), with the real failure sitting
    # in the response body's "error" key instead. Neither host.create nor host.update
    # above ever looked at that key, so a silent API-level failure printed the same
    # cheerful "Registration summary" below as a genuine success, while the server
    # never actually got the host/PSK -- confirmed live: EXAFWLABD001 never existed as
    # a Zabbix host at all despite this file having run against it with no error
    # reported anywhere. fail: here routes it into the existing rescue: block below,
    # so it gets the same manual-fallback PSK printout a hard connection failure
    # already gets -- no new UX, just making a real failure loud instead of silent.
    # No no_log needed on these two -- a JSON-RPC error response never contains the
    # "result"/PSK fields the other tasks' no_log: true is actually protecting.
    - name: "[Zabbix] FAIL if host.create returned an API-level error"
      ansible.builtin.fail:
        msg: >-
          host.create API error for {{ zbx_real_hostname }}:
          {{ zbx_host_create.json.error.message }} -- {{ zbx_host_create.json.error.data | default('') }}
      when:
        - zbx_host_create is defined
        - zbx_host_create.json is defined
        - zbx_host_create.json.error is defined

    - name: "[Zabbix] FAIL if host.update returned an API-level error"
      ansible.builtin.fail:
        msg: >-
          host.update API error for {{ zbx_real_hostname }}:
          {{ zbx_host_update.json.error.message }} -- {{ zbx_host_update.json.error.data | default('') }}
      when:
        - zbx_host_update is defined
        - zbx_host_update.json is defined
        - zbx_host_update.json.error is defined

    - name: "[Zabbix] Registration summary"
      ansible.builtin.debug:
        msg: >-
          {{ (zbx_host_check.json.result | length > 0)
             | ternary('Already registered in Zabbix -- PSK/PSKID synced from disk.',
                        'Newly registered in Zabbix, group "Site - ' + host_site + '", templates: ' +
                        (['Linux by Zabbix agent', 'linuxtools_examplemusic']
                         + ([zbx_role_template_name] if (zbx_role_template_name | default('')) != '' else [])) | join(', ') + '.') }}
  rescue:
    # Deliberately NOT no_log -- Robert's explicit ask is to print the PSK/PSKID here so
    # it can be typed into the Zabbix UI by hand. Every OTHER task above stays no_log:
    # true; this is the one place it's meant to be visible.
    #
    # zbx_role_template_name may never have been set if the block failed before reaching
    # that task (e.g. the very first API call, host.get, timed out) -- defaulted to ''
    # rather than assumed defined.
    - name: "[Zabbix] WARN -- could not register/sync {{ zbx_real_hostname }} with the Zabbix API"
      ansible.builtin.debug:
        msg: >-
          WARN: Zabbix API registration/sync failed for {{ zbx_real_hostname }}
          (EXAZABCLD001 unreachable, or a real API-level error -- non-critical,
          continuing the rest of this play). Add it by hand once the server's reachable
          again:
            Host: {{ zbx_real_hostname }}
            Group: Site - {{ host_site }} (+ auto-registration)
            Templates: Linux by Zabbix agent, linuxtools_examplemusic{{ (', ' + zbx_role_template_name) if (zbx_role_template_name | default('')) != '' else '' }}
            PSK identity: {{ zbx_real_hostname }}-psk
            PSK value: {{ zbx_psk_value }}
  tags: [zabbix, monitoring]
