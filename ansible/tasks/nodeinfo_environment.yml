---
# =============================================================================
# ansible/tasks/nodeinfo_environment.yml
# Example Music Limited — Resolve a node's environment (production/staging/
# development) from its own nodeinfo.json, prompting only if unset
# =============================================================================
# Replaces the old /etc/.environment check/prompt/write pattern, which was
# duplicated near-identically across firewallme's 00_preflight_3_ask.yml,
# bind9-dns.yml, rudder_server.yml, and proxmox's 00-preflight.yml -- in
# every case, /etc/.environment's only purpose was to seed nodeinfo.json's
# `environment` field (ansible/tasks/nodeinfo.yml). This checks that field
# directly instead of maintaining a second, separate flat file whose only
# consumer was itself.
#
# Sets:
#   resolved_environment   'production' | 'staging' | 'development'
#
# Usage: include this, then pass resolved_environment into
# ansible/tasks/nodeinfo.yml's nodeinfo_environment (optionally via a
# locally-scoped alias, e.g. fw_environment, if other tasks in the same
# role already reference that name).
# =============================================================================
# Changelog:
#   2026-07-10  Initial file -- consolidates 4 duplicated /etc/.environment
#               blocks (firewallme, bind9, rudder, proxmox) into one shared
#               task, and fixes linux/tools.yml's best-effort nodeinfo.json
#               write, which previously always defaulted to 'production'
#               with no way to see an already-set environment from a
#               role-specific play that ran first.
#   2026-07-10  Added a legacy /etc/.environment fallback tier (checked
#               after nodeinfo.json, before prompting), for a node that was
#               provisioned before this file existed and has an
#               /etc/.environment but no nodeinfo.json yet -- avoids
#               silently re-prompting for a value the operator already gave
#               once. linux/tools.yml deletes /etc/.environment once
#               nodeinfo.json has captured it, so this fallback is expected
#               to stop firing naturally as the estate is swept.
#   2026-07-26  Robert, live (bind9-dns.yml --tags zones-full,reload):
#               'resolved_environment' is undefined at the caller's own
#               set_fact, despite a valid nodeinfo.json present -- reproduced
#               locally on ansible-core 2.19.4. Every caller includes this
#               file via a task tagged `tags: always`, on the assumption that
#               "always" propagates down to these tasks since none of them
#               carry their own tags -- it doesn't, reliably, for a dynamic
#               include_tasks under an active --tags filter that doesn't also
#               match "always": the include statement itself runs (it has the
#               tag), but its untagged children get filtered out same as any
#               other untagged task, so nothing in here ever executes and
#               resolved_environment never gets set. Fixed by tagging every
#               task in this file `always` directly, rather than relying on
#               inheritance from whichever caller happens to include it.
# =============================================================================

- name: "[Environment] Check for existing /etc/example-music/nodeinfo.json"
  tags: always
  ansible.builtin.stat:
    path: /etc/example-music/nodeinfo.json
  register: _nodeinfo_env_file

- name: "[Environment] Read existing nodeinfo.json"
  tags: always
  ansible.builtin.slurp:
    src: /etc/example-music/nodeinfo.json
  register: _nodeinfo_env_content
  when: _nodeinfo_env_file.stat.exists
  changed_when: false

- name: "[Environment] Set environment from existing nodeinfo.json"
  tags: always
  ansible.builtin.set_fact:
    resolved_environment: "{{ (_nodeinfo_env_content.content | b64decode | from_json).environment | default('') }}"
  when: _nodeinfo_env_file.stat.exists

- name: "[Environment] Check for legacy /etc/.environment"
  tags: always
  ansible.builtin.stat:
    path: /etc/.environment
  register: _nodeinfo_env_legacy_file
  when: resolved_environment | default('') == ''

- name: "[Environment] Read legacy /etc/.environment"
  tags: always
  ansible.builtin.slurp:
    src: /etc/.environment
  register: _nodeinfo_env_legacy_content
  when:
    - resolved_environment | default('') == ''
    - _nodeinfo_env_legacy_file.stat.exists | default(false)
    - _nodeinfo_env_legacy_file.stat.size | default(0) > 0
  changed_when: false

- name: "[Environment] Set environment from legacy /etc/.environment"
  tags: always
  ansible.builtin.set_fact:
    resolved_environment: "{{ _nodeinfo_env_legacy_content.content | b64decode | trim }}"
  when:
    - resolved_environment | default('') == ''
    - _nodeinfo_env_legacy_content is not skipped

- name: "[Environment] Prompt for environment (no nodeinfo.json or legacy file)"
  tags: always
  ansible.builtin.pause:
    prompt: "Environment ((p)roduction, (s)taging, (d)evelopment) [default: production]"
  register: _nodeinfo_env_prompt
  when: resolved_environment | default('') == ''

- name: "[Environment] Set environment from prompt"
  tags: always
  ansible.builtin.set_fact:
    resolved_environment: >-
      {%- set e = _nodeinfo_env_prompt.user_input | default('p') | lower | trim -%}
      {%- if e == 's' -%}staging
      {%- elif e == 'd' -%}development
      {%- else -%}production
      {%- endif -%}
  when: resolved_environment | default('') == ''
