---
# =============================================================================
# ansible/tasks/hostname_facts.yml
# Example Music Limited — Parse EXA[ROLE][SITE][NNN] hostname convention
# Sets: host_role (e.g. WKS), host_site (e.g. GLA), host_num (e.g. 001)
#
# Uses target_hostname (set by 00-preflight.yml) if available, falls back
# to ansible_hostname (Windows-reported name), then inventory_hostname.
# This covers bare-IP inventory runs where inventory_hostname is an IP.
# =============================================================================
# Changelog:
#   2026-10-23  Robert's ask, live on EXANASFAL001: fixed the three | default([...])
#               calls below to pass the boolean-filter second argument -- without it,
#               a regex_search() that returns None (no match) passed straight
#               through to | first and crashed "'NoneType' object is not iterable"
#               instead of ever falling back to UNKNOWN/001. See the task's own
#               inline comment for the full detail, including why this was never hit
#               before TrueNAS's own 00-preflight.yml fix (same day).
#   2026-06-20  Initial file
#   2026-06-29  Fix | default placement — must wrap list before | first
#   2026-06-29  Use target_hostname > ansible_hostname > inventory_hostname
#               so bare-IP inventory runs parse the correct hostname
#   2026-10-08  Tagged the two real tasks `always` directly. Proxmox's
#               00-preflight.yml tags its own include_tasks call
#               `[preflight, always]` on the (correct) assumption that a
#               narrow --tags run (e.g. --tags pools) still needs host_site
#               for 30-example-music.yml's always-tagged nodeinfo write --
#               but tags on the include statement don't propagate to
#               untagged children for a dynamic include_tasks, confirmed on
#               real ansible-core (same root cause already documented in
#               nodeinfo_environment.yml's own 2026-07-26 changelog entry,
#               which this reproduces independently). Reproduced live,
#               2026-10-08: `--tags pools` against EXAPVEVRK001 still failed
#               with "'host_site' is undefined" even after the include-line
#               tag fix landed. Each task needs `always` directly, same as
#               that file's own fix.
# =============================================================================

- name: Parse role from hostname
  tags: always
  # 2026-10-23, Robert's ask, live on EXANASFAL001: regex_search() returns a plain
  # None (not Jinja Undefined) when the pattern doesn't match at all -- the
  # | default([...]) calls below never actually caught that, since Jinja's default()
  # filter only replaces Undefined by default, not None/falsy values. A non-matching
  # hostname therefore passed None straight through to | first, which crashed with
  # "'NoneType' object is not iterable" instead of ever falling back to
  # UNKNOWN/001. Confirmed in isolation (a non-matching string really does produce
  # None here, and default([...], true) really does catch it) before trusting this
  # fix. Reproduced for real by this exact chain: TrueNAS boxes keep their factory/
  # DHCP-assigned OS hostname until 10-access.yml renames them, so this file's
  # ansible_hostname fallback (used whenever a caller's own play has already run
  # gather_facts, as 00-preflight.yml's site-lookup play does) doesn't match the EXA
  # convention yet at this point in the chain -- see that file's own fix for the
  # other half of this (passing target_hostname explicitly, so it never even reaches
  # this fallback for TrueNAS). This default()-boolean-arg fix stands on its own
  # regardless: any future caller hitting a genuinely non-matching hostname would
  # have hit the exact same crash.
  set_fact:
    host_role: >-
      {{ (target_hostname | default(ansible_hostname | default(inventory_hostname)))
         | upper
         | regex_search('^EXA([A-Z]{2,4})[A-Z]{3}[0-9]{3}$', '\1')
         | default(['UNKNOWN'], true) | first }}
    host_site: >-
      {{ (target_hostname | default(ansible_hostname | default(inventory_hostname)))
         | upper
         | regex_search('^EXA[A-Z]{2,4}([A-Z]{3})[0-9]{3}$', '\1')
         | default(['UNKNOWN'], true) | first }}
    host_num: >-
      {{ (target_hostname | default(ansible_hostname | default(inventory_hostname)))
         | upper
         | regex_search('^EXA[A-Z]{2,4}[A-Z]{3}([0-9]{3})$', '\1')
         | default(['001'], true) | first }}

- name: Validate hostname convention
  tags: always
  assert:
    that:
      - host_role != 'UNKNOWN'
      - host_site != 'UNKNOWN'
    fail_msg: >
      Hostname '{{ target_hostname | default(ansible_hostname | default(inventory_hostname)) }}'
      does not match EXA[ROLE][SITE][NNN] convention.
      Examples: EXAWKSGLA001, EXASVRCLD002, EXALAPCPH003.
    success_msg: "Hostname valid: role={{ host_role }} site={{ host_site }} num={{ host_num }}"

- name: Debug — hostname facts
  debug:
    msg: "role={{ host_role }}  site={{ host_site }}  num={{ host_num }}"
  tags: [never, debug]

