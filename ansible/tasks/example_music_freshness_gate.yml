---
# =============================================================================
# ansible/tasks/example_music_freshness_gate.yml
# Example Music Limited — Fail loudly if /etc/example-music/* is missing or
# stale on the Ansible control node, instead of crashing cryptically later
# =============================================================================
# Triggered by a real live crash (2026-07-26): bind9-dns.yml died with a raw
# Python KeyError running generate_inventory.py against
# /etc/example-music/address_policy.json. Traced to the control node's OWN
# served copy predating a benarbejde/ schema change -- linux/tools.yml (the
# only thing that deploys benarbejde/* to /etc/example-music/*) hadn't been
# re-run against the control node itself in a while, even though its own git
# checkout was current.
#
# Every real consumer of /etc/example-music/* across this repo's 12 affected
# playbooks reads it via delegate_to: localhost or a bare lookup('file', ...)
# (the latter always evaluates on the controller regardless of delegate_to --
# confirmed via ansible/tasks/ad_forest_facts.yml's own delegate_to:
# localhost, and windows_dc/playbooks/00-dc-preflight.yml's own comment on
# this exact point). So this gate never needs to compare against the play's
# remote target host -- it's always "the control node's own copy vs. the
# control node's own benarbejde/ source," regardless of what host the
# including play actually targets.
#
# Sets: nothing. Either passes silently, or fails the whole play with a
# clear, actionable message -- matching the "showstopper over silent
# wrong-guess" precedent used by ansible/tasks/onboarded_check.yml and the
# SSH keypair guard-rail.
#
# Usage: include from pre_tasks, as the FIRST entry, before setting
# example_music_gate_files/example_music_gate_repo_root:
#
#   pre_tasks:
#     - name: Gate on /etc/example-music/* freshness
#       include_tasks: ../../tasks/example_music_freshness_gate.yml
#       vars:
#         example_music_gate_files: [sites.csv, ad_forest.json]
#         example_music_gate_repo_root: "{{ playbook_dir }}/../../.."
#
# example_music_gate_repo_root is deliberately computed by the INCLUDING
# playbook, not here -- a shared file can't know its caller's own nesting
# depth. This also means check_playbook_dir_paths.py (at_have_ryggen_fri
# check 12) validates every caller's depth automatically, for free.
#
# Offline counterpart: at_have_ryggen_fri/check_control_node_freshness.py
# checks the same underlying fact (control node's served copy vs.
# benarbejde/) without ever running a playbook, so drift is caught by the
# harness before any of these 12 playbooks are even run.
# =============================================================================
# Changelog:
#   2026-09-01  Robert, live (EXAANSCLD001, running against EXAFWLATL001): the gate correctly
#               caught a stale control-node copy and correctly told him the exact fix command
#               -- but that message was buried at the bottom of a huge wall of raw JSON stat/
#               checksum output from the two tasks just above, easy to miss, and it fired AFTER
#               17 interactive prompts had already been sat through in firewallme's own play,
#               only to bomb out right at the end anyway. Two fixes: (1) this message is now
#               wrapped in a loud, yellow-highlighted debug task ahead of the actual fail:, using
#               the same _c.Y/_c.NC convention every other warning in this repo already uses, so
#               it can't get lost in scrollback; also now reminds the operator to re-run their
#               original command against {{ inventory_hostname }} once fixed, rather than leaving
#               them to remember/scroll back for it. (2) callers that CAN run this gate before
#               their own interactive prompts now should -- see firewallme/playbooks/
#               90-firewall.yml's own 2026-09-01 changelog entry, which moved its copy of this
#               gate into an early, pre-prompt play, since this file was already fully
#               control-node-side (delegate_to: localhost throughout) and never actually needed
#               gathered facts or a live target connection to run at all.
#   2026-07-28  Robert, live (EXAANSCLD001, running against EXADCSCLD001): the two `stat` tasks
#               below failed with "Module result deserialization failed: No start of json char
#               found" / stderr "PowerShell: not found" -- the `windows_nodes` group sets
#               ansible_shell_type: powershell (group_vars/windows_nodes/connection.yml), and
#               `vars: ansible_connection: local` only overrides the connection plugin, not that
#               sibling variable, so the local delegate still built its module-execution wrapper
#               assuming PowerShell even on this Linux control node. Same bug class as
#               [[feedback_delegate_localhost_connection_override]] (2026-07-15), a different
#               leaking variable this time. Added `ansible_shell_type: sh` alongside
#               `ansible_connection: local` on both stat tasks. Swept every other
#               delegate_to:localhost shared task file (ssh_key_preflight.yml,
#               refresh_ansible_ssh_key.yml, ad_forest_facts.yml) for the same gap -- neither of
#               the first two is ever called from a Windows-targeted play (Proxmox/TrueNAS/Salt/
#               Linux/firewallme only), so not actually exposed; ad_forest_facts.yml only uses
#               set_fact/lookup('file', ...)/debug, none of which ship a module to the remote
#               shell at all, so shell_type is irrelevant there regardless of caller.
#   2026-07-27  Initial file.
# =============================================================================

- name: "[example-music-gate] Stat deployed /etc/example-music/<file>"
  tags: always
  ansible.builtin.stat:
    path: "/etc/example-music/{{ item }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_connection: local
    ansible_shell_type: sh
  loop: "{{ example_music_gate_files }}"
  register: _em_gate_deployed

- name: "[example-music-gate] Stat benarbejde/<file> source"
  tags: always
  ansible.builtin.stat:
    path: "{{ example_music_gate_repo_root }}/benarbejde/{{ item }}"
  delegate_to: localhost
  become: false
  vars:
    ansible_connection: local
    ansible_shell_type: sh
  loop: "{{ example_music_gate_files }}"
  register: _em_gate_source

- name: "[example-music-gate] WARNING — missing or stale against benarbejde/, see fix below"
  tags: always
  ansible.builtin.debug:
    msg: |
      {{ _c.Y }}[!]{{ _c.NC }} /etc/example-music/{{ item.0 }} is missing or stale on the
      Ansible control node, relative to benarbejde/{{ item.0 }} in this checkout. This is read
      via delegate_to: localhost / lookup('file', ...), not from {{ inventory_hostname }} --
      the TARGET host is fine, it's the CONTROL NODE's own served copy that's out of date.
      {{ _c.C }}Fix it:{{ _c.NC }}
        ansible-playbook ansible/playbooks/linux/tools.yml --limit EXAANSCLD001
        (or whichever host you're actually running ansible-playbook from)
      {{ _c.C }}Then re-run your original command against {{ inventory_hostname }}{{
        ' (ansible_host=' + ansible_host + ')' if ansible_host is defined else '' }}.{{ _c.NC }}
  loop: "{{ example_music_gate_files | zip(_em_gate_deployed.results, _em_gate_source.results) | list }}"
  loop_control:
    label: "{{ item.0 }}"
  when: >-
    not item.1.stat.exists or
    not item.2.stat.exists or
    item.1.stat.checksum != item.2.stat.checksum

- name: "[example-music-gate] FAIL — missing or stale against benarbejde/ (see warning above)"
  tags: always
  ansible.builtin.fail:
    msg: "/etc/example-music/{{ item.0 }} is stale on the control node -- see the warning printed just above for the exact fix."
  loop: "{{ example_music_gate_files | zip(_em_gate_deployed.results, _em_gate_source.results) | list }}"
  loop_control:
    label: "{{ item.0 }}"
  when: >-
    not item.1.stat.exists or
    not item.2.stat.exists or
    item.1.stat.checksum != item.2.stat.checksum
