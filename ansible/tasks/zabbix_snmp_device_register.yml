---
# =============================================================================
# tasks/zabbix_snmp_device_register.yml
# Example Music Limited — Zabbix host.create for one agentless SNMP device
# =============================================================================
# Included (with loop:) from zabbix_server.yml's "snmp_devices" play, once per real
# devices.csv ConnectionType=snmp row -- NOT inlined as a block there because `loop:`
# is not a valid attribute on a `block:` in ansible-core 2.19.11 (confirmed live before
# writing this file: "'loop' is not a valid attribute for a Block"). `loop:` on the
# include_tasks: call itself works fine instead -- also confirmed live.
#
# `item` here is one entry from benarbejde/snmp_device_inventory.py's own JSON output:
# {hostname, site, effective_subnet_site, type, os, ip, notes}.
#
# SNMP interface schema (type: 2, details: {version, bulk, community}) is per Zabbix
# 7.0's documented host-object/interface fields -- NOT independently re-verified against
# the live EXAZABCLD001 instance this session, unlike the agent-registration task file's
# own header, which does say that. Check the first real run's API response before
# trusting this unattended.
# =============================================================================
# Changelog:
#   2026-11-17  Initial file, extracted out of zabbix_server.yml's own inline block for
#               the loop-on-block reason above.
#   2026-11-19  Added vendor-fit template lookup (template.get, never template.create --
#               the 5 official templates this resolves to must be imported into
#               EXAZABCLD001 by Robert first). Fixes a real gap found the same day:
#               EXAUFCCLD001 (CLD,UFC,1) is a Debian Linux host running UniFi Network
#               Controller software, not a Ubiquiti hardware AP -- now correctly resolves
#               to the official "Linux by SNMP" template instead of falling through
#               whatever a network-hardware grouping would have suggested. See
#               ansible/playbooks/zabbix/files/mibs/README.md for the full per-vendor
#               MIBs-used verification this was built from.
# =============================================================================

- name: "[SNMP devices] Register/refresh {{ item.hostname }} (block/rescue, never fatal to the whole run)"
  block:
    - name: "[SNMP devices] Check whether {{ item.hostname }} is already registered"
      ansible.builtin.uri:
        url: "http://{{ site_services.zabbix.ip }}/zabbix/api_jsonrpc.php"
        method: POST
        headers:
          Authorization: "Bearer {{ vault_zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: host.get
          params:
            filter:
              host: ["{{ item.hostname }}"]
          id: 1
        status_code: 200
      register: zbx_snmp_host_check
      delegate_to: localhost
      become: false

    - name: "[SNMP devices] Get-or-create this site's own host group"
      ansible.builtin.uri:
        url: "http://{{ site_services.zabbix.ip }}/zabbix/api_jsonrpc.php"
        method: POST
        headers:
          Authorization: "Bearer {{ vault_zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: hostgroup.get
          params:
            filter:
              name: ["Site - {{ item.site }}"]
          id: 1
        status_code: 200
      register: zbx_snmp_site_group_check
      delegate_to: localhost
      become: false
      when: zbx_snmp_host_check.json.result | length == 0

    - name: "[SNMP devices] Create this site's host group, if it doesn't exist yet"
      ansible.builtin.uri:
        url: "http://{{ site_services.zabbix.ip }}/zabbix/api_jsonrpc.php"
        method: POST
        headers:
          Authorization: "Bearer {{ vault_zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: hostgroup.create
          params:
            name: "Site - {{ item.site }}"
          id: 1
        status_code: 200
      register: zbx_snmp_site_group_create
      delegate_to: localhost
      become: false
      when:
        - zbx_snmp_host_check.json.result | length == 0
        - zbx_snmp_site_group_check.json.result | length == 0

    # Role-based group alongside the per-site one, Robert's ask 2026-11-17 (same idea as
    # 35-pools.yml's pool-per-site in Proxmox -- get-or-create, idempotent, keyed off a
    # fixed map rather than one flat catch-all). RAC and ILO deliberately share one group
    # (Robert's own naming: "RAC (ILO/BMC)") -- both are BMCs, vendor decides which code.
    # Fallback 'SNMP Devices (other)' covers any devices.csv Type this map doesn't know
    # about yet, so registration never silently fails for lack of a group to put it in.
    # RTR/FWL/NAS are mapped even though NO real devices.csv row currently resolves to any
    # of them via this script (checked: role_codes.csv's own ConnectionMethod for all
    # three is ssh/telnet, not snmp -- Routers/Firewalls/NAS Storage groups won't actually
    # get created until a real SNMP-connected device of one of those types exists) --
    # future-proofing, not a current gap.
    - name: "[SNMP devices] Resolve this device's role-based group name"
      ansible.builtin.set_fact:
        zbx_snmp_role_group: "{{ zbx_snmp_role_group_map[item.type] | default('SNMP Devices (other)') }}"
      vars:
        zbx_snmp_role_group_map:
          SWI: "Switches"
          RAC: "RAC (ILO/BMC)"
          ILO: "RAC (ILO/BMC)"
          PRN: "Printers"
          UFC: "Network Management"
          RTR: "Routers"
          FWL: "Firewalls"
          NAS: "NAS Storage"
      when: zbx_snmp_host_check.json.result | length == 0

    # Vendor-fit research, 2026-11-19 (see ansible/playbooks/zabbix/files/mibs/README.md's
    # own "Cross-checked against Zabbix's own official templates" section for the full
    # per-template MIBs-used verification): Cisco/TP-Link/Dell/HPE hardware all have a
    # confirmed-fit official Zabbix 7.0 template, keyed off the real vendor string already
    # in devices.csv's OS column. UFC is a genuine fix, not a vendor match -- EXAUFCCLD001
    # (CLD,UFC,1) is a Debian Linux host running UniFi Network Controller software, NOT a
    # Ubiquiti hardware AP (confirmed via ad_computers.json: OS "Debian trixie", Description
    # "UniFi Network Controller -- manages WAPs across the estate"), so it needs the
    # official "Linux by SNMP" template, not a network-hardware one -- keyed off Type, not
    # OS, since every current/future UFC row is this same controller-host pattern by design
    # (role_codes.csv: "UniFi Network Controller (WiFi mgmt)"). PRN deliberately has no
    # match here -- no official Zabbix printer template exists at all (checked, not
    # assumed: zero printer/brother paths in the whole 7.0 template tree); Robert's own
    # call pending on community-template-vs-custom-build. Blank-OS ILO/RAC rows (most of
    # them -- real vendor not yet confirmed) also deliberately fall through to no match.
    - name: "[SNMP devices] Resolve this device's Zabbix template name, if a vendor fit is known"
      ansible.builtin.set_fact:
        zbx_snmp_template_name: >-
          {{ 'Linux by SNMP' if item.type == 'UFC'
             else 'Cisco IOS by SNMP' if item.os is search('Cisco')
             else 'TP-LINK by SNMP' if item.os is search('TP-Link')
             else 'DELL PowerEdge R740 by SNMP' if item.os is search('Dell')
             else 'HPE ProLiant DL380 by SNMP' if item.os is search('HPE')
             else '' }}
      when: zbx_snmp_host_check.json.result | length == 0

    # Look-up only -- NEVER template.create. These 5 official templates have to be
    # imported into EXAZABCLD001 by Robert himself first (git.zabbix.com/.../release/7.0,
    # or the GitHub mirror github.com/zabbix/zabbix at the same branch); until then this
    # resolves to an empty result and host.create below correctly falls back to templates: [].
    - name: "[SNMP devices] Look up the resolved template's real templateid, if a vendor fit was found"
      ansible.builtin.uri:
        url: "http://{{ site_services.zabbix.ip }}/zabbix/api_jsonrpc.php"
        method: POST
        headers:
          Authorization: "Bearer {{ vault_zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: template.get
          params:
            filter:
              host: ["{{ zbx_snmp_template_name }}"]
          id: 1
        status_code: 200
      register: zbx_snmp_template_check
      delegate_to: localhost
      become: false
      when:
        - zbx_snmp_host_check.json.result | length == 0
        - zbx_snmp_template_name | default('') != ''

    - name: "[SNMP devices] Get-or-create this device's role-based group"
      ansible.builtin.uri:
        url: "http://{{ site_services.zabbix.ip }}/zabbix/api_jsonrpc.php"
        method: POST
        headers:
          Authorization: "Bearer {{ vault_zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: hostgroup.get
          params:
            filter:
              name: ["{{ zbx_snmp_role_group }}"]
          id: 1
        status_code: 200
      register: zbx_snmp_metagroup_check
      delegate_to: localhost
      become: false
      when: zbx_snmp_host_check.json.result | length == 0

    - name: "[SNMP devices] Create this device's role-based group, if it doesn't exist yet"
      ansible.builtin.uri:
        url: "http://{{ site_services.zabbix.ip }}/zabbix/api_jsonrpc.php"
        method: POST
        headers:
          Authorization: "Bearer {{ vault_zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: hostgroup.create
          params:
            name: "{{ zbx_snmp_role_group }}"
          id: 1
        status_code: 200
      register: zbx_snmp_metagroup_create
      delegate_to: localhost
      become: false
      when:
        - zbx_snmp_host_check.json.result | length == 0
        - zbx_snmp_metagroup_check.json.result | length == 0

    # status: 1 == disabled in the Zabbix web UI -- Robert's explicit ask: get the
    # host/interface/MIB plumbing in place without turning on live monitoring yet.
    # templates: linked only for the confirmed vendor fits above (Cisco/TP-Link/Dell/HPE/
    # UFC's Linux-by-SNMP), and only once the lookup above actually found a real
    # templateid -- empty list otherwise (printers, unconfirmed-vendor BMCs, or any of the
    # 5 official templates not yet imported into EXAZABCLD001). See the 2026-11-19
    # changelog entry below and ansible/playbooks/zabbix/files/mibs/README.md.
    - name: "[SNMP devices] Register {{ item.hostname }} via host.create (SNMP interface, disabled)"
      ansible.builtin.uri:
        url: "http://{{ site_services.zabbix.ip }}/zabbix/api_jsonrpc.php"
        method: POST
        headers:
          Authorization: "Bearer {{ vault_zabbix_api_token }}"
        body_format: json
        body:
          jsonrpc: "2.0"
          method: host.create
          params:
            host: "{{ item.hostname }}"
            status: 1
            description: "{{ item.os }} ({{ item.type }}) -- {{ item.notes }}. Agentless/SNMP, registered disabled by Ansible (zabbix_server.yml, snmp_devices play)."
            groups: >-
              {{
                ([{'groupid': zbx_snmp_metagroup_check.json.result[0].groupid}] if zbx_snmp_metagroup_check.json.result | length > 0
                 else [{'groupid': zbx_snmp_metagroup_create.json.result.groupids[0]}]) +
                ([{'groupid': zbx_snmp_site_group_check.json.result[0].groupid}] if zbx_snmp_site_group_check.json.result | length > 0
                 else [{'groupid': zbx_snmp_site_group_create.json.result.groupids[0]}])
              }}
            templates: >-
              {{
                ([{'templateid': zbx_snmp_template_check.json.result[0].templateid}]
                 if (zbx_snmp_template_name | default('') != ''
                     and zbx_snmp_template_check.json.result | default([]) | length > 0)
                 else [])
              }}
            interfaces:
              - type: 2
                main: 1
                useip: 1
                ip: "{{ item.ip }}"
                dns: ""
                port: "161"
                details:
                  version: 2
                  bulk: 1
                  community: "{{ vault_snmp_read_community }}"
          id: 1
        status_code: 200
      register: zbx_snmp_host_create
      delegate_to: localhost
      become: false
      no_log: true
      when: zbx_snmp_host_check.json.result | length == 0

    - name: "[SNMP devices] FAIL loudly if host.create returned an API-level error"
      ansible.builtin.fail:
        msg: >-
          host.create API error for {{ item.hostname }}:
          {{ zbx_snmp_host_create.json.error.message }} -- {{ zbx_snmp_host_create.json.error.data | default('') }}
      when:
        - zbx_snmp_host_create is defined
        - zbx_snmp_host_create.json is defined
        - zbx_snmp_host_create.json.error is defined

    - name: "[SNMP devices] Registration summary for {{ item.hostname }}"
      ansible.builtin.debug:
        msg: >-
          {{ item.hostname }}: {{ (zbx_snmp_host_check.json.result | length > 0)
             | ternary('Already registered.', 'Newly registered, DISABLED, SNMP interface '
               + item.ip + ':161, template ' + zbx_snmp_template_result + '.') }}
      vars:
        zbx_snmp_template_result: >-
          {{ 'none (no known vendor fit)' if zbx_snmp_template_name | default('') == ''
             else zbx_snmp_template_name if zbx_snmp_template_check.json.result | default([]) | length > 0
             else 'none (' + zbx_snmp_template_name + ' not yet imported)' }}
  rescue:
    - name: "[SNMP devices] WARN -- could not register {{ item.hostname }}"
      ansible.builtin.debug:
        msg: >-
          WARN: Zabbix API registration failed for {{ item.hostname }} ({{ item.ip }}) --
          EXAZABCLD001 unreachable, or a real API-level error. Non-critical, continuing
          with the rest of the device list.
  tags: [zabbix, monitoring, snmp_devices]
