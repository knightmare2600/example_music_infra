---
# =============================================================================
# group_vars/all/vars.yml
# Example Music Limited — Variables common to all managed hosts
# =============================================================================
# Changelog:
#   2026-06-20  Initial file
#   2026-07-09  exa_domain/exa_domain_join_user derived from benarbejde/ad_forest.json
#               (single source of truth for AD forest identity) instead of hardcoded --
#               see ansible/tasks/ad_forest_facts.yml. Jinja here is evaluated lazily by
#               Ansible the first time either var is actually referenced in a task, so no
#               explicit task-file include is needed for group_vars/all to pick this up.
# =============================================================================

# Path to ad_forest.json on the Ansible control node. Mirrors sites_csv_path's
# existing per-consumer default pattern (e.g. group_vars/rudder_servers/main.yml).
ad_forest_json_path: "/etc/example-music/ad_forest.json"

# Binary / asset server
# exa_asset_base / exa_wallpaper_url removed 2026-07-08 -- wallpaper/binaries are win_copy'd
# from windows_bootstrap/playbooks/files/ now, not HTTP-fetched from the provisioning server.
# That pattern only ever existed for the pre-Ansible bootstrap scripts, which had no other way
# to get a file onto a box. exa_wallpaper_dest is just the destination path, still needed.
exa_wallpaper_dest:  'C:\Windows\Web\Wallpaper\ExampleMusic\corporate.png'

# Domain -- see benarbejde/ad_forest.json (single source of truth)
exa_domain:           "{{ (lookup('file', ad_forest_json_path) | from_json).domain_fqdn }}"
exa_domain_join_user: "{{ (lookup('file', ad_forest_json_path) | from_json).netbios_name }}\\Administrator"

# Chocolatey
exa_choco_source:    "https://community.chocolatey.org/api/v2/"

# Screen lock timeout (seconds)
exa_lock_timeout_secs: 3600

# SSH / Ansible
exa_ansible_pub_key: "ssh-rsa  knightmare@ansible"
exa_ansible_key_path: 'C:\ProgramData\ssh\administrators_authorized_keys'

# Fonts
exa_font_files:
  - JetBrainsMonoNerdFont-Regular.ttf
  - JetBrainsMonoNerdFont-Bold.ttf
  - JetBrainsMonoNerdFont-BoldItalic.ttf
  - JetBrainsMonoNerdFont-Italic.ttf
  - JetBrainsMonoNerdFontMono-Regular.ttf
