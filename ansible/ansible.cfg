# =================================================================================================
# Ansible Configuration
#
# Purpose:
#   Central configuration for Example Music infrastructure automation.
#
# Used for:
#   - Initial host onboarding / bootstrap
#   - Inventory-driven configuration management
#   - Ongoing estate administration
#
# Environment assumptions:
#   - Hosts may be powered off at any time
#   - Inventory may be generated dynamically
#   - DNS may not exist during bootstrap
#   - SSH keys are distributed before Ansible runs
#
# Notes:
#   - Unreachable hosts are NOT ignored via ansible.cfg. That behaviour must be configured in
#     playbooks using:
#
#       ignore_unreachable: true
#
#     or handled explicitly with tasks/meta directives.
# =================================================================================================
[defaults]
# Automatically discover correct Python interpreter on remote systems sans warnings.
interpreter_python = auto_silent
host_key_checking  = True

# firewallme's playbook (playbooks/firewallme/playbooks/90-firewall.yml) uses a
# real Ansible role, which lives at playbooks/firewallme/roles/ rather than the
# playbook-relative default (playbooks/firewallme/playbooks/roles/) — it's the
# only role in this repo. Without this, 90-firewall.yml fails with
# "the role 'firewall' was not found".
roles_path = playbooks/firewallme/roles

# Primary inventory location.
# Was two locations (.../inventory + .../configs/inventory) with different,
# incompatible group structures for the same sites -- .../inventory (this
# script's own generator output) never had windows_dc/windows_nodes, while
# .../configs/inventory (windows_dc's hand-curated cld.ini/fal.ini/liv.ini)
# did, so whichever one got loaded silently determined whether DC-specific
# group_vars applied. Consolidated 2026-07-09 -- generate_inventory.py now
# writes directly to configs/inventory/ with the correct group structure;
# .../inventory retired.
inventory = /home/ansible/ansible/configs/inventory

# 2026-09-19 fix: root-caused live (Robert, EXAANSFRD001, ansible-core 2.17.14) via
# delta-debugging (a minimal single-file directory reproduced the same failure as the
# full directory) then confirmed directly with `ansible-config dump | grep
# INVENTORY_IGNORE_EXTS`: this ansible-core's default ignore-extensions list for
# DIRECTORY-based inventory sources includes '.ini' and '.cfg'. Every file under
# configs/inventory/ is named *.ini, so pointing -i at the directory (not a specific
# file) silently skipped every single one, leaving nothing for any plugin to parse --
# "[WARNING]: Unable to parse ... as an inventory source" with an empty result, even
# though each file parses fine when named directly. Reproduced identically on
# ansible-core 2.14.18 and 2.17.14; NOT reproduced on 2.19.4, which evidently ships a
# different default -- meaning this was never a Python-version or file-content issue,
# it silently depended on which ansible-core build happened to be installed. Fixed by
# pinning the ignore list explicitly here (same as the real default, minus .ini/.cfg)
# so directory-based inventory loading works the same on every control node regardless
# of ansible-core version.
inventory_ignore_extensions = .pyc, .pyo, .swp, .bak, ~, .rpm, .md, .txt, .rst, .orig, .retry

# Default SSH user.
remote_user = ansible

# SSH private key used for authentication.
private_key_file   = /home/ansible/ansible/configs/ansible-id_rsa

# Human-readable task output.
callback_plugins   = /home/ansible/ansible/callback_plugins
stdout_callback    = exa_pretty
callback_whitelist = exa_pretty
result_format      = yaml

# Mirror everything Display.display() prints (i.e. every line exa_pretty emits) to a log
# file, colour codes stripped, timestamped, with no plugin code involved -- this is an
# ansible-core feature, not something exa_pretty needs to implement itself. Commented out
# by default: an always-on log silently accumulating on disk (and potentially catching
# secrets alongside -v/-vv/-vvv output) isn't wanted as a standing default. Uncomment to
# make it permanent, or set per-run instead: ANSIBLE_LOG_PATH=/path/to/file.log ansible-playbook ...
# log_path = /var/log/ansible/example-music.log

# Enable callback plugins.
bin_ansible_callbacks = True

# Number of parallel worker processes. Default is 5. Increasing improves performance when managing
# large numbers of hosts.
forks = 50

# SSH connection timeout (seconds). Important when hosts may be powered off. Prevents long waits
# for unreachable systems.
timeout = 5

# Retry files record failed hosts and can be useful for rerunning failed operations. Store them in
# /tmp rather than cluttering working directories.
retry_files_enabled = True
retry_files_save_path = /tmp

# Surpress wall of text for failed SSH while retaining some info (2026-07-09: moved here from
# [ssh_connection] -- these are [defaults]-scope settings (DISPLAY_SKIPPED_HOSTS has no
# connection-plugin equivalent); they were silently inert in that section).
display_skipped_hosts = False
display_failed_stderr = False

# 2026-07-09 fix: forks/timeout/retry_files_enabled/retry_files_save_path used to sit after the
# [callback_exa_pretty] header below, which put them in that section instead of [defaults] --
# confirmed via ansible.config.manager.ConfigManager that all 5 settings above and these two
# were silently using Ansible's built-in defaults (forks=5, timeout=10s, etc.), not the values
# written here, since ansible-core reads ini keys by (section, key), not just by key name.
# ansibleme.sh's own generated ansible.cfg heredoc already had these correctly under [defaults]
# -- only this committed file had drifted, most likely from a hand-edit that inserted the
# [callback_exa_pretty] section in the middle of an existing settings block.

# surpress walls of host unreachable (NB: You MAY wish to switch this to False
# Removing it has the same effect
[callback_exa_pretty]
suppress_unreachable = True
show_unreachable_hosts = False

# Suppress ok/no-change result lines for a quieter run (e.g. demos, or parsing output) --
# skipped lines still show. Off by default; override per-run without editing this file via
# ANSIBLE_EXA_LOW_NOISE=true ansible-playbook ...
# low_noise = True

[privilege_escalation]
# Standard privilege escalation settings.
become = False
become_method = sudo
become_user = root

[ssh_connection]
# SSH connection settings.
#
# ControlMaster=auto                Reuse existing SSH sessions where possible.
# ControlPersist=60s                Keep SSH control connections alive for 60 seconds.
# StrictHostKeyChecking=accept-new  Automatically trust new, while detecting changed fingerprints.
# ServerAliveInterval/CountMax      2026-09-21, found live: a windows_adschema run against
#                                   EXADCSFRD001 hung for 90+ minutes mid-task (364-item loop,
#                                   one microsoft.ad.ou call per user) with the control-node
#                                   ansible-playbook process, its ssh subprocess, AND the
#                                   target's PowerShell module-invocation processes all sitting
#                                   at ~0% CPU -- a dead TCP connection, not a slow loop.
#                                   `connect_timeout` below only bounds establishing a NEW
#                                   connection; nothing previously bounded an
#                                   already-established one going silently dead mid-command
#                                   (e.g. a NAT/firewall dropping an idle mapping on the
#                                   still-being-finalised FRD<->ANS path). Without this, ssh
#                                   falls back to the OS's own TCP keepalive default (2 hours
#                                   on Linux) before ever noticing -- which is almost exactly
#                                   how long this hung before being caught by hand.
#                                   2026-09-21 follow-up, same day: the first cut of this
#                                   (15s probes, dead after 3 missed = 45s) was too aggressive
#                                   for real Windows/WinRM-over-SSH traffic specifically --
#                                   a plain set_fact task (no remote work at all) started dying
#                                   with a bare, contentless "unknown error" result mid-run,
#                                   the signature of the connection itself being torn down
#                                   mid-flight, not a real task failure (confirmed: the exact
#                                   same task succeeded moments earlier against the same,
#                                   already-verified-clean data -- ruled out a data/encoding
#                                   cause first before touching this). This connection type has
#                                   already shown higher latency than plain Linux SSH throughout
#                                   this repo's history. Loosened to 20s probes, dead after 6
#                                   missed (120s) -- still a massive improvement over the 2-hour
#                                   fallback this whole section exists to avoid, but with real
#                                   slack for legitimate latency spikes instead of just the
#                                   fastest number that happened to fix the original hang.
ssh_args = -o ControlMaster=auto -o ControlPersist=60s -o StrictHostKeyChecking=accept-new -o ServerAliveInterval=20 -o ServerAliveCountMax=6

# Enable SSH pipelining. Reduces the number of SSH operations required & can significantly improve
# execution speed.
pipelining = True

# Fail quickly when a host is unavailable.
connect_timeout = 5

[persistent_connection]
# Settings used by persistent SSH connections. Useful for larger environments and network modules.
# Maximum command runtime.
command_timeout = 30

# Time spent retrying persistent connections.
connect_retry_timeout = 15

# =================================================================================================
# RECOMMENDED PLAYBOOK SETTINGS FOR INTERMITTENT HOSTS
# =================================================================================================
#
# Example:
#
# - hosts: all
#   gather_facts: false
#   ignore_unreachable: true
#   strategy: free
#
# Explanation:
#
# gather_facts: false         Avoid immediate failures during fact gathering.
# ignore_unreachable: true    Continue processing remaining hosts even if some nodes are offline.
# strategy: free              Allows hosts to progress independently instead of waiting for the
#                             slowest host.
# =================================================================================================
